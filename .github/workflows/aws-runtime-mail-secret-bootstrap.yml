name: AWS runtime mail recovery

on:
  pull_request:
    paths:
      - 'scripts/aws/recover_mail_config.py'
      - '.github/workflows/aws-runtime-mail-secret-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/aws/recover_mail_config.py'
      - '.github/workflows/aws-runtime-mail-secret-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# The recovery temporarily borrows the same compact inline-policy slot used by
# the background-cron deploy workflow. Sharing its concurrency group prevents
# either workflow from overwriting that slot while the other is using it.
concurrency:
  group: aws-background-cron-runtime-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  EDGE_RUNTIME_FUNCTION: toh-production-edge-runtime
  BACKGROUND_RUNTIME_FUNCTION: toh-production-background-runtime
  EDGE_RUNTIME_SECRET: /theouthaven/production/edge-runtime/env
  EDGE_RUNTIME_SECRET_REGION: us-east-1
  BACKGROUND_APP_ENV_SECRET: /theouthaven/production/platform-dr/app-env
  BACKGROUND_APP_ENV_SECRET_REGION: us-west-2
  INTEGRATION_API_STACK: theouthaven-integration-api-production
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_ORG_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  BOOTSTRAP_POLICY_NAME: TheOutHavenLambdaRecursionConfigBootstrap

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate resolver syntax
        run: python -m py_compile scripts/aws/recover_mail_config.py

      - name: Validate recovery safety contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-runtime-mail-secret-bootstrap.yml'
          for token in \
            'aws-background-cron-runtime-production' \
            '/theouthaven/production/edge-runtime/env' \
            '/theouthaven/production/platform-dr/app-env' \
            'TheOutHavenLambdaRecursionConfigBootstrap' \
            'secretsmanager:PutSecretValue' \
            'Restore exact recursion bootstrap policy' \
            'credential_vault' \
            'MAIL_ENV_REFRESH_TOKEN' \
            'edge_runtime_generation=refreshed' \
            'background_runtime_generation=refreshed' \
            'integration_api_runtime_generation=refreshed' \
            admin-cron-digest-email \
            reservation-daily-digest \
            admin-platform-error-digest \
            admin-search-health-digest \
            admin-daily-marketing-pulse \
            '/api/cron/daily-admin-digest' \
            'job=search-quality-digest' \
            resend_not_configured; do
            grep -F "$token" "$FILE" >/dev/null
          done
          grep -F 'providers.get("resend"' scripts/aws/recover_mail_config.py >/dev/null
          grep -F 'AWS_PLATFORM_JOB_GATEWAY_SECRET' scripts/aws/recover_mail_config.py >/dev/null
          grep -F 'authoritative_resend_source=' scripts/aws/recover_mail_config.py >/dev/null

  recover_and_send:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve authoritative production mail configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

          EDGE_CURRENT="$RUNNER_TEMP/edge-current.json"
          SHARED_CURRENT="$RUNNER_TEMP/shared-current.json"
          VERCEL_ENV_FILE="$RUNNER_TEMP/vercel-production.env"
          EDGE_MERGED="$RUNNER_TEMP/edge-merged.json"
          SHARED_MERGED="$RUNNER_TEMP/shared-merged.json"
          SOURCE_FILE="$RUNNER_TEMP/resend-source.txt"

          aws secretsmanager get-secret-value \
            --region "$EDGE_RUNTIME_SECRET_REGION" \
            --secret-id "$EDGE_RUNTIME_SECRET" \
            --query SecretString \
            --output text > "$EDGE_CURRENT"
          aws secretsmanager get-secret-value \
            --region "$BACKGROUND_APP_ENV_SECRET_REGION" \
            --secret-id "$BACKGROUND_APP_ENV_SECRET" \
            --query SecretString \
            --output text > "$SHARED_CURRENT"
          chmod 600 "$EDGE_CURRENT" "$SHARED_CURRENT"

          : > "$VERCEL_ENV_FILE"
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            mkdir -p .vercel
            jq -n --arg org "$VERCEL_TEAM_ID" --arg project "$VERCEL_PROJECT_ID" '{orgId:$org,projectId:$project}' > .vercel/project.json
            if ! npx --yes vercel@59.3.0 env pull "$VERCEL_ENV_FILE" --environment=production --yes --token "$VERCEL_TOKEN" >/dev/null; then
              echo 'Vercel production environment pull failed; continuing with Credential Vault and existing AWS sources.' >&2
              : > "$VERCEL_ENV_FILE"
            fi
          fi
          chmod 600 "$VERCEL_ENV_FILE"

          python scripts/aws/recover_mail_config.py \
            --vercel-env "$VERCEL_ENV_FILE" \
            --edge-current "$EDGE_CURRENT" \
            --shared-current "$SHARED_CURRENT" \
            --edge-output "$EDGE_MERGED" \
            --shared-output "$SHARED_MERGED" \
            --source-output "$SOURCE_FILE"
          chmod 600 "$EDGE_MERGED" "$SHARED_MERGED" "$SOURCE_FILE"
          RESEND_KEY="$(jq -r '.RESEND_API_KEY // empty' "$EDGE_MERGED")"
          test -n "$RESEND_KEY"
          echo "::add-mask::$RESEND_KEY"
          test "$(cat "$SOURCE_FILE")" != ''
          rm -f "$VERCEL_ENV_FILE"

      - name: Temporarily grant runtime secret write permission
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          ORIGINAL_POLICY="$RUNNER_TEMP/original-recursion-bootstrap.json"
          TEMP_POLICY="$RUNNER_TEMP/mail-secret-write-bootstrap.json"

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$BOOTSTRAP_POLICY_NAME" \
            --query PolicyDocument \
            --output json > "$ORIGINAL_POLICY"
          chmod 600 "$ORIGINAL_POLICY"
          grep -F 'lambda:GetFunctionRecursionConfig' "$ORIGINAL_POLICY" >/dev/null
          grep -F 'lambda:PutFunctionRecursionConfig' "$ORIGINAL_POLICY" >/dev/null

          cat > "$TEMP_POLICY" <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"secretsmanager:PutSecretValue","Resource":"*"}]}
          JSON
          test "$(wc -c < "$TEMP_POLICY")" -lt 160
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$BOOTSTRAP_POLICY_NAME" \
            --policy-document "file://$TEMP_POLICY"
          sleep 8
          LIVE_POLICY="$RUNNER_TEMP/live-mail-write-policy.json"
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$BOOTSTRAP_POLICY_NAME" \
            --query PolicyDocument \
            --output json > "$LIVE_POLICY"
          grep -F 'secretsmanager:PutSecretValue' "$LIVE_POLICY" >/dev/null
          rm -f "$TEMP_POLICY" "$LIVE_POLICY"
          echo 'temporary_mail_secret_write_permission=ready'

      - name: Synchronize Edge and shared AWS mail secrets
        run: |
          set -euo pipefail
          EDGE_MERGED="$RUNNER_TEMP/edge-merged.json"
          SHARED_MERGED="$RUNNER_TEMP/shared-merged.json"
          test -s "$EDGE_MERGED" && test -s "$SHARED_MERGED"

          aws secretsmanager put-secret-value \
            --region "$EDGE_RUNTIME_SECRET_REGION" \
            --secret-id "$EDGE_RUNTIME_SECRET" \
            --secret-string "file://$EDGE_MERGED" \
            --query VersionId \
            --output text >/dev/null
          echo 'edge_runtime_mail_secret=synchronized'

          aws secretsmanager put-secret-value \
            --region "$BACKGROUND_APP_ENV_SECRET_REGION" \
            --secret-id "$BACKGROUND_APP_ENV_SECRET" \
            --secret-string "file://$SHARED_MERGED" \
            --query VersionId \
            --output text >/dev/null
          echo 'shared_app_env_mail_secret=synchronized'

      - name: Restore exact recursion bootstrap policy
        if: always()
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          ORIGINAL_POLICY="$RUNNER_TEMP/original-recursion-bootstrap.json"
          if [ ! -s "$ORIGINAL_POLICY" ]; then
            echo 'No bootstrap policy swap occurred; nothing to restore.'
            exit 0
          fi
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$BOOTSTRAP_POLICY_NAME" \
            --policy-document "file://$ORIGINAL_POLICY"
          sleep 8
          RESTORED="$RUNNER_TEMP/restored-recursion-bootstrap.json"
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$BOOTSTRAP_POLICY_NAME" \
            --query PolicyDocument \
            --output json > "$RESTORED"
          grep -F 'lambda:GetFunctionRecursionConfig' "$RESTORED" >/dev/null
          grep -F 'lambda:PutFunctionRecursionConfig' "$RESTORED" >/dev/null
          rm -f "$ORIGINAL_POLICY" "$RESTORED"
          echo 'recursion_bootstrap_policy=restored'

      - name: Refresh Edge, background, and Integration API secret consumers
        run: |
          set -euo pipefail
          refresh_function() {
            local fn="$1" label="$2"
            local vars="$RUNNER_TEMP/${label}-vars.json"
            local envdoc="$RUNNER_TEMP/${label}-env.json"
            aws lambda get-function-configuration --region "$AWS_REGION" --function-name "$fn" --query 'Environment.Variables' --output json > "$vars"
            jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${label}" '{Variables:(. + {MAIL_ENV_REFRESH_TOKEN:$token})}' "$vars" > "$envdoc"
            aws lambda update-function-configuration --region "$AWS_REGION" --function-name "$fn" --environment "file://$envdoc" >/dev/null
            aws lambda wait function-updated-v2 --region "$AWS_REGION" --function-name "$fn"
            rm -f "$vars" "$envdoc"
            echo "${label}_runtime_generation=refreshed"
          }

          INTEGRATION_API_FUNCTION="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$INTEGRATION_API_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiFunctionName'].OutputValue" \
            --output text)"
          test -n "$INTEGRATION_API_FUNCTION" && test "$INTEGRATION_API_FUNCTION" != 'None'
          refresh_function "$EDGE_RUNTIME_FUNCTION" edge
          refresh_function "$BACKGROUND_RUNTIME_FUNCTION" background
          refresh_function "$INTEGRATION_API_FUNCTION" integration_api

      - name: Prove both runtime mail secrets without exposing values
        run: |
          set -euo pipefail
          EDGE_PROOF="$RUNNER_TEMP/edge-proof.json"
          SHARED_PROOF="$RUNNER_TEMP/shared-proof.json"
          aws secretsmanager get-secret-value --region "$EDGE_RUNTIME_SECRET_REGION" --secret-id "$EDGE_RUNTIME_SECRET" --query SecretString --output text > "$EDGE_PROOF"
          aws secretsmanager get-secret-value --region "$BACKGROUND_APP_ENV_SECRET_REGION" --secret-id "$BACKGROUND_APP_ENV_SECRET" --query SecretString --output text > "$SHARED_PROOF"
          EDGE_PROOF="$EDGE_PROOF" SHARED_PROOF="$SHARED_PROOF" python <<'PY'
          import json, os
          from pathlib import Path
          edge = json.loads(Path(os.environ['EDGE_PROOF']).read_text())
          shared = json.loads(Path(os.environ['SHARED_PROOF']).read_text())
          for label, value in [('edge', edge), ('shared', shared)]:
              key = value.get('RESEND_API_KEY', '') if isinstance(value, dict) else ''
              if not isinstance(key, str) or len(key) < 16:
                  raise SystemExit(f'{label} runtime lacks a valid Resend key')
          if edge.get('RESEND_API_KEY') != shared.get('RESEND_API_KEY'):
              raise SystemExit('Edge and shared runtime Resend keys are not in parity')
          if not any(edge.get(k) for k in ('ADMIN_CRON_DIGEST_EMAIL','ADMIN_EMAIL','SUPERADMIN_EMAIL','ADMIN_ALERT_EMAIL')):
              raise SystemExit('Edge runtime lacks an admin digest recipient')
          if not any(shared.get(k) for k in ('ADMIN_DIGEST_EMAIL','THEOUTHAVEN_ADMIN_EMAIL','SUPERADMIN_EMAIL')):
              raise SystemExit('Shared runtime lacks an admin digest recipient')
          PY
          rm -f "$EDGE_PROOF" "$SHARED_PROOF" "$RUNNER_TEMP/edge-merged.json" "$RUNNER_TEMP/shared-merged.json"
          echo 'runtime_mail_secret_parity=ready'

      - name: Replay missed Edge daily emails
        run: |
          set -euo pipefail
          invoke_edge() {
            local fn="$1" body="$2"
            local event="$RUNNER_TEMP/${fn}-event.json"
            local response="$RUNNER_TEMP/${fn}-response.json"
            FN="$fn" BODY="$body" EVENT="$event" python <<'PY'
          import json, os, time
          fn = os.environ['FN']
          body = json.loads(os.environ['BODY'])
          path = f'/functions/v1/{fn}'
          event = {
            'version':'2.0','routeKey':f'POST {path}','rawPath':path,'rawQueryString':'',
            'headers':{'content-type':'application/json','x-toh-aws-internal':'eventbridge'},
            'requestContext':{'accountId':'email-recovery','apiId':'email-recovery','domainName':'internal','domainPrefix':'internal',
              'http':{'method':'POST','path':path,'protocol':'HTTP/1.1','sourceIp':'127.0.0.1','userAgent':'github-actions'},
              'requestId':f'email-recovery-{fn}','routeKey':f'POST {path}','stage':'$default','time':'03/Sep/2026:16:00:00 +0000','timeEpoch':int(time.time()*1000)},
            'body':json.dumps(body,separators=(',',':')),'isBase64Encoded':False,
          }
          open(os.environ['EVENT'],'w').write(json.dumps(event,separators=(',',':')))
          PY
            aws lambda invoke --region "$AWS_REGION" --function-name "$EDGE_RUNTIME_FUNCTION" --cli-binary-format raw-in-base64-out --payload "fileb://$event" "$response" >/dev/null
            jq -e '.statusCode >= 200 and .statusCode < 300' "$response" >/dev/null
            jq -e '(.body | fromjson | (.success // true) != false)' "$response" >/dev/null
            ! jq -e '(.body | fromjson | tostring | contains("resend_not_configured"))' "$response" >/dev/null
            ! jq -e '(.body | fromjson | .. | objects | select((has("sent") and .sent == false) or (has("emailSent") and .emailSent == false)))' "$response" >/dev/null
            echo "email_replay=${fn}:passed"
          }
          invoke_edge 'admin-cron-digest-email' '{"source":"cron","hours":24,"force":true}'
          invoke_edge 'reservation-daily-digest' '{"source":"cron","force":true}'
          invoke_edge 'admin-platform-error-digest' '{"source":"cron","hours":24,"force":true}'
          invoke_edge 'admin-search-health-digest' '{"source":"cron","hours":24,"force":true}'
          invoke_edge 'admin-daily-marketing-pulse' '{"source":"cron","hours":24,"force":true}'

      - name: Replay missed background daily emails
        run: |
          set -euo pipefail
          SECRET_FILE="$RUNNER_TEMP/background-secret.json"
          aws secretsmanager get-secret-value --region "$BACKGROUND_APP_ENV_SECRET_REGION" --secret-id "$BACKGROUND_APP_ENV_SECRET" --query SecretString --output text > "$SECRET_FILE"
          CRON_SECRET="$(jq -r '.CRON_SECRET // empty' "$SECRET_FILE")"
          rm -f "$SECRET_FILE"
          test -n "$CRON_SECRET"
          echo "::add-mask::$CRON_SECRET"

          invoke_background() {
            local label="$1" path="$2" query="$3" method="$4"
            local event="$RUNNER_TEMP/${label}-event.json"
            local response="$RUNNER_TEMP/${label}-response.json"
            LABEL="$label" PATH_VALUE="$path" QUERY_VALUE="$query" METHOD_VALUE="$method" CRON_VALUE="$CRON_SECRET" EVENT="$event" python <<'PY'
          import json, os, time
          path, query, method = os.environ['PATH_VALUE'], os.environ['QUERY_VALUE'], os.environ['METHOD_VALUE']
          secret = os.environ['CRON_VALUE']
          event = {
            'version':'2.0','routeKey':f'{method} {path}','rawPath':path,'rawQueryString':query,
            'headers':{'content-type':'application/json','authorization':f'Bearer {secret}','x-cron-secret':secret,'x-toh-aws-internal':'eventbridge'},
            'requestContext':{'accountId':'email-recovery','apiId':'email-recovery','domainName':'internal','domainPrefix':'internal',
              'http':{'method':method,'path':path,'protocol':'HTTP/1.1','sourceIp':'127.0.0.1','userAgent':'github-actions'},
              'requestId':f"email-recovery-{os.environ['LABEL']}",'routeKey':f'{method} {path}','stage':'$default','time':'03/Sep/2026:16:00:00 +0000','timeEpoch':int(time.time()*1000)},
            'isBase64Encoded':False,
          }
          open(os.environ['EVENT'],'w').write(json.dumps(event,separators=(',',':')))
          PY
            aws lambda invoke --region "$AWS_REGION" --function-name "$BACKGROUND_RUNTIME_FUNCTION" --cli-binary-format raw-in-base64-out --payload "fileb://$event" "$response" >/dev/null
            jq -e '.statusCode >= 200 and .statusCode < 300' "$response" >/dev/null
            jq -e '(.body | fromjson | (.success // true) != false)' "$response" >/dev/null
            ! jq -e '(.body | fromjson | tostring | contains("resend_not_configured"))' "$response" >/dev/null
            ! jq -e '(.body | fromjson | .. | objects | select((has("sent") and .sent == false) or (has("emailSent") and .emailSent == false)))' "$response" >/dev/null
            echo "email_replay=${label}:passed"
          }
          invoke_background 'daily-admin-digest' '/api/cron/daily-admin-digest' '' 'GET'
          invoke_background 'search-quality-digest' '/api/cron/managed' 'job=search-quality-digest' 'GET'

      - name: Recovery summary
        if: success()
        run: |
          SOURCE="$(cat "$RUNNER_TEMP/resend-source.txt")"
          {
            echo '### AWS runtime mail recovery'
            echo ''
            echo "- Resend credential source: \`$SOURCE\` (value never logged)."
            echo '- Synchronized mail configuration into both the AWS Edge runtime secret and shared app-environment secret.'
            echo '- Restored the exact Lambda recursion bootstrap IAM policy after the temporary secret-write window.'
            echo '- Refreshed Edge, background, and Integration API Lambda generations to clear cached secret state.'
            echo '- Replayed five Edge daily reports and two background daily reports.'
            echo '- Replay failed closed on any Resend/configuration or sent=false result.'
          } >> "$GITHUB_STEP_SUMMARY"
