name: AWS cron batch 12

on:
  pull_request:
    paths:
      - 'infra/aws/edge-runtime/schedules.json'
      - 'infra/aws/edge-runtime/staged-schedules.json'
      - 'infra/aws/edge-runtime/activation.json'
      - 'vercel.json'
      - 'scripts/validate-cron-batch11.mjs'
      - 'scripts/validate-cron-batch12.mjs'
      - '.github/workflows/aws-cron-batch12.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-cron-batch12-preflight
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  BACKGROUND_CRON_STACK: theouthaven-background-cron-production
  EDGE_STACK_NAME: theouthaven-edge-runtime-production

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      is_current: ${{ steps.batch_state.outputs.is_current }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect whether Batch 12 is the current activation
        id: batch_state
        run: |
          set -euo pipefail
          if [ "$(jq -r '.batch' infra/aws/edge-runtime/activation.json)" = '12' ]; then
            echo 'is_current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Batch 11 regression contract
        run: node scripts/validate-cron-batch11.mjs
      - name: Validate Batch 12 scheduler contract
        run: node scripts/validate-cron-batch12.mjs
      - name: Validate durable completion gate
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-cron-batch12.yml'
          grep -F 'function:"sqs:background-cron"' "$FILE" >/dev/null
          grep -F -- '--function-name "$INVOKER"' "$FILE" >/dev/null
          grep -F 'aws logs filter-log-events' "$FILE" >/dev/null
          grep -F -- '--limit 1' "$FILE" >/dev/null
          grep -F 'FILTER_PATTERN="{ \$.messageId = \"$MESSAGE_ID\" }"' "$FILE" >/dev/null
          grep -F 'classify_worker_failure' "$FILE" >/dev/null
          grep -F 'background_cron_completed' "$FILE" >/dev/null
          grep -F 'background_cron_failed' "$FILE" >/dev/null
          grep -F 'MaximumConcurrency' "$FILE" >/dev/null
          grep -F 'body.target // empty' "$FILE" >/dev/null
          ! grep -F 'aws lambda invoke --function-name "$WORKER"' "$FILE" >/dev/null
          jq -e '[.[] | select(.name == "curated-location-discovery-restaurant" or .name == "curated-location-discovery-activity" or .name == "event-provider-ingestion" or .name == "crm-commercial" or .name == "marketing-reminders" or .name == "marketing-content-opportunities" or .name == "marketing-social-metrics" or .name == "marketing-attribution" or .name == "website-dr-readiness" or .name == "stripe-connect-status-sync") | select(.function == "sqs:background-cron")] | length == 10' infra/aws/edge-runtime/schedules.json >/dev/null
          jq -e '.[] | select(.name == "event-provider-ingestion") | .body.target == "/api/cron/event-provider-ingestion/aws"' infra/aws/edge-runtime/schedules.json >/dev/null
          jq -e '.[] | select(.name == "marketing-social-metrics") | .body.target == "/api/cron/marketing-social-metrics/aws"' infra/aws/edge-runtime/schedules.json >/dev/null
          jq -e '.[] | select(.name == "website-dr-readiness") | .body.target == "/api/cron/website-dr-readiness/aws"' infra/aws/edge-runtime/schedules.json >/dev/null

  preflight:
    needs: validate
    if: needs.validate.outputs.is_current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve durable runtime and verify queue state
        id: runtime
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          STATUS="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_CRON_STACK" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [ "$STATUS" != 'CREATE_COMPLETE' ] && [ "$STATUS" != 'UPDATE_COMPLETE' ]; then
            echo "Durable background cron stack is not ready: ${STATUS:-missing}" >&2
            exit 1
          fi
          WORKER="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_CRON_STACK" --query "Stacks[0].Outputs[?OutputKey=='BackgroundCronWorkerFunctionName'].OutputValue" --output text)"
          QUEUE_URL="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_CRON_STACK" --query "Stacks[0].Outputs[?OutputKey=='BackgroundCronQueueUrl'].OutputValue" --output text)"
          INVOKER="$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$WORKER" && test "$WORKER" != 'None'
          test -n "$QUEUE_URL" && test "$QUEUE_URL" != 'None'
          test -n "$INVOKER" && test "$INVOKER" != 'None'
          aws lambda get-function --function-name "$WORKER" >/dev/null
          aws lambda get-function --function-name "$INVOKER" >/dev/null
          aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names QueueArn RedrivePolicy VisibilityTimeout ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible >/dev/null
          STATE="$(aws lambda list-event-source-mappings --function-name "$WORKER" --query 'EventSourceMappings[0].State' --output text)"
          test "$STATE" = 'Enabled'
          MAX_CONCURRENCY="$(aws lambda list-event-source-mappings --function-name "$WORKER" --query 'EventSourceMappings[0].ScalingConfig.MaximumConcurrency' --output text)"
          test "$MAX_CONCURRENCY" = '3'
          LOG_GROUP="/aws/lambda/${WORKER}"
          aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --query 'logGroups[?logGroupName==`'"$LOG_GROUP"'`].logGroupName' --output text | grep -Fx "$LOG_GROUP" >/dev/null
          TEST_START_MS="$(( $(date +%s%3N) - 1000 ))"
          aws logs filter-log-events --log-group-name "$LOG_GROUP" --start-time "$TEST_START_MS" --limit 1 >/dev/null
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"
          echo "invoker=$INVOKER" >> "$GITHUB_OUTPUT"
          echo "queue_url=$QUEUE_URL" >> "$GITHUB_OUTPUT"
          echo "log_group=$LOG_GROUP" >> "$GITHUB_OUTPUT"

      - name: Enqueue and verify all ten jobs through production SQS path
        env:
          INVOKER: ${{ steps.runtime.outputs.invoker }}
          QUEUE_URL: ${{ steps.runtime.outputs.queue_url }}
          LOG_GROUP: ${{ steps.runtime.outputs.log_group }}
        run: |
          set -euo pipefail
          MAPPING="$RUNNER_TEMP/batch12-message-map.txt"
          RESULTS="$RUNNER_TEMP/batch12-results.txt"
          : > "$MAPPING"
          : > "$RESULTS"
          START_MS="$(( $(date +%s%3N) - 5000 ))"

          classify_worker_failure() {
            MESSAGE="$1"
            ERROR_TYPE="$(printf '%s\n' "$MESSAGE" | grep -oE '"errorType":"[^"]+"' | head -1 | cut -d'"' -f4 || true)"
            HTTP_FAMILY="$(printf '%s\n' "$MESSAGE" | grep -oE 'background_cron_http_[0-9]{3}' | head -1 || true)"
            if [ -n "$HTTP_FAMILY" ]; then
              printf '%s:%s' "${ERROR_TYPE:-RuntimeError}" "$HTTP_FAMILY"
            elif printf '%s\n' "$MESSAGE" | grep -Fq 'background_runtime_lambda_error'; then
              printf '%s:background_runtime_lambda_error' "${ERROR_TYPE:-RuntimeError}"
            elif printf '%s\n' "$MESSAGE" | grep -Fq 'background_cron_declared_failure'; then
              printf '%s:background_cron_declared_failure' "${ERROR_TYPE:-RuntimeError}"
            elif printf '%s\n' "$MESSAGE" | grep -Fq 'background_app_environment_missing_cron_secret'; then
              printf '%s:missing_cron_secret' "${ERROR_TYPE:-RuntimeError}"
            elif printf '%s\n' "$MESSAGE" | grep -Fq 'unsupported_background_cron'; then
              printf '%s:unsupported_background_cron' "${ERROR_TYPE:-ValueError}"
            elif printf '%s\n' "$MESSAGE" | grep -Fq 'background_cron_target_not_allowed'; then
              printf '%s:target_not_allowed' "${ERROR_TYPE:-ValueError}"
            elif printf '%s\n' "$MESSAGE" | grep -Fq 'Invalid API key'; then
              printf '%s:supabase_invalid_api_key' "${ERROR_TYPE:-RuntimeError}"
            else
              printf '%s:unclassified_worker_failure' "${ERROR_TYPE:-unknown}"
            fi
          }

          enqueue() {
            NAME="$1"
            TARGET="$(jq -r --arg name "$NAME" '.[] | select(.name == $name) | .body.target // empty' infra/aws/edge-runtime/schedules.json)"
            test -n "$TARGET"
            REQUEST="$RUNNER_TEMP/${NAME}-enqueue.json"
            RESPONSE="$RUNNER_TEMP/${NAME}-enqueue-response.json"
            META="$RUNNER_TEMP/${NAME}-enqueue-meta.json"
            jq -nc --arg target "$TARGET" '{function:"sqs:background-cron",body:{target:$target,payload:{}}}' > "$REQUEST"
            aws lambda invoke \
              --function-name "$INVOKER" \
              --cli-binary-format raw-in-base64-out \
              --payload "fileb://$REQUEST" \
              "$RESPONSE" > "$META"
            test "$(jq -r '.FunctionError // empty' "$META")" = ''
            jq -e '.ok == true and .runtime == "sqs" and .queue == "background-cron" and (.messageId | type == "string" and length > 0)' "$RESPONSE" >/dev/null
            MESSAGE_ID="$(jq -r '.messageId' "$RESPONSE")"
            printf '%s|%s\n' "$NAME" "$MESSAGE_ID" >> "$MAPPING"
            echo "ENQUEUED $NAME"
          }

          for NAME in \
            curated-location-discovery-restaurant \
            curated-location-discovery-activity \
            event-provider-ingestion \
            crm-commercial \
            marketing-reminders \
            marketing-content-opportunities \
            marketing-social-metrics \
            marketing-attribution \
            website-dr-readiness \
            stripe-connect-status-sync; do
            enqueue "$NAME"
          done

          DEADLINE="$(( $(date +%s) + 420 ))"
          while [ "$(wc -l < "$RESULTS" | tr -d ' ')" -lt 10 ] && [ "$(date +%s)" -lt "$DEADLINE" ]; do
            while IFS='|' read -r NAME MESSAGE_ID; do
              if awk -F'|' -v name="$NAME" '$1 == name { found=1 } END { exit !found }' "$RESULTS"; then
                continue
              fi

              FILTER_PATTERN="{ \$.messageId = \"$MESSAGE_ID\" }"
              MESSAGES="$(aws logs filter-log-events \
                --log-group-name "$LOG_GROUP" \
                --start-time "$START_MS" \
                --filter-pattern "$FILTER_PATTERN" \
                --query 'events[].message' \
                --output text)"

              if printf '%s\n' "$MESSAGES" | grep -F "$MESSAGE_ID" | grep -Fq '"event":"background_cron_failed"'; then
                printf '%s|FAIL\n' "$NAME" >> "$RESULTS"
                REASON="$(classify_worker_failure "$MESSAGES")"
                echo "FAIL $NAME $REASON"
              elif printf '%s\n' "$MESSAGES" | grep -F "$MESSAGE_ID" | grep -Fq '"event":"background_cron_completed"'; then
                printf '%s|PASS\n' "$NAME" >> "$RESULTS"
                echo "PASS $NAME"
              fi
            done < "$MAPPING"

            if [ "$(wc -l < "$RESULTS" | tr -d ' ')" -lt 10 ]; then
              sleep 5
            fi
          done

          while IFS='|' read -r NAME MESSAGE_ID; do
            if ! awk -F'|' -v name="$NAME" '$1 == name { found=1 } END { exit !found }' "$RESULTS"; then
              printf '%s|FAIL\n' "$NAME" >> "$RESULTS"
              echo "FAIL $NAME completion_timeout"
            fi
          done < "$MAPPING"

          PASS_COUNT="$(awk -F'|' '$2 == "PASS" { count++ } END { print count + 0 }' "$RESULTS")"
          FAIL_COUNT="$(awk -F'|' '$2 == "FAIL" { count++ } END { print count + 0 }' "$RESULTS")"
          echo "batch12_durable_passed=$PASS_COUNT"
          echo "batch12_durable_failed=$FAIL_COUNT"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo 'batch12_durable_failing_jobs:'
            awk -F'|' '$2 == "FAIL" { print $1 }' "$RESULTS" | sort
          fi
          test "$PASS_COUNT" = '10'
          test "$FAIL_COUNT" = '0'

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/batch12-message-map.txt" "$RUNNER_TEMP/batch12-results.txt" "$RUNNER_TEMP"/*-enqueue.json "$RUNNER_TEMP"/*-enqueue-response.json "$RUNNER_TEMP"/*-enqueue-meta.json
