AWSTemplateFormatVersion: '2010-09-09'
Description: TheOutHaven AWS-owned automatic platform job gateway credential rotation scheduler.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  GitHubRepository:
    Type: String
    Default: DevSoft-Development/roseout
  RotationScheduleExpression:
    Type: String
    Default: cron(0 12 1 * ? *)
    Description: EventBridge Scheduler expression for automatic credential rotation.
  PlatformAlertsTopicArn:
    Type: String
    Default: ''

Conditions:
  HasAlertsTopic: !Not [!Equals [!Ref PlatformAlertsTopicArn, '']]

Resources:
  RotationDispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenCredentialRotationDispatcher-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: credential-rotation-dispatcher
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/toh-${Environment}-credential-rotation-dispatcher:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/theouthaven/credential-vault/${Environment}/github-*
      Tags:
        - Key: Project
          Value: TheOutHaven
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: CredentialRotation

  RotationDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/toh-${Environment}-credential-rotation-dispatcher
      RetentionInDays: 30

  RotationDispatcherFunction:
    Type: AWS::Lambda::Function
    DependsOn: RotationDispatcherLogGroup
    Properties:
      FunctionName: !Sub toh-${Environment}-credential-rotation-dispatcher
      Description: Dispatches the guarded GitHub credential-rotation controller from AWS Scheduler.
      Role: !GetAtt RotationDispatcherRole.Arn
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 20
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          GITHUB_SECRET_ID: !Sub /theouthaven/credential-vault/${Environment}/github
          GITHUB_REPOSITORY: !Ref GitHubRepository
          EVENT_TYPE: platform-job-gateway-rotate
      Code:
        ZipFile: |
          import json
          def handler(event, context):
              raise RuntimeError('credential_rotation_dispatcher_code_not_deployed')
      Tags:
        - Key: Project
          Value: TheOutHaven
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: CredentialRotation

  RotationSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenCredentialRotationScheduler-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-credential-rotation-dispatcher
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RotationDispatcherFunction.Arn
      Tags:
        - Key: Project
          Value: TheOutHaven
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: CredentialRotation

  RotationSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub toh-${Environment}-platform-job-gateway-rotation
      Description: AWS-owned automatic rotation schedule for the internal platform job gateway HMAC key.
      ScheduleExpression: !Ref RotationScheduleExpression
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt RotationDispatcherFunction.Arn
        RoleArn: !GetAtt RotationSchedulerRole.Arn
        Input: '{"source":"aws-scheduler"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3

  RotationDispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-credential-rotation-dispatch-errors
      AlarmDescription: Automatic platform credential rotation dispatch failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RotationDispatcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertsTopic
        - [!Ref PlatformAlertsTopicArn]
        - !Ref AWS::NoValue

Outputs:
  RotationDispatcherFunctionName:
    Value: !Ref RotationDispatcherFunction
  RotationScheduleName:
    Value: !Ref RotationSchedule
  RotationScheduleExpression:
    Value: !Ref RotationScheduleExpression
