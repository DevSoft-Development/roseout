name: Supabase Admin auth redirect

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/app/auth/admin/start/route.ts'
      - 'apps/admin/app/auth/admin/callback/route.ts'
      - '.github/workflows/supabase-admin-auth-redirect.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/supabase-admin-auth-redirect.yml'

permissions:
  contents: read
  id-token: write

env:
  EAST_PRIMARY_SUPABASE_REF: ftdsltatyqhtllyyefzp
  WEST_OREGON_SUPABASE_REF: hnhbzynoyrhjndefbwkh
  ADMIN_CALLBACK_URL: https://admin.theouthaven.com/auth/admin/callback
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  VAULT_SECRET_ID: /theouthaven/credential-vault/production/supabase

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce vault-only token source
        run: |
          set -euo pipefail
          grep -F 'managementAccessToken' .github/workflows/supabase-admin-auth-redirect.yml >/dev/null
          grep -F 'configure-aws-credentials@' .github/workflows/supabase-admin-auth-redirect.yml >/dev/null
          if grep -Eq '^[[:space:]]+SUPABASE_ACCESS_TOKEN:.*secrets[.]' .github/workflows/supabase-admin-auth-redirect.yml; then
            echo 'Direct GitHub Supabase tokens are forbidden; use Credential Vault.' >&2
            exit 1
          fi
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary AWS vault access
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Load Supabase management token from Credential Vault
        run: |
          set -euo pipefail
          umask 077
          aws secretsmanager get-secret-value \
            --secret-id "$VAULT_SECRET_ID" \
            --query SecretString --output text > "$RUNNER_TEMP/supabase-vault.json"
          python3 - "$RUNNER_TEMP/supabase-vault.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          source, env_file = sys.argv[1:]
          with open(source, encoding="utf-8") as f:
              values = json.load(f)
          token = values.get("managementAccessToken")
          if not isinstance(token, str) or not token.strip():
              raise SystemExit("Supabase managementAccessToken missing in production Credential Vault")
          token = token.strip()
          if "\n" in token or "\r" in token:
              raise SystemExit("Invalid multiline Supabase management token")
          print("::add-mask::" + token)
          with open(env_file, "a", encoding="utf-8") as f:
              f.write("SUPABASE_ACCESS_TOKEN=" + token + "\n")
          PY
          rm -f "$RUNNER_TEMP/supabase-vault.json"

      - name: Add Admin callback to Auth redirect allowlists
        run: |
          set -euo pipefail

          for ref in "$EAST_PRIMARY_SUPABASE_REF" "$WEST_OREGON_SUPABASE_REF"; do
            current="$RUNNER_TEMP/auth-${ref}.json"
            payload="$RUNNER_TEMP/auth-${ref}-patch.json"

            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${ref}/config/auth" \
              > "$current"

            python3 - "$current" "$payload" "$ADMIN_CALLBACK_URL" <<'PY'
          import json, sys
          source, destination, required = sys.argv[1:4]
          config = json.load(open(source, encoding="utf-8"))
          raw = str(config.get("uri_allow_list") or "")
          urls = [item.strip() for item in raw.split(",") if item.strip()]
          if required not in urls:
              urls.append(required)
          with open(destination, "w", encoding="utf-8") as handle:
              json.dump({"uri_allow_list": ",".join(urls)}, handle)
          PY

            curl --fail --silent --show-error --request PATCH \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$payload" \
              "https://api.supabase.com/v1/projects/${ref}/config/auth" \
              >/dev/null

            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${ref}/config/auth" \
              > "$current"

            python3 - "$current" "$ADMIN_CALLBACK_URL" <<'PY'
          import json, sys
          source, required = sys.argv[1:3]
          config = json.load(open(source, encoding="utf-8"))
          urls = [item.strip() for item in str(config.get("uri_allow_list") or "").split(",") if item.strip()]
          if required not in urls:
              raise SystemExit("Admin callback is missing from Supabase Auth redirect allowlist")
          PY
          done

          echo "Admin callback is present in East primary and West/Oregon DR Supabase Auth redirect allowlists."

      - name: Remove temporary Auth config files
        if: always()
        run: rm -f "$RUNNER_TEMP"/auth-*.json "$RUNNER_TEMP/supabase-vault.json"
