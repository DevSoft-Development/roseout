name: Diagnose Search Quality

on:
  push:
    branches:
      - fix/search-v2-intelligence-1-7

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture quality regression output
        id: quality
        shell: bash
        run: |
          set +e
          npm run test:search-quality > /tmp/search-quality.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 120 /tmp/search-quality.log > /tmp/search-quality-tail.log
          exit 0
      - name: Comment diagnostic output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Temporary diagnostic from `npm run test:search-quality`:'
            echo
            echo '```text'
            cat /tmp/search-quality-tail.log
            echo '```'
            echo
            echo "Exit status: ${{ steps.quality.outputs.status }}"
          } > /tmp/comment.md
          gh pr comment 1931 --body-file /tmp/comment.md
