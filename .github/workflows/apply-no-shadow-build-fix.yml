name: Apply no-shadow production build fix

on:
  push:
    branches:
      - fix/hf-no-shadow-production-build

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply no-shadow production build fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hf-no-shadow-production-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove remaining HF shadow semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/search/v2/retrieval/retrieveCandidates.ts',
              'trace.decisions.push({ stage: "hf_semantic_candidates", decision: hfSemantic.mode === "enabled" ? "included_before_scoring" : hfSemantic.mode === "shadow" ? "observed_not_served" : "disabled", reason: JSON.stringify({ count: hfSemantic.candidateCount, totalMs: hfSemantic.totalMs, error: hfSemantic.error }) });',
              'trace.decisions.push({ stage: "hf_semantic_candidates", decision: hfSemantic.mode === "enabled" ? "included_before_scoring" : "disabled", reason: JSON.stringify({ count: hfSemantic.candidateCount, totalMs: hfSemantic.totalMs, error: hfSemantic.error }) });',
          )
          replace_once(
              'lib/search/v2/retrieval/retrieveHfSemanticRows.ts',
              'trace.decisions.push({ stage: "hf_semantic_retrieval", decision: mode === "enabled" ? "hf_candidates_enabled" : "hf_candidates_shadowed", reason: JSON.stringify({ mode, candidateCount, foodIntent, menuMode: runtimeConfig.menuMode, menuCandidateCount: menuByLocation.size, embeddingMs, databaseMs, totalMs, modelVersion: runtimeConfig.embeddingVersion }) });',
              'trace.decisions.push({ stage: "hf_semantic_retrieval", decision: "hf_candidates_enabled", reason: JSON.stringify({ mode, candidateCount, foodIntent, menuMode: runtimeConfig.menuMode, menuCandidateCount: menuByLocation.size, embeddingMs, databaseMs, totalMs, modelVersion: runtimeConfig.embeddingVersion }) });',
          )
          replace_once(
              'lib/search/v2/scoring/applyHfPersonalization.ts',
              'decision: config.personalizationMode === "enabled" ? "bounded_preference_boost_applied" : "preference_boost_shadowed",',
              'decision: "bounded_preference_boost_applied",',
          )
          replace_once(
              'lib/search/v2/scoring/applyHfReranking.ts',
              'decision: mode === "enabled" ? "hf_rerank_enabled" : "hf_rerank_shadowed",',
              'decision: "hf_rerank_enabled",',
          )

          focused = [
              Path('lib/search/v2/retrieval/retrieveCandidates.ts'),
              Path('lib/search/v2/retrieval/retrieveHfSemanticRows.ts'),
              Path('lib/search/v2/scoring/applyHfReranking.ts'),
              Path('lib/search/v2/scoring/applyHfPersonalization.ts'),
              Path('lib/search/huggingFaceEmbedding.ts'),
              Path('app/admin/dashboard/search-health/ml/actions.ts'),
              Path('app/admin/dashboard/search-health/ml/page.tsx'),
          ]
          for p in focused:
              text = p.read_text().lower()
              if 'mode === "shadow"' in text or 'mode == "shadow"' in text or 'shadowed' in text or 'observed_not_served' in text:
                  raise SystemExit(f'remaining HF shadow-mode semantic in {p}')
          PY
      - name: Capture production build
        id: build
        shell: bash
        run: |
          set +e
          npm run build > production-build.log 2>&1
          rc=$?
          cat production-build.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: no-shadow-production-build
          path: production-build.log
          retention-days: 1
      - name: Commit production build fix
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          rm -f .github/workflows/apply-no-shadow-build-fix.yml
          git config user.name "roseoutllc"
          git config user.email "nick@roseout.com"
          git add -A
          git commit -m "Fix no-shadow HF production build"
          git push origin HEAD:fix/hf-no-shadow-production-build
      - name: Preserve build failure
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: exit 1
