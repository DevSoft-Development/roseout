name: Mobile release router

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'azure-pipelines-mobile.yml'
      - 'scripts/mobile-release-classifier.mjs'
      - '.github/workflows/mobile-release-router.yml'
      - '.github/workflows/azure-devops-mobile-dispatch.yml'
      - '.github/workflows/mobile-azure-ota.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'azure-pipelines-mobile.yml'
      - 'scripts/mobile-release-classifier.mjs'
      - '.github/workflows/mobile-release-router.yml'
      - '.github/workflows/azure-devops-mobile-dispatch.yml'
      - '.github/workflows/mobile-azure-ota.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: mobile-release-router-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify mobile release
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test classifier
        run: node scripts/mobile-release-classifier.mjs --self-test

      - name: Resolve diff range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          test -n "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Classify mobile release
        id: classify
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/mobile-release-classifier.mjs

      - name: Summarize release decision
        env:
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
        shell: bash
        run: |
          {
            echo "## Mobile release decision"
            echo
            case "$CLASSIFICATION" in
              native)
                echo "**Native binary required.** Android/iOS native release will be dispatched after main validation."
                ;;
              ota)
                echo "**OTA-safe.** Signed Azure production OTA will be dispatched after main validation."
                ;;
              none)
                echo "**No mobile runtime release required.**"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate mobile source on GitHub
    needs: classify
    if: needs.classify.outputs.classification != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate mobile source
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npx expo config --type public >/dev/null
          npx expo install --check
          npx expo-doctor

  dispatch-native:
    name: Dispatch exact-SHA native build
    needs: [classify, validate]
    if: github.event_name == 'push' && needs.classify.outputs.classification == 'native'
    runs-on: ubuntu-latest
    steps:
      - name: Queue Azure DevOps native release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/$GITHUB_REPOSITORY/actions/workflows/azure-devops-mobile-dispatch.yml/dispatches"             -f ref=main             -f "inputs[releasePlatform]=both"             -f "inputs[releaseSha]=$RELEASE_SHA"
          echo "Queued exact-SHA native release for $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  dispatch-ota:
    name: Dispatch signed production OTA
    needs: [classify, validate]
    if: github.event_name == 'push' && needs.classify.outputs.classification == 'ota'
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-SHA production OTA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/$GITHUB_REPOSITORY/actions/workflows/mobile-azure-ota.yml/dispatches"             -f ref=main             -f "inputs[action]=publish"             -f "inputs[channel]=production"             -f "inputs[release_sha]=$RELEASE_SHA"             -f "inputs[rollback_release_sha]="             -f "inputs[rollout_percentage]=100"
          echo "Queued signed production OTA for $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
