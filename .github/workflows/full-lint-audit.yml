name: Full repository lint audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-lint-audit
  cancel-in-progress: true

jobs:
  full-lint:
    name: Full ESLint audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint all files
        run: npm run lint
