name: Regenerate clean Stamps AWS migration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stamps-aws-regenerate.yml'

permissions:
  contents: write

concurrency:
  group: stamps-aws-regenerate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download previously validated generator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stamps-generator"
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/DevSoft-Development/roseout/ops/stamps-aws-integration-api/scripts/dev/apply_stamps_aws_migration.py \
            -o "$RUNNER_TEMP/stamps-generator/apply.py"
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/DevSoft-Development/roseout/ops/stamps-aws-integration-api/scripts/dev/finalize_stamps_aws_migration.py \
            -o "$RUNNER_TEMP/stamps-generator/finalize.py"

      - name: Generate migration and run safety checks
        run: |
          set -euo pipefail
          mkdir -p scripts/dev
          cp "$RUNNER_TEMP/stamps-generator/apply.py" scripts/dev/apply_stamps_aws_migration.py
          cp "$RUNNER_TEMP/stamps-generator/finalize.py" scripts/dev/finalize_stamps_aws_migration.py
          python scripts/dev/apply_stamps_aws_migration.py
          python scripts/dev/finalize_stamps_aws_migration.py
          python -m py_compile infra/aws/lambda/platform_integration_api.py
          python -m py_compile infra/aws/lambda/stamps_provider.py
          rm -rf infra/aws/lambda/__pycache__
          rm -f scripts/dev/apply_stamps_aws_migration.py scripts/dev/finalize_stamps_aws_migration.py
          git restore .github/workflows/aws-integration-api.yml
          git diff --check

      - name: Commit generated non-workflow migration
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate clean Stamps AWS Integration API migration"
          git push origin "HEAD:${HEAD_BRANCH}"
