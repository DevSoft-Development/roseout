name: Assistant Edge wiring

on:
  push:
    branches:
      - migration/aws-assistant-api
    paths:
      - 'scripts/assistant-edge-wiring.py'
      - '.github/workflows/assistant-edge-wiring.yml'

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[assistant-edge-wiring]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/aws-assistant-api
          fetch-depth: 0
      - name: Reset to latest branch head
        run: |
          set -euo pipefail
          git fetch origin migration/aws-assistant-api
          git reset --hard origin/migration/aws-assistant-api
      - name: Apply Edge runtime wiring
        run: python scripts/assistant-edge-wiring.py
      - name: Verify generated workflow diff
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'AWS_PLATFORM_ASSISTANT_API_URL' .github/workflows/aws-edge-runtime.yml
          grep -q 'AWS_PLATFORM_ASSISTANT_API_SECRET' .github/workflows/aws-edge-runtime.yml
          ! grep -q 'OPENAI_API_KEY: .*secrets.OPENAI_API_KEY' .github/workflows/aws-edge-runtime.yml
          ! grep -q 'TELNYX_TRANSACTIONAL_API_KEY: .*secrets.TELNYX_TRANSACTIONAL_API_KEY' .github/workflows/aws-edge-runtime.yml
          node scripts/verify-provider-boundaries.mjs
      - name: Commit validated Edge wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/aws-edge-runtime.yml
          git commit -m '[assistant-edge-wiring] Inject Assistant authority and remove provider keys'
          git push origin HEAD:migration/aws-assistant-api
