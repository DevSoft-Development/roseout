name: AWS domain gateway secret bootstrap retry

on:
  pull_request:
    paths:
      - '.github/workflows/aws-domain-gateway-secret-bootstrap-retry.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-domain-gateway-secret-bootstrap-retry.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-domain-gateway-secret-bootstrap-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  CANONICAL_DOMAIN_SECRET_NAME: /theouthaven/production/domain-gateway/hmac
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  DOMAIN_GATEWAY_INSTANCE: theouthaven-domains-gateway
  DOMAIN_GATEWAY_URL: https://domains-api.theouthaven.com
  BOOTSTRAP_POLICY_NAME: TheOutHavenDomainGatewayCredentialBootstrap

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          FILE='.github/workflows/aws-domain-gateway-secret-bootstrap-retry.yml'
          grep -F 'sleep 15' "$FILE" >/dev/null
          grep -F 'Re-assume AWS role after IAM propagation' "$FILE" >/dev/null
          grep -F 'lightsail get-instance-access-details' "$FILE" >/dev/null
          grep -F 'Authority,Value=aws-canonical-v1' "$FILE" >/dev/null
          grep -F 'delete-role-policy' "$FILE" >/dev/null
          grep -F "current['DOMAIN_GATEWAY_URL'] = gateway_url" "$FILE" >/dev/null
          grep -F "current['DOMAIN_GATEWAY_SECRET'] = authority" "$FILE" >/dev/null
          grep -F 'domain_gateway_authentication=valid' "$FILE" >/dev/null
          grep -F 'background_runtime_health=valid' "$FILE" >/dev/null
          ! grep -E 'secrets[.]DOMAIN_GATEWAY_SECRET' "$FILE" >/dev/null

  bootstrap:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Check canonical state and grant temporary Lightsail access
        id: state
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          META="$RUNNER_TEMP/domain-secret-meta.json"
          if aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" > "$META" 2>/dev/null && \
             jq -e 'any(.Tags[]?; .Key == "Authority" and .Value == "aws-canonical-v1")' "$META" >/dev/null; then
            echo 'needs_bootstrap=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          POLICY_FILE="$RUNNER_TEMP/domain-gateway-lightsail-bootstrap-policy.json"
          cat > "$POLICY_FILE" <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Sid":"DomainGatewayTemporarySshAccess","Effect":"Allow","Action":["lightsail:GetInstance","lightsail:GetInstances","lightsail:GetInstanceAccessDetails"],"Resource":"*"}]}
          JSON
          aws iam put-role-policy --role-name "$ROLE_NAME" --policy-name "$BOOTSTRAP_POLICY_NAME" --policy-document "file://$POLICY_FILE"
          aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$BOOTSTRAP_POLICY_NAME" --query PolicyName --output text | grep -Fx "$BOOTSTRAP_POLICY_NAME" >/dev/null
          echo 'needs_bootstrap=true' >> "$GITHUB_OUTPUT"
          echo "BOOTSTRAP_ROLE_NAME=$ROLE_NAME" >> "$GITHUB_ENV"
          echo 'temporary_lightsail_policy=attached'
          sleep 15

      - name: Re-assume AWS role after IAM propagation
        if: steps.state.outputs.needs_bootstrap == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Seed canonical AWS secret from live gateway
        if: steps.state.outputs.needs_bootstrap == 'true'
        run: |
          set -euo pipefail
          ACCESS="$RUNNER_TEMP/domain-gateway-access.json"
          KEY="$RUNNER_TEMP/domain-gateway-key"
          CERT="$RUNNER_TEMP/domain-gateway-key-cert.pub"
          KNOWN="$RUNNER_TEMP/domain-gateway-known-hosts"
          VALUE="$RUNNER_TEMP/domain-gateway-secret"
          aws lightsail get-instance-access-details --region "$AWS_REGION" --instance-name "$DOMAIN_GATEWAY_INSTANCE" --protocol ssh > "$ACCESS"
          jq -e '.accessDetails.protocol == "ssh" and (.accessDetails.privateKey|length>0) and (.accessDetails.ipAddress|length>0) and (.accessDetails.username|length>0)' "$ACCESS" >/dev/null
          jq -r '.accessDetails.privateKey' "$ACCESS" > "$KEY"
          jq -r '.accessDetails.certKey // empty' "$ACCESS" > "$CERT"
          jq -r '.accessDetails as $a | $a.hostKeys[] | "\($a.ipAddress) \(.algorithm) \(.publicKey)"' "$ACCESS" > "$KNOWN"
          chmod 600 "$KEY" "$CERT" "$KNOWN"
          HOST="$(jq -r '.accessDetails.ipAddress' "$ACCESS")"
          USERNAME="$(jq -r '.accessDetails.username' "$ACCESS")"
          LIVE="$(ssh -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "$USERNAME@$HOST" "sudo sh -c \"grep -m1 '^DOMAIN_GATEWAY_SECRET=' /opt/theouthaven-domain-gateway/.env | cut -d= -f2-\"")"
          LIVE="$(RAW="$LIVE" python - <<'PY'
          import os
          v=os.environ['RAW'].strip()
          if len(v)>=2 and v[0]==v[-1] and v[0] in {'\"',"'"}: v=v[1:-1]
          print(v,end='')
          PY
          )"
          test "${#LIVE}" -ge 32
          case "$LIVE" in *$'\n'*|*$'\r'*) exit 1;; esac
          echo "::add-mask::$LIVE"
          printf '%s' "$LIVE" > "$VALUE"
          chmod 600 "$VALUE"
          if aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" --secret-string "file://$VALUE" --query VersionId --output text >/dev/null
            ARN="$(aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" --query ARN --output text)"
            aws secretsmanager tag-resource --region "$AWS_REGION" --secret-id "$ARN" --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production Key=Service,Value=Domains Key=Authority,Value=aws-canonical-v1
          else
            aws secretsmanager create-secret --region "$AWS_REGION" --name "$CANONICAL_DOMAIN_SECRET_NAME" --description 'Canonical HMAC shared secret for TheOutHaven domain gateway authentication.' --secret-string "file://$VALUE" --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production Key=Service,Value=Domains Key=Authority,Value=aws-canonical-v1 --query ARN --output text >/dev/null
          fi
          echo 'canonical_domain_secret=seeded'

      - name: Remove temporary Lightsail access
        if: always() && steps.state.outputs.needs_bootstrap == 'true'
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name "$BOOTSTRAP_POLICY_NAME" || true
          echo 'temporary_lightsail_policy=removed'

      - name: Validate canonical secret and repair shared app environment
        id: repair
        run: |
          set -euo pipefail
          AUTHORITY="$(aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" --query SecretString --output text)"
          test "${#AUTHORITY}" -ge 32
          echo "::add-mask::$AUTHORITY"
          aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" > "$RUNNER_TEMP/meta.json"
          jq -e 'any(.Tags[]?; .Key == "Authority" and .Value == "aws-canonical-v1")' "$RUNNER_TEMP/meta.json" >/dev/null
          TS="$(date +%s%3N)"
          SIG="$(TIMESTAMP="$TS" DOMAIN_GATEWAY_SECRET="$AUTHORITY" python - <<'PY'
          import hashlib,hmac,os
          p='\n'.join([os.environ['TIMESTAMP'],'GET','/v1/status',''])
          print(hmac.new(os.environ['DOMAIN_GATEWAY_SECRET'].encode(),p.encode(),hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$SIG"
          STATUS="$(curl -sS -o "$RUNNER_TEMP/status.json" -w '%{http_code}' "$DOMAIN_GATEWAY_URL/v1/status" -H "x-toh-timestamp: $TS" -H "x-toh-signature: $SIG" || true)"
          test "${STATUS:-000}" -ge 200 2>/dev/null && test "$STATUS" -lt 300
          jq -e '.ok == true and .authenticated == true' "$RUNNER_TEMP/status.json" >/dev/null
          echo 'domain_gateway_authentication=valid'
          CURRENT="$RUNNER_TEMP/current.json"; REPAIRED="$RUNNER_TEMP/repaired.json"; FLAG="$RUNNER_TEMP/changed"
          aws secretsmanager get-secret-value --region "$APP_ENV_SECRET_REGION" --secret-id "$APP_ENV_SECRET_NAME" --query SecretString --output text > "$CURRENT"
          CURRENT_JSON="$CURRENT" OUTPUT_JSON="$REPAIRED" FLAG="$FLAG" DOMAIN_GATEWAY_SECRET="$AUTHORITY" DOMAIN_GATEWAY_URL="$DOMAIN_GATEWAY_URL" python - <<'PY'
          import json,os
          with open(os.environ['CURRENT_JSON']) as f: current=json.load(f)
          if not isinstance(current,dict): raise SystemExit('invalid app env')
          authority=os.environ['DOMAIN_GATEWAY_SECRET']; gateway_url=os.environ['DOMAIN_GATEWAY_URL'].rstrip('/')
          changed=current.get('DOMAIN_GATEWAY_SECRET')!=authority or current.get('DOMAIN_GATEWAY_URL')!=gateway_url
          current['DOMAIN_GATEWAY_URL']=gateway_url; current['DOMAIN_GATEWAY_SECRET']=authority
          with open(os.environ['OUTPUT_JSON'],'w') as f: json.dump(current,f,separators=(',',':'))
          with open(os.environ['FLAG'],'w') as f: f.write('true' if changed else 'false')
          PY
          CHANGED="$(cat "$FLAG")"
          if [ "$CHANGED" = true ]; then aws secretsmanager put-secret-value --region "$APP_ENV_SECRET_REGION" --secret-id "$APP_ENV_SECRET_NAME" --secret-string "file://$REPAIRED" --query VersionId --output text >/dev/null; fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Reload and verify background runtime
        run: |
          set -euo pipefail
          FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$FN" && test "$FN" != None
          if [ "${{ steps.repair.outputs.changed }}" = true ]; then
            aws lambda get-function-configuration --function-name "$FN" > "$RUNNER_TEMP/config.json"
            jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/config.json" > "$RUNNER_TEMP/orig.json"
            jq --arg t "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$t' "$RUNNER_TEMP/orig.json" > "$RUNNER_TEMP/refresh.json"
            aws lambda update-function-configuration --function-name "$FN" --environment "file://$RUNNER_TEMP/refresh.json" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$FN"
            aws lambda update-function-configuration --function-name "$FN" --environment "file://$RUNNER_TEMP/orig.json" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$FN"
          fi
          cat > "$RUNNER_TEMP/event.json" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"domain-bootstrap"},"requestContext":{"accountId":"bootstrap","apiId":"bootstrap","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"bootstrap","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"02/Sep/2026:00:00:00 +0000","timeEpoch":1788307200000},"isBase64Encoded":false}
          JSON
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/event.json" "$RUNNER_TEMP/response.json" >/dev/null
          jq -e '.statusCode == 200 and (.body|fromjson|.ok == true and .runtime == "aws-background" and .database == "ok")' "$RUNNER_TEMP/response.json" >/dev/null
          echo 'background_runtime_health=valid'

      - name: Cleanup
        if: always()
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name "$BOOTSTRAP_POLICY_NAME" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP"/domain-gateway-* "$RUNNER_TEMP"/{meta.json,status.json,current.json,repaired.json,changed,config.json,orig.json,refresh.json,event.json,response.json} 2>/dev/null || true
