name: AWS Google runtime proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-google-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Prove Google-dependent jobs do not take the missing-key skip
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$INVOKER_FN"

          for NAME in google-location-enrichment nightly-photo-backfill unified-location-gap-repair; do
            echo "probing=${NAME}"
            ITEM="$(jq -c --arg name "$NAME" '.[] | select(.name == $name)' infra/aws/edge-runtime/schedules.json)"
            test -n "$ITEM"
            jq -c '{function:.function,body:.body}' <<<"$ITEM" > "$RUNNER_TEMP/probe-input.json"
            aws lambda invoke \
              --function-name "$INVOKER_FN" \
              --cli-binary-format raw-in-base64-out \
              --payload "fileb://$RUNNER_TEMP/probe-input.json" \
              "$RUNNER_TEMP/probe-output.json" >/dev/null

            jq -c '{ok,function,status,response:{success:.response.success,skipped:.response.skipped,reason:.response.reason,processed:.response.processed,updated:.response.updated,failed:.response.failed,durationMs:.response.durationMs}}' "$RUNNER_TEMP/probe-output.json"

            jq -e '.ok == true and .status < 400 and (.response.success // true) != false' "$RUNNER_TEMP/probe-output.json" >/dev/null
            if jq -e '.response.skipped == true' "$RUNNER_TEMP/probe-output.json" >/dev/null; then
              echo "google_runtime_skip_detected=${NAME}"
              exit 1
            fi
            REASON="$(jq -r '.response.reason // ""' "$RUNNER_TEMP/probe-output.json")"
            if [[ "$REASON" == *GOOGLE_PLACES_API_KEY* ]] || [[ "$REASON" == *"Google Places"*"unavailable"* ]]; then
              echo "google_runtime_missing_key_reason=${NAME}"
              exit 1
            fi
            echo "google_runtime_nonskip_passed=${NAME}"
          done
