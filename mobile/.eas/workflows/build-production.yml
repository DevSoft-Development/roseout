name: Build and submit production mobile apps

on:
  push:
    branches:
      - main
    paths:
      - mobile/app.json
      - mobile/eas.json
      - mobile/package.json
      - mobile/package-lock.json
      - mobile/assets/**
      - mobile/plugins/**
      - mobile/ios/**
      - mobile/android/**

jobs:
  build_android:
    name: Build Android production app
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit Android to Google Play internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  build_ios:
    name: Build iOS production app
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
