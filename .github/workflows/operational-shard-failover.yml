name: Operational shard failover

on:
  workflow_dispatch:
    inputs:
      shard_id:
        description: Logical shard to operate
        required: true
        type: choice
        options: [shard-01, shard-02]
      action:
        description: Failover action
        required: true
        type: choice
        options: [promote_dr, restore_primary_after_rebalance]
      expected_routing_epoch:
        description: Current routing epoch; stale requests fail closed
        required: true
        type: string
      confirmation:
        description: For restore_primary_after_rebalance enter CONFIRM_FAILBACK
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: operational-shard-control-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  SUPABASE_VAULT_SECRET: /theouthaven/credential-vault/production/supabase
  DR_SECRET: /theouthaven/production/dr-reconciler/env
  GLOBAL_REF: ftdsltatyqhtllyyefzp
  SHARD01_REF: lyeruuzsnceaxrmdafxb
  SHARD01_DR_REF: vcdnwrsuvhtlvxqbkamg
  SHARD02_REF: lpcrikaixcfbqaikevlg
  SHARD02_DR_REF: bjhcxzahgfeniitejtrx

jobs:
  failover:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Load Supabase management authority
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id "$SUPABASE_VAULT_SECRET" --query SecretString --output text > "$RUNNER_TEMP/vault.json"
          aws secretsmanager get-secret-value --secret-id "$DR_SECRET" --query SecretString --output text > "$RUNNER_TEMP/dr.json"
          PRIMARY_TOKEN="$(jq -r '.managementAccessToken // empty' "$RUNNER_TEMP/vault.json")"
          FALLBACK_TOKEN="$(jq -r '.DR_SUPABASE_ACCESS_TOKEN // empty' "$RUNNER_TEMP/dr.json")"
          SHARDS="$(jq -r '.operationalShardsJson // empty' "$RUNNER_TEMP/vault.json")"
          test -n "$PRIMARY_TOKEN" && test -n "$SHARDS"
          echo "::add-mask::$PRIMARY_TOKEN"
          echo "::add-mask::$SHARDS"
          [ -z "$FALLBACK_TOKEN" ] || echo "::add-mask::$FALLBACK_TOKEN"
          echo "SUPABASE_ACCESS_TOKEN=$PRIMARY_TOKEN" >> "$GITHUB_ENV"
          echo "SUPABASE_FALLBACK_ACCESS_TOKEN=$FALLBACK_TOKEN" >> "$GITHUB_ENV"
          {
            echo 'OPERATIONAL_SHARDS_JSON<<TOH_SHARDS'
            printf '%s\n' "$SHARDS"
            echo 'TOH_SHARDS'
          } >> "$GITHUB_ENV"

      - name: Validate, drain, prove RPO, and cut over routing
        env:
          SHARD_ID: ${{ inputs.shard_id }}
          ACTION: ${{ inputs.action }}
          EXPECTED_EPOCH: ${{ inputs.expected_routing_epoch }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_EPOCH" =~ ^[1-9][0-9]*$ ]]

          case "$SHARD_ID" in
            shard-01)
              PRIMARY_REF="$SHARD01_REF"
              DR_ID=shard-01-dr
              DR_REF="$SHARD01_DR_REF"
              SUB=toh_shard01_dr
              ;;
            shard-02)
              PRIMARY_REF="$SHARD02_REF"
              DR_ID=shard-02-dr
              DR_REF="$SHARD02_DR_REF"
              SUB=toh_shard02_dr
              ;;
            *) exit 1 ;;
          esac

          sql_api() {
            local ref="$1" sql="$2" out="$3" token="$SUPABASE_ACCESS_TOKEN" code
            jq -n --arg query "$sql" '{query:$query}' > "$RUNNER_TEMP/query.json"
            code="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' --request POST               -H "Authorization: Bearer $token" -H 'Content-Type: application/json'               --data-binary "@$RUNNER_TEMP/query.json" "https://api.supabase.com/v1/projects/$ref/database/query" || true)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              test -n "$SUPABASE_FALLBACK_ACCESS_TOKEN"
              code="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' --request POST                 -H "Authorization: Bearer $SUPABASE_FALLBACK_ACCESS_TOKEN" -H 'Content-Type: application/json'                 --data-binary "@$RUNNER_TEMP/query.json" "https://api.supabase.com/v1/projects/$ref/database/query" || true)"
            fi
            test "$code" -ge 200 && test "$code" -lt 300 || { cat "$out"; return 1; }
          }

          runtime_preflight() {
            local physical_id="$1" ref="$2" url key write_enabled code
            url="$(printf '%s' "$OPERATIONAL_SHARDS_JSON" | jq -r --arg id "$physical_id" '.[$id].url // empty')"
            key="$(printf '%s' "$OPERATIONAL_SHARDS_JSON" | jq -r --arg id "$physical_id" '.[$id].serviceRoleKey // empty')"
            write_enabled="$(printf '%s' "$OPERATIONAL_SHARDS_JSON" | jq -r --arg id "$physical_id" '.[$id].writeEnabled // true')"
            test "$url" = "https://$ref.supabase.co"
            test -n "$key"
            test "$write_enabled" = true
            echo "::add-mask::$key"
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/runtime-$physical_id.json" --write-out '%{http_code}'               -H "apikey: $key"               "$url/rest/v1/operational_shard_write_gate?select=id,frozen&limit=1" || true)"
            test "$code" = 200 || { cat "$RUNNER_TEMP/runtime-$physical_id.json"; return 1; }
          }

          runtime_preflight "$SHARD_ID" "$PRIMARY_REF"
          runtime_preflight "$DR_ID" "$DR_REF"

          freeze_runtime_gate() {
            local physical_id="$1" reason="$2" url key code
            url="$(printf '%s' "$OPERATIONAL_SHARDS_JSON" | jq -r --arg id "$physical_id" '.[$id].url // empty')"
            key="$(printf '%s' "$OPERATIONAL_SHARDS_JSON" | jq -r --arg id "$physical_id" '.[$id].serviceRoleKey // empty')"
            test -n "$url" && test -n "$key"
            echo "::add-mask::$key"
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/freeze-$physical_id.json" --write-out '%{http_code}' \
              --request PATCH \
              -H "apikey: $key" -H 'Content-Type: application/json' \
              -H 'Prefer: return=representation' \
              --data "{\"frozen\":true,\"reason\":\"$reason\"}" \
              "$url/rest/v1/operational_shard_write_gate?id=eq.1" || true)"
            test "$code" = 200 || { cat "$RUNNER_TEMP/freeze-$physical_id.json"; return 1; }
            test "$(jq -r '.[0].frozen // false' "$RUNNER_TEMP/freeze-$physical_id.json")" = true
          }

          GLOBAL_FROZEN=false
          PHYSICAL_FROZEN=false
          CUTOVER_DONE=false
          SUB_DISABLED=false
          PRIMARY_OPENED=false
          ACTIVE_REF="$PRIMARY_REF"

          rollback_on_error() {
            trap - ERR
            if [ "$CUTOVER_DONE" != true ]; then
              # An HTTP/client error can be ambiguous after PostgreSQL commits.
              # Re-read authoritative routing before changing any physical gate.
              if sql_api "$GLOBAL_REF" "select active_physical_shard_id,routing_epoch
                from public.operational_shards where id='$SHARD_ID';" "$RUNNER_TEMP/rollback-routing.json"; then
                CURRENT_ACTIVE="$(jq -r '.[0].active_physical_shard_id // empty' "$RUNNER_TEMP/rollback-routing.json")"
                CURRENT_EPOCH="$(jq -r '.[0].routing_epoch // 0' "$RUNNER_TEMP/rollback-routing.json")"
                if [ "$ACTION" = promote_dr ] &&
                   [ "$CURRENT_ACTIVE" = "$DR_ID" ] &&
                   [ "$CURRENT_EPOCH" = "$((EXPECTED_EPOCH+1))" ]; then
                  CUTOVER_DONE=true
                  return
                fi
                if [ "$ACTION" = restore_primary_after_rebalance ] &&
                   [ "$CURRENT_ACTIVE" = "$SHARD_ID" ] &&
                   [ "$CURRENT_EPOCH" = "$((EXPECTED_EPOCH+1))" ]; then
                  CUTOVER_DONE=true
                  return
                fi
              else
                # Routing state is unknowable: freeze both physical databases
                # and stay closed rather than risk split-brain writes.
                sql_api "$PRIMARY_REF" "update public.operational_shard_write_gate
                  set frozen=true,reason='ambiguous-routing',updated_at=now() where id=1;" "$RUNNER_TEMP/ambiguous-primary.json" || true
                sql_api "$DR_REF" "update public.operational_shard_write_gate
                  set frozen=true,reason='ambiguous-routing',updated_at=now() where id=1;" "$RUNNER_TEMP/ambiguous-dr.json" || true
                return
              fi

              RECOVERY_OK=true

              # If promotion already disabled replication, restore the DR path
              # before any primary writes are reopened. If that restore fails,
              # stay fail-closed instead of resuming unreplicated writes.
              if [ "$ACTION" = promote_dr ] && [ "$SUB_DISABLED" = true ]; then
                DR_RECOVERY_FROZEN=false
                if sql_api "$DR_REF" "update public.operational_shard_write_gate
                  set frozen=true,reason='failover-aborted',updated_at=now() where id=1;
                  select frozen from public.operational_shard_write_gate where id=1;" "$RUNNER_TEMP/refreeze-dr.json" &&
                   [ "$(jq -r '.[0].frozen // false' "$RUNNER_TEMP/refreeze-dr.json")" = true ]; then
                  DR_RECOVERY_FROZEN=true
                elif freeze_runtime_gate "$DR_ID" failover-aborted; then
                  DR_RECOVERY_FROZEN=true
                fi

                if [ "$DR_RECOVERY_FROZEN" != true ]; then
                  RECOVERY_OK=false
                  sql_api "$GLOBAL_REF" "update public.operational_shards
                    set write_enabled=false,failover_state='degraded',replication_state='broken',updated_at=now()
                    where id='$SHARD_ID' and routing_epoch=$EXPECTED_EPOCH;" "$RUNNER_TEMP/mark-dr-refreeze-broken.json" || true
                elif ! sql_api "$DR_REF" "alter subscription $SUB enable;" "$RUNNER_TEMP/restore-subscription.json"; then
                  RECOVERY_OK=false
                  sql_api "$GLOBAL_REF" "update public.operational_shards
                    set write_enabled=false,failover_state='degraded',replication_state='broken',updated_at=now()
                    where id='$SHARD_ID' and routing_epoch=$EXPECTED_EPOCH;" "$RUNNER_TEMP/mark-replication-broken.json" || true
                else
                  sql_api "$GLOBAL_REF" "update public.operational_shards
                    set replication_state='initializing',last_replication_check_at=now(),updated_at=now()
                    where id='$SHARD_ID' and routing_epoch=$EXPECTED_EPOCH;" "$RUNNER_TEMP/mark-replication-recovering.json" || true
                fi
              fi

              # During failback the primary is opened immediately before the
              # routing CAS. If that CAS fails, refreeze primary before DR or
              # global writes are restored; otherwise both physical shards
              # could accept writes.
              if [ "$ACTION" = restore_primary_after_rebalance ] && [ "$PRIMARY_OPENED" = true ]; then
                if ! sql_api "$PRIMARY_REF" "update public.operational_shard_write_gate
                  set frozen=true,reason='failback-aborted',updated_at=now() where id=1;" "$RUNNER_TEMP/refreeze-primary.json"; then
                  RECOVERY_OK=false
                  sql_api "$GLOBAL_REF" "update public.operational_shards
                    set write_enabled=false,failover_state='degraded',updated_at=now()
                    where id='$SHARD_ID' and routing_epoch=$EXPECTED_EPOCH;" "$RUNNER_TEMP/mark-failback-degraded.json" || true
                fi
              fi

              if [ "$RECOVERY_OK" = true ]; then
                if [ "$PHYSICAL_FROZEN" = true ]; then
                  sql_api "$ACTIVE_REF" "update public.operational_shard_write_gate
                    set frozen=false,reason='failover-aborted',updated_at=now() where id=1;" "$RUNNER_TEMP/unfreeze.json" || true
                fi
                if [ "$GLOBAL_FROZEN" = true ]; then
                  sql_api "$GLOBAL_REF" "update public.operational_shards
                    set write_enabled=true,
                        failover_state=case when active_physical_shard_id=id then 'primary' else 'dr' end,
                        updated_at=now()
                    where id='$SHARD_ID' and routing_epoch=$EXPECTED_EPOCH;" "$RUNNER_TEMP/global-unfreeze.json" || true
                fi
              fi
            fi
          }
          trap rollback_on_error ERR

          sql_api "$GLOBAL_REF" "select id,active_physical_shard_id,routing_epoch,replication_state,write_enabled
            from public.operational_shards where id='$SHARD_ID';" "$RUNNER_TEMP/current.json"
          test "$(jq -r '.[0].routing_epoch' "$RUNNER_TEMP/current.json")" = "$EXPECTED_EPOCH"

          if [ "$ACTION" = promote_dr ]; then
            test "$(jq -r '.[0].active_physical_shard_id' "$RUNNER_TEMP/current.json")" = "$SHARD_ID"
            test "$(jq -r '.[0].replication_state' "$RUNNER_TEMP/current.json")" = healthy

            # Mark the attempted mutation before the request. A committed SQL
            # mutation with a lost HTTP response must still be rolled back.
            GLOBAL_FROZEN=true
            sql_api "$GLOBAL_REF" "update public.operational_shards
              set write_enabled=false,failover_state='promoting_dr',updated_at=now()
              where id='$SHARD_ID' and routing_epoch=$EXPECTED_EPOCH and active_physical_shard_id='$SHARD_ID';
              select write_enabled from public.operational_shards where id='$SHARD_ID';" "$RUNNER_TEMP/global-freeze.json"
            test "$(jq -r '.[0].write_enabled' "$RUNNER_TEMP/global-freeze.json")" = false

            ACTIVE_REF="$PRIMARY_REF"
            PHYSICAL_FROZEN=true
            sql_api "$PRIMARY_REF" "update public.operational_shard_write_gate
              set frozen=true,reason='failover-promote-dr',updated_at=now() where id=1;" "$RUNNER_TEMP/source-freeze.json"

            drained=false
            for attempt in $(seq 1 90); do
              sql_api "$PRIMARY_REF" "select public.pos_expire_stale_card_tenders(null) as expired;" "$RUNNER_TEMP/expire-tenders.json"
              sql_api "$PRIMARY_REF" "select count(*)::int as pending
                from public.pos_tenders t
                where t.tender_type='card'
                  and t.status='initiated'
                  and not exists (
                    select 1 from public.pos_payments p where p.tender_id=t.id
                  )
                  and coalesce(t.provider_call_lease_expires_at,t.created_at + interval '2 minutes') > now();" "$RUNNER_TEMP/tenders.json"
              if [ "$(jq -r '.[0].pending // 0' "$RUNNER_TEMP/tenders.json")" = 0 ]; then
                drained=true
                break
              fi
              sleep 2
            done
            test "$drained" = true

            sql_api "$DR_REF" "select not exists (
              select 1 from pg_subscription_rel r join pg_subscription s on s.oid=r.srsubid
              where s.subname='$SUB' and r.srsubstate <> 'r'
            ) as ready;" "$RUNNER_TEMP/ready.json"
            test "$(jq -r '.[0].ready // false' "$RUNNER_TEMP/ready.json")" = true

            caught_up=false
            LAG_BYTES=-1
            for attempt in $(seq 1 60); do
              sql_api "$DR_REF" "select latest_end_lsn::text as target_lsn
                from pg_stat_subscription where subname='$SUB' and pid is not null;" "$RUNNER_TEMP/target-lsn.json"
              TARGET_LSN="$(jq -r '.[0].target_lsn // empty' "$RUNNER_TEMP/target-lsn.json")"
              if [ -n "$TARGET_LSN" ]; then
                sql_api "$PRIMARY_REF" "select greatest(0,pg_wal_lsn_diff(pg_current_wal_lsn(),'$TARGET_LSN'::pg_lsn))::bigint as lag_bytes;" "$RUNNER_TEMP/lag.json"
                LAG_BYTES="$(jq -r '.[0].lag_bytes // -1' "$RUNNER_TEMP/lag.json")"
                if [ "$LAG_BYTES" = 0 ]; then
                  caught_up=true
                  break
                fi
              fi
              sleep 2
            done
            test "$caught_up" = true

            SUB_DISABLED=true
            sql_api "$DR_REF" "alter subscription $SUB disable;
              update public.operational_shard_write_gate set frozen=false,reason='active-dr',updated_at=now() where id=1;" "$RUNNER_TEMP/disable.json"

            sql_api "$GLOBAL_REF" "with moved as (
                update public.operational_shards
                   set active_physical_shard_id='$DR_ID',
                       routing_epoch=routing_epoch+1,
                       write_enabled=true,
                       failover_state='dr',
                       replication_state='disabled',
                       last_failover_at=now(),
                       updated_at=now()
                 where id='$SHARD_ID'
                   and routing_epoch=$EXPECTED_EPOCH
                   and active_physical_shard_id='$SHARD_ID'
                   and write_enabled=false
                returning id,routing_epoch
              )
              insert into public.operational_shard_failover_events
                (shard_id,from_physical_shard_id,to_physical_shard_id,from_epoch,to_epoch,action,status,replication_lag_bytes)
              select '$SHARD_ID','$SHARD_ID','$DR_ID',$EXPECTED_EPOCH,routing_epoch,'promote_dr','completed',$LAG_BYTES
                from moved;
              select id,active_physical_shard_id,routing_epoch,write_enabled
                from public.operational_shards where id='$SHARD_ID';" "$RUNNER_TEMP/cutover.json"
            test "$(jq -r '.[0].active_physical_shard_id' "$RUNNER_TEMP/cutover.json")" = "$DR_ID"
            test "$(jq -r '.[0].routing_epoch' "$RUNNER_TEMP/cutover.json")" = "$((EXPECTED_EPOCH+1))"
            test "$(jq -r '.[0].write_enabled' "$RUNNER_TEMP/cutover.json")" = true
            CUTOVER_DONE=true
          else
            test "$CONFIRMATION" = CONFIRM_FAILBACK
            test "$(jq -r '.[0].active_physical_shard_id' "$RUNNER_TEMP/current.json")" = "$DR_ID"

            GLOBAL_FROZEN=true
            sql_api "$GLOBAL_REF" "update public.operational_shards
              set write_enabled=false,failover_state='promoting_primary',updated_at=now()
              where id='$SHARD_ID' and routing_epoch=$EXPECTED_EPOCH and active_physical_shard_id='$DR_ID';" "$RUNNER_TEMP/global-freeze.json"

            ACTIVE_REF="$DR_REF"
            PHYSICAL_FROZEN=true
            sql_api "$DR_REF" "update public.operational_shard_write_gate
              set frozen=true,reason='failback-primary',updated_at=now() where id=1;" "$RUNNER_TEMP/dr-freeze.json"

            drained=false
            for attempt in $(seq 1 90); do
              sql_api "$DR_REF" "select public.pos_expire_stale_card_tenders(null) as expired;" "$RUNNER_TEMP/expire-tenders.json"
              sql_api "$DR_REF" "select count(*)::int as pending
                from public.pos_tenders t
                where t.tender_type='card'
                  and t.status='initiated'
                  and not exists (
                    select 1 from public.pos_payments p where p.tender_id=t.id
                  )
                  and coalesce(t.provider_call_lease_expires_at,t.created_at + interval '2 minutes') > now();" "$RUNNER_TEMP/tenders.json"
              if [ "$(jq -r '.[0].pending // 0' "$RUNNER_TEMP/tenders.json")" = 0 ]; then
                drained=true
                break
              fi
              sleep 2
            done
            test "$drained" = true

            # DR is now frozen and stable. Rebuild the primary from that exact
            # dataset before any primary writes are allowed.
            case "$SHARD_ID" in
              shard-01)
                FAILBACK_ROLE=toh_failback_shard01
                FAILBACK_SUB=toh_shard01_failback_sync
                ;;
              shard-02)
                FAILBACK_ROLE=toh_failback_shard02
                FAILBACK_SUB=toh_shard02_failback_sync
                ;;
            esac
            FAILBACK_PASSWORD="$(openssl rand -hex 32)"
            echo "::add-mask::$FAILBACK_PASSWORD"
            FAILBACK_CONN="host=db.$DR_REF.supabase.co port=5432 dbname=postgres user=$FAILBACK_ROLE password=$FAILBACK_PASSWORD sslmode=require"

            sql_api "$DR_REF" "do \$\$
            begin
              if not exists (select 1 from pg_roles where rolname='$FAILBACK_ROLE') then
                execute 'create role $FAILBACK_ROLE with login replication bypassrls';
              end if;
            end \$\$;
            alter role $FAILBACK_ROLE password '$FAILBACK_PASSWORD';
            grant connect on database postgres to $FAILBACK_ROLE;
            grant usage on schema public to $FAILBACK_ROLE;
            grant select on public.locations,public.location_reservations,public.reserve_staff_profiles,public.layout_items,public.reservation_seating_resources,public.reservation_resource_assignments,public.pos_checks,public.pos_check_resources,public.pos_orders,public.pos_order_items,public.pos_tenders,public.pos_payments,public.pos_inventory_items,public.pos_inventory_transactions,public.pos_inventory_adjustments,public.pos_ordering_settings,public.pos_online_orders,public.pos_online_order_events to $FAILBACK_ROLE;" "$RUNNER_TEMP/failback-role.json"

            # Primary is standby/frozen, so a full replace is safe and gives a
            # deterministic final resync after the DR write stop.
            sql_api "$PRIMARY_REF" "do \$\$
            begin
              if exists (select 1 from pg_subscription where subname='$FAILBACK_SUB') then
                execute 'alter subscription $FAILBACK_SUB disable';
              end if;
            end \$\$;" "$RUNNER_TEMP/failback-disable-old.json"
            sql_api "$PRIMARY_REF" "drop subscription if exists $FAILBACK_SUB;" "$RUNNER_TEMP/failback-drop-old.json"
            sql_api "$PRIMARY_REF" "truncate table
              public.pos_payments,
              public.pos_order_items,
              public.pos_tenders,
              public.pos_orders,
              public.pos_check_resources,
              public.pos_checks,
              public.reservation_resource_assignments,
              public.location_reservations,
              public.reservation_seating_resources,
              public.layout_items,
              public.reserve_staff_profiles,
              public.locations
              restart identity cascade;" "$RUNNER_TEMP/failback-truncate.json"
            sql_api "$PRIMARY_REF" "create subscription $FAILBACK_SUB
              connection '$FAILBACK_CONN'
              publication toh_operational_dr
              with (copy_data=true,create_slot=true,enabled=true);" "$RUNNER_TEMP/failback-create-sub.json"

            failback_ready=false
            for attempt in $(seq 1 80); do
              sql_api "$PRIMARY_REF" "select not exists (
                select 1 from pg_subscription_rel r
                join pg_subscription s on s.oid=r.srsubid
                where s.subname='$FAILBACK_SUB' and r.srsubstate <> 'r'
              ) as ready;" "$RUNNER_TEMP/failback-ready.json"
              if [ "$(jq -r '.[0].ready // false' "$RUNNER_TEMP/failback-ready.json")" = true ]; then
                failback_ready=true
                break
              fi
              sleep 3
            done
            test "$failback_ready" = true

            # Verify exact table counts + deterministic row hashes while DR is
            # still frozen. This is the final parity gate before primary opens.
            TABLES="locations location_reservations reserve_staff_profiles layout_items reservation_seating_resources reservation_resource_assignments pos_checks pos_check_resources pos_orders pos_order_items pos_tenders pos_payments pos_inventory_items pos_inventory_transactions pos_inventory_adjustments pos_ordering_settings pos_online_orders pos_online_order_events"
            for table in $TABLES; do
              CHECKSUM_SQL="select count(*)::bigint as row_count,
                md5(coalesce(string_agg(md5(to_jsonb(t)::text),'' order by id::text),'')) as row_hash
                from public.$table t;"
              sql_api "$DR_REF" "$CHECKSUM_SQL" "$RUNNER_TEMP/source-$table.json"
              sql_api "$PRIMARY_REF" "$CHECKSUM_SQL" "$RUNNER_TEMP/target-$table.json"
              test "$(jq -r '.[0].row_count' "$RUNNER_TEMP/source-$table.json")" = "$(jq -r '.[0].row_count' "$RUNNER_TEMP/target-$table.json")"
              test "$(jq -r '.[0].row_hash' "$RUNNER_TEMP/source-$table.json")" = "$(jq -r '.[0].row_hash' "$RUNNER_TEMP/target-$table.json")"
            done

            sql_api "$PRIMARY_REF" "alter subscription $FAILBACK_SUB disable;" "$RUNNER_TEMP/failback-disable.json"
            sql_api "$PRIMARY_REF" "drop subscription $FAILBACK_SUB;" "$RUNNER_TEMP/failback-drop.json"
            sql_api "$DR_REF" "revoke select on public.locations,public.location_reservations,public.reserve_staff_profiles,public.layout_items,public.reservation_seating_resources,public.reservation_resource_assignments,public.pos_checks,public.pos_check_resources,public.pos_orders,public.pos_order_items,public.pos_tenders,public.pos_payments,public.pos_inventory_items,public.pos_inventory_transactions,public.pos_inventory_adjustments,public.pos_ordering_settings,public.pos_online_orders,public.pos_online_order_events from $FAILBACK_ROLE;
              revoke usage on schema public from $FAILBACK_ROLE;
              revoke connect on database postgres from $FAILBACK_ROLE;
              drop role if exists $FAILBACK_ROLE;" "$RUNNER_TEMP/failback-drop-role.json"

            # Restore normal primary->DR replication before reopening primary.
            sql_api "$DR_REF" "alter subscription $SUB enable;" "$RUNNER_TEMP/forward-enable.json"
            forward_ready=false
            for attempt in $(seq 1 40); do
              sql_api "$DR_REF" "select count(*)::int as workers
                from pg_stat_subscription where subname='$SUB' and pid is not null;" "$RUNNER_TEMP/forward-worker.json"
              if [ "$(jq -r '.[0].workers // 0' "$RUNNER_TEMP/forward-worker.json")" -ge 1 ]; then
                forward_ready=true
                break
              fi
              sleep 3
            done
            test "$forward_ready" = true

            PRIMARY_OPENED=true
            sql_api "$PRIMARY_REF" "update public.operational_shard_write_gate
              set frozen=false,reason='active-primary',updated_at=now() where id=1;" "$RUNNER_TEMP/primary-unfreeze.json"

            sql_api "$GLOBAL_REF" "with moved as (
                update public.operational_shards
                   set active_physical_shard_id='$SHARD_ID',
                       routing_epoch=routing_epoch+1,
                       write_enabled=true,
                       failover_state='primary',
                       replication_state='healthy',
                       last_failover_at=now(),
                       updated_at=now()
                 where id='$SHARD_ID'
                   and routing_epoch=$EXPECTED_EPOCH
                   and active_physical_shard_id='$DR_ID'
                   and write_enabled=false
                returning id,routing_epoch
              )
              insert into public.operational_shard_failover_events
                (shard_id,from_physical_shard_id,to_physical_shard_id,from_epoch,to_epoch,action,status)
              select '$SHARD_ID','$DR_ID','$SHARD_ID',$EXPECTED_EPOCH,routing_epoch,'failback_primary','completed'
                from moved;
              select id,active_physical_shard_id,routing_epoch,write_enabled
                from public.operational_shards where id='$SHARD_ID';" "$RUNNER_TEMP/restore.json"
            test "$(jq -r '.[0].active_physical_shard_id' "$RUNNER_TEMP/restore.json")" = "$SHARD_ID"
            test "$(jq -r '.[0].routing_epoch' "$RUNNER_TEMP/restore.json")" = "$((EXPECTED_EPOCH+1))"
            test "$(jq -r '.[0].write_enabled' "$RUNNER_TEMP/restore.json")" = true
            CUTOVER_DONE=true
          fi

          trap - ERR

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.json
