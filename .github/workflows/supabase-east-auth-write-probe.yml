name: Supabase East Auth write probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-east-auth-write-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EAST_SUPABASE_REF: ftdsltatyqhtllyyefzp

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Probe no-op Auth write
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN" >&2; exit 1; }

          CURRENT="$RUNNER_TEMP/east-auth-current.json"
          PAYLOAD="$RUNNER_TEMP/east-auth-probe.json"
          RESPONSE="$RUNNER_TEMP/east-auth-probe-response.json"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${EAST_SUPABASE_REF}/config/auth" \
            > "$CURRENT"

          jq -e 'type == "object" and (.site_url | type == "string")' "$CURRENT" >/dev/null
          jq '{site_url: .site_url}' "$CURRENT" > "$PAYLOAD"

          CODE="$(curl --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$PAYLOAD" \
            --output "$RESPONSE" \
            --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/${EAST_SUPABASE_REF}/config/auth")"

          echo "auth_write_probe_http_status=$CODE"
          if [[ "$CODE" != 2* ]]; then
            if jq -e 'type == "object"' "$RESPONSE" >/dev/null 2>&1; then
              jq -r '[.error_code // .code // empty, .message // .error // empty] | map(select(length > 0)) | join(": ")' "$RESPONSE" | sed 's/^$/Supabase returned an Auth write error with no public message./'
            else
              echo "Supabase returned a non-JSON Auth write error."
            fi
            exit 1
          fi

          echo "east_auth_noop_write=success"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/east-auth-current.json "$RUNNER_TEMP"/east-auth-probe.json "$RUNNER_TEMP"/east-auth-probe-response.json
