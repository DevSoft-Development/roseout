AWSTemplateFormatVersion: '2010-09-09'
Description: TheOutHaven critical platform monitoring and Telnyx alert relay.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  PlatformAlertsTopicArn:
    Type: String
  DrSecretArn:
    Type: String
  CriticalSmsFrom:
    Type: String
    Default: ''
  CriticalSmsTo:
    Type: String
    Default: ''
  ProductionProbeUrl:
    Type: String
    Default: https://theouthaven.com/api/health/platform-dr
  CredentialVaultGatewayUrl:
    Type: String
    Default: ''
  CredentialVaultGatewaySecret:
    Type: String
    NoEcho: true
    Default: ''
  VercelProjectId:
    Type: String
    Default: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  StorageDriftCriticalBytes:
    Type: Number
    Default: 5368709120
  WalLagCriticalBytes:
    Type: Number
    Default: 536870912

Conditions:
  SmsConfigured: !And
    - !Not [!Equals [!Ref CriticalSmsFrom, '']]
    - !Not [!Equals [!Ref CriticalSmsTo, '']]

Resources:
  CriticalMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenCriticalMonitor${Environment}Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CriticalMonitorRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DrSecretArn
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/theouthaven/credential-vault/${Environment}/vercel-*
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: TheOutHaven/Critical

  CriticalMonitorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub toh-${Environment}-critical-platform-monitor
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CriticalMonitorRole.Arn
      Timeout: 90
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DR_SECRET_NAME: !Ref DrSecretArn
          METRIC_NAMESPACE: TheOutHaven/Critical
          PRODUCTION_PROBE_URL: !Ref ProductionProbeUrl
          CREDENTIAL_VAULT_GATEWAY_URL: !Ref CredentialVaultGatewayUrl
          CREDENTIAL_VAULT_GATEWAY_SECRET: !Ref CredentialVaultGatewaySecret
          VERCEL_SECRET_ID: !Sub /theouthaven/credential-vault/${Environment}/vercel
          VERCEL_PROJECT_ID: !Ref VercelProjectId
      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError('critical_monitor_code_not_deployed')

  CriticalMonitorScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenCriticalMonitorSchedule${Environment}Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeCriticalMonitor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CriticalMonitorFunction.Arn

  CriticalMonitorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub toh-${Environment}-critical-platform-monitor-5m
      GroupName: !Sub toh-${Environment}
      Description: Run critical platform health checks every five minutes.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt CriticalMonitorFunction.Arn
        RoleArn: !GetAtt CriticalMonitorScheduleRole.Arn
        Input: '{}'

  CriticalAlertRelayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenCriticalAlertRelay${Environment}Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CriticalAlertRelayRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/theouthaven/credential-vault/${Environment}/telnyx-*

  CriticalAlertRelayFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub toh-${Environment}-critical-alert-relay
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CriticalAlertRelayRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CREDENTIAL_VAULT_PREFIX: /theouthaven/credential-vault
          CRITICAL_SMS_FROM: !Ref CriticalSmsFrom
          CRITICAL_SMS_TO: !Ref CriticalSmsTo
      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError('critical_alert_relay_code_not_deployed')

  CriticalAlertRelayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CriticalAlertRelayFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref PlatformAlertsTopicArn

  CriticalAlertRelaySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PlatformAlertsTopicArn
      Protocol: lambda
      Endpoint: !GetAtt CriticalAlertRelayFunction.Arn

  ProductionOutageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-production-outage
      AlarmDescription: TheOutHaven production health probe is unreachable.
      Namespace: TheOutHaven/Critical
      MetricName: ProductionReachable
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

  SupabaseVirginiaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-supabase-virginia
      AlarmDescription: Virginia primary Supabase health queries are failing.
      Namespace: TheOutHaven/Critical
      MetricName: SupabaseVirginiaHealthy
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

  SupabaseOregonAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-supabase-oregon
      AlarmDescription: Oregon standby Supabase health queries are failing.
      Namespace: TheOutHaven/Critical
      MetricName: SupabaseOregonHealthy
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

  ReplicationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-dr-replication
      AlarmDescription: Virginia to Oregon logical replication is unhealthy.
      Namespace: TheOutHaven/Critical
      MetricName: ReplicationHealthy
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

  CredentialVaultAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-credential-vault
      AlarmDescription: Credential Vault runtime gateway is unavailable, rate limited, or returning errors.
      Namespace: TheOutHaven/Critical
      MetricName: CredentialVaultHealthy
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

  VercelProductionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-vercel-production
      AlarmDescription: Latest Vercel production deployment is failed or production deployment status cannot be verified.
      Namespace: TheOutHaven/Critical
      MetricName: VercelProductionHealthy
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

  CriticalCronFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-cron-failures
      AlarmDescription: One or more tracked cron jobs have an unresolved recent failure.
      Namespace: TheOutHaven/Critical
      MetricName: CriticalCronFailures
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

  StorageByteDriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-dr-storage-byte-drift
      AlarmDescription: Virginia and Oregon Storage differ by more than the critical byte threshold.
      Namespace: TheOutHaven/Critical
      MetricName: StorageByteDrift
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref StorageDriftCriticalBytes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

  WalLagCriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-dr-wal-lag
      AlarmDescription: Virginia to Oregon WAL lag exceeded the critical threshold.
      Namespace: TheOutHaven/Critical
      MetricName: WalLagBytes
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref WalLagCriticalBytes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

  MonitorStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-critical-monitor-stale
      AlarmDescription: Critical platform monitor has not reported for 15 minutes.
      Namespace: TheOutHaven/Critical
      MetricName: MonitorHeartbeat
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref PlatformAlertsTopicArn]
      OKActions: [!Ref PlatformAlertsTopicArn]

Outputs:
  CriticalMonitorFunctionName:
    Value: !Ref CriticalMonitorFunction
  CriticalAlertRelayFunctionName:
    Value: !Ref CriticalAlertRelayFunction
  CriticalSmsConfigured:
    Value: !If [SmsConfigured, 'true', 'false']
