name: Virginia Azure client secret repair

on:
  push:
    branches:
      - fix/virginia-azure-client-secret
    paths:
      - '.github/workflows/virginia-azure-secret-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  OREGON_SUPABASE_REF: hnhbzynoyrhjndefbwkh
  VIRGINIA_SUPABASE_REF: ftdsltatyqhtllyyefzp
  RUNTIME_SECRET_NAME: /theouthaven/production/edge-runtime/env

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole
          aws-region: us-east-1
          allowed-account-ids: '742020474738'

      - name: Require Supabase management credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured' >&2; exit 1; }
          echo 'supabase_management_credential_present=true'

      - name: Inspect GitHub credential candidates without printing values
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for key in MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET AZURE_CLIENT_ID AZURE_CLIENT_SECRET ENTRA_CLIENT_ID ENTRA_CLIENT_SECRET; do
            if [ -n "${!key:-}" ]; then
              echo "github_candidate_${key}=present"
            else
              echo "github_candidate_${key}=absent"
            fi
          done

      - name: Inspect known AWS runtime secret without printing values
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/runtime-env.json"
          if aws secretsmanager describe-secret --secret-id "$RUNTIME_SECRET_NAME" >/dev/null 2>&1; then
            aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET_NAME" --query SecretString --output text > "$OUT"
            chmod 600 "$OUT"
            if jq -e 'type == "object"' "$OUT" >/dev/null 2>&1; then
              for key in MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET AZURE_CLIENT_ID AZURE_CLIENT_SECRET ENTRA_CLIENT_ID ENTRA_CLIENT_SECRET; do
                if jq -e --arg key "$key" '.[$key] | type == "string" and length > 0' "$OUT" >/dev/null 2>&1; then
                  echo "aws_runtime_candidate_${key}=present"
                else
                  echo "aws_runtime_candidate_${key}=absent"
                fi
              done
            else
              echo 'aws_runtime_secret_format=json_false'
            fi
          else
            echo 'aws_runtime_secret_present=false'
          fi

      - name: Discover TheOutHaven AWS secret names and credential key names safely
        run: |
          set -euo pipefail
          NAMES="$RUNNER_TEMP/secret-names.txt"
          if aws secretsmanager list-secrets --query 'SecretList[].Name' --output text > "$NAMES" 2>/dev/null; then
            tr '\t' '\n' < "$NAMES" | grep -Ei 'theouthaven|roseout' | grep -Ei 'microsoft|azure|entra|auth|edge|runtime' | sort -u > "$RUNNER_TEMP/candidates.txt" || true
            count="$(wc -l < "$RUNNER_TEMP/candidates.txt" | tr -d ' ')"
            echo "aws_named_secret_candidates=${count}"
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              echo "aws_candidate_secret_name=${name}"
              VALUE="$RUNNER_TEMP/aws-candidate.json"
              if aws secretsmanager get-secret-value --secret-id "$name" --query SecretString --output text > "$VALUE" 2>/dev/null && jq -e 'type == "object"' "$VALUE" >/dev/null 2>&1; then
                jq -r 'keys[]' "$VALUE" | grep -Ei '^(MICROSOFT|AZURE|ENTRA).*(CLIENT|TENANT).*(ID|SECRET)?$|^(MICROSOFT|AZURE|ENTRA)_(CLIENT_ID|CLIENT_SECRET|TENANT_ID)$' | sort -u | sed 's/^/aws_candidate_key=/' || true
              fi
              rm -f "$VALUE"
            done < "$RUNNER_TEMP/candidates.txt"
          else
            echo 'aws_list_secrets_allowed=false'
          fi

      - name: Inspect Supabase Azure metadata without printing secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for ref in "$OREGON_SUPABASE_REF" "$VIRGINIA_SUPABASE_REF"; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${ref}/config/auth" \
              > "$RUNNER_TEMP/auth-${ref}.json"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          o = json.loads((tmp / f"auth-{os.environ['OREGON_SUPABASE_REF']}.json").read_text())
          v = json.loads((tmp / f"auth-{os.environ['VIRGINIA_SUPABASE_REF']}.json").read_text())
          print(f"oregon_azure_enabled={str(o.get('external_azure_enabled') is True).lower()}")
          print(f"virginia_azure_enabled={str(v.get('external_azure_enabled') is True).lower()}")
          print(f"azure_client_id_match={str(bool(o.get('external_azure_client_id')) and o.get('external_azure_client_id') == v.get('external_azure_client_id')).lower()}")
          print(f"azure_url_match={str(bool(o.get('external_azure_url')) and o.get('external_azure_url') == v.get('external_azure_url')).lower()}")
          print(f"oregon_azure_secret_field_present={str(bool(o.get('external_azure_secret'))).lower()}")
          print(f"virginia_azure_secret_field_present={str(bool(v.get('external_azure_secret'))).lower()}")
          print(f"azure_secret_fields_equal={str(bool(o.get('external_azure_secret')) and o.get('external_azure_secret') == v.get('external_azure_secret')).lower()}")
          PY

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.txt
