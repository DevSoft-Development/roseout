name: AWS Google API secret handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-google-places-secret-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  RUNTIME_SECRET_NAME: /theouthaven/production/edge-runtime/env
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em

jobs:
  handoff:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Copy validated Google API keys into AWS without logging values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured" >&2; exit 1; }
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

          VERCEL_ENV="$RUNNER_TEMP/vercel-env.json"
          RUNTIME="$RUNNER_TEMP/runtime.json"
          PLACES_RESPONSE="$RUNNER_TEMP/places-response.json"
          ENV_DETAIL="$RUNNER_TEMP/vercel-env-detail.json"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}" \
            > "$VERCEL_ENV"

          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_NAME" \
            --query SecretString \
            --output text > "$RUNTIME"
          jq -e 'type == "object"' "$RUNTIME" >/dev/null

          extract_candidate_ids() {
            local key="$1"
            jq -r --arg key "$key" '
              [.envs[] | select(.key == $key)] as $all
              | [$all[] | select(((.target // []) | index("production")) and ((.gitBranch // "") == ""))] as $prod
              | (if ($prod | length) > 0 then $prod else [$all[] | select((.gitBranch // "") == "")] end) as $candidates
              | (if ($candidates | length) > 0 then $candidates else $all end)
              | sort_by(.updatedAt // .createdAt // 0)
              | reverse
              | .[].id
            ' "$VERCEL_ENV"
          }

          fetch_env_value() {
            local env_id="$1"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/env/${env_id}?teamId=${VERCEL_TEAM_ID}" \
              > "$ENV_DETAIL"
            jq -r '.value // empty' "$ENV_DETAIL"
          }

          normalize_places_candidate() {
            local value="$1"
            value="$(printf '%s' "$value" | sed -e 's/\r$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            value="${value#GOOGLE_PLACES_API_KEY=}"
            value="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ "${value#\"}" != "$value" ] && [ "${value%\"}" != "$value" ]; then value="${value#\"}"; value="${value%\"}"; fi
            if [ "${value#\'}" != "$value" ] && [ "${value%\'}" != "$value" ]; then value="${value#\'}"; value="${value%\'}"; fi
            printf '%s' "$value"
          }

          mapfile -t PLACES_IDS < <(extract_candidate_ids GOOGLE_PLACES_API_KEY)
          test "${#PLACES_IDS[@]}" -gt 0 || { echo "GOOGLE_PLACES_API_KEY is not configured in Vercel" >&2; exit 1; }
          echo "google_places_candidate_count=${#PLACES_IDS[@]}"

          PLACES=""
          LAST_HTTP_STATUS=""
          LAST_ERROR_STATUS=""
          LAST_ERROR_MESSAGE=""
          INDEX=0
          for ENV_ID in "${PLACES_IDS[@]}"; do
            INDEX=$((INDEX + 1))
            RAW="$(fetch_env_value "$ENV_ID")"
            CANDIDATE="$(normalize_places_candidate "$RAW")"
            [ -n "$CANDIDATE" ] || { echo "google_places_candidate_${INDEX}_decrypted=false"; continue; }
            echo "::add-mask::$RAW"
            echo "::add-mask::$CANDIDATE"
            if [[ "$CANDIDATE" == AIza* ]]; then echo "google_places_candidate_${INDEX}_format_prefix_valid=true"; else echo "google_places_candidate_${INDEX}_format_prefix_valid=false"; fi
            echo "google_places_candidate_${INDEX}_length=${#CANDIDATE}"
            HTTP_STATUS="$(curl --silent --show-error --output "$PLACES_RESPONSE" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --header "X-Goog-Api-Key: $CANDIDATE" --header 'X-Goog-FieldMask: places.id' --data '{"textQuery":"Central Park New York","pageSize":1}' https://places.googleapis.com/v1/places:searchText)"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then PLACES="$CANDIDATE"; echo "google_places_candidate_selected=$INDEX"; break; fi
            LAST_HTTP_STATUS="$HTTP_STATUS"
            LAST_ERROR_STATUS="$(jq -r '.error.status // "UNKNOWN"' "$PLACES_RESPONSE" 2>/dev/null || echo UNKNOWN)"
            LAST_ERROR_MESSAGE="$(jq -r '.error.message // "No Google error message returned"' "$PLACES_RESPONSE" 2>/dev/null || echo 'No Google error message returned')"
            echo "google_places_candidate_${INDEX}_http_status=$HTTP_STATUS"
          done

          if [ -z "$PLACES" ]; then
            echo "google_places_http_status=${LAST_HTTP_STATUS:-UNKNOWN}"
            echo "google_places_error_status=${LAST_ERROR_STATUS:-UNKNOWN}"
            echo "google_places_error_message=${LAST_ERROR_MESSAGE:-No Google error message returned}"
            exit 1
          fi
          echo "google_places_validated=true"

          jq --arg value "$PLACES" '. + {GOOGLE_PLACES_API_KEY:$value}' "$RUNTIME" > "$RUNTIME.tmp"
          mv "$RUNTIME.tmp" "$RUNTIME"
          jq -e '.GOOGLE_PLACES_API_KEY | strings | length > 0' "$RUNTIME" >/dev/null

          aws secretsmanager put-secret-value --secret-id "$RUNTIME_SECRET_NAME" --secret-string "file://$RUNTIME" >/dev/null
          echo "google_places_synced=true"

          FN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EdgeRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$FN"
          aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json > "$RUNNER_TEMP/lambda-env.json"
          jq --arg refresh "$GITHUB_SHA" '{Variables: (. + {RUNTIME_SECRET_REFRESH:$refresh})}' "$RUNNER_TEMP/lambda-env.json" > "$RUNNER_TEMP/lambda-env-update.json"
          aws lambda update-function-configuration --function-name "$FN" --environment "file://$RUNNER_TEMP/lambda-env-update.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FN"
          echo "runtime_recycled=true"

          rm -f "$VERCEL_ENV" "$ENV_DETAIL" "$RUNTIME" "$PLACES_RESPONSE" "$RUNNER_TEMP/lambda-env.json" "$RUNNER_TEMP/lambda-env-update.json"
