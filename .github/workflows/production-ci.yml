name: Production CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
  SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key
  CRON_SECRET: dummy_cron_secret
  OPENAI_API_KEY: dummy_openai_key

jobs:
  quality:
    name: Typecheck, lint, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Edge search boundary
        run: npm run verify:edge-search-boundary

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  regressions:
    name: Business-critical regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Core search intent regression
        run: npm test

      - name: Search production regression
        run: npm run test:search-production

      - name: Enterprise search quality regression
        run: npm run test:search-quality

      - name: Search route regression
        run: npm run test:search-route-regression

      - name: Enterprise search unit tests
        run: npm run test:enterprise-search

      - name: Reserve regression tests
        run: npm run test:reserve

      - name: Billing production checks
        run: npm run test:billing-production

      - name: Beta production checks
        run: npm run test:beta-production-readiness

      - name: Beta guided-route checks
        run: npm run test:beta-guided-route

      - name: Location editor checks
        run: npm run test:location-editor

      - name: Public search intent checks
        run: npm run test:public-search-intent

  e2e:
    name: Required browser smoke tests
    needs:
      - quality
      - regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run required end-to-end tests
        run: npm run test:e2e:required

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
