name: Dependabot stable auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      - name: Enable gated auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "$PR_URL"
          {
            echo "### Dependabot stable auto-merge"
            echo
            echo "- Update type: ${{ steps.metadata.outputs.update-type }}"
            echo "- Auto-merge: enabled"
            echo "- Merge remains blocked until all branch protection and required checks pass."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep major updates manual
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          {
            echo "### Dependabot major update"
            echo
            echo "- Update type: version-update:semver-major"
            echo "- Auto-merge: disabled"
            echo "- Major upgrades require explicit review."
          } >> "$GITHUB_STEP_SUMMARY"
