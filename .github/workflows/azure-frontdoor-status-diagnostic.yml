name: Azure Front Door status diagnostic

on:
  push:
    branches:
      - fix/azure-frontdoor-deployment-status-diagnostics

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Print Front Door production states
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -euo pipefail
            RG=rg-toh-consumer-production
            DEPLOYMENT=toh-consumer-runtime-production
            PROFILE="$(az deployment sub show --name "$DEPLOYMENT" --query properties.outputs.consumerFrontDoorProfileName.value -o tsv)"
            EDGE="$(az deployment sub show --name "$DEPLOYMENT" --query properties.outputs.consumerFrontDoorEndpointHostName.value -o tsv)"
            ENDPOINT_NAME="$(az afd endpoint list --resource-group "$RG" --profile-name "$PROFILE" --query '[0].name' -o tsv)"
            ROUTE_NAME="$(az afd route list --resource-group "$RG" --profile-name "$PROFILE" --endpoint-name "$ENDPOINT_NAME" --query '[0].name' -o tsv)"
            echo "PROFILE=$PROFILE"
            echo "EDGE=$EDGE"
            echo "ENDPOINT_NAME=$ENDPOINT_NAME"
            echo "ROUTE_NAME=$ROUTE_NAME"
            echo "ENDPOINT_PROVISIONING=$(az afd endpoint show --resource-group "$RG" --profile-name "$PROFILE" --endpoint-name "$ENDPOINT_NAME" --query provisioningState -o tsv)"
            echo "ENDPOINT_DEPLOYMENT=$(az afd endpoint show --resource-group "$RG" --profile-name "$PROFILE" --endpoint-name "$ENDPOINT_NAME" --query deploymentStatus -o tsv)"
            echo "ROUTE_PROVISIONING=$(az afd route show --resource-group "$RG" --profile-name "$PROFILE" --endpoint-name "$ENDPOINT_NAME" --route-name "$ROUTE_NAME" --query provisioningState -o tsv)"
            echo "ROUTE_DEPLOYMENT=$(az afd route show --resource-group "$RG" --profile-name "$PROFILE" --endpoint-name "$ENDPOINT_NAME" --route-name "$ROUTE_NAME" --query deploymentStatus -o tsv)"
            code="$(curl --http1.1 --silent --show-error --dump-header edge.headers --output edge.body --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "https://$EDGE/api/health/azure" || true)"
            echo "HTTP_STATUS=$code"
            echo "--- HEADERS ---"
            cat edge.headers || true
            echo "--- BODY ---"
            cat edge.body || true
