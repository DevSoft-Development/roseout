name: AWS runtime mail environment parity

on:
  pull_request:
    paths:
      - '.github/workflows/aws-runtime-mail-env-parity.yml'
      - 'app/api/admin/cron-jobs/**'
      - 'lib/cron/controlPlane.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-runtime-mail-env-parity.yml'
  workflow_run:
    workflows: ["AWS edge runtime", "AWS background runtime"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-runtime-mail-env-parity-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  EDGE_RUNTIME_FUNCTION: toh-production-edge-runtime
  BACKGROUND_RUNTIME_FUNCTION: toh-production-background-runtime
  EDGE_RUNTIME_SECRET: /theouthaven/production/edge-runtime/env
  EDGE_RUNTIME_SECRET_REGION: us-east-1
  BACKGROUND_APP_ENV_SECRET: /theouthaven/production/platform-dr/app-env
  BACKGROUND_APP_ENV_SECRET_REGION: us-west-2
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_ORG_ID: team_TzlwC4vdLZiT8kFGuXSoj1em

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate mail parity contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-runtime-mail-env-parity.yml'
          grep -F 'RESEND_API_KEY' "$FILE" >/dev/null
          grep -F 'SEARCH_HEALTH_DIGEST_TO' "$FILE" >/dev/null
          grep -F 'MARKETING_PULSE_TO' "$FILE" >/dev/null
          grep -F 'PLATFORM_ERROR_DIGEST_TO' "$FILE" >/dev/null
          grep -F 'VERCEL_ORG_ID: team_TzlwC4vdLZiT8kFGuXSoj1em' "$FILE" >/dev/null
          grep -F '/theouthaven/production/edge-runtime/env' "$FILE" >/dev/null
          grep -F '/theouthaven/production/platform-dr/app-env' "$FILE" >/dev/null
          grep -F 'toh-production-edge-runtime' "$FILE" >/dev/null
          grep -F 'toh-production-background-runtime' "$FILE" >/dev/null
          grep -F 'id: sync_mail' "$FILE" >/dev/null
          grep -F 'edge_changed=false' "$FILE" >/dev/null
          grep -F 'background_changed=false' "$FILE" >/dev/null
          grep -F 'EDGE_CHANGED:' "$FILE" >/dev/null
          grep -F 'BACKGROUND_CHANGED:' "$FILE" >/dev/null
          grep -F 'sync_mail.outputs.edge_changed' "$FILE" >/dev/null
          grep -F 'sync_mail.outputs.background_changed' "$FILE" >/dev/null
          grep -F 'if [[ "$EDGE_CHANGED" == "true" ]]' "$FILE" >/dev/null
          grep -F 'if [[ "$BACKGROUND_CHANGED" == "true" ]]' "$FILE" >/dev/null
          grep -F 'awsCronSchedules' app/api/admin/cron-jobs/route.ts >/dev/null
          grep -F 'AWS EventBridge:' app/api/admin/cron-jobs/route.ts >/dev/null
          grep -F 'aws_schedule_count' app/api/admin/cron-jobs/route.ts >/dev/null
          grep -F 'infra/aws/edge-runtime/schedules.json' lib/cron/controlPlane.ts >/dev/null
          test "$(jq 'length' infra/aws/edge-runtime/schedules.json)" = '65'

  sync:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Pull production mail configuration without logging values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN is required for production mail parity.' >&2; exit 1; }
          mkdir -p .vercel
          jq -n --arg org "$VERCEL_TEAM_ID" --arg project "$VERCEL_PROJECT_ID" '{orgId:$org,projectId:$project}' > .vercel/project.json
          ENV_FILE="$RUNNER_TEMP/vercel-production.env"
          MAIL_JSON="$RUNNER_TEMP/mail-env.json"
          npx --yes vercel@59.3.0 env pull "$ENV_FILE" --environment=production --yes --token "$VERCEL_TOKEN" >/dev/null
          chmod 600 "$ENV_FILE"

          ENV_FILE="$ENV_FILE" MAIL_JSON="$MAIL_JSON" python <<'PY'
          import json
          import os
          from pathlib import Path

          allowed = {
              'RESEND_API_KEY',
              'RESEND_FROM_EMAIL',
              'ADMIN_EMAIL',
              'SUPERADMIN_EMAIL',
              'ADMIN_ALERT_EMAIL',
              'ADMIN_DIGEST_EMAIL',
              'ADMIN_RESERVATION_DIGEST_EMAIL',
              'SEARCH_HEALTH_DIGEST_TO',
              'MARKETING_PULSE_TO',
              'PLATFORM_ERROR_DIGEST_TO',
              'THEOUTHAVEN_ADMIN_EMAIL',
          }
          values = {}
          for raw_line in Path(os.environ['ENV_FILE']).read_text(encoding='utf-8').splitlines():
              line = raw_line.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, raw = line.split('=', 1)
              key = key.strip()
              if key not in allowed:
                  continue
              raw = raw.strip()
              try:
                  value = json.loads(raw) if raw.startswith('"') else raw.strip("'")
              except json.JSONDecodeError:
                  value = raw.strip('"').strip("'")
              if isinstance(value, str) and value:
                  values[key] = value
          if not values.get('RESEND_API_KEY'):
              raise SystemExit('Production Vercel environment is missing RESEND_API_KEY.')
          if not any(values.get(key) for key in ('ADMIN_EMAIL', 'SUPERADMIN_EMAIL', 'THEOUTHAVEN_ADMIN_EMAIL')):
              raise SystemExit('Production Vercel environment is missing an admin mail recipient fallback.')
          Path(os.environ['MAIL_JSON']).write_text(json.dumps(values, separators=(',', ':')), encoding='utf-8')
          PY
          chmod 600 "$MAIL_JSON"
          while IFS= read -r value; do
            [ -z "$value" ] || echo "::add-mask::$value"
          done < <(jq -r '.[]' "$MAIL_JSON")
          rm -f "$ENV_FILE"

      - name: Synchronize mail configuration into AWS runtime secrets
        id: sync_mail
        run: |
          set -euo pipefail
          MAIL_JSON="$RUNNER_TEMP/mail-env.json"
          sync_secret() {
            local region="$1" secret="$2" label="$3"
            local current="$RUNNER_TEMP/${label}-current.json"
            local merged="$RUNNER_TEMP/${label}-merged.json"
            aws secretsmanager get-secret-value --region "$region" --secret-id "$secret" --query SecretString --output text > "$current"
            chmod 600 "$current"
            jq -e 'type == "object"' "$current" >/dev/null
            CURRENT="$current" MAIL="$MAIL_JSON" OUTPUT="$merged" python <<'PY'
          import json
          import os
          from pathlib import Path

          current = json.loads(Path(os.environ['CURRENT']).read_text(encoding='utf-8'))
          mail = json.loads(Path(os.environ['MAIL']).read_text(encoding='utf-8'))
          if not isinstance(current, dict) or not isinstance(mail, dict):
              raise SystemExit('Runtime mail parity input must be JSON objects.')
          merged = dict(current)
          merged.update({key: value for key, value in mail.items() if isinstance(value, str) and value})
          Path(os.environ['OUTPUT']).write_text(json.dumps(merged, separators=(',', ':'), sort_keys=True), encoding='utf-8')
          PY
            chmod 600 "$merged"
            jq -e '.RESEND_API_KEY | strings | length > 0' "$merged" >/dev/null

            if cmp -s <(jq -S -c . "$current") <(jq -S -c . "$merged"); then
              echo "${label}_changed=false" >> "$GITHUB_OUTPUT"
              echo "${label}_mail_secret=unchanged"
            else
              aws secretsmanager put-secret-value --region "$region" --secret-id "$secret" --secret-string "file://$merged" --query VersionId --output text >/dev/null
              echo "${label}_changed=true" >> "$GITHUB_OUTPUT"
              echo "${label}_mail_secret=synchronized"
            fi
            rm -f "$current" "$merged"
          }
          sync_secret "$EDGE_RUNTIME_SECRET_REGION" "$EDGE_RUNTIME_SECRET" edge
          sync_secret "$BACKGROUND_APP_ENV_SECRET_REGION" "$BACKGROUND_APP_ENV_SECRET" background
          rm -f "$MAIL_JSON"

      - name: Refresh only runtime generations whose mail secret changed
        env:
          EDGE_CHANGED: ${{ steps.sync_mail.outputs.edge_changed }}
          BACKGROUND_CHANGED: ${{ steps.sync_mail.outputs.background_changed }}
        run: |
          set -euo pipefail
          refresh_function() {
            local function_name="$1" label="$2"
            local vars="$RUNNER_TEMP/${label}-vars.json"
            local envdoc="$RUNNER_TEMP/${label}-env.json"
            aws lambda get-function-configuration --region "$AWS_REGION" --function-name "$function_name" --query 'Environment.Variables' --output json > "$vars"
            jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${label}" '{Variables:(. + {MAIL_ENV_REFRESH_TOKEN:$token})}' "$vars" > "$envdoc"
            aws lambda update-function-configuration --region "$AWS_REGION" --function-name "$function_name" --environment "file://$envdoc" >/dev/null
            aws lambda wait function-updated-v2 --region "$AWS_REGION" --function-name "$function_name"
            rm -f "$vars" "$envdoc"
            echo "${label}_runtime_generation=refreshed"
          }

          if [[ "$EDGE_CHANGED" == "true" ]]; then
            refresh_function "$EDGE_RUNTIME_FUNCTION" edge
          else
            echo 'edge_runtime_generation=unchanged'
          fi

          if [[ "$BACKGROUND_CHANGED" == "true" ]]; then
            refresh_function "$BACKGROUND_RUNTIME_FUNCTION" background
          else
            echo 'background_runtime_generation=unchanged'
          fi

      - name: Prove runtime secret mail parity and background health
        run: |
          set -euo pipefail
          for spec in \
            "$EDGE_RUNTIME_SECRET_REGION|$EDGE_RUNTIME_SECRET|edge" \
            "$BACKGROUND_APP_ENV_SECRET_REGION|$BACKGROUND_APP_ENV_SECRET|background"; do
            IFS='|' read -r region secret label <<< "$spec"
            file="$RUNNER_TEMP/${label}-proof.json"
            aws secretsmanager get-secret-value --region "$region" --secret-id "$secret" --query SecretString --output text > "$file"
            jq -e '.RESEND_API_KEY | strings | length > 0' "$file" >/dev/null
            jq -e '((.ADMIN_EMAIL // .SUPERADMIN_EMAIL // .THEOUTHAVEN_ADMIN_EMAIL // "") | strings | length > 0)' "$file" >/dev/null
            rm -f "$file"
            echo "${label}_mail_secret=ready"
          done

          EVENT="$RUNNER_TEMP/background-health-event.json"
          RESPONSE="$RUNNER_TEMP/background-health-response.json"
          cat > "$EVENT" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"mail-parity"},"requestContext":{"accountId":"mail-parity","apiId":"mail-parity","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"mail-parity","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"02/Sep/2026:00:00:00 +0000","timeEpoch":1788307200000},"isBase64Encoded":false}
          JSON
          healthy=0
          for attempt in 1 2 3 4; do
            rm -f "$RESPONSE"
            if aws lambda invoke --region "$AWS_REGION" --function-name "$BACKGROUND_RUNTIME_FUNCTION" --cli-binary-format raw-in-base64-out --payload "fileb://$EVENT" "$RESPONSE" >/dev/null 2>&1 && \
               jq -e '.statusCode == 200 and (.body | fromjson | .ok == true and .runtime == "aws-background" and .database == "ok")' "$RESPONSE" >/dev/null 2>&1; then
              healthy=1
              echo "background_runtime_health=passed attempt=${attempt}"
              break
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
          done
          test "$healthy" = '1' || { echo 'Background runtime health proof failed after mail parity synchronization.' >&2; exit 1; }
