name: Apply Stamps AWS migration patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/dev/apply_stamps_aws_migration.py'
      - '.github/workflows/stamps-aws-migration-patch.yml'

permissions:
  contents: write

concurrency:
  group: stamps-aws-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply migration and safety checks
        run: |
          set -euo pipefail
          python scripts/dev/apply_stamps_aws_migration.py
          python scripts/dev/finalize_stamps_aws_migration.py
          python -m py_compile infra/aws/lambda/platform_integration_api.py
          python -m py_compile infra/aws/lambda/stamps_provider.py

      - name: Commit generated migration and remove temporary machinery
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f \
            scripts/dev/apply_stamps_aws_migration.py \
            scripts/dev/finalize_stamps_aws_migration.py \
            .github/workflows/stamps-aws-migration-patch.yml \
            stamps-patch-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Move Stamps production execution to AWS Integration API"
          git push origin "HEAD:${HEAD_BRANCH}"
