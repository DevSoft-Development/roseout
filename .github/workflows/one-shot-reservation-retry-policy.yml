name: One-shot reservation retry policy patch

on:
  push:
    branches: [fix/location-intelligence-reservation-retry-policy]
    paths:
      - '.github/workflows/one-shot-reservation-retry-policy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-intelligence-reservation-retry-policy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch retry policy and validate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'supabase/functions/unified-location-gap-repair/index.ts';
          let s = fs.readFileSync(path, 'utf8');
          const replace = (from, to) => {
            if (!s.includes(from)) throw new Error(`expected source fragment not found: ${from}`);
            s = s.replace(from, to);
          };
          replace('["failed", "blocked"].includes(reservationStatus) || retryNoWebsite || unclassifiedWithWebsite', '["failed", "blocked", "not_found"].includes(reservationStatus) || retryNoWebsite || unclassifiedWithWebsite');
          replace('["failed", "blocked"].includes(reservationStatus) || retryNoWebsite || unclassifiedWithWebsite);', '["failed", "blocked", "not_found"].includes(reservationStatus) || retryNoWebsite || unclassifiedWithWebsite);');
          replace('reservationProviderCounts: {} as Record<string, number>, reservationRetryFailed: 0, reservationRetryBlocked: 0, reservationRetryNoWebsite: 0,', 'reservationProviderCounts: {} as Record<string, number>, reservationRetryFailed: 0, reservationRetryBlocked: 0, reservationRetryNotFound: 0, reservationRetryNoWebsite: 0,');
          replace('if (reservationStatus === "failed") counters.reservationRetryFailed += 1;\n        else if (reservationStatus === "blocked") counters.reservationRetryBlocked += 1;\n        else if (retryNoWebsite) counters.reservationRetryNoWebsite += 1;', 'if (reservationStatus === "failed") counters.reservationRetryFailed += 1;\n        else if (reservationStatus === "blocked") counters.reservationRetryBlocked += 1;\n        else if (reservationStatus === "not_found") counters.reservationRetryNotFound += 1;\n        else if (retryNoWebsite) counters.reservationRetryNoWebsite += 1;');
          replace('} else if (discovery.status === "not_found") counters.reservationNotFound += 1;\n          else if (discovery.status === "blocked") { counters.reservationBlocked += 1; retryHours = 24 * 7; }\n          else { counters.reservationFailed += 1; retryHours = 24; }', '} else if (discovery.status === "not_found") { counters.reservationNotFound += 1; retryHours = 24 * 7; }\n          else if (discovery.status === "blocked") { counters.reservationBlocked += 1; retryHours = 24 * 30; }\n          else { counters.reservationFailed += 1; retryHours = 24 * 7; }');
          fs.writeFileSync(path, s);
          NODE
          grep -F '["failed", "blocked", "not_found"].includes(reservationStatus)' supabase/functions/unified-location-gap-repair/index.ts >/dev/null
          grep -F 'reservationRetryNotFound: 0' supabase/functions/unified-location-gap-repair/index.ts >/dev/null
          grep -F 'retryHours = 24 * 30' supabase/functions/unified-location-gap-repair/index.ts >/dev/null
          grep -F 'retryHours = 24 * 7' supabase/functions/unified-location-gap-repair/index.ts >/dev/null
      - name: Commit patch and remove runner
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-reservation-retry-policy.yml
          git config user.name 'roseoutllc'
          git config user.email 'nick@roseout.com'
          git add supabase/functions/unified-location-gap-repair/index.ts .github/workflows/one-shot-reservation-retry-policy.yml
          git commit -m 'fix: align reservation discovery retry cadence'
          git push origin HEAD:fix/location-intelligence-reservation-retry-policy
