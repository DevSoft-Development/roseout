name: Stamps redacted fault diagnostic

on:
  push:
    branches:
      - fix/stamps-credential-test-diagnostic
    paths:
      - '.github/workflows/stamps-fault-message-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: '742020474738'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve AWS role
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: echo "role_arn=${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}" >> "$GITHUB_OUTPUT"
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Capture redacted fault only
        run: |
          set -euo pipefail
          SECRET_ID='/theouthaven/credential-vault/production/stamps'
          SECRET_FILE="$RUNNER_TEMP/stamps-secret.json"
          aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text > "$SECRET_FILE"
          for key in integrationId username password; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' "$SECRET_FILE")"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
          STAMPS_SECRET_FILE="$SECRET_FILE" python - <<'PY'
          import html, json, os, re, urllib.error, urllib.request, xml.etree.ElementTree as ET
          endpoint='https://swsim.stamps.com/swsim/swsimv160.asmx'
          namespace='http://stamps.com/xml/namespace/2026/06/swsim/SwsimV160'
          with open(os.environ['STAMPS_SECRET_FILE'], encoding='utf-8') as handle:
              secret=json.load(handle)
          def esc(v): return html.escape(str(v or ''), quote=True)
          body=(
              '<?xml version="1.0" encoding="utf-8"?>'
              f'<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:sws="{namespace}">'
              '<soapenv:Header/><soapenv:Body><sws:GetAccountInfo><sws:Credentials>'
              f'<sws:IntegrationID>{esc(secret.get("integrationId"))}</sws:IntegrationID>'
              f'<sws:Username>{esc(secret.get("username"))}</sws:Username>'
              f'<sws:Password>{esc(secret.get("password"))}</sws:Password>'
              '</sws:Credentials></sws:GetAccountInfo></soapenv:Body></soapenv:Envelope>'
          ).encode('utf-8')
          req=urllib.request.Request(endpoint,data=body,method='POST',headers={'Content-Type':'text/xml; charset=utf-8','SOAPAction':f'"{namespace}/GetAccountInfo"','User-Agent':'TheOutHaven/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  status=r.status; payload=r.read(2_000_001)
          except urllib.error.HTTPError as exc:
              status=exc.code; payload=exc.read(2_000_001)
          text=payload.decode('utf-8',errors='replace')
          for value in secret.values():
              if isinstance(value,str) and value:
                  text=text.replace(value,'[REDACTED]')
          text=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}','[EMAIL_REDACTED]',text)
          print(f'http_status={status}')
          try:
              root=ET.fromstring(text)
          except ET.ParseError:
              print('fault_message=unparseable_xml')
              raise SystemExit(0)
          messages=[]
          for elem in root.iter():
              tag=elem.tag.split('}',1)[-1].lower()
              value=' '.join((elem.text or '').split())
              if tag in {'faultstring','message','description','errordescription','reason'} and value:
                  if len(value)>240: value=value[:240]+'…'
                  messages.append(value)
          safe=[]
          for value in messages:
              if '[REDACTED]' in value or '[EMAIL_REDACTED]' in value:
                  value=value.replace('[REDACTED]','[SECRET]').replace('[EMAIL_REDACTED]','[EMAIL]')
              safe.append(value)
          print('fault_messages=' + ' | '.join(dict.fromkeys(safe)) if safe else 'fault_messages=none')
          PY
          rm -f "$SECRET_FILE"
