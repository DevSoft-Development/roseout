name: AWS integration API

on:
  pull_request:
    paths:
      - 'infra/aws/lambda/platform_integration_api.py'
      - 'infra/aws/lambda/google_places_provider.py'
      - 'infra/aws/lambda/telnyx_provider.py'
      - 'infra/aws/cloudformation/integration-api.yml'
      - 'lib/aws/integration-api.ts'
      - 'lib/microsoft-365/graph.ts'
      - 'lib/google/places-new-client.ts'
      - 'lib/google/place-photo-slots.ts'
      - 'lib/sms/telnyx.ts'
      - 'app/api/public/google-place-photo/route.ts'
      - 'app/api/admin/crm/sms/send/route.ts'
      - 'app/api/admin/crm/sms/reply/route.ts'
      - '.github/workflows/aws-integration-api.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/aws/lambda/platform_integration_api.py'
      - 'infra/aws/lambda/google_places_provider.py'
      - 'infra/aws/lambda/telnyx_provider.py'
      - 'infra/aws/cloudformation/integration-api.yml'
      - 'lib/aws/integration-api.ts'
      - 'lib/microsoft-365/graph.ts'
      - 'lib/google/places-new-client.ts'
      - 'lib/google/place-photo-slots.ts'
      - 'lib/sms/telnyx.ts'
      - 'app/api/public/google-place-photo/route.ts'
      - 'app/api/admin/crm/sms/send/route.ts'
      - 'app/api/admin/crm/sms/reply/route.ts'
      - '.github/workflows/aws-integration-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: production
        options:
          - staging
          - production
      deploy:
        description: Deploy after validation
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-integration-api-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  TEMPLATE_FILE: infra/aws/cloudformation/integration-api.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Integration API Python syntax
        run: |
          python -m py_compile infra/aws/lambda/platform_integration_api.py
          python -m py_compile infra/aws/lambda/google_places_provider.py
          python -m py_compile infra/aws/lambda/telnyx_provider.py

      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint

      - name: Lint Integration API CloudFormation
        run: cfn-lint "$TEMPLATE_FILE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck Integration API wiring
        run: npm run typecheck

  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment configuration
        id: config
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          INTEGRATION_API_SECRET: ${{ secrets.AWS_PLATFORM_INTEGRATION_API_SECRET }}
          JOB_GATEWAY_SECRET: ${{ secrets.AWS_PLATFORM_JOB_GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          TARGET_ENV="${INPUT_ENV:-production}"
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          SHARED_SECRET="${INTEGRATION_API_SECRET:-$JOB_GATEWAY_SECRET}"
          test -n "$SHARED_SECRET" || { echo "Missing AWS integration API secret and AWS_PLATFORM_JOB_GATEWAY_SECRET fallback" >&2; exit 1; }
          test "${#SHARED_SECRET}" -ge 32 || { echo "Integration API shared secret must be at least 32 characters" >&2; exit 1; }
          echo "::add-mask::$SHARED_SECRET"
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          printf '%s' "$SHARED_SECRET" > "$RUNNER_TEMP/integration-api-secret"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || { echo "Wrong AWS account: $ACCOUNT" >&2; exit 1; }

      - name: Deploy Integration API stack
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          SHARED_SECRET="$(cat "$RUNNER_TEMP/integration-api-secret")"
          aws cloudformation deploy \
            --stack-name "theouthaven-integration-api-${TARGET_ENV}" \
            --template-file "$TEMPLATE_FILE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$TARGET_ENV" \
              IntegrationApiSharedSecret="$SHARED_SECRET" \
            --tags Project=TheOutHaven Environment="$TARGET_ENV" Service=IntegrationAPI ManagedBy=CloudFormation

      - name: Show CloudFormation failure events
        if: failure()
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "theouthaven-integration-api-${TARGET_ENV}" \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' \
            --output table || true

      - name: Verify or rotate dedicated Stripe credential
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
          CONFIGURED_STRIPE_SECRET: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          STACK="theouthaven-integration-api-${TARGET_ENV}"
          STRIPE_SECRET_ARN="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiStripeSecretArn'].OutputValue" --output text)"
          test -n "$STRIPE_SECRET_ARN" && test "$STRIPE_SECRET_ARN" != "None"

          if [ -n "$CONFIGURED_STRIPE_SECRET" ]; then
            test "${#CONFIGURED_STRIPE_SECRET}" -ge 16 || { echo "Configured Stripe secret is too short" >&2; exit 1; }
            echo "::add-mask::$CONFIGURED_STRIPE_SECRET"
            aws secretsmanager put-secret-value \
              --secret-id "$STRIPE_SECRET_ARN" \
              --secret-string "$CONFIGURED_STRIPE_SECRET" >/dev/null
          else
            EXISTING_STRIPE_KEY="$(aws secretsmanager get-secret-value --secret-id "$STRIPE_SECRET_ARN" --query SecretString --output text)"
            test "${#EXISTING_STRIPE_KEY}" -ge 16 || { echo "Existing dedicated Stripe secret is not configured" >&2; exit 1; }
            echo "::add-mask::$EXISTING_STRIPE_KEY"
            unset EXISTING_STRIPE_KEY
          fi

      - name: Verify or rotate dedicated Google Places credential
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
          CONFIGURED_GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -euo pipefail
          STACK="theouthaven-integration-api-${TARGET_ENV}"
          GOOGLE_SECRET_ARN="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiGooglePlacesSecretArn'].OutputValue" --output text)"
          test -n "$GOOGLE_SECRET_ARN" && test "$GOOGLE_SECRET_ARN" != "None"

          GOOGLE_KEY=""
          GOOGLE_SOURCE=""
          if [ -n "$CONFIGURED_GOOGLE_PLACES_KEY" ]; then
            GOOGLE_KEY="$CONFIGURED_GOOGLE_PLACES_KEY"
            GOOGLE_SOURCE="github-environment"
          else
            RUNTIME_SECRET_NAME="/theouthaven/${TARGET_ENV}/edge-runtime/env"
            if aws secretsmanager describe-secret --secret-id "$RUNTIME_SECRET_NAME" >/dev/null 2>&1; then
              RUNTIME_JSON="$(aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET_NAME" --query SecretString --output text)"
              GOOGLE_KEY="$(printf '%s' "$RUNTIME_JSON" | jq -r '.GOOGLE_PLACES_API_KEY // empty' 2>/dev/null || true)"
              unset RUNTIME_JSON
              if [ -n "$GOOGLE_KEY" ]; then
                GOOGLE_SOURCE="aws-edge-runtime"
              fi
            fi
          fi

          if [ -z "$GOOGLE_KEY" ]; then
            EXISTING_GOOGLE_KEY="$(aws secretsmanager get-secret-value --secret-id "$GOOGLE_SECRET_ARN" --query SecretString --output text)"
            if [ -n "$EXISTING_GOOGLE_KEY" ] && [ "$EXISTING_GOOGLE_KEY" != "__UNCONFIGURED_GOOGLE_PLACES__" ]; then
              GOOGLE_KEY="$EXISTING_GOOGLE_KEY"
              GOOGLE_SOURCE="existing-dedicated-secret"
            fi
            unset EXISTING_GOOGLE_KEY
          fi

          test "${#GOOGLE_KEY}" -ge 20 || { echo "Google Places key is not configured in GitHub, AWS edge runtime, or the dedicated Integration secret" >&2; exit 1; }
          echo "::add-mask::$GOOGLE_KEY"
          if [ "$GOOGLE_SOURCE" != "existing-dedicated-secret" ]; then
            aws secretsmanager put-secret-value \
              --secret-id "$GOOGLE_SECRET_ARN" \
              --secret-string "$GOOGLE_KEY" >/dev/null
          fi
          echo "google_places_credential_source=$GOOGLE_SOURCE"
          unset GOOGLE_KEY

      - name: Sync dedicated Telnyx channel configuration
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          STACK="theouthaven-integration-api-${TARGET_ENV}"
          TELNYX_SECRET_ARN="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiTelnyxSecretArn'].OutputValue" --output text)"
          test -n "$TELNYX_SECRET_ARN" && test "$TELNYX_SECRET_ARN" != "None"

          EXISTING_TELNYX_FILE="$RUNNER_TEMP/telnyx-existing.json"
          aws secretsmanager get-secret-value --secret-id "$TELNYX_SECRET_ARN" --query SecretString --output text > "$EXISTING_TELNYX_FILE"
          if jq -e '
            (.channels.concierge.apiKey | strings | length >= 20)
            and (.channels.crm.apiKey | strings | length >= 20)
            and (.channels.reservations.apiKey | strings | length >= 20)
            and (.channels.support.apiKey | strings | length >= 20)
            and (.channels.concierge.from | strings | length > 0)
            and (.channels.crm.from | strings | length > 0)
            and (.channels.reservations.from | strings | length > 0)
            and (.channels.support.from | strings | length > 0)
          ' "$EXISTING_TELNYX_FILE" >/dev/null 2>&1; then
            echo "Dedicated Telnyx secret already configured; leaving it authoritative."
            rm -f "$EXISTING_TELNYX_FILE"
            exit 0
          fi
          rm -f "$EXISTING_TELNYX_FILE"

          RUNTIME_SECRET_NAME="/theouthaven/${TARGET_ENV}/edge-runtime/env"
          test "$(aws secretsmanager describe-secret --secret-id "$RUNTIME_SECRET_NAME" --query Name --output text)" = "$RUNTIME_SECRET_NAME"
          RUNTIME_FILE="$RUNNER_TEMP/telnyx-runtime.json"
          CONFIG_FILE="$RUNNER_TEMP/telnyx-config.json"
          aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET_NAME" --query SecretString --output text > "$RUNTIME_FILE"
          jq -e 'type == "object"' "$RUNTIME_FILE" >/dev/null

          first_value() {
            local expression="$1"
            jq -r "$expression | map(select(type == \"string\" and length > 0)) | .[0] // empty" "$RUNTIME_FILE"
          }

          TRANSACTIONAL_KEY="$(first_value '[.TELNYX_TRANSACTIONAL_API_KEY,.TELNYX_API_KEY]')"
          CONCIERGE_KEY="$(first_value '[.TELNYX_CONCIERGE_API_KEY,.TELNYX_TRANSACTIONAL_API_KEY,.TELNYX_API_KEY]')"
          CRM_KEY="$(first_value '[.TELNYX_CRM_API_KEY,.TELNYX_TRANSACTIONAL_API_KEY,.TELNYX_API_KEY]')"
          RESERVATIONS_KEY="$(first_value '[.TELNYX_RESERVATIONS_API_KEY,.TELNYX_TRANSACTIONAL_API_KEY,.TELNYX_API_KEY]')"
          SUPPORT_KEY="$(first_value '[.TELNYX_SUPPORT_API_KEY,.TELNYX_TRANSACTIONAL_API_KEY,.TELNYX_API_KEY]')"
          MARKETING_KEY="$(first_value '[.TELNYX_MARKETING_API_KEY]')"

          CONCIERGE_FROM="$(first_value '[.TELNYX_CONCIERGE_PHONE_NUMBER]')"
          CRM_FROM="$(first_value '[.TELNYX_CRM_PHONE_NUMBER]')"
          RESERVATIONS_FROM="$(first_value '[.TELNYX_RESERVATIONS_PHONE_NUMBER,.TELNYX_TRANSACTIONAL_PHONE_NUMBER]')"
          SUPPORT_FROM="$(first_value '[.TELNYX_SUPPORT_PHONE_NUMBER]')"
          MARKETING_FROM="$(first_value '[.TELNYX_MARKETING_PHONE_NUMBER]')"

          test "${#CONCIERGE_KEY}" -ge 20 || { echo "Telnyx concierge/transactional credential is missing from AWS runtime secret" >&2; exit 1; }
          test "${#CRM_KEY}" -ge 20 || { echo "Telnyx CRM/transactional credential is missing from AWS runtime secret" >&2; exit 1; }
          test "${#RESERVATIONS_KEY}" -ge 20 || { echo "Telnyx reservations/transactional credential is missing from AWS runtime secret" >&2; exit 1; }
          test "${#SUPPORT_KEY}" -ge 20 || { echo "Telnyx support/transactional credential is missing from AWS runtime secret" >&2; exit 1; }
          test -n "$CONCIERGE_FROM" && test -n "$CRM_FROM" && test -n "$RESERVATIONS_FROM" && test -n "$SUPPORT_FROM"
          for value in "$TRANSACTIONAL_KEY" "$CONCIERGE_KEY" "$CRM_KEY" "$RESERVATIONS_KEY" "$SUPPORT_KEY" "$MARKETING_KEY"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

          jq -n \
            --arg conciergeKey "$CONCIERGE_KEY" --arg conciergeFrom "$CONCIERGE_FROM" \
            --arg crmKey "$CRM_KEY" --arg crmFrom "$CRM_FROM" \
            --arg reservationsKey "$RESERVATIONS_KEY" --arg reservationsFrom "$RESERVATIONS_FROM" \
            --arg supportKey "$SUPPORT_KEY" --arg supportFrom "$SUPPORT_FROM" \
            --arg marketingKey "$MARKETING_KEY" --arg marketingFrom "$MARKETING_FROM" \
            '{version:1,channels:{
              concierge:{apiKey:$conciergeKey,from:$conciergeFrom},
              crm:{apiKey:$crmKey,from:$crmFrom},
              reservations:{apiKey:$reservationsKey,from:$reservationsFrom},
              support:{apiKey:$supportKey,from:$supportFrom}
            }}
            | if ($marketingKey|length) >= 20 and ($marketingFrom|length) > 0
              then .channels.marketing={apiKey:$marketingKey,from:$marketingFrom}
              else .
              end' > "$CONFIG_FILE"
          jq -e '.channels | has("concierge") and has("crm") and has("reservations") and has("support")' "$CONFIG_FILE" >/dev/null

          aws secretsmanager put-secret-value \
            --secret-id "$TELNYX_SECRET_ARN" \
            --secret-string "file://$CONFIG_FILE" >/dev/null
          rm -f "$RUNTIME_FILE" "$CONFIG_FILE"
          unset TRANSACTIONAL_KEY CONCIERGE_KEY CRM_KEY RESERVATIONS_KEY SUPPORT_KEY MARKETING_KEY

      - name: Build Integration API Lambda package
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/integration-api"
          ZIP_FILE="$RUNNER_TEMP/integration-api.zip"
          rm -rf "$BUILD_DIR" "$ZIP_FILE"
          mkdir -p "$BUILD_DIR"
          cp infra/aws/lambda/platform_integration_api.py "$BUILD_DIR/index.py"
          cp infra/aws/lambda/google_places_provider.py "$BUILD_DIR/google_places_provider.py"
          cp infra/aws/lambda/telnyx_provider.py "$BUILD_DIR/telnyx_provider.py"
          (cd "$BUILD_DIR" && zip -qr "$ZIP_FILE" .)
          test -s "$ZIP_FILE"

      - name: Deploy Integration API Lambda code
        id: runtime
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          STACK="theouthaven-integration-api-${TARGET_ENV}"
          FUNCTION_NAME="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiFunctionName'].OutputValue" --output text)"
          API_URL="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiUrl'].OutputValue" --output text)"
          test -n "$FUNCTION_NAME" && test "$FUNCTION_NAME" != "None"
          test -n "$API_URL" && test "$API_URL" != "None"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$RUNNER_TEMP/integration-api.zip" >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "function_name=$FUNCTION_NAME" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Verify authenticated Integration API providers
        env:
          API_URL: ${{ steps.runtime.outputs.api_url }}
        run: |
          set -euo pipefail
          SECRET="$(cat "$RUNNER_TEMP/integration-api-secret")"
          BASE_URL="${API_URL%/}"

          signed_get() {
            local path_value="$1"
            local response_file="$2"
            local timestamp signature
            timestamp="$(python - <<'PY'
          import time
          print(int(time.time() * 1000))
          PY
            )"
            signature="$(SECRET="$SECRET" TIMESTAMP="$timestamp" PATH_VALUE="$path_value" python - <<'PY'
          import hashlib, hmac, os
          canonical = '\n'.join([os.environ['TIMESTAMP'], 'GET', os.environ['PATH_VALUE'], ''])
          print(hmac.new(os.environ['SECRET'].encode(), canonical.encode(), hashlib.sha256).hexdigest())
          PY
            )"
            curl --fail --silent --show-error \
              --header "x-toh-timestamp: $timestamp" \
              --header "x-toh-signature: $signature" \
              "$BASE_URL$path_value" > "$response_file"
          }

          signed_post() {
            local path_value="$1"
            local body_value="$2"
            local response_file="$3"
            local header_file="${4:-}"
            local timestamp signature
            timestamp="$(python - <<'PY'
          import time
          print(int(time.time() * 1000))
          PY
            )"
            signature="$(SECRET="$SECRET" TIMESTAMP="$timestamp" PATH_VALUE="$path_value" BODY_VALUE="$body_value" python - <<'PY'
          import hashlib, hmac, os
          canonical = '\n'.join([os.environ['TIMESTAMP'], 'POST', os.environ['PATH_VALUE'], os.environ['BODY_VALUE']])
          print(hmac.new(os.environ['SECRET'].encode(), canonical.encode(), hashlib.sha256).hexdigest())
          PY
            )"
            CURL_ARGS=(
              --fail --silent --show-error
              --request POST
              --header 'content-type: application/json'
              --header "x-toh-timestamp: $timestamp"
              --header "x-toh-signature: $signature"
              --data "$body_value"
            )
            if [ -n "$header_file" ]; then CURL_ARGS+=(--dump-header "$header_file"); fi
            curl "${CURL_ARGS[@]}" "$BASE_URL$path_value" > "$response_file"
          }

          signed_get "/v1/status" "$RUNNER_TEMP/integration-status.json"
          signed_get "/v1/stripe/status" "$RUNNER_TEMP/integration-stripe-status.json"
          signed_get "/v1/google-places/status" "$RUNNER_TEMP/integration-google-status.json"
          signed_get "/v1/telnyx/status" "$RUNNER_TEMP/integration-telnyx-status.json"
          signed_get "/v1/telnyx/verify" "$RUNNER_TEMP/integration-telnyx-verify.json"

          SEARCH_BODY='{"textQuery":"Central Park New York","pageSize":1,"regionCode":"US"}'
          signed_post "/v1/google-places/search-text" "$SEARCH_BODY" "$RUNNER_TEMP/google-search.json"
          PLACE_ID="$(jq -r '.places[0].id // empty' "$RUNNER_TEMP/google-search.json")"
          test -n "$PLACE_ID" || { echo "Google Places search smoke returned no place id" >&2; cat "$RUNNER_TEMP/google-search.json" >&2; exit 1; }

          DETAILS_BODY="$(jq -nc --arg placeId "$PLACE_ID" '{placeId:$placeId}')"
          signed_post "/v1/google-places/details" "$DETAILS_BODY" "$RUNNER_TEMP/google-details.json"
          signed_post "/v1/google-places/photo-metadata" "$DETAILS_BODY" "$RUNNER_TEMP/google-photos.json"
          PHOTO_NAME="$(jq -r '.photos[0].name // empty' "$RUNNER_TEMP/google-photos.json")"
          test -n "$PHOTO_NAME" || { echo "Google Places photo metadata smoke returned no photo" >&2; cat "$RUNNER_TEMP/google-photos.json" >&2; exit 1; }

          MEDIA_BODY="$(jq -nc --arg photoName "$PHOTO_NAME" '{photoName:$photoName,maxWidthPx:64}')"
          signed_post "/v1/google-places/photo-media" "$MEDIA_BODY" "$RUNNER_TEMP/google-photo.bin" "$RUNNER_TEMP/google-photo.headers"
          test -s "$RUNNER_TEMP/google-photo.bin" || { echo "Google Places photo media smoke returned an empty body" >&2; exit 1; }
          grep -Eiq '^content-type:[[:space:]]*image/' "$RUNNER_TEMP/google-photo.headers" || { echo "Google Places photo media smoke did not return an image" >&2; cat "$RUNNER_TEMP/google-photo.headers" >&2; exit 1; }

          python - <<'PY'
          import json, os
          root = os.environ['RUNNER_TEMP']
          with open(root + '/integration-status.json') as handle:
              payload = json.load(handle)
          with open(root + '/integration-stripe-status.json') as handle:
              stripe = json.load(handle)
          with open(root + '/integration-google-status.json') as handle:
              google = json.load(handle)
          with open(root + '/integration-telnyx-status.json') as handle:
              telnyx = json.load(handle)
          with open(root + '/integration-telnyx-verify.json') as handle:
              telnyx_verify = json.load(handle)
          with open(root + '/google-search.json') as handle:
              search = json.load(handle)
          with open(root + '/google-details.json') as handle:
              details = json.load(handle)
          with open(root + '/google-photos.json') as handle:
              photos = json.load(handle)
          assert payload.get('ok') is True, payload
          assert payload.get('service') == 'theouthaven-integration-api', payload
          assert 'microsoft-graph' in payload.get('providers', []), payload
          assert 'stripe-connect' in payload.get('providers', []), payload
          assert 'google-places' in payload.get('providers', []), payload
          assert 'telnyx' in payload.get('providers', []), payload
          assert stripe.get('ok') is True, stripe
          assert stripe.get('credentialConfigured') is True, stripe
          assert google.get('ok') is True, google
          assert google.get('credentialConfigured') is True, google
          assert telnyx.get('ok') is True and telnyx.get('credentialConfigured') is True, telnyx
          required_channels = {'concierge', 'crm', 'reservations', 'support'}
          assert required_channels.issubset(set(telnyx.get('channels', []))), telnyx
          assert telnyx_verify.get('ok') is True, telnyx_verify
          verified_channels = {item.get('purpose') for item in telnyx_verify.get('channels', [])}
          assert required_channels.issubset(verified_channels), telnyx_verify
          assert search.get('ok') is True and search.get('places'), search
          assert details.get('ok') is True and details.get('place', {}).get('id'), details
          assert photos.get('ok') is True and photos.get('photos'), photos
          print('Authenticated Integration API Google Places and Telnyx read-only verification smoke passed')
          PY

      - name: Write deployment summary
        env:
          API_URL: ${{ steps.runtime.outputs.api_url }}
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          {
            echo "### TheOutHaven Integration API"
            echo "- Environment: $TARGET_ENV"
            echo "- Endpoint: $API_URL"
            echo "- Providers: Microsoft Graph + Stripe Connect + Google Places + Telnyx"
            echo "- Stripe credential authority: dedicated AWS Secrets Manager secret"
            echo "- Google Places credential authority: dedicated AWS Secrets Manager secret"
            echo "- Telnyx credential authority: dedicated AWS Secrets Manager channel-config secret"
            echo "- Telnyx bootstrap source: dedicated secret first; AWS edge-runtime only as legacy fallback"
            echo "- Telnyx smoke: read-only credential/sender verification; no SMS sent"
            echo "- Google Places smoke: search + details + photo metadata + photo media"
          } >> "$GITHUB_STEP_SUMMARY"
