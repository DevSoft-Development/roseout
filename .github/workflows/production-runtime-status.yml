name: Production runtime status (read only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  azure-consumer:
    name: Azure Consumer active revisions
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Login to Azure using existing OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect active Container App revisions (no writes)
        uses: azure/CLI@v3
        with:
          inlineScript: |
            set -euo pipefail
            RG=rg-toh-consumer-production
            : > "$GITHUB_WORKSPACE/azure-revisions.jsonl"
            echo "## Azure Consumer production" >> "$GITHUB_STEP_SUMMARY"
            for APP in ca-toh-consumer-prod-primary ca-toh-consumer-prod-secondary; do
              echo "### $APP" >> "$GITHUB_STEP_SUMMARY"
              az containerapp show --resource-group "$RG" --name "$APP" --query '{name:name,provisioningState:properties.provisioningState,latestRevision:properties.latestRevisionName}' -o json >> "$GITHUB_STEP_SUMMARY"
              az containerapp revision list --resource-group "$RG" --name "$APP" --query "[?properties.active==\`true\`].{revision:name,created:properties.createdTime,image:properties.template.containers[0].image,health:properties.healthState,replicas:properties.replicas}" -o json >> "$GITHUB_STEP_SUMMARY"
              az containerapp revision list --resource-group "$RG" --name "$APP" --query "[?properties.active==\`true\`].{revision:name,created:properties.createdTime,image:properties.template.containers[0].image,health:properties.healthState,replicas:properties.replicas}" -o json | jq -c --arg app "$APP" '{app:$app,revisions:.}' >> "$GITHUB_WORKSPACE/azure-revisions.jsonl"
            done

      - name: Upload sanitized Azure revision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-azure-revisions
          path: ${{ github.workspace }}/azure-revisions.jsonl
          retention-days: 7
          if-no-files-found: warn

  aws-web-surfaces:
    name: AWS Admin and Business runtime inspection
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials using existing OIDC role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: us-east-1
          allowed-account-ids: '742020474738'
      - name: Inspect ECS services and running task images (no writes)
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/aws-services.jsonl"
          STACK=theouthaven-web-surfaces-production
          CLUSTER="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue | [0]" --output text)"
          test -n "$CLUSTER" && test "$CLUSTER" != None
          echo "## AWS web surfaces production" >> "$GITHUB_STEP_SUMMARY"
          echo "ECS cluster: $CLUSTER" >> "$GITHUB_STEP_SUMMARY"
          SERVICES="$(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns[]' --output text)"
          if [ -z "$SERVICES" ]; then
            echo "No ECS services found in cluster." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          for SERVICE in $SERVICES; do
            echo "### $SERVICE" >> "$GITHUB_STEP_SUMMARY"
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[].{service:serviceName,status:status,desired:desiredCount,running:runningCount,taskDefinition:taskDefinition,deployments:deployments[].{status:status,rollout:rolloutState,desired:desiredCount,running:runningCount}}' --output json >> "$GITHUB_STEP_SUMMARY"
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[].{service:serviceName,status:status,desired:desiredCount,running:runningCount,taskDefinition:taskDefinition,deployments:deployments[].{status:status,rollout:rolloutState,desired:desiredCount,running:runningCount}}' --output json | jq -c '.[]' >> "$RUNNER_TEMP/aws-services.jsonl"
            TASK_DEF="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)"
            if [ -n "$TASK_DEF" ] && [ "$TASK_DEF" != None ]; then
              aws ecs describe-task-definition --task-definition "$TASK_DEF" --query 'taskDefinition.{family:family,revision:revision,images:containerDefinitions[].{name:name,image:image}}' --output json | jq -c --arg service "$SERVICE" '{service:$service,taskDefinition:.}' >> "$RUNNER_TEMP/aws-services.jsonl" || true
              if ! aws ecs describe-task-definition --task-definition "$TASK_DEF" --query 'taskDefinition.{family:family,revision:revision,images:containerDefinitions[].{name:name,image:image}}' --output json >> "$GITHUB_STEP_SUMMARY"; then
                echo "Task definition inspection unavailable; grant ecs:DescribeTaskDefinition scoped to task definition ARNs." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            if ! TASKS="$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --desired-status RUNNING --query 'taskArns[]' --output text 2>"$RUNNER_TEMP/ecs-list-tasks.err")"; then
              echo "Running-task inspection unavailable (ecs:ListTasks denied); service and task-definition results above are still valid." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::ECS ListTasks unavailable. Grant scoped ecs:ListTasks and ecs:DescribeTasks for full image-digest proof."
              continue
            fi
            if [ -n "$TASKS" ] && [ "$TASKS" != None ]; then
              if ! aws ecs describe-tasks --cluster "$CLUSTER" --tasks $TASKS --query 'tasks[].{task:taskArn,lastStatus:lastStatus,health:healthStatus,containers:containers[].{name:name,image:image,imageDigest:imageDigest}}' --output json >> "$GITHUB_STEP_SUMMARY"; then
                echo "Running-task detail unavailable; grant ecs:DescribeTasks scoped to task ARNs." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done

      - name: Upload sanitized AWS service report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-aws-services
          path: ${{ runner.temp }}/aws-services.jsonl
          retention-days: 7
          if-no-files-found: warn
