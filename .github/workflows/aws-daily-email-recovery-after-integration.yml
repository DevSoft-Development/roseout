name: Recover daily emails after Integration API mail deploy

on:
  workflow_run:
    workflows: ['AWS Integration API SES fallback']
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical daily email recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run aws-daily-email-recovery.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo 'daily_email_recovery=dispatched'
