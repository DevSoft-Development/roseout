name: LI V2 consumer Sabor read-only proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/li-v2-consumer-sabor-readonly-proof.yml'
permissions:
  contents: read
jobs:
  consumer-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Prove public consumer results include Sabor location ID
        env:
          EDGE_HOST: ${{ vars.AZURE_CONSUMER_FRONTDOOR_HOST }}
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.parse,urllib.request
          expected="05f4f24d-6906-4420-86b0-a4c734654aac"
          hosts=["theouthaven.com"]
          edge=os.environ.get("EDGE_HOST","").strip()
          if edge: hosts.append(edge)
          query=urllib.parse.urlencode({"q":"Sabor lounge nyc","kind":"restaurants","limit":"96"})
          any_found=False
          for host in hosts:
            if not host.replace("-","").replace(".","").isalnum():
              print("Invalid proof hostname",file=sys.stderr);sys.exit(2)
            url="https://"+host+"/api/explore/search?"+query
            try:
              req=urllib.request.Request(url,headers={"Accept":"application/json","Cache-Control":"no-store","User-Agent":"TOH-LI-V2-Consumer-Proof/1.0"})
              with urllib.request.urlopen(req,timeout=20) as res:
                status=res.status;body=res.read(1000000)
              doc=json.loads(body)
              items=doc.get("items") if isinstance(doc,dict) else None
              found=status==200 and doc.get("success") is True and isinstance(items,list) and any(
                isinstance(x,dict) and expected in [x.get("id"),x.get("location_id"),x.get("locationId")]
                for x in items)
              print(json.dumps({"host":host,"http":status,"success":doc.get("success"),"item_count":len(items) if isinstance(items,list) else None,"sabor_id_present":found}))
              any_found |= found
            except Exception as error:
              print(json.dumps({"host":host,"error":str(error)[:250]}),file=sys.stderr)
          if not any_found:
            sys.exit("Consumer proof FAILED: exact Sabor ID absent or endpoint unreachable; certification remains pending.")
          print("Consumer proof PASSED: exact Sabor ID observed in real public Explore items (read only).")
          PY
