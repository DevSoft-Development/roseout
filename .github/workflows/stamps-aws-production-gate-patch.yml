name: Apply Stamps AWS production gate

on:
  push:
    branches:
      - fix/stamps-aws-production-print-gate
    paths:
      - scripts/dev/finalize_stamps_inline_aws_provider.py
      - .github/workflows/stamps-aws-production-gate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stamps-aws-production-print-gate
      - name: Finalize AWS provider
        run: python scripts/dev/finalize_stamps_inline_aws_provider.py
      - name: Validate Python and safety boundaries
        run: |
          set -euxo pipefail
          python -m py_compile infra/aws/lambda/platform_integration_api.py
          test ! -e infra/aws/lambda/stamps_provider.py
          test ! -e lib/stamps-production-postcard.ts
          grep -q 'production SOAP calls must run through the AWS Integration API' lib/stamps-postcard.ts
          grep -q '/v1/stamps/postcard/production-proof' infra/aws/lambda/platform_integration_api.py
          grep -q 'production-proofs/${id}' 'app/admin/dashboard/operations/mailing-batches/[id]/print/page.tsx'
          git diff --check
      - name: Prepare final commit
        run: |
          rm -rf infra/aws/lambda/__pycache__
          rm -f scripts/dev/finalize_stamps_inline_aws_provider.py
      - name: Commit final provider layout
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Inline Stamps provider in AWS Integration API'
          git push origin HEAD:fix/stamps-aws-production-print-gate
