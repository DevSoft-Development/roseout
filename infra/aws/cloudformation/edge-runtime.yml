AWSTemplateFormatVersion: '2010-09-09'
Description: TheOutHaven self-hosted Supabase Edge Runtime on AWS Lambda with EventBridge scheduler invocation.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  EdgeRuntimeImageUri:
    Type: String
  RuntimeSecretName:
    Type: String
    Default: /theouthaven/production/edge-runtime/env
  DrRuntimeSecretName:
    Type: String
    Default: /theouthaven/production/dr-reconciler/env

Resources:
  DrStorageTombstoneTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub toh-${Environment}-dr-storage-tombstones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: object_key
          AttributeType: S
      KeySchema:
        - AttributeName: object_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: TheOutHaven
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: DisasterRecovery

  EdgeRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenEdgeRuntime-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: edge-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/toh-${Environment}-edge-runtime:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${RuntimeSecretName}-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DrRuntimeSecretName}-*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt DrStorageTombstoneTable.Arn
      Tags:
        - Key: Project
          Value: TheOutHaven
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: EdgeRuntime

  EdgeRuntimeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/toh-${Environment}-edge-runtime
      RetentionInDays: 30

  EdgeRuntimeFunction:
    Type: AWS::Lambda::Function
    DependsOn: EdgeRuntimeLogGroup
    Properties:
      FunctionName: !Sub toh-${Environment}-edge-runtime
      Description: Runs TheOutHaven's former Supabase Edge Function code on AWS.
      Role: !GetAtt EdgeRuntimeRole.Arn
      PackageType: Image
      Code:
        ImageUri: !Ref EdgeRuntimeImageUri
      Architectures: [x86_64]
      MemorySize: 3008
      Timeout: 120
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          EDGE_RUNTIME_SECRET_ID: !Ref RuntimeSecretName
          DR_RUNTIME_SECRET_ID: !Ref DrRuntimeSecretName
          DR_STORAGE_TOMBSTONE_TABLE: !Ref DrStorageTombstoneTable
          AWS_LWA_PORT: '8080'
          AWS_LWA_READINESS_CHECK_PATH: /healthz
          AWS_LWA_READINESS_CHECK_PROTOCOL: http
          AWS_LWA_READINESS_CHECK_HEALTHY_STATUS: '200-399'
          AWS_LWA_ASYNC_INIT: 'false'
      Tags:
        - Key: Project
          Value: TheOutHaven
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: EdgeRuntime

  SchedulerInvokerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenEdgeSchedulerInvoker-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: scheduler-invoker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/toh-${Environment}-edge-scheduler-invoker:*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt EdgeRuntimeFunction.Arn
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: TheOutHaven/DR
      Tags:
        - Key: Project
          Value: TheOutHaven
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: Scheduler

  SchedulerInvokerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/toh-${Environment}-edge-scheduler-invoker
      RetentionInDays: 30

  SchedulerInvokerFunction:
    Type: AWS::Lambda::Function
    DependsOn: SchedulerInvokerLogGroup
    Properties:
      FunctionName: !Sub toh-${Environment}-edge-scheduler-invoker
      Description: Converts EventBridge schedule jobs into HTTP-style requests for the AWS edge runtime.
      Role: !GetAtt SchedulerInvokerRole.Arn
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 125
      MemorySize: 256
      Environment:
        Variables:
          EDGE_RUNTIME_FUNCTION_NAME: !Ref EdgeRuntimeFunction
      Code:
        ZipFile: |
          import json
          import os
          from datetime import datetime, timezone
          import boto3

          client = boto3.client('lambda')
          cloudwatch = boto3.client('cloudwatch')
          edge_function = os.environ['EDGE_RUNTIME_FUNCTION_NAME']
          dr_namespace = 'TheOutHaven/DR'
          expected_ready_tables = 462

          def numeric(value, default=0.0):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return float(default)

          def metric(name, value, dimensions=None):
              item = {
                  'MetricName': name,
                  'Value': numeric(value),
                  'Unit': 'Count',
              }
              if dimensions:
                  item['Dimensions'] = dimensions
              return item

          def emit_dr_metrics(operation, parsed_body, success):
              if not operation:
                  return
              dimensions = [{'Name': 'Operation', 'Value': operation}]
              data = [
                  metric('ReconcileHeartbeat', 1, dimensions),
                  metric('ReconcileSuccess', 1 if success else 0, dimensions),
              ]

              if success and isinstance(parsed_body, dict):
                  guard = parsed_body.get('guard') or {}
                  data.extend([
                      metric('StandbyHealthy', 1),
                      metric('SourceCronJobs', guard.get('sourceCronJobs', 0)),
                      metric('SourceActiveSlots', guard.get('sourceActiveSlots', 0)),
                      metric('TargetActiveCronJobs', guard.get('targetActiveCronJobs', 0)),
                      metric('ReadyTableGap', max(0, expected_ready_tables - numeric(guard.get('targetReadyTables', 0)))),
                      metric('ConnectedWorkers', guard.get('targetConnectedWorkers', 0)),
                  ])
                  if operation == 'auth':
                      data.append(metric('AuthParity', 1 if parsed_body.get('parity') is True else 0))
                  if operation == 'storage':
                      data.extend([
                          metric('StorageCopyOrReplace', parsed_body.get('copyOrReplace', 0)),
                          metric('StorageDeferredCopies', parsed_body.get('deferredCopies', 0)),
                          metric('StorageTargetOnly', parsed_body.get('targetOnly', 0)),
                          metric('StoragePendingDeletes', parsed_body.get('pendingDeletes', 0)),
                      ])
              else:
                  data.append(metric('StandbyHealthy', 0))
                  if operation == 'auth':
                      data.append(metric('AuthParity', 0))

              try:
                  cloudwatch.put_metric_data(Namespace=dr_namespace, MetricData=data)
              except Exception as exc:
                  print(f'Failed to publish DR CloudWatch metrics: {type(exc).__name__}')

          def handler(event, context):
              function_name = str(event.get('function') or '').strip()
              if not function_name:
                  raise ValueError('Missing scheduled function name')

              body = event.get('body') or {}
              if not isinstance(body, dict):
                  raise ValueError('Scheduled body must be an object')
              body = dict(body)
              if body.pop('_inject_scheduled_at', False):
                  body['scheduled_at'] = datetime.now(timezone.utc).isoformat()
              dr_operation = str(body.get('operation') or 'status') if function_name == 'dr-standby-reconciler' else ''

              path = f'/functions/v1/{function_name}'
              now = datetime.now(timezone.utc)
              http_event = {
                  'version': '2.0',
                  'routeKey': f'POST {path}',
                  'rawPath': path,
                  'rawQueryString': '',
                  'headers': {
                      'content-type': 'application/json',
                      'x-toh-aws-internal': 'eventbridge',
                  },
                  'requestContext': {
                      'accountId': 'scheduler',
                      'apiId': 'scheduler',
                      'domainName': 'internal',
                      'domainPrefix': 'internal',
                      'http': {
                          'method': 'POST',
                          'path': path,
                          'protocol': 'HTTP/1.1',
                          'sourceIp': '127.0.0.1',
                          'userAgent': 'theouthaven-eventbridge',
                      },
                      'requestId': context.aws_request_id,
                      'routeKey': f'POST {path}',
                      'stage': '$default',
                      'time': now.strftime('%d/%b/%Y:%H:%M:%S +0000'),
                      'timeEpoch': int(now.timestamp() * 1000),
                  },
                  'body': json.dumps(body, separators=(',', ':')),
                  'isBase64Encoded': False,
              }

              response = client.invoke(
                  FunctionName=edge_function,
                  InvocationType='RequestResponse',
                  Payload=json.dumps(http_event).encode('utf-8'),
              )
              payload = response['Payload'].read().decode('utf-8')
              if response.get('FunctionError'):
                  raise RuntimeError(f'Edge runtime Lambda error: {payload[:2000]}')

              decoded = json.loads(payload or '{}')
              status = int(decoded.get('statusCode') or 200)
              raw_body = decoded.get('body')
              parsed_body = raw_body
              if isinstance(raw_body, str):
                  try:
                      parsed_body = json.loads(raw_body)
                  except Exception:
                      parsed_body = raw_body[:2000]

              success = status < 400 and not (isinstance(parsed_body, dict) and parsed_body.get('success') is False)
              emit_dr_metrics(dr_operation, parsed_body, success)

              if status >= 400:
                  raise RuntimeError(f'{function_name} returned HTTP {status}: {str(parsed_body)[:2000]}')
              if isinstance(parsed_body, dict) and parsed_body.get('success') is False:
                  raise RuntimeError(f'{function_name} returned success=false: {str(parsed_body)[:2000]}')

              return {
                  'ok': True,
                  'function': function_name,
                  'status': status,
                  'response': parsed_body,
              }
      Tags:
        - Key: Project
          Value: TheOutHaven
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: Scheduler

  EventBridgeSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenEventBridgeScheduler-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-scheduler-dispatcher
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SchedulerInvokerFunction.Arn
      Tags:
        - Key: Project
          Value: TheOutHaven
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: Scheduler

  EdgeRuntimeErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-edge-runtime-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EdgeRuntimeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  SchedulerInvokerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-edge-scheduler-invoker-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SchedulerInvokerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  DrAuthReconcileFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-dr-auth-reconcile-failed
      AlarmDescription: Oregon DR Auth reconcile returned a failure.
      Namespace: TheOutHaven/DR
      MetricName: ReconcileSuccess
      Dimensions:
        - Name: Operation
          Value: auth
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  DrAuthReconcileStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-dr-auth-reconcile-stale
      AlarmDescription: Oregon DR Auth reconcile has not reported for 15 minutes.
      Namespace: TheOutHaven/DR
      MetricName: ReconcileHeartbeat
      Dimensions:
        - Name: Operation
          Value: auth
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  DrStorageReconcileFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-dr-storage-reconcile-failed
      AlarmDescription: Oregon DR Storage reconcile returned a failure.
      Namespace: TheOutHaven/DR
      MetricName: ReconcileSuccess
      Dimensions:
        - Name: Operation
          Value: storage
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  DrStorageReconcileStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-dr-storage-reconcile-stale
      AlarmDescription: Oregon DR Storage reconcile has not reported for 15 minutes.
      Namespace: TheOutHaven/DR
      MetricName: ReconcileHeartbeat
      Dimensions:
        - Name: Operation
          Value: storage
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  DrPassiveStandbyInvariantAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-dr-passive-standby-unhealthy
      AlarmDescription: Virginia primary or Oregon passive-standby invariants are not healthy.
      Namespace: TheOutHaven/DR
      MetricName: StandbyHealthy
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  DrReadyTableGapAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-dr-public-table-gap
      AlarmDescription: Oregon logical replication has fewer than the expected 462 ready public relations.
      Namespace: TheOutHaven/DR
      MetricName: ReadyTableGap
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  DrStorageBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-dr-storage-copy-backlog
      AlarmDescription: Oregon DR Storage has deferred copies for at least 15 minutes.
      Namespace: TheOutHaven/DR
      MetricName: StorageDeferredCopies
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  DrStorageDeleteBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-dr-storage-delete-backlog
      AlarmDescription: Oregon DR Storage tombstones remain pending beyond the normal 30-minute delete grace window.
      Namespace: TheOutHaven/DR
      MetricName: StoragePendingDeletes
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 8
      DatapointsToAlarm: 8
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

  DrAuthParityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-dr-auth-parity-lost
      AlarmDescription: Oregon DR Auth is not in verified parity after reconciliation.
      Namespace: TheOutHaven/DR
      MetricName: AuthParity
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:toh-${Environment}-platform-alerts

Outputs:
  EdgeRuntimeFunctionName:
    Value: !Ref EdgeRuntimeFunction
  SchedulerInvokerFunctionName:
    Value: !Ref SchedulerInvokerFunction
  SchedulerInvokerFunctionArn:
    Value: !GetAtt SchedulerInvokerFunction.Arn
  EventBridgeSchedulerRoleArn:
    Value: !GetAtt EventBridgeSchedulerRole.Arn
  RuntimeSecretName:
    Value: !Ref RuntimeSecretName
  DrRuntimeSecretName:
    Value: !Ref DrRuntimeSecretName
  DrStorageTombstoneTableName:
    Value: !Ref DrStorageTombstoneTable
