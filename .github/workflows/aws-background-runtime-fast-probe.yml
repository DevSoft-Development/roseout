name: AWS background runtime fast probe

on:
  pull_request:
    paths:
      - '.github/workflows/aws-background-runtime-fast-probe.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-background-runtime-fast-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-background-runtime-fast-probe-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  EDGE_STACK_NAME: theouthaven-edge-runtime-production

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fast probe contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-background-runtime-fast-probe.yml'
          grep -F 'location-search-profile-worker' "$FILE" >/dev/null
          grep -F 'search-phase13-maintenance' "$FILE" >/dev/null
          grep -F 'ConcurrentInvocationLimitExceeded' "$FILE" >/dev/null
          grep -F 'response_summary' "$FILE" >/dev/null
          grep -F 'logs:FilterLogEvents' "$FILE" >/dev/null
          grep -F 'TheOutHavenBackgroundRuntimeDiagnostics' "$FILE" >/dev/null

  probe:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment role
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "role_name=${ROLE_ARN##*/}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Add temporary read-only background log access
        env:
          ROLE_NAME: ${{ steps.config.outputs.role_name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/background-runtime-diagnostics-policy.json" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"BackgroundRuntimeDiagnosticsReadOnly",
                "Effect":"Allow",
                "Action":["logs:FilterLogEvents"],
                "Resource":"arn:aws:logs:us-east-1:742020474738:log-group:/aws/lambda/toh-production-background-runtime:*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenBackgroundRuntimeDiagnostics \
            --policy-document "file://$RUNNER_TEMP/background-runtime-diagnostics-policy.json"
          sleep 5

      - name: Verify runtime and probe managed cron jobs
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN"
          test -n "$INVOKER_FN"

          aws lambda get-function-configuration \
            --function-name "$BACKGROUND_FN" \
            --query '{State:State,LastUpdateStatus:LastUpdateStatus,MemorySize:MemorySize,Timeout:Timeout}' \
            --output json

          failures=0
          for JOB in location-search-profile-worker search-phase13-maintenance; do
            echo "probing=$JOB"
            jq -nc --arg fn "node:/api/cron/managed?job=$JOB" '{function:$fn,body:{}}' > "$RUNNER_TEMP/probe-input.json"
            rm -f "$RUNNER_TEMP/probe-output.json" "$RUNNER_TEMP/probe-error.txt"

            invoked=0
            for attempt in 1 2 3 4; do
              if aws lambda invoke \
                --function-name "$INVOKER_FN" \
                --cli-binary-format raw-in-base64-out \
                --payload "fileb://$RUNNER_TEMP/probe-input.json" \
                "$RUNNER_TEMP/probe-output.json" >/dev/null 2>"$RUNNER_TEMP/probe-error.txt"; then
                invoked=1
                break
              fi

              if grep -Eq 'TooManyRequestsException|ConcurrentInvocationLimitExceeded|Throttl' "$RUNNER_TEMP/probe-error.txt"; then
                echo "transient_lambda_throttle job=$JOB attempt=$attempt"
                sleep $((attempt * 3))
                continue
              fi

              echo "lambda_invoke_failed job=$JOB"
              sed -E 's/(Bearer|token|secret|password)[^ ]*/[REDACTED]/Ig' "$RUNNER_TEMP/probe-error.txt" | head -c 1200
              failures=$((failures + 1))
              break
            done

            if [ "$invoked" != '1' ]; then
              if [ -s "$RUNNER_TEMP/probe-error.txt" ]; then
                echo "lambda_invoke_exhausted job=$JOB"
                sed -E 's/(Bearer|token|secret|password)[^ ]*/[REDACTED]/Ig' "$RUNNER_TEMP/probe-error.txt" | head -c 1200
              fi
              failures=$((failures + 1))
              continue
            fi

            jq -c '{
              ok,
              runtime,
              function,
              target,
              queue,
              status,
              errorType,
              errorMessage,
              response_summary: (
                if (.response | type) == "object" then {
                  ok: .response.ok,
                  success: .response.success,
                  error: .response.error,
                  reason: .response.reason,
                  operation: .response.operation,
                  processed: .response.processed,
                  sent: .response.sent,
                  failed: .response.failed,
                  skipped: .response.skipped,
                  claimed: .response.claimed,
                  checked: .response.checked,
                  updated: .response.updated,
                  durationMs: .response.durationMs
                } else {type: (.response | type)} end
              )
            }' "$RUNNER_TEMP/probe-output.json" || true

            if jq -e '.ok == true and .runtime == "node" and (.status // 200) < 400 and (.response.ok // true) != false and (.response.success // true) != false' "$RUNNER_TEMP/probe-output.json" >/dev/null; then
              echo "probe_passed=$JOB"
            else
              echo "probe_failed=$JOB"
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" != '0' ]; then
            echo 'recent_background_error_logs:'
            START_MS="$(( ($(date +%s) - 300) * 1000 ))"
            aws logs filter-log-events \
              --log-group-name "/aws/lambda/$BACKGROUND_FN" \
              --start-time "$START_MS" \
              --limit 100 \
              --query 'events[].message' \
              --output text > "$RUNNER_TEMP/background-errors.txt"
            grep -Ei 'error|exception|unhandled|failed|supabase|cron|module|cannot find' "$RUNNER_TEMP/background-errors.txt" \
              | tail -n 80 \
              | sed -E 's/(Bearer|token|secret|password|apikey|api_key)[=: ]+[^ ,;]*/\1=[REDACTED]/Ig' \
              | head -c 12000 || true
          fi

          test "$failures" = '0'

      - name: Remove temporary background log access
        if: always()
        env:
          ROLE_NAME: ${{ steps.config.outputs.role_name }}
        run: |
          set -euo pipefail
          aws iam delete-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenBackgroundRuntimeDiagnostics 2>/dev/null || true
