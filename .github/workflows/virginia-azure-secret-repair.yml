name: Virginia Azure client secret repair

on:
  push:
    branches:
      - fix/virginia-azure-client-secret
    paths:
      - '.github/workflows/virginia-azure-secret-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OREGON_SUPABASE_REF: hnhbzynoyrhjndefbwkh
  VIRGINIA_SUPABASE_REF: ftdsltatyqhtllyyefzp

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require Supabase management credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured' >&2; exit 1; }
          echo 'supabase_management_credential_present=true'

      - name: Fetch Oregon and Virginia Auth configuration securely
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for ref in "$OREGON_SUPABASE_REF" "$VIRGINIA_SUPABASE_REF"; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${ref}/config/auth" \
              > "$RUNNER_TEMP/auth-${ref}.json"
            chmod 600 "$RUNNER_TEMP/auth-${ref}.json"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          o = json.loads((tmp / f"auth-{os.environ['OREGON_SUPABASE_REF']}.json").read_text())
          v = json.loads((tmp / f"auth-{os.environ['VIRGINIA_SUPABASE_REF']}.json").read_text())
          print(f"oregon_azure_enabled={str(o.get('external_azure_enabled') is True).lower()}")
          print(f"virginia_azure_enabled={str(v.get('external_azure_enabled') is True).lower()}")
          print(f"azure_client_id_match={str(bool(o.get('external_azure_client_id')) and o.get('external_azure_client_id') == v.get('external_azure_client_id')).lower()}")
          print(f"azure_url_match={str(bool(o.get('external_azure_url')) and o.get('external_azure_url') == v.get('external_azure_url')).lower()}")
          print(f"azure_secret_fields_equal={str(bool(o.get('external_azure_secret')) and o.get('external_azure_secret') == v.get('external_azure_secret')).lower()}")
          if o.get('external_azure_enabled') is not True:
              raise SystemExit('Oregon Azure provider is not enabled')
          if not o.get('external_azure_client_id') or not o.get('external_azure_secret') or not o.get('external_azure_url'):
              raise SystemExit('Oregon Azure provider metadata is incomplete')
          if o.get('external_azure_client_id') != v.get('external_azure_client_id'):
              raise SystemExit('Azure client IDs differ; refusing repair')
          if o.get('external_azure_url') != v.get('external_azure_url'):
              raise SystemExit('Azure tenant URLs differ; refusing repair')
          PY

      - name: Validate Oregon Azure credential directly with Microsoft
        run: |
          set -euo pipefail
          OREGON="$RUNNER_TEMP/auth-${OREGON_SUPABASE_REF}.json"
          client_id="$(jq -r '.external_azure_client_id // empty' "$OREGON")"
          client_secret="$(jq -r '.external_azure_secret // empty' "$OREGON")"
          azure_url="$(jq -r '.external_azure_url // empty' "$OREGON")"
          tenant="$(printf '%s' "$azure_url" | sed -nE 's#^https://login\.microsoftonline\.com/([^/]+).*$#\1#p')"
          test -n "$client_id" && test -n "$client_secret" && test -n "$tenant" || { echo 'Could not resolve Oregon Azure credential fields safely' >&2; exit 1; }
          echo "::add-mask::$client_id"
          echo "::add-mask::$client_secret"
          echo "::add-mask::$tenant"

          code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/microsoft-token-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=${client_id}" \
            --data-urlencode "client_secret=${client_secret}" \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode 'scope=https://graph.microsoft.com/.default' \
            "https://login.microsoftonline.com/${tenant}/oauth2/v2.0/token")"

          if [ "$code" = '200' ]; then
            echo 'oregon_azure_secret_microsoft_valid=true'
            exit 0
          fi

          error_code="$(jq -r '.error // empty' "$RUNNER_TEMP/microsoft-token-response.json" 2>/dev/null || true)"
          description="$(jq -r '.error_description // empty' "$RUNNER_TEMP/microsoft-token-response.json" 2>/dev/null || true)"
          echo "microsoft_validation_http_status=${code}"
          if [ "$error_code" = 'invalid_client' ] || printf '%s' "$description" | grep -Eq 'AADSTS7000215|AADSTS7000222'; then
            echo 'oregon_azure_secret_microsoft_valid=false'
            echo 'oregon_azure_secret_invalid_or_expired=true'
            exit 1
          fi
          echo 'oregon_azure_secret_microsoft_valid=indeterminate'
          echo "microsoft_validation_error_type=${error_code:-unknown}"
          exit 1

      - name: Repair Virginia Azure secret from validated Oregon credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          OREGON="$RUNNER_TEMP/auth-${OREGON_SUPABASE_REF}.json"
          jq '{
            external_azure_enabled: true,
            external_azure_client_id: .external_azure_client_id,
            external_azure_secret: .external_azure_secret,
            external_azure_url: .external_azure_url
          }' "$OREGON" > "$RUNNER_TEMP/virginia-azure-repair.json"
          chmod 600 "$RUNNER_TEMP/virginia-azure-repair.json"

          code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/virginia-patch-response.json" \
            --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/virginia-azure-repair.json" \
            "https://api.supabase.com/v1/projects/${VIRGINIA_SUPABASE_REF}/config/auth")"
          echo "virginia_auth_patch_http_status=${code}"
          [[ "$code" == 2* ]] || { echo 'Virginia Azure Auth repair failed' >&2; exit 1; }

      - name: Verify Virginia Azure provider metadata after repair
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${VIRGINIA_SUPABASE_REF}/config/auth" \
            > "$RUNNER_TEMP/virginia-auth-after.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          o = json.loads((tmp / f"auth-{os.environ['OREGON_SUPABASE_REF']}.json").read_text())
          v = json.loads((tmp / 'virginia-auth-after.json').read_text())
          checks = {
              'virginia_azure_enabled_after': v.get('external_azure_enabled') is True,
              'virginia_azure_client_id_match_after': v.get('external_azure_client_id') == o.get('external_azure_client_id'),
              'virginia_azure_url_match_after': v.get('external_azure_url') == o.get('external_azure_url'),
              'virginia_azure_secret_field_present_after': bool(v.get('external_azure_secret')),
          }
          for k, value in checks.items():
              print(f"{k}={str(value).lower()}")
          if not all(checks.values()):
              raise SystemExit('Virginia Azure provider metadata verification failed')
          PY
          echo 'virginia_azure_provider_repair=applied_from_microsoft_validated_oregon_source'

      - name: Verify Virginia Azure authorize endpoint
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            'https://ftdsltatyqhtllyyefzp.supabase.co/auth/v1/authorize?provider=azure&redirect_to=https%3A%2F%2Ftheouthaven.com%2Fauth%2Fadmin%2Fcallback')"
          echo "virginia_azure_authorize_http_status=${code}"
          [[ "$code" == '302' ]] || { echo 'Virginia Azure authorize endpoint did not redirect' >&2; exit 1; }

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.txt
