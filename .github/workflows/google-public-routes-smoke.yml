name: Google public routes smoke

on:
  pull_request:
    paths:
      - 'app/api/google/address-autocomplete/route.ts'
      - 'app/api/google/address-details/route.ts'
      - 'lib/aws/integration-api.ts'
      - 'lib/google/meal-service.ts'
      - 'lib/google/places.ts'
      - 'lib/google/places-new-client.ts'
      - 'infra/aws/lambda/google_places_provider.py'
      - '.github/workflows/google-public-routes-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'app/api/google/address-autocomplete/route.ts'
      - 'app/api/google/address-details/route.ts'
      - 'lib/aws/integration-api.ts'
      - 'lib/google/meal-service.ts'
      - 'lib/google/places.ts'
      - 'lib/google/places-new-client.ts'
      - 'infra/aws/lambda/google_places_provider.py'
      - '.github/workflows/google-public-routes-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-public-routes-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck Google route wiring
        run: npm run typecheck

  production-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact Vercel production revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            BODY="$(curl --fail --silent --show-error --max-time 10 'https://www.theouthaven.com/api/health/platform-dr' || true)"
            REVISION="$(printf '%s' "$BODY" | jq -r '.revision // empty' 2>/dev/null || true)"
            OK="$(printf '%s' "$BODY" | jq -r '.ok // false' 2>/dev/null || true)"
            if [ "$OK" = "true" ] && [ "$REVISION" = "$EXPECTED_SHA" ]; then
              echo "Exact Vercel revision is live."
              exit 0
            fi
            sleep 10
          done
          echo "Exact Vercel revision did not become live for Google route smoke" >&2
          exit 1

      - name: Verify autocomplete and details use AWS Integration
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          SESSION_TOKEN="toh-google-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          AUTO_BODY="$(jq -nc --arg input '11 Madison Ave New York NY' --arg token "$SESSION_TOKEN" '{input:$input,sessionToken:$token}')"

          AUTO_STATUS="$(curl --silent --show-error \
            --max-time 20 \
            --request POST \
            --header 'content-type: application/json' \
            --data "$AUTO_BODY" \
            --dump-header "$TMP_DIR/autocomplete.headers" \
            --output "$TMP_DIR/autocomplete.json" \
            --write-out '%{http_code}' \
            'https://www.theouthaven.com/api/google/address-autocomplete')"
          test "$AUTO_STATUS" = "200" || { echo "Autocomplete returned HTTP $AUTO_STATUS" >&2; cat "$TMP_DIR/autocomplete.json" >&2; exit 1; }
          AUTO_PROVIDER="$(awk 'BEGIN{IGNORECASE=1} /^x-theouthaven-google-provider:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$TMP_DIR/autocomplete.headers")"
          test "$AUTO_PROVIDER" = "aws-integration" || { echo "Autocomplete provider was '$AUTO_PROVIDER' instead of aws-integration" >&2; exit 1; }
          PLACE_ID="$(jq -r '.predictions[0].place_id // empty' "$TMP_DIR/autocomplete.json")"
          test -n "$PLACE_ID" || { echo "Autocomplete returned no Google place id" >&2; cat "$TMP_DIR/autocomplete.json" >&2; exit 1; }

          DETAILS_BODY="$(jq -nc --arg placeId "$PLACE_ID" --arg token "$SESSION_TOKEN" '{placeId:$placeId,sessionToken:$token}')"
          DETAILS_STATUS="$(curl --silent --show-error \
            --max-time 20 \
            --request POST \
            --header 'content-type: application/json' \
            --data "$DETAILS_BODY" \
            --dump-header "$TMP_DIR/details.headers" \
            --output "$TMP_DIR/details.json" \
            --write-out '%{http_code}' \
            'https://www.theouthaven.com/api/google/address-details')"
          test "$DETAILS_STATUS" = "200" || { echo "Address details returned HTTP $DETAILS_STATUS" >&2; cat "$TMP_DIR/details.json" >&2; exit 1; }
          DETAILS_PROVIDER="$(awk 'BEGIN{IGNORECASE=1} /^x-theouthaven-google-provider:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$TMP_DIR/details.headers")"
          test "$DETAILS_PROVIDER" = "aws-integration" || { echo "Address details provider was '$DETAILS_PROVIDER' instead of aws-integration" >&2; exit 1; }
          jq -e '.google_place_id | strings | length > 0' "$TMP_DIR/details.json" >/dev/null
          jq -e '.latitude != null and .longitude != null' "$TMP_DIR/details.json" >/dev/null

          echo "Google public routes are using AWS Integration on the exact production revision."
