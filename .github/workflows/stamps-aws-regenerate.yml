name: Regenerate clean Stamps AWS migration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stamps-aws-regenerate.yml'

permissions:
  contents: write

concurrency:
  group: stamps-aws-regenerate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply current-main vault-backed Stamps cutover
        id: apply
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/stamps-generator.log"
          set +e
          python - <<'PYTHON' >"$LOG_FILE" 2>&1
          from pathlib import Path
          import subprocess
          import sys

          source = Path('.github/workflows/stamps-vault-finish.yml').read_text()
          begin_marker = '          cat > "$RUNNER_TEMP/finish_stamps_vault.py" <<\'PY\'\n'
          start = source.index(begin_marker) + len(begin_marker)
          end = source.index('\n          PY\n', start)
          block = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          script = '\n'.join(line for line in script.splitlines() if not (line.strip().startswith('assert ') and 'transactionalOperationsEnabled' in line)) + '\n'
          target = Path('/tmp/finish_stamps_vault.py')
          target.write_text(script)
          subprocess.run([sys.executable, str(target)], check=True)
          PYTHON
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "Stamps generator failed before any generated files were committed."
              echo "Exit status: $STATUS"
              echo
              tail -n 120 "$LOG_FILE"
            } > stamps-generator-error.txt
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m py_compile infra/aws/lambda/platform_integration_api.py
          rm -rf infra/aws/lambda/__pycache__
          git diff --check
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Commit generator diagnostics
        if: steps.apply.outputs.failed == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stamps-generator-error.txt
          git commit -m "Capture Stamps generator failure"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Commit generated non-workflow migration
        if: steps.apply.outputs.failed != 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/aws/lambda/platform_integration_api.py \
            infra/aws/cloudformation/integration-api.yml \
            lib/aws/integration-api.ts \
            app/api/admin/mailing-batches/postage/connection/route.ts \
            app/api/admin/settings/credentials/route.ts \
            'app/admin/dashboard/operations/mailing-batches/[id]/StampsPostagePanel.tsx'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Wire Stamps vault to AWS Integration API"
          git push origin "HEAD:${HEAD_BRANCH}"
