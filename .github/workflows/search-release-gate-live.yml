name: Search Release Gate Live QA

on:
  push:
    branches:
      - qa/search-95-live-run-20260826
    paths:
      - scripts/run-search-release-gate-live-v2.ts
      - .github/workflows/search-release-gate-live.yml

permissions:
  contents: read

jobs:
  live-search-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEARCH_QA_BASE_URL: https://www.theouthaven.com
      SEARCH_QA_BETA_TESTER_ID: d00903fe-7222-40b8-bef2-ca893d83dcd7
      SEARCH_QA_SESSION_ID: search-release-gate-20260826-5df30876-v2
      SEARCH_QA_GUEST_ID: search-release-gate-20260826-5df30876-v2
      SEARCH_QA_MIN_INTERVAL_MS: '2200'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run throttled 180-query live release gate
        run: npx --yes tsx@4.20.5 scripts/run-search-release-gate-live-v2.ts

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-release-gate-live-results-v2
          path: qa-results-v2.json
          if-no-files-found: warn
          retention-days: 3
