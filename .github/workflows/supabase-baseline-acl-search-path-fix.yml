name: Supabase baseline ACL signature fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/supabase-migration-history-alignment
    paths:
      - '.github/workflows/supabase-baseline-acl-search-path-fix.yml'

permissions:
  contents: write

jobs:
  fix-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-migration-history-alignment

      - name: Add deterministic ACL type search path
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          test "${#migrations[@]}" -eq 1 || {
            echo "Expected exactly one active migration; found ${#migrations[@]}" >&2
            exit 1
          }
          baseline="${migrations[0]}"
          marker='-- BEGIN GENERATED PRODUCTION ACCESS PARITY'
          marker_count="$(grep -c -F -- "$marker" "$baseline")"
          test "$marker_count" = "1" || {
            echo "Expected one access-parity marker; found $marker_count" >&2
            exit 1
          }
          if grep -q '^set search_path = public, pg_catalog;$' "$baseline"; then
            echo "Search path fix is already present"
            exit 0
          fi
          awk -v marker="$marker" '
            { print }
            $0 == marker { print "set search_path = public, pg_catalog;" }
          ' "$baseline" > "$baseline.tmp"
          mv "$baseline.tmp" "$baseline"
          grep -A1 -F -- "$marker" "$baseline" | grep -q '^set search_path = public, pg_catalog;$'
          git diff --check
          echo "acl_signature_search_path_fixed=true"

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*.sql
          git diff --cached --quiet && { echo "No baseline change to commit"; exit 0; }
          git commit -m 'Fix baseline ACL type resolution'
          git push origin HEAD:fix/supabase-migration-history-alignment
