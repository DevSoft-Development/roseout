name: Azure consumer runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/azure/**"
      - ".github/workflows/azure-consumer-runtime.yml"
      - "docs/architecture/azure-consumer-runtime.md"
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full Git commit SHA already pushed as the staging ACR consumer image tag
        type: string
        required: true
      deploy:
        description: Deploy the staging consumer Container App
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-consumer-runtime-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate consumer runtime Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -euo pipefail
            az bicep build --file infra/azure/main.bicep
            test -f infra/azure/main.json
            rm infra/azure/main.json

  deploy:
    name: Deploy staging consumer runtime
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS access to central Credential Vault
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: us-east-1
          allowed-account-ids: '742020474738'

      - name: Resolve staging configuration from Admin Credential Vault
        run: |
          set -euo pipefail
          PREFIX="/theouthaven/credential-vault/staging"
          WORK="$RUNNER_TEMP/azure-consumer-vault"
          mkdir -p "$WORK"

          aws secretsmanager get-secret-value --secret-id "$PREFIX/supabase" --query SecretString --output text > "$WORK/supabase.json"
          aws secretsmanager get-secret-value --secret-id "$PREFIX/huggingface" --query SecretString --output text > "$WORK/huggingface.json"

          jq -e 'type == "object"' "$WORK/supabase.json" >/dev/null
          jq -e 'type == "object"' "$WORK/huggingface.json" >/dev/null

          SUPABASE_URL="$(jq -r '.url // empty' "$WORK/supabase.json")"
          SUPABASE_ANON_KEY="$(jq -r '.publishableKey // empty' "$WORK/supabase.json")"
          SUPABASE_SERVICE_ROLE_KEY="$(jq -r '.serviceRoleKey // empty' "$WORK/supabase.json")"
          HUGGINGFACE_AI_TOKEN="$(jq -r '.token // empty' "$WORK/huggingface.json")"
          HUGGINGFACE_AI_ENDPOINT="$(jq -r '.aiEndpoint // "https://router.huggingface.co/v1"' "$WORK/huggingface.json")"
          HUGGINGFACE_AI_MODEL="$(jq -r '.aiModel // empty' "$WORK/huggingface.json")"
          SITE_URL="https://staging.theouthaven.com"

          test -n "$SUPABASE_URL" || { echo "::error::Admin Credential Vault staging Supabase URL is missing."; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Admin Credential Vault staging Supabase publishable key is missing."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Admin Credential Vault staging Supabase service role key is missing."; exit 1; }
          test -n "$HUGGINGFACE_AI_TOKEN" || { echo "::error::Admin Credential Vault staging Hugging Face access token is missing."; exit 1; }
          test -n "$HUGGINGFACE_AI_MODEL" || { echo "::error::Admin Credential Vault staging Hugging Face AI fallback model is missing."; exit 1; }

          for value in "$SUPABASE_ANON_KEY" "$SUPABASE_SERVICE_ROLE_KEY" "$HUGGINGFACE_AI_TOKEN"; do
            echo "::add-mask::$value"
          done

          {
            echo "SITE_URL=$SITE_URL"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "HUGGINGFACE_AI_TOKEN=$HUGGINGFACE_AI_TOKEN"
            echo "HUGGINGFACE_AI_ENDPOINT=$HUGGINGFACE_AI_ENDPOINT"
            echo "HUGGINGFACE_AI_MODEL=$HUGGINGFACE_AI_MODEL"
          } >> "$GITHUB_ENV"

          rm -rf "$WORK"
          echo "Azure consumer configuration resolved from the central Admin Credential Vault."

      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve staging dependencies
        id: azure
        uses: azure/CLI@v2
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        with:
          inlineScript: |
            set -euo pipefail
            if ! printf '%s' "$IMAGE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::image_sha must be a full 40-character Git commit SHA."
              exit 1
            fi

            RG="rg-toh-consumer-staging"
            ACR="$(az acr list --resource-group "$RG" --query '[0].name' -o tsv)"
            test -n "$ACR" || { echo "::error::No staging ACR found."; exit 1; }

            IMAGE_TAG="$(az acr repository show-tags               --name "$ACR"               --repository consumer               --query "[?@=='$IMAGE_SHA'] | [0]"               -o tsv)"
            test "$IMAGE_TAG" = "$IMAGE_SHA" || {
              echo "::error::consumer:$IMAGE_SHA is not present in staging ACR. Push the image first."
              exit 1
            }

            AI_ACCOUNT="$(az cognitiveservices account list               --resource-group "$RG"               --query "[?kind=='AIServices'] | [0].name"               -o tsv)"
            test -n "$AI_ACCOUNT" || { echo "::error::No staging Azure AI account found."; exit 1; }

            AI_ENDPOINT="$(az cognitiveservices account show               --resource-group "$RG"               --name "$AI_ACCOUNT"               --query properties.endpoint               -o tsv)"
            AI_KEY="$(az cognitiveservices account keys list               --resource-group "$RG"               --name "$AI_ACCOUNT"               --query key1               -o tsv)"
            test -n "$AI_ENDPOINT" || { echo "::error::Azure AI endpoint is missing."; exit 1; }
            test -n "$AI_KEY" || { echo "::error::Azure AI key is missing."; exit 1; }
            echo "::add-mask::$AI_KEY"

            echo "registry=$ACR" >> "$GITHUB_OUTPUT"
            echo "image=$ACR.azurecr.io/consumer:$IMAGE_SHA" >> "$GITHUB_OUTPUT"
            echo "ai_endpoint=$AI_ENDPOINT" >> "$GITHUB_OUTPUT"
            echo "ai_key=$AI_KEY" >> "$GITHUB_OUTPUT"

      - name: What-if staging runtime
        uses: azure/CLI@v2
        env:
          IMAGE: ${{ steps.azure.outputs.image }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          AZURE_AI_ENDPOINT: ${{ steps.azure.outputs.ai_endpoint }}
          AZURE_AI_API_KEY: ${{ steps.azure.outputs.ai_key }}
        with:
          inlineScript: |
            set -euo pipefail
            az deployment sub what-if               --name toh-consumer-runtime-staging               --location eastus2               --template-file infra/azure/main.bicep               --parameters infra/azure/parameters/staging.bicepparam               consumerRuntimeEnabled=true               consumerImage="$IMAGE"               consumerGitSha="$IMAGE_SHA"               consumerNextPublicSiteUrl="$SITE_URL"               consumerNextPublicSupabaseUrl="$SUPABASE_URL"               consumerNextPublicSupabaseAnonKey="$SUPABASE_ANON_KEY"               consumerSupabaseServiceRoleKey="$SUPABASE_SERVICE_ROLE_KEY"               consumerAzureAiEndpoint="$AZURE_AI_ENDPOINT"               consumerAzureAiApiKey="$AZURE_AI_API_KEY"               consumerAzureAiModel=toh-primary               consumerHuggingFaceAiEndpoint="$HUGGINGFACE_AI_ENDPOINT"               consumerHuggingFaceAiToken="$HUGGINGFACE_AI_TOKEN"               consumerHuggingFaceAiModel="$HUGGINGFACE_AI_MODEL"

      - name: Deploy staging runtime
        uses: azure/CLI@v2
        env:
          IMAGE: ${{ steps.azure.outputs.image }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          AZURE_AI_ENDPOINT: ${{ steps.azure.outputs.ai_endpoint }}
          AZURE_AI_API_KEY: ${{ steps.azure.outputs.ai_key }}
        with:
          inlineScript: |
            set -euo pipefail
            az deployment sub create               --name toh-consumer-runtime-staging               --location eastus2               --template-file infra/azure/main.bicep               --parameters infra/azure/parameters/staging.bicepparam               consumerRuntimeEnabled=true               consumerImage="$IMAGE"               consumerGitSha="$IMAGE_SHA"               consumerNextPublicSiteUrl="$SITE_URL"               consumerNextPublicSupabaseUrl="$SUPABASE_URL"               consumerNextPublicSupabaseAnonKey="$SUPABASE_ANON_KEY"               consumerSupabaseServiceRoleKey="$SUPABASE_SERVICE_ROLE_KEY"               consumerAzureAiEndpoint="$AZURE_AI_ENDPOINT"               consumerAzureAiApiKey="$AZURE_AI_API_KEY"               consumerAzureAiModel=toh-primary               consumerHuggingFaceAiEndpoint="$HUGGINGFACE_AI_ENDPOINT"               consumerHuggingFaceAiToken="$HUGGINGFACE_AI_TOKEN"               consumerHuggingFaceAiModel="$HUGGINGFACE_AI_MODEL"

      - name: Smoke-test Azure Container App
        uses: azure/CLI@v2
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        with:
          inlineScript: |
            set -euo pipefail
            FQDN="$(az deployment sub show               --name toh-consumer-runtime-staging               --query properties.outputs.consumerRuntimeFqdn.value               -o tsv)"
            test -n "$FQDN" || { echo "::error::Container App FQDN was not returned."; exit 1; }

            ACTUAL_IMAGE="$(az containerapp show               --resource-group rg-toh-consumer-staging               --name ca-toh-consumer-stg-primary               --query properties.template.containers[0].image               -o tsv)"
            case "$ACTUAL_IMAGE" in
              *":$IMAGE_SHA") ;;
              *) echo "::error::Runtime image does not match requested commit SHA."; exit 1 ;;
            esac

            for attempt in $(seq 1 18); do
              CODE="$(curl --silent --output health.json --write-out '%{http_code}'                 --connect-timeout 10 --max-time 20                 "https://$FQDN/api/health/azure" || true)"
              if [ "$CODE" = "200" ] && jq -e '.ok == true and .service == "theouthaven-consumer"' health.json >/dev/null 2>&1; then
                echo "Azure consumer health smoke passed."
                {
                  echo "### Azure consumer staging runtime"
                  echo ""
                  echo "- Image: $ACTUAL_IMAGE"
                  echo "- FQDN: https://$FQDN"
                  echo "- Health: passed"
                  echo "- DNS cutover: not performed"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              sleep 10
            done

            echo "::error::Azure consumer runtime did not become healthy."
            cat health.json 2>/dev/null || true
            exit 1

      - name: Smoke-test consumer pages before DNS cutover
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -euo pipefail
            FQDN="$(az deployment sub show --name toh-consumer-runtime-staging --query properties.outputs.consumerRuntimeFqdn.value -o tsv)"
            test -n "$FQDN" || { echo "::error::Container App FQDN was not returned."; exit 1; }

            for path in / /explore /create; do
              body_file="$(mktemp)"
              code="$(curl --silent --show-error --location --output "$body_file" --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "https://$FQDN$path" || true)"
              if [ "$code" != "200" ]; then
                echo "::error::Consumer page $path returned HTTP $code"
                head -c 1000 "$body_file" || true
                rm -f "$body_file"
                exit 1
              fi

              if ! grep -qi '<html' "$body_file"; then
                echo "::error::Consumer page $path did not return an HTML document."
                head -c 1000 "$body_file" || true
                rm -f "$body_file"
                exit 1
              fi

              rm -f "$body_file"
              echo "Consumer page smoke passed: $path"
            done

            {
              echo ""
              echo "### Pre-DNS consumer surface smoke"
              echo ""
              echo "- Home: passed"
              echo "- Explore: passed"
              echo "- Create: passed"
              echo "- DNS cutover: not performed"
            } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test consumer APIs before DNS cutover
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -euo pipefail
            FQDN="$(az deployment sub show --name toh-consumer-runtime-staging --query properties.outputs.consumerRuntimeFqdn.value -o tsv)"
            test -n "$FQDN" || { echo "::error::Container App FQDN was not returned."; exit 1; }

            auth_code="$(curl --silent --show-error --output auth.json --write-out '%{http_code}'               --connect-timeout 10 --max-time 30               -H 'content-type: application/json'               --data '{}'               "https://$FQDN/api/auth/sign-in" || true)"
            if [ "$auth_code" != "400" ] || ! jq -e '.ok == false' auth.json >/dev/null 2>&1; then
              echo "::error::Auth route validation failed with HTTP $auth_code"
              cat auth.json 2>/dev/null || true
              exit 1
            fi
            echo "Consumer auth route smoke passed."

            web_search_code="$(curl --silent --show-error --output web-search.json --write-out '%{http_code}'               --connect-timeout 10 --max-time 90               -H 'content-type: application/json'               -H 'x-theouthaven-guest-id: azure-staging-web-smoke'               --data '{"input":"Italian restaurant in Manhattan","selectedSearchLane":"restaurant","timezone":"America/New_York"}'               "https://$FQDN/api/generate" || true)"
            if [ "$web_search_code" != "200" ] || ! jq -e '.success == true or .status == "ok" or .restaurants != null or .cards != null' web-search.json >/dev/null 2>&1; then
              echo "::error::Canonical web search smoke failed with HTTP $web_search_code"
              jq '{success,status,error,reply,render_mode,renderMode}' web-search.json 2>/dev/null || cat web-search.json 2>/dev/null || true
              echo "Recent Container App logs:"
              az containerapp logs show --resource-group rg-toh-consumer-staging --name ca-toh-consumer-stg-primary --tail 100 --follow false || true
              exit 1
            fi
            echo "Canonical web search route smoke passed."

            search_code="$(curl --silent --show-error --output search.json --write-out '%{http_code}'               --connect-timeout 10 --max-time 90               -H 'content-type: application/json'               -H 'x-theouthaven-guest-id: azure-staging-mobile-smoke'               --data '{"query":"Italian restaurant in Manhattan","planType":"restaurant","area":"Manhattan","areaSource":"manual"}'               "https://$FQDN/api/mobile/v1/search" || true)"
            if [ "$search_code" != "200" ] || ! jq -e '.ok == true and (.restaurants | type == "array") and (.activities | type == "array") and (.pairs | type == "array")' search.json >/dev/null 2>&1; then
              echo "::error::Mobile search adapter smoke failed with HTTP $search_code"
              jq '{ok,error,reply,resolvedPlanType,canonicalSearchType}' search.json 2>/dev/null || cat search.json 2>/dev/null || true
              echo "Recent Container App logs:"
              az containerapp logs show --resource-group rg-toh-consumer-staging --name ca-toh-consumer-stg-primary --tail 100 --follow false || true
              exit 1
            fi
            echo "Consumer mobile search route smoke passed."

            {
              echo ""
              echo "### Pre-DNS consumer API smoke"
              echo ""
              echo "- Auth validation route: passed"
              echo "- Canonical web search route: passed"
              echo "- Mobile search adapter: passed"
              echo "- DNS cutover: not performed"
            } >> "$GITHUB_STEP_SUMMARY"
