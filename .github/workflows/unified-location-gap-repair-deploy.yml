name: Unified Location Gap Repair Deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/unified-location-gap-repair/**"
      - ".github/workflows/unified-location-gap-repair-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-location-gap-repair-production
  cancel-in-progress: false

jobs:
  test-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: hnhbzynoyrhjndefbwkh
      SUPABASE_URL: https://hnhbzynoyrhjndefbwkh.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deploy secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN GitHub Actions secret" >&2
            exit 1
          fi

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test unified location gap repair
        run: |
          deno test \
            supabase/functions/unified-location-gap-repair/menu-discovery.test.ts \
            supabase/functions/unified-location-gap-repair/reservation-discovery.test.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Deploy unified location gap repair
        run: |
          supabase functions deploy unified-location-gap-repair \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Verify deployed endpoint authentication
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/unified-gap-repair-response.json --write-out '%{http_code}' \
            -X POST "$SUPABASE_URL/functions/v1/unified-location-gap-repair" \
            -H 'Content-Type: application/json' \
            --data '{}')
          cat /tmp/unified-gap-repair-response.json
          if [ "$status" != "401" ]; then
            echo "Expected custom-auth HTTP 401 from unified-location-gap-repair, got $status" >&2
            exit 1
          fi
