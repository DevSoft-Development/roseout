name: Surface app isolation foundation

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/surface-app-isolation-regression.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/surface-app-isolation-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/surface-app-isolation-regression.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/surface-app-isolation-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        surface: [consumer, admin, business, reserve]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect surface scope
        id: surface_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SURFACE: ${{ matrix.surface }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$CHANGED"

          run=false

          if printf '%s\n' "$CHANGED" | grep -Eq '^(package(-lock)?\.json|\.github/workflows/surface-app-isolation-foundation\.yml)$'; then
            run=true
          elif printf '%s\n' "$CHANGED" | grep -Eq '^packages/'; then
            run=true
          elif printf '%s\n' "$CHANGED" | grep -Eq "^apps/${SURFACE}/"; then
            run=true
          elif [ "$SURFACE" = "admin" ] && printf '%s\n' "$CHANGED" | grep -Eq '^scripts/surface-app-isolation-regression\.mjs$'; then
            run=true
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.surface_scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        if: steps.surface_scope.outputs.run == 'true'
        run: npm ci

      - name: Verify surface isolation boundary
        if: steps.surface_scope.outputs.run == 'true'
        run: npm run test:surface-app-isolation

      - name: Build isolated non-Reserve surface
        if: steps.surface_scope.outputs.run == 'true' && matrix.surface != 'reserve' && matrix.surface != 'business'
        run: npm run build:surface:${{ matrix.surface }}

      - name: Build isolated Business surface
        if: steps.surface_scope.outputs.run == 'true' && matrix.surface == 'business'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: business-ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: business-ci-placeholder
        run: npm run build:surface:business

      - name: Build isolated Reserve surface
        if: steps.surface_scope.outputs.run == 'true' && matrix.surface == 'reserve'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: reserve-ci-placeholder
        run: npm run build:surface:reserve

      - name: Report skipped surface
        if: steps.surface_scope.outputs.run != 'true'
        run: echo "No changes require the ${{ matrix.surface }} surface build." >> "$GITHUB_STEP_SUMMARY"
