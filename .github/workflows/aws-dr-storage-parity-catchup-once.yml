name: AWS DR storage parity catch-up once

on:
  pull_request:
    paths:
      - '.github/workflows/aws-dr-storage-parity-catchup-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-dr-storage-parity-catchup-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-dr-storage-parity-catchup-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-edge-runtime
  DR_SECRET_NAME: /theouthaven/production/dr-reconciler/env

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-time storage catch-up contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-dr-storage-parity-catchup-once.yml'
          grep -F 'DR_MODE' "$FILE" >/dev/null
          grep -F 'dr-storage-standby-reconcile' "$FILE" >/dev/null
          grep -F 'dr-auth-standby-reconcile' "$FILE" >/dev/null
          grep -F 'operation":"storage"' "$FILE" >/dev/null
          grep -F 'dryRun":false' "$FILE" >/dev/null
          grep -F 'maxCopies":50' "$FILE" >/dev/null
          grep -F 'storage.parity==true' "$FILE" >/dev/null
          grep -F 'auth.parity==true' "$FILE" >/dev/null
          FILE="$FILE" python <<'PY'
          import os
          from pathlib import Path

          text = Path(os.environ['FILE']).read_text(encoding='utf-8')
          forbidden = (
              'aws scheduler ' + 'update-schedule',
              'aws scheduler ' + 'create-schedule',
              'aws scheduler ' + 'delete-schedule',
              'apply-' + 'migration',
              'execute-' + 'sql',
              'pg_drop_replication_slot',
              'drop subscription',
              'truncate table',
          )
          found = [item for item in forbidden if item in text.lower()]
          if found:
              raise SystemExit(f'Catch-up workflow contains forbidden mutation path: {found}')
          PY

  catch_up:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Require Virginia primary and fail-closed DR schedules
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws secretsmanager get-secret-value --secret-id "$DR_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/dr-current.json"
          test "$(jq -r '.DR_MODE // empty' "$RUNNER_TEMP/dr-current.json")" = 'virginia_primary'
          test "$(jq 'length' infra/aws/edge-runtime/schedules.json)" = '65'
          while IFS= read -r name; do
            test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)" = 'ENABLED' || {
              echo "Base production schedule is not enabled: $name" >&2
              exit 1
            }
          done < <(jq -r '.[].name' infra/aws/edge-runtime/schedules.json)
          for name in dr-auth-standby-reconcile dr-storage-standby-reconcile; do
            test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)" = 'DISABLED' || {
              echo "Forward DR schedule must remain disabled during one-time catch-up: $name" >&2
              exit 1
            }
          done

      - name: Inspect current standby storage gap
        run: |
          set -euo pipefail
          invoker="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$invoker"
          echo "invoker=$invoker" >> "$GITHUB_ENV"
          printf '%s' '{"function":"dr-standby-reconciler","body":{"operation":"status","dryRun":true}}' > "$RUNNER_TEMP/status-input.json"
          aws lambda invoke --function-name "$invoker" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/status-input.json" "$RUNNER_TEMP/status-before.json" >/dev/null
          jq -c '{ok,status,success:.response.success,sourceActiveSlots:.response.guard.sourceActiveSlots,targetReadyTables:.response.guard.targetReadyTables,targetConnectedWorkers:.response.guard.targetConnectedWorkers,auth_parity:.response.auth.parity,storage_parity:.response.storage.parity,copyOrReplace:.response.storage.copyOrReplace,targetOnly:.response.storage.targetOnly}' "$RUNNER_TEMP/status-before.json"
          jq -e '.ok==true and .status<400 and .response.success==true and .response.guard.sourceCronJobs==0 and .response.guard.sourceActiveSlots==1 and .response.guard.targetActiveCronJobs==0 and .response.guard.targetReadyTables==462 and .response.guard.targetConnectedWorkers>=1 and .response.storage.copyOrReplace<=50 and .response.storage.targetOnly==0' "$RUNNER_TEMP/status-before.json" >/dev/null

      - name: Catch up missing or mismatched storage objects
        run: |
          set -euo pipefail
          if jq -e '.response.storage.parity==true' "$RUNNER_TEMP/status-before.json" >/dev/null; then
            echo 'Storage parity already healthy; no copy required.'
            exit 0
          fi
          printf '%s' '{"function":"dr-standby-reconciler","body":{"operation":"storage","dryRun":false,"maxCopies":50}}' > "$RUNNER_TEMP/storage-input.json"
          aws lambda invoke --function-name "$invoker" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/storage-input.json" "$RUNNER_TEMP/storage-output.json" >/dev/null
          jq -c '{ok,status,success:.response.success,operation:.response.operation,copied:.response.copied,deferredCopies:.response.deferredCopies,targetOnly:.response.targetOnly,pendingDeletes:.response.pendingDeletes,parity:.response.parity}' "$RUNNER_TEMP/storage-output.json"
          jq -e '.ok==true and .status<400 and .response.success==true and .response.operation=="storage" and .response.deferredCopies==0 and .response.targetOnly==0' "$RUNNER_TEMP/storage-output.json" >/dev/null

      - name: Require full passive standby parity
        run: |
          set -euo pipefail
          printf '%s' '{"function":"dr-standby-reconciler","body":{"operation":"status","dryRun":true}}' > "$RUNNER_TEMP/status-input.json"
          aws lambda invoke --function-name "$invoker" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/status-input.json" "$RUNNER_TEMP/status-after.json" >/dev/null
          jq -c '{ok,status,success:.response.success,sourceCronJobs:.response.guard.sourceCronJobs,sourceActiveSlots:.response.guard.sourceActiveSlots,sourceSlotLagBytes:.response.guard.sourceSlotLagBytes,targetActiveCronJobs:.response.guard.targetActiveCronJobs,targetReadyTables:.response.guard.targetReadyTables,targetConnectedWorkers:.response.guard.targetConnectedWorkers,auth_parity:.response.auth.parity,storage_parity:.response.storage.parity}' "$RUNNER_TEMP/status-after.json"
          jq -e '.ok==true and .status<400 and .response.success==true and .response.guard.sourceCronJobs==0 and .response.guard.sourceActiveSlots==1 and .response.guard.targetActiveCronJobs==0 and .response.guard.targetReadyTables==462 and .response.guard.targetConnectedWorkers>=1 and .response.auth.parity==true and .response.storage.parity==true' "$RUNNER_TEMP/status-after.json" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.json
