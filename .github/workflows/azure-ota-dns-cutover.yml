name: Azure OTA DNS cutover
# Final Azure OTA DNS cutover trigger.
# Final cutover trigger: 2026-09-30

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/azure-ota-dns-cutover.yml'
      - 'infra/azure/ota-dns-cutover-request.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-ota-dns-cutover.yml'
      - 'infra/azure/ota-dns-cutover-request.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-ota-dns-cutover-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: '742020474738'
  AWS_REGION: us-east-1
  DOMAIN_NAME: theouthaven.com
  OTA_HOST: updates.theouthaven.com
  SNAPSHOT_SECRET: theouthaven/production/ota/dns-cutover-last-snapshot
  AZURE_RESOURCE_GROUP: rg-toh-consumer-production
  AZURE_DEPLOYMENT: toh-ota-foundation-production
  AZURE_CUSTOM_DOMAIN_NAME: updates

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OTA DNS cutover request
        run: |
          set -euo pipefail
          jq -e '
            .operation == "cutover" and
            .confirmation == "CUTOVER_OTA"
          ' infra/azure/ota-dns-cutover-request.json >/dev/null

  execute:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure OTA Front Door and validation token
        id: azure
        uses: azure/CLI@v3
        with:
          inlineScript: |
            set -euo pipefail
            PROFILE="$(az deployment sub show               --name "$AZURE_DEPLOYMENT"               --query properties.outputs.otaFrontDoorProfileName.value -o tsv)"
            EDGE="$(az deployment sub show               --name "$AZURE_DEPLOYMENT"               --query properties.outputs.otaFrontDoorEndpointHostName.value -o tsv)"
            test -n "$PROFILE" && test "$PROFILE" != None
            test -n "$EDGE" && test "$EDGE" != None

            az afd custom-domain show               --resource-group "$AZURE_RESOURCE_GROUP"               --profile-name "$PROFILE"               --custom-domain-name "$AZURE_CUSTOM_DOMAIN_NAME"               -o json > /tmp/custom-domain.json

            TOKEN="$(jq -r '.validationProperties.validationToken // empty' /tmp/custom-domain.json)"
            STATE="$(jq -r '.domainValidationState // empty' /tmp/custom-domain.json)"
            HOST="$(jq -r '.hostName // empty' /tmp/custom-domain.json)"

            test "$HOST" = "$OTA_HOST"
            test -n "$TOKEN" || {
              echo "::error::Azure Front Door did not return a domain validation token."
              cat /tmp/custom-domain.json
              exit 1
            }

            echo "::add-mask::$TOKEN"
            echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
            echo "edge=$EDGE" >> "$GITHUB_OUTPUT"
            echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
            echo "state=$STATE" >> "$GITHUB_OUTPUT"
            echo "Front Door domain state before DNS: $STATE"

      - name: Configure temporary AWS credentials
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Bootstrap narrowly scoped OTA DNS permissions
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          cat > "$RUNNER_TEMP/ota-dns-policy.json" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"OtaRoute53",
                "Effect":"Allow",
                "Action":[
                  "route53:ListHostedZones",
                  "route53:ListResourceRecordSets",
                  "route53:ChangeResourceRecordSets",
                  "route53:GetChange"
                ],
                "Resource":"*"
              },
              {
                "Sid":"OtaDnsSnapshot",
                "Effect":"Allow",
                "Action":[
                  "secretsmanager:CreateSecret",
                  "secretsmanager:DescribeSecret",
                  "secretsmanager:GetSecretValue",
                  "secretsmanager:PutSecretValue"
                ],
                "Resource":"*"
              }
            ]
          }
          JSON
          aws iam put-role-policy             --role-name "$ROLE_NAME"             --policy-name TheOutHavenOtaDnsCutoverBootstrap             --policy-document "file://$RUNNER_TEMP/ota-dns-policy.json"
          sleep 8

      - name: Resolve Route 53 zone and capture rollback snapshot
        id: dns
        env:
          VALIDATION_TOKEN: ${{ steps.azure.outputs.token }}
        run: |
          set -euo pipefail
          aws route53 list-hosted-zones > "$RUNNER_TEMP/zones.json"
          HOSTED_ZONE_ID="$(jq -r --arg name "${DOMAIN_NAME}." '[.HostedZones[] | select(.Name==$name and .Config.PrivateZone==false)][0].Id // empty' "$RUNNER_TEMP/zones.json" | sed 's#^/hostedzone/##')"
          test -n "$HOSTED_ZONE_ID"
          echo "hosted_zone_id=$HOSTED_ZONE_ID" >> "$GITHUB_OUTPUT"

          aws route53 list-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/current.json"

          python - <<'PY'
          import json, os
          current=json.load(open(os.environ['RUNNER_TEMP']+'/current.json'))['ResourceRecordSets']
          names={os.environ['OTA_HOST'].rstrip('.')+'.', '_dnsauth.'+os.environ['OTA_HOST'].rstrip('.')+'.'}
          rows=[r for r in current if r.get('Name') in names and r.get('Type') in {'A','AAAA','CNAME','TXT'}]
          for row in rows:
              if row.get('SetIdentifier') or row.get('Failover') or row.get('GeoLocation') or row.get('Region') or row.get('MultiValueAnswer'):
                  raise SystemExit(f"Refusing policy-based OTA DNS record: {row.get('Name')} {row.get('Type')}")
          raw=json.dumps({'records':rows},separators=(',',':'))
          if len(raw.encode()) > 3500:
              raise SystemExit('OTA DNS snapshot too large for rollback secret')
          open(os.environ['RUNNER_TEMP']+'/snapshot.json','w').write(raw)
          print(json.dumps({'records':rows},indent=2))
          PY

          SNAPSHOT_VALUE="$(cat "$RUNNER_TEMP/snapshot.json")"
          if aws secretsmanager describe-secret --secret-id "$SNAPSHOT_SECRET" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value               --secret-id "$SNAPSHOT_SECRET"               --secret-string "$SNAPSHOT_VALUE" >/dev/null
          else
            aws secretsmanager create-secret               --name "$SNAPSHOT_SECRET"               --description 'TheOutHaven OTA DNS pre-cutover rollback snapshot'               --secret-string "$SNAPSHOT_VALUE" >/dev/null
          fi

      - name: Publish Front Door domain-validation TXT
        env:
          HOSTED_ZONE_ID: ${{ steps.dns.outputs.hosted_zone_id }}
          VALIDATION_TOKEN: ${{ steps.azure.outputs.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          name='_dnsauth.'+os.environ['OTA_HOST'].rstrip('.')+'.'
          record={
            'Name':name,
            'Type':'TXT',
            'TTL':60,
            'ResourceRecords':[{'Value':json.dumps(os.environ['VALIDATION_TOKEN'])}],
          }
          json.dump({
            'Comment':'Validate TheOutHaven OTA custom domain with Azure Front Door',
            'Changes':[{'Action':'UPSERT','ResourceRecordSet':record}],
          },open(os.environ['RUNNER_TEMP']+'/txt-change.json','w'))
          PY
          CHANGE_ID="$(aws route53 change-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID"             --change-batch "file://$RUNNER_TEMP/txt-change.json"             --query 'ChangeInfo.Id' --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"

      - name: Wait for Front Door domain validation
        uses: azure/CLI@v3
        env:
          PROFILE: ${{ steps.azure.outputs.profile }}
        with:
          inlineScript: |
            set -euo pipefail
            for attempt in $(seq 1 60); do
              az afd custom-domain show                 --resource-group "$AZURE_RESOURCE_GROUP"                 --profile-name "$PROFILE"                 --custom-domain-name "$AZURE_CUSTOM_DOMAIN_NAME"                 -o json > /tmp/custom-domain-wait.json

              STATE="$(jq -r '.domainValidationState // empty' /tmp/custom-domain-wait.json)"
              PROVISIONING="$(jq -r '.provisioningState // empty' /tmp/custom-domain-wait.json)"
              echo "Attempt $attempt: domainValidationState=$STATE provisioningState=$PROVISIONING"

              if [ "$STATE" = "Approved" ] && [ "$PROVISIONING" = "Succeeded" ]; then
                exit 0
              fi
              case "$STATE" in
                Rejected|Timeout)
                  cat /tmp/custom-domain-wait.json
                  exit 1
                  ;;
              esac
              sleep 15
            done
            echo "::error::Azure Front Door custom-domain validation did not reach Approved."
            cat /tmp/custom-domain-wait.json
            exit 1

      - name: Cut over OTA hostname to Azure Front Door
        env:
          HOSTED_ZONE_ID: ${{ steps.dns.outputs.hosted_zone_id }}
          EDGE: ${{ steps.azure.outputs.edge }}
        run: |
          set -euo pipefail
          aws route53 list-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/pre-cname.json"

          python - <<'PY'
          import json, os
          current=json.load(open(os.environ['RUNNER_TEMP']+'/pre-cname.json'))['ResourceRecordSets']
          host=os.environ['OTA_HOST'].rstrip('.')+'.'
          rows=[r for r in current if r.get('Name')==host and r.get('Type') in {'A','AAAA','CNAME','CAA'}]
          changes=[{'Action':'DELETE','ResourceRecordSet':r} for r in rows]
          changes.append({
            'Action':'CREATE',
            'ResourceRecordSet':{
              'Name':host,
              'Type':'CNAME',
              'TTL':60,
              'ResourceRecords':[{'Value':os.environ['EDGE'].rstrip('.')+'.'}],
            }
          })
          json.dump({
            'Comment':'Cut TheOutHaven OTA hostname over to Azure Front Door',
            'Changes':changes,
          },open(os.environ['RUNNER_TEMP']+'/cname-change.json','w'))
          PY

          CHANGE_ID="$(aws route53 change-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID"             --change-batch "file://$RUNNER_TEMP/cname-change.json"             --query 'ChangeInfo.Id' --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"

      - name: Verify public OTA HTTPS and manifest route
        id: verify
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 40); do
            HEALTH_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}'               --connect-timeout 10 --max-time 20               "https://${OTA_HOST}/health.json?cb=$(date +%s)" || true)"
            MANIFEST_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/manifest.json" --write-out '%{http_code}'               --connect-timeout 10 --max-time 20               -H 'expo-platform: ios'               -H 'expo-runtime-version: 1'               -H 'expo-channel-name: internal'               "https://${OTA_HOST}/api/mobile/ota/manifest?cb=$(date +%s)" || true)"

            if [ "$HEALTH_CODE" = "200" ] && jq -e '.ok == true' "$RUNNER_TEMP/health.json" >/dev/null 2>&1               && { [ "$MANIFEST_CODE" = "200" ] || [ "$MANIFEST_CODE" = "204" ]; }; then
              ready=true
              break
            fi
            echo "Attempt $attempt: health=$HEALTH_CODE manifest=$MANIFEST_CODE"
            sleep 15
          done

          test "$ready" = true || {
            cat "$RUNNER_TEMP/health.json" >&2 || true
            cat "$RUNNER_TEMP/manifest.json" >&2 || true
            exit 1
          }

          echo "verified=true" >> "$GITHUB_OUTPUT"
          {
            echo "## OTA DNS cutover"
            echo
            echo "- Host: https://${OTA_HOST}"
            echo "- Azure Front Door: ${{ steps.azure.outputs.edge }}"
            echo "- Domain validation: Approved"
            echo "- Static health: verified"
            echo "- Expo manifest route: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Automatic DNS rollback after failed public verification
        if: failure() && steps.aws_credentials.outcome == 'success' && steps.dns.outcome == 'success' && steps.verify.outputs.verified != 'true'
        env:
          HOSTED_ZONE_ID: ${{ steps.dns.outputs.hosted_zone_id }}
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value             --secret-id "$SNAPSHOT_SECRET"             --query SecretString --output text > "$RUNNER_TEMP/rollback.json"
          aws route53 list-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/rollback-current.json"

          python - <<'PY'
          import json, os
          snap=json.load(open(os.environ['RUNNER_TEMP']+'/rollback.json'))
          current=json.load(open(os.environ['RUNNER_TEMP']+'/rollback-current.json'))['ResourceRecordSets']
          names={os.environ['OTA_HOST'].rstrip('.')+'.', '_dnsauth.'+os.environ['OTA_HOST'].rstrip('.')+'.'}
          selected=[r for r in current if r.get('Name') in names and r.get('Type') in {'A','AAAA','CNAME','TXT'}]
          changes=[{'Action':'DELETE','ResourceRecordSet':r} for r in selected]
          changes += [{'Action':'CREATE','ResourceRecordSet':r} for r in snap['records']]
          if changes:
              json.dump({
                'Comment':'Automatic rollback after failed TheOutHaven OTA DNS validation',
                'Changes':changes,
              },open(os.environ['RUNNER_TEMP']+'/rollback-change.json','w'))
          else:
              json.dump({'Comment':'No OTA DNS changes to rollback','Changes':[]},open(os.environ['RUNNER_TEMP']+'/rollback-change.json','w'))
          PY

          if [ "$(jq '.Changes|length' "$RUNNER_TEMP/rollback-change.json")" -gt 0 ]; then
            CHANGE_ID="$(aws route53 change-resource-record-sets               --hosted-zone-id "$HOSTED_ZONE_ID"               --change-batch "file://$RUNNER_TEMP/rollback-change.json"               --query 'ChangeInfo.Id' --output text)"
            aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
          fi

      - name: Remove temporary OTA DNS permissions
        if: always() && steps.aws_credentials.outcome == 'success'
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          aws iam delete-role-policy             --role-name "$ROLE_NAME"             --policy-name TheOutHavenOtaDnsCutoverBootstrap || true
