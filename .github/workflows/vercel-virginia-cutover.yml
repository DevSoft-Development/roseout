name: Vercel Virginia Supabase cutover

on:
  push:
    branches:
      - migration/vercel-virginia-cutover
    paths:
      - '.github/workflows/vercel-virginia-cutover.yml'

permissions:
  contents: read

env:
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm Vercel API credential and inspect Supabase env targets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured in GitHub Actions" >&2; exit 1; }
          envs="$RUNNER_TEMP/vercel-envs.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}" > "$envs"
          jq -e '.envs | type == "array"' "$envs" >/dev/null
          jq -r '.envs[] | select(.key == "NEXT_PUBLIC_SUPABASE_URL" or .key == "NEXT_PUBLIC_SUPABASE_ANON_KEY" or .key == "SUPABASE_SERVICE_ROLE_KEY" or .key == "SUPABASE_URL") | [.key, .id, ((.target // []) | join(",")), (.type // "unknown")] | @tsv' "$envs"
          count="$(jq '[.envs[] | select(.key == "NEXT_PUBLIC_SUPABASE_URL" or .key == "NEXT_PUBLIC_SUPABASE_ANON_KEY" or .key == "SUPABASE_SERVICE_ROLE_KEY")] | length' "$envs")"
          test "$count" -ge 3 || { echo "Required Vercel Supabase environment entries are missing" >&2; exit 1; }
          echo "vercel_supabase_env_preflight=true"
          rm -f "$envs"
