name: Azure DevOps mobile dispatch

on:
  workflow_dispatch:
    inputs:
      releasePlatform:
        description: Mobile release lane
        required: true
        type: choice
        default: both
        options:
          - both
          - ios
          - android
      releaseSha:
        description: Exact main-branch commit SHA to build
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-devops-mobile-dispatch-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  MOBILE_SIGNING_SECRET_ID: /theouthaven/credential-vault/production/mobile
  PIPELINE_NAME: TheOutHaven Mobile Production

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS access to Admin Credential Vault
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Load Azure DevOps mobile configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          SECRET_FILE="$RUNNER_TEMP/mobile-release-signing.json"
          aws secretsmanager get-secret-value \
            --secret-id "$MOBILE_SIGNING_SECRET_ID" \
            --query SecretString \
            --output text > "$SECRET_FILE"

          jq -e '
            (.azureDevOpsOrg | type == "string" and length > 0) and
            (.azureDevOpsProject | type == "string" and length > 0) and
            (.azureDevOpsPat | type == "string" and length > 0)
          ' "$SECRET_FILE" >/dev/null

          AZDO_ORG="$(jq -r '.azureDevOpsOrg' "$SECRET_FILE")"
          AZDO_PROJECT="$(jq -r '.azureDevOpsProject' "$SECRET_FILE")"
          AZDO_PAT="$(jq -r '.azureDevOpsPat' "$SECRET_FILE")"

          echo "::add-mask::$AZDO_PAT"
          echo "org=$AZDO_ORG" >> "$GITHUB_OUTPUT"
          echo "project=$AZDO_PROJECT" >> "$GITHUB_OUTPUT"

          printf '%s' "$AZDO_PAT" > "$RUNNER_TEMP/azdo-pat"
          chmod 600 "$RUNNER_TEMP/azdo-pat"
          rm -f "$SECRET_FILE"

      - name: Synchronize Azure DevOps mobile release configuration
        shell: bash
        run: bash scripts/azure-devops-mobile-bootstrap.sh

      - name: Queue mobile pipeline if needed
        env:
          AZDO_ORG: ${{ steps.config.outputs.org }}
          AZDO_PROJECT: ${{ steps.config.outputs.project }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          AZDO_PAT="$(cat "$RUNNER_TEMP/azdo-pat")"
          AUTH_HEADER="Authorization: Basic $(printf ':%s' "$AZDO_PAT" | base64 | tr -d '\n')"
          TARGET_SHA="${{ github.event.inputs.releaseSha || github.sha }}"

          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "releaseSha must be a full Git SHA." >&2
            exit 1
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "releaseSha must be on main." >&2
            exit 1
          }

          urlencode() {
            python3 - "$1" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          }

          API_ROOT="https://dev.azure.com/$AZDO_ORG"
          PROJECT_ENCODED="$(urlencode "$AZDO_PROJECT")"
          PIPELINE_ENCODED="$(urlencode "$PIPELINE_NAME")"

          DEFINITIONS="$(
            curl --fail --silent --show-error \
              -H "$AUTH_HEADER" \
              "$API_ROOT/$PROJECT_ENCODED/_apis/build/definitions?name=$PIPELINE_ENCODED&api-version=7.1"
          )"

          PIPELINE_ID="$(printf '%s' "$DEFINITIONS" | jq -r --arg name "$PIPELINE_NAME" '.value[]? | select(.name == $name) | .id' | head -1)"
          test -n "$PIPELINE_ID" || {
            echo "Azure DevOps pipeline not found: $PIPELINE_NAME" >&2
            exit 1
          }

          RECENT_BUILDS="$(
            curl --fail --silent --show-error \
              -H "$AUTH_HEADER" \
              "$API_ROOT/$PROJECT_ENCODED/_apis/build/builds?definitions=$PIPELINE_ID&queryOrder=queueTimeDescending&%24top=20&api-version=7.1"
          )"

          EXISTING_ID="$(
            printf '%s' "$RECENT_BUILDS" |
              jq -r --arg sha "$TARGET_SHA" '.value[]? | select(.sourceVersion == $sha and (.status == "notStarted" or .status == "inProgress" or .status == "completed")) | .id' |
              head -1
          )"

          if [ -n "$EXISTING_ID" ]; then
            echo "Azure DevOps mobile build already exists for $TARGET_SHA: $EXISTING_ID"
            exit 0
          fi

          RELEASE_PLATFORM="both"
          REQUESTED_PLATFORM="${{ github.event.inputs.releasePlatform || '' }}"

          if [ -n "$REQUESTED_PLATFORM" ]; then
            RELEASE_PLATFORM="$REQUESTED_PLATFORM"
            echo "Using manually requested mobile release platform: $RELEASE_PLATFORM"
          else
            PR_TITLE="$(
              curl --fail --silent --show-error \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/pulls" |
                jq -r '.[0].title // empty'
            )"
            COMMIT_MESSAGE="$(git log -1 --pretty=%B)"

            if printf '%s\n%s' "$PR_TITLE" "$COMMIT_MESSAGE" | grep -Fqi '[ios-only]'; then
              RELEASE_PLATFORM="ios"
            elif printf '%s\n%s' "$PR_TITLE" "$COMMIT_MESSAGE" | grep -Fqi '[android-only]'; then
              RELEASE_PLATFORM="android"
            fi

            echo "Associated PR title: ${PR_TITLE:-none}"
            echo "Selected mobile release platform: $RELEASE_PLATFORM"
          fi

          case "$RELEASE_PLATFORM" in
            both|ios|android) ;;
            *) echo "Invalid mobile release platform: $RELEASE_PLATFORM" >&2; exit 1 ;;
          esac

          BODY="$(
            jq -n \
              --arg sourceBranch "refs/heads/main" \
              --arg sourceVersion "$TARGET_SHA" \
              --arg releasePlatform "$RELEASE_PLATFORM" \
              '{
                resources: {
                  repositories: {
                    self: {
                      refName: $sourceBranch,
                      version: $sourceVersion
                    }
                  }
                },
                templateParameters: {
                  releasePlatform: $releasePlatform
                }
              }'
          )"

          RESPONSE_FILE="$RUNNER_TEMP/azdo-mobile-queue.json"
          STATUS="$(
            curl --silent --show-error \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "$AUTH_HEADER" \
              -H 'Content-Type: application/json' \
              --data "$BODY" \
              "$API_ROOT/$PROJECT_ENCODED/_apis/pipelines/$PIPELINE_ID/runs?api-version=7.1"
          )"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Failed to queue Azure DevOps mobile build (HTTP $STATUS)." >&2
            jq -c '{message,typeName,errorCode,eventId}' "$RESPONSE_FILE" 2>/dev/null >&2 || cat "$RESPONSE_FILE" >&2
            exit 1
          fi

          BUILD_ID="$(jq -r '.id // empty' "$RESPONSE_FILE")"
          BUILD_NUMBER="$(jq -r '.name // .buildNumber // empty' "$RESPONSE_FILE")"
          test -n "$BUILD_ID"

          echo "Queued Azure DevOps mobile build: id=$BUILD_ID build=$BUILD_NUMBER commit=$TARGET_SHA"
