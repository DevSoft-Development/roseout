name: Submit existing mobile production builds

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-submit-existing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-submit-existing-production
  cancel-in-progress: false

jobs:
  submit-ios:
    name: Submit latest iOS build to App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Expo credential is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Submit latest successful iOS production build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest submit             --platform ios             --latest             --profile production             --non-interactive             --wait

  submit-android:
    name: Submit latest Android build to Google Play internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Expo credential is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Submit latest successful Android production build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest submit             --platform android             --latest             --profile production             --non-interactive             --wait
