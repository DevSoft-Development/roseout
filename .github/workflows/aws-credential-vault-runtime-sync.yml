name: AWS Credential Vault runtime sync

on:
  pull_request:
    paths:
      - '.github/workflows/aws-credential-vault-runtime-sync.yml'
      - 'lib/admin/credential-vault-catalog.ts'
      - 'lib/admin/credential-vault-runtime-source.ts'
      - 'lib/admin/credential-runtime-inventory.ts'
      - 'lib/aws/admin-credential-vault.ts'
      - 'infra/aws/lambda/platform_job_gateway.py'
      - 'infra/aws/cloudformation/assistant-api.yml'
      - 'lib/microsoft-365/config.ts'
      - 'lib/microsoft-365/oauth.ts'
      - 'app/api/admin/settings/credentials/route.ts'
      - 'app/api/admin/integrations/microsoft-365/connect/route.ts'
      - 'app/api/admin/integrations/microsoft-365/callback/route.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-credential-vault-runtime-sync.yml'
  workflow_run:
    workflows:
      - 'AWS edge runtime'
      - 'AWS background cron runtime'
      - 'AWS integration API'
      - 'AWS assistant API'
      - 'AWS admin credential vault'
      - 'AWS worker runtime'
      - 'AWS infrastructure control plane'
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Credential Vault environment to reconcile
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: credential-vault-runtime-sync-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  CREDENTIAL_VAULT_PREFIX: /theouthaven/credential-vault

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single-source-of-truth contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-credential-vault-runtime-sync.yml'
          grep -F 'CREDENTIAL_VAULT_PREFIX' "$FILE" >/dev/null
          grep -F '${CREDENTIAL_VAULT_PREFIX}/${TARGET_ENV}/${provider}' "$FILE" >/dev/null
          for token in OPENAI_API_KEY GOOGLE_PLACES_API_KEY MICROSOFT_CLIENT_SECRET M365_TOKEN_ENCRYPTION_KEY SEARCH_HF_ML_TOKEN BRAVE_SEARCH_API_KEY SERPAPI_API_KEY STRIPE_SECRET_KEY RESEND_API_KEY RESEND_WEBHOOK_SECRET TWILIO_AUTH_TOKEN TELNYX_TRANSACTIONAL_API_KEY THREE_CX_CRM_API_KEY META_APP_SECRET TIKTOK_CLIENT_SECRET APPLE_BUSINESS_API_PRIVATE_KEY TURNSTILE_SECRET_KEY EXPO_ACCESS_TOKEN DOMAIN_PROVIDER_API_SECRET DOMAIN_GATEWAY_SECRET CRON_SECRET AWS_PLATFORM_JOB_GATEWAY_SECRET; do
            grep -F "$token" "$FILE" >/dev/null
          done
          if grep -Eq '^[[:space:]]+[A-Z0-9_]+:[[:space:]]*\$\{\{[[:space:]]*secrets\.' "$FILE"; then
            echo 'Provider credentials must not be sourced from GitHub secrets in the vault authority workflow.' >&2
            exit 1
          fi

  sync:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Reconcile Credential Vault into runtime compatibility stores
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in production|staging) ;; *) echo 'Invalid environment' >&2; exit 1 ;; esac
          RUNTIME_SECRET="/theouthaven/${TARGET_ENV}/edge-runtime/env"
          WORK="$RUNNER_TEMP/credential-vault-sync"
          mkdir -p "$WORK/providers"
          for provider in google supabase microsoft openai huggingface brave serpapi stripe resend twilio telnyx threecx stamps meta tiktok apple turnstile expo domains platform; do
            secret_id="${CREDENTIAL_VAULT_PREFIX}/${TARGET_ENV}/${provider}"
            if aws secretsmanager get-secret-value --secret-id "$secret_id" --query SecretString --output text > "$WORK/providers/${provider}.json" 2>/dev/null; then
              touch "$WORK/providers/${provider}.present"
            else
              printf '{}\n' > "$WORK/providers/${provider}.json"
            fi
            jq -e 'type == "object"' "$WORK/providers/${provider}.json" >/dev/null
          done
          if ! aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET" --query SecretString --output text > "$WORK/runtime.json" 2>/dev/null; then printf '{}\n' > "$WORK/runtime.json"; fi
          jq -e 'type == "object"' "$WORK/runtime.json" >/dev/null

          python3 - "$WORK" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1]); runtime = json.loads((root/'runtime.json').read_text())
          microsoft_file = root/'providers'/'microsoft.json'
          if (root/'providers'/'microsoft.present').exists():
              microsoft = json.loads(microsoft_file.read_text())
              existing_key = str(runtime.get('M365_TOKEN_ENCRYPTION_KEY') or '').strip()
              if existing_key and not str(microsoft.get('tokenEncryptionKey') or '').strip():
                  microsoft['tokenEncryptionKey'] = existing_key
                  microsoft_file.write_text(json.dumps(microsoft,separators=(',',':')))
                  (root/'providers'/'microsoft.adopted').touch()
          mapping = {
            'google': {'apiKey':['GOOGLE_PLACES_API_KEY','GOOGLE_GEOCODING_API_KEY'],'clientId':['GOOGLE_CLIENT_ID','GOOGLE_OAUTH_CLIENT_ID'],'clientSecret':['GOOGLE_CLIENT_SECRET','GOOGLE_OAUTH_CLIENT_SECRET']},
            'supabase': {'url':['SUPABASE_URL','NEXT_PUBLIC_SUPABASE_URL'],'publishableKey':['NEXT_PUBLIC_SUPABASE_ANON_KEY'],'serviceRoleKey':['SUPABASE_SERVICE_ROLE_KEY']},
            'microsoft': {'tenantId':['MICROSOFT_TENANT_ID'],'clientId':['MICROSOFT_CLIENT_ID'],'clientSecret':['MICROSOFT_CLIENT_SECRET'],'tokenEncryptionKey':['M365_TOKEN_ENCRYPTION_KEY']},
            'openai': {'apiKey':['OPENAI_API_KEY']}, 'huggingface': {'token':['SEARCH_HF_ML_TOKEN','HF_TOKEN','HUGGINGFACE_TOKEN']},
            'brave': {'apiKey':['BRAVE_SEARCH_API_KEY']}, 'serpapi': {'apiKey':['SERPAPI_API_KEY']},
            'stripe': {'secretKey':['STRIPE_SECRET_KEY'],'webhookSecret':['STRIPE_WEBHOOK_SECRET'],'connectWebhookSecret':['STRIPE_CONNECT_WEBHOOK_SECRET']},
            'resend': {'apiKey':['RESEND_API_KEY'],'webhookSecret':['RESEND_WEBHOOK_SECRET']},
            'twilio': {'accountSid':['TWILIO_ACCOUNT_SID'],'authToken':['TWILIO_AUTH_TOKEN']},
            'telnyx': {'publicKey':['TELNYX_PUBLIC_KEY'],'transactionalApiKey':['TELNYX_TRANSACTIONAL_API_KEY','TELNYX_API_KEY'],'reservationsApiKey':['TELNYX_RESERVATIONS_API_KEY'],'crmApiKey':['TELNYX_CRM_API_KEY'],'supportApiKey':['TELNYX_SUPPORT_API_KEY'],'marketingApiKey':['TELNYX_MARKETING_API_KEY'],'conciergeApiKey':['TELNYX_CONCIERGE_API_KEY']},
            'threecx': {'crmApiKey':['THREE_CX_CRM_API_KEY']},
            'meta': {'appId':['META_APP_ID','FACEBOOK_APP_ID'],'appSecret':['META_APP_SECRET','FACEBOOK_APP_SECRET'],'instagramAppId':['INSTAGRAM_APP_ID','META_INSTAGRAM_APP_ID'],'instagramAppSecret':['INSTAGRAM_APP_SECRET','META_INSTAGRAM_APP_SECRET'],'graphVersion':['META_GRAPH_VERSION'],'loginConfigurationId':['META_LOGIN_CONFIGURATION_ID'],'accessToken':['META_ACCESS_TOKEN','FACEBOOK_ACCESS_TOKEN']},
            'tiktok': {'clientKey':['TIKTOK_CLIENT_KEY'],'clientSecret':['TIKTOK_CLIENT_SECRET']},
            'apple': {'issuerId':['APPLE_BUSINESS_API_CLIENT_ID','APPLE_CLIENT_ID'],'keyId':['APPLE_BUSINESS_API_KEY_ID','APPLE_KEY_ID'],'privateKey':['APPLE_BUSINESS_API_PRIVATE_KEY','APPLE_PRIVATE_KEY']},
            'turnstile': {'secretKey':['TURNSTILE_SECRET_KEY']}, 'expo': {'accessToken':['EXPO_ACCESS_TOKEN']},
            'domains': {'apiKey':['DOMAIN_PROVIDER_API_KEY'],'apiSecret':['DOMAIN_PROVIDER_API_SECRET'],'accountId':['DOMAIN_PROVIDER_ACCOUNT_ID'],'gatewaySecret':['DOMAIN_GATEWAY_SECRET']},
            'platform': {'cronSecret':['CRON_SECRET'],'importSecret':['IMPORT_SECRET'],'internalImportSecret':['INTERNAL_IMPORT_SECRET'],'outingReminderCronSecret':['OUTING_REMINDER_CRON_SECRET'],'googleLocationEnrichmentCronSecret':['GOOGLE_LOCATION_ENRICHMENT_CRON_SECRET'],'adminApiSecret':['ADMIN_API_SECRET'],'adminDigestSecret':['ADMIN_DIGEST_SECRET'],'notificationSecret':['NOTIFICATION_SECRET'],'supportEmailWebhookSecret':['SUPPORT_EMAIL_WEBHOOK_SECRET'],'supportInboundSecret':['SUPPORT_INBOUND_SECRET'],'websiteHostingGatewaySecret':['AWS_WEBSITE_HOSTING_GATEWAY_SECRET'],'drGatewaySecret':['AWS_PLATFORM_DR_GATEWAY_SECRET'],'jobGatewaySecret':['AWS_PLATFORM_JOB_GATEWAY_SECRET'],'integrationApiSecret':['AWS_PLATFORM_INTEGRATION_API_SECRET'],'assistantApiSecret':['AWS_PLATFORM_ASSISTANT_API_SECRET']},
          }
          configured = {}
          for provider, fields in mapping.items():
              present = (root/'providers'/f'{provider}.present').exists()
              if not present:
                  configured[provider] = 'not_migrated'
                  continue
              if provider == 'microsoft':
                  for key in ('M365_TENANT_ID','AZURE_TENANT_ID','M365_CLIENT_ID','AZURE_CLIENT_ID','M365_CLIENT_SECRET','AZURE_CLIENT_SECRET','M365_PROVISIONING_CLIENT_ID','M365_PROVISIONING_CLIENT_SECRET'): runtime.pop(key, None)
              for envs in fields.values():
                  for env_name in envs: runtime.pop(env_name, None)
              values = json.loads((root/'providers'/f'{provider}.json').read_text()); count = 0
              for field, envs in fields.items():
                  value = values.get(field)
                  if isinstance(value, str) and value.strip():
                      for env_name in envs: runtime[env_name] = value.strip()
                      count += 1
              configured[provider] = count
          (root/'runtime-next.json').write_text(json.dumps(runtime,separators=(',',':')))
          (root/'summary.json').write_text(json.dumps(configured,separators=(',',':')))
          PY

          if [ -f "$WORK/providers/microsoft.adopted" ]; then
            aws secretsmanager put-secret-value --secret-id "${CREDENTIAL_VAULT_PREFIX}/${TARGET_ENV}/microsoft" --secret-string "file://$WORK/providers/microsoft.json" >/dev/null
            echo 'Adopted existing M365 token encryption key into Credential Vault.'
          fi
          if aws secretsmanager describe-secret --secret-id "$RUNTIME_SECRET" >/dev/null 2>&1; then aws secretsmanager put-secret-value --secret-id "$RUNTIME_SECRET" --secret-string "file://$WORK/runtime-next.json" >/dev/null; else aws secretsmanager create-secret --name "$RUNTIME_SECRET" --secret-string "file://$WORK/runtime-next.json" --tags Key=Project,Value=TheOutHaven Key=Environment,Value="$TARGET_ENV" Key=Service,Value=EdgeRuntime >/dev/null; fi
          jq -c 'to_entries | map({provider:.key,configuredFields:.value})' "$WORK/summary.json"

          STACK="theouthaven-integration-api-${TARGET_ENV}"
          if aws cloudformation describe-stacks --stack-name "$STACK" >/dev/null 2>&1; then
            STRIPE_SECRET_ID="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiStripeSecretArn'].OutputValue" --output text)"
            GOOGLE_SECRET_ID="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiGooglePlacesSecretArn'].OutputValue" --output text)"
            TELNYX_SECRET_ID="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiTelnyxSecretArn'].OutputValue" --output text)"
            STRIPE_KEY="$(jq -r '.secretKey // empty' "$WORK/providers/stripe.json")"; GOOGLE_KEY="$(jq -r '.apiKey // empty' "$WORK/providers/google.json")"
            if [ -f "$WORK/providers/stripe.present" ] && [ -n "$STRIPE_KEY" ] && [ "$STRIPE_SECRET_ID" != 'None' ]; then aws secretsmanager put-secret-value --secret-id "$STRIPE_SECRET_ID" --secret-string "$STRIPE_KEY" >/dev/null; fi
            if [ -f "$WORK/providers/google.present" ] && [ -n "$GOOGLE_KEY" ] && [ "$GOOGLE_SECRET_ID" != 'None' ]; then aws secretsmanager put-secret-value --secret-id "$GOOGLE_SECRET_ID" --secret-string "$GOOGLE_KEY" >/dev/null; fi
            if [ -f "$WORK/providers/telnyx.present" ] && [ "$TELNYX_SECRET_ID" != 'None' ]; then
              python3 - "$WORK/providers/telnyx.json" "$WORK/runtime-next.json" "$WORK/telnyx-derived.json" <<'PY'
          import json, sys
          v=json.load(open(sys.argv[1])); r=json.load(open(sys.argv[2])); c={}
          for p,f,e in [('concierge','conciergeApiKey','TELNYX_CONCIERGE_PHONE_NUMBER'),('crm','crmApiKey','TELNYX_CRM_PHONE_NUMBER'),('reservations','reservationsApiKey','TELNYX_RESERVATIONS_PHONE_NUMBER'),('support','supportApiKey','TELNYX_SUPPORT_PHONE_NUMBER'),('marketing','marketingApiKey','TELNYX_MARKETING_PHONE_NUMBER')]:
              k=str(v.get(f) or (v.get('transactionalApiKey') if p=='reservations' else '') or '').strip(); n=str(r.get(e) or '').strip()
              if k and n: c[p]={'apiKey':k,'from':n}
          json.dump({'version':1,'channels':c},open(sys.argv[3],'w'),separators=(',',':'))
          PY
              aws secretsmanager put-secret-value --secret-id "$TELNYX_SECRET_ID" --secret-string "file://$WORK/telnyx-derived.json" >/dev/null
            fi
          fi
          rm -rf "$WORK"

      - name: Propagate vault runtime into isolated ECS web surfaces
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          SOURCE_SECRET="/theouthaven/${TARGET_ENV}/edge-runtime/env"
          aws secretsmanager get-secret-value --secret-id "$SOURCE_SECRET" --query SecretString --output text > "$RUNNER_TEMP/vault-runtime.json"
          jq 'del(.VERCEL_TOKEN, .VERCEL_ACCESS_TOKEN, .VERCEL_RUNTIME_TOKEN)' "$RUNNER_TEMP/vault-runtime.json" > "$RUNNER_TEMP/web-runtime.json"

          WEB_STACK="theouthaven-web-surfaces-${TARGET_ENV}"
          if aws cloudformation describe-stacks --stack-name "$WEB_STACK" > "$RUNNER_TEMP/web-stack.json" 2>/dev/null; then
            output() { jq -r --arg key "$1" '.Stacks[0].Outputs[] | select(.OutputKey==$key) | .OutputValue' "$RUNNER_TEMP/web-stack.json"; }
            WEB_CLUSTER="$(output EcsClusterName)"
            ADMIN_SECRET="$(output AdminAppEnvSecretArn)"
            BUSINESS_SECRET="$(output BusinessAppEnvSecretArn)"
            for entry in "admin:$ADMIN_SECRET" "business:$BUSINESS_SECRET"; do
              surface="${entry%%:*}"; secret_id="${entry#*:}"
              if [ -n "$secret_id" ] && [ "$secret_id" != "null" ]; then
                aws secretsmanager put-secret-value --secret-id "$secret_id" --secret-string "file://$RUNNER_TEMP/web-runtime.json" >/dev/null
              fi
              service="toh-${TARGET_ENV}-${surface}-web"
              if aws ecs describe-services --cluster "$WEB_CLUSTER" --services "$service" --query 'services[0].status' --output text 2>/dev/null | grep -qx ACTIVE; then
                aws ecs update-service --cluster "$WEB_CLUSTER" --service "$service" --force-new-deployment >/dev/null
              fi
            done
          fi

          RESERVE_STACK="theouthaven-reserve-web-foundation-${TARGET_ENV}"
          if aws cloudformation describe-stacks --stack-name "$RESERVE_STACK" > "$RUNNER_TEMP/reserve-stack.json" 2>/dev/null; then
            reserve_output() { jq -r --arg key "$1" '.Stacks[0].Outputs[] | select(.OutputKey==$key) | .OutputValue' "$RUNNER_TEMP/reserve-stack.json"; }
            RESERVE_SECRET="$(reserve_output ReserveAppEnvSecretArn)"
            RESERVE_CLUSTER="$(reserve_output ReserveClusterName)"
            if [ -n "$RESERVE_SECRET" ] && [ "$RESERVE_SECRET" != "null" ]; then
              aws secretsmanager put-secret-value --secret-id "$RESERVE_SECRET" --secret-string "file://$RUNNER_TEMP/web-runtime.json" >/dev/null
            fi
            RESERVE_SERVICE="toh-${TARGET_ENV}-reserve-web"
            if aws ecs describe-services --cluster "$RESERVE_CLUSTER" --services "$RESERVE_SERVICE" --query 'services[0].status' --output text 2>/dev/null | grep -qx ACTIVE; then
              aws ecs update-service --cluster "$RESERVE_CLUSTER" --service "$RESERVE_SERVICE" --force-new-deployment >/dev/null
            fi
          fi

      - name: Recycle AWS runtime consumers without exposing credentials
        if: ${{ (inputs.environment || 'production') == 'production' }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for fn in toh-production-integration-api toh-production-edge-runtime toh-production-background-runtime toh-production-assistant-api; do
            if ! aws lambda get-function-configuration --function-name "$fn" --query Environment --output json > "$RUNNER_TEMP/${fn}.json" 2>/dev/null; then echo "Skipping unavailable consumer: $fn"; continue; fi
            jq --arg stamp "$stamp" '.Variables.CREDENTIAL_VAULT_REFRESH_AT=$stamp' "$RUNNER_TEMP/${fn}.json" > "$RUNNER_TEMP/${fn}.next.json"
            aws lambda update-function-configuration --function-name "$fn" --environment "file://$RUNNER_TEMP/${fn}.next.json" >/dev/null
            aws lambda wait function-updated --function-name "$fn"
          done

      - name: Verify Credential Vault authority without logging values
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          RUNTIME_FILE="$RUNNER_TEMP/runtime.json"
          aws secretsmanager get-secret-value --secret-id "/theouthaven/${TARGET_ENV}/edge-runtime/env" --query SecretString --output text > "$RUNTIME_FILE"
          verify_match() {
            local provider="$1" field="$2" env_key="$3" vault_file="$RUNNER_TEMP/${1}.json"
            if ! aws secretsmanager get-secret-value --secret-id "${CREDENTIAL_VAULT_PREFIX}/${TARGET_ENV}/${provider}" --query SecretString --output text > "$vault_file" 2>/dev/null; then return 0; fi
            python3 - "$vault_file" "$RUNTIME_FILE" "$field" "$env_key" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1])); r=json.load(open(sys.argv[2])); x=v.get(sys.argv[3])
          if isinstance(x,str) and x.strip(): assert r.get(sys.argv[4])==x.strip()
          PY
          }
          verify_match microsoft tenantId MICROSOFT_TENANT_ID; verify_match microsoft clientId MICROSOFT_CLIENT_ID; verify_match microsoft clientSecret MICROSOFT_CLIENT_SECRET; verify_match microsoft tokenEncryptionKey M365_TOKEN_ENCRYPTION_KEY
          verify_match openai apiKey OPENAI_API_KEY; verify_match google apiKey GOOGLE_PLACES_API_KEY; verify_match stripe secretKey STRIPE_SECRET_KEY; verify_match resend apiKey RESEND_API_KEY
          verify_match huggingface token SEARCH_HF_ML_TOKEN; verify_match brave apiKey BRAVE_SEARCH_API_KEY; verify_match serpapi apiKey SERPAPI_API_KEY; verify_match turnstile secretKey TURNSTILE_SECRET_KEY; verify_match expo accessToken EXPO_ACCESS_TOKEN
          echo 'Credential Vault is authoritative for every migrated provider.'
