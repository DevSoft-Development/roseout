name: AWS scheduler activation

on:
  pull_request:
    paths:
      - 'infra/aws/edge-runtime/activation.json'
      - 'infra/aws/lambda/edge_scheduler_invoker.py'
      - '.github/workflows/aws-scheduler-activation.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/edge-runtime/activation.json'
      - 'infra/aws/lambda/edge_scheduler_invoker.py'
      - '.github/workflows/aws-scheduler-activation.yml'
  workflow_run:
    workflows: ['AWS edge runtime']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-scheduler-activation-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-edge-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate activation manifest
        run: |
          set -euo pipefail
          ACTIVATION='infra/aws/edge-runtime/activation.json'
          SCHEDULES='infra/aws/edge-runtime/schedules.json'

          jq -e '.enabled | type == "array"' "$ACTIVATION" >/dev/null
          jq -e '.rollback_enabled | type == "array"' "$ACTIVATION" >/dev/null
          jq -e '.probe | type == "array"' "$ACTIVATION" >/dev/null
          test "$(jq -r '.enabled[]' "$ACTIVATION" | sort | uniq | wc -l | tr -d ' ')" = "$(jq '.enabled | length' "$ACTIVATION")"
          test "$(jq -r '.rollback_enabled[]' "$ACTIVATION" | sort | uniq | wc -l | tr -d ' ')" = "$(jq '.rollback_enabled | length' "$ACTIVATION")"
          test "$(jq -r '.probe[]' "$ACTIVATION" | sort | uniq | wc -l | tr -d ' ')" = "$(jq '.probe | length' "$ACTIVATION")"

          jq -e --slurpfile schedules "$SCHEDULES" '
            . as $manifest |
            all($manifest.enabled[]; . as $name | any($schedules[0][]; .name == $name)) and
            all($manifest.rollback_enabled[]; . as $name | any($schedules[0][]; .name == $name)) and
            all($manifest.rollback_enabled[]; . as $name | any($manifest.enabled[]; . == $name)) and
            all($manifest.probe[]; . as $name | any($manifest.enabled[]; . == $name))
          ' "$ACTIVATION" >/dev/null

          if [ "$(jq -r '.batch' "$ACTIVATION")" = "8" ]; then
            test "$(jq 'length' "$SCHEDULES")" = '28'
            test "$(jq '.enabled | length' "$ACTIVATION")" = '28'
            test "$(jq '.rollback_enabled | length' "$ACTIVATION")" = '24'
            jq -r '.enabled[]' "$ACTIVATION" | sort > "$RUNNER_TEMP/enabled.txt"
            jq -r '.rollback_enabled[]' "$ACTIVATION" | sort > "$RUNNER_TEMP/rollback.txt"
            comm -23 "$RUNNER_TEMP/enabled.txt" "$RUNNER_TEMP/rollback.txt" > "$RUNNER_TEMP/batch-delta.txt"
            printf '%s\n' \
              catalog-enrichment-runner \
              location-description-backfill \
              location-search-profile-worker \
              search-ml-learning-maintenance | sort > "$RUNNER_TEMP/expected-batch-delta.txt"
            diff -u "$RUNNER_TEMP/expected-batch-delta.txt" "$RUNNER_TEMP/batch-delta.txt"
            while IFS= read -r NAME; do
              jq -e --arg name "$NAME" '.probe | index($name) != null' "$ACTIVATION" >/dev/null
            done < "$RUNNER_TEMP/expected-batch-delta.txt"
          fi

      - name: Validate multi-runtime scheduler invoker
        run: |
          set -euo pipefail
          python -m py_compile infra/aws/lambda/edge_scheduler_invoker.py
          grep -F 'if function_name.startswith("node:"):' infra/aws/lambda/edge_scheduler_invoker.py >/dev/null
          grep -F 'return invoke_node(target, body, context)' infra/aws/lambda/edge_scheduler_invoker.py >/dev/null

  restore_after_edge_failure:
    needs: validate
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Restore rollback allowlist after edge deployment failure
        run: |
          set -euo pipefail
          ACTIVATION='infra/aws/edge-runtime/activation.json'
          SCHEDULES='infra/aws/edge-runtime/schedules.json'
          INVOKER_ARN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          SCHEDULER_ROLE="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"

          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

          while IFS= read -r item; do
            NAME="$(jq -r '.name' <<<"$item")"
            EXPRESSION="$(jq -r '.expression' <<<"$item")"
            INPUT="$(jq -c '{function:.function,body:.body}' <<<"$item")"
            if jq -e --arg name "$NAME" '.rollback_enabled | index($name) != null' "$ACTIVATION" >/dev/null; then
              DESIRED_STATE=ENABLED
            else
              DESIRED_STATE=DISABLED
            fi

            if ! aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$NAME" >/dev/null 2>&1; then
              if [ "$DESIRED_STATE" = 'ENABLED' ]; then
                echo "Rollback schedule is missing: $NAME" >&2
                exit 1
              fi
              echo "Skipping missing non-rollback schedule: $NAME"
              continue
            fi

            TARGET="$(jq -nc --arg arn "$INVOKER_ARN" --arg role "$SCHEDULER_ROLE" --arg input "$INPUT" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:3600,MaximumRetryAttempts:2}}')"
            aws scheduler update-schedule \
              --group-name "$SCHEDULE_GROUP" \
              --name "$NAME" \
              --schedule-expression "$EXPRESSION" \
              --flexible-time-window '{"Mode":"OFF"}' \
              --state "$DESIRED_STATE" \
              --target "$TARGET" >/dev/null
          done < <(jq -c '.[]' "$SCHEDULES")

          jq -r '.rollback_enabled[]' "$ACTIVATION" | sort > "$RUNNER_TEMP/rollback-expected.txt"
          : > "$RUNNER_TEMP/rollback-actual.txt"
          while IFS= read -r NAME; do
            if aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$NAME" >/dev/null 2>&1; then
              STATE="$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$NAME" --query State --output text)"
              if [ "$STATE" = 'ENABLED' ]; then
                echo "$NAME" >> "$RUNNER_TEMP/rollback-actual.txt"
              else
                test "$STATE" = 'DISABLED'
              fi
            fi
          done < <(jq -r '.[].name' "$SCHEDULES" | sort)
          sort -o "$RUNNER_TEMP/rollback-actual.txt" "$RUNNER_TEMP/rollback-actual.txt"
          diff -u "$RUNNER_TEMP/rollback-expected.txt" "$RUNNER_TEMP/rollback-actual.txt"

      - name: Rollback summary
        run: |
          COUNT="$(jq '.rollback_enabled | length' infra/aws/edge-runtime/activation.json)"
          {
            echo '### AWS scheduler rollback'
            echo ''
            echo '- Edge runtime deployment did not complete successfully.'
            echo "- Restored prior enabled fleet: ${COUNT} schedules."
            echo '- New activation candidates remain DISABLED.'
          } >> "$GITHUB_STEP_SUMMARY"

  activate:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Restore and prove multi-runtime scheduler invoker
        run: |
          set -euo pipefail
          FN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$FN"
          BUILD="$RUNNER_TEMP/scheduler-invoker"
          ZIP="$RUNNER_TEMP/scheduler-invoker.zip"
          rm -rf "$BUILD" "$ZIP"
          mkdir -p "$BUILD"
          cp infra/aws/lambda/edge_scheduler_invoker.py "$BUILD/index.py"
          (cd "$BUILD" && zip -q "$ZIP" index.py)
          aws lambda update-function-code --function-name "$FN" --zip-file "fileb://$ZIP" >/dev/null
          aws lambda wait function-updated --function-name "$FN"

          cat > "$RUNNER_TEMP/node-routing-probe.json" <<'JSON'
          {"function":"node:/api/health/background-runtime","body":{}}
          JSON
          aws lambda invoke \
            --function-name "$FN" \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$RUNNER_TEMP/node-routing-probe.json" \
            "$RUNNER_TEMP/node-routing-response.json" >/dev/null
          jq -e '.ok == true and .runtime == "node" and .status == 200 and .response.ok == true and .response.runtime == "aws-background"' "$RUNNER_TEMP/node-routing-response.json" >/dev/null

      - name: Apply activation allowlist
        run: |
          set -euo pipefail
          INVOKER_ARN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          SCHEDULER_ROLE="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"

          while IFS= read -r item; do
            NAME="$(jq -r '.name' <<<"$item")"
            EXPRESSION="$(jq -r '.expression' <<<"$item")"
            INPUT="$(jq -c '{function:.function,body:.body}' <<<"$item")"
            if jq -e --arg name "$NAME" '.enabled | index($name) != null' infra/aws/edge-runtime/activation.json >/dev/null; then
              DESIRED_STATE=ENABLED
            else
              DESIRED_STATE=DISABLED
            fi
            TARGET="$(jq -nc --arg arn "$INVOKER_ARN" --arg role "$SCHEDULER_ROLE" --arg input "$INPUT" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:3600,MaximumRetryAttempts:2}}')"
            aws scheduler update-schedule \
              --group-name "$SCHEDULE_GROUP" \
              --name "$NAME" \
              --schedule-expression "$EXPRESSION" \
              --flexible-time-window '{"Mode":"OFF"}' \
              --state "$DESIRED_STATE" \
              --target "$TARGET" >/dev/null
          done < <(jq -c '.[]' infra/aws/edge-runtime/schedules.json)

      - name: Verify exact AWS schedule state
        run: |
          set -euo pipefail
          EXPECTED="$RUNNER_TEMP/expected.txt"
          ENABLED_ACTUAL="$RUNNER_TEMP/enabled-actual.txt"
          ENABLED_EXPECTED="$RUNNER_TEMP/enabled-expected.txt"

          jq -r '.[].name' infra/aws/edge-runtime/schedules.json | sort > "$EXPECTED"
          test "$(wc -l < "$EXPECTED" | tr -d ' ')" = "$(jq 'length' infra/aws/edge-runtime/schedules.json)"

          : > "$ENABLED_ACTUAL"
          while IFS= read -r NAME; do
            STATE="$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$NAME" --query State --output text)"
            if [ "$STATE" = "ENABLED" ]; then
              echo "$NAME" >> "$ENABLED_ACTUAL"
            else
              test "$STATE" = "DISABLED"
            fi
          done < "$EXPECTED"
          sort -o "$ENABLED_ACTUAL" "$ENABLED_ACTUAL"
          jq -r '.enabled[]' infra/aws/edge-runtime/activation.json | sort > "$ENABLED_EXPECTED"
          diff -u "$ENABLED_EXPECTED" "$ENABLED_ACTUAL"

      - name: Probe enabled batch through AWS scheduler invoker
        run: |
          set -euo pipefail
          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          while IFS= read -r NAME; do
            echo "probing=${NAME}"
            ITEM="$(jq -c --arg name "$NAME" '.[] | select(.name == $name)' infra/aws/edge-runtime/schedules.json)"
            test -n "$ITEM"
            jq -c '{function:.function,body:.body}' <<<"$ITEM" > "$RUNNER_TEMP/probe-input.json"
            aws lambda invoke \
              --function-name "$INVOKER_FN" \
              --cli-binary-format raw-in-base64-out \
              --payload "fileb://$RUNNER_TEMP/probe-input.json" \
              "$RUNNER_TEMP/probe-output.json" >/dev/null
            if ! jq -e '.ok == true and (.status // 200) < 400 and (.response.success // true) != false' "$RUNNER_TEMP/probe-output.json" >/dev/null; then
              echo "probe_failed=${NAME}"
              jq -c '{
                ok,
                runtime,
                function,
                target,
                queue,
                status,
                errorType,
                errorMessage,
                response_summary: (
                  if (.response | type) == "object" then {
                    success: .response.success,
                    error: .response.error,
                    reason: .response.reason,
                    operation: .response.operation,
                    processed: .response.processed,
                    sent: .response.sent,
                    failed: .response.failed,
                    skipped: .response.skipped,
                    claimed: .response.claimed,
                    checked: .response.checked,
                    updated: .response.updated,
                    durationMs: .response.durationMs
                  } else {type: (.response | type)} end
                )
              }' "$RUNNER_TEMP/probe-output.json" || true
              exit 1
            fi
            echo "probe_passed=${NAME}"
          done < <(jq -r '.probe[]' infra/aws/edge-runtime/activation.json)

      - name: Restore previous scheduler fleet on activation failure
        if: failure()
        run: |
          set -euo pipefail
          ACTIVATION='infra/aws/edge-runtime/activation.json'
          SCHEDULES='infra/aws/edge-runtime/schedules.json'
          INVOKER_ARN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          SCHEDULER_ROLE="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"

          while IFS= read -r item; do
            NAME="$(jq -r '.name' <<<"$item")"
            EXPRESSION="$(jq -r '.expression' <<<"$item")"
            INPUT="$(jq -c '{function:.function,body:.body}' <<<"$item")"
            if jq -e --arg name "$NAME" '.rollback_enabled | index($name) != null' "$ACTIVATION" >/dev/null; then
              DESIRED_STATE=ENABLED
            else
              DESIRED_STATE=DISABLED
            fi
            TARGET="$(jq -nc --arg arn "$INVOKER_ARN" --arg role "$SCHEDULER_ROLE" --arg input "$INPUT" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:3600,MaximumRetryAttempts:2}}')"
            aws scheduler update-schedule \
              --group-name "$SCHEDULE_GROUP" \
              --name "$NAME" \
              --schedule-expression "$EXPRESSION" \
              --flexible-time-window '{"Mode":"OFF"}' \
              --state "$DESIRED_STATE" \
              --target "$TARGET" >/dev/null
          done < <(jq -c '.[]' "$SCHEDULES")

          jq -r '.rollback_enabled[]' "$ACTIVATION" | sort > "$RUNNER_TEMP/rollback-expected.txt"
          : > "$RUNNER_TEMP/rollback-actual.txt"
          while IFS= read -r NAME; do
            STATE="$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$NAME" --query State --output text)"
            if [ "$STATE" = 'ENABLED' ]; then
              echo "$NAME" >> "$RUNNER_TEMP/rollback-actual.txt"
            else
              test "$STATE" = 'DISABLED'
            fi
          done < <(jq -r '.[].name' "$SCHEDULES" | sort)
          sort -o "$RUNNER_TEMP/rollback-actual.txt" "$RUNNER_TEMP/rollback-actual.txt"
          diff -u "$RUNNER_TEMP/rollback-expected.txt" "$RUNNER_TEMP/rollback-actual.txt"

      - name: Activation summary
        if: success()
        run: |
          ENABLED="$(jq -r '.enabled | join(", ")' infra/aws/edge-runtime/activation.json)"
          ROLLBACK_COUNT="$(jq '.rollback_enabled | length' infra/aws/edge-runtime/activation.json)"
          {
            echo '### AWS scheduler activation'
            echo ''
            echo "- Enabled: ${ENABLED}"
            echo '- All other managed schedules: DISABLED'
            echo "- Fail-closed recovery baseline: ${ROLLBACK_COUNT} previously enabled schedules"
            echo '- Scheduler: AWS EventBridge Scheduler'
            echo '- Compute: AWS Lambda Edge/Node workers and dedicated queue workers'
            echo '- Supabase pg_cron: not used'
          } >> "$GITHUB_STEP_SUMMARY"
