name: Vercel Virginia Supabase cutover

on:
  push:
    branches:
      - migration/vercel-virginia-cutover
    paths:
      - '.github/workflows/vercel-virginia-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  OREGON_SUPABASE_REF: hnhbzynoyrhjndefbwkh
  VIRGINIA_SUPABASE_REF: ftdsltatyqhtllyyefzp
  VIRGINIA_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require migration credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured in GitHub Actions" >&2; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured" >&2; exit 1; }
          echo "migration_credentials_present=true"

      - name: Reconfirm Oregon and Virginia cutover parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          sql="$(cat <<'SQL'
          select
            (select count(*) from auth.users) as auth_users,
            (select count(*) from public.locations) as locations,
            (select count(*) from storage.objects) as storage_objects,
            (select coalesce(sum((metadata->>'size')::bigint),0) from storage.objects) as storage_bytes,
            (select count(*) from public.location_search_profiles) as search_profiles,
            (select count(*) from public.location_intent_ml_features) as intent_features,
            (select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname not in ('pg_catalog','information_schema') and t.tgenabled <> 'D') as enabled_triggers
          SQL
          )"
          for side in oregon virginia; do
            if [ "$side" = oregon ]; then ref="$OREGON_SUPABASE_REF"; else ref="$VIRGINIA_SUPABASE_REF"; fi
            jq -n --arg query "$sql" '{query:$query}' > "$RUNNER_TEMP/query.json"
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/query.json" \
              "https://api.supabase.com/v1/projects/${ref}/database/query" > "$RUNNER_TEMP/${side}-parity.json"
            jq -e 'type == "array" and length == 1' "$RUNNER_TEMP/${side}-parity.json" >/dev/null
          done
          jq -S '.[0]' "$RUNNER_TEMP/oregon-parity.json" > "$RUNNER_TEMP/oregon-parity-normalized.json"
          jq -S '.[0]' "$RUNNER_TEMP/virginia-parity.json" > "$RUNNER_TEMP/virginia-parity-normalized.json"
          cmp -s "$RUNNER_TEMP/oregon-parity-normalized.json" "$RUNNER_TEMP/virginia-parity-normalized.json" || {
            echo "Oregon/Virginia parity changed; refusing Vercel cutover" >&2
            diff -u "$RUNNER_TEMP/oregon-parity-normalized.json" "$RUNNER_TEMP/virginia-parity-normalized.json" || true
            exit 1
          }

          jq -n --arg query 'select count(*) filter (where active) as active_jobs, count(*) filter (where not active) as paused_jobs from cron.job' '{query:$query}' > "$RUNNER_TEMP/query.json"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/query.json" \
            "https://api.supabase.com/v1/projects/${OREGON_SUPABASE_REF}/database/query" > "$RUNNER_TEMP/oregon-cron.json"
          test "$(jq -r '.[0].active_jobs' "$RUNNER_TEMP/oregon-cron.json")" = "0" || { echo "Oregon cron is not frozen" >&2; exit 1; }
          test "$(jq -r '.[0].paused_jobs' "$RUNNER_TEMP/oregon-cron.json")" = "25" || { echo "Unexpected Oregon paused cron count" >&2; exit 1; }

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${VIRGINIA_SUPABASE_REF}/config/auth" > "$RUNNER_TEMP/virginia-auth.json"
          jq -e '.external_azure_enabled == true' "$RUNNER_TEMP/virginia-auth.json" >/dev/null || { echo "Virginia Microsoft Auth is not enabled" >&2; exit 1; }
          echo "vercel_cutover_parity=true"

      - name: Resolve Virginia public and service keys without printing them
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${VIRGINIA_SUPABASE_REF}/api-keys?reveal=true" > "$RUNNER_TEMP/virginia-keys.json"
          anon="$(jq -r '[.[] | select(.type=="legacy" and .name=="anon" and (.disabled != true))][0].api_key // empty' "$RUNNER_TEMP/virginia-keys.json")"
          service_role="$(jq -r '[.[] | select(.type=="legacy" and .name=="service_role" and (.disabled != true))][0].api_key // empty' "$RUNNER_TEMP/virginia-keys.json")"
          test -n "$anon" || { echo "Virginia anon key unavailable" >&2; exit 1; }
          test -n "$service_role" || { echo "Virginia service-role key unavailable" >&2; exit 1; }
          echo "::add-mask::$anon"
          echo "::add-mask::$service_role"
          printf '%s' "$anon" > "$RUNNER_TEMP/virginia-anon"
          printf '%s' "$service_role" > "$RUNNER_TEMP/virginia-service-role"
          chmod 600 "$RUNNER_TEMP/virginia-anon" "$RUNNER_TEMP/virginia-service-role"
          rm -f "$RUNNER_TEMP/virginia-keys.json"
          echo "virginia_vercel_keys_resolved=true"

      - name: Inspect Vercel production Supabase env entries
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}" > "$RUNNER_TEMP/vercel-envs.json"
          jq -e '.envs | type == "array"' "$RUNNER_TEMP/vercel-envs.json" >/dev/null

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          envs = json.loads((root / 'vercel-envs.json').read_text()).get('envs', [])
          required = ['NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_ANON_KEY','SUPABASE_SERVICE_ROLE_KEY']
          optional = ['SUPABASE_URL']
          plan = {}
          for key in required + optional:
              entries = [e for e in envs if e.get('key') == key and 'production' in (e.get('target') or [])]
              if not entries:
                  if key in required:
                      raise SystemExit(f'Missing required production Vercel env: {key}')
                  continue
              if len(entries) != 1:
                  raise SystemExit(f'Expected exactly one production Vercel env entry for {key}, found {len(entries)}')
              entry = entries[0]
              targets = entry.get('target') or []
              remaining = [t for t in targets if t != 'production']
              plan[key] = {
                  'id': entry['id'],
                  'type': entry.get('type') or 'encrypted',
                  'targets': targets,
                  'remaining_targets': remaining,
                  'shared': bool(remaining),
              }
              mode = 'split-production-from-shared' if remaining else 'production-only-update'
              print(f'vercel_env_plan={key} mode={mode} type={plan[key]["type"]}')
          (root / 'vercel-supabase-env-plan.json').write_text(json.dumps(plan))
          PY
          echo "vercel_production_env_plan_safe=true"

      - name: Split shared scopes and update production Supabase target to Virginia
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          anon="$(cat "$RUNNER_TEMP/virginia-anon")"
          service_role="$(cat "$RUNNER_TEMP/virginia-service-role")"
          echo "::add-mask::$anon"
          echo "::add-mask::$service_role"

          update_env() {
            local key="$1" value="$2"
            local id type shared original_targets remaining_targets code
            id="$(jq -r --arg key "$key" '.[$key].id // empty' "$RUNNER_TEMP/vercel-supabase-env-plan.json")"
            test -n "$id" || return 0
            type="$(jq -r --arg key "$key" '.[$key].type' "$RUNNER_TEMP/vercel-supabase-env-plan.json")"
            shared="$(jq -r --arg key "$key" '.[$key].shared' "$RUNNER_TEMP/vercel-supabase-env-plan.json")"
            original_targets="$(jq -c --arg key "$key" '.[$key].targets' "$RUNNER_TEMP/vercel-supabase-env-plan.json")"
            remaining_targets="$(jq -c --arg key "$key" '.[$key].remaining_targets' "$RUNNER_TEMP/vercel-supabase-env-plan.json")"

            if [ "$shared" = "true" ]; then
              jq -n --argjson target "$remaining_targets" '{target:$target}' > "$RUNNER_TEMP/vercel-scope-patch.json"
              code="$(curl --silent --show-error \
                --request PATCH \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                --header 'Content-Type: application/json' \
                --data-binary "@$RUNNER_TEMP/vercel-scope-patch.json" \
                --output "$RUNNER_TEMP/vercel-scope-response.json" \
                --write-out '%{http_code}' \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_TEAM_ID}")"
              echo "vercel_env_scope_narrow=${key} http_status=${code}"
              [[ "$code" == 2* ]] || { echo "Failed to preserve non-production scopes for $key" >&2; exit 1; }

              jq -n --arg key "$key" --arg value "$value" --arg type "$type" \
                '[{key:$key,value:$value,type:$type,target:["production"]}]' > "$RUNNER_TEMP/vercel-create.json"
              code="$(curl --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                --header 'Content-Type: application/json' \
                --data-binary "@$RUNNER_TEMP/vercel-create.json" \
                --output "$RUNNER_TEMP/vercel-create-response.json" \
                --write-out '%{http_code}' \
                "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}")"
              echo "vercel_env_create_production=${key} http_status=${code}"
              if [[ "$code" != 2* ]]; then
                echo "Production env creation failed for $key; restoring original shared scope" >&2
                jq -n --argjson target "$original_targets" '{target:$target}' > "$RUNNER_TEMP/vercel-rollback.json"
                curl --fail --silent --show-error \
                  --request PATCH \
                  --header "Authorization: Bearer $VERCEL_TOKEN" \
                  --header 'Content-Type: application/json' \
                  --data-binary "@$RUNNER_TEMP/vercel-rollback.json" \
                  "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_TEAM_ID}" >/dev/null
                exit 1
              fi
            else
              jq -n --arg value "$value" '{value:$value}' > "$RUNNER_TEMP/vercel-patch.json"
              code="$(curl --silent --show-error \
                --request PATCH \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                --header 'Content-Type: application/json' \
                --data-binary "@$RUNNER_TEMP/vercel-patch.json" \
                --output "$RUNNER_TEMP/vercel-patch-response.json" \
                --write-out '%{http_code}' \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_TEAM_ID}")"
              echo "vercel_env_update=${key} http_status=${code}"
              [[ "$code" == 2* ]] || { echo "Vercel env update failed for $key" >&2; exit 1; }
            fi
          }

          update_env NEXT_PUBLIC_SUPABASE_URL "$VIRGINIA_SUPABASE_URL"
          update_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$anon"
          update_env SUPABASE_SERVICE_ROLE_KEY "$service_role"
          update_env SUPABASE_URL "$VIRGINIA_SUPABASE_URL"
          echo "vercel_production_supabase_env_updated=true"

      - name: Verify production scope and Virginia values without printing secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          anon="$(cat "$RUNNER_TEMP/virginia-anon")"
          service_role="$(cat "$RUNNER_TEMP/virginia-service-role")"
          echo "::add-mask::$anon"
          echo "::add-mask::$service_role"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}&decrypt=true" > "$RUNNER_TEMP/vercel-envs-after.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          envs = json.loads((root / 'vercel-envs-after.json').read_text()).get('envs', [])
          expected = {
              'NEXT_PUBLIC_SUPABASE_URL': os.environ['VIRGINIA_SUPABASE_URL'],
              'NEXT_PUBLIC_SUPABASE_ANON_KEY': (root / 'virginia-anon').read_text(),
              'SUPABASE_SERVICE_ROLE_KEY': (root / 'virginia-service-role').read_text(),
          }
          if any(e.get('key') == 'SUPABASE_URL' and 'production' in (e.get('target') or []) for e in envs):
              expected['SUPABASE_URL'] = os.environ['VIRGINIA_SUPABASE_URL']
          for key, value in expected.items():
              entries = [e for e in envs if e.get('key') == key and e.get('target') == ['production']]
              if len(entries) != 1:
                  raise SystemExit(f'Production-scope verification failed for {key}: {len(entries)} entries')
              entry = entries[0]
              if entry.get('type') == 'sensitive':
                  print(f'vercel_env_verified={key} scope=production value=accepted-sensitive')
              else:
                  if entry.get('value') != value:
                      raise SystemExit(f'Verification value mismatch for {key}')
                  print(f'vercel_env_verified={key} scope=production value=matched')
          print('vercel_production_supabase_env_verification=passed')
          PY

      - name: Cutover summary
        run: |
          {
            echo '### Vercel Virginia Supabase cutover'
            echo ''
            echo '- Production Supabase URL: Virginia (verified).'
            echo '- Production anon key: Virginia (verified without printing it).'
            echo '- Production service-role key: Virginia (verified without printing it).'
            echo '- Shared Preview scopes were preserved rather than changed implicitly.'
            echo '- Oregon source cron remains frozen.'
            echo '- AWS workers already target Virginia.'
            echo '- Merge this PR to trigger the next production Vercel deployment with the new environment values.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/virginia-anon "$RUNNER_TEMP"/virginia-service-role "$RUNNER_TEMP"/*.json
