name: Operational shard live bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/operational-shard-live-bootstrap.yml'
      - 'infra/supabase/operational-shards/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/operational-shard-live-bootstrap.yml'
      - 'infra/supabase/operational-shards/**'
  workflow_dispatch:
    inputs:
      activate_initial_provisioning:
        description: Explicitly activate registry writes for planned/provisioning shards after schema proof
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ (github.event_name == 'pull_request' && format('operational-shard-contract-{0}-{1}', github.workflow, github.event.pull_request.number)) || 'operational-shard-control-production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  SUPABASE_VAULT_SECRET: /theouthaven/credential-vault/production/supabase
  DR_SECRET: /theouthaven/production/dr-reconciler/env
  GLOBAL_REF: ftdsltatyqhtllyyefzp
  SHARD01_REF: lyeruuzsnceaxrmdafxb
  SHARD01_DR_REF: vcdnwrsuvhtlvxqbkamg
  SHARD02_REF: lpcrikaixcfbqaikevlg
  SHARD02_DR_REF: bjhcxzahgfeniitejtrx

jobs:
  validate:
    name: Validate shard bootstrap contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project map and secret handling
        run: |
          set -euo pipefail
          node scripts/operational-sharding-regression.mjs
          grep -F 'api-keys?reveal=true' .github/workflows/operational-shard-live-bootstrap.yml >/dev/null
          grep -F 'operationalShardsJson' .github/workflows/operational-shard-live-bootstrap.yml >/dev/null
          ! grep -Eq 'sb_secret_[A-Za-z0-9_-]+' .github/workflows/operational-shard-live-bootstrap.yml
          ! grep -Eq 'service_role_key[[:space:]]*:' infra/supabase/operational-shards/bootstrap.sql
          ! grep -Fx 'as $' infra/supabase/operational-shards/inventory-v7.sql
          ! grep -Fx '$;' infra/supabase/operational-shards/inventory-v7.sql
          ! grep -Fx 'as $' infra/supabase/operational-shards/online-ordering-v8.sql
          ! grep -Fx '$;' infra/supabase/operational-shards/online-ordering-v8.sql
          grep -F 'partial-tenders-v8.sql' .github/workflows/operational-shard-live-bootstrap.yml >/dev/null
          grep -F 'ingredient-inventory-v9.sql' .github/workflows/operational-shard-live-bootstrap.yml >/dev/null
          grep -F 'schema_version=9' .github/workflows/operational-shard-live-bootstrap.yml >/dev/null

  bootstrap:
    name: Bootstrap live operational shards
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Load Supabase management tokens
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id "$SUPABASE_VAULT_SECRET" --query SecretString --output text > "$RUNNER_TEMP/supabase-vault.json"
          aws secretsmanager get-secret-value --secret-id "$DR_SECRET" --query SecretString --output text > "$RUNNER_TEMP/dr.json"
          PRIMARY_TOKEN="$(jq -r '.managementAccessToken // empty' "$RUNNER_TEMP/supabase-vault.json")"
          FALLBACK_TOKEN="$(jq -r '.DR_SUPABASE_ACCESS_TOKEN // empty' "$RUNNER_TEMP/dr.json")"
          test -n "$PRIMARY_TOKEN" || { echo "::error::Primary Supabase management token is unavailable in Credential Vault."; exit 1; }
          echo "::add-mask::$PRIMARY_TOKEN"
          if [ -n "$FALLBACK_TOKEN" ]; then echo "::add-mask::$FALLBACK_TOKEN"; fi
          echo "SUPABASE_ACCESS_TOKEN=$PRIMARY_TOKEN" >> "$GITHUB_ENV"
          echo "SUPABASE_FALLBACK_ACCESS_TOKEN=$FALLBACK_TOKEN" >> "$GITHUB_ENV"

      - name: Apply shard schema and align physical write gates
        run: |
          set -euo pipefail
          hardening_sql="$(cat infra/supabase/operational-shards/hardening-v2.sql)"
          inventory_sql="$(cat infra/supabase/operational-shards/inventory-v7.sql)"
          online_ordering_sql="$(cat infra/supabase/operational-shards/online-ordering-v8.sql)"
          partial_tenders_sql="$(cat infra/supabase/operational-shards/partial-tenders-v8.sql)"
          ingredient_inventory_sql="$(cat infra/supabase/operational-shards/ingredient-inventory-v9.sql)"
          fence_sql="$(cat infra/supabase/operational-shards/write-fence-v3.sql)"

          sql_api() {
            local ref="$1" sql="$2" out="$3" token="$SUPABASE_ACCESS_TOKEN" code
            jq -n --arg query "$sql" '{query:$query}' > "$RUNNER_TEMP/query.json"
            code="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              --request POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/query.json" "https://api.supabase.com/v1/projects/$ref/database/query" || true)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              test -n "$SUPABASE_FALLBACK_ACCESS_TOKEN" || { cat "$out"; return 1; }
              code="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
                --request POST -H "Authorization: Bearer $SUPABASE_FALLBACK_ACCESS_TOKEN" -H 'Content-Type: application/json' \
                --data-binary "@$RUNNER_TEMP/query.json" "https://api.supabase.com/v1/projects/$ref/database/query" || true)"
            fi
            test "$code" -ge 200 && test "$code" -lt 300 || { cat "$out"; return 1; }
          }

          sql_api "$GLOBAL_REF" "select id,active_physical_shard_id from public.operational_shards
            where id in ('shard-01','shard-02') order by id;" "$RUNNER_TEMP/routing-gates.json"
          S1_ACTIVE="$(jq -r '.[] | select(.id=="shard-01") | .active_physical_shard_id' "$RUNNER_TEMP/routing-gates.json")"
          S2_ACTIVE="$(jq -r '.[] | select(.id=="shard-02") | .active_physical_shard_id' "$RUNNER_TEMP/routing-gates.json")"
          [[ "$S1_ACTIVE" = "shard-01" || "$S1_ACTIVE" = "shard-01-dr" ]]
          [[ "$S2_ACTIVE" = "shard-02" || "$S2_ACTIVE" = "shard-02-dr" ]]

          align_physical() {
            local ref="$1" physical="$2" active="$3" active_reason="$4" standby_reason="$5" label="$6"
            local frozen reason expected
            if [ "$physical" = "$active" ]; then
              frozen=false
              reason="$active_reason"
              expected=false
            else
              frozen=true
              reason="$standby_reason"
              expected=true
            fi
            sql_api "$ref" "update public.operational_shard_write_gate
              set frozen=$frozen,reason='$reason',updated_at=now() where id=1;
              select frozen from public.operational_shard_write_gate where id=1;" "$RUNNER_TEMP/$label-gate.json"
            test "$(jq -r '.[0].frozen' "$RUNNER_TEMP/$label-gate.json")" = "$expected"
          }

          restore_authoritative_gates() {
            local rc="$1"
            trap - ERR
            set +e
            align_physical "$SHARD01_REF" shard-01 "$S1_ACTIVE" active-primary standby-primary shard01-restore
            align_physical "$SHARD01_DR_REF" shard-01-dr "$S1_ACTIVE" active-dr standby-dr shard01dr-restore
            align_physical "$SHARD02_REF" shard-02 "$S2_ACTIVE" active-primary standby-primary shard02-restore
            align_physical "$SHARD02_DR_REF" shard-02-dr "$S2_ACTIVE" active-dr standby-dr shard02dr-restore
            exit "$rc"
          }
          trap 'restore_authoritative_gates $?' ERR

          apply_and_align() {
            local ref="$1" label="$2" physical="$3" active="$4" active_reason="$5" standby_reason="$6"
            sql_api "$ref" "$hardening_sql" "$RUNNER_TEMP/$label-hardening-result.json"
            sql_api "$ref" "$inventory_sql" "$RUNNER_TEMP/$label-inventory-result.json"
            sql_api "$ref" "$online_ordering_sql" "$RUNNER_TEMP/$label-online-ordering-result.json"
            sql_api "$ref" "$partial_tenders_sql" "$RUNNER_TEMP/$label-partial-tenders-result.json"
            sql_api "$ref" "$ingredient_inventory_sql" "$RUNNER_TEMP/$label-ingredient-inventory-result.json"
            sql_api "$ref" "$fence_sql" "$RUNNER_TEMP/$label-write-fence-result.json"
            sql_api "$ref" "select
              (select max(version) from public.operational_schema_versions) as max_version,
              to_regclass('public.pos_inventory_stock_areas') is not null as has_stock_areas,
              to_regclass('public.pos_inventory_area_balances') is not null as has_area_balances,
              to_regclass('public.pos_inventory_transfers') is not null as has_inventory_transfers,
              to_regprocedure('public.pos_begin_partial_card_tender(uuid,uuid,integer,integer,uuid)') is not null as has_partial_tender,
              to_regprocedure('public.pos_transfer_inventory(uuid,uuid,uuid,uuid,numeric,text)') is not null as has_transfer_rpc,
              exists(select 1 from information_schema.columns
                     where table_schema='public' and table_name='pos_inventory_items' and column_name='unit_code') as has_unit_code;" "$RUNNER_TEMP/$label-v9-proof.json"
            jq -e 'length == 1 and .[0].max_version >= 9 and .[0].has_stock_areas == true and .[0].has_area_balances == true and .[0].has_inventory_transfers == true and .[0].has_partial_tender == true and .[0].has_transfer_rpc == true and .[0].has_unit_code == true' "$RUNNER_TEMP/$label-v9-proof.json" >/dev/null
            align_physical "$ref" "$physical" "$active" "$active_reason" "$standby_reason" "$label"
          }

          apply_and_align "$SHARD01_REF" shard01 shard-01 "$S1_ACTIVE" active-primary standby-primary
          apply_and_align "$SHARD01_DR_REF" shard01dr shard-01-dr "$S1_ACTIVE" active-dr standby-dr
          apply_and_align "$SHARD02_REF" shard02 shard-02 "$S2_ACTIVE" active-primary standby-primary
          apply_and_align "$SHARD02_DR_REF" shard02dr shard-02-dr "$S2_ACTIVE" active-dr standby-dr

          trap - ERR

      - name: Resolve modern secret keys without printing them
        run: |
          set -euo pipefail
          resolve() {
            local ref="$1" name="$2" token="$SUPABASE_ACCESS_TOKEN" code
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/${name}-keys.json" --write-out '%{http_code}'               -H "Authorization: Bearer $token"               "https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true" || true)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              test -n "$SUPABASE_FALLBACK_ACCESS_TOKEN" || {
                echo "::error::Primary Supabase token cannot reveal keys for ${name} (${ref}): HTTP ${code}, and no fallback token is available."
                exit 1
              }
              token="$SUPABASE_FALLBACK_ACCESS_TOKEN"
              code="$(curl --silent --show-error --output "$RUNNER_TEMP/${name}-keys.json" --write-out '%{http_code}'                 -H "Authorization: Bearer $token"                 "https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true" || true)"
            fi
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Neither vault-managed Supabase management token can reveal keys for ${name} (${ref}): HTTP ${code}."
              exit 1
            fi
            secret="$(jq -r '[.[] | select(.type=="secret" and (.disabled != true))][0].api_key // empty' "$RUNNER_TEMP/${name}-keys.json")"
            test -n "$secret" || { echo "::error::No active modern secret key found for ${name} (${ref})."; exit 1; }
            [[ "$secret" == sb_secret_* ]]
            echo "::add-mask::$secret"
            printf '%s' "$secret" > "$RUNNER_TEMP/${name}-secret"
          }
          resolve "$SHARD01_REF" shard01
          resolve "$SHARD01_DR_REF" shard01dr
          resolve "$SHARD02_REF" shard02
          resolve "$SHARD02_DR_REF" shard02dr

      - name: Build and persist operational shard credential map
        run: |
          set -euo pipefail
          jq -n             --arg s1 "https://${SHARD01_REF}.supabase.co"             --arg s1k "$(cat "$RUNNER_TEMP/shard01-secret")"             --arg s1dr "https://${SHARD01_DR_REF}.supabase.co"             --arg s1drk "$(cat "$RUNNER_TEMP/shard01dr-secret")"             --arg s2 "https://${SHARD02_REF}.supabase.co"             --arg s2k "$(cat "$RUNNER_TEMP/shard02-secret")"             --arg s2dr "https://${SHARD02_DR_REF}.supabase.co"             --arg s2drk "$(cat "$RUNNER_TEMP/shard02dr-secret")"             '{
              "shard-01": {url:$s1,serviceRoleKey:$s1k,readEnabled:true,writeEnabled:true},
              "shard-01-dr": {url:$s1dr,serviceRoleKey:$s1drk,readEnabled:true,writeEnabled:true},
              "shard-02": {url:$s2,serviceRoleKey:$s2k,readEnabled:true,writeEnabled:true},
              "shard-02-dr": {url:$s2dr,serviceRoleKey:$s2drk,readEnabled:true,writeEnabled:true}
            }' > "$RUNNER_TEMP/operational-shards.json"
          shards="$(cat "$RUNNER_TEMP/operational-shards.json")"
          echo "::add-mask::$shards"
          jq \
            --arg shards "$shards" \
            --arg s1 "https://${SHARD01_REF}.supabase.co" \
            --arg s1k "$(cat "$RUNNER_TEMP/shard01-secret")" \
            --arg s1dr "https://${SHARD01_DR_REF}.supabase.co" \
            --arg s1drk "$(cat "$RUNNER_TEMP/shard01dr-secret")" \
            --arg s2 "https://${SHARD02_REF}.supabase.co" \
            --arg s2k "$(cat "$RUNNER_TEMP/shard02-secret")" \
            --arg s2dr "https://${SHARD02_DR_REF}.supabase.co" \
            --arg s2drk "$(cat "$RUNNER_TEMP/shard02dr-secret")" \
            '.shard01Url=$s1 |
             .shard01SecretKey=$s1k |
             .shard01DrUrl=$s1dr |
             .shard01DrSecretKey=$s1drk |
             .shard02Url=$s2 |
             .shard02SecretKey=$s2k |
             .shard02DrUrl=$s2dr |
             .shard02DrSecretKey=$s2drk |
             .operationalShardsJson=$shards' \
            "$RUNNER_TEMP/supabase-vault.json" > "$RUNNER_TEMP/supabase-vault-next.json"
          aws secretsmanager put-secret-value \
            --secret-id "$SUPABASE_VAULT_SECRET" \
            --secret-string "file://$RUNNER_TEMP/supabase-vault-next.json" >/dev/null

      - name: Verify all four shard APIs and POS schema
        run: |
          set -euo pipefail
          probe() {
            local ref="$1" keyfile="$2" label="$3"
            key="$(cat "$keyfile")"
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/${label}-probe.json" --write-out '%{http_code}'               -H "apikey: $key"               "https://${ref}.supabase.co/rest/v1/pos_checks?select=id&limit=1")"
            test "$code" = 200 || { echo "::error::${label} POS schema probe failed: HTTP ${code}"; exit 1; }
            inventory_code="$(curl --silent --show-error --output "$RUNNER_TEMP/${label}-inventory-probe.json" --write-out '%{http_code}'               -H "apikey: $key"               "https://${ref}.supabase.co/rest/v1/pos_inventory_items?select=id,unit_code,reorder_point,reorder_quantity,preferred_vendor,vendor_sku&limit=1")"
            test "$inventory_code" = 200 || { echo "::error::${label} inventory schema probe failed: HTTP ${inventory_code}"; exit 1; }
            stock_area_code="$(curl --silent --show-error --output "$RUNNER_TEMP/${label}-stock-area-probe.json" --write-out '%{http_code}'               -H "apikey: $key"               "https://${ref}.supabase.co/rest/v1/pos_inventory_stock_areas?select=id&limit=1")"
            test "$stock_area_code" = 200 || { echo "::error::${label} v9 stock-area schema probe failed: HTTP ${stock_area_code}"; exit 1; }
            ordering_code="$(curl --silent --show-error --output "$RUNNER_TEMP/${label}-ordering-probe.json" --write-out '%{http_code}'               -H "apikey: $key"               "https://${ref}.supabase.co/rest/v1/pos_online_orders?select=id&limit=1")"
            test "$ordering_code" = 200 || { echo "::error::${label} online ordering schema probe failed: HTTP ${ordering_code}"; exit 1; }
            assignment_code="$(curl --silent --show-error --output "$RUNNER_TEMP/${label}-assignment-probe.json" --write-out '%{http_code}'               -H "apikey: $key"               "https://${ref}.supabase.co/rest/v1/reservation_resource_assignments?select=id&limit=1")"
            test "$assignment_code" = 200 || { echo "::error::${label} reservation assignment schema probe failed: HTTP ${assignment_code}"; exit 1; }
            echo "${label}: reachable with POS, inventory, online-ordering, and reservation-assignment schema" >> "$GITHUB_STEP_SUMMARY"
          }
          probe "$SHARD01_REF" "$RUNNER_TEMP/shard01-secret" shard-01
          probe "$SHARD01_DR_REF" "$RUNNER_TEMP/shard01dr-secret" shard-01-dr
          probe "$SHARD02_REF" "$RUNNER_TEMP/shard02-secret" shard-02
          probe "$SHARD02_DR_REF" "$RUNNER_TEMP/shard02dr-secret" shard-02-dr

      - name: Update shard registry schema without reopening fail-closed shards
        env:
          ACTIVATE_INITIAL_PROVISIONING: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_initial_provisioning || false }}
        run: |
          set -euo pipefail
          if [ "$ACTIVATE_INITIAL_PROVISIONING" = true ]; then
            sql="update public.operational_shards
                 set status='active',
                     read_enabled=true,
                     write_enabled=true,
                     schema_version=9,
                     updated_at=now()
                 where id in ('shard-01','shard-02')
                   and status in ('planned','provisioning')
                   and active_physical_shard_id=id
                   and failover_state='primary'
                   and replication_state in ('initializing','healthy');
                 update public.operational_shards
                 set schema_version=9,updated_at=now()
                 where id in ('shard-01','shard-02')
                   and not (
                     status in ('planned','provisioning')
                     and active_physical_shard_id=id
                     and failover_state='primary'
                     and replication_state in ('initializing','healthy')
                   );
                 select id,status,read_enabled,write_enabled,active_physical_shard_id,
                        failover_state,replication_state,schema_version
                 from public.operational_shards
                 where id in ('shard-01','shard-02') order by id;"
          else
            sql="update public.operational_shards
                 set schema_version=9,updated_at=now()
                 where id in ('shard-01','shard-02');
                 select id,status,read_enabled,write_enabled,active_physical_shard_id,
                        failover_state,replication_state,schema_version
                 from public.operational_shards
                 where id in ('shard-01','shard-02') order by id;"
          fi
          jq -n --arg query "$sql" '{query:$query}' > "$RUNNER_TEMP/activate.json"
          curl --fail --silent --show-error --request POST             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H 'Content-Type: application/json'             --data-binary "@$RUNNER_TEMP/activate.json"             "https://api.supabase.com/v1/projects/${GLOBAL_REF}/database/query" > "$RUNNER_TEMP/activate-result.json"
          jq -e 'length == 2 and all(.[]; .schema_version==9)' "$RUNNER_TEMP/activate-result.json" >/dev/null
          if [ "$ACTIVATE_INITIAL_PROVISIONING" = true ]; then
            jq -e 'all(.[]; (.status=="planned" or .status=="provisioning") | not)' "$RUNNER_TEMP/activate-result.json" >/dev/null
          fi

      - name: Summary
        run: |
          {
            echo '### Operational shard bootstrap'
            echo '- Both shard pairs: runtime credentials verified for primary and DR'
            echo '- Operational shard schema v9 verified on all four physical shards'
            echo '- Physical write gates aligned to authoritative active routing'
            echo '- Standby physical databases remain write-frozen'
            echo '- Reservation seat-assignment schema present on all four physical shards'
            echo '- Server secrets persisted only in AWS Credential Vault'
            echo '- Registry fail-closed read/write state preserved on normal pushes'
            echo '- New registry writes activate only through explicit initial-provisioning dispatch after schema proof'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/supabase-vault*.json "$RUNNER_TEMP"/dr.json "$RUNNER_TEMP"/*-keys.json "$RUNNER_TEMP"/*-secret "$RUNNER_TEMP"/operational-shards.json "$RUNNER_TEMP"/*-probe.json "$RUNNER_TEMP"/*-hardening*.json "$RUNNER_TEMP"/*-inventory-result.json "$RUNNER_TEMP"/*-online-ordering-result.json "$RUNNER_TEMP"/*-partial-tenders-result.json "$RUNNER_TEMP"/*-ingredient-inventory-result.json "$RUNNER_TEMP"/*-v9-proof.json "$RUNNER_TEMP"/*-write-fence*.json "$RUNNER_TEMP"/routing-gates*.json "$RUNNER_TEMP"/*-gate.json "$RUNNER_TEMP"/activate*.json
