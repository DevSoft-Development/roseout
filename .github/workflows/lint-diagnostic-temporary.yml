name: Temporary lint diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lint-diagnostic-temporary.yml'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture repository lint report
        shell: bash
        run: |
          set +e
          npm run lint > lint-report.txt 2>&1
          status=$?
          echo "lint_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Persist lint report on diagnostic branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lint-report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture current lint report"
          git push
