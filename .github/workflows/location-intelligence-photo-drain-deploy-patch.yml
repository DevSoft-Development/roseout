name: Location Intelligence photo drain deploy patch

on:
  push:
    branches: [fix/location-intelligence-photo-drain-deploy]
    paths:
      - '.github/workflows/location-intelligence-photo-drain-deploy-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-intelligence-photo-drain-deploy
      - name: Patch production deploy and verification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/aws-location-intelligence-photo-drain.yml')
          text = path.read_text()

          old_env = "  SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co\n  SUPABASE_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role\n"
          new_env = "  SUPABASE_PROJECT_REF: ftdsltatyqhtllyyefzp\n  SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co\n  SUPABASE_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role\n"
          assert text.count(old_env) == 1
          text = text.replace(old_env, new_env)

          checkout = "      - uses: actions/checkout@v4\n\n      - name: Configure AWS credentials\n"
          deploy = """      - uses: actions/checkout@v4\n\n      - name: Validate Supabase deploy secret\n        env:\n          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}\n        run: |\n          set -euo pipefail\n          test -n \"${SUPABASE_ACCESS_TOKEN:-}\" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }\n\n      - name: Install pinned Supabase CLI\n        uses: supabase/setup-cli@v1\n        with:\n          version: 2.81.3\n\n      - name: Deploy photo worker to Virginia production\n        env:\n          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}\n        run: |\n          set -euo pipefail\n          supabase functions deploy nightly-photo-backfill \\\n            --project-ref \"$SUPABASE_PROJECT_REF\" \\\n            --no-verify-jwt\n\n      - name: Configure AWS credentials\n"""
          assert text.count(checkout) == 1
          text = text.replace(checkout, deploy)

          old_select = "--data-urlencode 'select=id,name,google_place_id,has_photos,google_photo_count,photo_discovery_status'"
          new_select = "--data-urlencode 'select=id,name,google_place_id,has_photos,photo_status,image_url,main_image'"
          assert text.count(old_select) == 1
          text = text.replace(old_select, new_select)

          path.write_text(text)
          PY
          grep -F 'SUPABASE_PROJECT_REF: ftdsltatyqhtllyyefzp' .github/workflows/aws-location-intelligence-photo-drain.yml >/dev/null
          grep -F 'supabase functions deploy nightly-photo-backfill' .github/workflows/aws-location-intelligence-photo-drain.yml >/dev/null
          grep -F "select=id,name,google_place_id,has_photos,photo_status,image_url,main_image" .github/workflows/aws-location-intelligence-photo-drain.yml >/dev/null
          if grep -F 'google_photo_count' .github/workflows/aws-location-intelligence-photo-drain.yml >/dev/null; then exit 1; fi
      - name: Commit focused workflow change and remove patch runner
        run: |
          set -euo pipefail
          rm .github/workflows/location-intelligence-photo-drain-deploy-patch.yml
          git config user.name roseoutllc
          git config user.email nick@roseout.com
          git add .github/workflows/aws-location-intelligence-photo-drain.yml .github/workflows/location-intelligence-photo-drain-deploy-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m 'ops: deploy photo worker before production drain'
          git push origin HEAD:fix/location-intelligence-photo-drain-deploy
