name: Credential vault runtime source patch once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/credential-vault-runtime-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/credential-vault-runtime-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/credential-vault-runtime-source
      - name: Patch gateway runtime snapshot and Apple client ID support
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('infra/aws/lambda/platform_job_gateway.py')
          text = path.read_text()
          old = '    "apple": {"issuerId", "keyId", "privateKey"},'
          new = '    "apple": {"clientId", "issuerId", "keyId", "privateKey"},'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = 'def _credential_summary(environment):\n    return {"ok": True, "providers": [_credential_status(environment, provider) for provider in sorted(ALLOWED_PROVIDERS)]}\n\n\n'
          assert text.count(marker) == 1
          runtime = '''def _credential_runtime_snapshot(environment):
    providers = {}
    for provider in sorted(ALLOWED_PROVIDERS):
        value, _, _ = _read_credential(environment, provider)
        clean = {key: item for key, item in value.items() if key in ALLOWED_PROVIDERS[provider] and isinstance(item, str) and item.strip()}
        if provider == "apple" and not clean.get("clientId") and clean.get("issuerId"):
            clean["clientId"] = clean["issuerId"]
        clean.pop("issuerId", None)
        if clean:
            providers[provider] = clean
    return {"ok": True, "environment": environment, "providers": providers}


'''
          text = text.replace(marker, marker + runtime, 1)

          route_marker = '    if method == "GET" and path == "/v1/credentials":\n        environment = _credential_environment((_query(event).get("environment") or [ENVIRONMENT])[0])\n        return _response(200, _credential_summary(environment))\n\n'
          assert text.count(route_marker) == 1
          route = '    if method == "GET" and path == "/v1/credentials/runtime":\n        environment = _credential_environment((_query(event).get("environment") or [ENVIRONMENT])[0])\n        return _response(200, _credential_runtime_snapshot(environment))\n\n'
          text = text.replace(route_marker, route_marker + route, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/aws-admin-credential-vault.yml')
          w = workflow.read_text()
          anchor = "      - 'lib/aws/admin-credential-vault.ts'\n"
          if "credential-vault-runtime-source.ts" not in w:
              w = w.replace(anchor, anchor + "      - 'lib/admin/credential-vault-runtime-source.ts'\n      - 'lib/admin/credential-runtime-inventory.ts'\n      - 'lib/admin/credential-vault-catalog.ts'\n      - 'instrumentation.ts'\n", 2)
          workflow.write_text(w)
          PY
          python -m py_compile infra/aws/lambda/platform_job_gateway.py
          grep -F '/v1/credentials/runtime' infra/aws/lambda/platform_job_gateway.py >/dev/null
          grep -F '"apple": {"clientId", "issuerId", "keyId", "privateKey"}' infra/aws/lambda/platform_job_gateway.py >/dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add infra/aws/lambda/platform_job_gateway.py .github/workflows/aws-admin-credential-vault.yml
          git rm .github/workflows/credential-vault-runtime-source-patch.yml
          git commit -m 'Make credential vault the server runtime source'
          git push origin HEAD:fix/credential-vault-runtime-source
