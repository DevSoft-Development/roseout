name: First-party Rich Feature Taxonomy

on:
  pull_request:
    paths:
      - "lib/search/v2/taxonomy/**"
      - "lib/search/profile/**"
      - ".github/workflows/first-party-rich-feature-taxonomy-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run rich feature taxonomy regression
        run: npx vitest run lib/search/profile/__tests__/firstPartyRichFeatureTaxonomy.test.ts
