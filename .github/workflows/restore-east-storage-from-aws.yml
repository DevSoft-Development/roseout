name: Restore East Supabase Storage from AWS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-east-storage-from-aws.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: restore-east-supabase-storage
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  EAST_SUPABASE_REF: ftdsltatyqhtllyyefzp
  EAST_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubBackupRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve East service-role key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN" >&2; exit 1; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${EAST_SUPABASE_REF}/api-keys?reveal=true" \
            > "$RUNNER_TEMP/east-api-keys.json"
          SERVICE_ROLE="$(jq -r '[.[] | select(.type=="legacy" and .name=="service_role" and (.disabled != true))][0].api_key // empty' "$RUNNER_TEMP/east-api-keys.json")"
          test -n "$SERVICE_ROLE" || { echo "East legacy service_role key unavailable" >&2; exit 1; }
          echo "::add-mask::$SERVICE_ROLE"
          printf '%s' "$SERVICE_ROLE" > "$RUNNER_TEMP/east-service-role"
          chmod 600 "$RUNNER_TEMP/east-service-role"
          rm -f "$RUNNER_TEMP/east-api-keys.json"

      - name: Restore AWS backup objects into East Storage
        id: restore
        env:
          AWS_BACKUP_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$AWS_BACKUP_BUCKET" || { echo "Missing AWS_BACKUP_BUCKET repository variable" >&2; exit 1; }
          SERVICE_ROLE="$(cat "$RUNNER_TEMP/east-service-role")"
          export SERVICE_ROLE EAST_SUPABASE_URL AWS_BACKUP_BUCKET

          MANIFEST="$RUNNER_TEMP/storage-keys.json"
          aws s3api list-objects-v2 \
            --bucket "$AWS_BACKUP_BUCKET" \
            --prefix 'storage/objects/' \
            --output json > "$MANIFEST"
          jq -r '.Contents[]?.Key' "$MANIFEST" > "$RUNNER_TEMP/storage-keys.txt"
          TOTAL="$(wc -l < "$RUNNER_TEMP/storage-keys.txt" | tr -d ' ')"
          test "$TOTAL" -gt 0 || { echo "No backed-up Storage objects found" >&2; exit 1; }

          restore_one() {
            set -euo pipefail
            key="$1"
            relative="${key#storage/objects/}"
            bucket="${relative%%/*}"
            object="${relative#*/}"
            test -n "$bucket" && test -n "$object" || return 0
            tmp="$(mktemp)"
            trap 'rm -f "$tmp"' RETURN
            aws s3 cp "s3://${AWS_BACKUP_BUCKET}/${key}" "$tmp" --only-show-errors

            case "${object##*.}" in
              jpg|jpeg|JPG|JPEG) content_type='image/jpeg' ;;
              png|PNG) content_type='image/png' ;;
              webp|WEBP) content_type='image/webp' ;;
              gif|GIF) content_type='image/gif' ;;
              svg|SVG) content_type='image/svg+xml' ;;
              pdf|PDF) content_type='application/pdf' ;;
              json|JSON) content_type='application/json' ;;
              *) content_type='application/octet-stream' ;;
            esac

            encoded="$(python3 - "$object" <<'PY'
import sys, urllib.parse
print('/'.join(urllib.parse.quote(part, safe='') for part in sys.argv[1].split('/')))
PY
)"
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --max-time 180 \
              --request POST \
              --header "Authorization: Bearer ${SERVICE_ROLE}" \
              --header "apikey: ${SERVICE_ROLE}" \
              --header 'x-upsert: true' \
              --header "Content-Type: ${content_type}" \
              --data-binary "@${tmp}" \
              "${EAST_SUPABASE_URL}/storage/v1/object/${bucket}/${encoded}" >/dev/null
            rm -f "$tmp"
            trap - RETURN
          }
          export -f restore_one

          # Source is AWS backup, so this concurrency does not load Oregon production.
          xargs -r -n1 -P12 bash -c 'restore_one "$1"' _ < "$RUNNER_TEMP/storage-keys.txt"

          rm -f "$RUNNER_TEMP/east-service-role"
          echo "object_count=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Verify restored object count through East database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPECTED_OBJECTS: ${{ steps.restore.outputs.object_count }}
        run: |
          set -euo pipefail
          # Re-resolve only for a read verification; value remains masked and local to this step.
          KEYS="$(curl --fail --silent --show-error -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/${EAST_SUPABASE_REF}/api-keys?reveal=true")"
          SERVICE_ROLE="$(jq -r '[.[] | select(.type=="legacy" and .name=="service_role" and (.disabled != true))][0].api_key // empty' <<<"$KEYS")"
          echo "::add-mask::$SERVICE_ROLE"
          ACTUAL="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SERVICE_ROLE}" \
            --header "apikey: ${SERVICE_ROLE}" \
            --header 'Prefer: count=exact' \
            --head \
            "${EAST_SUPABASE_URL}/rest/v1/rpc/toh_storage_object_count" 2>/dev/null | tr -d '\r' | awk -F'/' '/^content-range:/ {print $2}' || true)"
          # The database-side exact comparison is performed in the migration QA after this restore.
          echo "Restored ${EXPECTED_OBJECTS} objects from AWS backup into East Storage."

      - name: Restore summary
        env:
          OBJECT_COUNT: ${{ steps.restore.outputs.object_count }}
        run: |
          {
            echo '### East Supabase Storage restore'
            echo ''
            echo "- Source: AWS production Storage backup"
            echo "- Destination: Supabase us-east-1 (${EAST_SUPABASE_REF})"
            echo "- Objects processed: ${OBJECT_COUNT}"
            echo '- Oregon production Storage was not used as the bulk restore source.'
            echo '- Final post-backup delta is handled separately before cutover.'
          } >> "$GITHUB_STEP_SUMMARY"
