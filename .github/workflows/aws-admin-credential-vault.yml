name: AWS admin credential vault

on:
  pull_request:
    paths:
      - 'infra/aws/lambda/platform_job_gateway.py'
      - 'lib/aws/admin-credential-vault.ts'
      - '.github/workflows/aws-admin-credential-vault.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/aws/lambda/platform_job_gateway.py'
      - 'lib/aws/admin-credential-vault.ts'
      - '.github/workflows/aws-admin-credential-vault.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-admin-credential-vault-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  VAULT_PREFIX: /theouthaven/credential-vault

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate gateway Python syntax
        run: python -m py_compile infra/aws/lambda/platform_job_gateway.py
      - name: Verify vault route and prefix are present
        run: |
          set -euo pipefail
          grep -F '/v1/credentials' infra/aws/lambda/platform_job_gateway.py >/dev/null
          grep -F '/theouthaven/credential-vault' infra/aws/lambda/platform_job_gateway.py >/dev/null

  deploy-policy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || { echo "Wrong AWS account: $ACCOUNT" >&2; exit 1; }

      - name: Apply scoped vault policy to platform gateway
        run: |
          set -euo pipefail
          POLICY_FILE="$RUNNER_TEMP/credential-vault-policy.json"
          cat > "$POLICY_FILE" <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "CredentialVaultReadWrite",
                "Effect": "Allow",
                "Action": [
                  "secretsmanager:GetSecretValue",
                  "secretsmanager:PutSecretValue",
                  "secretsmanager:CreateSecret",
                  "secretsmanager:DescribeSecret",
                  "secretsmanager:TagResource"
                ],
                "Resource": "arn:aws:secretsmanager:${AWS_REGION}:${AWS_ACCOUNT_ID}:secret:${VAULT_PREFIX}/*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name TheOutHavenJobGateway-production \
            --policy-name TheOutHavenAdminCredentialVault \
            --policy-document "file://$POLICY_FILE"

      - name: Verify scoped policy
        run: |
          set -euo pipefail
          aws iam get-role-policy \
            --role-name TheOutHavenJobGateway-production \
            --policy-name TheOutHavenAdminCredentialVault \
            --query 'PolicyDocument.Statement[0].[Effect,Resource]' \
            --output text | grep -F "$VAULT_PREFIX/" >/dev/null
