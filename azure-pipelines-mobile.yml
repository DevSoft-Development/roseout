# Mobile production pipeline
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - mobile/*
      - azure-pipelines-mobile.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - mobile/*
      - azure-pipelines-mobile.yml

variables:
  - group: theouthaven-mobile-production
  - name: nodeVersion
    value: '22.x'
  - name: appVersion
    value: '0.1.2'
  - name: iosArtifactName
    value: 'theouthaven-ios'
  - name: androidArtifactName
    value: 'theouthaven-android'
  - name: storeSubmissionEnabled
    value: 'false'

stages:
  - stage: Validate
    displayName: Validate mobile source
    jobs:
      - job: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: |
              set -euo pipefail
              cd mobile
              npm ci --no-audit --no-fund
              npm run typecheck
              npx expo config --type public >/dev/null
              npx expo install --check
            displayName: Typecheck and validate Expo config

  - stage: Build
    displayName: Native iOS and Android builds
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: iOS
        displayName: Build signed iOS IPA
        pool:
          vmImage: macOS-26
        steps:
          - script: |
              set -euo pipefail
              xcodebuild -version
              XCODE_VERSION="$(xcodebuild -version | awk '/Xcode/{print $2}')"
              python3 - "$XCODE_VERSION" <<'PY'
              import sys

              def parse_version(value):
                  parts = value.split(".")
                  try:
                      return tuple(int(part) for part in parts)
                  except ValueError as exc:
                      raise SystemExit(f"Unable to parse Xcode version: {value}") from exc

              current = parse_version(sys.argv[1])
              minimum = parse_version("26.4")
              if current < minimum:
                  raise SystemExit(
                      f"Expo SDK 57 requires Xcode 26.4+; runner has Xcode {sys.argv[1]}"
                  )
              print(f"Xcode toolchain validated: {sys.argv[1]}")
              PY
            displayName: Validate Xcode 26.4+ toolchain

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - task: InstallAppleCertificate@2
            name: installAppleCertificate
            inputs:
              certSecureFile: $(IOS_CERTIFICATE_SECURE_FILE)
              certPwd: $(IOS_CERTIFICATE_PASSWORD)
              keychain: temp
              deleteCert: true

          - task: InstallAppleProvisioningProfile@1
            name: installProvisioningProfile
            inputs:
              provisioningProfileLocation: secureFiles
              provProfileSecureFile: $(IOS_PROFILE_SECURE_FILE)
              removeProfile: true

          - task: DownloadSecureFile@1
            name: appStoreKey
            inputs:
              secureFile: $(APP_STORE_CONNECT_KEY_SECURE_FILE)

          - script: |
              set -euo pipefail
              cd mobile
              npm ci --no-audit --no-fund
              for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
                value="${!name:-}"
                test -n "$value" || { echo "$name is missing" >&2; exit 1; }
                case "$value" in
                  '\$('*) echo "$name is unresolved in Azure DevOps: $value" >&2; exit 1 ;;
                esac
              done

              SENTRY_CLI="./node_modules/@sentry/cli/bin/sentry-cli"
              test -x "$SENTRY_CLI" || { echo "sentry-cli is not installed" >&2; exit 1; }

              "$SENTRY_CLI" info

              STATUS="$(curl --silent --show-error --output "$(Agent.TempDirectory)/sentry-release-probe.json" --write-out '%{http_code}' \
                -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
                "https://sentry.io/api/0/organizations/$SENTRY_ORG/releases/?project=$SENTRY_PROJECT&per_page=1")"
              if [ "$STATUS" != "200" ]; then
                echo "Sentry CI validation failed for organization '$SENTRY_ORG' and project '$SENTRY_PROJECT' (HTTP $STATUS)." >&2
                cat "$(Agent.TempDirectory)/sentry-release-probe.json" >&2 || true
                exit 1
              fi
            env:
              SENTRY_AUTH_TOKEN: $(SENTRY_AUTH_TOKEN)
              SENTRY_ORG: $(SENTRY_ORG)
              SENTRY_PROJECT: $(SENTRY_PROJECT)
            displayName: Validate Sentry CI credentials

          - script: |
              set -euo pipefail
              cd mobile
              npm ci --no-audit --no-fund
              npx expo prebuild --clean --platform ios --no-install
              cd ios
              pod install --repo-update
            env:
              SENTRY_AUTH_TOKEN: $(SENTRY_AUTH_TOKEN)
              SENTRY_ORG: $(SENTRY_ORG)
              SENTRY_PROJECT: $(SENTRY_PROJECT)
            displayName: Generate iOS native project

          - script: |
              set -euo pipefail

              PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$(APPLE_PROV_PROFILE_UUID).mobileprovision"
              test -f "$PROFILE_PATH" || {
                echo "Provisioning profile was not installed at expected UUID path: $PROFILE_PATH" >&2
                exit 1
              }

              PROFILE_PLIST="$(Agent.TempDirectory)/theouthaven-profile.plist"
              security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

              PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
              PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
              PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
              PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
              PROFILE_GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || echo false)"
              PROFILE_EXPIRATION="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFILE_PLIST")"

              echo "Provisioning profile: $PROFILE_NAME"
              echo "Provisioning UUID: $PROFILE_UUID"
              echo "Provisioning team: $PROFILE_TEAM"
              echo "Provisioning app identifier: $PROFILE_APP_ID"
              echo "Provisioning expiration: $PROFILE_EXPIRATION"
              echo "Provisioning get-task-allow: $PROFILE_GET_TASK_ALLOW"

              test "$PROFILE_UUID" = "$(APPLE_PROV_PROFILE_UUID)" || {
                echo "Installed provisioning profile UUID does not match Azure task output." >&2
                exit 1
              }
              test "$PROFILE_TEAM" = "$(IOS_TEAM_ID)" || {
                echo "Provisioning profile team '$PROFILE_TEAM' does not match IOS_TEAM_ID '$(IOS_TEAM_ID)'." >&2
                exit 1
              }
              PROFILE_PREFIX="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' "$PROFILE_PLIST")"
              test "$PROFILE_APP_ID" = "$PROFILE_PREFIX.com.theouthaven.app" || {
                echo "Provisioning profile app identifier '$PROFILE_APP_ID' does not match profile prefix '$PROFILE_PREFIX' plus bundle ID com.theouthaven.app." >&2
                exit 1
              }
              test "$PROFILE_GET_TASK_ALLOW" = "false" || {
                echo "Provisioning profile is not an App Store distribution profile (get-task-allow must be false)." >&2
                exit 1
              }

              if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.associated-domains' "$PROFILE_PLIST" >/dev/null 2>&1; then
                echo "Provisioning profile is missing the Associated Domains entitlement required by app.json (applinks:outhvn.com)." >&2
                exit 1
              fi

              echo "Installed code-signing identities:"
              security find-identity -v -p codesigning
              security find-identity -v -p codesigning | grep -F "$(APPLE_CERTIFICATE_SIGNING_IDENTITY)" >/dev/null || {
                echo "Installed certificate identity does not match APPLE_CERTIFICATE_SIGNING_IDENTITY." >&2
                exit 1
              }

              cd mobile
              xcodebuild -workspace ios/TheOutHaven.xcworkspace -scheme TheOutHaven -configuration Release -showBuildSettings |
                grep -E '(^| )[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE) =' || true
            displayName: Validate iOS distribution signing inputs

          - script: |
              set -euo pipefail
              cd mobile

              ARCHIVE="$(Build.ArtifactStagingDirectory)/TheOutHaven.xcarchive"
              EXPORT_DIR="$(Build.ArtifactStagingDirectory)/ios-export"
              ARCHIVE_LOG="$(Build.ArtifactStagingDirectory)/xcode-archive.log"
              EXPORT_LOG="$(Build.ArtifactStagingDirectory)/xcode-export.log"

              rm -rf "$ARCHIVE" "$EXPORT_DIR"
              mkdir -p "$EXPORT_DIR"

              set +e
              xcodebuild \
                -workspace ios/TheOutHaven.xcworkspace \
                -scheme TheOutHaven \
                -configuration Release \
                -sdk iphoneos \
                -destination 'generic/platform=iOS' \
                -archivePath "$ARCHIVE" \
                DEVELOPMENT_TEAM="$(IOS_TEAM_ID)" \
                CODE_SIGN_STYLE=Manual \
                CODE_SIGN_IDENTITY="$(APPLE_CERTIFICATE_SIGNING_IDENTITY)" \
                PROVISIONING_PROFILE="$(APPLE_PROV_PROFILE_UUID)" \
                CURRENT_PROJECT_VERSION="$(Build.BuildId)" \
                MARKETING_VERSION="$(appVersion)" \
                clean archive 2>&1 | tee "$ARCHIVE_LOG"
              XCODE_STATUS=${PIPESTATUS[0]}
              set -e

              if [ "$XCODE_STATUS" -ne 0 ]; then
                echo "Xcode archive failed. Relevant build/signing errors:" >&2
                grep -Ei '(^|[[:space:]])(error:|fatal error:)|provision|signing|certificate|entitlement|bundle identifier|PhaseScriptExecution|Command .* failed' "$ARCHIVE_LOG" | tail -200 >&2 || true
                exit "$XCODE_STATUS"
              fi

              cat > "$(Build.ArtifactStagingDirectory)/ExportOptions.plist" <<PLIST
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>method</key>
                <string>app-store-connect</string>
                <key>signingStyle</key>
                <string>manual</string>
                <key>teamID</key>
                <string>$(IOS_TEAM_ID)</string>
                <key>provisioningProfiles</key>
                <dict>
                  <key>com.theouthaven.app</key>
                  <string>$(APPLE_PROV_PROFILE_UUID)</string>
                </dict>
                <key>stripSwiftSymbols</key>
                <true/>
                <key>uploadSymbols</key>
                <true/>
              </dict>
              </plist>
              PLIST

              set +e
              xcodebuild \
                -exportArchive \
                -archivePath "$ARCHIVE" \
                -exportPath "$EXPORT_DIR" \
                -exportOptionsPlist "$(Build.ArtifactStagingDirectory)/ExportOptions.plist" \
                2>&1 | tee "$EXPORT_LOG"
              EXPORT_STATUS=${PIPESTATUS[0]}
              set -e

              if [ "$EXPORT_STATUS" -ne 0 ]; then
                echo "Xcode export failed. Relevant export/signing errors:" >&2
                grep -Ei 'error:|provision|signing|certificate|profile|entitlement|bundle identifier' "$EXPORT_LOG" | tail -200 >&2 || true
                exit "$EXPORT_STATUS"
              fi
            env:
              SENTRY_AUTH_TOKEN: $(SENTRY_AUTH_TOKEN)
              SENTRY_ORG: $(SENTRY_ORG)
              SENTRY_PROJECT: $(SENTRY_PROJECT)
            displayName: Archive and export signed IPA with diagnostics

          - script: |
              set -euo pipefail
              IPA="$(find "$(Build.ArtifactStagingDirectory)/ios-export" -name '*.ipa' | head -1)"
              test -n "$IPA"
              cp "$IPA" "$(Build.ArtifactStagingDirectory)/TheOutHaven.ipa"
            displayName: Normalize signed IPA artifact

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/TheOutHaven.ipa
              artifactName: $(iosArtifactName)

          - script: |
              set -euo pipefail
              mkdir -p "$HOME/.appstoreconnect/private_keys"
              cp "$(appStoreKey.secureFilePath)" "$HOME/.appstoreconnect/private_keys/AuthKey_$(APP_STORE_CONNECT_KEY_ID).p8"
              xcrun iTMSTransporter                 -m upload                 -assetFile "$(Build.ArtifactStagingDirectory)/TheOutHaven.ipa"                 -apiKey "$(APP_STORE_CONNECT_KEY_ID)"                 -apiIssuer "$(APP_STORE_CONNECT_ISSUER_ID)"
            displayName: Submit IPA to TestFlight via App Store Connect
            condition: and(succeeded(), eq(variables['storeSubmissionEnabled'], 'true'))

          - script: |
              set -euo pipefail
              node - <<'NODE'
              const fs = require('fs');
              const crypto = require('crypto');

              const key = fs.readFileSync(process.env.ASC_KEY_FILE, 'utf8');
              const keyId = process.env.ASC_KEY_ID;
              const issuerId = process.env.ASC_ISSUER_ID;
              const appId = process.env.ASC_APP_ID;
              const buildNumber = process.env.ASC_BUILD_NUMBER;

              const b64url = (value) => Buffer.from(value).toString('base64url');
              function token() {
                const now = Math.floor(Date.now() / 1000);
                const header = { alg: 'ES256', kid: keyId, typ: 'JWT' };
                const payload = { iss: issuerId, iat: now - 30, exp: now + 1200, aud: 'appstoreconnect-v1' };
                const input = b64url(JSON.stringify(header)) + '.' + b64url(JSON.stringify(payload));
                const signature = crypto.sign(null, Buffer.from(input), { key, dsaEncoding: 'ieee-p1363' });
                return input + '.' + signature.toString('base64url');
              }

              async function verify() {
                const params = new URLSearchParams({
                  'filter[app]': appId,
                  'filter[version]': buildNumber,
                  'fields[builds]': 'version,processingState,uploadedDate,buildAudienceType',
                  'limit': '1',
                });

                for (let attempt = 1; attempt <= 40; attempt++) {
                  const response = await fetch('https://api.appstoreconnect.apple.com/v1/builds?' + params, {
                    headers: { Authorization: 'Bearer ' + token() },
                  });
                  if (!response.ok) {
                    throw new Error('App Store Connect build lookup failed: HTTP ' + response.status + ' ' + await response.text());
                  }
                  const body = await response.json();
                  const build = body.data?.[0];
                  if (build) {
                    const state = build.attributes?.processingState;
                    if (state === 'VALID') {
                      console.log('TestFlight build verified:', build.attributes.version, state);
                      return;
                    }
                    if (state === 'FAILED' || state === 'INVALID') {
                      throw new Error('App Store Connect rejected build ' + buildNumber + ' with state ' + state);
                    }
                  }
                  await new Promise((resolve) => setTimeout(resolve, 15000));
                }
                throw new Error('Uploaded iOS build did not become VALID in App Store Connect');
              }

              verify().catch((error) => {
                console.error(error);
                process.exit(1);
              });
              NODE
            env:
              ASC_KEY_FILE: $(appStoreKey.secureFilePath)
              ASC_KEY_ID: $(APP_STORE_CONNECT_KEY_ID)
              ASC_ISSUER_ID: $(APP_STORE_CONNECT_ISSUER_ID)
              ASC_APP_ID: $(APP_STORE_CONNECT_APP_ID)
              ASC_BUILD_NUMBER: $(Build.BuildId)
            displayName: Verify TestFlight build is processed
            condition: and(succeeded(), eq(variables['storeSubmissionEnabled'], 'true'))

      - job: Android
        displayName: Build signed Android AAB
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: DownloadSecureFile@1
            name: androidKeystore
            inputs:
              secureFile: $(ANDROID_KEYSTORE_SECURE_FILE)

          - task: DownloadSecureFile@1
            name: googlePlayServiceAccount
            inputs:
              secureFile: $(GOOGLE_PLAY_SERVICE_ACCOUNT_SECURE_FILE)

          - script: |
              set -euo pipefail
              cd mobile
              npm ci --no-audit --no-fund
              for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
                value="${!name:-}"
                test -n "$value" || { echo "$name is missing" >&2; exit 1; }
                case "$value" in
                  '\$('*) echo "$name is unresolved in Azure DevOps: $value" >&2; exit 1 ;;
                esac
              done

              SENTRY_CLI="./node_modules/@sentry/cli/bin/sentry-cli"
              test -x "$SENTRY_CLI" || { echo "sentry-cli is not installed" >&2; exit 1; }

              "$SENTRY_CLI" info

              STATUS="$(curl --silent --show-error --output "$(Agent.TempDirectory)/sentry-release-probe.json" --write-out '%{http_code}' \
                -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
                "https://sentry.io/api/0/organizations/$SENTRY_ORG/releases/?project=$SENTRY_PROJECT&per_page=1")"
              if [ "$STATUS" != "200" ]; then
                echo "Sentry CI validation failed for organization '$SENTRY_ORG' and project '$SENTRY_PROJECT' (HTTP $STATUS)." >&2
                cat "$(Agent.TempDirectory)/sentry-release-probe.json" >&2 || true
                exit 1
              fi
            env:
              SENTRY_AUTH_TOKEN: $(SENTRY_AUTH_TOKEN)
              SENTRY_ORG: $(SENTRY_ORG)
              SENTRY_PROJECT: $(SENTRY_PROJECT)
            displayName: Validate Sentry CI credentials

          - script: |
              set -euo pipefail
              cd mobile
              npm ci --no-audit --no-fund
              npx expo prebuild --clean --platform android --no-install

              python3 - <<'PY'
              import os
              import re
              from pathlib import Path

              app_dir = Path('android/app')
              build_gradle = app_dir / 'build.gradle'
              signing_gradle = app_dir / 'theouthaven-signing.gradle'

              text = build_gradle.read_text()
              version_code = int(os.environ['BUILD_BUILDID'])
              version_name = os.environ['TOH_APP_VERSION']

              text, code_count = re.subn(
                  r'versionCode\s+\d+',
                  f'versionCode {version_code}',
                  text,
                  count=1,
              )
              text, name_count = re.subn(
                  r'versionName\s+["\'][^"\']+["\']',
                  f'versionName "{version_name}"',
                  text,
                  count=1,
              )
              if code_count != 1 or name_count != 1:
                  raise SystemExit('Generated Android version fields were not found')

              apply_line = 'apply from: "./theouthaven-signing.gradle"'
              if apply_line not in text:
                  text = text.rstrip() + '\n\n' + apply_line + '\n'

              signing_gradle.write_text(r"""
              android {
                  signingConfigs {
                      release {
                          storeFile file(System.getenv('TOH_ANDROID_KEYSTORE'))
                          storePassword System.getenv('TOH_ANDROID_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('TOH_ANDROID_KEY_ALIAS')
                          keyPassword System.getenv('TOH_ANDROID_KEY_PASSWORD')
                      }
                  }

                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
              """.strip() + '\n')

              build_gradle.write_text(text)
              PY

              python3 - <<'PY'
              from pathlib import Path

              path = Path('android/gradle.properties')
              text = path.read_text() if path.exists() else ''
              lines = [
                  line for line in text.splitlines()
                  if not line.startswith('org.gradle.jvmargs=')
                  and not line.startswith('org.gradle.workers.max=')
                  and not line.startswith('org.gradle.parallel=')
              ]
              lines.extend([
                  'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8',
                  'org.gradle.workers.max=2',
                  'org.gradle.parallel=false',
              ])
              path.write_text('\n'.join(lines) + '\n')
              PY
            env:
              TOH_APP_VERSION: $(appVersion)
              SENTRY_AUTH_TOKEN: $(SENTRY_AUTH_TOKEN)
              SENTRY_ORG: $(SENTRY_ORG)
              SENTRY_PROJECT: $(SENTRY_PROJECT)
            displayName: Generate Android native project and production signing config

          - script: |
              set -euo pipefail
              cd mobile/android
              chmod +x gradlew

              echo "Android release build diagnostics:"
              ./gradlew --version
              echo "Gradle properties:"
              grep -E '^(org\.gradle\.(jvmargs|workers\.max|parallel))=' gradle.properties || true

              GRADLE_LOG="$(Build.ArtifactStagingDirectory)/android-gradle-release.log"
              rm -f "$GRADLE_LOG"

              set +e
              (
                set -o pipefail
                ./gradlew \
                  --no-daemon \
                  --max-workers=2 \
                  --console=plain \
                  --info \
                  --stacktrace \
                  bundleRelease 2>&1 | tee "$GRADLE_LOG"
              ) &
              GRADLE_PIPE_PID=$!

              (
                while kill -0 "$GRADLE_PIPE_PID" 2>/dev/null; do
                  sleep 60
                  if kill -0 "$GRADLE_PIPE_PID" 2>/dev/null; then
                    echo "===== Android Gradle heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
                    echo "Active Java/Gradle/Kotlin processes:"
                    ps -eo pid,ppid,%cpu,%mem,etime,command | grep -E '[j]ava|[g]radle|[k]otlin' | head -25 || true
                    echo "Recent Gradle output:"
                    tail -30 "$GRADLE_LOG" || true
                    echo "==========================================================="
                  fi
                done
              ) &
              HEARTBEAT_PID=$!

              wait "$GRADLE_PIPE_PID"
              GRADLE_STATUS=$?
              kill "$HEARTBEAT_PID" 2>/dev/null || true
              wait "$HEARTBEAT_PID" 2>/dev/null || true
              set -e

              if [ "$GRADLE_STATUS" -ne 0 ]; then
                echo "Android Gradle release build failed with exit code $GRADLE_STATUS." >&2
                echo "Last 200 Gradle log lines:" >&2
                tail -200 "$GRADLE_LOG" >&2 || true
                exit "$GRADLE_STATUS"
              fi

              AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
              test -n "$AAB"
              cp "$AAB" "$(Build.ArtifactStagingDirectory)/TheOutHaven.aab"
            env:
              TOH_ANDROID_KEYSTORE: $(androidKeystore.secureFilePath)
              TOH_ANDROID_KEYSTORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
              TOH_ANDROID_KEY_ALIAS: $(ANDROID_KEY_ALIAS)
              TOH_ANDROID_KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)
              SENTRY_AUTH_TOKEN: $(SENTRY_AUTH_TOKEN)
              SENTRY_ORG: $(SENTRY_ORG)
              SENTRY_PROJECT: $(SENTRY_PROJECT)
            displayName: Build signed Android App Bundle

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/TheOutHaven.aab
              artifactName: $(androidArtifactName)

          - script: |
              set -euo pipefail
              cd mobile
              npm install --no-save --no-audit --no-fund googleapis
              node - <<'NODE'
              const fs = require('fs');
              const { google } = require('googleapis');
              const packageName = 'com.theouthaven.app';
              const aabPath = process.env.AAB_PATH;
              const keyFile = process.env.GOOGLE_APPLICATION_CREDENTIALS;
              (async () => {
                const auth = new google.auth.GoogleAuth({
                  keyFile,
                  scopes: ['https://www.googleapis.com/auth/androidpublisher'],
                });
                const androidpublisher = google.androidpublisher({ version: 'v3', auth });
                const edit = await androidpublisher.edits.insert({ packageName });
                const editId = edit.data.id;
                if (!editId) throw new Error('Google Play edit ID was not returned');
                const upload = await androidpublisher.edits.bundles.upload({
                  packageName,
                  editId,
                  media: {
                    mimeType: 'application/octet-stream',
                    body: fs.createReadStream(aabPath),
                  },
                });
                const versionCode = String(upload.data.versionCode || '');
                if (!versionCode) throw new Error('Google Play did not return a versionCode');
                await androidpublisher.edits.tracks.update({
                  packageName,
                  editId,
                  track: 'internal',
                  requestBody: {
                    releases: [{
                      status: 'completed',
                      versionCodes: [versionCode],
                    }],
                  },
                });
                await androidpublisher.edits.commit({ packageName, editId });

                const verifyEdit = await androidpublisher.edits.insert({ packageName });
                const verifyEditId = verifyEdit.data.id;
                if (!verifyEditId) throw new Error('Google Play verification edit ID was not returned');
                try {
                  const track = await androidpublisher.edits.tracks.get({
                    packageName,
                    editId: verifyEditId,
                    track: 'internal',
                  });
                  const releases = track.data.releases || [];
                  const found = releases.some((release) =>
                    (release.versionCodes || []).map(String).includes(versionCode)
                  );
                  if (!found) {
                    throw new Error('Google Play internal track does not contain versionCode ' + versionCode);
                  }
                  console.log('Google Play internal release verified:', versionCode);
                } finally {
                  await androidpublisher.edits.delete({
                    packageName,
                    editId: verifyEditId,
                  }).catch(() => undefined);
                }
              })().catch((error) => {
                console.error(error);
                process.exit(1);
              });
              NODE
            env:
