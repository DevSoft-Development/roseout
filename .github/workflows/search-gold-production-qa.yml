name: Search gold production QA

on:
  push:
    branches:
      - main
    paths:
      - 'app/api/cron/search-gold-production-qa/route.ts'
      - 'lib/search/**'
      - '.github/workflows/search-gold-production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck production gold QA route
        run: npx tsc --noEmit --pretty false

  production-gold-qa:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: us-east-1
          allowed-account-ids: '742020474738'

      - name: Resolve production search ML token
        id: token
        run: |
          set -euo pipefail
          TOKEN="$(aws secretsmanager get-secret-value --secret-id 'theouthaven/production/search-ml/auth-token' --query SecretString --output text)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run exact ten-prompt production QA
        env:
          SEARCH_ML_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          URL="https://www.theouthaven.com/api/cron/search-gold-production-qa?expectedCommit=${GITHUB_SHA}"
          RESPONSE="$RUNNER_TEMP/search-gold-production-qa.json"
          READY=false
          for attempt in $(seq 1 60); do
            CODE="$(curl --max-time 300 --silent --show-error --output "$RESPONSE" --write-out '%{http_code}' --header "Authorization: Bearer $SEARCH_ML_TOKEN" "$URL" || true)"
            DEPLOYMENT_COMMIT="$(python - "$RESPONSE" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1]) as f: data = json.load(f)
              print(data.get('deploymentCommit') or '')
          except Exception: print('')
          PY
          )"
            if [ "$DEPLOYMENT_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Production alias is not serving commit $GITHUB_SHA yet (served=${DEPLOYMENT_COMMIT:-unknown}, HTTP $CODE, attempt $attempt/60)."
              sleep 10
              continue
            fi
            if [ "$CODE" = "200" ]; then READY=true; break; fi
            if [ "$CODE" = "503" ]; then
              echo "Exact ten-prompt production QA failed on the expected deployment."
              cat "$RESPONSE"
              exit 1
            fi
            if [ "$CODE" = "409" ]; then sleep 10; continue; fi
            echo "Waiting for production gold QA route; HTTP $CODE"
            sleep 10
          done
          test "$READY" = "true" || { cat "$RESPONSE" || true; exit 1; }
          python -m json.tool "$RESPONSE"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'search-gold-production-qa.json')
          with open(path) as f: data = json.load(f)
          assert data.get('ok') is True, data
          assert data.get('deploymentCommit') == os.environ['GITHUB_SHA'], data.get('deploymentCommit')
          summary = data.get('summary', {})
          assert summary.get('queryCount') == 10, summary
          assert summary.get('failedCount') == 0, summary
          assert summary.get('maxHfRerankLaneMs', 999999) <= 1400, summary
          print('Search gold production QA passed:', summary)
          PY
