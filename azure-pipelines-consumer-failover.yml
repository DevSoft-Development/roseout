trigger: none
pr: none

schedules:
  - cron: "*/15 * * * *"
    displayName: GitHub Actions circuit monitor
    branches:
      include:
        - main
    always: true

parameters:
  - name: releaseSha
    displayName: Exact Git commit SHA to deploy when failover is active
    type: string
    default: ""
  - name: deploy
    displayName: Deploy when the GitHub Actions circuit is open
    type: boolean
    default: false
  - name: forceFailover
    displayName: Force Azure DevOps failover even if GitHub Actions is healthy
    type: boolean
    default: false
  - name: rolloutRisk
    displayName: Canary rollout risk
    type: string
    default: high
    values:
      - low
      - medium
      - high

variables:
  - name: nodeVersion
    value: '22.x'
  - name: azureServiceConnection
    value: 'TheOutHaven Azure Production'

stages:
  - stage: CircuitBreaker
    displayName: Evaluate GitHub Actions health
    jobs:
      - job: Evaluate
        displayName: Decide primary vs failover control plane
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - bash: |
              set -euo pipefail
              output="$(bash scripts/github-actions-circuit-breaker.sh check)"
              printf '%s\n' "$output"

              state="$(printf '%s\n' "$output" | awk -F= '$1=="GITHUB_CIRCUIT_STATE"{print $2; exit}')"
              reason="$(printf '%s\n' "$output" | awk -F= '$1=="GITHUB_CIRCUIT_REASON"{sub(/^GITHUB_CIRCUIT_REASON=/,""); print; exit}')"

              if [ "$state" != "OPEN" ] && [ "$state" != "CLOSED" ]; then
                echo "Unable to evaluate GitHub Actions circuit breaker safely." >&2
                exit 1
              fi

              force='${{ parameters.forceFailover }}'
              if [ "$force" = "True" ] || [ "$force" = "true" ]; then
                state="OPEN"
                reason="forced_by_operator"
              fi

              echo "##vso[task.setvariable variable=circuitState;isOutput=true]$state"
              echo "##vso[task.setvariable variable=circuitReason;isOutput=true]$reason"

              if [ "$state" = "CLOSED" ]; then
                echo "GitHub Actions is healthy. GitHub remains primary; Azure DevOps will not deploy."
              else
                echo "GitHub Actions circuit is OPEN. Azure DevOps failover is permitted."
              fi
            name: breaker
            displayName: Evaluate circuit breaker

  - stage: Validate
    displayName: Validate failover candidate
    dependsOn: CircuitBreaker
    condition: eq(stageDependencies.CircuitBreaker.Evaluate.outputs['breaker.circuitState'], 'OPEN')
    jobs:
      - job: ValidateCandidate
        displayName: Typecheck, lint, and build
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - bash: |
              set -euo pipefail
              requested='${{ parameters.releaseSha }}'
              if [ -n "$requested" ]; then
                git fetch origin "$requested" --depth=1 || true
                git checkout --detach "$requested"
              fi
              sha="$(git rev-parse HEAD)"
              echo "Validated release SHA: $sha"
              echo "##vso[task.setvariable variable=releaseSha;isOutput=true]$sha"
            name: release
            displayName: Resolve exact release SHA

          - task: UseNode@1
            inputs:
              version: $(nodeVersion)

          - bash: npm ci
            displayName: Install locked dependencies

          - bash: npm run typecheck
            displayName: Typecheck

          - bash: npm run lint
            displayName: Lint

          - bash: npm run build:surface:consumer
            displayName: Build consumer surface
            env:
              NEXT_PUBLIC_SITE_URL: https://theouthaven.com
              NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
              NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
              NEXT_PUBLIC_TURNSTILE_SITE_KEY: dummy_turnstile_site_key
              SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key
              OPENAI_API_KEY: dummy_openai_key
              CRON_SECRET: dummy_cron_secret

  - stage: Deploy
    displayName: Azure production failover deployment
    dependsOn:
      - CircuitBreaker
      - Validate
    condition: and(
      succeeded(),
      eq(stageDependencies.CircuitBreaker.Evaluate.outputs['breaker.circuitState'], 'OPEN'),
      eq('${{ parameters.deploy }}', 'true')
      )
    variables:
      RELEASE_SHA: $[ stageDependencies.Validate.ValidateCandidate.outputs['release.releaseSha'] ]
    jobs:
      - deployment: DeployConsumer
        displayName: Deploy dual-region consumer
        environment: Production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 0

                - task: AzureCLI@2
                  displayName: Validate Azure production access
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az account show --output none
                      az group show --name rg-toh-consumer-production --output none

                - task: AzureCLI@2
                  displayName: Deploy through Azure DevOps failover
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      git fetch origin "$(RELEASE_SHA)" --depth=1 || true
                      git checkout --detach "$(RELEASE_SHA)"

                      export RELEASE_SHA="$(RELEASE_SHA)"
                      export DEPLOY_ENABLED=true
                      export ROLLOUT_RISK='${{ parameters.rolloutRisk }}'
                      export RELEASE_SOURCE=azure-devops
                      export RELEASE_ACTOR=azure-pipelines

                      bash scripts/azure-devops-consumer-failover.sh

  - stage: PrimaryRestored
    displayName: GitHub primary restored
    dependsOn: CircuitBreaker
    condition: eq(stageDependencies.CircuitBreaker.Evaluate.outputs['breaker.circuitState'], 'CLOSED')
    jobs:
      - job: Closed
        displayName: Keep Azure failover idle
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              echo "GitHub Actions circuit is CLOSED."
              echo "Primary CI/CD ownership is GitHub Actions."
              echo "Azure DevOps failover deployment remains idle."
            displayName: Confirm primary ownership
