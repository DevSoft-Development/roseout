name: Operational shard secret rotation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/operational-shard-secret-rotation.yml'
      - '.github/scripts/rotate-operational-shard-keys.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/operational-shard-secret-rotation.yml'
      - '.github/scripts/rotate-operational-shard-keys.sh'
  workflow_dispatch:
    inputs:
      rotation_id:
        description: Stable idempotency label for this rotation
        required: false
        default: 20261006-canary-incident
        type: string

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: operational-shard-control-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  SUPABASE_VAULT_SECRET: /theouthaven/credential-vault/production/supabase
  DR_SECRET: /theouthaven/production/dr-reconciler/env
  RUNTIME_SECRET: /theouthaven/production/edge-runtime/env
  SHARD01_REF: lyeruuzsnceaxrmdafxb
  SHARD01_DR_REF: vcdnwrsuvhtlvxqbkamg
  SHARD02_REF: lpcrikaixcfbqaikevlg
  SHARD02_DR_REF: bjhcxzahgfeniitejtrx
  ROTATION_ID: ${{ inputs.rotation_id || '20261006-canary-incident' }}

jobs:
  validate:
    name: Validate rotation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate script syntax and secret hygiene
        run: |
          set -euo pipefail
          bash -n .github/scripts/rotate-operational-shard-keys.sh
          ! grep -Eq 'sb_secret_[A-Za-z0-9_-]+' .github/scripts/rotate-operational-shard-keys.sh
          ! grep -Eq 'sb_secret_[A-Za-z0-9_-]+' .github/workflows/operational-shard-secret-rotation.yml
          grep -F 'was_compromised=true' .github/scripts/rotate-operational-shard-keys.sh >/dev/null
          grep -F 'shard01SecretKey' .github/scripts/rotate-operational-shard-keys.sh >/dev/null
          grep -F 'operationalShardsJson' .github/scripts/rotate-operational-shard-keys.sh >/dev/null
          grep -F 'aws-credential-vault-runtime-sync.yml/dispatches' .github/scripts/rotate-operational-shard-keys.sh >/dev/null
          grep -F 'OPERATIONAL_SHARDS_JSON' .github/scripts/rotate-operational-shard-keys.sh >/dev/null
          grep -F 'old_keys_revoked' .github/scripts/rotate-operational-shard-keys.sh >/dev/null
          grep -F 'DR_SUPABASE_ACCESS_TOKEN' .github/scripts/rotate-operational-shard-keys.sh >/dev/null
          grep -F 'management_api_request' .github/scripts/rotate-operational-shard-keys.sh >/dev/null

  rotate:
    name: Rotate compromised shard secrets
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Rotate four operational shard keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/rotate-operational-shard-keys.sh
