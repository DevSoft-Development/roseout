name: AWS Batch 10 credential direct probe

on:
  pull_request:
    paths:
      - '.github/workflows/aws-batch10-credential-direct-probe.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-batch10-credential-direct-probe.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-batch10-credential-direct-probe-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  EDGE_STACK_NAME: theouthaven-edge-runtime-production
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_ORG_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VIRGINIA_SUPABASE_HOST: ftdsltatyqhtllyyefzp.supabase.co

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-time Batch 10 safety contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-batch10-credential-direct-probe.yml'
          grep -F 'ftdsltatyqhtllyyefzp.supabase.co' "$FILE" >/dev/null
          grep -F 'VERCEL_ORG_ID:' "$FILE" >/dev/null
          grep -F "current['NEXT_PUBLIC_SUPABASE_URL'] = url" "$FILE" >/dev/null
          grep -F "current['SUPABASE_SERVICE_ROLE_KEY'] = key" "$FILE" >/dev/null
          grep -F 'node:/api/cron/crm-sequence-runner' "$FILE" >/dev/null
          grep -F 'node:/api/cron/search-hf-photo-intelligence' "$FILE" >/dev/null
          python <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/aws-batch10-credential-direct-probe.yml').read_text(encoding='utf-8')
          legacy = 'node:/api/cron/' + 'managed?job=crm-sequence-runner'
          if legacy in text:
              raise SystemExit('Direct-route diagnostic must not use the legacy managed wrapper.')
          PY

  refresh-and-probe:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Pull production environment without logging values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN is required.' >&2; exit 1; }
          mkdir -p .vercel
          jq -n --arg org "$VERCEL_ORG_ID" --arg project "$VERCEL_PROJECT_ID" '{orgId:$org,projectId:$project}' > .vercel/project.json
          ENV_FILE="$RUNNER_TEMP/vercel-production.env"
          npx --yes vercel@59.3.0 env pull "$ENV_FILE" --environment=production --yes --token "$VERCEL_TOKEN" >/dev/null
          test -s "$ENV_FILE"
          chmod 600 "$ENV_FILE"

      - name: Refresh only Virginia Supabase credentials in AWS app environment
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          python -m pip install --disable-pip-version-check -q python-dotenv
          aws secretsmanager get-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --query SecretString \
            --output text > "$RUNNER_TEMP/current-app-env.json"
          chmod 600 "$RUNNER_TEMP/current-app-env.json"

          ENV_FILE="$RUNNER_TEMP/vercel-production.env" \
          CURRENT_JSON="$RUNNER_TEMP/current-app-env.json" \
          OUTPUT_JSON="$RUNNER_TEMP/refreshed-app-env.json" \
          VIRGINIA_SUPABASE_HOST="$VIRGINIA_SUPABASE_HOST" \
          python <<'PY'
          import json
          import os
          from urllib.parse import urlparse
          from dotenv import dotenv_values

          env = {k: v for k, v in dotenv_values(os.environ['ENV_FILE']).items() if isinstance(v, str)}
          url = (env.get('NEXT_PUBLIC_SUPABASE_URL') or '').strip()
          key = (env.get('SUPABASE_SERVICE_ROLE_KEY') or '').strip()
          if not url or not key:
              raise SystemExit('Production environment is missing required Supabase credentials.')
          parsed = urlparse(url)
          if parsed.scheme != 'https' or parsed.hostname != os.environ['VIRGINIA_SUPABASE_HOST']:
              raise SystemExit('Production Supabase URL is not the Virginia primary; refusing refresh.')

          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          if not isinstance(current, dict):
              raise SystemExit('AWS app environment is not a JSON object.')
          current['NEXT_PUBLIC_SUPABASE_URL'] = url
          current['SUPABASE_SERVICE_ROLE_KEY'] = key
          with open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8') as fh:
              json.dump(current, fh, separators=(',', ':'))
          PY

          chmod 600 "$RUNNER_TEMP/refreshed-app-env.json"
          aws secretsmanager put-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --secret-string "file://$RUNNER_TEMP/refreshed-app-env.json" \
            --query VersionId --output text >/dev/null
          rm -f "$RUNNER_TEMP/current-app-env.json" "$RUNNER_TEMP/refreshed-app-env.json" "$RUNNER_TEMP/vercel-production.env"
          echo 'virginia_supabase_credentials_refreshed=true'

      - name: Force private background runtime credential reload
        run: |
          set -euo pipefail
          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN"
          aws lambda get-function-configuration --function-name "$BACKGROUND_FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/original-environment.json"
          jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' "$RUNNER_TEMP/original-environment.json" > "$RUNNER_TEMP/refresh-environment.json"
          aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/refresh-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/original-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          rm -f "$RUNNER_TEMP/background-config.json" "$RUNNER_TEMP/original-environment.json" "$RUNNER_TEMP/refresh-environment.json"

      - name: Prove private Node health then probe Batch 10 routes directly
        run: |
          set -euo pipefail
          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$INVOKER_FN"

          jq -nc '{function:"node:/api/health/background-runtime",body:{}}' > "$RUNNER_TEMP/probe.json"
          aws lambda invoke --function-name "$INVOKER_FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/probe.json" "$RUNNER_TEMP/response.json" >/dev/null
          jq -e '.ok == true and .runtime == "node" and .status == 200 and .response.ok == true and .response.runtime == "aws-background"' "$RUNNER_TEMP/response.json" >/dev/null
          echo 'private_node_health=pass'

          for TARGET in /api/cron/crm-sequence-runner /api/cron/search-hf-photo-intelligence; do
            jq -nc --arg fn "node:${TARGET}" '{function:$fn,body:{}}' > "$RUNNER_TEMP/probe.json"
            if ! aws lambda invoke --function-name "$INVOKER_FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/probe.json" "$RUNNER_TEMP/response.json" >/dev/null; then
              echo "direct_probe_invoke_failed=${TARGET}" >&2
              exit 1
            fi
            if ! jq -e '.ok == true and .runtime == "node" and (.status // 200) < 400 and (.response.success // true) != false and (.response.ok // true) != false' "$RUNNER_TEMP/response.json" >/dev/null; then
              echo "direct_probe_failed=${TARGET}"
              jq -c '{errorType,errorMessage,status,response:(if (.response|type)=="object" then {success:.response.success,ok:.response.ok,error:.response.error,errorCode:.response.errorCode,category:.response.category,runtime:.response.runtime,processed:.response.processed,updated:.response.updated,failed:.response.failed,skipped:.response.skipped} else {type:(.response|type)} end)}' "$RUNNER_TEMP/response.json" || true
              exit 1
            fi
            echo "direct_probe_passed=${TARGET}"
          done

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/probe.json "$RUNNER_TEMP"/response.json "$RUNNER_TEMP"/vercel-production.env "$RUNNER_TEMP"/current-app-env.json "$RUNNER_TEMP"/refreshed-app-env.json
