name: AWS background runtime Supabase key recovery

on:
  pull_request:
    paths:
      - '.github/workflows/aws-background-runtime-key-recovery.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-background-runtime-key-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-background-runtime-key-recovery-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  EDGE_STACK_NAME: theouthaven-edge-runtime-production
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  VIRGINIA_SUPABASE_REF: ftdsltatyqhtllyyefzp
  VIRGINIA_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery safety contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-background-runtime-key-recovery.yml'
          grep -F 'secrets.SUPABASE_ACCESS_TOKEN' "$FILE" >/dev/null
          grep -F 'api-keys?reveal=true' "$FILE" >/dev/null
          grep -F '.name=="service_role"' "$FILE" >/dev/null
          grep -F 'ftdsltatyqhtllyyefzp.supabase.co' "$FILE" >/dev/null
          grep -F 'BACKGROUND_RUNTIME_REFRESH_TOKEN' "$FILE" >/dev/null
          grep -F 'location-search-profile-worker' "$FILE" >/dev/null
          grep -F 'search-phase13-maintenance' "$FILE" >/dev/null

  recover-and-probe:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve current Virginia service-role key without logging it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
          KEYS_FILE="$RUNNER_TEMP/virginia-api-keys.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${VIRGINIA_SUPABASE_REF}/api-keys?reveal=true" > "$KEYS_FILE"
          service_role="$(jq -r '[.[] | select(.type=="legacy" and .name=="service_role" and (.disabled != true))][0].api_key // empty' "$KEYS_FILE")"
          test -n "$service_role" || { echo 'Virginia service-role key unavailable' >&2; exit 1; }
          echo "::add-mask::$service_role"
          printf '%s' "$service_role" > "$RUNNER_TEMP/virginia-service-role"
          chmod 600 "$RUNNER_TEMP/virginia-service-role"
          rm -f "$KEYS_FILE"

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $service_role" \
            --header "Authorization: Bearer $service_role" \
            "${VIRGINIA_SUPABASE_URL}/rest/v1/cron_jobs?select=job_key&limit=1")"
          test "$status" = '200' || { echo "Resolved Virginia service-role key failed validation: HTTP $status" >&2; exit 1; }
          echo 'virginia_service_role_resolved_and_validated=true'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Repair AWS app environment with current Virginia credential
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws secretsmanager get-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --query SecretString \
            --output text > "$RUNNER_TEMP/current-app-env.json"
          chmod 600 "$RUNNER_TEMP/current-app-env.json"

          CURRENT_JSON="$RUNNER_TEMP/current-app-env.json" \
          KEY_FILE="$RUNNER_TEMP/virginia-service-role" \
          OUTPUT_JSON="$RUNNER_TEMP/repaired-app-env.json" \
          VIRGINIA_SUPABASE_URL="$VIRGINIA_SUPABASE_URL" \
          python <<'PY'
          import json
          import os
          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          with open(os.environ['KEY_FILE'], encoding='utf-8') as fh:
              key = fh.read().strip()
          if not isinstance(current, dict) or not key:
              raise SystemExit('AWS app environment recovery input invalid.')
          current['NEXT_PUBLIC_SUPABASE_URL'] = os.environ['VIRGINIA_SUPABASE_URL']
          current['SUPABASE_SERVICE_ROLE_KEY'] = key
          with open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8') as fh:
              json.dump(current, fh, separators=(',', ':'))
          PY
          chmod 600 "$RUNNER_TEMP/repaired-app-env.json"
          aws secretsmanager put-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --secret-string "file://$RUNNER_TEMP/repaired-app-env.json" \
            --query VersionId \
            --output text >/dev/null
          echo 'aws_background_app_env_repaired=true'
          rm -f "$RUNNER_TEMP/current-app-env.json" "$RUNNER_TEMP/repaired-app-env.json"

      - name: Force background runtime credential reload
        run: |
          set -euo pipefail
          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN"
          aws lambda get-function-configuration --function-name "$BACKGROUND_FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/original-environment.json"
          jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' "$RUNNER_TEMP/original-environment.json" > "$RUNNER_TEMP/refresh-environment.json"
          aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/refresh-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/original-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          rm -f "$RUNNER_TEMP/background-config.json" "$RUNNER_TEMP/original-environment.json" "$RUNNER_TEMP/refresh-environment.json"
          echo "background_function=$BACKGROUND_FN" >> "$GITHUB_ENV"

      - name: Verify private health and managed Node cron paths
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/health.json" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"key-recovery"},"requestContext":{"accountId":"key-recovery","apiId":"key-recovery","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"key-recovery","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"01/Sep/2026:00:00:00 +0000","timeEpoch":1788220800000},"isBase64Encoded":false}
          JSON
          aws lambda invoke --function-name "$background_function" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/health.json" "$RUNNER_TEMP/health-response.json" >/dev/null
          jq -e '.statusCode == 200 and (.body | fromjson | .ok == true and .runtime == "aws-background")' "$RUNNER_TEMP/health-response.json" >/dev/null

          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$INVOKER_FN"
          for JOB in location-search-profile-worker search-phase13-maintenance; do
            jq -nc --arg fn "node:/api/cron/managed?job=$JOB" '{function:$fn,body:{}}' > "$RUNNER_TEMP/probe.json"
            passed=0
            for attempt in 1 2 3 4; do
              if aws lambda invoke --function-name "$INVOKER_FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/probe.json" "$RUNNER_TEMP/response.json" >/dev/null 2>"$RUNNER_TEMP/error.txt"; then
                if jq -e '.ok == true and .runtime == "node" and (.status // 200) < 400 and (.response.ok // true) != false and (.response.success // true) != false' "$RUNNER_TEMP/response.json" >/dev/null; then
                  echo "probe_passed=$JOB"
                  passed=1
                  break
                fi
                jq -c '{errorType,errorMessage,status,response_ok:.response.ok,response_success:.response.success,response_error:.response.error}' "$RUNNER_TEMP/response.json" || true
                break
              fi
              if grep -Eq 'TooManyRequestsException|ConcurrentInvocationLimitExceeded|Throttl' "$RUNNER_TEMP/error.txt"; then
                sleep $((attempt * 3))
                continue
              fi
              break
            done
            test "$passed" = '1'
          done

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/virginia-service-role "$RUNNER_TEMP"/virginia-api-keys.json "$RUNNER_TEMP"/response.json "$RUNNER_TEMP"/error.txt
