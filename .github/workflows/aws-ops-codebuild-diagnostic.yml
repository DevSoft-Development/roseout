name: AWS ops CodeBuild diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/aws-ops-codebuild-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-ops-codebuild-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  OPS_STACK: theouthaven-ops-scheduled-runtime-production

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'CodeBuild CloudWatch diagnostic workflow validated'

  diagnose:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Bootstrap read-only CodeBuild log access
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          role_name="${DEPLOY_ROLE_ARN##*/}"
          policy="$RUNNER_TEMP/ops-codebuild-log-read.json"
          cat > "$policy" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[{
              "Effect":"Allow",
              "Action":["logs:GetLogEvents"],
              "Resource":"arn:aws:logs:us-east-1:742020474738:log-group:/aws/codebuild/toh-production-ops-scheduled-runtime:log-stream:*"
            }]
          }
          JSON
          aws iam put-role-policy --role-name "$role_name" --policy-name TheOutHavenOpsCodeBuildDiagnostic --policy-document "file://$policy"
          sleep 8

      - name: Run worker smoke and print CodeBuild failure context
        run: |
          set -euo pipefail
          project="$(aws cloudformation describe-stacks --stack-name "$OPS_STACK" --query "Stacks[0].Outputs[?OutputKey=='CodeBuildProjectName'].OutputValue" --output text)"
          test -n "$project"
          build_id="$(aws codebuild start-build --project-name "$project" --environment-variables-override name=OPS_JOB,value=worker-reliability-soak,type=PLAINTEXT --query 'build.id' --output text)"
          echo "CodeBuild ID: $build_id"
          for attempt in $(seq 1 60); do
            status="$(aws codebuild batch-get-builds --ids "$build_id" --query 'builds[0].buildStatus' --output text)"
            echo "CodeBuild status: $status"
            case "$status" in
              SUCCEEDED) exit 0 ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                aws codebuild batch-get-builds --ids "$build_id" --query 'builds[0].{Status:buildStatus,CurrentPhase:currentPhase,Phases:phases,Logs:logs}' --output json
                group="$(aws codebuild batch-get-builds --ids "$build_id" --query 'builds[0].logs.groupName' --output text)"
                stream="$(aws codebuild batch-get-builds --ids "$build_id" --query 'builds[0].logs.streamName' --output text)"
                echo '--- CodeBuild CloudWatch log ---'
                aws logs get-log-events --log-group-name "$group" --log-stream-name "$stream" --start-from-head --query 'events[].message' --output text || true
                exit 1
                ;;
            esac
            sleep 10
          done
          aws codebuild batch-get-builds --ids "$build_id" --query 'builds[0].{Status:buildStatus,CurrentPhase:currentPhase,Phases:phases,Logs:logs}' --output json
          exit 1
