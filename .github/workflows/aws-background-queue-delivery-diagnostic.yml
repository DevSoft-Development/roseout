name: AWS background queue delivery diagnostic
# Read-only production diagnostic marker: 2026-09-04T17:07Z

on:
  pull_request:
    paths:
      - '.github/workflows/aws-background-queue-delivery-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-background-queue-delivery-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-background-queue-delivery-diagnostic-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  BACKGROUND_CRON_STACK_NAME: theouthaven-background-cron-production
  BACKGROUND_CRON_QUEUE: toh-production-background-cron
  BACKGROUND_CRON_DLQ: toh-production-background-cron-dlq
  BACKGROUND_RUNTIME_FUNCTION: toh-production-background-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only diagnostic contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-background-queue-delivery-diagnostic.yml'
          grep -F 'aws sqs get-queue-attributes' "$FILE" >/dev/null
          grep -F 'aws lambda list-event-source-mappings' "$FILE" >/dev/null
          grep -F 'aws lambda get-event-source-mapping' "$FILE" >/dev/null
          grep -F 'aws lambda get-function-configuration' "$FILE" >/dev/null
          grep -F 'aws lambda get-function-concurrency' "$FILE" >/dev/null
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/aws-background-queue-delivery-diagnostic.yml').read_text()
          forbidden = [
              'receive' + '-message',
              'delete' + '-message',
              'purge' + '-queue',
              'send' + '-message',
              'change' + '-message-visibility',
              'update' + '-event-source-mapping',
              'delete' + '-event-source-mapping',
              'create' + '-event-source-mapping',
          ]
          hits = [token for token in forbidden if ('aws sqs ' + token in text or 'aws lambda ' + token in text)]
          if hits:
              raise SystemExit(f'mutating queue/runtime commands are forbidden in this diagnostic: {hits}')
          PY

  diagnose:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve production queue and worker
        id: targets
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          WORKER="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_CRON_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundCronWorkerFunctionName'].OutputValue" --output text)"
          test -n "$WORKER" && test "$WORKER" != 'None'
          QUEUE_URL="$(aws sqs get-queue-url --queue-name "$BACKGROUND_CRON_QUEUE" --query QueueUrl --output text)"
          DLQ_URL="$(aws sqs get-queue-url --queue-name "$BACKGROUND_CRON_DLQ" --query QueueUrl --output text)"
          QUEUE_ARN="$(aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names QueueArn --query 'Attributes.QueueArn' --output text)"
          test -n "$QUEUE_URL" && test "$QUEUE_URL" != 'None'
          test -n "$DLQ_URL" && test "$DLQ_URL" != 'None'
          test -n "$QUEUE_ARN" && test "$QUEUE_ARN" != 'None'
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"
          echo "queue_url=$QUEUE_URL" >> "$GITHUB_OUTPUT"
          echo "dlq_url=$DLQ_URL" >> "$GITHUB_OUTPUT"
          echo "queue_arn=$QUEUE_ARN" >> "$GITHUB_OUTPUT"

      - name: Read queue and DLQ pressure
        id: queue
        env:
          QUEUE_URL: ${{ steps.targets.outputs.queue_url }}
          DLQ_URL: ${{ steps.targets.outputs.dlq_url }}
        run: |
          set -euo pipefail
          MAIN="$RUNNER_TEMP/background-queue.json"
          DLQ="$RUNNER_TEMP/background-dlq.json"
          aws sqs get-queue-attributes \
            --queue-url "$QUEUE_URL" \
            --attribute-names QueueArn ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed VisibilityTimeout RedrivePolicy \
            --output json > "$MAIN"
          aws sqs get-queue-attributes \
            --queue-url "$DLQ_URL" \
            --attribute-names QueueArn ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed VisibilityTimeout \
            --output json > "$DLQ"
          echo "visible=$(jq -r '.Attributes.ApproximateNumberOfMessages // "0"' "$MAIN")" >> "$GITHUB_OUTPUT"
          echo "inflight=$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible // "0"' "$MAIN")" >> "$GITHUB_OUTPUT"
          echo "delayed=$(jq -r '.Attributes.ApproximateNumberOfMessagesDelayed // "0"' "$MAIN")" >> "$GITHUB_OUTPUT"
          echo "visibility=$(jq -r '.Attributes.VisibilityTimeout // "unknown"' "$MAIN")" >> "$GITHUB_OUTPUT"
          echo "dlq_visible=$(jq -r '.Attributes.ApproximateNumberOfMessages // "0"' "$DLQ")" >> "$GITHUB_OUTPUT"
          echo "dlq_inflight=$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible // "0"' "$DLQ")" >> "$GITHUB_OUTPUT"
          echo "dlq_delayed=$(jq -r '.Attributes.ApproximateNumberOfMessagesDelayed // "0"' "$DLQ")" >> "$GITHUB_OUTPUT"

      - name: Inspect event source mapping
        id: mapping
        env:
          WORKER: ${{ steps.targets.outputs.worker }}
          QUEUE_ARN: ${{ steps.targets.outputs.queue_arn }}
        run: |
          set -euo pipefail
          LIST="$RUNNER_TEMP/event-source-mappings.json"
          DETAIL="$RUNNER_TEMP/event-source-mapping.json"
          aws lambda list-event-source-mappings --function-name "$WORKER" --event-source-arn "$QUEUE_ARN" --output json > "$LIST"
          COUNT="$(jq '.EventSourceMappings | length' "$LIST")"
          test "$COUNT" -eq 1 || { echo "expected exactly one background-cron event source mapping; found $COUNT" >&2; exit 1; }
          UUID="$(jq -r '.EventSourceMappings[0].UUID' "$LIST")"
          aws lambda get-event-source-mapping --uuid "$UUID" --output json > "$DETAIL"
          STATE="$(jq -r '.State // "unknown"' "$DETAIL")"
          LAST_RESULT="$(jq -r '.LastProcessingResult // "unknown"' "$DETAIL")"
          REASON="$(jq -r '.StateTransitionReason // "unknown"' "$DETAIL")"
          MAX_CONCURRENCY="$(jq -r '.ScalingConfig.MaximumConcurrency // "unset"' "$DETAIL")"
          BATCH_SIZE="$(jq -r '.BatchSize // "unknown"' "$DETAIL")"
          BATCH_WINDOW="$(jq -r '.MaximumBatchingWindowInSeconds // "unknown"' "$DETAIL")"
          test "$STATE" = 'Enabled' || { echo "background-cron mapping is not enabled: $STATE ($REASON)" >&2; exit 1; }
          test "$MAX_CONCURRENCY" = '3' || { echo "background-cron max concurrency drifted: $MAX_CONCURRENCY" >&2; exit 1; }
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "last_result=$LAST_RESULT" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "max_concurrency=$MAX_CONCURRENCY" >> "$GITHUB_OUTPUT"
          echo "batch_size=$BATCH_SIZE" >> "$GITHUB_OUTPUT"
          echo "batch_window=$BATCH_WINDOW" >> "$GITHUB_OUTPUT"

      - name: Inspect worker and private runtime health
        id: runtime
        env:
          WORKER: ${{ steps.targets.outputs.worker }}
        run: |
          set -euo pipefail
          WORKER_JSON="$RUNNER_TEMP/background-worker.json"
          RUNTIME_JSON="$RUNNER_TEMP/background-runtime.json"
          aws lambda get-function-configuration --function-name "$WORKER" --output json > "$WORKER_JSON"
          aws lambda get-function-configuration --function-name "$BACKGROUND_RUNTIME_FUNCTION" --output json > "$RUNTIME_JSON"
          WORKER_STATE="$(jq -r '.State // "unknown"' "$WORKER_JSON")"
          WORKER_UPDATE="$(jq -r '.LastUpdateStatus // "unknown"' "$WORKER_JSON")"
          RUNTIME_STATE="$(jq -r '.State // "unknown"' "$RUNTIME_JSON")"
          RUNTIME_UPDATE="$(jq -r '.LastUpdateStatus // "unknown"' "$RUNTIME_JSON")"
          test "$WORKER_STATE" = 'Active' || { echo "background worker is not Active: $WORKER_STATE" >&2; exit 1; }
          test "$WORKER_UPDATE" = 'Successful' || { echo "background worker update status is $WORKER_UPDATE" >&2; exit 1; }
          test "$RUNTIME_STATE" = 'Active' || { echo "private background runtime is not Active: $RUNTIME_STATE" >&2; exit 1; }
          test "$RUNTIME_UPDATE" = 'Successful' || { echo "private background runtime update status is $RUNTIME_UPDATE" >&2; exit 1; }
          WORKER_RESERVED="$(aws lambda get-function-concurrency --function-name "$WORKER" --query ReservedConcurrentExecutions --output text 2>/dev/null || true)"
          RUNTIME_RESERVED="$(aws lambda get-function-concurrency --function-name "$BACKGROUND_RUNTIME_FUNCTION" --query ReservedConcurrentExecutions --output text 2>/dev/null || true)"
          if [ -z "$WORKER_RESERVED" ] || [ "$WORKER_RESERVED" = 'None' ]; then WORKER_RESERVED='unreserved'; fi
          if [ -z "$RUNTIME_RESERVED" ] || [ "$RUNTIME_RESERVED" = 'None' ]; then RUNTIME_RESERVED='unreserved'; fi
          echo "worker_state=$WORKER_STATE" >> "$GITHUB_OUTPUT"
          echo "worker_update=$WORKER_UPDATE" >> "$GITHUB_OUTPUT"
          echo "worker_reserved=$WORKER_RESERVED" >> "$GITHUB_OUTPUT"
          echo "runtime_state=$RUNTIME_STATE" >> "$GITHUB_OUTPUT"
          echo "runtime_update=$RUNTIME_UPDATE" >> "$GITHUB_OUTPUT"
          echo "runtime_reserved=$RUNTIME_RESERVED" >> "$GITHUB_OUTPUT"
          echo "worker_timeout=$(jq -r '.Timeout' "$WORKER_JSON")" >> "$GITHUB_OUTPUT"
          echo "worker_memory=$(jq -r '.MemorySize' "$WORKER_JSON")" >> "$GITHUB_OUTPUT"
          echo "runtime_timeout=$(jq -r '.Timeout' "$RUNTIME_JSON")" >> "$GITHUB_OUTPUT"
          echo "runtime_memory=$(jq -r '.MemorySize' "$RUNTIME_JSON")" >> "$GITHUB_OUTPUT"

      - name: Read queue alarms when permitted
        run: |
          set -euo pipefail
          if aws cloudwatch describe-alarms \
            --alarm-names toh-production-background-cron-oldest-message toh-production-background-cron-dlq-visible toh-production-background-cron-worker-throttles toh-production-background-runtime-throttles \
            --query 'MetricAlarms[].{alarm:AlarmName,state:StateValue,reason:StateReason}' --output table; then
            echo 'CloudWatch alarm state read succeeded.'
          else
            echo 'CloudWatch alarm state read is not permitted for the deploy role; continuing with SQS/Lambda diagnostics.'
          fi

      - name: Report delivery diagnostic
        run: |
          {
            echo '### AWS background queue delivery diagnostic'
            echo ''
            echo 'This workflow is read-only: it does not receive, delete, purge, send, or change message visibility.'
            echo ''
            echo '#### Main queue'
            echo "- Visible: ${{ steps.queue.outputs.visible }}"
            echo "- In flight: ${{ steps.queue.outputs.inflight }}"
            echo "- Delayed: ${{ steps.queue.outputs.delayed }}"
            echo "- Visibility timeout: ${{ steps.queue.outputs.visibility }}s"
            echo ''
            echo '#### DLQ'
            echo "- Visible: ${{ steps.queue.outputs.dlq_visible }}"
            echo "- In flight: ${{ steps.queue.outputs.dlq_inflight }}"
            echo "- Delayed: ${{ steps.queue.outputs.dlq_delayed }}"
            echo ''
            echo '#### Event source mapping'
            echo "- State: ${{ steps.mapping.outputs.state }}"
            echo "- Last processing result: ${{ steps.mapping.outputs.last_result }}"
            echo "- State transition reason: ${{ steps.mapping.outputs.reason }}"
            echo "- Maximum concurrency: ${{ steps.mapping.outputs.max_concurrency }}"
            echo "- Batch size/window: ${{ steps.mapping.outputs.batch_size }} / ${{ steps.mapping.outputs.batch_window }}s"
            echo ''
            echo '#### Lambda health'
            echo "- Worker: ${{ steps.runtime.outputs.worker_state }} / update ${{ steps.runtime.outputs.worker_update }}, reserved concurrency ${{ steps.runtime.outputs.worker_reserved }}, ${{ steps.runtime.outputs.worker_memory }} MB, timeout ${{ steps.runtime.outputs.worker_timeout }}s"
            echo "- Private runtime: ${{ steps.runtime.outputs.runtime_state }} / update ${{ steps.runtime.outputs.runtime_update }}, reserved concurrency ${{ steps.runtime.outputs.runtime_reserved }}, ${{ steps.runtime.outputs.runtime_memory }} MB, timeout ${{ steps.runtime.outputs.runtime_timeout }}s"
          } >> "$GITHUB_STEP_SUMMARY"
