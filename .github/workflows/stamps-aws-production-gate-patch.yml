name: Apply Stamps AWS production gate

on:
  push:
    branches:
      - fix/stamps-aws-production-print-gate
    paths:
      - scripts/dev/apply_stamps_aws_production_gate.py
      - .github/workflows/stamps-aws-production-gate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stamps-aws-production-print-gate
      - name: Apply migration
        run: python scripts/dev/apply_stamps_aws_production_gate.py
      - name: Validate Python
        run: |
          python -m py_compile infra/aws/lambda/platform_integration_api.py
          python -m py_compile infra/aws/lambda/stamps_provider.py
      - name: Validate patch integrity
        run: |
          test ! -e lib/stamps-production-postcard.ts
          grep -q 'production SOAP calls must run through the AWS Integration API' lib/stamps-postcard.ts
          grep -q '/v1/stamps/postcard/production-proof' infra/aws/lambda/platform_integration_api.py
          grep -q 'production-proofs/${id}' 'app/admin/dashboard/operations/mailing-batches/[id]/print/page.tsx'
          git diff --check
      - name: Remove one-time patch files
        run: |
          rm -f scripts/dev/apply_stamps_aws_production_gate.py
          rm -f .github/workflows/stamps-aws-production-gate-patch.yml
      - name: Commit generated migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Move live Stamps proof execution fully to AWS'
          git push origin HEAD:fix/stamps-aws-production-print-gate
