name: Vercel consumer root verify

on:
  push:
    branches:
      - ops/vercel-consumer-root-cutover-2026-09-19
    paths:
      - .github/workflows/vercel-consumer-root-cutover.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel root directory
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
          VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          root="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID" \
            | jq -r '.rootDirectory // ""')"
          echo "rootDirectory=$root"
          test "$root" = "apps/consumer"
