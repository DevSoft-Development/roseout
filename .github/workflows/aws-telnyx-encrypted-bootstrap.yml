name: AWS Telnyx encrypted bootstrap

on:
  pull_request:
    paths:
      - 'app/api/internal/aws-bootstrap/telnyx-secrets/route.ts'
      - '.github/workflows/aws-telnyx-encrypted-bootstrap.yml'
  push:
    branches:
      - main
    paths:
      - 'app/api/internal/aws-bootstrap/telnyx-secrets/route.ts'
      - '.github/workflows/aws-telnyx-encrypted-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: aws-telnyx-encrypted-bootstrap
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  TARGET_ENV: production
  TELNYX_SECRET_NAME: /theouthaven/production/integration-api/telnyx
  BOOTSTRAP_PATH: /api/internal/aws-bootstrap/telnyx-secrets
  BOOTSTRAP_URL: https://www.theouthaven.com/api/internal/aws-bootstrap/telnyx-secrets

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck encrypted bootstrap route
        run: npm run typecheck

  bootstrap:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve bootstrap configuration
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          JOB_GATEWAY_SECRET: ${{ secrets.AWS_PLATFORM_JOB_GATEWAY_SECRET }}
          INTEGRATION_API_SECRET: ${{ secrets.AWS_PLATFORM_INTEGRATION_API_SECRET }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          BOOTSTRAP_SECRET="${JOB_GATEWAY_SECRET:-$INTEGRATION_API_SECRET}"
          test "${#BOOTSTRAP_SECRET}" -ge 32 || { echo "Missing AWS bootstrap HMAC secret" >&2; exit 1; }
          echo "::add-mask::$BOOTSTRAP_SECRET"
          printf '%s' "$BOOTSTRAP_SECRET" > "$RUNNER_TEMP/bootstrap-secret"
          chmod 600 "$RUNNER_TEMP/bootstrap-secret"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity and dedicated secret
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || { echo "Wrong AWS account: $ACCOUNT" >&2; exit 1; }
          aws secretsmanager describe-secret --secret-id "$TELNYX_SECRET_NAME" >/dev/null

      - name: Bootstrap dedicated Telnyx secret if needed
        id: bootstrap
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR" "$RUNNER_TEMP/bootstrap-secret"' EXIT
          EXISTING_FILE="$WORK_DIR/existing.json"
          aws secretsmanager get-secret-value \
            --secret-id "$TELNYX_SECRET_NAME" \
            --query SecretString \
            --output text > "$EXISTING_FILE"

          if jq -e '
            (.channels.concierge.apiKey | strings | length >= 20)
            and (.channels.crm.apiKey | strings | length >= 20)
            and (.channels.reservations.apiKey | strings | length >= 20)
            and (.channels.support.apiKey | strings | length >= 20)
          ' "$EXISTING_FILE" >/dev/null 2>&1; then
            echo "Dedicated Telnyx secret is already authoritative; no Vercel bootstrap needed."
            echo "migrated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PRIVATE_KEY="$WORK_DIR/private.pem"
          PUBLIC_KEY="$WORK_DIR/public.pem"
          REQUEST_BODY="$WORK_DIR/request.json"
          RESPONSE_BODY="$WORK_DIR/response.json"
          CONFIG_FILE="$WORK_DIR/telnyx-config.json"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$PRIVATE_KEY" >/dev/null 2>&1
          openssl pkey -in "$PRIVATE_KEY" -pubout -out "$PUBLIC_KEY" >/dev/null 2>&1
          jq -n --rawfile publicKey "$PUBLIC_KEY" '{publicKey:$publicKey}' > "$REQUEST_BODY"
          BODY="$(cat "$REQUEST_BODY")"
          SECRET="$(cat "$RUNNER_TEMP/bootstrap-secret")"

          SUCCESS=false
          for attempt in $(seq 1 48); do
            TIMESTAMP="$(python - <<'PY'
          import time
          print(int(time.time() * 1000))
          PY
            )"
            SIGNATURE="$(SECRET="$SECRET" TIMESTAMP="$TIMESTAMP" BODY="$BODY" BOOTSTRAP_PATH="$BOOTSTRAP_PATH" python - <<'PY'
          import hashlib, hmac, os
          canonical = '\n'.join([
              os.environ['TIMESTAMP'],
              'POST',
              os.environ['BOOTSTRAP_PATH'],
              os.environ['BODY'],
          ])
          print(hmac.new(os.environ['SECRET'].encode(), canonical.encode(), hashlib.sha256).hexdigest())
          PY
            )"
            HTTP_STATUS="$(curl --silent --show-error \
              --max-time 20 \
              --request POST \
              --header 'content-type: application/json' \
              --header "x-toh-timestamp: $TIMESTAMP" \
              --header "x-toh-signature: $SIGNATURE" \
              --data "$BODY" \
              --output "$RESPONSE_BODY" \
              --write-out '%{http_code}' \
              "$BOOTSTRAP_URL" || true)"
            if [ "$HTTP_STATUS" = "200" ] && jq -e '
              .ok == true
              and (.channels.concierge | strings | length > 0)
              and (.channels.crm | strings | length > 0)
              and (.channels.reservations | strings | length > 0)
              and (.channels.support | strings | length > 0)
            ' "$RESPONSE_BODY" >/dev/null 2>&1; then
              SUCCESS=true
              break
            fi
            sleep 10
          done
          test "$SUCCESS" = "true" || { echo "Encrypted Telnyx bootstrap route did not become ready" >&2; exit 1; }

          decrypt_channel() {
            local channel="$1"
            local required="$2"
            local cipher_file="$WORK_DIR/${channel}.cipher"
            local plain_file="$WORK_DIR/${channel}.plain"
            local ciphertext
            ciphertext="$(jq -r --arg channel "$channel" '.channels[$channel] // empty' "$RESPONSE_BODY")"
            if [ -z "$ciphertext" ]; then
              if [ "$required" = "true" ]; then
                echo "Encrypted bootstrap response is missing required channel: $channel" >&2
                exit 1
              fi
              printf ''
              return
            fi
            printf '%s' "$ciphertext" | base64 --decode > "$cipher_file"
            openssl pkeyutl -decrypt \
              -inkey "$PRIVATE_KEY" \
              -in "$cipher_file" \
              -out "$plain_file" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -pkeyopt rsa_mgf1_md:sha256
            local value
            value="$(cat "$plain_file")"
            test "${#value}" -ge 20 || { echo "Decrypted Telnyx key is invalid for $channel" >&2; exit 1; }
            echo "::add-mask::$value" >&2
            printf '%s' "$value"
          }

          CONCIERGE_KEY="$(decrypt_channel concierge true)"
          CRM_KEY="$(decrypt_channel crm true)"
          RESERVATIONS_KEY="$(decrypt_channel reservations true)"
          SUPPORT_KEY="$(decrypt_channel support true)"
          MARKETING_KEY="$(decrypt_channel marketing false)"

          jq -n \
            --arg conciergeKey "$CONCIERGE_KEY" \
            --arg crmKey "$CRM_KEY" \
            --arg reservationsKey "$RESERVATIONS_KEY" \
            --arg supportKey "$SUPPORT_KEY" \
            --arg marketingKey "$MARKETING_KEY" \
            '{version:1,channels:{
              concierge:{apiKey:$conciergeKey,from:"+15162000411"},
              crm:{apiKey:$crmKey,from:"+15162000701"},
              reservations:{apiKey:$reservationsKey,from:"+15162000601"},
              support:{apiKey:$supportKey,from:"+15162000801"}
            }}
            | if ($marketingKey|length) >= 20
              then .channels.marketing={apiKey:$marketingKey,from:"+15162000501"}
              else .
              end' > "$CONFIG_FILE"
          jq -e '
            (.channels.concierge.apiKey | strings | length >= 20)
            and (.channels.crm.apiKey | strings | length >= 20)
            and (.channels.reservations.apiKey | strings | length >= 20)
            and (.channels.support.apiKey | strings | length >= 20)
          ' "$CONFIG_FILE" >/dev/null

          aws secretsmanager put-secret-value \
            --secret-id "$TELNYX_SECRET_NAME" \
            --secret-string "file://$CONFIG_FILE" >/dev/null
          echo "migrated=true" >> "$GITHUB_OUTPUT"
          unset SECRET CONCIERGE_KEY CRM_KEY RESERVATIONS_KEY SUPPORT_KEY MARKETING_KEY BODY

      - name: Dispatch normal Integration API deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run aws-integration-api.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f environment=production \
            -f deploy=true
          echo "Dispatched normal AWS Integration API deployment after Telnyx secret bootstrap."

      - name: Write bootstrap summary
        run: |
          {
            echo "### Telnyx encrypted bootstrap"
            echo "- Dedicated secret: $TELNYX_SECRET_NAME"
            echo "- Vercel plaintext exposure: none"
            echo "- Encryption: per-channel RSA-OAEP SHA-256 with ephemeral runner key"
            echo "- Required channels: concierge, CRM, reservations, support"
            echo "- Migrated this run: ${{ steps.bootstrap.outputs.migrated }}"
            echo "- Follow-up: normal Integration API deployment dispatched"
          } >> "$GITHUB_STEP_SUMMARY"
