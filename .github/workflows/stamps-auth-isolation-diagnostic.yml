name: Stamps auth isolation diagnostic

on:
  push:
    branches:
      - fix/stamps-credential-test-diagnostic
    paths:
      - '.github/workflows/stamps-auth-isolation-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: '742020474738'
    steps:
      - uses: actions/checkout@v4
      - id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          INTEGRATION_API_SECRET: ${{ secrets.AWS_PLATFORM_INTEGRATION_API_SECRET }}
          JOB_GATEWAY_SECRET: ${{ secrets.AWS_PLATFORM_JOB_GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          echo "role_arn=${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}" >> "$GITHUB_OUTPUT"
          SHARED_SECRET="${INTEGRATION_API_SECRET:-$JOB_GATEWAY_SECRET}"
          test -n "$SHARED_SECRET"
          echo "::add-mask::$SHARED_SECRET"
          printf '%s' "$SHARED_SECRET" > "$RUNNER_TEMP/integration-api-secret"
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Isolate authentication failure safely
        run: |
          set -euo pipefail
          SECRET_ID='/theouthaven/credential-vault/production/stamps'
          SECRET_FILE="$RUNNER_TEMP/stamps-secret.json"
          aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text > "$SECRET_FILE"
          for key in integrationId username password; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' "$SECRET_FILE")"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
          STAMPS_SECRET_FILE="$SECRET_FILE" python - <<'PY'
          import html, json, os, urllib.error, urllib.request, xml.etree.ElementTree as ET
          endpoint='https://swsim.stamps.com/swsim/swsimv160.asmx'
          namespace='http://stamps.com/xml/namespace/2026/06/swsim/SwsimV160'
          with open(os.environ['STAMPS_SECRET_FILE'], encoding='utf-8') as handle:
              secret=json.load(handle)
          username=str(secret.get('username') or '')
          integration_id=str(secret.get('integrationId') or '')
          password=str(secret.get('password') or '')
          print('configured_fields=' + ','.join(k for k in ('integrationId','username','password') if str(secret.get(k) or '').strip()))
          print('username_looks_like_email=' + str('@' in username).lower())
          def esc(v): return html.escape(str(v or ''), quote=True)
          def call(operation):
              body=(
                  '<?xml version="1.0" encoding="utf-8"?>'
                  f'<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:sws="{namespace}">'
                  f'<soapenv:Header/><soapenv:Body><sws:{operation}><sws:Credentials>'
                  f'<sws:IntegrationID>{esc(integration_id)}</sws:IntegrationID>'
                  f'<sws:Username>{esc(username)}</sws:Username>'
                  f'<sws:Password>{esc(password)}</sws:Password>'
                  f'</sws:Credentials></sws:{operation}></soapenv:Body></soapenv:Envelope>'
              ).encode('utf-8')
              req=urllib.request.Request(endpoint,data=body,method='POST',headers={'Content-Type':'text/xml; charset=utf-8','SOAPAction':f'"{namespace}/{operation}"','User-Agent':'TheOutHaven/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      status=r.status; payload=r.read(500000)
              except urllib.error.HTTPError as exc:
                  status=exc.code; payload=exc.read(500000)
              text=payload.decode('utf-8',errors='replace')
              fault='none'
              try:
                  root=ET.fromstring(text)
                  for elem in root.iter():
                      if elem.tag.split('}',1)[-1].lower() == 'faultstring' and (elem.text or '').strip():
                          value=' '.join((elem.text or '').split())
                          fault='authentication_failed' if value.lower() == 'authentication failed.' else 'other_fault'
                          break
              except ET.ParseError:
                  fault='unparseable_xml'
              print(f'{operation.lower()}_http_status={status}')
              print(f'{operation.lower()}_fault={fault}')
          call('AuthenticateUser')
          call('GetAccountInfo')
          PY

          STACK='theouthaven-integration-api-production'
          API_URL="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiUrl'].OutputValue" --output text)"
          SHARED_SECRET="$(cat "$RUNNER_TEMP/integration-api-secret")"
          PATH_VALUE='/v1/stamps/connection-test'
          BODY_VALUE='{}'
          TIMESTAMP="$(python - <<'PY'
          import time
          print(int(time.time() * 1000))
          PY
          )"
          SIGNATURE="$(SECRET="$SHARED_SECRET" TIMESTAMP="$TIMESTAMP" PATH_VALUE="$PATH_VALUE" BODY_VALUE="$BODY_VALUE" python - <<'PY'
          import hashlib, hmac, os
          canonical='\n'.join([os.environ['TIMESTAMP'],'POST',os.environ['PATH_VALUE'],os.environ['BODY_VALUE']])
          print(hmac.new(os.environ['SECRET'].encode(), canonical.encode(), hashlib.sha256).hexdigest())
          PY
          )"
          HTTP_STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/stamps-connection.json" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header "x-toh-timestamp: $TIMESTAMP" \
            --header "x-toh-signature: $SIGNATURE" \
            --data "$BODY_VALUE" \
            "${API_URL%/}$PATH_VALUE")"
          echo "integration_connection_http_status=$HTTP_STATUS"
          echo "integration_connection_ok=$(jq -r '.ok // false' "$RUNNER_TEMP/stamps-connection.json" 2>/dev/null || echo false)"
          ERROR_CODE="$(jq -r '.error // empty' "$RUNNER_TEMP/stamps-connection.json" 2>/dev/null || true)"
          if [ -n "$ERROR_CODE" ]; then
            case "$ERROR_CODE" in stamps_*) echo "integration_connection_error=$ERROR_CODE" ;; *) echo 'integration_connection_error=other' ;; esac
          fi
          rm -f "$SECRET_FILE" "$RUNNER_TEMP/integration-api-secret" "$RUNNER_TEMP/stamps-connection.json"
