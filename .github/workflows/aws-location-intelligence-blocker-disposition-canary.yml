name: AWS Location Intelligence blocker disposition canary

on:
  pull_request:
    paths:
      - '.github/workflows/aws-location-intelligence-blocker-disposition-canary.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-location-intelligence-blocker-disposition-canary.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-location-intelligence-blocker-disposition-canary-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  EDGE_STACK_NAME: theouthaven-edge-runtime-production
  SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  SUPABASE_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role
  CLEANUP_TARGET: /api/cron/managed?job=location-intelligence-cleanup-worker
  OSSWALD_ID: 05390800-8ff0-46c4-be48-b57084971c23
  ROOFTOP_ID: 1e52cb77-b635-4c33-91d3-7923d012886c
  ROOFTOP_REVIEW_MATCH_ID: f46b1c09-47ee-4377-bebf-ab47317b5c95

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact blocker disposition contract
        run: |
          set -euo pipefail
          FILE=.github/workflows/aws-location-intelligence-blocker-disposition-canary.yml
          grep -F 'sqs:background-cron' "$FILE" >/dev/null
          grep -F '/api/cron/managed?job=location-intelligence-cleanup-worker' "$FILE" >/dev/null
          grep -F 'quality_status == "needs_review"' "$FILE" >/dev/null
          grep -F 'duplicate_status == "possible_duplicate"' "$FILE" >/dev/null
          grep -F 'googleCallsPerformed == 0' "$FILE" >/dev/null
          grep -F 'Guarded unique backlog must reach zero' "$FILE" >/dev/null
          grep -F 'status == "pending"' "$FILE" >/dev/null

  execute:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve scheduler invoker and Virginia credential
        id: runtime
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          INVOKER="$(aws cloudformation describe-stacks \
            --stack-name "$EDGE_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" \
            --output text)"
          test -n "$INVOKER" && test "$INVOKER" != 'None'
          aws lambda get-function --function-name "$INVOKER" >/dev/null

          KEY_FILE="$RUNNER_TEMP/virginia-service-role"
          aws secretsmanager get-secret-value \
            --secret-id "$SUPABASE_SERVICE_ROLE_SECRET" \
            --query SecretString \
            --output text > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          test -n "$SERVICE_ROLE"
          echo "::add-mask::$SERVICE_ROLE"
          echo "invoker=$INVOKER" >> "$GITHUB_OUTPUT"
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"

      - name: Prove only the two guarded unique blockers remain
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
        run: |
          set -euo pipefail
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          ROWS="$RUNNER_TEMP/blockers-before.json"
          curl --silent --show-error --fail \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            "${SUPABASE_URL}/rest/v1/locations?select=id,quality_status,data_status,publish_ready,is_searchable,duplicate_status,duplicate_of&id=in.(${OSSWALD_ID},${ROOFTOP_ID})" > "$ROWS"
          jq -e --arg id "$OSSWALD_ID" '.[] | select(.id == $id) | .quality_status == "publish_ready" and .is_searchable == false and .duplicate_status == "unique" and .duplicate_of == null' "$ROWS" >/dev/null
          jq -e --arg id "$ROOFTOP_ID" '.[] | select(.id == $id) | .quality_status == "publish_ready" and .is_searchable == false and .duplicate_status == "unique" and .duplicate_of == null' "$ROWS" >/dev/null

          HEADERS="$RUNNER_TEMP/unique-before.headers"
          curl --silent --show-error --fail \
            --dump-header "$HEADERS" \
            --output /dev/null \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --header 'Prefer: count=exact' \
            "${SUPABASE_URL}/rest/v1/locations?select=id&quality_status=eq.publish_ready&is_searchable=eq.false&duplicate_status=eq.unique&is_hidden=eq.false&active=eq.true&is_low_level=eq.false&deleted_at=is.null&duplicate_of=is.null&limit=1"
          COUNT="$(awk -F'/' 'tolower($1) ~ /^content-range:/ {gsub("\r", "", $2); print $2}' "$HEADERS" | tail -1)"
          test "$COUNT" = '2' || { echo "Expected exactly two guarded unique blockers before canary; found $COUNT" >&2; exit 1; }

      - name: Enqueue exact blocker cleanup through AWS scheduler invoker
        id: enqueue
        env:
          INVOKER: ${{ steps.runtime.outputs.invoker }}
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          REQUEST="$RUNNER_TEMP/blocker-disposition-request.json"
          RESPONSE="$RUNNER_TEMP/blocker-disposition-response.json"
          jq -nc --arg target "$CLEANUP_TARGET" '{function:"sqs:background-cron",body:{target:$target,payload:{}}}' > "$REQUEST"
          aws lambda invoke \
            --function-name "$INVOKER" \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$REQUEST" \
            "$RESPONSE" >/dev/null
          jq -e --arg target "$CLEANUP_TARGET" '.ok == true and .runtime == "sqs" and .queue == "background-cron" and .target == $target and (.messageId | type == "string")' "$RESPONSE" >/dev/null

      - name: Verify exact terminal dispositions
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
        run: |
          set -euo pipefail
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          OK=0
          for attempt in $(seq 1 24); do
            ROWS="$RUNNER_TEMP/blockers-after-${attempt}.json"
            curl --silent --show-error --fail \
              --header "apikey: $SERVICE_ROLE" \
              --header "Authorization: Bearer $SERVICE_ROLE" \
              "${SUPABASE_URL}/rest/v1/locations?select=id,quality_status,data_status,publish_ready,is_searchable,duplicate_status,duplicate_of&id=in.(${OSSWALD_ID},${ROOFTOP_ID})" > "$ROWS"

            if jq -e --arg id "$OSSWALD_ID" '.[] | select(.id == $id) | .quality_status == "needs_review" and .data_status == "needs_review" and .publish_ready == false and .is_searchable == false and .duplicate_status == "unique" and .duplicate_of == null' "$ROWS" >/dev/null \
              && jq -e --arg id "$ROOFTOP_ID" '.[] | select(.id == $id) | .quality_status == "publish_ready" and .is_searchable == false and .duplicate_status == "possible_duplicate" and .duplicate_of == null' "$ROWS" >/dev/null; then
              OK=1
              break
            fi
            sleep 5
          done
          test "$OK" = '1' || { echo 'Exact blocker terminal states were not reached.' >&2; cat "$ROWS" >&2; exit 1; }

      - name: Verify pending rooftop review pair
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
        run: |
          set -euo pipefail
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          REVIEWS="$RUNNER_TEMP/rooftop-review.json"
          curl --silent --show-error --fail --get \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --data-urlencode 'select=location_a_id,location_b_id,status' \
            --data-urlencode 'status=eq.pending' \
            --data-urlencode "or=(location_a_id.eq.${ROOFTOP_ID},location_b_id.eq.${ROOFTOP_ID})" \
            "${SUPABASE_URL}/rest/v1/location_duplicate_review" > "$REVIEWS"
          jq -e --arg a "$ROOFTOP_ID" --arg b "$ROOFTOP_REVIEW_MATCH_ID" '.[] | select(((.location_a_id == $a and .location_b_id == $b) or (.location_a_id == $b and .location_b_id == $a)) and .status == "pending")' "$REVIEWS" >/dev/null

      - name: Verify worker outcome and zero guarded unique backlog
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
          STARTED_AT: ${{ steps.enqueue.outputs.started_at }}
        run: |
          set -euo pipefail
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          RUNS="$RUNNER_TEMP/cleanup-runs.json"
          FOUND=0
          for attempt in $(seq 1 18); do
            curl --silent --show-error --fail --get \
              --header "apikey: $SERVICE_ROLE" \
              --header "Authorization: Bearer $SERVICE_ROLE" \
              --data-urlencode 'select=status,started_at,details' \
              --data-urlencode 'job_key=eq.location-intelligence-cleanup-worker' \
              --data-urlencode "started_at=gte.${STARTED_AT}" \
              --data-urlencode 'order=started_at.desc' \
              --data-urlencode 'limit=1' \
              "${SUPABASE_URL}/rest/v1/cron_job_runs" > "$RUNS"
            if jq -e 'length == 1 and .[0].status == "success" and .[0].details.googleCallsPerformed == 0 and .[0].details.failed == 0 and .[0].details.dispositionedToReview == 2' "$RUNS" >/dev/null; then
              FOUND=1
              break
            fi
            sleep 5
          done
          test "$FOUND" = '1' || { echo 'Expected successful cleanup worker outcome with two review dispositions and zero Google calls.' >&2; cat "$RUNS" >&2; exit 1; }

          HEADERS="$RUNNER_TEMP/unique-after.headers"
          curl --silent --show-error --fail \
            --dump-header "$HEADERS" \
            --output /dev/null \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --header 'Prefer: count=exact' \
            "${SUPABASE_URL}/rest/v1/locations?select=id&quality_status=eq.publish_ready&is_searchable=eq.false&duplicate_status=eq.unique&is_hidden=eq.false&active=eq.true&is_low_level=eq.false&deleted_at=is.null&duplicate_of=is.null&limit=1"
          COUNT="$(awk -F'/' 'tolower($1) ~ /^content-range:/ {gsub("\r", "", $2); print $2}' "$HEADERS" | tail -1)"
          test "$COUNT" = '0' || { echo "Guarded unique backlog must reach zero; found $COUNT" >&2; exit 1; }

      - name: Cleanup credential file
        if: always()
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
        run: rm -f "$KEY_FILE"

      - name: Summary
        if: always()
        run: |
          {
            echo '### AWS Location Intelligence blocker disposition canary'
            echo ''
            echo '- Execution: central AWS scheduler invoker → background SQS → private AWS background runtime'
            echo '- Osswald NYC: expected profile review disposition, remains non-searchable'
            echo '- 230 Fifth Rooftop Bar: expected duplicate-review disposition, remains non-searchable'
            echo '- Guarded unique retry backlog: expected 0'
            echo '- Google calls: expected 0'
            echo '- Destructive merges: forbidden; both target rows must retain duplicate_of=null'
          } >> "$GITHUB_STEP_SUMMARY"
