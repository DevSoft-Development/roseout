name: One-shot menu v2 selector fix

on:
  push:
    branches: [fix/location-intelligence-menu-v2-selector]
    paths:
      - '.github/workflows/one-shot-menu-v2-selector-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-intelligence-menu-v2-selector
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch menu candidate selector
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/unified-location-gap-repair/index.ts')
          s = path.read_text()

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'expected source fragment not found: {old!r}')
              s = s.replace(old, new, 1)

          replace_once('const MAX_MENU_CONTENT_LIMIT = 5;', 'const MAX_MENU_CONTENT_LIMIT = 10;')
          replace_once(
              '    { data: menuRows, error: menuError },\n  ] = await Promise.all([',
              '    { data: menuRows, error: menuError },\n    { data: menuIntelligenceRows, error: menuIntelligenceError },\n  ] = await Promise.all([',
          )

          needle = '      .limit(Math.max(menuDiscoveryLimit * 6, menuDiscoveryLimit)),\n  ]);'
          replacement = '''      .limit(Math.max(menuDiscoveryLimit * 6, menuDiscoveryLimit)),
            supabase.from("locations")
              .select(selectFields)
              .is("deleted_at", null)
              .eq("location_type", "restaurant")
              .not("website", "is", null)
              .not("menu_url", "is", null)
              .or(`menu_intelligence_version.is.null,menu_intelligence_version.neq.${MENU_INTELLIGENCE_VERSION}`)
              .order("menu_intelligence_checked_at", { ascending: true, nullsFirst: true })
              .limit(Math.max(menuDiscoveryLimit * 6, menuDiscoveryLimit)),
          ]);'''
          replace_once(needle, replacement)

          replace_once(
              '  if (identityError || cachedError || backlogError || menuError) return json({ error: (identityError || cachedError || backlogError || menuError)?.message || "Failed to load repair candidates" }, 500);',
              '  if (identityError || cachedError || backlogError || menuError || menuIntelligenceError) return json({ error: (identityError || cachedError || backlogError || menuError || menuIntelligenceError)?.message || "Failed to load repair candidates" }, 500);',
          )
          replace_once(
              '  const menuCandidates = (menuRows || [])\n    .filter((row: any) => row.is_demo !== true && menuDue(row, now.getTime()))',
              '  const menuCandidates = [...(menuIntelligenceRows || []), ...(menuRows || [])]\n    .filter((row: any, index, all) => all.findIndex((candidate: any) => candidate.id === row.id) === index)\n    .filter((row: any) => row.is_demo !== true && menuDue(row, now.getTime()))',
          )
          path.write_text(s)
          PY
          grep -F 'const MAX_MENU_CONTENT_LIMIT = 10;' supabase/functions/unified-location-gap-repair/index.ts >/dev/null
          grep -F 'menuIntelligenceRows' supabase/functions/unified-location-gap-repair/index.ts >/dev/null
          grep -F 'menu_intelligence_version.neq.${MENU_INTELLIGENCE_VERSION}' supabase/functions/unified-location-gap-repair/index.ts >/dev/null
          grep -F 'all.findIndex((candidate: any) => candidate.id === row.id) === index' supabase/functions/unified-location-gap-repair/index.ts >/dev/null
      - name: Validate focused code
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
      - name: Commit patch and remove runner
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-menu-v2-selector-fix.yml
          git config user.name 'roseoutllc'
          git config user.email 'nick@roseout.com'
          git add supabase/functions/unified-location-gap-repair/index.ts .github/workflows/one-shot-menu-v2-selector-fix.yml
          git commit -m 'fix: prevent menu v2 backfill starvation'
          git push origin HEAD:fix/location-intelligence-menu-v2-selector
