name: Admin dashboard hardening audit

on:
  pull_request:
    paths:
      - 'app/admin/**'
      - 'app/api/admin/**'
      - 'components/admin/**'
      - 'lib/admin-*.ts'
      - 'scripts/audit-admin-dashboard.mjs'
      - 'scripts/audit-admin-demo-boundaries.mjs'
      - 'scripts/audit-admin-dashboard-security.mjs'
      - 'scripts/audit-admin-careers-pii.mjs'
      - 'scripts/audit-admin-beta-pii.mjs'
      - 'scripts/audit-admin-giveaway-pii.mjs'
      - 'scripts/audit-admin-business-crm-pii.mjs'
      - 'scripts/audit-admin-marketing-pii.mjs'
      - 'scripts/audit-admin-promo-code-pii.mjs'
      - 'scripts/audit-admin-ops-batch-a-pii.mjs'
      - 'scripts/audit-admin-location-batch-b-pii.mjs'
      - 'scripts/audit-admin-identity-batch-c-pii.mjs'
      - 'scripts/audit-admin-content-batch-d-pii.mjs'
      - 'scripts/audit-admin-search-batch-e-pii.mjs'
      - 'scripts/audit-admin-search-batch-f-pii.mjs'
      - 'scripts/audit-admin-ops-ml-batch-g-pii.mjs'
      - 'scripts/audit-admin-seo-batch-h-pii.mjs'
      - '.github/workflows/admin-dashboard-hardening-audit.yml'
  push:
    branches: [main]
    paths:
      - 'app/admin/**'
      - 'app/api/admin/**'
      - 'components/admin/**'
      - 'lib/admin-*.ts'
      - 'scripts/audit-admin-dashboard.mjs'
      - 'scripts/audit-admin-demo-boundaries.mjs'
      - 'scripts/audit-admin-dashboard-security.mjs'
      - 'scripts/audit-admin-careers-pii.mjs'
      - 'scripts/audit-admin-beta-pii.mjs'
      - 'scripts/audit-admin-giveaway-pii.mjs'
      - 'scripts/audit-admin-business-crm-pii.mjs'
      - 'scripts/audit-admin-marketing-pii.mjs'
      - 'scripts/audit-admin-promo-code-pii.mjs'
      - 'scripts/audit-admin-ops-batch-a-pii.mjs'
      - 'scripts/audit-admin-location-batch-b-pii.mjs'
      - 'scripts/audit-admin-identity-batch-c-pii.mjs'
      - 'scripts/audit-admin-content-batch-d-pii.mjs'
      - 'scripts/audit-admin-search-batch-e-pii.mjs'
      - 'scripts/audit-admin-search-batch-f-pii.mjs'
      - 'scripts/audit-admin-ops-ml-batch-g-pii.mjs'
      - 'scripts/audit-admin-seo-batch-h-pii.mjs'
      - '.github/workflows/admin-dashboard-hardening-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit admin routes
        run: node scripts/audit-admin-dashboard.mjs
      - name: Audit admin demo boundaries
        run: node scripts/audit-admin-demo-boundaries.mjs
      - name: Audit admin auth, IDOR, and service-role boundaries
        run: node scripts/audit-admin-dashboard-security.mjs
      - name: Audit careers PII and mutation boundaries
        run: node scripts/audit-admin-careers-pii.mjs
      - name: Audit beta PII and mutation boundaries
        run: node scripts/audit-admin-beta-pii.mjs
      - name: Audit giveaway PII and mutation boundaries
        run: node scripts/audit-admin-giveaway-pii.mjs
      - name: Audit business CRM PII and mutation boundaries
        run: node scripts/audit-admin-business-crm-pii.mjs
      - name: Audit marketing PII and mutation boundaries
        run: node scripts/audit-admin-marketing-pii.mjs
      - name: Audit promo code PII and mutation boundaries
        run: node scripts/audit-admin-promo-code-pii.mjs
      - name: Audit ops batch A PII and mutation boundaries
        run: node scripts/audit-admin-ops-batch-a-pii.mjs
      - name: Audit location batch B PII and mutation boundaries
        run: node scripts/audit-admin-location-batch-b-pii.mjs
      - name: Audit identity batch C PII and mutation boundaries
        run: node scripts/audit-admin-identity-batch-c-pii.mjs
      - name: Audit content batch D PII and mutation boundaries
        run: node scripts/audit-admin-content-batch-d-pii.mjs
      - name: Audit search batch E PII and mutation boundaries
        run: node scripts/audit-admin-search-batch-e-pii.mjs
      - name: Audit search batch F PII and mutation boundaries
        run: node scripts/audit-admin-search-batch-f-pii.mjs
      - name: Audit ops and ML batch G PII and mutation boundaries
        run: node scripts/audit-admin-ops-ml-batch-g-pii.mjs
      - name: Audit SEO batch H PII and mutation boundaries
        run: node scripts/audit-admin-seo-batch-h-pii.mjs
