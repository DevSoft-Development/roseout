name: Oregon DR fail-closed state diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/oregon-dr-failclosed-state-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oregon-dr-failclosed-state-diagnostic.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: oregon-dr-failclosed-state-diagnostic-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  SCHEDULE_GROUP: toh-production-edge-runtime
  RUNTIME_SECRET_NAME: /theouthaven/production/edge-runtime/env
  DR_SECRET_NAME: /theouthaven/production/dr-reconciler/env
  VIRGINIA_REF: ftdsltatyqhtllyyefzp
  VIRGINIA_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  OREGON_REF: hnhbzynoyrhjndefbwkh
  OREGON_URL: https://hnhbzynoyrhjndefbwkh.supabase.co
  FORWARD_PUBLICATION: theouthaven_dr_publication
  FORWARD_SUBSCRIPTION: theouthaven_va_to_or_dr
  FORWARD_SLOT: theouthaven_va_to_or_dr_slot
  REVERSE_PUBLICATION: theouthaven_failback_publication
  REVERSE_SUBSCRIPTION: theouthaven_or_to_va_failback
  REVERSE_SLOT: theouthaven_or_to_va_failback_slot
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only diagnostic contract
        run: |
          set -euo pipefail
          grep -F 'state_classification=' .github/workflows/oregon-dr-failclosed-state-diagnostic.yml >/dev/null
          grep -F 'database/query' .github/workflows/oregon-dr-failclosed-state-diagnostic.yml >/dev/null
          ! grep -E 'update-schedule|put-secret-value|alter role|alter subscription|drop subscription|create subscription|request POST.*env\?upsert|request PATCH|request DELETE' .github/workflows/oregon-dr-failclosed-state-diagnostic.yml >/dev/null

  diagnose:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Classify exact production DR state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${VERCEL_TOKEN:-}"

          query_ref() {
            local ref="$1" sql="$2" out="$3"
            jq -n --arg query "$sql" '{query:$query}' > "$RUNNER_TEMP/query.json"
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/query.json" \
              "https://api.supabase.com/v1/projects/${ref}/database/query" > "$out"
            jq -e 'type=="array" and length==1' "$out" >/dev/null
          }

          classify_url() {
            case "$1" in
              "$VIRGINIA_URL") printf '%s' virginia ;;
              "$OREGON_URL") printf '%s' oregon ;;
              '') printf '%s' missing ;;
              *) printf '%s' other ;;
            esac
          }

          aws secretsmanager get-secret-value --secret-id "$DR_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/dr.json"
          aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/runtime.json"
          dr_mode="$(jq -r '.DR_MODE // "missing"' "$RUNNER_TEMP/dr.json")"
          runtime_target="$(classify_url "$(jq -r '.SUPABASE_URL // empty' "$RUNNER_TEMP/runtime.json")")"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}&decrypt=true" > "$RUNNER_TEMP/vercel.json"
          env_id="$(jq -r '[.envs[]|select(.key=="NEXT_PUBLIC_SUPABASE_URL" and (.target|index("production"))!=null)][0].id // empty' "$RUNNER_TEMP/vercel.json")"
          test -n "$env_id"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/env/${env_id}?teamId=${VERCEL_TEAM_ID}" > "$RUNNER_TEMP/vercel-detail.json"
          vercel_url=''
          for candidate in \
            "$(jq -r '[.envs[]|select(.key=="NEXT_PUBLIC_SUPABASE_URL" and (.target|index("production"))!=null)][0].value // empty' "$RUNNER_TEMP/vercel.json")" \
            "$(jq -r '[.envs[]|select(.key=="NEXT_PUBLIC_SUPABASE_URL" and (.target|index("production"))!=null)][0].legacyValue // empty' "$RUNNER_TEMP/vercel.json")" \
            "$(jq -r '[.envs[]|select(.key=="NEXT_PUBLIC_SUPABASE_URL" and (.target|index("production"))!=null)][0].vsmValue // empty' "$RUNNER_TEMP/vercel.json")" \
            "$(jq -r '.value // empty' "$RUNNER_TEMP/vercel-detail.json")" \
            "$(jq -r '.legacyValue // empty' "$RUNNER_TEMP/vercel-detail.json")" \
            "$(jq -r '.vsmValue // empty' "$RUNNER_TEMP/vercel-detail.json")"; do
            case "$candidate" in https://*.supabase.co) vercel_url="$candidate"; break ;; esac
          done
          vercel_target="$(classify_url "$vercel_url")"

          va_sql="select (select count(*) from pg_db_role_setting s join pg_database d on d.oid=s.setdatabase where d.datname='postgres' and s.setrole=0 and coalesce(array_to_string(s.setconfig,','),'') like '%default_transaction_read_only=on%') fence,(select count(*) from pg_subscription where subname='${REVERSE_SUBSCRIPTION}') reverse_subscriptions,(select count(*) from pg_subscription where subname='${REVERSE_SUBSCRIPTION}' and subenabled) reverse_enabled,(select count(*) from pg_stat_subscription where subname='${REVERSE_SUBSCRIPTION}' and pid is not null) reverse_workers,(select count(*) from pg_subscription_rel sr join pg_subscription s on s.oid=sr.srsubid where s.subname='${REVERSE_SUBSCRIPTION}') reverse_total,(select count(*) from pg_subscription_rel sr join pg_subscription s on s.oid=sr.srsubid where s.subname='${REVERSE_SUBSCRIPTION}' and sr.srsubstate='r') reverse_ready,(select count(*) from pg_publication where pubname='${FORWARD_PUBLICATION}') forward_publications,(select count(*) from pg_replication_slots where slot_name='${FORWARD_SLOT}') forward_slots,(select count(*) from pg_replication_slots where slot_name='${FORWARD_SLOT}' and active) forward_active_slots,(select count(*) from cron.job) cron_jobs;"
          or_sql="select (select count(*) from pg_db_role_setting s join pg_database d on d.oid=s.setdatabase where d.datname='postgres' and s.setrole=0 and coalesce(array_to_string(s.setconfig,','),'') like '%default_transaction_read_only=on%') fence,(select count(*) from pg_subscription where subname='${FORWARD_SUBSCRIPTION}') forward_subscriptions,(select count(*) from pg_subscription where subname='${FORWARD_SUBSCRIPTION}' and subenabled) forward_enabled,(select count(*) from pg_stat_subscription where subname='${FORWARD_SUBSCRIPTION}' and pid is not null) forward_workers,(select count(*) from pg_subscription_rel sr join pg_subscription s on s.oid=sr.srsubid where s.subname='${FORWARD_SUBSCRIPTION}') forward_total,(select count(*) from pg_subscription_rel sr join pg_subscription s on s.oid=sr.srsubid where s.subname='${FORWARD_SUBSCRIPTION}' and sr.srsubstate='r') forward_ready,(select count(*) from pg_publication where pubname='${REVERSE_PUBLICATION}') reverse_publications,(select count(*) from pg_replication_slots where slot_name='${REVERSE_SLOT}') reverse_slots,(select count(*) from pg_replication_slots where slot_name='${REVERSE_SLOT}' and active) reverse_active_slots,(select count(*) from cron.job where active) active_cron_jobs;"
          query_ref "$VIRGINIA_REF" "$va_sql" "$RUNNER_TEMP/va.json"
          query_ref "$OREGON_REF" "$or_sql" "$RUNNER_TEMP/or.json"

          base_enabled=0; base_disabled=0; base_other=0
          while IFS= read -r name; do
            state="$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)"
            case "$state" in ENABLED) base_enabled=$((base_enabled+1));; DISABLED) base_disabled=$((base_disabled+1));; *) base_other=$((base_other+1));; esac
          done < <(jq -r '.[].name' infra/aws/edge-runtime/schedules.json)
          dr_enabled=0; dr_disabled=0; dr_other=0
          while IFS= read -r name; do
            state="$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)"
            case "$state" in ENABLED) dr_enabled=$((dr_enabled+1));; DISABLED) dr_disabled=$((dr_disabled+1));; *) dr_other=$((dr_other+1));; esac
          done < <(jq -r '.[].name' infra/aws/edge-runtime/dr-schedules.json)

          va_fence="$(jq -r '.[0].fence' "$RUNNER_TEMP/va.json")"
          or_fence="$(jq -r '.[0].fence' "$RUNNER_TEMP/or.json")"
          reverse_subscriptions="$(jq -r '.[0].reverse_subscriptions' "$RUNNER_TEMP/va.json")"
          reverse_enabled="$(jq -r '.[0].reverse_enabled' "$RUNNER_TEMP/va.json")"
          reverse_workers="$(jq -r '.[0].reverse_workers' "$RUNNER_TEMP/va.json")"
          reverse_total="$(jq -r '.[0].reverse_total' "$RUNNER_TEMP/va.json")"
          reverse_ready="$(jq -r '.[0].reverse_ready' "$RUNNER_TEMP/va.json")"
          forward_publications="$(jq -r '.[0].forward_publications' "$RUNNER_TEMP/va.json")"
          forward_slots="$(jq -r '.[0].forward_slots' "$RUNNER_TEMP/va.json")"
          forward_active_slots="$(jq -r '.[0].forward_active_slots' "$RUNNER_TEMP/va.json")"
          forward_subscriptions="$(jq -r '.[0].forward_subscriptions' "$RUNNER_TEMP/or.json")"
          forward_enabled="$(jq -r '.[0].forward_enabled' "$RUNNER_TEMP/or.json")"
          forward_workers="$(jq -r '.[0].forward_workers' "$RUNNER_TEMP/or.json")"
          forward_total="$(jq -r '.[0].forward_total' "$RUNNER_TEMP/or.json")"
          forward_ready="$(jq -r '.[0].forward_ready' "$RUNNER_TEMP/or.json")"
          reverse_publications="$(jq -r '.[0].reverse_publications' "$RUNNER_TEMP/or.json")"
          reverse_slots="$(jq -r '.[0].reverse_slots' "$RUNNER_TEMP/or.json")"
          reverse_active_slots="$(jq -r '.[0].reverse_active_slots' "$RUNNER_TEMP/or.json")"

          if [ "$vercel_target" = 'oregon' ] && [ "$runtime_target" = 'virginia' ] && [ "$dr_mode" = 'failback_in_progress' ]; then
            state_classification='failback_before_runtime_cutover'
          elif [ "$vercel_target" = 'oregon' ] && [ "$runtime_target" = 'virginia' ] && [ "$dr_mode" = 'virginia_primary' ]; then
            state_classification='failback_after_aws_before_vercel_cutover'
          elif [ "$vercel_target" = 'virginia' ] && [ "$runtime_target" = 'virginia' ] && [ "$dr_mode" = 'virginia_primary' ]; then
            state_classification='virginia_traffic_restored'
          elif [ "$vercel_target" = 'oregon' ] && [ "$runtime_target" = 'oregon' ] && [ "$dr_mode" = 'oregon_primary' ]; then
            state_classification='oregon_primary'
          else
            state_classification='unclassified'
          fi

          echo "state_classification=$state_classification"
          echo "dr_mode=$dr_mode"
          echo "runtime_target=$runtime_target"
          echo "vercel_target=$vercel_target"
          echo "va_fence=$va_fence or_fence=$or_fence"
          echo "reverse_lane=sub:$reverse_subscriptions enabled:$reverse_enabled workers:$reverse_workers ready:$reverse_ready/$reverse_total source_pub:$reverse_publications source_slot:$reverse_slots active_slot:$reverse_active_slots"
          echo "forward_lane=pub:$forward_publications source_slot:$forward_slots active_slot:$forward_active_slots sub:$forward_subscriptions enabled:$forward_enabled workers:$forward_workers ready:$forward_ready/$forward_total"
          echo "schedules=base_enabled:$base_enabled base_disabled:$base_disabled base_other:$base_other dr_enabled:$dr_enabled dr_disabled:$dr_disabled dr_other:$dr_other"

          {
            echo '### DR fail-closed production state'
            echo ''
            echo "- Classification: \`$state_classification\`"
            echo "- DR mode: \`$dr_mode\`"
            echo "- AWS runtime target: \`$runtime_target\`"
            echo "- Vercel production target: \`$vercel_target\`"
            echo "- Database fences — Virginia/Oregon: \`$va_fence/$or_fence\`"
            echo "- Reverse OR→VA lane — subscription enabled/workers/ready: \`$reverse_subscriptions/$reverse_enabled/$reverse_workers/$reverse_ready/$reverse_total\`; Oregon publication/slot/active: \`$reverse_publications/$reverse_slots/$reverse_active_slots\`"
            echo "- Forward VA→OR lane — Virginia publication/slot/active: \`$forward_publications/$forward_slots/$forward_active_slots\`; Oregon subscription enabled/workers/ready: \`$forward_subscriptions/$forward_enabled/$forward_workers/$forward_ready/$forward_total\`"
            echo "- Base schedules enabled/disabled/other: \`$base_enabled/$base_disabled/$base_other\`"
            echo "- DR schedules enabled/disabled/other: \`$dr_enabled/$dr_disabled/$dr_other\`"
          } >> "$GITHUB_STEP_SUMMARY"
