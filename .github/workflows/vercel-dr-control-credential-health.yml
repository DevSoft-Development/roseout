name: Vercel DR control credential health

on:
  pull_request:
    paths:
      - '.github/workflows/vercel-dr-control-credential-health.yml'
      - '.github/workflows/aws-platform-dr.yml'
      - 'lib/admin/credential-vault-catalog.ts'
  schedule:
    - cron: '17 11 * * *'
  workflow_run:
    workflows: ['AWS Credential Vault runtime sync']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vercel-dr-control-credential-health-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: '742020474738'
  AWS_REGION: us-east-1
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  CREDENTIAL_VAULT_SECRET: /theouthaven/credential-vault/production/vercel

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dedicated DR credential contract
        run: |
          set -euo pipefail
          grep -F 'drControlToken' lib/admin/credential-vault-catalog.ts >/dev/null
          grep -F '.drControlToken // empty' .github/workflows/aws-platform-dr.yml >/dev/null
          ! grep -F 'GITHUB_VERCEL_TOKEN' .github/workflows/aws-platform-dr.yml >/dev/null
          ! grep -F 'validate_candidate "authoritative-runtime"' .github/workflows/aws-platform-dr.yml >/dev/null
          grep -F 'CREDENTIAL_VAULT_SECRET: /theouthaven/credential-vault/production/vercel' .github/workflows/vercel-dr-control-credential-health.yml >/dev/null

  health:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Validate project-scoped Vercel DR control authority
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value             --secret-id "$CREDENTIAL_VAULT_SECRET"             --query SecretString             --output text > "$RUNNER_TEMP/vercel-vault.json"

          TOKEN="$(jq -r '.drControlToken // empty' "$RUNNER_TEMP/vercel-vault.json")"
          TEAM_ID="$(jq -r '.teamId // empty' "$RUNNER_TEMP/vercel-vault.json")"
          [ -n "$TEAM_ID" ] || TEAM_ID="$VERCEL_TEAM_ID"

          test -n "$TOKEN" || {
            echo 'Vercel DR control credential is missing. Set Vercel > DR control token in Admin Credential Vault.' >&2
            exit 1
          }
          echo "::add-mask::$TOKEN"

          CODE="$(curl --silent --show-error             --header "Authorization: Bearer $TOKEN"             --output "$RUNNER_TEMP/vercel-project.json"             --write-out '%{http_code}'             "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}" || true)"
          SCOPE='project'
          if [ "$CODE" != '200' ]; then
            CODE="$(curl --silent --show-error               --header "Authorization: Bearer $TOKEN"               --output "$RUNNER_TEMP/vercel-project.json"               --write-out '%{http_code}'               "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${TEAM_ID}" || true)"
            SCOPE='team'
          fi

          test "$CODE" = '200' || {
            echo "Vercel DR control credential health failed with HTTP $CODE. Rotate only the DR control token in Admin Credential Vault." >&2
            cat "$RUNNER_TEMP/vercel-project.json" >&2 || true
            exit 1
          }
          jq -e --arg id "$VERCEL_PROJECT_ID" '.id==$id' "$RUNNER_TEMP/vercel-project.json" >/dev/null

          echo "credential_scope=$SCOPE"
          echo 'Vercel DR control credential is healthy.'
