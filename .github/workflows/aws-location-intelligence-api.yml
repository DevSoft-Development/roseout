name: AWS Location Intelligence API

on:
  pull_request:
    paths:
      - 'infra/aws/lambda/platform_location_intelligence_api.py'
      - 'infra/aws/lambda/google_places_provider.py'
      - 'infra/aws/cloudformation/location-intelligence-api.yml'
      - 'infra/aws/cloudformation/integration-api.yml'
      - 'lib/aws/location-intelligence-api.ts'
      - 'lib/aws/integration-api.ts'
      - 'app/api/google/address-details/route.ts'
      - 'app/api/admin/settings/google-places-budget/**'
      - 'app/admin/dashboard/settings/google-places/**'
      - 'app/admin/dashboard/settings/page.tsx'
      - '.github/workflows/aws-location-intelligence-api.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/aws/lambda/platform_location_intelligence_api.py'
      - 'infra/aws/lambda/google_places_provider.py'
      - 'infra/aws/cloudformation/location-intelligence-api.yml'
      - 'infra/aws/cloudformation/integration-api.yml'
      - 'lib/aws/location-intelligence-api.ts'
      - 'lib/aws/integration-api.ts'
      - 'app/api/google/address-details/route.ts'
      - 'app/api/admin/settings/google-places-budget/**'
      - 'app/admin/dashboard/settings/google-places/**'
      - 'app/admin/dashboard/settings/page.tsx'
      - '.github/workflows/aws-location-intelligence-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: production
        options: [staging, production]
      deploy:
        description: Deploy after validation
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-location-intelligence-api-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  TEMPLATE_FILE: infra/aws/cloudformation/location-intelligence-api.yml
  DEFAULT_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_PROJECT_NAME: roseout

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: |
          python -m py_compile infra/aws/lambda/platform_location_intelligence_api.py
          python -m py_compile infra/aws/lambda/google_places_provider.py
      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint
      - name: Lint CloudFormation
        run: |
          cfn-lint infra/aws/cloudformation/location-intelligence-api.yml
          cfn-lint infra/aws/cloudformation/integration-api.yml
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck app wiring
        run: npm run typecheck

  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve deployment configuration
        id: config
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          CONFIGURED_SUPABASE_URL: ${{ vars.AWS_WORKER_SUPABASE_URL }}
          LOCATION_INTELLIGENCE_SECRET: ${{ secrets.AWS_LOCATION_INTELLIGENCE_API_SECRET }}
          JOB_GATEWAY_SECRET: ${{ secrets.AWS_PLATFORM_JOB_GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          TARGET_ENV="${INPUT_ENV:-production}"
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          SUPABASE_URL="${CONFIGURED_SUPABASE_URL:-$DEFAULT_SUPABASE_URL}"
          SHARED_SECRET="${LOCATION_INTELLIGENCE_SECRET:-$JOB_GATEWAY_SECRET}"
          test -n "$SHARED_SECRET" || { echo 'Missing Location Intelligence API secret and job gateway fallback' >&2; exit 1; }
          test "${#SHARED_SECRET}" -ge 32 || { echo 'Location Intelligence API shared secret must be at least 32 characters' >&2; exit 1; }
          if [ "$TARGET_ENV" = 'production' ]; then
            case "$SUPABASE_URL" in
              *ftdsltatyqhtllyyefzp.supabase.co*) ;;
              *) echo 'Production Location Intelligence API must use Virginia Supabase.' >&2; exit 1 ;;
            esac
          fi
          echo "::add-mask::$SHARED_SECRET"
          printf '%s' "$SHARED_SECRET" > "$RUNNER_TEMP/location-intelligence-secret"
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "supabase_url=$SUPABASE_URL" >> "$GITHUB_OUTPUT"
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Resolve dependent AWS resources
        id: deps
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          SUPABASE_SECRET_ARN="$(aws secretsmanager describe-secret --secret-id "/theouthaven/${TARGET_ENV}/supabase/service-role" --query ARN --output text)"
          INTEGRATION_STACK="theouthaven-integration-api-${TARGET_ENV}"
          INTEGRATION_URL="$(aws cloudformation describe-stacks --stack-name "$INTEGRATION_STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiUrl'].OutputValue" --output text)"
          INTEGRATION_SECRET_ARN="$(aws cloudformation describe-stacks --stack-name "$INTEGRATION_STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiSecretArn'].OutputValue" --output text)"
          test -n "$SUPABASE_SECRET_ARN" && test "$SUPABASE_SECRET_ARN" != 'None'
          test -n "$INTEGRATION_URL" && test "$INTEGRATION_URL" != 'None'
          test -n "$INTEGRATION_SECRET_ARN" && test "$INTEGRATION_SECRET_ARN" != 'None'
          echo "supabase_secret_arn=$SUPABASE_SECRET_ARN" >> "$GITHUB_OUTPUT"
          echo "integration_url=$INTEGRATION_URL" >> "$GITHUB_OUTPUT"
          echo "integration_secret_arn=$INTEGRATION_SECRET_ARN" >> "$GITHUB_OUTPUT"
      - name: Deploy Location Intelligence API stack
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
          SUPABASE_URL: ${{ steps.config.outputs.supabase_url }}
          SUPABASE_SECRET_ARN: ${{ steps.deps.outputs.supabase_secret_arn }}
          INTEGRATION_URL: ${{ steps.deps.outputs.integration_url }}
          INTEGRATION_SECRET_ARN: ${{ steps.deps.outputs.integration_secret_arn }}
        run: |
          set -euo pipefail
          SHARED_SECRET="$(cat "$RUNNER_TEMP/location-intelligence-secret")"
          aws cloudformation deploy \
            --stack-name "theouthaven-location-intelligence-api-${TARGET_ENV}" \
            --template-file "$TEMPLATE_FILE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$TARGET_ENV" \
              LocationIntelligenceApiSharedSecret="$SHARED_SECRET" \
              SupabaseUrl="$SUPABASE_URL" \
              SupabaseServiceRoleSecretArn="$SUPABASE_SECRET_ARN" \
              IntegrationApiUrl="$INTEGRATION_URL" \
              IntegrationApiSecretArn="$INTEGRATION_SECRET_ARN" \
            --tags Project=TheOutHaven Environment="$TARGET_ENV" Service=LocationIntelligenceAPI ManagedBy=CloudFormation
      - name: Build and deploy Lambda code
        id: runtime
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/location-intelligence-api"
          ZIP_FILE="$RUNNER_TEMP/location-intelligence-api.zip"
          mkdir -p "$BUILD_DIR"
          cp infra/aws/lambda/platform_location_intelligence_api.py "$BUILD_DIR/index.py"
          (cd "$BUILD_DIR" && zip -qr "$ZIP_FILE" .)
          STACK="theouthaven-location-intelligence-api-${TARGET_ENV}"
          FUNCTION_NAME="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='LocationIntelligenceApiFunctionName'].OutputValue" --output text)"
          API_URL="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='LocationIntelligenceApiUrl'].OutputValue" --output text)"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file "fileb://$ZIP_FILE" >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "function_name=$FUNCTION_NAME" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Verify AWS health and budget endpoint
        env:
          API_URL: ${{ steps.runtime.outputs.api_url }}
        run: |
          set -euo pipefail
          SHARED_SECRET="$(cat "$RUNNER_TEMP/location-intelligence-secret")"
          export API_URL SHARED_SECRET
          python - <<'PY'
          import hashlib, hmac, json, os, time, urllib.request
          base = os.environ['API_URL'].rstrip('/')
          secret = os.environ['SHARED_SECRET']
          def get(path):
              stamp = str(int(time.time() * 1000))
              sig = hmac.new(secret.encode(), f'{stamp}\nGET\n{path}\n'.encode(), hashlib.sha256).hexdigest()
              req = urllib.request.Request(base + path, headers={'x-toh-timestamp': stamp, 'x-toh-signature': sig})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode())
          health = get('/healthz')
          assert health.get('ok') is True and health.get('service') == 'location-intelligence-api', health
          budget = get('/v1/google-budget/summary')
          assert budget.get('ok') is True and 'budgetRemainingUsd' in budget and 'usage' in budget, budget
          PY
      - name: Activate web-app BFF configuration
        if: steps.config.outputs.target_env == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          API_URL: ${{ steps.runtime.outputs.api_url }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN secret' >&2; exit 1; }
          SHARED_SECRET="$(cat "$RUNNER_TEMP/location-intelligence-secret")"
          echo "::add-mask::$SHARED_SECRET"
          jq -n --arg url "$API_URL" --arg secret "$SHARED_SECRET" '[
            {key:"AWS_LOCATION_INTELLIGENCE_API_URL",value:$url,type:"encrypted",target:["production"]},
            {key:"AWS_LOCATION_INTELLIGENCE_API_SECRET",value:$secret,type:"encrypted",target:["production"]}
          ]' > "$RUNNER_TEMP/vercel-location-intelligence-env.json"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/vercel-location-intelligence-env.json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" >/dev/null
