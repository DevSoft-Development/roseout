name: AWS POS runtime foundation

on:
  pull_request:
    paths:
      - 'infra/aws/cloudformation/pos-runtime-*.yml'
      - 'scripts/pos-runtime-foundation-regression.mjs'
      - '.github/workflows/aws-pos-runtime-foundation.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-pos-runtime-foundation-${{ github.event.pull_request.number || github.event.inputs.environment || 'validate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  FOUNDATION_TEMPLATE: infra/aws/cloudformation/pos-runtime-foundation.yml
  CONTROL_TEMPLATE: infra/aws/cloudformation/pos-runtime-control-plane.yml
  CELL_TEMPLATE: infra/aws/cloudformation/pos-runtime-cell.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate POS isolation contract
        run: node scripts/pos-runtime-foundation-regression.mjs
      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint
      - name: Lint POS CloudFormation
        run: |
          set -euo pipefail
          cfn-lint "$FOUNDATION_TEMPLATE"
          cfn-lint "$CONTROL_TEMPLATE"
          cfn-lint "$CELL_TEMPLATE"

  deploy-foundation:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve deployment configuration
        id: config
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          CERTIFICATE_ARN: ${{ vars.AWS_POS_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_ARN"
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "stack=theouthaven-pos-runtime-${TARGET_ENV}" >> "$GITHUB_OUTPUT"
      - name: Require healthy production DR
        if: github.event.inputs.environment == 'production'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/dr/require-production-dr-healthy.sh
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Deploy dedicated POS foundation
        env:
          STACK: ${{ steps.config.outputs.stack }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
          CERTIFICATE_ARN: ${{ vars.AWS_POS_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          aws cloudformation deploy             --stack-name "$STACK"             --template-file "$FOUNDATION_TEMPLATE"             --capabilities CAPABILITY_NAMED_IAM             --parameter-overrides               Environment="$TARGET_ENV"               PosHost=pos.theouthaven.com               CertificateArn="$CERTIFICATE_ARN"             --no-fail-on-empty-changeset
          aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].Outputs'
          echo 'POS foundation deployed. DNS cutover is intentionally separate.'
