name: Oregon DR fence write probe fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oregon-dr-fence-write-probe-fix-once.yml'
      - 'scripts/dr/patch-fence-write-probe.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oregon-dr-fence-write-probe-impl
          fetch-depth: 0
      - name: Generate validated DR write-fence probe patch
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/dr/patch-fence-write-probe.py > "$RUNNER_TEMP/patch-fence-write-probe.py"
          python3 "$RUNNER_TEMP/patch-fence-write-probe.py"
          grep -F 'DR write-fence probe' .github/workflows/oregon-dr-promotion.yml >/dev/null
          grep -F "'25006'" .github/workflows/oregon-dr-promotion.yml >/dev/null
          ! grep -F 'public_tuple_changes' .github/workflows/oregon-dr-promotion.yml >/dev/null
          grep -F 'Oregon DR write-fence probe' scripts/dr/oregon-failback.sh >/dev/null
          grep -F "'25006'" scripts/dr/oregon-failback.sh >/dev/null
          ! grep -F 'Oregon public writes were observed during the final quiet window.' scripts/dr/oregon-failback.sh >/dev/null
          bash -n scripts/dr/oregon-failback.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/oregon-dr-promotion.yml scripts/dr/oregon-failback.sh
          git commit -m 'Use direct service-role probes for DR write fences'
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:fix/oregon-dr-fence-write-probe-impl
