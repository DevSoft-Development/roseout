name: Production browser verification

on:
  pull_request:
    paths:
      - 'app/**'
      - 'apps/consumer/**'
      - 'apps/admin/**'
      - 'apps/business/**'
      - 'apps/reserve/**'
      - 'components/**'
      - 'tests/e2e/production-browser-helpers.ts'
      - 'tests/e2e/production-surfaces.spec.ts'
      - 'tests/e2e/production-pos-register.spec.ts'
      - '.github/workflows/production-browser-verification.yml'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_run:
    workflows:
      - Azure consumer production
      - AWS web surfaces services
      - AWS Reserve web
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      certify_pos:
        description: Require authenticated Lounge POS smoke and fail if not configured
        required: true
        default: false
        type: boolean
      surface:
        description: Production surface to verify
        required: true
        default: all
        type: choice
        options:
          - all
          - consumer
          - admin
          - business
          - reserve

permissions:
  contents: read

concurrency:
  group: production-browser-verification-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONSUMER_BASE_URL: https://theouthaven.com
      ADMIN_BASE_URL: https://admin.theouthaven.com
      BUSINESS_BASE_URL: https://business.theouthaven.com
      RESERVE_BASE_URL: https://reserve.theouthaven.com
      ADMIN_STORAGE_STATE_B64: ${{ secrets.PLAYWRIGHT_ADMIN_STORAGE_STATE_B64 }}
      BUSINESS_STORAGE_STATE_B64: ${{ secrets.PLAYWRIGHT_BUSINESS_STORAGE_STATE_B64 }}
      PRODUCTION_BUSINESS_DEMO_PATH: ${{ vars.PRODUCTION_BUSINESS_DEMO_PATH }}

    steps:
      - name: Check out verification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve production surface
        shell: bash
        env:
          MANUAL_SURFACE: ${{ github.event.inputs.surface }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" || { echo "Cannot determine PR scope; verify all."; CHANGED=""; }
            # Shared tooling and surface contracts must fail safely to all surfaces.
            if [ -z "$CHANGED" ] || printf '%s\\n' "$CHANGED" | grep -Eq '^(components/|packages/|tests/e2e/production-|playwright\\.config\\.ts$|package(-lock)?\\.json$|\\.github/workflows/production-browser-verification\\.yml$)'; then
              SURFACES="all"
            else
              SURFACES=""
              for surface in consumer admin business reserve; do
                case "$surface" in
                  consumer) match='^(app/|apps/consumer/)' ;;
                  admin) match='^apps/admin/' ;;
                  business) match='^apps/business/' ;;
                  reserve) match='^apps/reserve/' ;;
                esac
                if printf '%s\\n' "$CHANGED" | grep -Eq "$match"; then
                  SURFACES="${SURFACES:+$SURFACES,}$surface"
                fi
              done
              # Unknown changed paths are verified conservatively.
              if printf '%s\\n' "$CHANGED" | grep -Evq '^(app/|apps/(consumer|admin|business|reserve)/)'; then
                SURFACES="all"
              fi
              SURFACES="${SURFACES:-all}"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SURFACES="${MANUAL_SURFACE:-all}"
          else
            case "${TRIGGER_WORKFLOW}" in
              "Azure consumer production") SURFACES="consumer" ;;
              "AWS web surfaces services") SURFACES="admin,business" ;;
              "AWS Reserve web") SURFACES="reserve" ;;
              *) echo "Unsupported deployment workflow: ${TRIGGER_WORKFLOW}" >&2; exit 2 ;;
            esac
          fi
          echo "PRODUCTION_BROWSER_SURFACES=${SURFACES}" >> "$GITHUB_ENV"
          echo "Verifying production surfaces: ${SURFACES}"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare authenticated browser states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-auth"

          if [ -n "${ADMIN_STORAGE_STATE_B64:-}" ]; then
            printf '%s' "$ADMIN_STORAGE_STATE_B64" | base64 --decode > "$RUNNER_TEMP/browser-auth/admin.json"
            chmod 600 "$RUNNER_TEMP/browser-auth/admin.json"
            echo "PLAYWRIGHT_ADMIN_STORAGE_STATE=$RUNNER_TEMP/browser-auth/admin.json" >> "$GITHUB_ENV"
          fi

          if [ -n "${BUSINESS_STORAGE_STATE_B64:-}" ]; then
            printf '%s' "$BUSINESS_STORAGE_STATE_B64" | base64 --decode > "$RUNNER_TEMP/browser-auth/business.json"
            chmod 600 "$RUNNER_TEMP/browser-auth/business.json"
            echo "PLAYWRIGHT_BUSINESS_STORAGE_STATE=$RUNNER_TEMP/browser-auth/business.json" >> "$GITHUB_ENV"
          fi

      - name: Record POS smoke prerequisites
        shell: bash
        run: |
          echo "### Production POS smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "Test source SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production deployed SHA requires separate AWS attestation." >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${PLAYWRIGHT_ADMIN_STORAGE_STATE:-}" ]; then
            echo "::warning::POS smoke skipped without authenticated Admin state for Demo Center handoff"
            echo "Authenticated POS smoke: NOT CERTIFIED (missing prerequisites)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Authenticated POS smoke: configured to run" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require authenticated POS certification prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.certify_pos == true
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PRODUCTION_BROWSER_SURFACES}" != "all" ] && [ "${PRODUCTION_BROWSER_SURFACES}" != "business" ]; then
            echo '::error::POS certification requires surface=business or surface=all'
            exit 1
          fi
          if [ -z "${PLAYWRIGHT_ADMIN_STORAGE_STATE:-}" ]; then
            echo '::error::Protected POS certification blocked: configure PLAYWRIGHT_ADMIN_STORAGE_STATE_B64 for the Admin Demo Center session.'
            exit 1
          fi
          echo 'Protected POS prerequisites present; running Playwright verification.'

      - name: Run production browser verification
        run: npx playwright test tests/e2e/production-surfaces.spec.ts tests/e2e/production-pos-register.spec.ts --project=chromium

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
