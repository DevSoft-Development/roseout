name: AWS platform DR credential guard

on:
  workflow_run:
    workflows: ["AWS platform DR"]
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/aws-platform-dr-credential-guard.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-platform-dr-credential-guard-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: '742020474738'
  AUTHORITY_REGION: us-east-1
  COMPUTE_REGION: us-west-2
  VIRGINIA_SUPABASE_REF: ftdsltatyqhtllyyefzp
  VIRGINIA_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  AWS_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  DR_STACK_NAME: theouthaven-platform-dr-production

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guard contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-platform-dr-credential-guard.yml'
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" "$FILE"
          grep -F 'workflows: ["AWS platform DR"]' "$FILE" >/dev/null
          grep -F '/theouthaven/production/supabase/service-role' "$FILE" >/dev/null
          grep -F '/theouthaven/production/platform-dr/app-env' "$FILE" >/dev/null
          grep -F 'ftdsltatyqhtllyyefzp.supabase.co' "$FILE" >/dev/null
          grep -F 'BACKGROUND_RUNTIME_REFRESH_TOKEN' "$FILE" >/dev/null
          grep -F -- '--force-new-deployment' "$FILE" >/dev/null
          grep -F 'app_env_matches_authority=true' "$FILE" >/dev/null

  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AUTHORITY_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve and validate authoritative Virginia service-role key
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          KEY="$(aws secretsmanager get-secret-value --region "$AUTHORITY_REGION" --secret-id "$AWS_SERVICE_ROLE_SECRET" --query SecretString --output text)"
          test -n "$KEY" && test "$KEY" != 'None'
          echo "::add-mask::$KEY"
          printf '%s' "$KEY" > "$RUNNER_TEMP/authority-key"
          chmod 600 "$RUNNER_TEMP/authority-key"
          KEY_FILE="$RUNNER_TEMP/authority-key" VIRGINIA_SUPABASE_REF="$VIRGINIA_SUPABASE_REF" python <<'PY'
          import base64, json, os
          key = open(os.environ['KEY_FILE'], encoding='utf-8').read().strip()
          parts = key.split('.')
          if len(parts) != 3:
              raise SystemExit('Authoritative Supabase key is not a legacy JWT service-role key.')
          padded = parts[1] + '=' * (-len(parts[1]) % 4)
          payload = json.loads(base64.urlsafe_b64decode(padded.encode()).decode())
          if payload.get('role') != 'service_role' or payload.get('ref') != os.environ['VIRGINIA_SUPABASE_REF']:
              raise SystemExit('Authoritative Supabase key is not the Virginia service_role key.')
          print('authority_role=service_role')
          print('authority_ref_matches_virginia=true')
          PY
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "apikey: $KEY" --header "Authorization: Bearer $KEY" "${VIRGINIA_SUPABASE_URL}/rest/v1/locations?select=id&limit=1")"
          test "$STATUS" = '200' || { echo "Virginia authority Data API probe failed with HTTP $STATUS" >&2; exit 1; }

      - name: Repair shared app environment only when drifted
        id: repair
        run: |
          set -euo pipefail
          CURRENT="$RUNNER_TEMP/current-app-env.json"
          REPAIRED="$RUNNER_TEMP/repaired-app-env.json"
          aws secretsmanager get-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --query SecretString --output text > "$CURRENT"
          chmod 600 "$CURRENT"
          CURRENT_JSON="$CURRENT" KEY_FILE="$RUNNER_TEMP/authority-key" VIRGINIA_SUPABASE_URL="$VIRGINIA_SUPABASE_URL" OUTPUT_JSON="$REPAIRED" python <<'PY'
          import json, os
          current = json.load(open(os.environ['CURRENT_JSON'], encoding='utf-8'))
          key = open(os.environ['KEY_FILE'], encoding='utf-8').read().strip()
          if not isinstance(current, dict):
              raise SystemExit('Shared app environment is not a JSON object.')
          changed = current.get('NEXT_PUBLIC_SUPABASE_URL') != os.environ['VIRGINIA_SUPABASE_URL'] or current.get('SUPABASE_SERVICE_ROLE_KEY') != key
          current['NEXT_PUBLIC_SUPABASE_URL'] = os.environ['VIRGINIA_SUPABASE_URL']
          current['SUPABASE_SERVICE_ROLE_KEY'] = key
          json.dump(current, open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8'), separators=(',', ':'))
          print('drift_detected=' + str(changed).lower())
          open(os.environ['OUTPUT_JSON'] + '.changed', 'w', encoding='utf-8').write('true' if changed else 'false')
          PY
          chmod 600 "$REPAIRED"
          CHANGED="$(cat "$REPAIRED.changed")"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = 'true' ]; then
            aws secretsmanager put-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --secret-string "file://$REPAIRED" --query VersionId --output text >/dev/null
            echo 'shared_app_env_repaired=true'
          else
            echo 'shared_app_env_repaired=false'
          fi

      - name: Reload private background Lambda after repair
        if: steps.repair.outputs.changed == 'true'
        run: |
          set -euo pipefail
          FN="$(aws cloudformation describe-stacks --region "$AUTHORITY_REGION" --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$FN" && test "$FN" != 'None'
          aws lambda get-function-configuration --region "$AUTHORITY_REGION" --function-name "$FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/background-original-env.json"
          jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' "$RUNNER_TEMP/background-original-env.json" > "$RUNNER_TEMP/background-refresh-env.json"
          aws lambda update-function-configuration --region "$AUTHORITY_REGION" --function-name "$FN" --environment "file://$RUNNER_TEMP/background-refresh-env.json" >/dev/null
          aws lambda wait function-updated-v2 --region "$AUTHORITY_REGION" --function-name "$FN"
          aws lambda update-function-configuration --region "$AUTHORITY_REGION" --function-name "$FN" --environment "file://$RUNNER_TEMP/background-original-env.json" >/dev/null
          aws lambda wait function-updated-v2 --region "$AUTHORITY_REGION" --function-name "$FN"
          echo "background_function=$FN" >> "$GITHUB_ENV"

      - name: Restart DR Fargate tasks after repair
        if: steps.repair.outputs.changed == 'true'
        run: |
          set -euo pipefail
          CLUSTER="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$DR_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" --output text)"
          SERVICE="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$DR_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EcsServiceName'].OutputValue" --output text)"
          test -n "$CLUSTER" && test "$CLUSTER" != 'None'
          test -n "$SERVICE" && test "$SERVICE" != 'None'
          aws ecs update-service --region "$COMPUTE_REGION" --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment >/dev/null
          aws ecs wait services-stable --region "$COMPUTE_REGION" --cluster "$CLUSTER" --services "$SERVICE"
          aws ecs describe-services --region "$COMPUTE_REGION" --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,status:status}' --output json

      - name: Verify repaired secret and background runtime
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/verify-app-env.json"
          chmod 600 "$RUNNER_TEMP/verify-app-env.json"
          KEY_FILE="$RUNNER_TEMP/authority-key" APP_ENV_FILE="$RUNNER_TEMP/verify-app-env.json" VIRGINIA_SUPABASE_URL="$VIRGINIA_SUPABASE_URL" python <<'PY'
          import json, os
          key = open(os.environ['KEY_FILE'], encoding='utf-8').read().strip()
          app = json.load(open(os.environ['APP_ENV_FILE'], encoding='utf-8'))
          if app.get('SUPABASE_SERVICE_ROLE_KEY') != key or app.get('NEXT_PUBLIC_SUPABASE_URL') != os.environ['VIRGINIA_SUPABASE_URL']:
              raise SystemExit('Shared app environment still does not match Virginia authority.')
          print('app_env_matches_authority=true')
          PY
          FN="${background_function:-$(aws cloudformation describe-stacks --region "$AUTHORITY_REGION" --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)}"
          cat > "$RUNNER_TEMP/health-event.json" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"post-dr-credential-guard"},"requestContext":{"accountId":"guard","apiId":"guard","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"post-dr-guard","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"02/Sep/2026:00:00:00 +0000","timeEpoch":1788336000000},"isBase64Encoded":false}
          JSON
          aws lambda invoke --region "$AUTHORITY_REGION" --function-name "$FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/health-event.json" "$RUNNER_TEMP/health-response.json" >/dev/null
          jq -e '.statusCode == 200 and (.body | fromjson | .ok == true and .runtime == "aws-background" and .database == "ok")' "$RUNNER_TEMP/health-response.json" >/dev/null
          echo 'background_runtime_after_guard=healthy'

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/authority-key" "$RUNNER_TEMP/current-app-env.json" "$RUNNER_TEMP/repaired-app-env.json" "$RUNNER_TEMP/repaired-app-env.json.changed" "$RUNNER_TEMP/background-config.json" "$RUNNER_TEMP/background-original-env.json" "$RUNNER_TEMP/background-refresh-env.json" "$RUNNER_TEMP/verify-app-env.json" "$RUNNER_TEMP/health-event.json" "$RUNNER_TEMP/health-response.json"
