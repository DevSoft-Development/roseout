name: AWS Supabase service-role sync

on:
  pull_request:
    paths:
      - '.github/workflows/aws-supabase-service-role-sync.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aws-supabase-service-role-sync.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: production
        options:
          - production

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  VIRGINIA_SUPABASE_REF: ftdsltatyqhtllyyefzp
  VIRGINIA_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  AWS_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  EDGE_STACK_NAME: theouthaven-edge-runtime-production
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_ORG_ID: team_TzlwC4vdLZiT8kFGuXSoj1em

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow YAML
        run: ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" .github/workflows/aws-supabase-service-role-sync.yml

      - name: Verify authoritative Virginia recovery contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-supabase-service-role-sync.yml'
          grep -F 'secrets.SUPABASE_ACCESS_TOKEN' "$FILE" >/dev/null
          grep -F 'api-keys?reveal=true' "$FILE" >/dev/null
          grep -F '.name=="service_role"' "$FILE" >/dev/null
          grep -F 'ftdsltatyqhtllyyefzp.supabase.co' "$FILE" >/dev/null
          grep -F '/theouthaven/production/supabase/service-role' "$FILE" >/dev/null
          grep -F '/theouthaven/production/platform-dr/app-env' "$FILE" >/dev/null
          grep -F 'SUPABASE_SERVICE_ROLE_KEY production --force --sensitive' "$FILE" >/dev/null
          grep -F 'BACKGROUND_RUNTIME_REFRESH_TOKEN' "$FILE" >/dev/null
          grep -F 'location-search-profile-worker' "$FILE" >/dev/null
          grep -F 'search-phase13-maintenance' "$FILE" >/dev/null

  sync:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate current Virginia service-role key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
          KEYS_FILE="$RUNNER_TEMP/virginia-api-keys.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${VIRGINIA_SUPABASE_REF}/api-keys?reveal=true" > "$KEYS_FILE"
          SERVICE_ROLE="$(jq -r '[.[] | select(.type=="legacy" and .name=="service_role" and (.disabled != true))][0].api_key // empty' "$KEYS_FILE")"
          test -n "$SERVICE_ROLE" || { echo 'Virginia service-role key unavailable' >&2; exit 1; }
          echo "::add-mask::$SERVICE_ROLE"
          printf '%s' "$SERVICE_ROLE" > "$RUNNER_TEMP/virginia-service-role"
          chmod 600 "$RUNNER_TEMP/virginia-service-role"
          rm -f "$KEYS_FILE"

          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            "${VIRGINIA_SUPABASE_URL}/rest/v1/locations?select=id&limit=1")"
          test "$STATUS" = '200' || { echo "Authoritative Virginia credential failed Data API probe with HTTP $STATUS" >&2; exit 1; }
          echo 'Authoritative Virginia service-role credential is valid.'

      - name: Synchronize Vercel production server credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN' >&2; exit 1; }
          mkdir -p .vercel
          jq -n --arg org "$VERCEL_ORG_ID" --arg project "$VERCEL_PROJECT_ID" '{orgId:$org,projectId:$project}' > .vercel/project.json
          npx --yes vercel@59.3.0 env add SUPABASE_SERVICE_ROLE_KEY production --force --sensitive --token "$VERCEL_TOKEN" \
            < "$RUNNER_TEMP/virginia-service-role" >/dev/null
          echo 'Vercel production service-role credential synchronized.'

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Synchronize AWS service-role secret
        id: east-secret
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          SECRET_ARN="$(aws secretsmanager describe-secret --secret-id "$AWS_SERVICE_ROLE_SECRET" --query ARN --output text)"
          test -n "$SECRET_ARN" && test "$SECRET_ARN" != 'None'
          SERVICE_ROLE="$(cat "$RUNNER_TEMP/virginia-service-role")"
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ARN" \
            --secret-string "$SERVICE_ROLE" >/dev/null
          echo "arn=$SECRET_ARN" >> "$GITHUB_OUTPUT"
          echo 'AWS Virginia service-role secret synchronized.'

      - name: Synchronize AWS shared app environment
        run: |
          set -euo pipefail
          CURRENT="$RUNNER_TEMP/current-app-env.json"
          REPAIRED="$RUNNER_TEMP/repaired-app-env.json"
          aws secretsmanager get-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --query SecretString --output text > "$CURRENT"
          chmod 600 "$CURRENT"
          CURRENT_JSON="$CURRENT" KEY_FILE="$RUNNER_TEMP/virginia-service-role" OUTPUT_JSON="$REPAIRED" VIRGINIA_SUPABASE_URL="$VIRGINIA_SUPABASE_URL" python <<'PY'
          import json
          import os
          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          with open(os.environ['KEY_FILE'], encoding='utf-8') as fh:
              key = fh.read().strip()
          if not isinstance(current, dict) or not key:
              raise SystemExit('Invalid shared app environment recovery input.')
          current['NEXT_PUBLIC_SUPABASE_URL'] = os.environ['VIRGINIA_SUPABASE_URL']
          current['SUPABASE_SERVICE_ROLE_KEY'] = key
          with open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8') as fh:
              json.dump(current, fh, separators=(',', ':'))
          PY
          chmod 600 "$REPAIRED"
          aws secretsmanager put-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --secret-string "file://$REPAIRED" >/dev/null
          rm -f "$CURRENT" "$REPAIRED"
          echo 'AWS shared app environment synchronized to Virginia.'

      - name: Verify synchronized AWS credential against Virginia
        env:
          SECRET_ARN: ${{ steps.east-secret.outputs.arn }}
        run: |
          set -euo pipefail
          AWS_KEY="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query SecretString --output text)"
          test -n "$AWS_KEY"
          echo "::add-mask::$AWS_KEY"
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $AWS_KEY" \
            --header "Authorization: Bearer $AWS_KEY" \
            "${VIRGINIA_SUPABASE_URL}/rest/v1/locations?select=id&limit=1")"
          test "$STATUS" = '200' || { echo "Synchronized AWS credential failed Virginia probe with HTTP $STATUS" >&2; exit 1; }
          echo 'Synchronized AWS service-role credential is valid for Virginia.'

      - name: Force background runtime credential reload
        id: background
        run: |
          set -euo pipefail
          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN" && test "$BACKGROUND_FN" != 'None'
          aws lambda get-function-configuration --function-name "$BACKGROUND_FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/original-environment.json"
          jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' "$RUNNER_TEMP/original-environment.json" > "$RUNNER_TEMP/refresh-environment.json"
          aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/refresh-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/original-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          echo "function_name=$BACKGROUND_FN" >> "$GITHUB_OUTPUT"
          echo 'AWS background runtime execution environments refreshed.'

      - name: Verify refreshed background runtime
        env:
          BACKGROUND_FN: ${{ steps.background.outputs.function_name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/health.json" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"service-role-sync"},"requestContext":{"accountId":"service-role-sync","apiId":"service-role-sync","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"service-role-sync","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"02/Sep/2026:00:00:00 +0000","timeEpoch":1788307200000},"isBase64Encoded":false}
          JSON
          aws lambda invoke --function-name "$BACKGROUND_FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/health.json" "$RUNNER_TEMP/health-response.json" >/dev/null
          jq -e '.statusCode == 200 and (.body | fromjson | .ok == true and .runtime == "aws-background")' "$RUNNER_TEMP/health-response.json" >/dev/null

          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$INVOKER_FN" && test "$INVOKER_FN" != 'None'
          for JOB in location-search-profile-worker search-phase13-maintenance; do
            jq -nc --arg fn "node:/api/cron/managed?job=$JOB" '{function:$fn,body:{}}' > "$RUNNER_TEMP/probe.json"
            aws lambda invoke --function-name "$INVOKER_FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/probe.json" "$RUNNER_TEMP/response.json" >/dev/null
            jq -e '.ok == true and .runtime == "node" and (.status // 200) < 400 and (.response.ok // true) != false and (.response.success // true) != false' "$RUNNER_TEMP/response.json" >/dev/null
            echo "managed_probe_passed=$JOB"
          done
          echo 'AWS background runtime credential reload verified.'

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/virginia-service-role" "$RUNNER_TEMP/virginia-api-keys.json" "$RUNNER_TEMP/current-app-env.json" "$RUNNER_TEMP/repaired-app-env.json" "$RUNNER_TEMP/background-config.json" "$RUNNER_TEMP/original-environment.json" "$RUNNER_TEMP/refresh-environment.json" "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/health-response.json" "$RUNNER_TEMP/probe.json" "$RUNNER_TEMP/response.json"

      - name: Write synchronization summary
        run: |
          {
            echo '### Virginia Supabase service-role synchronization'
            echo '- Source: current Virginia service_role from Supabase Management API'
            echo '- Virginia Data API validation: passed before synchronization'
            echo '- Vercel production server credential: synchronized'
            echo '- AWS us-east service-role secret: synchronized and revalidated'
            echo '- AWS shared DR/background app environment: synchronized'
            echo '- AWS background runtime: forced reload and managed cron probes passed'
            echo '- Secret values: never printed'
            echo '- Database schema/settings: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
