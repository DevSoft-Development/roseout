name: Mobile production native migration guard

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'azure-pipelines-mobile.yml'
      - '.github/workflows/mobile-production-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove EAS native build authority is retired
        run: |
          set -euo pipefail
          test -f azure-pipelines-mobile.yml
          if grep -Eq 'eas-cli@.*workflow:run|eas build|eas submit' .github/workflows/mobile-production-native.yml; then
            echo "::error::Legacy production native workflow still invokes EAS."
            exit 1
          fi
          grep -F 'InstallAppleCertificate@2' azure-pipelines-mobile.yml >/dev/null
          grep -F 'InstallAppleProvisioningProfile@1' azure-pipelines-mobile.yml >/dev/null
          grep -F 'bundleRelease' azure-pipelines-mobile.yml >/dev/null
          grep -F 'iTMSTransporter' azure-pipelines-mobile.yml >/dev/null
          grep -F 'androidpublisher' azure-pipelines-mobile.yml >/dev/null
          echo "Production native build authority: Azure Pipelines."
