name: Azure AI live smoke

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Azure environment to verify
        type: choice
        required: true
        options:
          - staging
          - production
        default: staging
      deployment:
        description: Azure AI deployment name to test
        type: string
        required: true
        default: toh-primary

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-ai-live-smoke-${{ inputs.environment }}-${{ inputs.deployment }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify live Azure AI through application gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment == 'production' && 'Production' || 'staging' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Foundry account and deployment
        id: foundry
        uses: azure/CLI@v2
        env:
          TARGET_DEPLOYMENT: ${{ inputs.deployment }}
        with:
          inlineScript: |
            set -euo pipefail

            if [ "${{ inputs.environment }}" = "production" ]; then
              RG="rg-toh-consumer-production"
            else
              RG="rg-toh-consumer-staging"
            fi

            ACCOUNT="$(az cognitiveservices account list \
              --resource-group "$RG" \
              --query "[?kind=='AIServices'] | [0].name" \
              --output tsv)"

            if [ -z "$ACCOUNT" ]; then
              echo "::error::No AIServices/Foundry account exists in $RG."
              exit 1
            fi

            ENDPOINT="$(az cognitiveservices account show \
              --resource-group "$RG" \
              --name "$ACCOUNT" \
              --query properties.endpoint \
              --output tsv)"

            if [ -z "$ENDPOINT" ]; then
              echo "::error::Foundry account $ACCOUNT has no endpoint."
              exit 1
            fi

            az cognitiveservices account deployment list \
              --resource-group "$RG" \
              --name "$ACCOUNT" \
              --output json > deployments.json

            jq --arg deployment "$TARGET_DEPLOYMENT" \
              '[.[] | select(.name == $deployment)]' deployments.json > target-deployment.json

            MATCHES="$(jq 'length' target-deployment.json)"
            if [ "$MATCHES" -ne 1 ]; then
              echo "::error::Expected exactly one deployment named $TARGET_DEPLOYMENT in $ACCOUNT; found $MATCHES."
              cat target-deployment.json
              exit 1
            fi

            MODEL_NAME="$(jq -r '.[0].properties.model.name // empty' target-deployment.json)"
            MODEL_VERSION="$(jq -r '.[0].properties.model.version // empty' target-deployment.json)"
            SKU_NAME="$(jq -r '.[0].sku.name // empty' target-deployment.json)"
            CAPACITY="$(jq -r '.[0].sku.capacity // empty' target-deployment.json)"

            echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
            echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
            echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
            echo "model_name=$MODEL_NAME" >> "$GITHUB_OUTPUT"
            echo "model_version=$MODEL_VERSION" >> "$GITHUB_OUTPUT"
            echo "sku_name=$SKU_NAME" >> "$GITHUB_OUTPUT"
            echo "capacity=$CAPACITY" >> "$GITHUB_OUTPUT"

      - name: Prepare ephemeral gateway credentials
        uses: azure/CLI@v2
        env:
          RG: ${{ steps.foundry.outputs.resource_group }}
          ACCOUNT: ${{ steps.foundry.outputs.account }}
          ENDPOINT: ${{ steps.foundry.outputs.endpoint }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment }}
        with:
          inlineScript: |
            set -euo pipefail

            KEY="$(az cognitiveservices account keys list \
              --resource-group "$RG" \
              --name "$ACCOUNT" \
              --query key1 \
              --output tsv)"

            if [ -z "$KEY" ]; then
              echo "::error::Could not resolve an ephemeral account key for the smoke test."
              exit 1
            fi

            echo "::add-mask::$KEY"
            echo "AZURE_AI_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
            echo "AZURE_AI_API_KEY=$KEY" >> "$GITHUB_ENV"
            echo "AZURE_AI_MODEL=$TARGET_DEPLOYMENT" >> "$GITHUB_ENV"

      - name: Invoke through TheOutHaven AI gateway
        env:
          HUGGINGFACE_AI_ENDPOINT: https://router.huggingface.co/v1
          HUGGINGFACE_AI_MODEL: smoke-fallback-not-used
        run: npx --yes tsx lib/ai/gateway/live-smoke.ts

      - name: Publish smoke summary
        run: |
          {
            echo "### Azure AI application-gateway live smoke"
            echo ""
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Account: ${{ steps.foundry.outputs.account }}"
            echo "- Deployment: ${{ inputs.deployment }}"
            echo "- Model: ${{ steps.foundry.outputs.model_name }}"
            echo "- Version: ${{ steps.foundry.outputs.model_version }}"
            echo "- SKU: ${{ steps.foundry.outputs.sku_name }}"
            echo "- Capacity: ${{ steps.foundry.outputs.capacity }}"
            echo "- Provider: Azure"
            echo "- Application gateway path: passed"
            echo "- Failover used: no"
          } >> "$GITHUB_STEP_SUMMARY"
