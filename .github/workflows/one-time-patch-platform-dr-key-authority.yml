name: One-time patch platform DR key authority

on:
  push:
    branches:
      - ops/fix-platform-dr-virginia-key-authority
    paths:
      - 'scripts/patch-platform-dr-key-authority.py'
      - '.github/workflows/one-time-patch-platform-dr-key-authority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/fix-platform-dr-virginia-key-authority
      - name: Apply exact workflow patch
        run: python scripts/patch-platform-dr-key-authority.py
      - name: Commit patched platform DR workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/aws-platform-dr.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Make Virginia authoritative for platform DR service credential'
          git push origin HEAD:ops/fix-platform-dr-virginia-key-authority
