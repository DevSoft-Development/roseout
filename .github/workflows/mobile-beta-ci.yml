name: Mobile beta CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'app/api/mobile/v1/search/**'
      - 'scripts/mobile-search-parity-regression.mjs'
      - '.github/workflows/mobile-beta-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app/api/mobile/v1/search/**'
      - 'scripts/mobile-search-parity-regression.mjs'
      - '.github/workflows/mobile-beta-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-beta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install mobile dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo configuration
        run: npx expo config --type public >/tmp/theouthaven-mobile-expo-config.json

      - name: Verify mobile/web search parity
        run: node ../scripts/mobile-search-parity-regression.mjs

      - name: Verify initial-search location pass-through
        run: node scripts/verify-location-pass.mjs

      - name: Verify release identifiers
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          if (app?.ios?.bundleIdentifier !== 'com.theouthaven.app') throw new Error('Unexpected iOS bundle identifier');
          if (app?.android?.package !== 'com.theouthaven.app') throw new Error('Unexpected Android package');
          if (!Array.isArray(app?.ios?.associatedDomains) || !app.ios.associatedDomains.includes('applinks:outhvn.com')) throw new Error('outhvn.com iOS associated domain missing');
          const filters = app?.android?.intentFilters || [];
          const hasShortLink = filters.some((filter) => (filter.data || []).some((item) => item.scheme === 'https' && item.host === 'outhvn.com'));
          if (!hasShortLink) throw new Error('outhvn.com Android app link missing');
          NODE

      - name: Verify TheOutHaven Azure OTA configuration
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const ota = JSON.parse(fs.readFileSync('ota.config.json', 'utf8'));
          const expectedUrl = 'https://updates.theouthaven.com/api/mobile/ota/manifest';
          if (pkg?.dependencies?.['expo-updates'] !== '~57.0.22') throw new Error('Transitional expo-updates client dependency missing or unexpected');
          if (app?.updates?.url !== expectedUrl) throw new Error('TheOutHaven Azure OTA URL is missing or unexpected');
          if (String(app?.runtimeVersion || '') !== String(ota.runtimeVersion || '')) throw new Error('App and OTA runtime versions must match');
          if (app?.extra?.eas?.projectId) throw new Error('Production runtime must not require an EAS project ID');
          if (!Array.isArray(ota.channels) || !ota.channels.includes('production')) throw new Error('Production OTA channel is missing');
          NODE

      - name: Verify Azure native build authority
        working-directory: .
        run: |
          set -euo pipefail
          test -f azure-pipelines-mobile.yml
          grep -F 'InstallAppleCertificate@2' azure-pipelines-mobile.yml >/dev/null
          grep -F 'bundleRelease' azure-pipelines-mobile.yml >/dev/null
          grep -F 'iTMSTransporter' azure-pipelines-mobile.yml >/dev/null
          grep -F 'androidpublisher' azure-pipelines-mobile.yml >/dev/null
