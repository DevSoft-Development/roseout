name: Security hardening bootstrap

on:
  push:
    branches:
      - security/hardening-2026-09-07

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/hardening-2026-09-07
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused security patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          # Never trust Supabase user_metadata for authorization roles.
          p = Path('lib/auth/locationOwnerAccess.ts')
          s = p.read_text()
          s = s.replace('''      role:\n        user?.app_metadata?.role ??\n        user?.user_metadata?.role ??\n        user?.app_metadata?.admin_role ??\n        user?.user_metadata?.admin_role ??\n        null,''', '''      // Only app_metadata is server-controlled. Never trust user_metadata for privileges.\n      role:\n        user?.app_metadata?.role ??\n        user?.app_metadata?.admin_role ??\n        null,''')
          p.write_text(s)

          # Distributed rate limiters are asynchronous.
          p = Path('app/api/business/claim/no-code/route.ts')
          s = p.read_text().replace('const attemptLimit = enforceRateLimit(', 'const attemptLimit = await enforceRateLimit(')
          p.write_text(s)

          # Keep the first migration valid on a clean database too.
          p = Path('supabase/migrations/20260907210000_distributed_api_rate_limits.sql')
          s = p.read_text().replace('pg_catalog.greatest(', 'greatest(').replace('pg_catalog.ceil(', 'ceil(')
          p.write_text(s)

          access_test = Path('lib/auth/__tests__/locationOwnerAccess.test.ts')
          s = access_test.read_text()
          marker = 'describe("location privilege escalation regression"'
          if marker not in s:
              s += r'''

          describe("location privilege escalation regression", () => {
            it("does not trust a user-editable user_metadata admin role", async () => {
              resetTables({ locations: [location()] });
              authUsers.set("attacker-1", { email: "attacker@example.com" });

              const adminAuth = (await import("@/lib/supabase-admin")).supabaseAdmin.auth.admin.getUserById as any;
              adminAuth.mockResolvedValueOnce({
                data: {
                  user: {
                    email: "attacker@example.com",
                    app_metadata: {},
                    user_metadata: { role: "superadmin", admin_role: "superadmin" },
                  },
                },
              });

              const { resolveLocationAccessContext } = await getAccessModule();
              const access = await resolveLocationAccessContext({
                userId: "attacker-1",
                userEmail: "attacker@example.com",
                locationId: "loc-1",
              });

              expect(access.isAdmin).toBe(false);
              expect(access.isSuperadmin).toBe(false);
              expect(access.canView).toBe(false);
              expect(access.canEdit).toBe(false);
            });

            it("prevents one location owner from viewing or editing another location", async () => {
              resetTables({
                locations: [
                  location({ id: "loc-a", source_id: "source-a" }),
                  location({ id: "loc-b", source_id: "source-b" }),
                ],
                business_claims: [{ user_id: "owner-a", location_id: "loc-a", status: "approved" }],
              });
              authUsers.set("owner-a", { email: "owner-a@example.com" });

              const { resolveLocationAccessContext } = await getAccessModule();
              const access = await resolveLocationAccessContext({
                userId: "owner-a",
                userEmail: "owner-a@example.com",
                locationId: "loc-b",
              });

              expect(access.canView).toBe(false);
              expect(access.canEdit).toBe(false);
            });
          });
          '''
              access_test.write_text(s)

          reserve_test = Path('lib/reserve/__tests__/locationPermissions.test.ts')
          s = reserve_test.read_text()
          marker = 'blocks a location owner from Reserve PII at another location'
          if marker not in s:
              insert = r'''

            it("blocks a location owner from Reserve PII at another location", async () => {
              resetTables({
                locations: [
                  location({ id: "loc-a", source_id: "source-a" }),
                  location({ id: "loc-b", source_id: "source-b" }),
                ],
                business_claims: [{ user_id: "owner-a", location_id: "loc-a", status: "approved" }],
              });
              currentUser = { id: "owner-a", email: "owner-a@example.com" };
              authUsers.set("owner-a", { email: "owner-a@example.com" });

              const { requireReservePermission } = await getReserveModule();
              const result = await requireReservePermission("loc-b", "viewDashboard");

              expect(result.error).toBeInstanceOf(Response);
              expect(result.error.status).toBe(403);
              await expect(result.error.json()).resolves.toMatchObject({
                success: false,
                error: "You do not have permission to manage this location.",
              });
            });
          '''
              idx = s.rfind('\n});')
              if idx == -1:
                  raise RuntimeError('Could not locate Reserve test suite terminator')
              s = s[:idx] + insert + s[idx:]
              reserve_test.write_text(s)

          package = Path('package.json')
          data = json.loads(package.read_text())
          data['scripts']['test:security-access'] = 'vitest run lib/auth/__tests__/locationOwnerAccess.test.ts lib/reserve/__tests__/locationPermissions.test.ts lib/security/__tests__/admin-service-role-boundary.test.ts lib/security/__tests__/outbound-url.test.ts'
          strict = data['scripts'].get('production-check:strict', '')
          if 'npm run test:security-access' not in strict:
              data['scripts']['production-check:strict'] = strict + ' && npm run test:security-access'
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Upgrade patched Next.js release and regenerate lockfile
        run: |
          npm install --save-exact next@16.3.3
          npm install --save-dev --save-exact eslint-config-next@16.3.3

      - name: Security regression tests
        run: npm run test:security-access

      - name: Typecheck
        run: npm run typecheck

      - name: Commit generated lockfile and focused patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json \
            lib/auth/locationOwnerAccess.ts \
            lib/auth/__tests__/locationOwnerAccess.test.ts \
            lib/reserve/__tests__/locationPermissions.test.ts \
            app/api/business/claim/no-code/route.ts \
            supabase/migrations/20260907210000_distributed_api_rate_limits.sql
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi
          git commit -m "security: finish auth regressions and Next.js upgrade"
          git push origin HEAD:security/hardening-2026-09-07
