name: AWS domain gateway credential authority

on:
  pull_request:
    paths:
      - '.github/workflows/aws-domain-gateway-credential-authority.yml'
      - 'infra/aws/platform-dr/CREDENTIAL-AUTHORITY.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-domain-gateway-credential-authority.yml'
      - 'infra/aws/platform-dr/CREDENTIAL-AUTHORITY.md'
  workflow_dispatch:
  workflow_run:
    workflows: ['AWS platform DR']
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-domain-gateway-credential-authority-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  CANONICAL_DOMAIN_SECRET_NAME: /theouthaven/production/domain-gateway/hmac
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  DOMAIN_GATEWAY_INSTANCE: theouthaven-domains-gateway
  DOMAIN_GATEWAY_URL: https://domains-api.theouthaven.com

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate credential authority safety contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-domain-gateway-credential-authority.yml'
          grep -F "workflows: ['AWS platform DR']" "$FILE" >/dev/null
          grep -F "github.event.workflow_run.head_branch == 'main'" "$FILE" >/dev/null
          grep -F 'CANONICAL_DOMAIN_SECRET_NAME: /theouthaven/production/domain-gateway/hmac' "$FILE" >/dev/null
          grep -F 'lightsail get-instance-access-details' "$FILE" >/dev/null
          grep -F 'TheOutHavenDomainGatewayCredentialBootstrap' "$FILE" >/dev/null
          grep -F 'aws secretsmanager create-secret' "$FILE" >/dev/null
          grep -F 'domain_gateway_authority=valid' "$FILE" >/dev/null
          grep -F "current['DOMAIN_GATEWAY_SECRET'] = authority" "$FILE" >/dev/null
          grep -F 'aws secretsmanager put-secret-value' "$FILE" >/dev/null
          grep -F 'BACKGROUND_RUNTIME_REFRESH_TOKEN' "$FILE" >/dev/null
          grep -F 'function-updated-v2' "$FILE" >/dev/null
          grep -F 'runtime == "aws-background"' "$FILE" >/dev/null
          ! grep -F 'secrets.DOMAIN_GATEWAY_SECRET' "$FILE" >/dev/null

  repair-and-probe:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity and grant narrow Lightsail bootstrap access
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          POLICY_FILE="$RUNNER_TEMP/domain-gateway-lightsail-bootstrap-policy.json"
          cat > "$POLICY_FILE" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"DomainGatewayTemporarySshAccess",
                "Effect":"Allow",
                "Action":[
                  "lightsail:GetInstance",
                  "lightsail:GetInstances",
                  "lightsail:GetInstanceAccessDetails"
                ],
                "Resource":"*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenDomainGatewayCredentialBootstrap \
            --policy-document "file://$POLICY_FILE"
          sleep 8
          echo 'lightsail_bootstrap_access=ready'

      - name: Prepare temporary Lightsail SSH access
        run: |
          set -euo pipefail
          ACCESS="$RUNNER_TEMP/domain-gateway-lightsail-access.json"
          KEY="$RUNNER_TEMP/domain-gateway-lightsail-key"
          CERT="$RUNNER_TEMP/domain-gateway-lightsail-key-cert.pub"
          KNOWN_HOSTS="$RUNNER_TEMP/domain-gateway-known-hosts"
          aws lightsail get-instance-access-details \
            --region "$AWS_REGION" \
            --instance-name "$DOMAIN_GATEWAY_INSTANCE" \
            --protocol ssh > "$ACCESS"
          jq -e '.accessDetails.protocol == "ssh" and (.accessDetails.privateKey | length > 0) and (.accessDetails.ipAddress | length > 0) and (.accessDetails.username | length > 0)' "$ACCESS" >/dev/null
          jq -r '.accessDetails.privateKey' "$ACCESS" > "$KEY"
          chmod 600 "$KEY"
          jq -r '.accessDetails.certKey // empty' "$ACCESS" > "$CERT"
          chmod 600 "$CERT"
          jq -r '.accessDetails as $a | $a.hostKeys[] | "\($a.ipAddress) \(.algorithm) \(.publicKey)"' "$ACCESS" > "$KNOWN_HOSTS"
          test -s "$KNOWN_HOSTS"
          LIGHTSAIL_HOST="$(jq -r '.accessDetails.ipAddress' "$ACCESS")"
          LIGHTSAIL_USER="$(jq -r '.accessDetails.username' "$ACCESS")"
          echo "LIGHTSAIL_HOST=$LIGHTSAIL_HOST" >> "$GITHUB_ENV"
          echo "LIGHTSAIL_USER=$LIGHTSAIL_USER" >> "$GITHUB_ENV"
          echo 'lightsail_temporary_ssh=ready'

      - name: Ensure canonical AWS domain gateway secret
        run: |
          set -euo pipefail
          SECRET_FILE="$RUNNER_TEMP/canonical-domain-gateway-secret"
          EXISTING="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" \
            --query SecretString \
            --output text 2>/dev/null || true)"

          if [ -n "$EXISTING" ] && [ "$EXISTING" != 'None' ]; then
            echo "::add-mask::$EXISTING"
            printf '%s' "$EXISTING" > "$SECRET_FILE"
            chmod 600 "$SECRET_FILE"
            echo 'canonical_domain_secret=existing_aws_authority'
            exit 0
          fi

          RAW_AUTHORITY="$(ssh \
            -i "$RUNNER_TEMP/domain-gateway-lightsail-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/domain-gateway-known-hosts" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "sudo sh -c \"grep -m1 '^DOMAIN_GATEWAY_SECRET=' /opt/theouthaven-domain-gateway/.env | cut -d= -f2-\"")"
          AUTHORITY="$(RAW_AUTHORITY="$RAW_AUTHORITY" python - <<'PY'
          import os
          value = os.environ['RAW_AUTHORITY'].strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {'\"', "'"}:
              value = value[1:-1]
          print(value, end='')
          PY
          )"
          test "${#AUTHORITY}" -ge 32 || { echo 'Live gateway HMAC is missing or unexpectedly short.' >&2; exit 1; }
          case "$AUTHORITY" in *$'\n'*|*$'\r'*) echo 'Live gateway HMAC contains an invalid newline.' >&2; exit 1 ;; esac
          echo "::add-mask::$AUTHORITY"
          printf '%s' "$AUTHORITY" > "$SECRET_FILE"
          chmod 600 "$SECRET_FILE"

          if aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value \
              --region "$AWS_REGION" \
              --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" \
              --secret-string "file://$SECRET_FILE" \
              --query VersionId \
              --output text >/dev/null
          else
            aws secretsmanager create-secret \
              --region "$AWS_REGION" \
              --name "$CANONICAL_DOMAIN_SECRET_NAME" \
              --description 'Canonical HMAC shared secret for TheOutHaven domain gateway authentication.' \
              --secret-string "file://$SECRET_FILE" \
              --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production Key=Service,Value=Domains \
              --query ARN \
              --output text >/dev/null
          fi
          echo 'canonical_domain_secret=bootstrapped_from_live_gateway'

      - name: Verify canonical AWS authority against live gateway
        run: |
          set -euo pipefail
          AUTHORITY="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" \
            --query SecretString \
            --output text)"
          test "${#AUTHORITY}" -ge 32
          echo "::add-mask::$AUTHORITY"
          TIMESTAMP="$(date +%s%3N)"
          SIGNATURE="$(TIMESTAMP="$TIMESTAMP" DOMAIN_GATEWAY_SECRET="$AUTHORITY" python - <<'PY'
          import hashlib, hmac, os
          payload = '\n'.join([os.environ['TIMESTAMP'], 'GET', '/v1/status', ''])
          print(hmac.new(os.environ['DOMAIN_GATEWAY_SECRET'].encode(), payload.encode(), hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$SIGNATURE"
          STATUS="$(curl -sS -o "$RUNNER_TEMP/domain-gateway-status.json" -w '%{http_code}' \
            "$DOMAIN_GATEWAY_URL/v1/status" \
            -H "x-toh-timestamp: $TIMESTAMP" \
            -H "x-toh-signature: $SIGNATURE" || true)"
          OK="$(jq -r 'if .ok == true then "true" else "false" end' "$RUNNER_TEMP/domain-gateway-status.json" 2>/dev/null || echo false)"
          AUTH="$(jq -r 'if .authenticated == true then "true" else "false" end' "$RUNNER_TEMP/domain-gateway-status.json" 2>/dev/null || echo false)"
          echo "domain_gateway_http_status=${STATUS:-000}"
          echo "domain_gateway_ok=$OK"
          echo "domain_gateway_authenticated=$AUTH"
          test "${STATUS:-000}" -ge 200 2>/dev/null && test "$STATUS" -lt 300
          test "$OK" = 'true'
          test "$AUTH" = 'true'
          echo 'domain_gateway_authority=valid'

      - name: Reconcile Lightsail gateway from AWS authority
        id: gateway
        run: |
          set -euo pipefail
          SECRET_FILE="$RUNNER_TEMP/canonical-domain-gateway-secret"
          aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" \
            --query SecretString \
            --output text > "$SECRET_FILE"
          chmod 600 "$SECRET_FILE"
          AUTHORITY="$(cat "$SECRET_FILE")"
          echo "::add-mask::$AUTHORITY"

          SYNC_SCRIPT="$RUNNER_TEMP/sync-domain-gateway-secret.py"
          cat > "$SYNC_SCRIPT" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          secret_path = Path(sys.argv[1])
          env_path = Path(sys.argv[2])
          authority = secret_path.read_text(encoding='utf-8')
          if len(authority) < 32 or '\n' in authority or '\r' in authority:
              raise SystemExit('invalid_authority')

          original = env_path.read_text(encoding='utf-8')
          lines = original.splitlines()
          replacement = f'DOMAIN_GATEWAY_SECRET={authority}'
          found = False
          changed = False
          output = []
          for line in lines:
              if line.startswith('DOMAIN_GATEWAY_SECRET='):
                  found = True
                  raw = line.split('=', 1)[1].strip()
                  if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {'"', "'"}:
                      raw = raw[1:-1]
                  if raw != authority:
                      changed = True
                  output.append(replacement)
              else:
                  output.append(line)
          if not found:
              output.append(replacement)
              changed = True
          if not changed:
              print('unchanged')
              raise SystemExit(0)

          info = env_path.stat()
          temp_path = env_path.with_name(env_path.name + '.credential-sync')
          temp_path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          os.chmod(temp_path, stat.S_IMODE(info.st_mode))
          os.chown(temp_path, info.st_uid, info.st_gid)
          os.replace(temp_path, env_path)
          print('changed')
          PY

          scp \
            -i "$RUNNER_TEMP/domain-gateway-lightsail-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/domain-gateway-known-hosts" \
            "$SYNC_SCRIPT" "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/tmp/toh-sync-domain-gateway-secret.py"

          SYNC_RESULT="$(cat "$SECRET_FILE" | ssh \
            -i "$RUNNER_TEMP/domain-gateway-lightsail-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/domain-gateway-known-hosts" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            'set -eu; umask 077; cat > /tmp/toh-domain-gateway-secret; sudo python3 /tmp/toh-sync-domain-gateway-secret.py /tmp/toh-domain-gateway-secret /opt/theouthaven-domain-gateway/.env; rm -f /tmp/toh-domain-gateway-secret /tmp/toh-sync-domain-gateway-secret.py')"
          test "$SYNC_RESULT" = 'changed' || test "$SYNC_RESULT" = 'unchanged'
          if [ "$SYNC_RESULT" = 'changed' ]; then
            ssh \
              -i "$RUNNER_TEMP/domain-gateway-lightsail-key" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/domain-gateway-known-hosts" \
              "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
              'sudo systemctl restart theouthaven-domain-gateway && sudo systemctl is-active --quiet theouthaven-domain-gateway'
            echo 'lightsail_domain_gateway_secret=repaired'
          else
            echo 'lightsail_domain_gateway_secret=already_current'
          fi
          echo "changed=$([ "$SYNC_RESULT" = 'changed' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          HEALTH_STATUS="$(curl -sS -o "$RUNNER_TEMP/domain-gateway-health.json" -w '%{http_code}' "$DOMAIN_GATEWAY_URL/health" || true)"
          test "${HEALTH_STATUS:-000}" -ge 200 2>/dev/null && test "$HEALTH_STATUS" -lt 300
          jq -e '.ok == true' "$RUNNER_TEMP/domain-gateway-health.json" >/dev/null
          echo 'domain_gateway_public_health=valid'

      - name: Repair shared AWS app environment from canonical authority
        id: repair
        run: |
          set -euo pipefail
          AUTHORITY="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" \
            --query SecretString \
            --output text)"
          echo "::add-mask::$AUTHORITY"
          CURRENT="$RUNNER_TEMP/current-app-env.json"
          REPAIRED="$RUNNER_TEMP/repaired-app-env.json"
          CHANGED_FILE="$RUNNER_TEMP/domain-gateway-secret-changed"
          aws secretsmanager get-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --query SecretString \
            --output text > "$CURRENT"
          chmod 600 "$CURRENT"
          jq -e 'type == "object"' "$CURRENT" >/dev/null

          CURRENT_JSON="$CURRENT" OUTPUT_JSON="$REPAIRED" CHANGED_FILE="$CHANGED_FILE" DOMAIN_GATEWAY_SECRET="$AUTHORITY" DOMAIN_GATEWAY_URL="$DOMAIN_GATEWAY_URL" python - <<'PY'
          import json, os
          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          authority = os.environ['DOMAIN_GATEWAY_SECRET']
          gateway_url = os.environ['DOMAIN_GATEWAY_URL'].rstrip('/')
          changed = current.get('DOMAIN_GATEWAY_SECRET') != authority or str(current.get('DOMAIN_GATEWAY_URL') or '').rstrip('/') != gateway_url
          current['DOMAIN_GATEWAY_SECRET'] = authority
          current['DOMAIN_GATEWAY_URL'] = gateway_url
          with open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8') as fh:
              json.dump(current, fh, separators=(',', ':'))
          with open(os.environ['CHANGED_FILE'], 'w', encoding='utf-8') as fh:
              fh.write('true' if changed else 'false')
          PY
          CHANGED="$(cat "$CHANGED_FILE")"
          chmod 600 "$REPAIRED" "$CHANGED_FILE"
          if [ "$CHANGED" = 'true' ]; then
            aws secretsmanager put-secret-value \
              --region "$APP_ENV_SECRET_REGION" \
              --secret-id "$APP_ENV_SECRET_NAME" \
              --secret-string "file://$REPAIRED" \
              --query VersionId \
              --output text >/dev/null
            echo 'shared_app_environment=repaired'
          else
            echo 'shared_app_environment=already_current'
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Force background runtime to reload repaired secret
        if: steps.repair.outputs.changed == 'true'
        run: |
          set -euo pipefail
          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN" && test "$BACKGROUND_FN" != 'None'
          aws lambda get-function-configuration --function-name "$BACKGROUND_FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/original-environment.json"
          jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' \
            "$RUNNER_TEMP/original-environment.json" > "$RUNNER_TEMP/refresh-environment.json"
          aws lambda update-function-configuration \
            --function-name "$BACKGROUND_FN" \
            --environment "file://$RUNNER_TEMP/refresh-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          aws lambda update-function-configuration \
            --function-name "$BACKGROUND_FN" \
            --environment "file://$RUNNER_TEMP/original-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          echo "background_function=$BACKGROUND_FN" >> "$GITHUB_ENV"
          echo 'background_runtime_secret_reload=complete'

      - name: Resolve background function when no app-env repair was needed
        if: steps.repair.outputs.changed != 'true'
        run: |
          set -euo pipefail
          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN" && test "$BACKGROUND_FN" != 'None'
          echo "background_function=$BACKGROUND_FN" >> "$GITHUB_ENV"

      - name: Verify private background runtime after credential reconciliation
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/background-health-event.json" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"domain-gateway-credential-authority"},"requestContext":{"accountId":"credential-authority","apiId":"credential-authority","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"credential-authority","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"02/Sep/2026:00:00:00 +0000","timeEpoch":1788307200000},"isBase64Encoded":false}
          JSON
          aws lambda invoke \
            --function-name "$background_function" \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$RUNNER_TEMP/background-health-event.json" \
            "$RUNNER_TEMP/background-health-response.json" >/dev/null
          jq -e '.statusCode == 200 and (.body | fromjson | .ok == true and .runtime == "aws-background" and .database == "ok")' \
            "$RUNNER_TEMP/background-health-response.json" >/dev/null
          echo 'background_runtime_health=valid'

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/domain-gateway-lightsail-bootstrap-policy.json" \
            "$RUNNER_TEMP/domain-gateway-lightsail-access.json" \
            "$RUNNER_TEMP/domain-gateway-lightsail-key" \
            "$RUNNER_TEMP/domain-gateway-lightsail-key-cert.pub" \
            "$RUNNER_TEMP/domain-gateway-known-hosts" \
            "$RUNNER_TEMP/canonical-domain-gateway-secret" \
            "$RUNNER_TEMP/sync-domain-gateway-secret.py" \
            "$RUNNER_TEMP/domain-gateway-status.json" \
            "$RUNNER_TEMP/domain-gateway-health.json" \
            "$RUNNER_TEMP/current-app-env.json" \
            "$RUNNER_TEMP/repaired-app-env.json" \
            "$RUNNER_TEMP/domain-gateway-secret-changed" \
            "$RUNNER_TEMP/background-config.json" \
            "$RUNNER_TEMP/original-environment.json" \
            "$RUNNER_TEMP/refresh-environment.json" \
            "$RUNNER_TEMP/background-health-event.json" \
            "$RUNNER_TEMP/background-health-response.json"
