name: AWS Google API secret handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-google-places-secret-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  RUNTIME_SECRET_NAME: /theouthaven/production/edge-runtime/env
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em

jobs:
  handoff:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Copy Google API keys from Vercel to AWS without logging values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured" >&2; exit 1; }
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

          VERCEL_ENV="$RUNNER_TEMP/vercel-env.json"
          RUNTIME="$RUNNER_TEMP/runtime.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}&decrypt=true" \
            > "$VERCEL_ENV"

          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_NAME" \
            --query SecretString \
            --output text > "$RUNTIME"
          jq -e 'type == "object"' "$RUNTIME" >/dev/null

          extract_prod() {
            local key="$1"
            jq -r --arg key "$key" '[.envs[] | select(.key == $key and ((.target // []) | index("production")))] | if length == 1 then .[0].value else empty end' "$VERCEL_ENV"
          }

          PLACES="$(extract_prod GOOGLE_PLACES_API_KEY)"
          test -n "$PLACES" || { echo "GOOGLE_PLACES_API_KEY is not uniquely configured for Vercel production" >&2; exit 1; }
          echo "::add-mask::$PLACES"
          jq --arg value "$PLACES" '. + {GOOGLE_PLACES_API_KEY:$value}' "$RUNTIME" > "$RUNTIME.tmp"
          mv "$RUNTIME.tmp" "$RUNTIME"

          GEOCODING="$(extract_prod GOOGLE_GEOCODING_API_KEY)"
          if [ -n "$GEOCODING" ]; then
            echo "::add-mask::$GEOCODING"
            jq --arg value "$GEOCODING" '. + {GOOGLE_GEOCODING_API_KEY:$value}' "$RUNTIME" > "$RUNTIME.tmp"
            mv "$RUNTIME.tmp" "$RUNTIME"
            echo "google_geocoding_synced=true"
          else
            echo "google_geocoding_synced=false"
          fi

          jq -e '.GOOGLE_PLACES_API_KEY | strings | length > 0' "$RUNTIME" >/dev/null
          aws secretsmanager put-secret-value \
            --secret-id "$RUNTIME_SECRET_NAME" \
            --secret-string "file://$RUNTIME" >/dev/null
          echo "google_places_synced=true"

          rm -f "$VERCEL_ENV" "$RUNTIME"
