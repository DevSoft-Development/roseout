name: AWS background runtime

on:
  pull_request:
    paths:
      - 'infra/aws/background-runtime/**'
      - 'infra/aws/cloudformation/background-runtime.yml'
      - 'app/api/cron/**'
      - 'app/api/admin/**'
      - 'app/api/health/background-runtime/**'
      - 'lib/**'
      - 'config/cron-jobs.json'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/aws-background-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/background-runtime/**'
      - 'infra/aws/cloudformation/background-runtime.yml'
      - 'app/api/cron/**'
      - 'app/api/admin/**'
      - 'app/api/health/background-runtime/**'
      - 'lib/**'
      - 'config/cron-jobs.json'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/aws-background-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-background-runtime-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  ECR_REPOSITORY: theouthaven/background-runtime
  STACK_NAME: theouthaven-background-runtime-production
  EDGE_STACK_NAME: theouthaven-edge-runtime-production
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  AWS_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role
  VIRGINIA_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials for ECR Public
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Authenticate Docker to ECR Public
        run: |
          set -euo pipefail
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Validate CloudFormation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infra/aws/cloudformation/background-runtime.yml

      - name: Validate container definition
        run: |
          set -euo pipefail
          test -f infra/aws/background-runtime/Dockerfile
          test -f infra/aws/background-runtime/bootstrap.mjs
          for attempt in 1 2 3 4 5; do
            if docker build --check -f infra/aws/background-runtime/Dockerfile .; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Container definition validation failed after 5 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Validate private managed-dispatch guard
        run: |
          set -euo pipefail
          grep -F 'const AWS_BACKGROUND_ORIGIN = "http://127.0.0.1:3000";' app/api/cron/managed/route.ts >/dev/null
          grep -F 'request.headers.get("x-toh-aws-internal") === "eventbridge"' app/api/cron/managed/route.ts >/dev/null
          grep -F 'redirect: awsBackground ? "manual" : "follow"' app/api/cron/managed/route.ts >/dev/null
          grep -F 'AWS managed cron local dispatch escaped the private background runtime' app/api/cron/managed/route.ts >/dev/null

      - name: Validate Virginia credential authority contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-background-runtime.yml'
          grep -F '/theouthaven/production/supabase/service-role' "$FILE" >/dev/null
          grep -F 'ftdsltatyqhtllyyefzp.supabase.co' "$FILE" >/dev/null
          grep -F 'Authoritative Virginia service-role credential failed validation' "$FILE" >/dev/null
          grep -F "current['SUPABASE_SERVICE_ROLE_KEY'] = key" "$FILE" >/dev/null
          grep -F "current['NEXT_PUBLIC_SUPABASE_URL'] = os.environ['VIRGINIA_SUPABASE_URL']" "$FILE" >/dev/null
          grep -F 'BACKGROUND_APP_ENV_JSON=' "$FILE" >/dev/null
          grep -F 'Prepare production build environment from AWS app environment' "$FILE" >/dev/null
          if grep -F 'vercel env pull' "$FILE" | grep -v 'grep -F' >/dev/null; then
            echo 'AWS background runtime build must not depend on a Vercel CLI credential.' >&2
            exit 1
          fi
          if grep -F 'secrets.VERCEL_TOKEN' "$FILE" | grep -v 'grep -F' >/dev/null; then
            echo 'AWS background runtime build must not depend on a Vercel token secret.' >&2
            exit 1
          fi
          grep -F 'for attempt in 1 2 3 4; do' "$FILE" >/dev/null
          grep -F 'Background runtime failed Virginia health after 4 attempts.' "$FILE" >/dev/null
          grep -F 'supabaseAdmin.from("locations").select("id").limit(1)' app/api/health/background-runtime/route.ts >/dev/null
          grep -F 'database: databaseOk ? "ok" : "unavailable"' app/api/health/background-runtime/route.ts >/dev/null

      - name: Validate scheduler isolation canary is non-mutating
        run: |
          set -euo pipefail
          grep -F 'node:/api/health/background-runtime' .github/workflows/aws-background-runtime.yml >/dev/null
          OLD_CANARY='managed?job=location-search-profile-'
          if grep -F "${OLD_CANARY}worker" .github/workflows/aws-background-runtime.yml >/dev/null; then
            echo 'Background runtime isolation proof must not depend on a mutating business job.' >&2
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Repair shared app environment from authoritative Virginia credential
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

          KEY_FILE="$RUNNER_TEMP/virginia-service-role"
          CURRENT_APP_ENV="$RUNNER_TEMP/current-app-env.json"
          REPAIRED_APP_ENV="$RUNNER_TEMP/repaired-app-env.json"

          aws secretsmanager get-secret-value \
            --secret-id "$AWS_SERVICE_ROLE_SECRET" \
            --query SecretString \
            --output text > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          test -n "$SERVICE_ROLE" || { echo 'Authoritative Virginia service-role secret is empty.' >&2; exit 1; }
          echo "::add-mask::$SERVICE_ROLE"

          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            "${VIRGINIA_SUPABASE_URL}/rest/v1/locations?select=id&limit=1")"
          test "$STATUS" = '200' || { echo "Authoritative Virginia service-role credential failed validation with HTTP $STATUS" >&2; exit 1; }

          aws secretsmanager get-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --query SecretString \
            --output text > "$CURRENT_APP_ENV"
          chmod 600 "$CURRENT_APP_ENV"

          CURRENT_JSON="$CURRENT_APP_ENV" KEY_FILE="$KEY_FILE" OUTPUT_JSON="$REPAIRED_APP_ENV" VIRGINIA_SUPABASE_URL="$VIRGINIA_SUPABASE_URL" python <<'PY'
          import json
          import os

          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          with open(os.environ['KEY_FILE'], encoding='utf-8') as fh:
              key = fh.read().strip()
          if not isinstance(current, dict) or not key:
              raise SystemExit('Invalid authoritative app-environment input.')
          current['NEXT_PUBLIC_SUPABASE_URL'] = os.environ['VIRGINIA_SUPABASE_URL']
          current['SUPABASE_SERVICE_ROLE_KEY'] = key
          with open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8') as fh:
              json.dump(current, fh, separators=(',', ':'))
          PY
          chmod 600 "$REPAIRED_APP_ENV"

          aws secretsmanager put-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --secret-string "file://$REPAIRED_APP_ENV" \
            --query VersionId \
            --output text >/dev/null

          rm -f "$CURRENT_APP_ENV"
          echo "VIRGINIA_SERVICE_ROLE_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "BACKGROUND_APP_ENV_JSON=$REPAIRED_APP_ENV" >> "$GITHUB_ENV"
          echo 'AWS shared app environment repaired from the authoritative Virginia service-role secret.'

      - name: Prepare production build environment from AWS app environment
        run: |
          set -euo pipefail
          test -s "$BACKGROUND_APP_ENV_JSON"
          ENV_FILE="$RUNNER_TEMP/background-production.env"

          APP_ENV_JSON="$BACKGROUND_APP_ENV_JSON" ENV_FILE="$ENV_FILE" python <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          with open(os.environ['APP_ENV_JSON'], encoding='utf-8') as fh:
              values = json.load(fh)
          if not isinstance(values, dict):
              raise SystemExit('AWS app environment secret must contain a JSON object.')

          values['PLATFORM_RUNTIME_PROVIDER'] = 'aws-background'
          values['INTERNAL_APP_ORIGIN'] = 'http://127.0.0.1:3000'
          key_pattern = re.compile(r'^[A-Za-z_][A-Za-z0-9_]*$')
          lines = []
          for key in sorted(values):
              if not key_pattern.match(key):
                  raise SystemExit(f'Invalid environment key in AWS app environment: {key!r}')
              value = values[key]
              if value is None:
                  continue
              if isinstance(value, str):
                  text = value
              elif isinstance(value, (dict, list)):
                  text = json.dumps(value, separators=(',', ':'))
              else:
                  text = str(value)
              lines.append(f'{key}={json.dumps(text)}')
          Path(os.environ['ENV_FILE']).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          test -s "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          grep -F 'NEXT_PUBLIC_SUPABASE_URL="https://ftdsltatyqhtllyyefzp.supabase.co"' "$ENV_FILE" >/dev/null
          grep -F 'PLATFORM_RUNTIME_PROVIDER="aws-background"' "$ENV_FILE" >/dev/null
          echo 'Temporary build environment generated from the authoritative AWS app environment.'

      - name: Ensure ECR repository
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production >/dev/null

      - name: Build and push background runtime image
        id: image
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          ENV_FILE="$RUNNER_TEMP/background-production.env"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          DOCKER_BUILDKIT=1 docker build \
            --secret id=platform_env,src="$ENV_FILE" \
            -f infra/aws/background-runtime/Dockerfile \
            -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          rm -f "$ENV_FILE" "$VIRGINIA_SERVICE_ROLE_FILE" "$BACKGROUND_APP_ENV_JSON"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy background runtime stack
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/aws/cloudformation/background-runtime.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=production \
              BackgroundRuntimeImageUri="$IMAGE_URI" \
              AppEnvSecretName="$APP_ENV_SECRET_NAME" \
              AppEnvSecretRegion="$APP_ENV_SECRET_REGION" \
            --tags Project=TheOutHaven Environment=production Service=BackgroundRuntime ManagedBy=CloudFormation

      - name: Smoke test private background runtime and Virginia auth
        run: |
          set -euo pipefail
          FN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$FN" && test "$FN" != 'None'
          aws lambda wait function-updated-v2 --function-name "$FN"
          EVENT="$RUNNER_TEMP/background-health-event.json"
          RESPONSE="$RUNNER_TEMP/background-health-response.json"
          cat > "$EVENT" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"smoke"},"requestContext":{"accountId":"smoke","apiId":"smoke","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"smoke","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"01/Sep/2026:00:00:00 +0000","timeEpoch":1788220800000},"isBase64Encoded":false}
          JSON
          healthy=0
          for attempt in 1 2 3 4; do
            rm -f "$RESPONSE"
            if aws lambda invoke \
              --function-name "$FN" \
              --cli-binary-format raw-in-base64-out \
              --payload "fileb://$EVENT" \
              "$RESPONSE" >/dev/null 2>&1 && \
              jq -e '.statusCode == 200 and (.body | fromjson | .ok == true and .runtime == "aws-background" and .database == "ok")' "$RESPONSE" >/dev/null 2>&1; then
              echo "private_background_runtime_health=passed attempt=${attempt}"
              healthy=1
              break
            fi
            STATUS_CODE="$(jq -r '.statusCode // "invoke_error"' "$RESPONSE" 2>/dev/null || echo 'invoke_error')"
            echo "Background runtime health attempt ${attempt}/4 not ready (status=${STATUS_CODE})."
            if [ "$attempt" -lt 4 ]; then
              sleep 10
            fi
          done
          test "$healthy" = '1' || { echo 'Background runtime failed Virginia health after 4 attempts.' >&2; exit 1; }

      - name: Prove scheduler Node routing stays inside private AWS runtime
        run: |
          set -euo pipefail
          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$INVOKER_FN"
          printf '%s' '{"function":"node:/api/health/background-runtime","body":{}}' > "$RUNNER_TEMP/private-node-canary.json"
          aws lambda invoke \
            --function-name "$INVOKER_FN" \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$RUNNER_TEMP/private-node-canary.json" \
            "$RUNNER_TEMP/private-node-response.json" >/dev/null
          if ! jq -e '.ok == true and .runtime == "node" and .status == 200 and .response.ok == true and .response.runtime == "aws-background" and .response.database == "ok"' "$RUNNER_TEMP/private-node-response.json" >/dev/null; then
            jq -c '{ok,runtime,status,errorType,errorMessage,response:(if (.response|type)=="object" then {ok:.response.ok,runtime:.response.runtime,database:.response.database,error:.response.error} else {type:(.response|type)} end)}' "$RUNNER_TEMP/private-node-response.json" || true
            exit 1
          fi

      - name: Deployment summary
        run: |
          {
            echo '### AWS background runtime'
            echo ''
            echo '- Runtime: private Next.js standalone Lambda'
            echo '- Region: us-east-1'
            echo '- Public endpoint: none'
            echo '- Supabase credential authority: AWS Virginia service-role secret'
            echo '- Shared app environment: repaired from authoritative Virginia credential before every deploy'
            echo '- Build environment: generated from the authoritative AWS app-environment secret; no Vercel CLI dependency'
            echo '- Runtime Virginia Data API probe: passed'
            echo '- Scheduler Node routing: smoke-tested against private health + database probe'
            echo '- Functional cron behavior: verified separately by each scheduler activation batch probe'
          } >> "$GITHUB_STEP_SUMMARY"
