name: AWS DR scheduler activation

on:
  pull_request:
    paths:
      - 'infra/aws/edge-runtime/dr-schedules.json'
      - '.github/workflows/aws-dr-scheduler-activation.yml'
      - 'infra/aws/edge-runtime/main/index.ts'
  workflow_run:
    workflows: ['AWS scheduler activation']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-dr-scheduler-activation-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-edge-runtime
  VIRGINIA_REF: ftdsltatyqhtllyyefzp
  VIRGINIA_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  OREGON_REF: hnhbzynoyrhjndefbwkh
  OREGON_URL: https://hnhbzynoyrhjndefbwkh.supabase.co
  DR_SECRET_NAME: /theouthaven/production/dr-reconciler/env

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated DR schedule manifest and primary-aware contract
        run: |
          set -euo pipefail
          test "$(jq 'length' infra/aws/edge-runtime/dr-schedules.json)" = '2'
          jq -e 'all(.[]; .function=="dr-standby-reconciler" and (.body.operation=="auth" or .body.operation=="storage"))' infra/aws/edge-runtime/dr-schedules.json >/dev/null
          jq -e 'all(.[]; .name=="dr-auth-standby-reconcile" or .name=="dr-storage-standby-reconcile")' infra/aws/edge-runtime/dr-schedules.json >/dev/null
          grep -F 'oregon_primary' infra/aws/edge-runtime/main/index.ts >/dev/null
          grep -F 'DR_OREGON_ANON_KEY' infra/aws/edge-runtime/main/index.ts >/dev/null

  activate:
    needs: validate
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS account and base scheduler fleet
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(jq 'length' infra/aws/edge-runtime/schedules.json)" = '24'
          verified=0
          while IFS= read -r name; do
            state="$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)"
            test "$state" = 'ENABLED' || { echo "Base production schedule is not enabled: $name" >&2; exit 1; }
            verified=$((verified + 1))
          done < <(jq -r '.[].name' infra/aws/edge-runtime/schedules.json)
          test "$verified" = '24'

      - name: Read authoritative DR primary mode
        id: mode
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id "$DR_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/dr-current.json"
          jq -e 'type=="object"' "$RUNNER_TEMP/dr-current.json" >/dev/null
          mode="$(jq -r '.DR_MODE // empty' "$RUNNER_TEMP/dr-current.json")"
          case "$mode" in
            virginia_primary|promotion_in_progress|oregon_primary|failback_in_progress) ;;
            *) echo "Unsafe or missing DR_MODE: $mode" >&2; exit 1 ;;
          esac
          echo "dr_mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Refresh isolated DR runtime secret for Virginia primary
        if: steps.mode.outputs.dr_mode == 'virginia_primary'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          resolve_key() {
            local ref="$1" name="$2" out="$3"
            curl --fail --silent --show-error --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true" > "$RUNNER_TEMP/keys.json"
            local value
            value="$(jq -r --arg name "$name" '[.[] | select(.type=="legacy" and .name==$name and (.disabled != true))][0].api_key // empty' "$RUNNER_TEMP/keys.json")"
            test -n "$value" || { echo "Missing active $name key for $ref" >&2; exit 1; }
            echo "::add-mask::$value"
            printf '%s' "$value" > "$out"
            chmod 600 "$out"
          }
          resolve_key "$VIRGINIA_REF" service_role "$RUNNER_TEMP/virginia-service"
          resolve_key "$OREGON_REF" service_role "$RUNNER_TEMP/oregon-service"
          resolve_key "$VIRGINIA_REF" anon "$RUNNER_TEMP/virginia-anon"
          resolve_key "$OREGON_REF" anon "$RUNNER_TEMP/oregon-anon"
          jq \
            --arg token "$SUPABASE_ACCESS_TOKEN" \
            --arg vr "$VIRGINIA_REF" --arg vu "$VIRGINIA_URL" --arg vs "$(cat "$RUNNER_TEMP/virginia-service")" --arg va "$(cat "$RUNNER_TEMP/virginia-anon")" \
            --arg or "$OREGON_REF" --arg ou "$OREGON_URL" --arg os "$(cat "$RUNNER_TEMP/oregon-service")" --arg oa "$(cat "$RUNNER_TEMP/oregon-anon")" \
            '. + {
              DR_MODE:"virginia_primary",
              DR_SUPABASE_ACCESS_TOKEN:$token,
              DR_VIRGINIA_REF:$vr,
              DR_VIRGINIA_URL:$vu,
              DR_VIRGINIA_SERVICE_ROLE_KEY:$vs,
              DR_VIRGINIA_ANON_KEY:$va,
              DR_OREGON_REF:$or,
              DR_OREGON_URL:$ou,
              DR_OREGON_SERVICE_ROLE_KEY:$os,
              DR_OREGON_ANON_KEY:$oa,
              DR_STORAGE_DELETE_GRACE_SECONDS:"1800",
              DR_STORAGE_MAX_COPIES_PER_RUN:"50"
            }' "$RUNNER_TEMP/dr-current.json" > "$RUNNER_TEMP/dr-next.json"
          aws secretsmanager put-secret-value --secret-id "$DR_SECRET_NAME" --secret-string "file://$RUNNER_TEMP/dr-next.json" >/dev/null
          rm -f "$RUNNER_TEMP/keys.json" "$RUNNER_TEMP"/*-service "$RUNNER_TEMP"/*-anon "$RUNNER_TEMP/dr-next.json"

      - name: Require passive standby health for Virginia primary
        if: steps.mode.outputs.dr_mode == 'virginia_primary'
        run: |
          set -euo pipefail
          invoker="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          printf '%s' '{"function":"dr-standby-reconciler","body":{"operation":"status","dryRun":true}}' > "$RUNNER_TEMP/status-input.json"
          aws lambda invoke --function-name "$invoker" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/status-input.json" "$RUNNER_TEMP/status-output.json" >/dev/null
          jq -e '.ok==true and .status<400 and .response.success==true and .response.guard.sourceCronJobs==0 and .response.guard.sourceActiveSlots==1 and .response.guard.targetActiveCronJobs==0 and .response.guard.targetReadyTables==462 and .response.guard.targetConnectedWorkers>=1 and .response.auth.parity==true and .response.storage.parity==true' "$RUNNER_TEMP/status-output.json" >/dev/null

      - name: Apply primary-aware DR schedule state
        run: |
          set -euo pipefail
          mode='${{ steps.mode.outputs.dr_mode }}'
          if [ "$mode" = 'virginia_primary' ]; then desired=ENABLED; else desired=DISABLED; fi
          invoker_arn="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          scheduler_role="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"
          while IFS= read -r item; do
            name="$(jq -r '.name' <<<"$item")"
            expression="$(jq -r '.expression' <<<"$item")"
            input="$(jq -c '{function:.function,body:.body}' <<<"$item")"
            target="$(jq -nc --arg arn "$invoker_arn" --arg role "$scheduler_role" --arg input "$input" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:3600,MaximumRetryAttempts:2}}')"
            aws scheduler update-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --schedule-expression "$expression" --flexible-time-window '{"Mode":"OFF"}' --state "$desired" --target "$target" >/dev/null
            test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)" = "$desired"
          done < <(jq -c '.[]' infra/aws/edge-runtime/dr-schedules.json)

      - name: Verify forward dry-run operations when Virginia primary
        if: steps.mode.outputs.dr_mode == 'virginia_primary'
        run: |
          set -euo pipefail
          invoker="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          while IFS= read -r operation; do
            jq -nc --arg operation "$operation" '{function:"dr-standby-reconciler",body:{operation:$operation,dryRun:true}}' > "$RUNNER_TEMP/probe-input.json"
            aws lambda invoke --function-name "$invoker" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/probe-input.json" "$RUNNER_TEMP/probe-output.json" >/dev/null
            jq -e --arg operation "$operation" '.ok==true and .status<400 and .response.success==true and .response.operation==$operation' "$RUNNER_TEMP/probe-output.json" >/dev/null
          done < <(jq -r '.[].body.operation' infra/aws/edge-runtime/dr-schedules.json)

      - name: Fail closed on activation failure
        if: failure()
        run: |
          set -euo pipefail
          invoker_arn="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          scheduler_role="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"
          while IFS= read -r item; do
            name="$(jq -r '.name' <<<"$item")"
            expression="$(jq -r '.expression' <<<"$item")"
            input="$(jq -c '{function:.function,body:.body}' <<<"$item")"
            target="$(jq -nc --arg arn "$invoker_arn" --arg role "$scheduler_role" --arg input "$input" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:3600,MaximumRetryAttempts:2}}')"
            aws scheduler update-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --schedule-expression "$expression" --flexible-time-window '{"Mode":"OFF"}' --state DISABLED --target "$target" >/dev/null || true
          done < <(jq -c '.[]' infra/aws/edge-runtime/dr-schedules.json)

      - name: Activation summary
        if: success()
        run: |
          mode='${{ steps.mode.outputs.dr_mode }}'
          dr_state=DISABLED
          [ "$mode" = 'virginia_primary' ] && dr_state=ENABLED
          {
            echo '### AWS DR scheduler activation'
            echo ''
            echo "- Authoritative DR mode: \`$mode\`"
            echo '- Base scheduler fleet: 24 enabled schedules, unchanged.'
            echo "- Forward Virginia to Oregon DR schedules: \`$dr_state\`."
            echo '- A normal AWS deploy cannot re-enable forward reconciliation while Oregon is primary or a DR transition is in progress.'
            echo '- Supabase pg_cron remains unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*-service "$RUNNER_TEMP"/*-anon