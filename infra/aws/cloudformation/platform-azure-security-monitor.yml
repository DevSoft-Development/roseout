AWSTemplateFormatVersion: '2010-09-09'
Description: TheOutHaven AWS-owned Azure security monitor scheduler.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  GitHubRepository:
    Type: String
    Default: DevSoft-Development/roseout
  MonitorScheduleExpression:
    Type: String
    Default: rate(15 minutes)
  PlatformAlertsTopicArn:
    Type: String
    Default: ''

Conditions:
  HasAlertsTopic: !Not [!Equals [!Ref PlatformAlertsTopicArn, '']]

Resources:
  AzureSecurityDispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenAzureSecurityDispatcher-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: azure-security-dispatcher
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/toh-${Environment}-azure-security-dispatcher:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/theouthaven/credential-vault/${Environment}/github-*

  AzureSecurityDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/toh-${Environment}-azure-security-dispatcher
      RetentionInDays: 30

  AzureSecurityDispatcherFunction:
    Type: AWS::Lambda::Function
    DependsOn: AzureSecurityDispatcherLogGroup
    Properties:
      FunctionName: !Sub toh-${Environment}-azure-security-dispatcher
      Description: Dispatches Azure security monitoring from AWS Scheduler.
      Role: !GetAtt AzureSecurityDispatcherRole.Arn
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 20
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          GITHUB_SECRET_ID: !Sub /theouthaven/credential-vault/${Environment}/github
          GITHUB_REPOSITORY: !Ref GitHubRepository
          EVENT_TYPE: azure-security-monitor
      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError('azure_security_dispatcher_code_not_deployed')

  AzureSecuritySchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenAzureSecurityScheduler-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-azure-security-dispatcher
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AzureSecurityDispatcherFunction.Arn

  AzureSecuritySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub toh-${Environment}-azure-security-monitor
      Description: AWS-owned recurring Azure control-plane security monitor.
      ScheduleExpression: !Ref MonitorScheduleExpression
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt AzureSecurityDispatcherFunction.Arn
        RoleArn: !GetAtt AzureSecuritySchedulerRole.Arn
        Input: '{"source":"aws-scheduler"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 1800
          MaximumRetryAttempts: 2

  AzureSecurityDispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-azure-security-dispatch-errors
      AlarmDescription: Azure security monitor dispatch failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AzureSecurityDispatcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertsTopic
        - [!Ref PlatformAlertsTopicArn]
        - !Ref AWS::NoValue

Outputs:
  DispatcherFunctionName:
    Value: !Ref AzureSecurityDispatcherFunction
  ScheduleName:
    Value: !Ref AzureSecuritySchedule
