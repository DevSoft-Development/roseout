name: AWS deploy role inline policy hygiene

on:
  pull_request:
    paths:
      - '.github/workflows/aws-deploy-role-inline-policy-hygiene.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-deploy-role-inline-policy-hygiene.yml'
  workflow_run:
    workflows: ['AWS platform DR']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-deploy-role-inline-policy-mutation-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: '742020474738'
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate bounded cleanup contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-deploy-role-inline-policy-hygiene.yml'
          grep -F 'TheOutHavenPlatformDeployCore' "$FILE" >/dev/null
          grep -F 'TheOutHavenPlatformDeployDr' "$FILE" >/dev/null
          grep -F 'TheOutHavenPlatformDeployServices' "$FILE" >/dev/null
          grep -F 'TheOutHavenPlatformDeployRuntime' "$FILE" >/dev/null
          grep -F 'list-attached-role-policies' "$FILE" >/dev/null
          grep -F 'list-role-policies' "$FILE" >/dev/null
          grep -F 'get-role-policy' "$FILE" >/dev/null
          grep -F 'delete-role-policy' "$FILE" >/dev/null
          grep -F 'inline_policy_bytes_after' "$FILE" >/dev/null

  clean:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Remove abandoned temporary bootstrap policies and prove bounded size
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-$DEPLOY_ROLE_ARN}"
          ROLE_NAME="${ROLE_ARN##*/}"

          ROLE_STACK="$(aws cloudformation describe-stack-resources \
            --physical-resource-id "$ROLE_NAME" \
            --query 'StackResources[0].StackName' \
            --output text 2>/dev/null || true)"
          if [ -n "$ROLE_STACK" ] && [ "$ROLE_STACK" != "None" ]; then
            STACK_STATUS="$(aws cloudformation describe-stacks \
              --stack-name "$ROLE_STACK" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || true)"
            ATTACHED_COUNT="$(aws iam list-attached-role-policies \
              --role-name "$ROLE_NAME" \
              --query 'length(AttachedPolicies[?starts_with(PolicyName, `TheOutHavenPlatformDeploy`)])' \
              --output text 2>/dev/null || echo 0)"
            if [ "$ATTACHED_COUNT" != 4 ] || { [ "$STACK_STATUS" != "CREATE_COMPLETE" ] && [ "$STACK_STATUS" != "UPDATE_COMPLETE" ] && [ "$STACK_STATUS" != "UPDATE_ROLLBACK_COMPLETE" ]; }; then
              echo "Deploy-role managed-policy migration is not stable (status=$STACK_STATUS managed_policies=$ATTACHED_COUNT); deferring inline-policy hygiene to avoid a quota race."
              exit 0
            fi
          fi

          INSPECTION_POLICY='TheOutHavenInlinePolicyHygieneSelfInspection'
          mapfile -t REQUIRED_MANAGED_POLICIES <<'EOF'
          TheOutHavenPlatformDeployCore
          TheOutHavenPlatformDeployDr
          TheOutHavenPlatformDeployServices
          TheOutHavenPlatformDeployRuntime
          EOF

          cat > "$RUNNER_TEMP/inline-policy-hygiene-self-inspection.json" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"InlinePolicyHygieneSelfInspection",
                "Effect":"Allow",
                "Action":[
                  "iam:ListRolePolicies",
                  "iam:GetRolePolicy",
                  "iam:DeleteRolePolicy"
                ],
                "Resource":"arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole"
              }
            ]
          }
          JSON

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$INSPECTION_POLICY" \
            --policy-document "file://$RUNNER_TEMP/inline-policy-hygiene-self-inspection.json"
          sleep 8

          mapfile -t TEMPORARY_POLICIES <<'EOF'
          TheOutHavenPlatformDrBootstrap
          TheOutHavenSesTelemetryBootstrap
          TheOutHavenWorkerRuntimeBootstrap
          TheOutHavenDnsVerificationBootstrap
          TheOutHavenCloudFormationChangeSetsBootstrap
          TheOutHavenSearchMlBootstrap
          TheOutHavenSesProductionAccessBootstrap
          TheOutHavenOpsCodeBuildBootstrap
          TheOutHavenWebsiteRuntimeBootstrap
          TheOutHavenEdgeRuntimeEcrBootstrap
          TheOutHavenWebsiteAcmBootstrap
          TheOutHavenPlatformDrTargetDiagnosticsBootstrap
          TheOutHavenDomainGatewayBootstrap
          TheOutHavenDomainGatewayAuthorityBootstrap
          EOF

          aws iam list-attached-role-policies --role-name "$ROLE_NAME" --output json > "$RUNNER_TEMP/managed-policies.json"
          for policy in "${REQUIRED_MANAGED_POLICIES[@]}"; do
            jq -e --arg name "$policy" '.AttachedPolicies | any(.PolicyName == $name)' "$RUNNER_TEMP/managed-policies.json" >/dev/null || {
              echo "Canonical managed policy $policy is missing; refusing inline cleanup." >&2
              exit 1
            }
          done

          aws iam list-role-policies --role-name "$ROLE_NAME" --output json > "$RUNNER_TEMP/inline-policies.json"

          before=0
          while IFS= read -r policy; do
            doc="$RUNNER_TEMP/policy-${policy}.json"
            aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$policy" --query PolicyDocument --output json > "$doc"
            bytes="$(jq -c . "$doc" | wc -c | tr -d ' ')"
            before=$((before + bytes))
          done < <(jq -r '.PolicyNames[]' "$RUNNER_TEMP/inline-policies.json")
          echo "inline_policy_bytes_before=$before"

          for policy in "${TEMPORARY_POLICIES[@]}"; do
            if jq -e --arg name "$policy" '.PolicyNames | index($name) != null' "$RUNNER_TEMP/inline-policies.json" >/dev/null; then
              echo "Removing abandoned temporary inline policy: $policy"
              aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name "$policy"
            fi
          done

          aws iam list-role-policies --role-name "$ROLE_NAME" --output json > "$RUNNER_TEMP/inline-policies-after.json"
          after=0
          while IFS= read -r policy; do
            doc="$RUNNER_TEMP/policy-after-${policy}.json"
            aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$policy" --query PolicyDocument --output json > "$doc"
            bytes="$(jq -c . "$doc" | wc -c | tr -d ' ')"
            after=$((after + bytes))
          done < <(jq -r '.PolicyNames[]' "$RUNNER_TEMP/inline-policies-after.json")

          echo "inline_policy_bytes_after=$after"
          test "$after" -lt 10240 || {
            echo "Deploy role inline policies remain at or above the AWS 10,240-byte limit after bounded cleanup." >&2
            exit 1
          }
          for policy in "${REQUIRED_MANAGED_POLICIES[@]}"; do
            jq -e --arg name "$policy" '.AttachedPolicies | any(.PolicyName == $name)' "$RUNNER_TEMP/managed-policies.json" >/dev/null
          done

          aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name "$INSPECTION_POLICY"

      - name: Remove temporary hygiene self-inspection permission
        if: always()
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-$DEPLOY_ROLE_ARN}"
          ROLE_NAME="${ROLE_ARN##*/}"
          aws iam delete-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenInlinePolicyHygieneSelfInspection \
            2>/dev/null || true
