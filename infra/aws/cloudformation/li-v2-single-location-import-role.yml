AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated least-privilege GitHub OIDC role for protected LI V2 single-location import.
Parameters:
  GitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::742020474738:oidc-provider/token.actions.githubusercontent.com
Resources:
  ImportRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TheOutHavenLiV2SingleLocationImportRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:DevSoft-Development/roseout:environment:li-v2-production-import
      Policies:
        - PolicyName: OnlyPrivateLocationImport
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InspectBackgroundStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/theouthaven-background-runtime-production/*
              - Sid: InvokeOnlyBackgroundRuntime
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:us-east-1:${AWS::AccountId}:function:toh-production-background-runtime
              - Sid: ReadOnlyBackgroundAppEnvironment
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:us-west-2:${AWS::AccountId}:secret:/theouthaven/production/platform-dr/app-env-*
Outputs:
  ImportRoleArn:
    Value: !GetAtt ImportRole.Arn
