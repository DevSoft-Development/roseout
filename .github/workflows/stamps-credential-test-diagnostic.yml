name: Stamps credential connection diagnostic

on:
  push:
    branches:
      - fix/stamps-credential-test-diagnostic
    paths:
      - '.github/workflows/stamps-credential-test-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: '742020474738'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve diagnostic configuration
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          INTEGRATION_API_SECRET: ${{ secrets.AWS_PLATFORM_INTEGRATION_API_SECRET }}
          JOB_GATEWAY_SECRET: ${{ secrets.AWS_PLATFORM_JOB_GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          SHARED_SECRET="${INTEGRATION_API_SECRET:-$JOB_GATEWAY_SECRET}"
          test -n "$SHARED_SECRET"
          test "${#SHARED_SECRET}" -ge 32
          echo "::add-mask::$SHARED_SECRET"
          printf '%s' "$SHARED_SECRET" > "$RUNNER_TEMP/integration-api-secret"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Diagnose Stamps connection safely
        run: |
          set -euo pipefail
          STACK='theouthaven-integration-api-production'
          API_URL="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiUrl'].OutputValue" --output text)"
          FUNCTION_NAME="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiFunctionName'].OutputValue" --output text)"
          test -n "$API_URL" && test "$API_URL" != 'None'
          test -n "$FUNCTION_NAME" && test "$FUNCTION_NAME" != 'None'

          # Inspect only secret metadata / configured field names. Never print values.
          SECRET_ID="/theouthaven/credential-vault/production/stamps"
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" >/dev/null 2>&1; then
            SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)"
            CONFIGURED_FIELDS="$(printf '%s' "$SECRET_JSON" | jq -r '[to_entries[] | select(.value|type=="string" and length>0) | .key] | sort | join(",")')"
            echo "vault_secret_exists=true"
            echo "vault_configured_fields=$CONFIGURED_FIELDS"
            unset SECRET_JSON
          else
            echo 'vault_secret_exists=false'
            echo 'vault_configured_fields='
          fi

          SECRET="$(cat "$RUNNER_TEMP/integration-api-secret")"
          BASE_URL="${API_URL%/}"
          PATH_VALUE='/v1/stamps/connection-test'
          BODY_VALUE='{}'
          TIMESTAMP="$(python - <<'PY'
          import time
          print(int(time.time() * 1000))
          PY
          )"
          SIGNATURE="$(SECRET="$SECRET" TIMESTAMP="$TIMESTAMP" PATH_VALUE="$PATH_VALUE" BODY_VALUE="$BODY_VALUE" python - <<'PY'
          import hashlib, hmac, os
          canonical='\n'.join([os.environ['TIMESTAMP'],'POST',os.environ['PATH_VALUE'],os.environ['BODY_VALUE']])
          print(hmac.new(os.environ['SECRET'].encode(), canonical.encode(), hashlib.sha256).hexdigest())
          PY
          )"

          HTTP_STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/stamps-connection.json" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header "x-toh-timestamp: $TIMESTAMP" \
            --header "x-toh-signature: $SIGNATURE" \
            --data "$BODY_VALUE" \
            "$BASE_URL$PATH_VALUE")"
          echo "connection_http_status=$HTTP_STATUS"
          ERROR_CODE="$(jq -r '.error // empty' "$RUNNER_TEMP/stamps-connection.json" 2>/dev/null || true)"
          if [ -n "$ERROR_CODE" ]; then
            case "$ERROR_CODE" in
              stamps_*) echo "connection_error_code=$ERROR_CODE" ;;
              *) echo 'connection_error_code=non_stamps_error' ;;
            esac
          else
            OK="$(jq -r '.ok // false' "$RUNNER_TEMP/stamps-connection.json" 2>/dev/null || echo false)"
            echo "connection_ok=$OK"
          fi
          rm -f "$RUNNER_TEMP/stamps-connection.json" "$RUNNER_TEMP/integration-api-secret"
