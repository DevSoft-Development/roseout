name: Vercel consumer root cutover

on:
  push:
    branches:
      - ops/vercel-consumer-root-cutover-2026-09-19
    paths:
      - .github/workflows/vercel-consumer-root-cutover.yml

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Set Vercel root directory to consumer app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
          VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID" \
            --data '{"rootDirectory":"apps/consumer"}' \
            | jq -e '.rootDirectory == "apps/consumer"' >/dev/null
          echo "Vercel project rootDirectory is apps/consumer."
