name: Azure Front Door final proof

on:
  push:
    branches:
      - ops/frontdoor-failover-drill
    paths:
      - '.github/workflows/azure-frontdoor-final-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve Front Door production targets
        run: |
          set -euo pipefail
          DEPLOYMENT=toh-consumer-runtime-production
          PRIMARY="$(az deployment sub show --name "$DEPLOYMENT" --query properties.outputs.consumerRuntimeFqdn.value -o tsv)"
          SECONDARY="$(az deployment sub show --name "$DEPLOYMENT" --query properties.outputs.consumerSecondaryRuntimeFqdn.value -o tsv)"
          EDGE="$(az deployment sub show --name "$DEPLOYMENT" --query properties.outputs.consumerFrontDoorEndpointHostName.value -o tsv)"
          IMAGE_SHA="$(az deployment sub show --name "$DEPLOYMENT" --query properties.outputs.consumerRuntimeImage.value -o tsv | sed 's#^.*consumer:##')"
          test -n "$PRIMARY" && test -n "$SECONDARY" && test -n "$EDGE" && test -n "$IMAGE_SHA"
          printf 'PRIMARY_HOST=%s\nSECONDARY_HOST=%s\nEDGE_HOST=%s\nIMAGE_SHA=%s\n' "$PRIMARY" "$SECONDARY" "$EDGE" "$IMAGE_SHA" > .azure-frontdoor-proof.env
      - name: Prove primary origin directly
        run: |
          set -euo pipefail
          source .azure-frontdoor-proof.env
          python3 .github/scripts/prove-azure-frontdoor.py --host "$PRIMARY_HOST" --sha "$IMAGE_SHA" --roles primary --attempts 12 --interval 5 --label "direct primary"
      - name: Prove secondary origin directly
        run: |
          set -euo pipefail
          source .azure-frontdoor-proof.env
          python3 .github/scripts/prove-azure-frontdoor.py --host "$SECONDARY_HOST" --sha "$IMAGE_SHA" --roles secondary --attempts 12 --interval 5 --label "direct secondary"
      - name: Prove Front Door edge
        run: |
          set -euo pipefail
          source .azure-frontdoor-proof.env
          python3 .github/scripts/prove-azure-frontdoor.py --host "$EDGE_HOST" --sha "$IMAGE_SHA" --roles primary,secondary --attempts 30 --interval 5 --label "Front Door edge"
      - name: Record proof
        run: |
          {
            echo "## Azure Front Door final proof"
            echo
            echo "- Primary direct proof: PASS"
            echo "- Secondary direct proof: PASS"
            echo "- Front Door edge proof: PASS"
            echo "- SHA: $IMAGE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
