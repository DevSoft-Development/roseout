name: Oregon DR explicit failback

on:
  pull_request:
    paths:
      - '.github/workflows/oregon-dr-failback.yml'
      - 'scripts/dr/oregon-failback.sh'
      - '.github/workflows/oregon-dr-failback-preflight.yml'
      - '.github/workflows/aws-dr-failback-reconcile.yml'
      - 'scripts/dr/promotion-sequence-state.sql'
      - 'scripts/dr/writable-catalog.sql'
      - 'docs/runbooks/oregon-dr-failback.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oregon-dr-failback.yml'
      - 'scripts/dr/oregon-failback.sh'
      - 'docs/runbooks/oregon-dr-failback.md'
  workflow_dispatch:
    inputs:
      action:
        description: Failback phase
        type: choice
        required: true
        default: prepare
        options: [prepare, failback]
      oregon_writes_quiesced:
        description: Required only for final failback; confirm Oregon application writes are quiesced
        type: boolean
        required: true
        default: false
      confirmation:
        description: PREPARE_FAILBACK, FAILBACK_VIRGINIA, or RECOVER_FAILBACK_VIRGINIA for guarded fail-closed recovery
        type: string
        required: true
        default: ''
      fail_closed_recovery:
        description: Resume a previously fail-closed final failback; requires RECOVER_FAILBACK_VIRGINIA
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: oregon-dr-explicit-failback-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-edge-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate failback operator contract
        run: |
          set -euo pipefail
          bash -n scripts/dr/oregon-failback.sh
          base_expected="$(jq 'length' infra/aws/edge-runtime/schedules.json)"
          test "$base_expected" -ge 24
          test "$(jq -r '.[].name' infra/aws/edge-runtime/schedules.json | sort | uniq | wc -l | tr -d ' ')" = "$base_expected"
          test "$(jq 'length' infra/aws/edge-runtime/dr-schedules.json)" = '2'
          test -f scripts/dr/promotion-sequence-state.sql
          test -f scripts/dr/writable-catalog.sql
          grep -F 'PREPARE_FAILBACK' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'FAILBACK_VIRGINIA' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'RECOVER_FAILBACK_VIRGINIA' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'FAIL_CLOSED_RECOVERY' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'failback_in_progress' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'theouthaven_failback_publication' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'theouthaven_or_to_va_failback' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'copy_data=true' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'copy_data=false' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'run_as_owner=true' scripts/dr/oregon-failback.sh >/dev/null
          ! grep -F 'run_as_owner=false' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'password null' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'rolcanlogin' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'rolbypassrls' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'set role ${FAILBACK_SUBSCRIBER_ROLE}' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'subrunasowner' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'with inherit false, set true' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'granted by postgres' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'temporary_set_grants==0' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'grant execute on all functions in schema public, fraud_internal, private' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'schema_usage_gaps==0' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'routine_execute_gaps==0' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'reverse-detach-owner.json' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'reverse-detach-owner-contract.json' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'Temporary reverse-detach SET ROLE grant was not removed.' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'default_transaction_read_only=on' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'DR_PRIMARY_EPOCH' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'slot_name = NONE' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'reauthentication_required' scripts/dr/oregon-failback.sh >/dev/null
          grep -F "if: github.event_name == 'workflow_dispatch'" .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'Harden final failback runtime script' .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'env_type()' .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'legacy_type' .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'reverse_cleanup_stage=publication' .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'reverse_cleanup_stage=source_membership' .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'reverse_cleanup_stage=target_membership' .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'grant ${FAILBACK_REPLICATION_ROLE} to postgres with inherit false, set true' .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'grant ${FAILBACK_SUBSCRIBER_ROLE} to postgres with inherit false, set true' .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'reverse_cleanup=complete' .github/workflows/oregon-dr-failback.yml >/dev/null

  execute:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Harden final failback runtime script
        if: github.event.inputs.action == 'failback'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/dr/oregon-failback.sh')
          text = path.read_text()

          old = '''  jq -n --arg url "$VIRGINIA_URL" --arg anon "$virginia_anon" --arg service "$virginia_service" '[
            {key:"NEXT_PUBLIC_SUPABASE_URL",value:$url,type:"encrypted",target:["production"]},
            {key:"NEXT_PUBLIC_SUPABASE_ANON_KEY",value:$anon,type:"encrypted",target:["production"]},
            {key:"SUPABASE_SERVICE_ROLE_KEY",value:$service,type:"encrypted",target:["production"]},
            {key:"SUPABASE_URL",value:$url,type:"encrypted",target:["production"]}
          ]' > "$TMP/vercel-env-upsert.json"
          '''
          new = '''  curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" \\
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}&decrypt=true" > "$TMP/vercel-env-before-failback.json"
          env_type() { jq -r --arg key "$1" '[.envs[]|select(.key==$key and .target==["production"])][0].type // "encrypted"' "$TMP/vercel-env-before-failback.json"; }
          jq -n --arg url "$VIRGINIA_URL" --arg anon "$virginia_anon" --arg service "$virginia_service" \\
            --arg url_type "$(env_type NEXT_PUBLIC_SUPABASE_URL)" --arg anon_type "$(env_type NEXT_PUBLIC_SUPABASE_ANON_KEY)" --arg service_type "$(env_type SUPABASE_SERVICE_ROLE_KEY)" \\
            '[{key:"NEXT_PUBLIC_SUPABASE_URL",value:$url,type:$url_type,target:["production"]},{key:"NEXT_PUBLIC_SUPABASE_ANON_KEY",value:$anon,type:$anon_type,target:["production"]},{key:"SUPABASE_SERVICE_ROLE_KEY",value:$service,type:$service_type,target:["production"]}]' > "$TMP/vercel-env-upsert.json"
          if [ "$(jq '[.envs[]|select(.key=="SUPABASE_URL" and .target==["production"])]|length' "$TMP/vercel-env-before-failback.json")" = '1' ]; then
            legacy_type="$(env_type SUPABASE_URL)"
            jq --arg url "$VIRGINIA_URL" --arg type "$legacy_type" '. + [{key:"SUPABASE_URL",value:$url,type:$type,target:["production"]}]' "$TMP/vercel-env-upsert.json" > "$TMP/vercel-env-upsert2.json"
            mv "$TMP/vercel-env-upsert2.json" "$TMP/vercel-env-upsert.json"
          fi
          '''
          if old not in text:
              raise SystemExit('Expected failback Vercel env block not found; refusing runtime patch')
          text = text.replace(old, new, 1)

          cleanup_old = '''  query_ref "$OREGON_REF" "select pg_drop_replication_slot('${FAILBACK_SLOT}') where exists(select 1 from pg_replication_slots where slot_name='${FAILBACK_SLOT}'); drop publication if exists ${FAILBACK_PUBLICATION}; drop owned by ${FAILBACK_REPLICATION_ROLE}; drop role if exists ${FAILBACK_REPLICATION_ROLE};" "$TMP/reverse-source-clean.json"
          query_ref "$VIRGINIA_REF" "drop owned by ${FAILBACK_SUBSCRIBER_ROLE}; drop role if exists ${FAILBACK_SUBSCRIBER_ROLE};" "$TMP/reverse-target-clean.json"
          '''
          cleanup_new = '''  echo 'reverse_cleanup_stage=slot'
          query_ref "$OREGON_REF" "select pg_drop_replication_slot('${FAILBACK_SLOT}') where exists(select 1 from pg_replication_slots where slot_name='${FAILBACK_SLOT}');" "$TMP/reverse-slot-drop.json"
          echo 'reverse_cleanup_stage=publication'
          query_ref "$OREGON_REF" "drop publication if exists ${FAILBACK_PUBLICATION};" "$TMP/reverse-publication-drop.json"
          query_ref "$OREGON_REF" "select count(*) roles from pg_roles where rolname='${FAILBACK_REPLICATION_ROLE}';" "$TMP/reverse-source-role-state.json"
          test "$(jq -r '.[0].roles' "$TMP/reverse-source-role-state.json")" = '0' -o "$(jq -r '.[0].roles' "$TMP/reverse-source-role-state.json")" = '1'
          if [ "$(jq -r '.[0].roles' "$TMP/reverse-source-role-state.json")" = '1' ]; then
            echo 'reverse_cleanup_stage=source_membership'
            query_ref "$OREGON_REF" "grant ${FAILBACK_REPLICATION_ROLE} to postgres with inherit false, set true;" "$TMP/reverse-source-membership-grant.json"
            echo 'reverse_cleanup_stage=source_owned'
            query_ref "$OREGON_REF" "set role ${FAILBACK_REPLICATION_ROLE}; drop owned by ${FAILBACK_REPLICATION_ROLE}; reset role;" "$TMP/reverse-source-owned-drop.json"
            query_ref "$OREGON_REF" "revoke ${FAILBACK_REPLICATION_ROLE} from postgres granted by postgres;" "$TMP/reverse-source-membership-revoke.json"
            echo 'reverse_cleanup_stage=source_role'
            query_ref "$OREGON_REF" "drop role ${FAILBACK_REPLICATION_ROLE};" "$TMP/reverse-source-role-drop.json"
          fi
          query_ref "$VIRGINIA_REF" "select count(*) roles from pg_roles where rolname='${FAILBACK_SUBSCRIBER_ROLE}';" "$TMP/reverse-target-role-state.json"
          test "$(jq -r '.[0].roles' "$TMP/reverse-target-role-state.json")" = '0' -o "$(jq -r '.[0].roles' "$TMP/reverse-target-role-state.json")" = '1'
          if [ "$(jq -r '.[0].roles' "$TMP/reverse-target-role-state.json")" = '1' ]; then
            echo 'reverse_cleanup_stage=target_membership'
            query_ref "$VIRGINIA_REF" "grant ${FAILBACK_SUBSCRIBER_ROLE} to postgres with inherit false, set true;" "$TMP/reverse-target-membership-grant.json"
            echo 'reverse_cleanup_stage=target_owned'
            query_ref "$VIRGINIA_REF" "set role ${FAILBACK_SUBSCRIBER_ROLE}; drop owned by ${FAILBACK_SUBSCRIBER_ROLE}; reset role;" "$TMP/reverse-target-owned-drop.json"
            query_ref "$VIRGINIA_REF" "revoke ${FAILBACK_SUBSCRIBER_ROLE} from postgres granted by postgres;" "$TMP/reverse-target-membership-revoke.json"
            echo 'reverse_cleanup_stage=target_role'
            query_ref "$VIRGINIA_REF" "drop role ${FAILBACK_SUBSCRIBER_ROLE};" "$TMP/reverse-target-role-drop.json"
          fi
          query_ref "$OREGON_REF" "select (select count(*) from pg_replication_slots where slot_name='${FAILBACK_SLOT}') slots,(select count(*) from pg_publication where pubname='${FAILBACK_PUBLICATION}') publications,(select count(*) from pg_roles where rolname='${FAILBACK_REPLICATION_ROLE}') roles;" "$TMP/reverse-source-clean.json"
          query_ref "$VIRGINIA_REF" "select (select count(*) from pg_subscription where subname='${FAILBACK_SUBSCRIPTION}') subscriptions,(select count(*) from pg_roles where rolname='${FAILBACK_SUBSCRIBER_ROLE}') roles;" "$TMP/reverse-target-clean.json"
          jq -e '.[0].slots==0 and .[0].publications==0 and .[0].roles==0' "$TMP/reverse-source-clean.json" >/dev/null
          jq -e '.[0].subscriptions==0 and .[0].roles==0' "$TMP/reverse-target-clean.json" >/dev/null
          echo 'reverse_cleanup=complete'
          '''
          if cleanup_old not in text:
              raise SystemExit('Expected combined reverse cleanup block not found; refusing runtime patch')
          text = text.replace(cleanup_old, cleanup_new, 1)
          path.write_text(text)
          PY
          grep -F 'env_type()' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'legacy_type' scripts/dr/oregon-failback.sh >/dev/null
          ! grep -F '{key:"SUPABASE_URL",value:$url,type:"encrypted",target:["production"]}' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'reverse_cleanup_stage=publication' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'reverse_cleanup_stage=source_membership' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'reverse_cleanup_stage=target_membership' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'set role ${FAILBACK_REPLICATION_ROLE}; drop owned by ${FAILBACK_REPLICATION_ROLE}; reset role;' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'set role ${FAILBACK_SUBSCRIBER_ROLE}; drop owned by ${FAILBACK_SUBSCRIBER_ROLE}; reset role;' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'reverse_cleanup=complete' scripts/dr/oregon-failback.sh >/dev/null
          ! grep -F "drop publication if exists \${FAILBACK_PUBLICATION}; drop owned by \${FAILBACK_REPLICATION_ROLE}" scripts/dr/oregon-failback.sh >/dev/null
          bash -n scripts/dr/oregon-failback.sh

      - name: Execute explicit failback phase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OREGON_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
          OREGON_WRITES_QUIESCED: ${{ github.event.inputs.oregon_writes_quiesced }}
          FAIL_CLOSED_RECOVERY: ${{ github.event.inputs.fail_closed_recovery || 'false' }}
        run: bash scripts/dr/oregon-failback.sh '${{ github.event.inputs.action }}'

      - name: Fail closed if final failback fails
        if: failure() && github.event.inputs.action == 'failback'
        run: |
          set -euo pipefail
          for manifest in infra/aws/edge-runtime/schedules.json infra/aws/edge-runtime/dr-schedules.json; do
            while IFS= read -r name; do
              aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" > "$RUNNER_TEMP/current-schedule.json" || continue
              expression="$(jq -r '.ScheduleExpression' "$RUNNER_TEMP/current-schedule.json")"
              window="$(jq -c '.FlexibleTimeWindow' "$RUNNER_TEMP/current-schedule.json")"
              target="$(jq -c '.Target' "$RUNNER_TEMP/current-schedule.json")"
              aws scheduler update-schedule --group-name "$SCHEDULE_GROUP" --name "$name" \
                --schedule-expression "$expression" --flexible-time-window "$window" \
                --state DISABLED --target "$target" >/dev/null || true
            done < <(jq -r '.[].name' "$manifest")
          done
          echo 'Final failback failed closed: base and forward DR schedules are disabled. No automatic database or traffic rollback was attempted.' >> "$GITHUB_STEP_SUMMARY"
