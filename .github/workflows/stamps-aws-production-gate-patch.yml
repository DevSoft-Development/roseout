name: Apply Stamps AWS production gate

on:
  push:
    branches:
      - fix/stamps-aws-production-print-gate
    paths:
      - scripts/dev/apply_stamps_aws_production_gate.py
      - .github/workflows/stamps-aws-production-gate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stamps-aws-production-print-gate
      - name: Normalize deterministic generator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/dev/apply_stamps_aws_production_gate.py')
          text = path.read_text()
          line = '''replace_once(workflow, "      - 'infra/aws/lambda/telnyx_provider.py'\\n", "      - 'infra/aws/lambda/telnyx_provider.py'\\n      - 'infra/aws/lambda/stamps_provider.py'\\n")'''
          pair = line + "\n" + line
          replacement = '''workflow_content = read(workflow)\ntrigger_line = "      - 'infra/aws/lambda/telnyx_provider.py'\\n"\nif workflow_content.count(trigger_line) != 2:\n    raise RuntimeError(f"{workflow}: expected two Telnyx provider trigger lines")\nworkflow_content = workflow_content.replace(trigger_line, trigger_line + "      - 'infra/aws/lambda/stamps_provider.py'\\n")\nwrite(workflow, workflow_content)'''
          if pair not in text:
              raise SystemExit('Expected duplicate trigger insertion block was not found')
          path.write_text(text.replace(pair, replacement, 1))
          PY
      - name: Apply migration
        run: python scripts/dev/apply_stamps_aws_production_gate.py
      - name: Validate Python
        run: |
          python -m py_compile infra/aws/lambda/platform_integration_api.py
          python -m py_compile infra/aws/lambda/stamps_provider.py
      - name: Validate patch integrity
        run: |
          test ! -e lib/stamps-production-postcard.ts
          grep -q 'production SOAP calls must run through the AWS Integration API' lib/stamps-postcard.ts
          grep -q '/v1/stamps/postcard/production-proof' infra/aws/lambda/platform_integration_api.py
          grep -q 'production-proofs/${id}' 'app/admin/dashboard/operations/mailing-batches/[id]/print/page.tsx'
          git diff --check
      - name: Prepare non-workflow commit
        run: |
          git checkout -- .github/workflows/aws-integration-api.yml
          rm -rf infra/aws/lambda/__pycache__
          rm -f scripts/dev/apply_stamps_aws_production_gate.py
      - name: Commit generated migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Move live Stamps proof execution fully to AWS'
          git push origin HEAD:fix/stamps-aws-production-print-gate
