name: AWS website wildcard certificate

on:
  pull_request:
    paths:
      - '.github/workflows/aws-website-wildcard-certificate.yml'
      - 'scripts/website-wildcard-certificate-regression.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aws-website-wildcard-certificate.yml'
      - 'scripts/website-wildcard-certificate-regression.mjs'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  CERTIFICATE_DOMAIN: '*.theouthaven.com'
  ROOT_DOMAIN: theouthaven.com

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate wildcard certificate DNS safety contract
        run: node scripts/website-wildcard-certificate-regression.mjs

  bootstrap:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Resolve AWS deploy role
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          echo "role_arn=${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || { echo "Wrong AWS account: $ACCOUNT" >&2; exit 1; }

      - name: Repair ACM validation bootstrap permissions
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          POLICY_FILE="$RUNNER_TEMP/website-acm-bootstrap-policy.json"
          cat > "$POLICY_FILE" <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "acm:RequestCertificate",
                  "acm:ListCertificates",
                  "acm:DescribeCertificate",
                  "acm:AddTagsToCertificate",
                  "acm:ListTagsForCertificate",
                  "route53:ListHostedZones",
                  "route53:ListResourceRecordSets",
                  "route53:ChangeResourceRecordSets",
                  "route53:GetChange"
                ],
                "Resource": "*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenWebsiteAcmBootstrap \
            --policy-document "file://$POLICY_FILE"
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenWebsiteAcmBootstrap \
            --query 'PolicyName' --output text >/dev/null
          sleep 8

      - name: Request or reuse wildcard certificate
        id: certificate
        run: |
          set -euo pipefail
          ARN="$(aws acm list-certificates \
            --certificate-statuses ISSUED PENDING_VALIDATION \
            --query "CertificateSummaryList[?DomainName=='${CERTIFICATE_DOMAIN}'] | [0].CertificateArn" \
            --output text)"

          CREATED=false
          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            ARN="$(aws acm request-certificate \
              --domain-name "$CERTIFICATE_DOMAIN" \
              --validation-method DNS \
              --key-algorithm RSA_2048 \
              --options CertificateTransparencyLoggingPreference=ENABLED \
              --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production Key=Service,Value=WebsiteHosting Key=Purpose,Value=WildcardTenantDomains \
              --query CertificateArn --output text)"
            CREATED=true
          fi

          test -n "$ARN" && test "$ARN" != "None"
          echo "certificate_arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 20); do
            NAME="$(aws acm describe-certificate --certificate-arn "$ARN" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Name' --output text 2>/dev/null || true)"
            VALUE="$(aws acm describe-certificate --certificate-arn "$ARN" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Value' --output text 2>/dev/null || true)"
            if [ -n "$NAME" ] && [ "$NAME" != "None" ] && [ -n "$VALUE" ] && [ "$VALUE" != "None" ]; then
              break
            fi
            sleep 3
          done

          STATUS="$(aws acm describe-certificate --certificate-arn "$ARN" --query 'Certificate.Status' --output text)"
          NAME="$(aws acm describe-certificate --certificate-arn "$ARN" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Name' --output text)"
          VALUE="$(aws acm describe-certificate --certificate-arn "$ARN" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Value' --output text)"

          test -n "$NAME" && test "$NAME" != "None" || { echo "ACM DNS validation name is not available yet" >&2; exit 1; }
          test -n "$VALUE" && test "$VALUE" != "None" || { echo "ACM DNS validation value is not available yet" >&2; exit 1; }

          NAME_NO_DOT="${NAME%.}"
          VALUE_NO_DOT="${VALUE%.}"
          case "$NAME_NO_DOT" in
            _*.theouthaven.com) ;;
            *) echo "Refusing unexpected ACM validation name: $NAME" >&2; exit 1 ;;
          esac
          case "$VALUE_NO_DOT" in
            _*.acm-validations.aws) ;;
            *) echo "Refusing unexpected ACM validation target: $VALUE" >&2; exit 1 ;;
          esac

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "validation_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "validation_value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Resolve public Route 53 hosted zone
        id: dns
        run: |
          set -euo pipefail
          aws route53 list-hosted-zones > "$RUNNER_TEMP/hosted-zones.json"
          HOSTED_ZONE_ID="$(jq -r --arg name "${ROOT_DOMAIN}." '[.HostedZones[] | select(.Name==$name and .Config.PrivateZone==false)][0].Id // empty' "$RUNNER_TEMP/hosted-zones.json" | sed 's#^/hostedzone/##')"
          test -n "$HOSTED_ZONE_ID" || { echo "Public Route 53 hosted zone for $ROOT_DOMAIN was not found." >&2; exit 1; }
          echo "hosted_zone_id=$HOSTED_ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish only ACM validation CNAME
        id: publish
        env:
          HOSTED_ZONE_ID: ${{ steps.dns.outputs.hosted_zone_id }}
          VALIDATION_NAME: ${{ steps.certificate.outputs.validation_name }}
          VALIDATION_VALUE: ${{ steps.certificate.outputs.validation_value }}
        run: |
          set -euo pipefail
          NAME="${VALIDATION_NAME%.}"
          VALUE="${VALIDATION_VALUE%.}"
          case "$NAME" in
            _*.theouthaven.com) ;;
            *) echo "Refusing non-ACM DNS name: $NAME" >&2; exit 1 ;;
          esac
          case "$VALUE" in
            _*.acm-validations.aws) ;;
            *) echo "Refusing non-ACM DNS target: $VALUE" >&2; exit 1 ;;
          esac

          jq -n \
            --arg name "$NAME" \
            --arg value "$VALUE" \
            '{Comment:"ACM wildcard certificate DNS validation only",Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:$name,Type:"CNAME",TTL:300,ResourceRecords:[{Value:$value}]}}]}' \
            > "$RUNNER_TEMP/acm-validation-change.json"

          CHANGE_ID="$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch "file://$RUNNER_TEMP/acm-validation-change.json" \
            --query 'ChangeInfo.Id' --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
          echo "change_id=$CHANGE_ID" >> "$GITHUB_OUTPUT"

      - name: Verify public ACM validation CNAME
        env:
          VALIDATION_NAME: ${{ steps.certificate.outputs.validation_name }}
          EXPECTED_VALUE: ${{ steps.certificate.outputs.validation_value }}
        run: |
          set -euo pipefail
          NAME="${VALIDATION_NAME%.}"
          EXPECTED="${EXPECTED_VALUE%.}"
          for attempt in $(seq 1 30); do
            RESOLVED="$(dig +short CNAME "$NAME" | sed 's/\.$//' | head -n 1)"
            if [ "$RESOLVED" = "$EXPECTED" ]; then
              echo "ACM_DNS published=true match=true name=$NAME"
              exit 0
            fi
            sleep 10
          done
          echo "ACM validation CNAME did not propagate with the expected value." >&2
          exit 1

      - name: Wait for ACM certificate issuance
        env:
          CERTIFICATE_ARN: ${{ steps.certificate.outputs.certificate_arn }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STATUS="$(aws acm describe-certificate --certificate-arn "$CERTIFICATE_ARN" --query 'Certificate.Status' --output text)"
            if [ "$STATUS" = "ISSUED" ]; then
              echo "Wildcard ACM certificate is issued: $CERTIFICATE_ARN"
              {
                echo '### TheOutHaven wildcard certificate'
                echo ''
                echo '- Status: `ISSUED`'
                echo '- ACM validation CNAME: `PUBLISHED`'
                echo '- Application traffic DNS records changed: `NO`'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$STATUS" != "PENDING_VALIDATION" ]; then
              echo "ACM entered unexpected status: $STATUS" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for ACM certificate issuance.' >&2
          exit 1
