name: AWS scheduler manifest activation

on:
  pull_request:
    paths:
      - 'infra/aws/edge-runtime/activation.json'
      - '.github/workflows/aws-scheduler-manifest-activation.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/edge-runtime/activation.json'
      - '.github/workflows/aws-scheduler-manifest-activation.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-scheduler-activation-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-edge-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scheduler manifest contract
        run: |
          set -euo pipefail
          ACTIVATION='infra/aws/edge-runtime/activation.json'
          SCHEDULES='infra/aws/edge-runtime/schedules.json'
          jq -e '(.enabled | type == "array") and (.rollback_enabled | type == "array") and (.probe | type == "array")' "$ACTIVATION" >/dev/null
          jq -e --slurpfile schedules "$SCHEDULES" '
            . as $manifest |
            all($manifest.enabled[]; . as $name | any($schedules[0][]; .name == $name)) and
            all($manifest.rollback_enabled[]; . as $name | any($schedules[0][]; .name == $name)) and
            all($manifest.rollback_enabled[]; . as $name | any($manifest.enabled[]; . == $name)) and
            all($manifest.probe[]; . as $name | any($manifest.enabled[]; . == $name))
          ' "$ACTIVATION" >/dev/null
          if [ "$(jq -r '.batch' "$ACTIVATION")" = '9' ]; then
            node scripts/validate-cron-event-driven-batch9.mjs
          fi

  activate:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove push is scheduler-control-plane only
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | sort > "$RUNNER_TEMP/changed.txt"
          test -s "$RUNNER_TEMP/changed.txt"
          while IFS= read -r PATHNAME; do
            case "$PATHNAME" in
              infra/aws/edge-runtime/activation.json|.github/workflows/aws-scheduler-manifest-activation.yml)
                ;;
              *)
                echo "Refusing push activation because runtime/schedule code also changed: $PATHNAME" >&2
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Apply activation allowlist
        id: apply
        run: |
          set -euo pipefail
          ACTIVATION='infra/aws/edge-runtime/activation.json'
          SCHEDULES='infra/aws/edge-runtime/schedules.json'
          INVOKER_ARN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          SCHEDULER_ROLE="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"

          while IFS= read -r item; do
            NAME="$(jq -r '.name' <<<"$item")"
            EXPRESSION="$(jq -r '.expression' <<<"$item")"
            INPUT="$(jq -c '{function:.function,body:.body}' <<<"$item")"
            if jq -e --arg name "$NAME" '.enabled | index($name) != null' "$ACTIVATION" >/dev/null; then
              DESIRED_STATE=ENABLED
            else
              DESIRED_STATE=DISABLED
            fi
            TARGET="$(jq -nc --arg arn "$INVOKER_ARN" --arg role "$SCHEDULER_ROLE" --arg input "$INPUT" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:3600,MaximumRetryAttempts:2}}')"
            aws scheduler update-schedule \
              --group-name "$SCHEDULE_GROUP" \
              --name "$NAME" \
              --schedule-expression "$EXPRESSION" \
              --flexible-time-window '{"Mode":"OFF"}' \
              --state "$DESIRED_STATE" \
              --target "$TARGET" >/dev/null
          done < <(jq -c '.[]' "$SCHEDULES")

      - name: Verify exact AWS schedule state
        run: |
          set -euo pipefail
          ACTIVATION='infra/aws/edge-runtime/activation.json'
          SCHEDULES='infra/aws/edge-runtime/schedules.json'
          jq -r '.[].name' "$SCHEDULES" | sort > "$RUNNER_TEMP/expected.txt"
          : > "$RUNNER_TEMP/enabled-actual.txt"
          while IFS= read -r NAME; do
            STATE="$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$NAME" --query State --output text)"
            if [ "$STATE" = 'ENABLED' ]; then
              echo "$NAME" >> "$RUNNER_TEMP/enabled-actual.txt"
            else
              test "$STATE" = 'DISABLED'
            fi
          done < "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/enabled-actual.txt" "$RUNNER_TEMP/enabled-actual.txt"
          jq -r '.enabled[]' "$ACTIVATION" | sort > "$RUNNER_TEMP/enabled-expected.txt"
          diff -u "$RUNNER_TEMP/enabled-expected.txt" "$RUNNER_TEMP/enabled-actual.txt"

      - name: Probe only the new activation batch
        run: |
          set -euo pipefail
          ACTIVATION='infra/aws/edge-runtime/activation.json'
          SCHEDULES='infra/aws/edge-runtime/schedules.json'
          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          while IFS= read -r NAME; do
            echo "probing=${NAME}"
            ITEM="$(jq -c --arg name "$NAME" '.[] | select(.name == $name)' "$SCHEDULES")"
            test -n "$ITEM"
            jq -c '{function:.function,body:.body}' <<<"$ITEM" > "$RUNNER_TEMP/probe-input.json"
            aws lambda invoke \
              --function-name "$INVOKER_FN" \
              --cli-binary-format raw-in-base64-out \
              --payload "fileb://$RUNNER_TEMP/probe-input.json" \
              "$RUNNER_TEMP/probe-output.json" >/dev/null
            if ! jq -e '.ok == true and (.status // 200) < 400 and (.response.success // true) != false' "$RUNNER_TEMP/probe-output.json" >/dev/null; then
              echo "probe_failed=${NAME}" >&2
              jq -c '{ok,runtime,function,target,status,errorType,errorMessage,response}' "$RUNNER_TEMP/probe-output.json" || true
              exit 1
            fi
            echo "probe_passed=${NAME}"
          done < <(jq -r '.probe[]' "$ACTIVATION")

      - name: Restore previous scheduler fleet on activation failure
        if: failure() && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        run: |
          set -euo pipefail
          ACTIVATION='infra/aws/edge-runtime/activation.json'
          SCHEDULES='infra/aws/edge-runtime/schedules.json'
          INVOKER_ARN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          SCHEDULER_ROLE="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"
          while IFS= read -r item; do
            NAME="$(jq -r '.name' <<<"$item")"
            EXPRESSION="$(jq -r '.expression' <<<"$item")"
            INPUT="$(jq -c '{function:.function,body:.body}' <<<"$item")"
            if jq -e --arg name "$NAME" '.rollback_enabled | index($name) != null' "$ACTIVATION" >/dev/null; then
              DESIRED_STATE=ENABLED
            else
              DESIRED_STATE=DISABLED
            fi
            TARGET="$(jq -nc --arg arn "$INVOKER_ARN" --arg role "$SCHEDULER_ROLE" --arg input "$INPUT" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:3600,MaximumRetryAttempts:2}}')"
            aws scheduler update-schedule \
              --group-name "$SCHEDULE_GROUP" \
              --name "$NAME" \
              --schedule-expression "$EXPRESSION" \
              --flexible-time-window '{"Mode":"OFF"}' \
              --state "$DESIRED_STATE" \
              --target "$TARGET" >/dev/null
          done < <(jq -c '.[]' "$SCHEDULES")
          jq -r '.rollback_enabled[]' "$ACTIVATION" | sort > "$RUNNER_TEMP/rollback-expected.txt"
          : > "$RUNNER_TEMP/rollback-actual.txt"
          while IFS= read -r NAME; do
            STATE="$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$NAME" --query State --output text)"
            if [ "$STATE" = 'ENABLED' ]; then
              echo "$NAME" >> "$RUNNER_TEMP/rollback-actual.txt"
            else
              test "$STATE" = 'DISABLED'
            fi
          done < <(jq -r '.[].name' "$SCHEDULES" | sort)
          sort -o "$RUNNER_TEMP/rollback-actual.txt" "$RUNNER_TEMP/rollback-actual.txt"
          diff -u "$RUNNER_TEMP/rollback-expected.txt" "$RUNNER_TEMP/rollback-actual.txt"

      - name: Activation summary
        if: success()
        run: |
          ENABLED_COUNT="$(jq '.enabled | length' infra/aws/edge-runtime/activation.json)"
          PROBE_NAMES="$(jq -r '.probe | join(", ")' infra/aws/edge-runtime/activation.json)"
          {
            echo '### AWS scheduler manifest activation'
            echo ''
            echo "- Enabled schedules: ${ENABLED_COUNT}"
            echo "- Release probes: ${PROBE_NAMES}"
            echo '- Push classified as scheduler-control-plane only.'
            echo '- Fail-closed rollback remains enabled.'
          } >> "$GITHUB_STEP_SUMMARY"
