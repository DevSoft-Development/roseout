name: Supabase baseline transaction split

on:
  workflow_dispatch:
  push:
    branches:
      - fix/supabase-migration-history-alignment
    paths:
      - '.github/workflows/supabase-baseline-split-access-parity.yml'

permissions:
  contents: write

env:
  SUPABASE_CLI_VERSION: 2.111.0

jobs:
  split-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-migration-history-alignment

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      - name: Discover migration command
        run: |
          set -euo pipefail
          supabase migration new --help >/dev/null

      - name: Split access parity into its own canonical migration
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          test "${#migrations[@]}" -eq 1 || {
            echo "Expected one active migration before split; found ${#migrations[@]}" >&2
            exit 1
          }
          baseline="${migrations[0]}"
          case "$baseline" in
            *_virginia_schema_baseline.sql) ;;
            *) echo "Unexpected baseline: $baseline" >&2; exit 1 ;;
          esac

          begin_marker='-- BEGIN GENERATED PRODUCTION ACCESS PARITY'
          end_marker='-- END GENERATED PRODUCTION ACCESS PARITY'
          test "$(grep -c -F -- "$begin_marker" "$baseline")" = "1"
          test "$(grep -c -F -- "$end_marker" "$baseline")" = "1"

          supabase migration new virginia_access_realtime_parity >/tmp/migration-new.txt
          parity="$(find supabase/migrations -maxdepth 1 -type f -name '*_virginia_access_realtime_parity.sql' -print -quit)"
          test -n "$parity" || { echo "Supabase CLI did not create parity migration" >&2; exit 1; }

          awk -v begin="$begin_marker" -v end="$end_marker" '
            $0 == begin { in_block=1 }
            in_block { print > parity; next }
            { print > core }
            $0 == end { in_block=0 }
          ' core="$baseline.core" parity="$parity" "$baseline"

          mv "$baseline.core" "$baseline"

          test -s "$baseline"
          test -s "$parity"
          ! grep -q -F -- "$begin_marker" "$baseline"
          grep -q -F -- "$begin_marker" "$parity"
          grep -q -F -- "$end_marker" "$parity"
          grep -q '^set search_path = public, pg_catalog;$' "$parity"

          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          test "${#migrations[@]}" -eq 2 || {
            echo "Expected two active migrations after split; found ${#migrations[@]}" >&2
            exit 1
          }

          core_lines="$(wc -l < "$baseline")"
          parity_lines="$(wc -l < "$parity")"
          test "$core_lines" -gt 1000
          test "$parity_lines" -gt 1000
          git diff --check

          echo "core_migration=$baseline"
          echo "parity_migration=$parity"
          echo "core_lines=$core_lines"
          echo "parity_lines=$parity_lines"
          echo "baseline_transaction_split=true"

      - name: Commit split baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*.sql
          git diff --cached --quiet && { echo "No split changes to commit"; exit 0; }
          git commit -m 'Split baseline access parity transaction'
          git push origin HEAD:fix/supabase-migration-history-alignment
