name: Google enrichment regression

on:
  pull_request:
    paths:
      - "lib/google/places.ts"
      - "lib/google/places.test.ts"
      - "lib/google/cuisine-confidence.test.ts"
      - "lib/google/specialty-food-confidence.ts"
      - "lib/google/specialty-food-confidence.test.ts"
      - "lib/location-data-quality/enrichment-runner.ts"
      - "lib/location-data-quality/google-match-diagnostics.ts"
      - "lib/location-data-quality/google-match-diagnostics.test.ts"
      - "supabase/migrations/*location_enrichment_no_match_diagnostics.sql"
      - ".github/workflows/google-enrichment-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-enrichment-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Google Places enrichment regression
        run: npx vitest run lib/google/places.test.ts lib/google/cuisine-confidence.test.ts lib/google/specialty-food-confidence.test.ts lib/location-data-quality/google-match-diagnostics.test.ts
