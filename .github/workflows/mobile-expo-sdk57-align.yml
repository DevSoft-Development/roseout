name: Mobile Expo SDK 57 alignment

on:
  push:
    branches:
      - mobile/expo-sdk57-patch-align-2026-09-11
    paths:
      - mobile/package.json
      - .github/workflows/mobile-expo-sdk57-align.yml

permissions:
  contents: write

jobs:
  align-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: mobile/expo-sdk57-patch-align-2026-09-11
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Refresh lockfile and install
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Validate Expo package alignment
        working-directory: mobile
        run: npx expo-doctor
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Refresh mobile lockfile for Expo SDK 57 patches"
          git push origin HEAD:mobile/expo-sdk57-patch-align-2026-09-11
