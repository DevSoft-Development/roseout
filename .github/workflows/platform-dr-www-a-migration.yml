name: Platform DR www DNS migration

on:
  push:
    branches:
      - fix/platform-dr-dns-authority
    paths:
      - '.github/workflows/platform-dr-www-a-migration.yml'

permissions:
  contents: read

env:
  DOMAIN_NAME: theouthaven.com
  WWW_DOMAIN_NAME: www.theouthaven.com
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_PROJECT_NAME: roseout

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Read current Vercel DNS and recommended www targets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is required." >&2; exit 1; }
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v5/domains/${DOMAIN_NAME}/records?limit=100&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/records.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/domains/${WWW_DOMAIN_NAME}/config?projectIdOrName=${VERCEL_PROJECT_NAME}&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/www-config.json"
          jq -e '.misconfigured==false and (.recommendedIPv4 | length)>=1' "$RUNNER_TEMP/www-config.json" >/dev/null
          jq -r '.recommendedIPv4 | sort_by(.rank) | .[0].value[]' "$RUNNER_TEMP/www-config.json" | sort -u > "$RUNNER_TEMP/www-ips.txt"
          test "$(wc -l < "$RUNNER_TEMP/www-ips.txt")" -eq 2 || { echo "Expected exactly two rank-1 Vercel IPv4 targets for www." >&2; exit 1; }
          grep -Fx '216.150.1.1' "$RUNNER_TEMP/www-ips.txt" >/dev/null
          grep -Fx '216.150.16.1' "$RUNNER_TEMP/www-ips.txt" >/dev/null

      - name: Convert www CNAME to Vercel recommended A records
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t IPS < "$RUNNER_TEMP/www-ips.txt"
          CNAME_COUNT="$(jq '[.records[] | select(.name=="www" and .type=="CNAME")] | length' "$RUNNER_TEMP/records.json")"
          A_COUNT="$(jq '[.records[] | select(.name=="www" and .type=="A")] | length' "$RUNNER_TEMP/records.json")"

          recreate_cname() {
            local value="$1" ttl="$2"
            jq -n --arg value "$value" --argjson ttl "$ttl" '{name:"www",type:"CNAME",value:$value,ttl:$ttl,comment:"Restored Vercel www routing after failed A-record migration"}' > "$RUNNER_TEMP/www-restore-cname.json"
            curl --silent --show-error --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/www-restore-cname.json" \
              "https://api.vercel.com/v2/domains/${DOMAIN_NAME}/records?teamId=${VERCEL_TEAM_ID}" >/dev/null || true
          }

          if [ "$CNAME_COUNT" -eq 1 ] && [ "$A_COUNT" -eq 0 ]; then
            RECORD_ID="$(jq -r '[.records[] | select(.name=="www" and .type=="CNAME")][0].id' "$RUNNER_TEMP/records.json")"
            OLD_VALUE="$(jq -r '[.records[] | select(.name=="www" and .type=="CNAME")][0].value' "$RUNNER_TEMP/records.json")"
            OLD_TTL="$(jq -r '[.records[] | select(.name=="www" and .type=="CNAME")][0].ttl // 60' "$RUNNER_TEMP/records.json")"
            test -n "$RECORD_ID" && test "$RECORD_ID" != "null"
            test -n "$OLD_VALUE" && test "$OLD_VALUE" != "null"

            curl --fail --silent --show-error --request DELETE \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/domains/${DOMAIN_NAME}/records/${RECORD_ID}?teamId=${VERCEL_TEAM_ID}" >/dev/null

            jq -n --arg value "${IPS[0]}" '{name:"www",type:"A",value:$value,ttl:60,comment:"Vercel rank-1 IPv4 for platform DR CAA compatibility"}' > "$RUNNER_TEMP/www-first-a.json"
            if ! curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/www-first-a.json" \
              "https://api.vercel.com/v2/domains/${DOMAIN_NAME}/records?teamId=${VERCEL_TEAM_ID}" > "$RUNNER_TEMP/www-first-a-response.json"; then
              recreate_cname "$OLD_VALUE" "$OLD_TTL"
              echo 'First www A record failed; original CNAME restoration attempted.' >&2
              exit 1
            fi
            FIRST_ID="$(jq -r '.uid // .id // empty' "$RUNNER_TEMP/www-first-a-response.json")"

            jq -n --arg value "${IPS[1]}" '{name:"www",type:"A",value:$value,ttl:60,comment:"Vercel rank-1 IPv4 for platform DR CAA compatibility"}' > "$RUNNER_TEMP/www-second-a.json"
            if ! curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/www-second-a.json" \
              "https://api.vercel.com/v2/domains/${DOMAIN_NAME}/records?teamId=${VERCEL_TEAM_ID}" > "$RUNNER_TEMP/www-second-a-response.json"; then
              if [ -n "$FIRST_ID" ]; then
                curl --silent --show-error --request DELETE \
                  --header "Authorization: Bearer $VERCEL_TOKEN" \
                  "https://api.vercel.com/v2/domains/${DOMAIN_NAME}/records/${FIRST_ID}?teamId=${VERCEL_TEAM_ID}" >/dev/null || true
              fi
              recreate_cname "$OLD_VALUE" "$OLD_TTL"
              echo 'Second www A record failed; rollback to the original CNAME attempted.' >&2
              exit 1
            fi
          elif [ "$CNAME_COUNT" -eq 0 ] && [ "$A_COUNT" -eq 2 ]; then
            echo 'www is already using two A records; validating values.'
          else
            echo "Unexpected www DNS topology: CNAME=$CNAME_COUNT A=$A_COUNT" >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v5/domains/${DOMAIN_NAME}/records?limit=100&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/after.json"
          jq -r '[.records[] | select(.name=="www" and .type=="A") | .value] | sort | .[]' "$RUNNER_TEMP/after.json" > "$RUNNER_TEMP/after-ips.txt"
          diff -u "$RUNNER_TEMP/www-ips.txt" "$RUNNER_TEMP/after-ips.txt"
          test "$(jq '[.records[] | select(.name=="www" and .type=="CNAME")] | length' "$RUNNER_TEMP/after.json")" -eq 0

      - name: Verify authoritative DNS and Vercel production health
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          dns_ready=false
          for _ in $(seq 1 60); do
            dig +short A "$WWW_DOMAIN_NAME" @ns1.vercel-dns.com | sort -u > "$RUNNER_TEMP/public-www-ips.txt"
            cname="$(dig +short CNAME "$WWW_DOMAIN_NAME" @ns1.vercel-dns.com | head -n 1)"
            if [ -z "$cname" ] && diff -u "$RUNNER_TEMP/www-ips.txt" "$RUNNER_TEMP/public-www-ips.txt" >/dev/null; then
              dns_ready=true
              break
            fi
            sleep 2
          done
          test "$dns_ready" = true || { echo "Authoritative Vercel DNS did not converge to the expected www A records." >&2; exit 1; }

          curl --fail --silent --show-error --location --max-time 20 \
            --dump-header "$RUNNER_TEMP/health-headers.txt" \
            --output "$RUNNER_TEMP/health.json" \
            "https://${WWW_DOMAIN_NAME}/api/health/platform-dr"
          grep -Eiq '^x-toh-platform-origin:[[:space:]]*vercel' "$RUNNER_TEMP/health-headers.txt"
          jq -e '.ok==true and .provider=="vercel"' "$RUNNER_TEMP/health.json" >/dev/null
          echo 'www now uses Vercel rank-1 A records and production health remains Vercel.'
