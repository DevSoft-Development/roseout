name: Repair Search PR Lockfile

on:
  push:
    branches:
      - fix/search-v2-intelligence-1-7

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit corrected lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync package lock for Stripe Connect"
          git push origin HEAD:${GITHUB_REF_NAME}
