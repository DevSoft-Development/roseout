name: Oregon DR lost-slot reseed recovery

on:
  pull_request:
    paths:
      - 'infra/aws/edge-runtime/dr-lost-slot-recovery.json'
      - '.github/workflows/oregon-dr-lost-slot-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/edge-runtime/dr-lost-slot-recovery.json'
      - '.github/workflows/oregon-dr-lost-slot-recovery.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: oregon-dr-logical-replication-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  DR_SECRET_NAME: /theouthaven/production/dr-reconciler/env
  SCHEDULE_GROUP: toh-production-edge-runtime
  VIRGINIA_REF: ftdsltatyqhtllyyefzp
  OREGON_REF: hnhbzynoyrhjndefbwkh
  VIRGINIA_HOST: db.ftdsltatyqhtllyyefzp.supabase.co
  PUBLICATION: theouthaven_dr_publication
  SUBSCRIPTION: theouthaven_va_to_or_dr
  SLOT: theouthaven_va_to_or_dr_slot
  REPLICATION_ROLE: theouthaven_dr_replication

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate lost-slot recovery contract
        run: |
          set -euo pipefail
          MARKER='infra/aws/edge-runtime/dr-lost-slot-recovery.json'
          jq -e '.enabled == true and .expected_slot == "theouthaven_va_to_or_dr_slot" and .expected_subscription == "theouthaven_va_to_or_dr" and .expected_invalidation_reason == "wal_removed" and .reseed_mode == "copy_data_true"' "$MARKER" >/dev/null
          grep -F "DR_MODE" .github/workflows/oregon-dr-lost-slot-recovery.yml >/dev/null
          grep -F "slot_name = NONE" .github/workflows/oregon-dr-lost-slot-recovery.yml >/dev/null
          grep -F "copy_data=true" .github/workflows/oregon-dr-lost-slot-recovery.yml >/dev/null
          grep -F "truncate table" .github/workflows/oregon-dr-lost-slot-recovery.yml >/dev/null
          grep -F "session_replication_role = replica" .github/workflows/oregon-dr-lost-slot-recovery.yml >/dev/null
          grep -F "dr-auth-standby-reconcile" .github/workflows/oregon-dr-lost-slot-recovery.yml >/dev/null
          grep -F "dr-storage-standby-reconcile" .github/workflows/oregon-dr-lost-slot-recovery.yml >/dev/null
          grep -F 'target-preflight.json' .github/workflows/oregon-dr-lost-slot-recovery.yml >/dev/null

  recover:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Require armed one-shot marker
        run: |
          set -euo pipefail
          jq -e '.enabled == true and .expected_invalidation_reason == "wal_removed" and .reseed_mode == "copy_data_true"' infra/aws/edge-runtime/dr-lost-slot-recovery.json >/dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Require protected database credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_URL"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          case "$SUPABASE_DB_URL" in
            *"$OREGON_REF"*) ;;
            *) echo "SUPABASE_DB_URL is not scoped to Oregon DR" >&2; exit 1 ;;
          esac
          command -v psql >/dev/null
          command -v openssl >/dev/null

      - name: Require Virginia primary and disabled forward DR schedules
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws secretsmanager get-secret-value --secret-id "$DR_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/dr-current.json"
          test "$(jq -r '.DR_MODE // empty' "$RUNNER_TEMP/dr-current.json")" = 'virginia_primary' || {
            echo 'Lost-slot reseed is allowed only while Virginia is authoritative.' >&2
            exit 1
          }
          test "$(jq 'length' infra/aws/edge-runtime/schedules.json)" = '65'
          while IFS= read -r name; do
            test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)" = 'ENABLED' || {
              echo "Base production schedule is not enabled: $name" >&2
              exit 1
            }
          done < <(jq -r '.[].name' infra/aws/edge-runtime/schedules.json)
          for name in dr-auth-standby-reconcile dr-storage-standby-reconcile; do
            test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)" = 'DISABLED' || {
              echo "Forward DR schedule must remain disabled during reseed: $name" >&2
              exit 1
            }
          done

      - name: Require exact schema parity and lost-slot preconditions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          query_ref() {
            local ref="$1" sql="$2" out="$3"
            jq -n --arg query "$sql" '{query:$query}' > "$RUNNER_TEMP/query.json"
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/query.json" \
              "https://api.supabase.com/v1/projects/${ref}/database/query" > "$out"
            jq -e 'type == "array"' "$out" >/dev/null
          }

          catalog_sql="$(cat scripts/dr/writable-catalog.sql)"
          query_ref "$VIRGINIA_REF" "$catalog_sql" "$RUNNER_TEMP/virginia-catalog.json"
          query_ref "$OREGON_REF" "$catalog_sql" "$RUNNER_TEMP/oregon-catalog.json"
          jq -S 'sort_by(.kind,.object_name,.item_name)' "$RUNNER_TEMP/virginia-catalog.json" > "$RUNNER_TEMP/virginia-catalog-normalized.json"
          jq -S 'sort_by(.kind,.object_name,.item_name)' "$RUNNER_TEMP/oregon-catalog.json" > "$RUNNER_TEMP/oregon-catalog-normalized.json"
          cmp -s "$RUNNER_TEMP/virginia-catalog-normalized.json" "$RUNNER_TEMP/oregon-catalog-normalized.json" || {
            echo 'Virginia/Oregon writable catalogs are not identical; refusing reseed.' >&2
            exit 1
          }

          source_sql="with candidate as (select n.nspname||'.'||c.relname rel from pg_class c join pg_namespace n on n.oid=c.relnamespace where c.relkind='r' and n.nspname='public' and c.relname not in ('toh_region_migration_apply_errors','toh_storage_migration_manifest')), published as (select schemaname||'.'||tablename rel from pg_publication_tables where pubname='${PUBLICATION}') select (select count(*) from cron.job) cron_jobs,(select count(*) from pg_publication where pubname='${PUBLICATION}') publications,(select count(*) from candidate) candidate_tables,(select count(*) from published) published_tables,(select md5(coalesce(string_agg(rel,',' order by rel),'')) from candidate) candidate_fp,(select md5(coalesce(string_agg(rel,',' order by rel),'')) from published) published_fp,(select count(*) from pg_replication_slots where slot_name='${SLOT}') slots,(select count(*) from pg_replication_slots where slot_name='${SLOT}' and active) active_slots,(select coalesce(wal_status,'') from pg_replication_slots where slot_name='${SLOT}') wal_status,(select coalesce(invalidation_reason,'') from pg_replication_slots where slot_name='${SLOT}') invalidation_reason;"
          query_ref "$VIRGINIA_REF" "$source_sql" "$RUNNER_TEMP/source-preflight.json"
          jq -e '.[0].cron_jobs==0 and .[0].publications==1 and .[0].slots==1 and .[0].active_slots==0 and .[0].wal_status=="lost" and .[0].invalidation_reason=="wal_removed" and .[0].candidate_tables==.[0].published_tables and .[0].candidate_fp==.[0].published_fp' "$RUNNER_TEMP/source-preflight.json" >/dev/null || {
            echo 'Virginia lost-slot preconditions are not exact.' >&2
            jq -c '.[0] | {cron_jobs,publications,candidate_tables,published_tables,slots,active_slots,wal_status,invalidation_reason}' "$RUNNER_TEMP/source-preflight.json" >&2
            exit 1
          }

          target_sql="select (select count(*) from cron.job where active) active_cron,(select count(*) from pg_subscription where subname='${SUBSCRIPTION}') subscriptions,(select count(*) from pg_subscription s join pg_stat_subscription st on st.subid=s.oid where s.subname='${SUBSCRIPTION}' and st.pid is not null) workers,(select count(*) from pg_subscription_rel sr join pg_subscription s on s.oid=sr.srsubid where s.subname='${SUBSCRIPTION}') total,(select count(*) from pg_subscription_rel sr join pg_subscription s on s.oid=sr.srsubid where s.subname='${SUBSCRIPTION}' and sr.srsubstate='r') ready,(select coalesce(bool_or(subenabled),false) from pg_subscription where subname='${SUBSCRIPTION}') subscription_enabled;"
          query_ref "$OREGON_REF" "$target_sql" "$RUNNER_TEMP/target-preflight.json"
          jq -e '.[0].active_cron==0 and .[0].subscriptions==1 and .[0].workers==0 and .[0].total==462 and .[0].ready==462 and .[0].subscription_enabled==false' "$RUNNER_TEMP/target-preflight.json" >/dev/null || {
            echo 'Oregon subscriber preconditions are not exact.' >&2
            jq -c '.[0] | {active_cron,subscriptions,workers,total,ready,subscription_enabled}' "$RUNNER_TEMP/target-preflight.json" >&2
            exit 1
          }

          bad_identity_sql="select count(*) bad_tables from pg_class c join pg_namespace n on n.oid=c.relnamespace where c.relkind='r' and n.nspname='public' and c.relname not in ('toh_region_migration_apply_errors','toh_storage_migration_manifest') and c.relreplident='d' and not exists (select 1 from pg_index i where i.indrelid=c.oid and i.indisprimary);"
          query_ref "$VIRGINIA_REF" "$bad_identity_sql" "$RUNNER_TEMP/replica-identity.json"
          test "$(jq -r '.[0].bad_tables' "$RUNNER_TEMP/replica-identity.json")" = '0'

          cascade_sql="with candidate as (select c.oid from pg_class c join pg_namespace n on n.oid=c.relnamespace where c.relkind='r' and n.nspname='public' and c.relname not in ('toh_region_migration_apply_errors','toh_storage_migration_manifest')) select count(*) outside_fk_count from pg_constraint con where con.contype='f' and con.confrelid in (select oid from candidate) and con.conrelid not in (select oid from candidate);"
          query_ref "$OREGON_REF" "$cascade_sql" "$RUNNER_TEMP/cascade-boundary.json"
          test "$(jq -r '.[0].outside_fk_count' "$RUNNER_TEMP/cascade-boundary.json")" = '0'

      - name: Generate fresh one-purpose replication credential
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$password" > "$RUNNER_TEMP/replication-password"
          chmod 600 "$RUNNER_TEMP/replication-password"

      - name: Detach broken subscriber and remove only the lost slot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<SQL >/dev/null
          alter subscription ${SUBSCRIPTION} disable;
          alter subscription ${SUBSCRIPTION} set (slot_name = NONE);
          drop subscription ${SUBSCRIPTION};
          SQL
          test "$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_subscription where subname='${SUBSCRIPTION}'")" = '0'

          jq -n --arg query "select pg_drop_replication_slot('${SLOT}') where exists (select 1 from pg_replication_slots where slot_name='${SLOT}' and not active and wal_status='lost' and invalidation_reason='wal_removed');" '{query:$query}' > "$RUNNER_TEMP/query.json"
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/query.json" "https://api.supabase.com/v1/projects/${VIRGINIA_REF}/database/query" >/dev/null
          jq -n --arg query "select count(*) slots from pg_replication_slots where slot_name='${SLOT}';" '{query:$query}' > "$RUNNER_TEMP/query.json"
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/query.json" "https://api.supabase.com/v1/projects/${VIRGINIA_REF}/database/query" > "$RUNNER_TEMP/slot-gone.json"
          test "$(jq -r '.[0].slots' "$RUNNER_TEMP/slot-gone.json")" = '0'

      - name: Refresh Virginia replication credential and preserve publication
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          password="$(cat "$RUNNER_TEMP/replication-password")"
          echo "::add-mask::$password"
          cat > "$RUNNER_TEMP/source-refresh.sql" <<SQL
          do \$dr\$
          begin
            if exists (select 1 from pg_roles where rolname='${REPLICATION_ROLE}') then
              execute format('alter role %I with login replication bypassrls password %L','${REPLICATION_ROLE}','${password}');
            else
              execute format('create role %I with login replication bypassrls password %L','${REPLICATION_ROLE}','${password}');
            end if;
          end
          \$dr\$;
          grant connect on database postgres to ${REPLICATION_ROLE};
          grant usage on schema public to ${REPLICATION_ROLE};
          grant select on all tables in schema public to ${REPLICATION_ROLE};
          SQL
          jq -Rs '{query:.}' < "$RUNNER_TEMP/source-refresh.sql" > "$RUNNER_TEMP/source-refresh.json"
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/source-refresh.json" "https://api.supabase.com/v1/projects/${VIRGINIA_REF}/database/query" >/dev/null

      - name: Create disabled replacement subscription and prove new slot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          password="$(cat "$RUNNER_TEMP/replication-password")"
          echo "::add-mask::$password"
          cat > "$RUNNER_TEMP/create-subscription.sql" <<SQL
          create subscription ${SUBSCRIPTION}
          connection 'host=${VIRGINIA_HOST} port=5432 dbname=postgres user=${REPLICATION_ROLE} password=${password} sslmode=require application_name=${SUBSCRIPTION}'
          publication ${PUBLICATION}
          with (copy_data=true, create_slot=true, slot_name='${SLOT}', enabled=false, disable_on_error=true);
          SQL
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/create-subscription.sql" >/dev/null
          test "$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select subenabled::text||':'||coalesce(subslotname,'') from pg_subscription where subname='${SUBSCRIPTION}'")" = "false:${SLOT}"

          jq -n --arg query "select count(*) slots from pg_replication_slots where slot_name='${SLOT}' and wal_status<>'lost';" '{query:$query}' > "$RUNNER_TEMP/query.json"
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/query.json" "https://api.supabase.com/v1/projects/${VIRGINIA_REF}/database/query" > "$RUNNER_TEMP/new-slot.json"
          test "$(jq -r '.[0].slots' "$RUNNER_TEMP/new-slot.json")" = '1'

      - name: Reseed only passive Oregon public application tables
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL' >/dev/null
          set session_replication_role = replica;
          do $dr$
          declare rels text;
          begin
            select string_agg(format('%I.%I',n.nspname,c.relname),', ' order by c.relname) into rels
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where c.relkind='r' and n.nspname='public'
              and c.relname not in ('toh_region_migration_apply_errors','toh_storage_migration_manifest');
            if rels is null then raise exception 'Oregon DR public reseed table set is empty'; end if;
            execute 'truncate table ' || rels || ' restart identity cascade';
          end
          $dr$;
          reset session_replication_role;
          SQL

      - name: Enable replacement subscriber and wait for consistent initial copy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "alter subscription ${SUBSCRIPTION} enable;" >/dev/null
          for attempt in $(seq 1 360); do
            state="$(psql "$SUPABASE_DB_URL" -X -A -t -F ':' -v ON_ERROR_STOP=1 -c "select count(*) filter (where sr.srsubstate<>'r'),count(*) from pg_subscription_rel sr join pg_subscription s on s.oid=sr.srsubid where s.subname='${SUBSCRIPTION}';")"
            pending="${state%%:*}"; total="${state##*:}"
            workers="$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_subscription s join pg_stat_subscription st on st.subid=s.oid where s.subname='${SUBSCRIPTION}' and st.pid is not null")"
            if [ "$total" = '462' ] && [ "$pending" = '0' ] && [ "$workers" -ge 1 ]; then
              echo "initial_sync_tables=$total"
              echo "initial_public_sync_ready=true"
              exit 0
            fi
            sleep 10
          done
          echo 'Replacement Oregon logical replication did not reach ready state.' >&2
          exit 1

      - name: Require active slot and draining WAL lag
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            jq -n --arg query "select active,coalesce(pg_wal_lsn_diff(pg_current_wal_lsn(),confirmed_flush_lsn),0)::bigint lag_bytes,coalesce(wal_status,'') wal_status,coalesce(invalidation_reason,'') invalidation_reason from pg_replication_slots where slot_name='${SLOT}';" '{query:$query}' > "$RUNNER_TEMP/query.json"
            curl --fail --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/query.json" "https://api.supabase.com/v1/projects/${VIRGINIA_REF}/database/query" > "$RUNNER_TEMP/slot-health.json"
            active="$(jq -r '.[0].active // false' "$RUNNER_TEMP/slot-health.json")"
            lag="$(jq -r '.[0].lag_bytes // 999999999999' "$RUNNER_TEMP/slot-health.json")"
            status="$(jq -r '.[0].wal_status // empty' "$RUNNER_TEMP/slot-health.json")"
            invalidation="$(jq -r '.[0].invalidation_reason // empty' "$RUNNER_TEMP/slot-health.json")"
            workers="$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_subscription s join pg_stat_subscription st on st.subid=s.oid where s.subname='${SUBSCRIPTION}' and st.pid is not null")"
            if [ "$active" = 'true' ] && [ "$workers" -ge 1 ] && [ "$status" != 'lost' ] && [ -z "$invalidation" ] && [ "$lag" -le 67108864 ]; then
              echo "source_slot_lag_bytes=$lag"
              echo 'public_logical_replication=healthy'
              exit 0
            fi
            sleep 10
          done
          echo 'Replacement lane did not reach healthy low-lag state.' >&2
          exit 1

      - name: Re-prove cron safety and leave DR schedules disabled
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          jq -n --arg query "select count(*) cron_jobs from cron.job;" '{query:$query}' > "$RUNNER_TEMP/query.json"
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/query.json" "https://api.supabase.com/v1/projects/${VIRGINIA_REF}/database/query" > "$RUNNER_TEMP/virginia-cron.json"
          test "$(jq -r '.[0].cron_jobs' "$RUNNER_TEMP/virginia-cron.json")" = '0'
          test "$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from cron.job where active')" = '0'
          for name in dr-auth-standby-reconcile dr-storage-standby-reconcile; do
            test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)" = 'DISABLED'
          done

      - name: Recovery summary
        run: |
          {
            echo '### Oregon DR lost-slot recovery'
            echo ''
            echo '- Virginia remained the authoritative primary.'
            echo '- The invalidated wal_removed slot and its broken Oregon subscriber were detached.'
            echo '- Oregon public application tables were reseeded with copy_data=true through a fresh logical replication slot.'
            echo '- The replacement subscriber reached all 462 relations ready with a connected worker and low WAL lag.'
            echo '- Virginia pg_cron remained empty; Oregon active pg_cron remained zero.'
            echo '- Forward DR EventBridge schedules remained disabled for the separate fail-closed activation gate.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup sensitive temporary files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/replication-password" "$RUNNER_TEMP/source-refresh.sql" "$RUNNER_TEMP/source-refresh.json" \
            "$RUNNER_TEMP/create-subscription.sql" "$RUNNER_TEMP/query.json" "$RUNNER_TEMP/dr-current.json" \
            "$RUNNER_TEMP"/*.json
