name: Mobile production OTA migration guard

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-production-ota.yml'
      - '.github/workflows/mobile-azure-ota.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove EAS Update hosting is disabled
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('mobile/app.json', 'utf8')).expo;
          const url = String(app?.updates?.url || '');
          if (url !== 'https://updates.theouthaven.com/api/mobile/ota/manifest') {
            throw new Error('Mobile update URL must use the TheOutHaven Azure OTA endpoint');
          }
          if (url.includes('u.expo.dev')) {
            throw new Error('EAS Update hosting is still configured');
          }
          if (app?.extra?.eas?.projectId) {
            throw new Error('EAS project ID must not be required by the production runtime');
          }
          NODE
          test ! -f mobile/eas.json
          ! grep -F '"expo-dev-client"' mobile/package.json >/dev/null
          node -e "const p=require('./mobile/package-lock.json'); if(p.packages?.['']?.dependencies?.['expo-dev-client'] || p.packages?.['node_modules/expo-dev-client']) process.exit(1)"
          test -f .github/workflows/mobile-azure-ota.yml
          grep -F 'name: Mobile production OTA migration guard' .github/workflows/mobile-production-ota.yml >/dev/null
          grep -F 'name: Mobile Azure OTA release' .github/workflows/mobile-azure-ota.yml >/dev/null
          node - <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const files = execSync('git grep -l "https://exp.host/--/api/v2/push/send" -- ":!node_modules"', { encoding: 'utf8' })
            .trim().split(/\n/).filter(Boolean);
          const allowed = ['lib/mobile/push.ts'];
          if (JSON.stringify(files.sort()) !== JSON.stringify(allowed)) {
            throw new Error('Expo Push endpoint must remain isolated to lib/mobile/push.ts: ' + files.join(', '));
          }
          const forbidden = execSync('git grep -n -E "eas (build|submit|update)|u\\.expo\\.dev" -- . ":!node_modules" || true', { encoding: 'utf8' }).trim();
          if (forbidden) throw new Error('Expo/EAS control-plane reference detected:\n' + forbidden);
          NODE
          echo "Production OTA publication authority: Azure self-hosted workflow."
