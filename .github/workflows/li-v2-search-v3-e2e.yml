name: LI V2 to Search V3 authenticated E2E

on:
  workflow_dispatch:
    inputs:
      location_id:
        description: "UUID of a restaurant with verified official JSON-LD menu evidence in East primary"
        required: true
        type: string
      menu_item:
        description: "Exact indexed official menu item name to retrieve"
        required: true
        type: string

permissions:
  contents: read

jobs:
  certify:
    name: Official menu to authenticated Search V3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: li-v2-certification
    env:
      LI_V2_ENFORCE_ACQUISITION_BUDGET: "false"
      LI_E2E_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
      LI_E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LI_E2E_SUPABASE_SERVICE_ROLE_KEY }}
      LI_E2E_SEARCH_URL: ${{ vars.LI_E2E_SEARCH_URL }}
      LI_E2E_SEARCH_BEARER_TOKEN: ${{ secrets.LI_E2E_SEARCH_BEARER_TOKEN }}
      LI_E2E_LOCATION_ID: ${{ inputs.location_id }}
      LI_E2E_SEARCH_QUERY: ${{ inputs.menu_item }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify official source, Azure vector, and authenticated Search V3 provenance
        run: node scripts/certify-li-v2-search-v3-e2e.mjs
