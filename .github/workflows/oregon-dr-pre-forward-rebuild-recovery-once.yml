name: Oregon DR pre-forward rebuild recovery once

on:
  pull_request:
    paths:
      - '.github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml'
      - 'scripts/dr/recover-failback-pre-forward-rebuild.sh'
      - '.github/workflows/oregon-dr-failback.yml'
      - '.github/workflows/oregon-dr-post-detach-recovery-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml'
      - 'scripts/dr/recover-failback-pre-forward-rebuild.sh'
      - '.github/workflows/oregon-dr-failback.yml'
      - '.github/workflows/oregon-dr-post-detach-recovery-once.yml'

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: oregon-dr-pre-forward-rebuild-recovery-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-edge-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery safety contract
        run: |
          set -euo pipefail
          bash -n scripts/dr/recover-failback-pre-forward-rebuild.sh
          test "$(jq 'length' infra/aws/edge-runtime/schedules.json)" = '65'
          test "$(jq 'length' infra/aws/edge-runtime/dr-schedules.json)" = '2'
          grep -F 'Recovery requires DR_MODE=failback_in_progress.' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'Recovery requires AWS runtime still targeting Oregon.' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'Recovery requires Vercel production still targeting Oregon.' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'Exact public data parity is not proven.' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'Reverse Auth/Storage parity is not exact' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'copy_data=false' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'Rebuilt forward slot did not become active at zero lag.' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'Both databases remained fenced until Vercel' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'recovery_result=virginia_primary_restored' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'Patch recovery for exact post-publication boundary' .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null
          grep -F 'grant ${REVERSE_REPLICATION_ROLE} to postgres with inherit true, set true' .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null
          grep -F "pg_has_role(current_user,'${REVERSE_REPLICATION_ROLE}','USAGE') usage" .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null
          grep -F 'drop owned by ${REVERSE_REPLICATION_ROLE};' .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null
          grep -F 'grant ${REVERSE_SUBSCRIBER_ROLE} to postgres with inherit true, set true' .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null
          grep -F "pg_has_role(current_user,'${REVERSE_SUBSCRIBER_ROLE}','USAGE') usage" .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null
          grep -F 'drop owned by ${REVERSE_SUBSCRIBER_ROLE};' .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null
          ! grep -F 'set role ${REVERSE_REPLICATION_ROLE}; drop owned by ${REVERSE_REPLICATION_ROLE}; reset role;' .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null
          ! grep -F 'set role ${REVERSE_SUBSCRIBER_ROLE}; drop owned by ${REVERSE_SUBSCRIBER_ROLE}; reset role;' .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null
          grep -F 'certification_restart=dispatched' .github/workflows/oregon-dr-pre-forward-rebuild-recovery-once.yml >/dev/null

  recover:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Patch recovery for exact post-publication boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/dr/recover-failback-pre-forward-rebuild.sh')
          text = path.read_text()

          old_boundary = ".[0].active_cron_jobs==0 and .[0].fence==1 and .[0].admin_override==1 and .[0].forward_subscriptions==0 and .[0].reverse_publications==1 and .[0].reverse_slots==0 and .[0].reverse_replication_roles<=1 and .[0].dr_pre_request_configured==1"
          new_boundary = ".[0].active_cron_jobs==0 and .[0].fence==1 and .[0].admin_override==1 and .[0].forward_subscriptions==0 and .[0].reverse_publications==0 and .[0].reverse_slots==0 and .[0].reverse_replication_roles==1 and .[0].dr_pre_request_configured==1"
          if old_boundary not in text:
              raise SystemExit('Expected pre-publication recovery boundary not found')
          text = text.replace(old_boundary, new_boundary, 1)

          source_old = '''    echo 'reverse_cleanup_stage=source_owned'
              query_ref "$OREGON_REF" "drop owned by ${REVERSE_REPLICATION_ROLE};" "$TMP/reverse-source-owned-drop.json"
              echo 'reverse_cleanup_stage=source_role'
              query_ref "$OREGON_REF" "drop role ${REVERSE_REPLICATION_ROLE};" "$TMP/reverse-source-role-drop.json"
          '''
          source_new = '''    echo 'reverse_cleanup_stage=source_membership'
              query_ref "$OREGON_REF" "grant ${REVERSE_REPLICATION_ROLE} to postgres with inherit true, set true;" "$TMP/reverse-source-membership-grant.json"
              query_ref "$OREGON_REF" "select current_user,session_user,pg_has_role(current_user,'${REVERSE_REPLICATION_ROLE}','USAGE') usage;" "$TMP/reverse-source-membership-proof.json"
              jq -e '.[0].current_user=="postgres" and .[0].session_user=="postgres" and .[0].usage==true' "$TMP/reverse-source-membership-proof.json" >/dev/null || { echo 'Oregon cleanup membership is not inherited by postgres.' >&2; exit 1; }
              echo 'reverse_cleanup_stage=source_owned'
              query_ref "$OREGON_REF" "drop owned by ${REVERSE_REPLICATION_ROLE};" "$TMP/reverse-source-owned-drop.json"
              query_ref "$OREGON_REF" "revoke ${REVERSE_REPLICATION_ROLE} from postgres granted by postgres;" "$TMP/reverse-source-membership-revoke.json"
              echo 'reverse_cleanup_stage=source_role'
              query_ref "$OREGON_REF" "drop role ${REVERSE_REPLICATION_ROLE};" "$TMP/reverse-source-role-drop.json"
          '''
          if source_old not in text:
              raise SystemExit('Expected source role cleanup block not found')
          text = text.replace(source_old, source_new, 1)

          target_old = '''    echo 'reverse_cleanup_stage=target_owned'
              query_ref "$VIRGINIA_REF" "drop owned by ${REVERSE_SUBSCRIBER_ROLE};" "$TMP/reverse-target-owned-drop.json"
              echo 'reverse_cleanup_stage=target_role'
              query_ref "$VIRGINIA_REF" "drop role ${REVERSE_SUBSCRIBER_ROLE};" "$TMP/reverse-target-role-drop.json"
          '''
          target_new = '''    echo 'reverse_cleanup_stage=target_membership'
              query_ref "$VIRGINIA_REF" "grant ${REVERSE_SUBSCRIBER_ROLE} to postgres with inherit true, set true;" "$TMP/reverse-target-membership-grant.json"
              query_ref "$VIRGINIA_REF" "select current_user,session_user,pg_has_role(current_user,'${REVERSE_SUBSCRIBER_ROLE}','USAGE') usage;" "$TMP/reverse-target-membership-proof.json"
              jq -e '.[0].current_user=="postgres" and .[0].session_user=="postgres" and .[0].usage==true' "$TMP/reverse-target-membership-proof.json" >/dev/null || { echo 'Virginia cleanup membership is not inherited by postgres.' >&2; exit 1; }
              echo 'reverse_cleanup_stage=target_owned'
              query_ref "$VIRGINIA_REF" "drop owned by ${REVERSE_SUBSCRIBER_ROLE};" "$TMP/reverse-target-owned-drop.json"
              query_ref "$VIRGINIA_REF" "revoke ${REVERSE_SUBSCRIBER_ROLE} from postgres granted by postgres;" "$TMP/reverse-target-membership-revoke.json"
              echo 'reverse_cleanup_stage=target_role'
              query_ref "$VIRGINIA_REF" "drop role ${REVERSE_SUBSCRIBER_ROLE};" "$TMP/reverse-target-role-drop.json"
          '''
          if target_old not in text:
              raise SystemExit('Expected target role cleanup block not found')
          path.write_text(text.replace(target_old, target_new, 1))
          PY
          grep -F 'reverse_publications==0' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'reverse_replication_roles==1' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'grant ${REVERSE_REPLICATION_ROLE} to postgres with inherit true, set true' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F "pg_has_role(current_user,'${REVERSE_REPLICATION_ROLE}','USAGE') usage" scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'drop owned by ${REVERSE_REPLICATION_ROLE};' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'grant ${REVERSE_SUBSCRIBER_ROLE} to postgres with inherit true, set true' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F "pg_has_role(current_user,'${REVERSE_SUBSCRIBER_ROLE}','USAGE') usage" scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          grep -F 'drop owned by ${REVERSE_SUBSCRIBER_ROLE};' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          ! grep -F 'set role ${REVERSE_REPLICATION_ROLE}; drop owned by ${REVERSE_REPLICATION_ROLE}; reset role;' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          ! grep -F 'set role ${REVERSE_SUBSCRIBER_ROLE}; drop owned by ${REVERSE_SUBSCRIBER_ROLE}; reset role;' scripts/dr/recover-failback-pre-forward-rebuild.sh >/dev/null
          bash -n scripts/dr/recover-failback-pre-forward-rebuild.sh

      - name: Recover exact fail-closed pre-forward-rebuild state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OREGON_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/dr/recover-failback-pre-forward-rebuild.sh

      - name: Restart full production DR certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run oregon-dr-production-certification-quiesced-once.yml --ref main
          echo 'certification_restart=dispatched'

      - name: Fail closed on recovery failure
        if: failure()
        run: |
          set -euo pipefail
          for manifest in infra/aws/edge-runtime/schedules.json infra/aws/edge-runtime/dr-schedules.json; do
            while IFS= read -r name; do
              aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" > "$RUNNER_TEMP/schedule-fail.json" || continue
              expression="$(jq -r '.ScheduleExpression' "$RUNNER_TEMP/schedule-fail.json")"
              window="$(jq -c '.FlexibleTimeWindow' "$RUNNER_TEMP/schedule-fail.json")"
              target="$(jq -c '.Target' "$RUNNER_TEMP/schedule-fail.json")"
              aws scheduler update-schedule --group-name "$SCHEDULE_GROUP" --name "$name" \
                --schedule-expression "$expression" --flexible-time-window "$window" \
                --state DISABLED --target "$target" >/dev/null || true
            done < <(jq -r '.[].name' "$manifest")
          done
          echo 'Recovery failed closed. Schedulers remain disabled; no automatic database or traffic rollback was attempted.' >> "$GITHUB_STEP_SUMMARY"