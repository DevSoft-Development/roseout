name: Mobile location lock refresh

on:
  push:
    branches:
      - mobile/native-location-e2e-2026-09-11
    paths:
      - .github/workflows/mobile-location-lock-refresh.yml
      - mobile/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: mobile/native-location-e2e-2026-09-11
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Refresh mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Refresh mobile lockfile for expo-location"
          git push origin HEAD:mobile/native-location-e2e-2026-09-11
