name: Operational shard isolation proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/operational-shard-isolation-proof.mjs'
      - '.github/workflows/operational-shard-isolation-proof.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/operational-shard-isolation-proof.mjs'
      - '.github/workflows/operational-shard-isolation-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ (github.event_name == 'pull_request' && format('operational-shard-contract-{0}-{1}', github.workflow, github.event.pull_request.number)) || 'operational-shard-control-production' }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/operational-shard-isolation-proof.mjs
  live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: us-east-1
          allowed-account-ids: '742020474738'
      - name: Load shard map
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id /theouthaven/credential-vault/production/supabase --query SecretString --output text > "$RUNNER_TEMP/vault.json"
          SHARDS="$(jq -r '.operationalShardsJson // empty' "$RUNNER_TEMP/vault.json")"
          GLOBAL_URL="$(jq -r '.url // empty' "$RUNNER_TEMP/vault.json")"
          GLOBAL_KEY="$(jq -r '.secretKey // .serviceRoleKey // empty' "$RUNNER_TEMP/vault.json")"
          test -n "$SHARDS" && test -n "$GLOBAL_URL" && test -n "$GLOBAL_KEY"
          echo "::add-mask::$SHARDS"
          echo "::add-mask::$GLOBAL_KEY"
          {
            echo 'OPERATIONAL_SHARDS_JSON<<TOH_SHARDS'
            printf '%s\n' "$SHARDS"
            echo 'TOH_SHARDS'
            echo "GLOBAL_SUPABASE_URL=$GLOBAL_URL"
            echo "GLOBAL_SUPABASE_SERVICE_ROLE_KEY=$GLOBAL_KEY"
          } >> "$GITHUB_ENV"
      - run: node scripts/operational-shard-isolation-proof.mjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/vault.json"
