name: AWS web surfaces isolation smoke

on:
  pull_request:
    paths:
      - '.github/workflows/aws-web-surfaces-isolation-smoke.yml'
      - 'scripts/web-surfaces-isolation-smoke-regression.mjs'
      - 'app/auth/callback/**'
      - 'app/auth/admin/callback/**'
      - 'lib/web-surface-auth-origin.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-web-surfaces-isolation-smoke.yml'
      - 'scripts/web-surfaces-isolation-smoke-regression.mjs'
  workflow_run:
    workflows: ['AWS web surfaces services']
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolation smoke contract
        run: node scripts/web-surfaces-isolation-smoke-regression.mjs

  smoke:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: '742020474738'
      FOUNDATION_STACK: theouthaven-web-surfaces-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve Admin and Business origin
        id: origin
        run: |
          set -euo pipefail
          ORIGIN="$(aws cloudformation describe-stacks \
            --stack-name "$FOUNDATION_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDnsName'].OutputValue | [0]" \
            --output text)"
          test -n "$ORIGIN" && test "$ORIGIN" != None
          echo "host=$ORIGIN" >> "$GITHUB_OUTPUT"

      - name: Verify Admin and Business surface isolation and auth boundaries
        env:
          ORIGIN: ${{ steps.origin.outputs.host }}
        run: |
          set -euo pipefail

          request_status() {
            local host="$1"
            local path="$2"
            curl --silent --show-error --max-time 20 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-to "${host}:443:${ORIGIN}:443" \
              "https://${host}${path}"
          }

          request_location() {
            local host="$1"
            local path="$2"
            curl --silent --show-error --max-time 20 \
              --output /dev/null \
              --dump-header - \
              --connect-to "${host}:443:${ORIGIN}:443" \
              "https://${host}${path}" \
              | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^[Ll]ocation:[[:space:]]*/, ""); print; exit}'
          }

          require_allowed() {
            local host="$1"
            local path="$2"
            local status
            status="$(request_status "$host" "$path")"
            echo "$host $path -> $status"
            if [ "$status" = '000' ] || [ "$status" = '404' ] || [ "$status" -ge 500 ]; then
              echo "Expected allowed route $host$path to remain reachable, got HTTP $status." >&2
              exit 1
            fi
          }

          require_denied() {
            local host="$1"
            local path="$2"
            local status
            status="$(request_status "$host" "$path")"
            echo "$host $path -> $status"
            if [ "$status" != '404' ]; then
              echo "Expected isolated route $host$path to return HTTP 404, got $status." >&2
              exit 1
            fi
          }

          require_location_prefix() {
            local host="$1"
            local path="$2"
            local expected="$3"
            local location
            location="$(request_location "$host" "$path")"
            echo "$host $path -> ${location:-<no location>}"
            case "$location" in
              "$expected"*) ;;
              *)
                echo "Expected $host$path to redirect within $expected, got ${location:-<none>}." >&2
                exit 1
                ;;
            esac
          }

          for surface in admin business; do
            host="${surface}.theouthaven.com"
            body="$(curl --fail --silent --show-error --max-time 20 \
              --connect-to "${host}:443:${ORIGIN}:443" \
              "https://${host}/api/health/platform-dr")"
            printf '%s' "$body" | jq -e --arg provider "aws-${surface}" \
              '.ok == true and .provider == $provider' >/dev/null
          done

          require_allowed 'admin.theouthaven.com' '/admin/login'
          require_denied 'admin.theouthaven.com' '/locations/dashboard'
          require_denied 'admin.theouthaven.com' '/'
          require_location_prefix 'admin.theouthaven.com' '/auth/admin/callback' 'https://admin.theouthaven.com/admin/login'

          require_allowed 'business.theouthaven.com' '/login'
          require_allowed 'business.theouthaven.com' '/locations/dashboard'
          require_denied 'business.theouthaven.com' '/admin/login'
          require_denied 'business.theouthaven.com' '/'
          require_location_prefix 'business.theouthaven.com' '/auth/callback' 'https://business.theouthaven.com/login'

          echo 'Admin and Business HTTPS runtime, route isolation, and auth callback host boundaries passed. No DNS/public routing changes were made.'
