name: AWS worker Supabase target preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aws-worker-supabase-target.yml'
      - '.github/workflows/aws-worker-supabase-target-preflight.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-worker-supabase-target-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-workers-production
  OREGON_SUPABASE_REF: hnhbzynoyrhjndefbwkh
  VIRGINIA_SUPABASE_REF: ftdsltatyqhtllyyefzp

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Load vaulted Supabase runtime credentials
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id /theouthaven/credential-vault/production/supabase \
            --query SecretString --output text > "$RUNNER_TEMP/supabase-vault.json"
          aws secretsmanager get-secret-value \
            --secret-id /theouthaven/production/dr-reconciler/env \
            --query SecretString --output text > "$RUNNER_TEMP/dr-runtime.json"

          VIRGINIA_URL="$(jq -r '.url // empty' "$RUNNER_TEMP/supabase-vault.json")"
          VIRGINIA_SERVER_KEY="$(jq -r '.secretKey // .serviceRoleKey // empty' "$RUNNER_TEMP/supabase-vault.json")"
          VIRGINIA_PUBLIC_KEY="$(jq -r '.publishableKey // empty' "$RUNNER_TEMP/supabase-vault.json")"

          OREGON_URL="$(jq -r '.DR_OREGON_URL // empty' "$RUNNER_TEMP/dr-runtime.json")"
          OREGON_SERVER_KEY="$(jq -r '.DR_OREGON_SERVICE_ROLE_KEY // empty' "$RUNNER_TEMP/dr-runtime.json")"
          OREGON_PUBLIC_KEY="$(jq -r '.DR_OREGON_ANON_KEY // empty' "$RUNNER_TEMP/dr-runtime.json")"

          test -n "$VIRGINIA_URL" && test -n "$VIRGINIA_SERVER_KEY" && test -n "$VIRGINIA_PUBLIC_KEY"
          test -n "$OREGON_URL" && test -n "$OREGON_SERVER_KEY" && test -n "$OREGON_PUBLIC_KEY"

          for value in "$VIRGINIA_SERVER_KEY" "$VIRGINIA_PUBLIC_KEY" "$OREGON_SERVER_KEY" "$OREGON_PUBLIC_KEY"; do
            echo "::add-mask::$value"
          done

          {
            echo "VIRGINIA_URL=$VIRGINIA_URL"
            echo "VIRGINIA_SERVER_KEY=$VIRGINIA_SERVER_KEY"
            echo "VIRGINIA_PUBLIC_KEY=$VIRGINIA_PUBLIC_KEY"
            echo "OREGON_URL=$OREGON_URL"
            echo "OREGON_SERVER_KEY=$OREGON_SERVER_KEY"
            echo "OREGON_PUBLIC_KEY=$OREGON_PUBLIC_KEY"
          } >> "$GITHUB_ENV"

      - name: Validate both Supabase worker targets without printing keys
        run: |
          set -euo pipefail

          validate_target() {
            local name="$1" url="$2" server_key="$3"
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/${name}-rest.json" --write-out '%{http_code}' \
              -H "apikey: $server_key" \
              -H "Authorization: Bearer $server_key" \
              "${url%/}/rest/v1/")"
            test "$code" = "200" || { echo "$name Supabase runtime key validation failed: HTTP $code" >&2; exit 1; }
          }

          validate_target virginia "$VIRGINIA_URL" "$VIRGINIA_SERVER_KEY"
          validate_target oregon "$OREGON_URL" "$OREGON_SERVER_KEY"

          auth="$RUNNER_TEMP/virginia-auth-settings.json"
          curl --fail --silent --show-error \
            --header "apikey: $VIRGINIA_PUBLIC_KEY" \
            "${VIRGINIA_URL%/}/auth/v1/settings" > "$auth"
          jq -e '.external.azure == true' "$auth" >/dev/null || {
            echo "Virginia Microsoft Auth is not ready for worker cutover." >&2
            exit 1
          }

          echo "supabase_worker_targets_ready=true"
          echo "virginia_auth_ready=true"

      - name: Validate worker stack is safe to switch
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || { echo "Wrong AWS account: $ACCOUNT" >&2; exit 1; }
          STATUS="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text)"
          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Worker stack is not switch-ready: $STATUS" >&2; exit 1 ;;
          esac
          SUPABASE_URL="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Parameters[?ParameterKey==`SupabaseUrl`].ParameterValue | [0]' --output text)"
          test -n "$SUPABASE_URL" && test "$SUPABASE_URL" != "None" || { echo "Worker stack SupabaseUrl parameter is missing" >&2; exit 1; }
          SECRET_ARN="$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --logical-resource-id SupabaseServiceRoleSecret --query 'StackResources[0].PhysicalResourceId' --output text)"
          test -n "$SECRET_ARN" && test "$SECRET_ARN" != "None" || { echo "Worker service-role secret resource is missing" >&2; exit 1; }
          echo "worker_stack_switch_ready=true"
          echo "No production worker configuration was changed."
