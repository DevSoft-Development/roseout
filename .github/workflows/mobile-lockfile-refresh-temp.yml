name: Temporary mobile lockfile refresh

on:
  push:
    branches:
      - fix/mobile-lockfile-sync-2026-09-17

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-lockfile-sync-2026-09-17
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Regenerate mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --include=dev --ignore-scripts

      - name: Verify clean install
        working-directory: mobile
        run: npm ci --include=dev --ignore-scripts

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile already in sync."
            exit 0
          fi
          git add mobile/package-lock.json
          git commit -m "Sync mobile package lock [lockfile-generated]"
          git push origin HEAD:fix/mobile-lockfile-sync-2026-09-17
