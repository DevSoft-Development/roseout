name: Azure AI gateway

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/ai/gateway/**"
      - "docs/architecture/ai-gateway.md"
      - ".github/workflows/azure-ai-gateway.yml"
  push:
    branches:
      - main
    paths:
      - "lib/ai/gateway/**"
      - "docs/architecture/ai-gateway.md"
      - ".github/workflows/azure-ai-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: AI gateway contract and failover policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run AI gateway tests
        run: npx vitest run lib/ai/gateway/__tests__

      - name: Typecheck
        run: npm run typecheck
