name: AWS reservation recovery sweep

on:
  pull_request:
    paths:
      - '.github/workflows/aws-reservation-recovery-sweep.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-reservation-recovery-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-reservation-recovery-sweep-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-reservation-recovery
  SCHEDULE_NAME: reservation-not-found-canary-5m

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sweep contract
        run: |
          set -euo pipefail
          grep -F 'rate(5 minutes)' .github/workflows/aws-reservation-recovery-sweep.yml >/dev/null
          grep -F '"function":"reservation-recovery"' .github/workflows/aws-reservation-recovery-sweep.yml >/dev/null
          grep -F '"limit":25' .github/workflows/aws-reservation-recovery-sweep.yml >/dev/null
          grep -F '"concurrency":8' .github/workflows/aws-reservation-recovery-sweep.yml >/dev/null
          grep -F '"statuses":["not_found"]' .github/workflows/aws-reservation-recovery-sweep.yml >/dev/null
          grep -F '"renderedFallback":true' .github/workflows/aws-reservation-recovery-sweep.yml >/dev/null
          grep -F '"renderedFallbackLimit":3' .github/workflows/aws-reservation-recovery-sweep.yml >/dev/null
          grep -F '"googleCalls":0' .github/workflows/aws-reservation-recovery-sweep.yml >/dev/null

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Upsert temporary five-minute reservation sweep
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

          if ! aws scheduler get-schedule-group --name "$SCHEDULE_GROUP" >/dev/null 2>&1; then
            aws scheduler create-schedule-group --name "$SCHEDULE_GROUP" >/dev/null
          fi

          INVOKER_ARN="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          SCHEDULER_ROLE="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"
          test -n "$INVOKER_ARN" && test "$INVOKER_ARN" != 'None'
          test -n "$SCHEDULER_ROLE" && test "$SCHEDULER_ROLE" != 'None'

          INPUT='{"function":"reservation-recovery","body":{"source":"aws_eventbridge_backlog","limit":25,"concurrency":8,"force":false,"statuses":["not_found"],"renderedFallback":true,"renderedFallbackLimit":3,"googleCalls":0}}'
          TARGET="$(jq -nc --arg arn "$INVOKER_ARN" --arg role "$SCHEDULER_ROLE" --arg input "$INPUT" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:900,MaximumRetryAttempts:1}}')"
          END_DATE="$(date -u -d '+30 minutes' '+%Y-%m-%dT%H:%M:%SZ')"

          if aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$SCHEDULE_NAME" >/dev/null 2>&1; then
            aws scheduler update-schedule \
              --group-name "$SCHEDULE_GROUP" \
              --name "$SCHEDULE_NAME" \
              --description 'Temporary TheOutHaven not_found reservation recovery canary; zero Google calls.' \
              --schedule-expression 'rate(5 minutes)' \
              --flexible-time-window '{"Mode":"OFF"}' \
              --state ENABLED \
              --end-date "$END_DATE" \
              --action-after-completion DELETE \
              --target "$TARGET" >/dev/null
          else
            aws scheduler create-schedule \
              --group-name "$SCHEDULE_GROUP" \
              --name "$SCHEDULE_NAME" \
              --description 'Temporary TheOutHaven not_found reservation recovery canary; zero Google calls.' \
              --schedule-expression 'rate(5 minutes)' \
              --flexible-time-window '{"Mode":"OFF"}' \
              --state ENABLED \
              --end-date "$END_DATE" \
              --action-after-completion DELETE \
              --target "$TARGET" >/dev/null
          fi

          test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$SCHEDULE_NAME" --query State --output text)" = 'ENABLED'
          test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$SCHEDULE_NAME" --query ScheduleExpression --output text)" = 'rate(5 minutes)'

          aws lambda invoke             --function-name "$INVOKER_ARN"             --cli-binary-format raw-in-base64-out             --payload "$INPUT"             "$RUNNER_TEMP/reservation-recovery-probe.json" >/dev/null
          jq -e '.ok == true and .response.success == true' "$RUNNER_TEMP/reservation-recovery-probe.json" >/dev/null
          jq '{ok,function,status,response:{selected:.response.selected,attempted:.response.attempted,found:.response.found,notFound:.response.notFound,blocked:.response.blocked,failed:.response.failed,renderedAttempted:.response.renderedAttempted,renderedFound:.response.renderedFound,renderedFailed:.response.renderedFailed,renderedErrorCounts:.response.renderedErrorCounts,providerCounts:.response.providerCounts}}' "$RUNNER_TEMP/reservation-recovery-probe.json"

          echo "Reservation recovery sweep enabled through $END_DATE UTC."

      - name: Sweep summary
        run: |
          {
            echo '### Reservation recovery sweep'
            echo ''
            echo '- Frequency: every 5 minutes'
            echo '- Batch size: 25'
            echo '- Concurrency: 8'
            echo '- Statuses: not_found only'
            echo '- Rendered fallback: first 3 eligible rows per batch'
            echo '- Renderer isolation: dedicated Lambda; worker caps rendered fallback to 3 rows per batch'
            echo '- Google calls: 0'
            echo '- Isolation: separate EventBridge schedule group; canonical 65-schedule fleet unchanged'
            echo '- Retry policy: honor reservation_discovery_next_retry_at'\n            echo '- Safety cap: schedule auto-deletes after 30 minutes'
          } >> "$GITHUB_STEP_SUMMARY"
