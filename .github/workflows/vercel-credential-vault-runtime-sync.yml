name: Vercel Credential Vault runtime sync

on:
  pull_request:
    paths:
      - '.github/workflows/vercel-credential-vault-runtime-sync.yml'
      - 'lib/admin/credential-vault-catalog.ts'
      - 'lib/admin/credential-vault-runtime-source.ts'
  workflow_run:
    workflows: ['AWS Credential Vault runtime sync']
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Credential Vault environment to propagate
        required: true
        default: production
        type: choice
        options: [production, staging]

permissions:
  contents: read
  id-token: write

concurrency:
  group: vercel-credential-vault-sync-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  CREDENTIAL_VAULT_PREFIX: /theouthaven/credential-vault
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_PROJECT_NAME: roseout

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate vault-only Vercel propagation
        run: |
          set -euo pipefail
          FILE='.github/workflows/vercel-credential-vault-runtime-sync.yml'
          grep -F '/theouthaven/credential-vault' "$FILE" >/dev/null
          grep -F 'VERCEL_TOKEN' "$FILE" >/dev/null
          grep -F 'MICROSOFT_CLIENT_SECRET' "$FILE" >/dev/null
          grep -F 'STRIPE_SECRET_KEY' "$FILE" >/dev/null
          grep -F 'OPENAI_API_KEY' "$FILE" >/dev/null
          grep -F 'AWS_PLATFORM_JOB_GATEWAY_SECRET' "$FILE" >/dev/null
          if grep -Eq '^[[:space:]]+[A-Z0-9_]+:[[:space:]]*\$\{\{[[:space:]]*secrets\.' "$FILE"; then
            echo 'Credential propagation must read provider values from Credential Vault, not GitHub secrets.' >&2
            exit 1
          fi

  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Build Vercel environment from Credential Vault
        id: build
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in production|staging) ;; *) echo 'Invalid environment' >&2; exit 1 ;; esac
          WORK="$RUNNER_TEMP/vercel-vault-sync"
          mkdir -p "$WORK/providers"
          for provider in google supabase vercel github microsoft openai huggingface brave serpapi stripe resend twilio telnyx threecx meta tiktok apple turnstile expo domains platform; do
            secret_id="${CREDENTIAL_VAULT_PREFIX}/${TARGET_ENV}/${provider}"
            if ! aws secretsmanager get-secret-value --secret-id "$secret_id" --query SecretString --output text > "$WORK/providers/${provider}.json" 2>/dev/null; then
              printf '{}\n' > "$WORK/providers/${provider}.json"
            fi
            jq -e 'type == "object"' "$WORK/providers/${provider}.json" >/dev/null
          done

          VERCEL_TOKEN="$(jq -r '.token // empty' "$WORK/providers/vercel.json")"
          VAULT_TEAM_ID="$(jq -r '.teamId // empty' "$WORK/providers/vercel.json")"
          if [ -z "$VERCEL_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo 'Credential Vault Vercel token is not configured' >&2
              exit 1
            fi
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Credential Vault Vercel token is not configured; skipping optional Vercel runtime propagation during Azure migration.'
            exit 0
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "::add-mask::$VERCEL_TOKEN"
          if [ -n "$VAULT_TEAM_ID" ]; then VERCEL_TEAM_ID="$VAULT_TEAM_ID"; fi
          echo "VERCEL_RUNTIME_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"
          echo "VERCEL_RUNTIME_TEAM_ID=$VERCEL_TEAM_ID" >> "$GITHUB_ENV"

          python3 - "$WORK" "$TARGET_ENV" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1]); target = sys.argv[2]
          mapping = {
              'google': {'apiKey':['GOOGLE_PLACES_API_KEY','GOOGLE_GEOCODING_API_KEY'],'clientId':['GOOGLE_CLIENT_ID','GOOGLE_OAUTH_CLIENT_ID'],'clientSecret':['GOOGLE_CLIENT_SECRET','GOOGLE_OAUTH_CLIENT_SECRET']},
              'supabase': {'url':['SUPABASE_URL'],'publishableKey':['NEXT_PUBLIC_SUPABASE_ANON_KEY'],'serviceRoleKey':['SUPABASE_SERVICE_ROLE_KEY']},
              'vercel': {'token':['VERCEL_TOKEN'],'teamId':['VERCEL_TEAM_ID','VERCEL_ORG_ID']},
              'github': {'token':['GITHUB_TOKEN'],'appId':['GITHUB_APP_ID'],'privateKey':['GITHUB_APP_PRIVATE_KEY']},
              'microsoft': {'tenantId':['MICROSOFT_TENANT_ID'],'clientId':['MICROSOFT_CLIENT_ID'],'clientSecret':['MICROSOFT_CLIENT_SECRET']},
              'openai': {'apiKey':['OPENAI_API_KEY']},
              'huggingface': {'token':['SEARCH_HF_ML_TOKEN','HF_TOKEN','HUGGINGFACE_TOKEN']},
              'brave': {'apiKey':['BRAVE_SEARCH_API_KEY']},
              'serpapi': {'apiKey':['SERPAPI_API_KEY']},
              'stripe': {'secretKey':['STRIPE_SECRET_KEY'],'webhookSecret':['STRIPE_WEBHOOK_SECRET'],'connectWebhookSecret':['STRIPE_CONNECT_WEBHOOK_SECRET']},
              'resend': {'apiKey':['RESEND_API_KEY'],'webhookSecret':['RESEND_WEBHOOK_SECRET']},
              'twilio': {'accountSid':['TWILIO_ACCOUNT_SID'],'authToken':['TWILIO_AUTH_TOKEN']},
              'telnyx': {'publicKey':['TELNYX_PUBLIC_KEY'],'transactionalApiKey':['TELNYX_TRANSACTIONAL_API_KEY'],'reservationsApiKey':['TELNYX_RESERVATIONS_API_KEY'],'crmApiKey':['TELNYX_CRM_API_KEY'],'supportApiKey':['TELNYX_SUPPORT_API_KEY'],'marketingApiKey':['TELNYX_MARKETING_API_KEY'],'conciergeApiKey':['TELNYX_CONCIERGE_API_KEY']},
              'threecx': {'crmApiKey':['THREE_CX_CRM_API_KEY']},
              'meta': {'appId':['META_APP_ID','FACEBOOK_APP_ID'],'appSecret':['META_APP_SECRET','FACEBOOK_APP_SECRET'],'instagramAppId':['INSTAGRAM_APP_ID','META_INSTAGRAM_APP_ID'],'instagramAppSecret':['INSTAGRAM_APP_SECRET','META_INSTAGRAM_APP_SECRET'],'graphVersion':['META_GRAPH_VERSION'],'loginConfigurationId':['META_LOGIN_CONFIGURATION_ID'],'accessToken':['META_ACCESS_TOKEN','FACEBOOK_ACCESS_TOKEN']},
              'tiktok': {'clientKey':['TIKTOK_CLIENT_KEY'],'clientSecret':['TIKTOK_CLIENT_SECRET']},
              'apple': {'issuerId':['APPLE_BUSINESS_API_CLIENT_ID','APPLE_CLIENT_ID'],'keyId':['APPLE_BUSINESS_API_KEY_ID','APPLE_KEY_ID'],'privateKey':['APPLE_BUSINESS_API_PRIVATE_KEY','APPLE_PRIVATE_KEY']},
              'turnstile': {'secretKey':['TURNSTILE_SECRET_KEY']},
              'expo': {'accessToken':['EXPO_ACCESS_TOKEN']},
              'domains': {'apiKey':['DOMAIN_PROVIDER_API_KEY'],'apiSecret':['DOMAIN_PROVIDER_API_SECRET'],'accountId':['DOMAIN_PROVIDER_ACCOUNT_ID'],'gatewaySecret':['DOMAIN_GATEWAY_SECRET']},
              'platform': {'cronSecret':['CRON_SECRET'],'importSecret':['IMPORT_SECRET'],'internalImportSecret':['INTERNAL_IMPORT_SECRET'],'outingReminderCronSecret':['OUTING_REMINDER_CRON_SECRET'],'googleLocationEnrichmentCronSecret':['GOOGLE_LOCATION_ENRICHMENT_CRON_SECRET'],'adminApiSecret':['ADMIN_API_SECRET'],'adminDigestSecret':['ADMIN_DIGEST_SECRET'],'notificationSecret':['NOTIFICATION_SECRET'],'supportEmailWebhookSecret':['SUPPORT_EMAIL_WEBHOOK_SECRET'],'supportInboundSecret':['SUPPORT_INBOUND_SECRET'],'websiteHostingGatewaySecret':['AWS_WEBSITE_HOSTING_GATEWAY_SECRET'],'drGatewaySecret':['AWS_PLATFORM_DR_GATEWAY_SECRET'],'jobGatewaySecret':['AWS_PLATFORM_JOB_GATEWAY_SECRET'],'integrationApiSecret':['AWS_PLATFORM_INTEGRATION_API_SECRET'],'assistantApiSecret':['AWS_PLATFORM_ASSISTANT_API_SECRET']},
          }
          target_name = 'production' if target == 'production' else 'preview'
          entries = []
          for provider, fields in mapping.items():
              values = json.loads((root/'providers'/f'{provider}.json').read_text())
              for field, names in fields.items():
                  value = values.get(field)
                  if not isinstance(value, str) or not value.strip(): continue
                  for name in names:
                      entries.append({'key':name,'value':value.strip(),'type':'encrypted','target':[target_name]})
          (root/'vercel-env.json').write_text(json.dumps(entries, separators=(',', ':')))
          (root/'count').write_text(str(len(entries)))
          PY
          COUNT="$(cat "$WORK/count")"
          test "$COUNT" -gt 0 || { echo 'No vault credentials available for Vercel propagation' >&2; exit 1; }
          echo "VERCEL_SYNC_FILE=$WORK/vercel-env.json" >> "$GITHUB_ENV"
          echo "credential_entries=$COUNT"

      - name: Upsert Vercel runtime credentials
        if: ${{ steps.build.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_RUNTIME_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$VERCEL_SYNC_FILE" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_RUNTIME_TEAM_ID}" >/dev/null
          echo 'Vercel runtime credentials synchronized from Credential Vault.'

      - name: Redeploy production so startup consumers receive rotations
        if: ${{ steps.build.outputs.enabled == 'true' && (inputs.environment || 'production') == 'production' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_RUNTIME_TOKEN" \
            "https://api.vercel.com/v7/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=1&teamId=${VERCEL_RUNTIME_TEAM_ID}" > "$RUNNER_TEMP/vercel-current.json"
          OLD_ID="$(jq -r '.deployments[0].uid // .deployments[0].id // empty' "$RUNNER_TEMP/vercel-current.json")"
          test -n "$OLD_ID"
          jq -n --arg name "$VERCEL_PROJECT_NAME" --arg project "$VERCEL_PROJECT_ID" --arg deploymentId "$OLD_ID" '{name:$name,project:$project,deploymentId:$deploymentId,target:"production"}' > "$RUNNER_TEMP/vercel-redeploy.json"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_RUNTIME_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/vercel-redeploy.json" \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_RUNTIME_TEAM_ID}" > "$RUNNER_TEMP/vercel-new.json"
          NEW_ID="$(jq -r '.id // .uid // empty' "$RUNNER_TEMP/vercel-new.json")"
          test -n "$NEW_ID"
          READY=false
          for _ in $(seq 1 120); do
            curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_RUNTIME_TOKEN" \
              "https://api.vercel.com/v13/deployments/${NEW_ID}?teamId=${VERCEL_RUNTIME_TEAM_ID}" > "$RUNNER_TEMP/vercel-status.json"
            STATE="$(jq -r '.readyState // .state // empty' "$RUNNER_TEMP/vercel-status.json")"
            if [ "$STATE" = READY ]; then READY=true; break; fi
            if [ "$STATE" = ERROR ] || [ "$STATE" = CANCELED ]; then exit 1; fi
            sleep 5
          done
          test "$READY" = true
          echo 'Production redeployed with Credential Vault values.'
