name: Enable Supabase Leaked Password Protection

on:
  push:
    branches:
      - agent/platform-fraud-system
    paths:
      - .github/workflows/enable-supabase-leaked-password-protection.yml

permissions:
  contents: read

jobs:
  enable-hibp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: hnhbzynoyrhjndefbwkh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Validate management token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing required GitHub Actions secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Enable leaked-password protection
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"password_hibp_enabled":true}')
          echo "$response" | jq -e '.password_hibp_enabled == true' >/dev/null

      - name: Verify leaked-password protection remains enabled
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X GET "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -e '.password_hibp_enabled == true' >/dev/null
