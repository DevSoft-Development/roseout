name: Finalize Supabase Edge Functions retirement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/retire-supabase-edge-functions.yml'
      - 'lib/admin/credential-vault-catalog.ts'
      - 'apps/admin/lib/admin/credential-vault-catalog.ts'
      - 'infra/aws/lambda/platform_job_gateway.py'
      - '.github/workflows/aws-admin-credential-vault.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-supabase-edge-functions.yml'
      - 'lib/admin/credential-vault-catalog.ts'
      - 'apps/admin/lib/admin/credential-vault-catalog.ts'
      - 'infra/aws/lambda/platform_job_gateway.py'
      - '.github/workflows/aws-admin-credential-vault.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: finalize-supabase-edge-functions-retirement-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  VIRGINIA_REF: ftdsltatyqhtllyyefzp
  OREGON_REF: hnhbzynoyrhjndefbwkh
  VAULT_SECRET: /theouthaven/credential-vault/production/supabase

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate post-retirement credential contract
        run: |
          set -euo pipefail
          grep -F '"supabase": {"url", "publishableKey", "secretKey", "serviceRoleKey", "managementAccessToken"}' infra/aws/lambda/platform_job_gateway.py >/dev/null
          grep -F '{ key: "managementAccessToken", label: "Management access token"' lib/admin/credential-vault-catalog.ts >/dev/null
          grep -F '{ key: "managementAccessToken", label: "Management access token"' apps/admin/lib/admin/credential-vault-catalog.ts >/dev/null
          ! grep -F 'edgeFunctionsManagementToken' lib/admin/credential-vault-catalog.ts
          ! grep -F 'edgeFunctionsManagementToken' apps/admin/lib/admin/credential-vault-catalog.ts
          ! grep -F 'edgeFunctionsManagementToken' infra/aws/lambda/platform_job_gateway.py
          ! grep -F '/v1/projects/$ref/functions/$slug' .github/workflows/retire-supabase-edge-functions.yml

  finalize:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Prove zero Edge Functions and destroy one-time vault credential
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value             --secret-id "$VAULT_SECRET"             --query SecretString             --output text > "$RUNNER_TEMP/supabase-vault-before.json"

          GENERAL_TOKEN="$(jq -r '.managementAccessToken // empty' "$RUNNER_TEMP/supabase-vault-before.json")"
          RETIREMENT_TOKEN="$(jq -r '.edgeFunctionsManagementToken // empty' "$RUNNER_TEMP/supabase-vault-before.json")"

          test -n "$GENERAL_TOKEN" || {
            echo "::error::General Supabase managementAccessToken is missing; refusing credential cleanup."
            exit 1
          }
          echo "::add-mask::$GENERAL_TOKEN"

          if [ -n "$RETIREMENT_TOKEN" ]; then
            echo "::add-mask::$RETIREMENT_TOKEN"
            for ref in "$VIRGINIA_REF" "$OREGON_REF"; do
              CODE="$(curl --silent --show-error                 --output "$RUNNER_TEMP/$ref-functions.json"                 --write-out '%{http_code}'                 -H "Authorization: Bearer $RETIREMENT_TOKEN"                 "https://api.supabase.com/v1/projects/$ref/functions")"
              test "$CODE" = 200 || {
                echo "::error::Retirement token cannot prove Edge Functions state for $ref (HTTP $CODE)."
                exit 1
              }
              COUNT="$(jq 'length' "$RUNNER_TEMP/$ref-functions.json")"
              test "$COUNT" = 0 || {
                echo "::error::$ref still has $COUNT deployed Supabase Edge Functions; refusing token destruction."
                exit 1
              }
            done

            jq 'del(.edgeFunctionsManagementToken)'               "$RUNNER_TEMP/supabase-vault-before.json"               > "$RUNNER_TEMP/supabase-vault-after.json"

            test "$(jq -r '.managementAccessToken // empty' "$RUNNER_TEMP/supabase-vault-after.json")" = "$GENERAL_TOKEN"
            aws secretsmanager put-secret-value               --secret-id "$VAULT_SECRET"               --secret-string "file://$RUNNER_TEMP/supabase-vault-after.json"               >/dev/null
          else
            cp "$RUNNER_TEMP/supabase-vault-before.json" "$RUNNER_TEMP/supabase-vault-after.json"
            echo "retirement_token_already_absent=true"
          fi

          aws secretsmanager get-secret-value             --secret-id "$VAULT_SECRET"             --query SecretString             --output text > "$RUNNER_TEMP/supabase-vault-verified.json"

          test "$(jq -r '.edgeFunctionsManagementToken // empty' "$RUNNER_TEMP/supabase-vault-verified.json")" = ""
          test "$(jq -r '.managementAccessToken // empty' "$RUNNER_TEMP/supabase-vault-verified.json")" = "$GENERAL_TOKEN"

          jq -S 'del(.edgeFunctionsManagementToken)' "$RUNNER_TEMP/supabase-vault-before.json" > "$RUNNER_TEMP/expected.json"
          jq -S . "$RUNNER_TEMP/supabase-vault-verified.json" > "$RUNNER_TEMP/actual.json"
          cmp -s "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/actual.json" || {
            echo "::error::Vault changed beyond removal of edgeFunctionsManagementToken."
            exit 1
          }

          rm -f "$RUNNER_TEMP"/*.json

      - name: Write retirement evidence
        run: |
          {
            echo '### Supabase Edge Functions retirement credential finalized'
            echo '- Virginia deployed Supabase Edge Functions: 0'
            echo '- Oregon deployed Supabase Edge Functions: 0'
            echo '- edgeFunctionsManagementToken removed from AWS Credential Vault'
            echo '- managementAccessToken preserved unchanged'
            echo '- Credential gateway no longer accepts the retired field'
          } >> "$GITHUB_STEP_SUMMARY"
