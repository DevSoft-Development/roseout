name: AWS DR steady-state verification

on:
  workflow_run:
    workflows: ['AWS DR scheduler activation']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-dr-steady-state-verification-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-edge-runtime
  DR_SECRET_NAME: /theouthaven/production/dr-reconciler/env

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Read authoritative DR primary mode
        id: mode
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws secretsmanager get-secret-value --secret-id "$DR_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/dr-current.json"
          mode="$(jq -r '.DR_MODE // empty' "$RUNNER_TEMP/dr-current.json")"
          case "$mode" in
            virginia_primary|oregon_primary) ;;
            promotion_in_progress|failback_in_progress) echo "DR transition is still in progress: $mode" >&2; exit 1 ;;
            *) echo "Unsafe or missing DR_MODE: $mode" >&2; exit 1 ;;
          esac
          echo "dr_mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Verify primary-aware scheduler state
        run: |
          set -euo pipefail
          mode='${{ steps.mode.outputs.dr_mode }}'
          test "$(jq 'length' infra/aws/edge-runtime/schedules.json)" = '24'
          test "$(jq 'length' infra/aws/edge-runtime/dr-schedules.json)" = '2'
          base_verified=0
          while IFS= read -r name; do
            test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)" = 'ENABLED' || { echo "Base schedule not enabled: $name" >&2; exit 1; }
            base_verified=$((base_verified + 1))
          done < <(jq -r '.[].name' infra/aws/edge-runtime/schedules.json)
          test "$base_verified" = '24'

          if [ "$mode" = 'virginia_primary' ]; then expected=ENABLED; else expected=DISABLED; fi
          dr_verified=0
          while IFS= read -r name; do
            state="$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)"
            test "$state" = "$expected" || { echo "DR schedule $name expected $expected, got $state" >&2; exit 1; }
            dr_verified=$((dr_verified + 1))
          done < <(jq -r '.[].name' infra/aws/edge-runtime/dr-schedules.json)
          test "$dr_verified" = '2'

      - name: Verify Virginia to Oregon passive standby health
        if: steps.mode.outputs.dr_mode == 'virginia_primary'
        run: |
          set -euo pipefail
          invoker="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          printf '%s' '{"function":"dr-standby-reconciler","body":{"operation":"status","dryRun":true}}' > "$RUNNER_TEMP/status-input.json"
          aws lambda invoke --function-name "$invoker" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/status-input.json" "$RUNNER_TEMP/status-output.json" >/dev/null
          jq -e '.ok==true and .status<400 and .response.success==true and .response.guard.sourceCronJobs==0 and .response.guard.sourceActiveSlots==1 and .response.guard.targetActiveCronJobs==0 and .response.guard.targetReadyTables==462 and .response.guard.targetConnectedWorkers>=1 and .response.auth.parity==true and .response.storage.parity==true' "$RUNNER_TEMP/status-output.json" >/dev/null

      - name: Verify Oregon-primary reverse tooling is reachable
        if: steps.mode.outputs.dr_mode == 'oregon_primary'
        run: |
          set -euo pipefail
          invoker="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          printf '%s' '{"function":"dr-failback-reconciler","body":{"operation":"status","dryRun":true}}' > "$RUNNER_TEMP/status-input.json"
          aws lambda invoke --function-name "$invoker" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/status-input.json" "$RUNNER_TEMP/status-output.json" >/dev/null
          jq -e '.ok==true and .status<400 and .response.success==true and .response.direction=="oregon_to_virginia"' "$RUNNER_TEMP/status-output.json" >/dev/null

      - name: Verification summary
        run: |
          mode='${{ steps.mode.outputs.dr_mode }}'
          if [ "$mode" = 'virginia_primary' ]; then
            dr_state='2 enabled'; lane='Virginia -> Oregon standby verified'
          else
            dr_state='2 disabled'; lane='Oregon primary; reverse failback tooling reachable'
          fi
          {
            echo '### Oregon DR steady-state verification'
            echo ''
            echo "- Authoritative DR mode: \`$mode\`"
            echo '- Base EventBridge schedules: 24 enabled.'
            echo "- Forward DR EventBridge schedules: $dr_state."
            echo "- Lane state: $lane."
            echo '- Supabase pg_cron remains outside AWS scheduler execution.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.json