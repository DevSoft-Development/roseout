name: Stamps credential connection diagnostic

on:
  push:
    branches:
      - fix/stamps-credential-test-diagnostic
    paths:
      - '.github/workflows/stamps-credential-test-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: '742020474738'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve diagnostic configuration
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          INTEGRATION_API_SECRET: ${{ secrets.AWS_PLATFORM_INTEGRATION_API_SECRET }}
          JOB_GATEWAY_SECRET: ${{ secrets.AWS_PLATFORM_JOB_GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          SHARED_SECRET="${INTEGRATION_API_SECRET:-$JOB_GATEWAY_SECRET}"
          test -n "$SHARED_SECRET"
          test "${#SHARED_SECRET}" -ge 32
          echo "::add-mask::$SHARED_SECRET"
          printf '%s' "$SHARED_SECRET" > "$RUNNER_TEMP/integration-api-secret"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Diagnose Stamps connection safely
        run: |
          set -euo pipefail
          STACK='theouthaven-integration-api-production'
          API_URL="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='IntegrationApiUrl'].OutputValue" --output text)"
          test -n "$API_URL" && test "$API_URL" != 'None'

          SECRET_ID="/theouthaven/credential-vault/production/stamps"
          SECRET_FILE="$RUNNER_TEMP/stamps-secret.json"
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" >/dev/null 2>&1; then
            aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text > "$SECRET_FILE"
            CONFIGURED_FIELDS="$(jq -r '[to_entries[] | select(.value|type=="string" and length>0) | .key] | sort | join(",")' "$SECRET_FILE")"
            echo "vault_secret_exists=true"
            echo "vault_configured_fields=$CONFIGURED_FIELDS"
            for key in integrationId username password; do
              value="$(jq -r --arg key "$key" '.[$key] // empty' "$SECRET_FILE")"
              if [ -n "$value" ]; then echo "::add-mask::$value"; fi
            done
          else
            echo 'vault_secret_exists=false'
            echo 'vault_configured_fields='
            exit 0
          fi

          SECRET="$(cat "$RUNNER_TEMP/integration-api-secret")"
          BASE_URL="${API_URL%/}"
          PATH_VALUE='/v1/stamps/connection-test'
          BODY_VALUE='{}'
          TIMESTAMP="$(python - <<'PY'
          import time
          print(int(time.time() * 1000))
          PY
          )"
          SIGNATURE="$(SECRET="$SECRET" TIMESTAMP="$TIMESTAMP" PATH_VALUE="$PATH_VALUE" BODY_VALUE="$BODY_VALUE" python - <<'PY'
          import hashlib, hmac, os
          canonical='\n'.join([os.environ['TIMESTAMP'],'POST',os.environ['PATH_VALUE'],os.environ['BODY_VALUE']])
          print(hmac.new(os.environ['SECRET'].encode(), canonical.encode(), hashlib.sha256).hexdigest())
          PY
          )"

          HTTP_STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/stamps-connection.json" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header "x-toh-timestamp: $TIMESTAMP" \
            --header "x-toh-signature: $SIGNATURE" \
            --data "$BODY_VALUE" \
            "$BASE_URL$PATH_VALUE")"
          echo "connection_http_status=$HTTP_STATUS"
          ERROR_CODE="$(jq -r '.error // empty' "$RUNNER_TEMP/stamps-connection.json" 2>/dev/null || true)"
          if [ -n "$ERROR_CODE" ]; then
            case "$ERROR_CODE" in
              stamps_*) echo "connection_error_code=$ERROR_CODE" ;;
              *) echo 'connection_error_code=non_stamps_error' ;;
            esac
          else
            OK="$(jq -r '.ok // false' "$RUNNER_TEMP/stamps-connection.json" 2>/dev/null || echo false)"
            echo "connection_ok=$OK"
          fi

          STAMPS_SECRET_FILE="$SECRET_FILE" python - <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          endpoint='https://swsim.stamps.com/swsim/swsimv160.asmx'
          namespace='http://stamps.com/xml/namespace/2026/06/swsim/SwsimV160'
          with open(os.environ['STAMPS_SECRET_FILE'], encoding='utf-8') as handle:
              secret=json.load(handle)
          def esc(value):
              return html.escape(str(value or ''), quote=True)
          body=(
              '<?xml version="1.0" encoding="utf-8"?>'
              f'<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:sws="{namespace}">'
              '<soapenv:Header/><soapenv:Body><sws:GetAccountInfo><sws:Credentials>'
              f'<sws:IntegrationID>{esc(secret.get("integrationId"))}</sws:IntegrationID>'
              f'<sws:Username>{esc(secret.get("username"))}</sws:Username>'
              f'<sws:Password>{esc(secret.get("password"))}</sws:Password>'
              '</sws:Credentials></sws:GetAccountInfo></soapenv:Body></soapenv:Envelope>'
          ).encode('utf-8')
          request=urllib.request.Request(endpoint, data=body, method='POST', headers={
              'Content-Type':'text/xml; charset=utf-8',
              'SOAPAction':f'"{namespace}/GetAccountInfo"',
              'User-Agent':'TheOutHaven/1.0',
          })
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  status=response.status
                  payload=response.read(2_000_001)
          except urllib.error.HTTPError as exc:
              status=exc.code
              payload=exc.read(2_000_001)
          except Exception as exc:
              print('direct_probe_transport=' + type(exc).__name__)
              raise SystemExit(0)
          print(f'direct_probe_http_status={status}')
          text=payload.decode('utf-8', errors='replace')
          print('direct_probe_fault_hash=' + hashlib.sha256(text.encode()).hexdigest()[:16])
          lowered=text.lower()
          categories=[]
          for label, needles in {
              'credentials':['invalid credential','invalid login','authentication failed','not authenticated'],
              'integration_id':['integrationid','integration id'],
              'username':['username','user name'],
              'password':['password'],
              'account':['account disabled','account locked','account status'],
              'authorization':['not authorized','unauthorized','forbidden','permission'],
              'terms':['terms and conditions','terms & conditions'],
              'client':['invalid client','client id'],
              'request':['invalid request','malformed','schema'],
          }.items():
              if any(needle in lowered for needle in needles):
                  categories.append(label)
          print('direct_probe_fault_categories=' + (','.join(sorted(set(categories))) or 'unclassified'))
          try:
              root=ET.fromstring(text)
          except ET.ParseError:
              print('direct_probe_xml=parse_failed')
              raise SystemExit(0)
          safe_codes=[]
          for elem in root.iter():
              tag=elem.tag.split('}',1)[-1].lower()
              value=(elem.text or '').strip()
              if tag in {'faultcode','errorcode','code'} and re.fullmatch(r'[A-Za-z0-9_.:-]{1,80}', value):
                  safe_codes.append(value)
          print('direct_probe_fault_codes=' + (','.join(sorted(set(safe_codes))) or 'none'))
          PY

          rm -f "$RUNNER_TEMP/stamps-connection.json" "$RUNNER_TEMP/integration-api-secret" "$SECRET_FILE"
