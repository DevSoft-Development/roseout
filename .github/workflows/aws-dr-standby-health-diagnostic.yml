name: AWS DR standby health diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/aws-dr-standby-health-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-dr-standby-health-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only diagnostic contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-dr-standby-health-diagnostic.yml'
          grep -F 'dr-standby-reconciler' "$FILE" >/dev/null
          grep -F 'operation":"status"' "$FILE" >/dev/null
          grep -F 'dryRun":true' "$FILE" >/dev/null
          grep -F 'targetReadyTables' "$FILE" >/dev/null
          grep -F 'storage_parity' "$FILE" >/dev/null
          FILE="$FILE" python <<'PY'
          import os
          from pathlib import Path

          text = Path(os.environ['FILE']).read_text(encoding='utf-8')
          forbidden = (
              'aws scheduler ' + 'update-schedule',
              'aws secretsmanager ' + 'put-secret-value',
              'apply-' + 'migration',
              'execute-' + 'sql',
          )
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit('Diagnostic workflow contains a mutation command.')
          PY

  diagnose:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Read passive standby health summary
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          invoker="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$invoker"
          printf '%s' '{"function":"dr-standby-reconciler","body":{"operation":"status","dryRun":true}}' > "$RUNNER_TEMP/status-input.json"
          aws lambda invoke \
            --function-name "$invoker" \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$RUNNER_TEMP/status-input.json" \
            "$RUNNER_TEMP/status-output.json" >/dev/null

          jq -c '{
            ok,
            status,
            success: .response.success,
            error: .response.error,
            reason: .response.reason,
            sourceCronJobs: .response.guard.sourceCronJobs,
            sourceActiveSlots: .response.guard.sourceActiveSlots,
            targetActiveCronJobs: .response.guard.targetActiveCronJobs,
            targetReadyTables: .response.guard.targetReadyTables,
            targetConnectedWorkers: .response.guard.targetConnectedWorkers,
            auth_parity: .response.auth.parity,
            storage_parity: .response.storage.parity
          }' "$RUNNER_TEMP/status-output.json"

          jq -e '.ok==true and .status<400 and .response.success==true and .response.guard.sourceCronJobs==0 and .response.guard.sourceActiveSlots==1 and .response.guard.targetActiveCronJobs==0 and .response.guard.targetReadyTables==462 and .response.guard.targetConnectedWorkers>=1 and .response.auth.parity==true and .response.storage.parity==true' "$RUNNER_TEMP/status-output.json" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/status-input.json "$RUNNER_TEMP"/status-output.json
