name: Oregon DR failback recovery once

on:
  pull_request:
    paths:
      - '.github/workflows/oregon-dr-failback-recovery-once.yml'
      - '.github/drills/oregon-failback-recovery-2026-09-01.json'
      - 'scripts/dr/oregon-failback-post-detach.sh'
      - 'scripts/dr/oregon-failback.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oregon-dr-failback-recovery-once.yml'
      - '.github/drills/oregon-failback-recovery-2026-09-01.json'
      - 'scripts/dr/oregon-failback-post-detach.sh'

permissions:
  contents: read
  id-token: write

concurrency:
  group: oregon-dr-failback-recovery-once
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-edge-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate post-detach recovery contract
        run: |
          set -euo pipefail
          marker='.github/drills/oregon-failback-recovery-2026-09-01.json'
          jq -e '.recovery_id=="oregon-failback-recovery-2026-09-01" and .approved==true and .required_start_state=="fail_closed_post_detach" and .expected_final_primary=="virginia"' "$marker" >/dev/null
          bash -n scripts/dr/oregon-failback.sh
          bash -n scripts/dr/oregon-failback-post-detach.sh
          grep -F 'RECOVER_POST_DETACH_VIRGINIA' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'reverse_subscriptions==0' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'forward_subscriptions==0' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'database_fences==1' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'temporary_set_grants==0' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'alter role ${FAILBACK_SUBSCRIBER_ROLE} with nologin noreplication nobypassrls password null' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'revoke pg_create_subscription from ${FAILBACK_SUBSCRIBER_ROLE}' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'revoke ${FAILBACK_SUBSCRIBER_ROLE} from postgres granted by postgres' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'rebuild_forward_lane_only' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'switch_runtime_vercel_to_virginia' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'restore_forward_dr' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          git diff --check

  recover:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Apply hosted-platform recovery compatibility patches
        run: |
          set -euo pipefail
          sed -i 's/{key:"NEXT_PUBLIC_SUPABASE_ANON_KEY",value:$anon,type:"encrypted",target:\["production"\]}/{key:"NEXT_PUBLIC_SUPABASE_ANON_KEY",value:$anon,type:"sensitive",target:["production"]}/' scripts/dr/oregon-failback.sh
          sed -i 's/{key:"SUPABASE_SERVICE_ROLE_KEY",value:$service,type:"encrypted",target:\["production"\]}/{key:"SUPABASE_SERVICE_ROLE_KEY",value:$service,type:"sensitive",target:["production"]}/' scripts/dr/oregon-failback.sh
          # Hosted Supabase project postgres cannot DROP OWNED across platform-owned
          # ACL targets. The obsolete reverse role owns zero objects, so make it
          # inert instead and leave its non-executable ACL entries in place.
          sed -i 's/ drop owned by ${FAILBACK_SUBSCRIBER_ROLE};//' scripts/dr/oregon-failback-post-detach.sh
          sed -i 's/ and \.\[0\]\.acl_dependencies==0//' scripts/dr/oregon-failback-post-detach.sh
          grep -F '{key:"NEXT_PUBLIC_SUPABASE_ANON_KEY",value:$anon,type:"sensitive",target:["production"]}' scripts/dr/oregon-failback.sh >/dev/null
          grep -F '{key:"SUPABASE_SERVICE_ROLE_KEY",value:$service,type:"sensitive",target:["production"]}' scripts/dr/oregon-failback.sh >/dev/null
          ! grep -F ' drop owned by ${FAILBACK_SUBSCRIBER_ROLE};' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          grep -F 'alter role ${FAILBACK_SUBSCRIBER_ROLE} with nologin noreplication nobypassrls password null' scripts/dr/oregon-failback-post-detach.sh >/dev/null
          bash -n scripts/dr/oregon-failback.sh
          bash -n scripts/dr/oregon-failback-post-detach.sh

      - name: Execute guarded post-detach recovery
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OREGON_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CONFIRMATION: RECOVER_POST_DETACH_VIRGINIA
        run: bash scripts/dr/oregon-failback-post-detach.sh

      - name: Verify public production routes
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 6 --retry-delay 5 --max-time 30 https://theouthaven.com/ >/dev/null
          curl --fail --location --silent --show-error --retry 6 --retry-delay 5 --max-time 30 https://theouthaven.com/create >/dev/null
          curl --fail --location --silent --show-error --retry 6 --retry-delay 5 --max-time 30 https://www.theouthaven.com/admin/login >/dev/null

      - name: Fail closed if post-detach recovery fails
        if: failure()
        run: |
          set -euo pipefail
          for manifest in infra/aws/edge-runtime/schedules.json infra/aws/edge-runtime/dr-schedules.json; do
            while IFS= read -r name; do
              aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" > "$RUNNER_TEMP/current-schedule.json" || continue
              expression="$(jq -r '.ScheduleExpression' "$RUNNER_TEMP/current-schedule.json")"
              window="$(jq -c '.FlexibleTimeWindow' "$RUNNER_TEMP/current-schedule.json")"
              target="$(jq -c '.Target' "$RUNNER_TEMP/current-schedule.json")"
              aws scheduler update-schedule --group-name "$SCHEDULE_GROUP" --name "$name" \
                --schedule-expression "$expression" --flexible-time-window "$window" \
                --state DISABLED --target "$target" >/dev/null || true
            done < <(jq -r '.[].name' "$manifest")
          done
          echo 'Post-detach recovery failed closed: all 26 schedules are disabled.' >> "$GITHUB_STEP_SUMMARY"
