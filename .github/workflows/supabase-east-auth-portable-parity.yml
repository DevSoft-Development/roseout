name: Supabase East Auth portable parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-east-auth-portable-parity.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  SOURCE_SUPABASE_REF: hnhbzynoyrhjndefbwkh
  EAST_SUPABASE_REF: ftdsltatyqhtllyyefzp
  RUNTIME_SECRET_NAME: /theouthaven/production/edge-runtime/env

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Fetch Oregon and East Auth configs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN" >&2; exit 1; }
          for ref in "$SOURCE_SUPABASE_REF" "$EAST_SUPABASE_REF"; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${ref}/config/auth" \
              > "$RUNNER_TEMP/auth-${ref}.json"
            jq -e 'type == "object"' "$RUNNER_TEMP/auth-${ref}.json" >/dev/null
          done

      - name: Compare existing secure credential candidates without printing values
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/auth-${SOURCE_SUPABASE_REF}.json"
          RUNTIME="$RUNNER_TEMP/runtime-env.json"
          if aws secretsmanager describe-secret --secret-id "$RUNTIME_SECRET_NAME" >/dev/null 2>&1; then
            aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET_NAME" --query SecretString --output text > "$RUNTIME"
          else
            printf '{}\n' > "$RUNTIME"
          fi
          jq -e 'type == "object"' "$RUNTIME" >/dev/null

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          tmp = Path(os.environ['RUNNER_TEMP'])
          src = json.loads((tmp / f"auth-{os.environ['SOURCE_SUPABASE_REF']}.json").read_text())
          runtime = json.loads((tmp / 'runtime-env.json').read_text())

          def same(src_key, runtime_key):
              a = src.get(src_key)
              b = runtime.get(runtime_key)
              return bool(a) and bool(b) and a == b

          checks = {
              'azure_client_id_matches_aws_runtime': same('external_azure_client_id', 'MICROSOFT_CLIENT_ID'),
              'azure_secret_matches_aws_runtime': same('external_azure_secret', 'MICROSOFT_CLIENT_SECRET'),
              'smtp_password_matches_aws_resend_key': same('smtp_pass', 'RESEND_API_KEY'),
              'aws_runtime_has_microsoft_client_id': bool(runtime.get('MICROSOFT_CLIENT_ID')),
              'aws_runtime_has_microsoft_client_secret': bool(runtime.get('MICROSOFT_CLIENT_SECRET')),
              'aws_runtime_has_resend_api_key': bool(runtime.get('RESEND_API_KEY')),
          }
          for key, value in checks.items():
              print(f'{key}={str(value).lower()}')

          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as f:
              f.write('### Secure Auth credential candidate checks\n\n')
              for key, value in checks.items():
                  f.write(f'- {key}: `{str(value).lower()}`\n')
              f.write('- Secret values were never printed.\n')
          PY
          rm -f "$RUNTIME"

      - name: Synchronize portable Auth settings to East
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/auth-${SOURCE_SUPABASE_REF}.json"
          PAYLOAD="$RUNNER_TEMP/east-auth-portable.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          tmp = Path(os.environ['RUNNER_TEMP'])
          src = json.loads((tmp / f"auth-{os.environ['SOURCE_SUPABASE_REF']}.json").read_text())

          exact = {
              'site_url',
              'uri_allow_list',
              'rate_limit_email_sent',
              'password_hibp_enabled',
              'external_azure_client_id',
              'external_azure_url',
          }
          prefixes = ('mailer_subjects_', 'mailer_templates_')
          payload = {
              key: value
              for key, value in src.items()
              if key in exact or key.startswith(prefixes)
          }

          # Prepare Azure metadata but deliberately keep the provider disabled until
          # the Virginia Supabase callback is allowlisted in Entra and the matching
          # secret is available from a trusted secret store.
          payload['external_azure_enabled'] = False

          (tmp / 'east-auth-portable.json').write_text(json.dumps(payload, separators=(',', ':')))
          print(f'portable_auth_keys_to_sync={len(payload)}')
          PY

          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$PAYLOAD" \
            "https://api.supabase.com/v1/projects/${EAST_SUPABASE_REF}/config/auth" \
            > "$RUNNER_TEMP/east-auth-patch-response.json"
          jq -e 'type == "object"' "$RUNNER_TEMP/east-auth-patch-response.json" >/dev/null

      - name: Verify portable parity and Azure safety gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${EAST_SUPABASE_REF}/config/auth" \
            > "$RUNNER_TEMP/auth-east-after.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          tmp = Path(os.environ['RUNNER_TEMP'])
          src = json.loads((tmp / f"auth-{os.environ['SOURCE_SUPABASE_REF']}.json").read_text())
          east = json.loads((tmp / 'auth-east-after.json').read_text())

          exact = {
              'site_url',
              'uri_allow_list',
              'rate_limit_email_sent',
              'password_hibp_enabled',
              'external_azure_client_id',
              'external_azure_url',
          }
          prefixes = ('mailer_subjects_', 'mailer_templates_')
          keys = sorted(
              key for key in src
              if key in exact or key.startswith(prefixes)
          )
          mismatches = [key for key in keys if src.get(key) != east.get(key)]
          if mismatches:
              print('Portable Auth parity mismatches:')
              for key in mismatches:
                  print(f'  - {key}')
              raise SystemExit(1)
          if east.get('external_azure_enabled') is not False:
              raise SystemExit('Azure provider safety gate failed: East must remain disabled')

          print(f'portable_auth_keys_verified={len(keys)}')
          print('east_azure_provider_enabled=false')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('\n### Portable Auth parity\n\n')
              f.write(f'- Portable settings verified equal: {len(keys)}\n')
              f.write('- East Azure provider remains disabled pending Entra callback + secret verification.\n')
              f.write('- SMTP password and Azure secret were not copied.\n')
          PY

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/auth-*.json "$RUNNER_TEMP"/east-auth-*.json "$RUNNER_TEMP"/runtime-env.json
