name: Supabase baseline fresh rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - fix/supabase-migration-history-alignment
    paths:
      - '.github/workflows/supabase-baseline-fresh-rebuild.yml'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.111.0

jobs:
  fresh-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      - name: Discover required CLI commands
        run: |
          set -euo pipefail
          supabase --version
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase status --help >/dev/null
          command -v psql >/dev/null || { echo "psql is unavailable on the runner" >&2; exit 1; }

      - name: Assert single active baseline
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          test "${#migrations[@]}" -eq 1 || {
            echo "Expected exactly one active baseline migration; found ${#migrations[@]}" >&2
            exit 1
          }
          case "${migrations[0]}" in
            *_virginia_schema_baseline.sql) ;;
            *) echo "Unexpected active migration: ${migrations[0]}" >&2; exit 1 ;;
          esac
          echo "active_migration_count=1"
          echo "baseline_file=${migrations[0]}"

      - name: Rebuild empty local Supabase database
        run: |
          set -euo pipefail
          supabase stop --no-backup >/dev/null 2>&1 || true
          supabase start
          supabase db reset --local

      - name: Verify rebuilt schema and zero cron jobs
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep -E '^(DB_URL|POSTGRES_URL)=')"
          db_url="${DB_URL:-${POSTGRES_URL:-}}"
          test -n "$db_url" || { echo "Unable to resolve local database URL" >&2; exit 1; }

          migration_count="$(psql "$db_url" -X -A -t -v ON_ERROR_STOP=1 -c "select count(distinct version) from supabase_migrations.schema_migrations")"
          test "$migration_count" = "1" || {
            echo "Expected one applied baseline migration; found $migration_count" >&2
            exit 1
          }

          schema_count="$(psql "$db_url" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_namespace where nspname in ('public','private','fraud_internal')")"
          test "$schema_count" = "3" || {
            echo "Expected public/private/fraud_internal schemas; found $schema_count" >&2
            exit 1
          }

          handle_new_user="$(psql "$db_url" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='handle_new_user'")"
          test "$handle_new_user" -ge 1 || { echo "public.handle_new_user missing" >&2; exit 1; }

          aws_wrappers="$(psql "$db_url" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('aws_cleanup_expired_auth_email_tokens_cron','aws_location_enrichment_reconcile_cron','aws_worker_http_response_reconciler_cron')")"
          test "$aws_wrappers" = "3" || { echo "Expected 3 AWS cron wrapper functions; found $aws_wrappers" >&2; exit 1; }

          auth_trigger="$(psql "$db_url" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='auth' and c.relname='users' and t.tgname='on_auth_user_created' and not t.tgisinternal")"
          test "$auth_trigger" = "1" || { echo "Expected on_auth_user_created trigger; found $auth_trigger" >&2; exit 1; }

          cron_jobs="$(psql "$db_url" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from cron.job")"
          test "$cron_jobs" = "0" || { echo "Baseline unexpectedly created $cron_jobs pg_cron jobs" >&2; exit 1; }

          echo "fresh_rebuild_verified=true"
          echo "applied_migration_count=$migration_count"
          echo "aws_wrapper_count=$aws_wrappers"
          echo "auth_trigger_count=$auth_trigger"
          echo "cron_job_count=$cron_jobs"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
