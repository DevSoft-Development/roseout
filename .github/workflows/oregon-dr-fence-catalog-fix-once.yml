name: Oregon DR catalog-derived fence fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oregon-dr-fence-catalog-fix-once.yml'
      - 'scripts/dr/patch-dr-fence-from-catalog.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oregon-dr-fence-catalog-derived
          fetch-depth: 0
      - name: Generate and validate catalog-derived DR fence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/dr/patch-dr-fence-from-catalog.py > "$RUNNER_TEMP/patch-dr-fence-from-catalog.py"
          python3 "$RUNNER_TEMP/patch-dr-fence-from-catalog.py"
          test -f supabase/migrations/20260831233000_enable_dr_data_api_write_fence.sql
          grep -F 'pg_catalog.pg_db_role_setting' supabase/migrations/20260831233000_enable_dr_data_api_write_fence.sql >/dev/null
          grep -F 'pgrst.db_pre_request' supabase/migrations/20260831233000_enable_dr_data_api_write_fence.sql >/dev/null
          unsupported_guc='theouthaven.dr_''write_fence'
          ! grep -F "$unsupported_guc" .github/workflows/oregon-dr-promotion.yml scripts/dr/oregon-failback.sh supabase/migrations/20260831233000_enable_dr_data_api_write_fence.sql >/dev/null
          grep -F 'Virginia layered write fence did not apply.' .github/workflows/oregon-dr-promotion.yml >/dev/null
          grep -F 'DR write-fence probe' .github/workflows/oregon-dr-promotion.yml >/dev/null
          grep -F "'25006'" .github/workflows/oregon-dr-promotion.yml >/dev/null
          grep -F 'Oregon DR write-fence probe' scripts/dr/oregon-failback.sh >/dev/null
          grep -F "'25006'" scripts/dr/oregon-failback.sh >/dev/null
          bash -n scripts/dr/oregon-failback.sh
          create_blob() {
            jq -Rs '{content:.,encoding:"utf-8"}' "$1" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha'
          }
          echo "PROMOTION_BLOB=$(create_blob .github/workflows/oregon-dr-promotion.yml)"
          echo "FAILBACK_BLOB=$(create_blob scripts/dr/oregon-failback.sh)"
          echo "MIGRATION_BLOB=$(create_blob supabase/migrations/20260831233000_enable_dr_data_api_write_fence.sql)"
