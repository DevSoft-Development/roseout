name: Apply Stamps AWS migration patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/dev/apply_stamps_aws_migration.py'
      - '.github/workflows/stamps-aws-migration-patch.yml'

permissions:
  contents: write

concurrency:
  group: stamps-aws-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Diagnose deterministic migration
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          set +e
          python scripts/dev/apply_stamps_aws_migration.py > /tmp/stamps-patch-debug.txt 2>&1
          RC=$?
          set -e
          git reset --hard HEAD
          git clean -fd
          {
            echo "exit_code=${RC}"
            cat /tmp/stamps-patch-debug.txt
          } > stamps-patch-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stamps-patch-debug.txt
          git commit -m "Capture Stamps migration patch diagnostics"
          git push origin "HEAD:${HEAD_BRANCH}"
