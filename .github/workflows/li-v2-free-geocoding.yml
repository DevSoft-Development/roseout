name: LI V2 free geocoding and vault certification
on:
  pull_request:
    paths:
      - 'lib/location-intelligence/v2/free-geocoding.ts'
      - 'lib/__tests__/li-v2-free-geocoding.test.ts'
      - 'lib/location-intelligence/v2/source-executors.ts'
      - 'lib/location-intelligence/v2/orchestrator.ts'
      - 'lib/admin/credential-vault-catalog.ts'
      - 'lib/admin/credential-vault-runtime-source.ts'
      - 'infra/aws/lambda/platform_job_gateway.py'
      - '.github/workflows/li-v2-free-geocoding.yml'
  push:
    branches: [main]
    paths:
      - 'lib/location-intelligence/v2/free-geocoding.ts'
      - 'lib/__tests__/li-v2-free-geocoding.test.ts'
      - 'lib/admin/credential-vault-catalog.ts'
      - '.github/workflows/li-v2-free-geocoding.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run lib/__tests__/li-v2-free-geocoding.test.ts
      - run: python -m py_compile infra/aws/lambda/platform_job_gateway.py
      - name: Verify credential schema and vault catalog
        run: |
          set -euo pipefail
          grep -F '"geoapify": {"apiKey"}' infra/aws/lambda/platform_job_gateway.py
          grep -F 'id: "geoapify"' lib/admin/credential-vault-catalog.ts
          grep -F 'geoapify: { apiKey:' lib/admin/credential-vault-runtime-source.ts
