AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated read-only Azure DevOps MCP endpoint (disabled by default; deploy us-east-1)
Parameters:
  EntraTenantId:
    Type: String
    AllowedPattern: '[0-9a-fA-F-]{36}'
  EntraClientId:
    Type: String
    Default: ebc4388d-ef62-413b-b7d9-175b53ca0348
    AllowedPattern: '[0-9a-fA-F-]{36}'
  AzureDevOpsSecretArn:
    Type: String
    Description: AWS Secrets Manager ARN storing the Entra private certificate key
  EntraCertificateSha1Thumbprint:
    Type: String
    Default: 1B9248EBC79679B023D463C0A47D58F166C79FD6
    AllowedPattern: '[0-9A-Fa-f]{40}'
  LambdaArtifactBucket:
    Type: String
    Description: Private S3 bucket containing the reviewed Lambda zip
  LambdaArtifactKey:
    Type: String
    Description: Immutable S3 key to the reviewed Lambda zip
  ExistingLambdaRoleArn:
    Type: String
    Description: Pre-created execution role ARN with logs and certificate-secret read permissions.
Resources:
  McpLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: handler.handler
      Description: Read-only connector. Do not enable ChatGPT OAuth until separately certified.
      Role: !Ref ExistingLambdaRoleArn
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref LambdaArtifactKey
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          ENTRA_TENANT_ID: !Ref EntraTenantId
          ENTRA_CLIENT_ID: !Ref EntraClientId
          AZDO_CERT_SECRET_ARN: !Ref AzureDevOpsSecretArn
          ENTRA_CERT_SHA1_THUMBPRINT: !Ref EntraCertificateSha1Thumbprint
          AZDO_ORGANIZATION: TheOutHaven
          AZDO_PROJECT: TheOutHaven
  McpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: theouthaven-azure-devops-mcp
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: true
  McpAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref McpApi
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      Name: entra-devops-read
      JwtConfiguration:
        Audience: [!Ref EntraClientId]
        Issuer: !Sub https://login.microsoftonline.com/${EntraTenantId}/v2.0
  McpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref McpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt McpLambda.Arn
      PayloadFormatVersion: '2.0'
  McpRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref McpApi
      RouteKey: POST /api/mcp
      AuthorizationType: JWT
      AuthorizerId: !Ref McpAuthorizer
      AuthorizationScopes: [devops.read]
      Target: !Sub integrations/${McpIntegration}
  McpInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref McpLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${McpApi}/*/POST/api/mcp
Outputs:
  McpApiId:
    Value: !Ref McpApi
