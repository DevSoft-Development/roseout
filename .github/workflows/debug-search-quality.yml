name: Debug search quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture regression output
        id: test
        shell: bash
        run: |
          set +e
          npm run test:search-quality > search-quality.log 2>&1
          rc=$?
          cat search-quality.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-debug
          path: search-quality.log
          retention-days: 1
      - name: Preserve failure status
        shell: bash
        run: |
          test "${{ steps.test.outputs.exit_code }}" = "0"
