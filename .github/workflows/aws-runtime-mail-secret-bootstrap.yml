name: AWS runtime mail secret bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/aws-runtime-mail-secret-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-runtime-mail-secret-bootstrap.yml'
  workflow_run:
    workflows:
      - AWS background cron runtime
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-runtime-mail-secret-bootstrap-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compact bootstrap contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-runtime-mail-secret-bootstrap.yml'
          grep -F 'TheOutHavenLambdaRecursionConfigBootstrap' "$FILE" >/dev/null
          grep -F 'lambda:GetFunctionRecursionConfig' "$FILE" >/dev/null
          grep -F 'lambda:PutFunctionRecursionConfig' "$FILE" >/dev/null
          grep -F 'secretsmanager:PutSecretValue' "$FILE" >/dev/null
          grep -F 'secret:/theouthaven/production/*env-*' "$FILE" >/dev/null
          grep -F 'test "$(wc -c < "$POLICY_FILE")" -lt 384' "$FILE" >/dev/null
          grep -F 'AWS background cron runtime' "$FILE" >/dev/null

  apply:
    needs: validate
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Restore compact recursion and runtime-mail permissions
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          POLICY_NAME='TheOutHavenLambdaRecursionConfigBootstrap'
          POLICY_FILE="$RUNNER_TEMP/runtime-config-bootstrap.json"
          cat > "$POLICY_FILE" <<JSON
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["lambda:GetFunctionRecursionConfig","lambda:PutFunctionRecursionConfig","secretsmanager:PutSecretValue"],"Resource":["arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:toh-production-background-cron-worker","arn:aws:secretsmanager:*:${AWS_ACCOUNT_ID}:secret:/theouthaven/production/*env-*"]}]}
          JSON
          test "$(wc -c < "$POLICY_FILE")" -lt 384
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document "file://$POLICY_FILE"
          sleep 8
          LIVE_POLICY="$RUNNER_TEMP/live-policy.json"
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query PolicyDocument \
            --output json > "$LIVE_POLICY"
          jq -e 'any(.Statement[]?.Action[]?; . == "lambda:GetFunctionRecursionConfig")' "$LIVE_POLICY" >/dev/null
          jq -e 'any(.Statement[]?.Action[]?; . == "lambda:PutFunctionRecursionConfig")' "$LIVE_POLICY" >/dev/null
          jq -e 'any(.Statement[]?.Action[]?; . == "secretsmanager:PutSecretValue")' "$LIVE_POLICY" >/dev/null
          jq -e 'any(.Statement[]?.Resource[]?; . == "arn:aws:secretsmanager:*:742020474738:secret:/theouthaven/production/*env-*")' "$LIVE_POLICY" >/dev/null
          rm -f "$POLICY_FILE" "$LIVE_POLICY"

      - name: Bootstrap summary
        run: |
          {
            echo '### AWS runtime mail secret bootstrap'
            echo ''
            echo '- Preserved Lambda recursion Get/Put permission for the durable background worker.'
            echo '- Restored Secrets Manager PutSecretValue only for production runtime env-style secrets.'
            echo '- Reuses the existing compact inline-policy slot to stay below the account role inline-policy byte ceiling.'
            echo '- Reapplies automatically after successful background-cron runtime deployments.'
          } >> "$GITHUB_STEP_SUMMARY"
