name: Discover existing Vercel credential source

on:
  push:
    branches:
      - migration/vercel-virginia-cutover
    paths:
      - '.github/workflows/vercel-credential-discovery.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  EDGE_RUNTIME_SECRET: /theouthaven/production/edge-runtime/env

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Inspect runtime secret key names only
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/runtime-secret.txt"
          aws secretsmanager get-secret-value \
            --secret-id "$EDGE_RUNTIME_SECRET" \
            --query SecretString \
            --output text > "$raw"
          chmod 600 "$raw"

          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'runtime-secret.txt'
          text = p.read_text()
          keys = []
          try:
              obj = json.loads(text)
              if isinstance(obj, dict):
                  keys = list(obj.keys())
          except Exception:
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  keys.append(line.split('=',1)[0].strip())
          matches = sorted({k for k in keys if 'VERCEL' in k.upper() or ('TOKEN' in k.upper() and 'SUPABASE' not in k.upper())})
          if matches:
              print('candidate_credential_keys=' + ','.join(matches))
          else:
              print('candidate_credential_keys=none')
          print('runtime_secret_key_count=' + str(len(set(keys))))
          PY
          rm -f "$raw"
