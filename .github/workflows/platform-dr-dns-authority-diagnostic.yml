name: Platform DR DNS authority diagnostic

on:
  push:
    branches:
      - fix/platform-dr-dns-authority
    paths:
      - '.github/workflows/platform-dr-dns-authority-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOMAIN_NAME: theouthaven.com
  WWW_DOMAIN_NAME: www.theouthaven.com
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_PROJECT_NAME: roseout

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Vercel domain ownership and DNS inventory safely
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is required." >&2; exit 1; }
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v5/domains/${DOMAIN_NAME}?teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/domain.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v5/domains/${DOMAIN_NAME}/records?limit=100&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/records.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/domains/${DOMAIN_NAME}/config?projectIdOrName=${VERCEL_PROJECT_NAME}&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/apex-config.json"
          jq -e '.domain.verified==true and .domain.name=="theouthaven.com"' "$RUNNER_TEMP/domain.json" >/dev/null
          jq -e '.records | length==28' "$RUNNER_TEMP/records.json" >/dev/null
          jq -e '.recommendedIPv4 | length>=1' "$RUNNER_TEMP/apex-config.json" >/dev/null

      - name: Patch platform DR trigger isolation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/aws-platform-dr.yml')
          text = path.read_text()
          additions = [
              "      - '.github/workflows/aws-platform-dr-dns-stage.yml'\n",
              "      - 'scripts/aws/stage_platform_dr_dns.py'\n",
          ]
          marker = "      - '.github/workflows/aws-background-runtime.yml'\n"
          if marker not in text:
              raise SystemExit('Expected platform DR paths-ignore marker not found')
          for line in additions:
              if line not in text:
                  text = text.replace(marker, marker + line)
          path.write_text(text)
          PY
          git diff --check
          git diff -- .github/workflows/aws-platform-dr.yml
          if git diff --quiet -- .github/workflows/aws-platform-dr.yml; then
            echo 'Platform DR trigger isolation already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/aws-platform-dr.yml
          git commit -m 'ci(dr): isolate DNS staging workflow'
          git push origin HEAD:fix/platform-dr-dns-authority
