name: Enable controlled Stamps live proof

on:
  push:
    branches:
      - fix/stamps-production-preview-route
    paths:
      - '.github/workflows/stamps-live-proof-enable.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STAMPS_SECRET_ID: /theouthaven/credential-vault/production/stamps

jobs:
  enable:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve AWS role
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Enable controlled one-card purchase switch
        run: |
          set -euo pipefail
          CURRENT="$RUNNER_TEMP/stamps-current.json"
          NEXT="$RUNNER_TEMP/stamps-next.json"
          VERIFY="$RUNNER_TEMP/stamps-verify.json"

          aws secretsmanager get-secret-value \
            --secret-id "$STAMPS_SECRET_ID" \
            --query SecretString \
            --output text > "$CURRENT"
          chmod 600 "$CURRENT"

          jq -e '.integrationId | strings | length > 0' "$CURRENT" >/dev/null
          jq -e '.username | strings | length > 0' "$CURRENT" >/dev/null
          jq -e '.password | strings | length > 0' "$CURRENT" >/dev/null

          jq '.postcardEnabled = true | .livePurchasesEnabled = true' "$CURRENT" > "$NEXT"
          chmod 600 "$NEXT"

          jq -e --slurpfile before "$CURRENT" '
            .integrationId == $before[0].integrationId and
            .username == $before[0].username and
            .password == $before[0].password and
            .postcardEnabled == true and
            .livePurchasesEnabled == true
          ' "$NEXT" >/dev/null

          aws secretsmanager put-secret-value \
            --secret-id "$STAMPS_SECRET_ID" \
            --secret-string "file://$NEXT" >/dev/null

          aws secretsmanager get-secret-value \
            --secret-id "$STAMPS_SECRET_ID" \
            --query SecretString \
            --output text > "$VERIFY"
          chmod 600 "$VERIFY"
          jq -e '.postcardEnabled == true and .livePurchasesEnabled == true' "$VERIFY" >/dev/null
          jq -e '.integrationId | strings | length > 0' "$VERIFY" >/dev/null
          jq -e '.username | strings | length > 0' "$VERIFY" >/dev/null
          jq -e '.password | strings | length > 0' "$VERIFY" >/dev/null

          echo 'controlled_live_proof_enabled=true'
          echo 'No Stamps.com transaction was executed.'
