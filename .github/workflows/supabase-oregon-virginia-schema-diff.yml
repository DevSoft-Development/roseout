name: Supabase Oregon Virginia schema diff

on:
  push:
    branches:
      - fix/supabase-migration-history-alignment
    paths:
      - '.github/workflows/supabase-oregon-virginia-schema-diff.yml'

permissions:
  contents: read

env:
  OREGON_REF: hnhbzynoyrhjndefbwkh
  VIRGINIA_REF: ftdsltatyqhtllyyefzp

jobs:
  diff:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Compare application schema object names and hashes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"

          cat > "$RUNNER_TEMP/catalog.sql" <<'SQL'
          with target_ns as (
            select oid,nspname from pg_namespace where nspname in ('public','private','fraud_internal')
          )
          select category, object_key, signature
          from (
            select 'relation'::text category,
                   n.nspname||'.'||c.relname object_key,
                   md5(c.relkind::text||':'||c.relrowsecurity::text||':'||c.relforcerowsecurity::text) signature
            from pg_class c join target_ns n on n.oid=c.relnamespace
            where c.relkind in ('r','p','v','m','S','f')

            union all
            select 'column', n.nspname||'.'||c.relname||'.'||a.attname,
                   md5(format_type(a.atttypid,a.atttypmod)||':'||a.attnotnull::text||':'||coalesce(pg_get_expr(d.adbin,d.adrelid),''))
            from pg_attribute a
            join pg_class c on c.oid=a.attrelid
            join target_ns n on n.oid=c.relnamespace
            left join pg_attrdef d on d.adrelid=a.attrelid and d.adnum=a.attnum
            where a.attnum>0 and not a.attisdropped and c.relkind in ('r','p','v','m','f')

            union all
            select 'constraint', n.nspname||'.'||coalesce(c.relname,'')||'.'||con.conname,
                   md5(con.contype::text||':'||pg_get_constraintdef(con.oid,true))
            from pg_constraint con
            join target_ns n on n.oid=con.connamespace
            left join pg_class c on c.oid=con.conrelid

            union all
            select 'index', n.nspname||'.'||i.relname, md5(pg_get_indexdef(i.oid))
            from pg_class i
            join pg_index x on x.indexrelid=i.oid
            join pg_class t on t.oid=x.indrelid
            join target_ns n on n.oid=t.relnamespace

            union all
            select 'function', n.nspname||'.'||p.proname||'('||pg_get_function_identity_arguments(p.oid)||')',
                   md5(pg_get_functiondef(p.oid))
            from pg_proc p join target_ns n on n.oid=p.pronamespace
            where p.prokind <> 'a'
          ) q
          order by category, object_key;
          SQL

          jq -Rs '{query:.}' < "$RUNNER_TEMP/catalog.sql" > "$RUNNER_TEMP/catalog-query.json"
          for side in oregon virginia; do
            if [ "$side" = oregon ]; then ref="$OREGON_REF"; else ref="$VIRGINIA_REF"; fi
            code="$(curl --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/catalog-query.json" \
              --output "$RUNNER_TEMP/${side}-catalog.json" \
              --write-out '%{http_code}' \
              "https://api.supabase.com/v1/projects/${ref}/database/query")"
            echo "${side}_catalog_http=$code"
            test "$code" = '200' || { echo "Unable to query ${side} catalog" >&2; exit 1; }
            jq -e 'type == "array"' "$RUNNER_TEMP/${side}-catalog.json" >/dev/null
          done

          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          def load(side):
              rows = json.loads((root / f'{side}-catalog.json').read_text())
              return {(r['category'], r['object_key']): r['signature'] for r in rows}
          o = load('oregon')
          v = load('virginia')
          keys = sorted(set(o) | set(v))
          diffs = []
          for key in keys:
              if key not in o:
                  diffs.append(('virginia_only', *key, v[key]))
              elif key not in v:
                  diffs.append(('oregon_only', *key, o[key]))
              elif o[key] != v[key]:
                  diffs.append(('changed', *key, f'{o[key]}->{v[key]}'))
          counts = {}
          for kind, category, object_key, sig in diffs:
              counts[(kind, category)] = counts.get((kind, category), 0) + 1
          print(f'schema_diff_total={len(diffs)}')
          for (kind, category), count in sorted(counts.items()):
              print(f'schema_diff_count kind={kind} category={category} count={count}')
          for kind, category, object_key, sig in diffs:
              print(f'schema_diff kind={kind} category={category} object={object_key} signature={sig}')
          PY
