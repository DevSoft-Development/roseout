name: User dashboard security audit

on:
  pull_request:
    paths:
      - 'app/user/**'
      - 'app/api/user/**'
      - 'app/api/outings/**'
      - 'components/user/**'
      - 'lib/user-dashboard.ts'
      - 'scripts/audit-user-dashboard-security.mjs'
      - '.github/workflows/user-dashboard-security-audit.yml'
  push:
    branches: [main]
    paths:
      - 'app/user/**'
      - 'app/api/user/**'
      - 'app/api/outings/**'
      - 'components/user/**'
      - 'lib/user-dashboard.ts'
      - 'scripts/audit-user-dashboard-security.mjs'
      - '.github/workflows/user-dashboard-security-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit user dashboard auth, ownership, and PII boundaries
        run: node scripts/audit-user-dashboard-security.mjs
