name: Domain registrar Vercel upsert cutover

on:
  pull_request:
    paths:
      - '.github/workflows/domain-registrar-vercel-upsert-cutover.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-registrar-vercel-upsert-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-domain-gateway-credential-authority-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: '742020474738'
  AWS_REGION: us-east-1
  COMPUTE_REGION: us-west-2
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_PROJECT_NAME: roseout
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  DR_STACK_NAME: theouthaven-platform-dr-production
  REGISTRAR_MODE: aws

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate upsert cutover contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/domain-registrar-vercel-upsert-cutover.yml'
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" "$FILE"
          grep -F 'upsert=true' "$FILE" >/dev/null
          grep -F "'production' in (e.get('target') or [])" "$FILE" >/dev/null
          grep -F 'registrar_lifecycle_owner == "aws"' "$FILE" >/dev/null
          grep -F 'private_dispatch == true' "$FILE" >/dev/null
          grep -F '/theouthaven/production/platform-dr/app-env' "$FILE" >/dev/null

  cutover:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Upsert Vercel production registrar owner to AWS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          jq -n --arg key 'DOMAIN_REGISTRAR_LIFECYCLE_MODE' --arg value "$REGISTRAR_MODE" \
            '[{key:$key,value:$value,type:"encrypted",target:["production"]}]' > "$RUNNER_TEMP/vercel-upsert.json"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/vercel-upsert.json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/vercel-upsert-response.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}&decrypt=true" \
            > "$RUNNER_TEMP/vercel-envs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          envs = json.loads((root / 'vercel-envs.json').read_text()).get('envs', [])
          mode = [e for e in envs if e.get('key') == 'DOMAIN_REGISTRAR_LIFECYCLE_MODE' and 'production' in (e.get('target') or [])]
          if len(mode) != 1 or mode[0].get('value') != os.environ['REGISTRAR_MODE']:
              raise SystemExit('Vercel production registrar ownership did not become AWS after upsert.')
          cron = [e for e in envs if e.get('key') == 'CRON_SECRET' and 'production' in (e.get('target') or [])]
          if len(cron) != 1 or not cron[0].get('value'):
              raise SystemExit('Expected exactly one decryptable production CRON_SECRET.')
          (root / 'cron-secret').write_text(cron[0]['value'])
          print('vercel_registrar_mode=aws')
          PY
          chmod 600 "$RUNNER_TEMP/cron-secret"

      - name: Redeploy production with AWS registrar ownership
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v7/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=1&teamId=${VERCEL_TEAM_ID}" > "$RUNNER_TEMP/vercel-current.json"
          OLD_ID="$(jq -r '.deployments[0].uid // .deployments[0].id // empty' "$RUNNER_TEMP/vercel-current.json")"
          test -n "$OLD_ID"
          jq -n --arg name "$VERCEL_PROJECT_NAME" --arg project "$VERCEL_PROJECT_ID" --arg deploymentId "$OLD_ID" \
            '{name:$name,project:$project,deploymentId:$deploymentId,target:"production"}' > "$RUNNER_TEMP/vercel-redeploy.json"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/vercel-redeploy.json" \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_TEAM_ID}" > "$RUNNER_TEMP/vercel-new.json"
          NEW_ID="$(jq -r '.id // .uid // empty' "$RUNNER_TEMP/vercel-new.json")"
          test -n "$NEW_ID"
          READY=false
          for _ in $(seq 1 120); do
            curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/${NEW_ID}?teamId=${VERCEL_TEAM_ID}" > "$RUNNER_TEMP/vercel-status.json"
            STATE="$(jq -r '.readyState // .state // empty' "$RUNNER_TEMP/vercel-status.json")"
            if [ "$STATE" = 'READY' ]; then READY=true; break; fi
            if [ "$STATE" = 'ERROR' ] || [ "$STATE" = 'CANCELED' ]; then exit 1; fi
            sleep 5
          done
          test "$READY" = 'true'
          echo 'vercel_redeploy_ready=true'

      - name: Verify Vercel skips registrar reconciliation
        run: |
          set -euo pipefail
          CRON_SECRET="$(cat "$RUNNER_TEMP/cron-secret")"
          echo "::add-mask::$CRON_SECRET"
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/vercel-domain.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" --header "x-cron-secret: $CRON_SECRET" \
            'https://www.theouthaven.com/api/cron/managed?job=domain-lifecycle')"
          test "$STATUS" = '200'
          jq -e '.registrar_lifecycle_owner == "aws"' "$RUNNER_TEMP/vercel-domain.json" >/dev/null
          echo 'vercel_registrar_execution_owner=aws'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Switch shared AWS app environment registrar owner to AWS
        id: appenv
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws secretsmanager get-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/app-env.json"
          chmod 600 "$RUNNER_TEMP/app-env.json"
          CHANGED="$(jq -r --arg mode "$REGISTRAR_MODE" '.DOMAIN_REGISTRAR_LIFECYCLE_MODE != $mode' "$RUNNER_TEMP/app-env.json")"
          if [ "$CHANGED" = 'true' ]; then
            jq --arg mode "$REGISTRAR_MODE" '.DOMAIN_REGISTRAR_LIFECYCLE_MODE=$mode' "$RUNNER_TEMP/app-env.json" > "$RUNNER_TEMP/app-env-next.json"
            chmod 600 "$RUNNER_TEMP/app-env-next.json"
            aws secretsmanager put-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --secret-string "file://$RUNNER_TEMP/app-env-next.json" --query VersionId --output text >/dev/null
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo 'aws_shared_registrar_mode=aws'

      - name: Reload private AWS background runtime
        if: steps.appenv.outputs.changed == 'true'
        run: |
          set -euo pipefail
          FN="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$FN" && test "$FN" != 'None'
          aws lambda get-function-configuration --region "$AWS_REGION" --function-name "$FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/background-original-env.json"
          jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' "$RUNNER_TEMP/background-original-env.json" > "$RUNNER_TEMP/background-refresh-env.json"
          aws lambda update-function-configuration --region "$AWS_REGION" --function-name "$FN" --environment "file://$RUNNER_TEMP/background-refresh-env.json" >/dev/null
          aws lambda wait function-updated-v2 --region "$AWS_REGION" --function-name "$FN"
          aws lambda update-function-configuration --region "$AWS_REGION" --function-name "$FN" --environment "file://$RUNNER_TEMP/background-original-env.json" >/dev/null
          aws lambda wait function-updated-v2 --region "$AWS_REGION" --function-name "$FN"
          echo 'background_runtime_reloaded=true'

      - name: Restart DR standby after shared app environment change
        if: steps.appenv.outputs.changed == 'true'
        run: |
          set -euo pipefail
          CLUSTER="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$DR_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" --output text)"
          SERVICE="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$DR_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EcsServiceName'].OutputValue" --output text)"
          test -n "$CLUSTER" && test "$CLUSTER" != 'None'
          test -n "$SERVICE" && test "$SERVICE" != 'None'
          aws ecs update-service --region "$COMPUTE_REGION" --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment >/dev/null
          aws ecs wait services-stable --region "$COMPUTE_REGION" --cluster "$CLUSTER" --services "$SERVICE"
          echo 'dr_standby_reloaded=true'

      - name: Prove private AWS domain lifecycle owns registrar work
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/app-env-verify.json"
          chmod 600 "$RUNNER_TEMP/app-env-verify.json"
          jq -e --arg mode "$REGISTRAR_MODE" '.DOMAIN_REGISTRAR_LIFECYCLE_MODE == $mode' "$RUNNER_TEMP/app-env-verify.json" >/dev/null
          CRON_SECRET="$(jq -r '.CRON_SECRET // empty' "$RUNNER_TEMP/app-env-verify.json")"
          test -n "$CRON_SECRET"
          echo "::add-mask::$CRON_SECRET"
          FN="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          CRON_SECRET="$CRON_SECRET" python3 - <<'PY'
          import json, os
          secret = os.environ['CRON_SECRET']
          event = {
              'version':'2.0','routeKey':'GET /api/cron/managed','rawPath':'/api/cron/managed','rawQueryString':'job=domain-lifecycle',
              'headers':{'authorization':f'Bearer {secret}','x-cron-secret':secret,'x-toh-aws-internal':'eventbridge'},
              'requestContext':{'accountId':'cutover','apiId':'cutover','domainName':'internal','domainPrefix':'internal','http':{'method':'GET','path':'/api/cron/managed','protocol':'HTTP/1.1','sourceIp':'127.0.0.1','userAgent':'github-actions'},'requestId':'domain-registrar-upsert-cutover','routeKey':'GET /api/cron/managed','stage':'$default','time':'02/Sep/2026:00:00:00 +0000','timeEpoch':1788336000000},
              'isBase64Encoded':False,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'],'domain-event.json'),'w') as fh:
              json.dump(event,fh,separators=(',',':'))
          PY
          aws lambda invoke --region "$AWS_REGION" --function-name "$FN" --cli-binary-format raw-in-base64-out \
            --payload "fileb://$RUNNER_TEMP/domain-event.json" "$RUNNER_TEMP/domain-response.json" >/dev/null
          jq -e '.statusCode == 200' "$RUNNER_TEMP/domain-response.json" >/dev/null
          jq -e '.body | fromjson | .registrar_lifecycle_owner == "aws"' "$RUNNER_TEMP/domain-response.json" >/dev/null
          echo 'private_dispatch == true'
          echo 'aws_registrar_execution_owner=aws'

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/vercel-*.json "$RUNNER_TEMP/cron-secret" "$RUNNER_TEMP/app-env.json" "$RUNNER_TEMP/app-env-next.json" "$RUNNER_TEMP/app-env-verify.json" "$RUNNER_TEMP/background-config.json" "$RUNNER_TEMP/background-original-env.json" "$RUNNER_TEMP/background-refresh-env.json" "$RUNNER_TEMP/domain-event.json" "$RUNNER_TEMP/domain-response.json"
