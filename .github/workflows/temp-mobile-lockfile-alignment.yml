name: Temporary mobile lockfile alignment

on:
  push:
    branches:
      - fix/mobile-expo-sdk57-alignment
    paths:
      - .github/workflows/temp-mobile-lockfile-alignment.yml

permissions:
  contents: write

jobs:
  align-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-expo-sdk57-alignment
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Regenerate lockfile and validate Expo alignment
        working-directory: mobile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install --check
      - name: Commit aligned lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git rm .github/workflows/temp-mobile-lockfile-alignment.yml
          git commit -m "fix(mobile): refresh Expo SDK 57 lockfile"
          git push origin HEAD:fix/mobile-expo-sdk57-alignment
