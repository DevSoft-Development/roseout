name: Oregon DR reseed fail-close schedules

on:
  pull_request:
    paths:
      - '.github/workflows/oregon-dr-reseed-fail-close-schedules.yml'
      - '.github/workflows/aws-dr-scheduler-activation.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oregon-dr-reseed-fail-close-schedules.yml'
      - '.github/workflows/aws-dr-scheduler-activation.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-dr-scheduler-activation-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-edge-runtime-production
  SCHEDULE_GROUP: toh-production-edge-runtime
  DR_SECRET_NAME: /theouthaven/production/dr-reconciler/env

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate fail-close contract
        run: |
          set -euo pipefail
          schedule_count="$(jq 'length' infra/aws/edge-runtime/schedules.json)"
          activation_count="$(jq '.enabled | length' infra/aws/edge-runtime/activation.json)"
          test "$schedule_count" -gt 0
          test "$schedule_count" = "$activation_count"
          diff -u \
            <(jq -r '.[].name' infra/aws/edge-runtime/schedules.json | sort) \
            <(jq -r '.enabled[]' infra/aws/edge-runtime/activation.json | sort)
          test "$(jq 'length' infra/aws/edge-runtime/dr-schedules.json)" = '2'
          jq -e 'all(.[]; .name=="dr-auth-standby-reconcile" or .name=="dr-storage-standby-reconcile")' infra/aws/edge-runtime/dr-schedules.json >/dev/null
          jq -e '.enabled == true and .expected_invalidation_reason == "wal_removed"' infra/aws/edge-runtime/dr-lost-slot-recovery.json >/dev/null
          grep -F 'DR_MODE' .github/workflows/oregon-dr-reseed-fail-close-schedules.yml >/dev/null
          grep -F -- '--state ENABLED' .github/workflows/oregon-dr-reseed-fail-close-schedules.yml >/dev/null
          grep -F -- '--state DISABLED' .github/workflows/oregon-dr-reseed-fail-close-schedules.yml >/dev/null

  fail_close:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Require Virginia primary and armed lost-slot recovery
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws secretsmanager get-secret-value --secret-id "$DR_SECRET_NAME" --query SecretString --output text > "$RUNNER_TEMP/dr-current.json"
          test "$(jq -r '.DR_MODE // empty' "$RUNNER_TEMP/dr-current.json")" = 'virginia_primary'
          jq -e '.enabled == true and .expected_invalidation_reason == "wal_removed" and .reseed_mode == "copy_data_true"' infra/aws/edge-runtime/dr-lost-slot-recovery.json >/dev/null

      - name: Reconcile canonical base scheduler fleet
        run: |
          set -euo pipefail
          schedule_count="$(jq 'length' infra/aws/edge-runtime/schedules.json)"
          activation_count="$(jq '.enabled | length' infra/aws/edge-runtime/activation.json)"
          test "$schedule_count" -gt 0
          test "$schedule_count" = "$activation_count"
          diff -u \
            <(jq -r '.[].name' infra/aws/edge-runtime/schedules.json | sort) \
            <(jq -r '.enabled[]' infra/aws/edge-runtime/activation.json | sort)

          invoker_arn="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          scheduler_role="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"
          test -n "$invoker_arn"
          test -n "$scheduler_role"

          reconciled=0
          while IFS= read -r item; do
            name="$(jq -r '.name' <<<"$item")"
            expression="$(jq -r '.expression' <<<"$item")"
            input="$(jq -c '{function:.function,body:.body}' <<<"$item")"
            target="$(jq -nc --arg arn "$invoker_arn" --arg role "$scheduler_role" --arg input "$input" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:3600,MaximumRetryAttempts:2}}')"
            aws scheduler update-schedule \
              --group-name "$SCHEDULE_GROUP" \
              --name "$name" \
              --schedule-expression "$expression" \
              --flexible-time-window '{"Mode":"OFF"}' \
              --state ENABLED \
              --target "$target" >/dev/null
            test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)" = 'ENABLED'
            reconciled=$((reconciled + 1))
          done < <(jq -c '.[]' infra/aws/edge-runtime/schedules.json)
          test "$reconciled" = "$schedule_count"

      - name: Fail-close forward DR schedules for reseed
        run: |
          set -euo pipefail
          invoker_arn="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionArn'].OutputValue" --output text)"
          scheduler_role="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventBridgeSchedulerRoleArn'].OutputValue" --output text)"
          while IFS= read -r item; do
            name="$(jq -r '.name' <<<"$item")"
            expression="$(jq -r '.expression' <<<"$item")"
            input="$(jq -c '{function:.function,body:.body}' <<<"$item")"
            target="$(jq -nc --arg arn "$invoker_arn" --arg role "$scheduler_role" --arg input "$input" '{Arn:$arn,RoleArn:$role,Input:$input,RetryPolicy:{MaximumEventAgeInSeconds:3600,MaximumRetryAttempts:2}}')"
            aws scheduler update-schedule \
              --group-name "$SCHEDULE_GROUP" \
              --name "$name" \
              --schedule-expression "$expression" \
              --flexible-time-window '{"Mode":"OFF"}' \
              --state DISABLED \
              --target "$target" >/dev/null
            test "$(aws scheduler get-schedule --group-name "$SCHEDULE_GROUP" --name "$name" --query State --output text)" = 'DISABLED'
          done < <(jq -c '.[]' infra/aws/edge-runtime/dr-schedules.json)

      - name: Fail-close summary
        run: |
          schedule_count="$(jq 'length' infra/aws/edge-runtime/schedules.json)"
          {
            echo '### Oregon DR reseed scheduler guard'
            echo ''
            echo '- Virginia remains authoritative primary.'
            echo "- Reconciled all ${schedule_count} canonical base production schedules to ENABLED."
            echo '- Both forward DR reconciliation schedules are DISABLED while the lost-slot reseed marker is armed.'
            echo '- No database or traffic mutation was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/dr-current.json"
