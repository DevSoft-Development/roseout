name: Platform DR Route53 delegation diagnostic

on:
  push:
    branches:
      - fix/platform-dr-dns-authority
    paths:
      - '.github/workflows/platform-dr-route53-ns.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: '742020474738'
  AWS_REGION: us-east-1
  ROUTE53_ZONE_ID: Z09341481NV7WBD485KZ2

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Resolve deployment role
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          echo "role_arn=${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}" >> "$GITHUB_OUTPUT"
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Temporarily allow Route53 delegation read
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          jq -n '{Version:"2012-10-17",Statement:[{Effect:"Allow",Action:["route53:GetHostedZone"],Resource:"*"}]}' > "$RUNNER_TEMP/ns-read.json"
          aws iam put-role-policy --role-name "$ROLE_NAME" --policy-name TheOutHavenPlatformDrNsRead --policy-document "file://$RUNNER_TEMP/ns-read.json"
          sleep 8
      - name: Print Route53 delegation only
        run: |
          set -euo pipefail
          aws route53 get-hosted-zone --id "$ROUTE53_ZONE_ID" --query 'DelegationSet.NameServers' --output json
      - name: Remove temporary Route53 delegation read
        if: always()
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name TheOutHavenPlatformDrNsRead 2>/dev/null || true