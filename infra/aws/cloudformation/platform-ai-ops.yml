AWSTemplateFormatVersion: '2010-09-09'
Description: TheOutHaven AI-assisted production operations controller.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  AssistantApiUrl:
    Type: String
  GitHubRepository:
    Type: String
    Default: DevSoft-Development/roseout
  ScheduleExpression:
    Type: String
    Default: rate(15 minutes)
  PlatformAlertsTopicArn:
    Type: String
    Default: ''

Conditions:
  HasAlertsTopic: !Not [!Equals [!Ref PlatformAlertsTopicArn, '']]

Resources:
  AiOpsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenAiOps-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ai-ops-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/toh-${Environment}-ai-ops-controller:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/theouthaven/credential-vault/${Environment}/supabase-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/theouthaven/credential-vault/${Environment}/github-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/theouthaven/${Environment}/assistant-api/hmac-*

  AiOpsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/toh-${Environment}-ai-ops-controller
      RetentionInDays: 30

  AiOpsFunction:
    Type: AWS::Lambda::Function
    DependsOn: AiOpsLogGroup
    Properties:
      FunctionName: !Sub toh-${Environment}-ai-ops-controller
      Role: !GetAtt AiOpsRole.Arn
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 90
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          ASSISTANT_API_URL: !Ref AssistantApiUrl
          ASSISTANT_SECRET_ARN: !Sub /theouthaven/${Environment}/assistant-api/hmac
          SUPABASE_SECRET_ID: !Sub /theouthaven/credential-vault/${Environment}/supabase
          GITHUB_SECRET_ID: !Sub /theouthaven/credential-vault/${Environment}/github
          GITHUB_REPOSITORY: !Ref GitHubRepository
          AI_MODEL: gpt-5.4-mini
          AUTO_RECOVERY_EVENT: platform-auto-recovery
      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError('ai_ops_code_not_deployed')

  AiOpsSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenAiOpsScheduler-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-ai-ops
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AiOpsFunction.Arn

  AiOpsSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub toh-${Environment}-ai-ops
      ScheduleExpression: !Ref ScheduleExpression
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt AiOpsFunction.Arn
        RoleArn: !GetAtt AiOpsSchedulerRole.Arn
        Input: '{"source":"aws-scheduler"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 1800
          MaximumRetryAttempts: 1

  AiOpsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-ai-ops-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiOpsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertsTopic
        - [!Ref PlatformAlertsTopicArn]
        - !Ref AWS::NoValue

Outputs:
  AiOpsFunctionName:
    Value: !Ref AiOpsFunction
  AiOpsScheduleName:
    Value: !Ref AiOpsSchedule
