name: AWS web surfaces services

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'apps/business/**'
      - 'packages/auth/**'
      - 'packages/db/**'
      - 'packages/config/**'
      - 'app/admin/**'
      - 'app/locations/**'
      - 'app/business/**'
      - 'app/auth/**'
      - 'app/api/admin/**'
      - 'app/api/locations/**'
      - 'app/api/business/**'
      - 'app/api/auth/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'proxy.ts'
      - 'infra/aws/web-surfaces/**'
      - 'infra/aws/cloudformation/web-surfaces-services.yml'
      - 'scripts/web-surfaces-services-regression.mjs'
      - '.github/workflows/aws-web-surfaces-services.yml'
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'apps/business/**'
      - 'packages/auth/**'
      - 'packages/db/**'
      - 'packages/config/**'
      - 'app/admin/**'
      - 'app/locations/**'
      - 'app/business/**'
      - 'app/auth/**'
      - 'app/api/admin/**'
      - 'app/api/locations/**'
      - 'app/api/business/**'
      - 'app/api/auth/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'proxy.ts'
      - 'infra/aws/web-surfaces/**'
      - 'infra/aws/cloudformation/web-surfaces-services.yml'
      - '.github/workflows/aws-web-surfaces-services.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [staging, production]
      desired_count:
        description: Tasks per web surface
        required: true
        default: '1'
        type: choice
        options: ['0', '1', '2']

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-web-surfaces-services-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  FOUNDATION_STACK: theouthaven-web-surfaces-production
  SERVICES_TEMPLATE: infra/aws/cloudformation/web-surfaces-services.yml
  DOCKERFILE: infra/aws/web-surfaces/Dockerfile

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime contract
        run: node scripts/web-surfaces-services-regression.mjs
      - name: Validate Business route migration parity
        run: node scripts/business-route-migration-regression.mjs
      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint
      - name: Lint service template
        run: cfn-lint "$SERVICES_TEMPLATE"
      - name: Verify production container build
        run: |
          set -euo pipefail
          test -f "$DOCKERFILE"
          grep -F 'build:surface:admin' "$DOCKERFILE" >/dev/null
          grep -F 'build:surface:business' "$DOCKERFILE" >/dev/null
          grep -F '.next/standalone' "$DOCKERFILE" >/dev/null
          grep -F 'runtime-env-loader.cjs' "$DOCKERFILE" >/dev/null

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment configuration
        id: config
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_DESIRED: ${{ github.event.inputs.desired_count }}
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          TARGET_ENV="${INPUT_ENV:-production}"
          DESIRED="${INPUT_DESIRED:-1}"
          case "$TARGET_ENV" in production|staging) ;; *) exit 2 ;; esac
          case "$DESIRED" in 0|1|2) ;; *) exit 2 ;; esac
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "desired_count=$DESIRED" >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "foundation_stack=theouthaven-web-surfaces-${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "services_stack=theouthaven-web-surface-services-${TARGET_ENV}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve foundation outputs
        id: foundation
        env:
          STACK: ${{ steps.config.outputs.foundation_stack }}
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK" > "$RUNNER_TEMP/foundation.json"
          output() { jq -r --arg key "$1" '.Stacks[0].Outputs[] | select(.OutputKey==$key) | .OutputValue' "$RUNNER_TEMP/foundation.json"; }
          for key in LoadBalancerDnsName SubnetIds TaskSecurityGroupId EcrRepositoryUri EcsClusterName AdminTargetGroupArn BusinessTargetGroupArn AdminLogGroupName BusinessLogGroupName AdminAppEnvSecretArn BusinessAppEnvSecretArn TaskExecutionRoleArn AdminTaskRoleArn BusinessTaskRoleArn; do
            value="$(output "$key")"
            test -n "$value" && test "$value" != null
            printf '%s=%s\n' "$(echo "$key" | tr '[:upper:]' '[:lower:]')" "$value" >> "$GITHUB_OUTPUT"
          done

      - name: Load AWS runtime environment and sync isolated runtime secrets
        id: runtime-env
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
          ADMIN_SECRET_ARN: ${{ steps.foundation.outputs.adminappenvsecretarn }}
          BUSINESS_SECRET_ARN: ${{ steps.foundation.outputs.businessappenvsecretarn }}
          CONFIGURED_JOB_GATEWAY_URL: ${{ vars.AWS_PLATFORM_JOB_GATEWAY_URL }}
          CONFIGURED_JOB_GATEWAY_SECRET: ${{ secrets.AWS_PLATFORM_JOB_GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CONFIGURED_JOB_GATEWAY_URL:-}" ]; then
            WORKER_STACK="theouthaven-workers-${TARGET_ENV}"
            CONFIGURED_JOB_GATEWAY_URL="$(aws cloudformation describe-stacks --stack-name "$WORKER_STACK" --query "Stacks[0].Outputs[?OutputKey=='JobGatewayUrl'].OutputValue" --output text)"
          fi
          if [ -z "${CONFIGURED_JOB_GATEWAY_URL:-}" ] || [ "$CONFIGURED_JOB_GATEWAY_URL" = "None" ]; then
            echo "Unable to resolve AWS platform job gateway URL from GitHub variables or $WORKER_STACK." >&2
            exit 1
          fi
          export CONFIGURED_JOB_GATEWAY_URL
          RUNTIME_SECRET="/theouthaven/${TARGET_ENV}/edge-runtime/env"
          RAW_JSON="$RUNNER_TEMP/runtime-env.raw.json"
          RUNTIME_JSON="$RUNNER_TEMP/runtime-env.json"
          ENV_FILE="$RUNNER_TEMP/web-surfaces.env"
          aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET" --query SecretString --output text > "$RAW_JSON"
          jq -e 'type == "object" and length > 0' "$RAW_JSON" >/dev/null
          jq 'del(.VERCEL_TOKEN, .VERCEL_ACCESS_TOKEN)' "$RAW_JSON" > "$RUNTIME_JSON"
          python3 - "$RUNTIME_JSON" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          values = json.load(open(path, encoding='utf-8'))
          configured = {
              "AWS_PLATFORM_JOB_GATEWAY_URL": os.environ.get("CONFIGURED_JOB_GATEWAY_URL", "").strip(),
              "AWS_PLATFORM_JOB_GATEWAY_SECRET": os.environ.get("CONFIGURED_JOB_GATEWAY_SECRET", "").strip(),
          }
          for key, value in configured.items():
              if value:
                  values[key] = value
          if os.environ.get("TARGET_ENV") == "production":
              required = [
                  "AWS_PLATFORM_JOB_GATEWAY_URL",
                  "AWS_PLATFORM_JOB_GATEWAY_SECRET",
                  "M365_TOKEN_ENCRYPTION_KEY",
              ]
              missing = [key for key in required if not str(values.get(key, "")).strip()]
              if missing:
                  raise SystemExit(
                      "Production web-surface runtime secret is missing required keys: "
                      + ", ".join(missing)
                  )
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(values, handle)
          PY
          jq -e 'type == "object" and length > 0' "$RUNTIME_JSON" >/dev/null
          python3 - "$RUNTIME_JSON" "$ENV_FILE" <<'PY'
          import json, re, sys
          source, destination = sys.argv[1:3]
          values = json.load(open(source, encoding='utf-8'))
          key_pattern = re.compile(r'^[A-Za-z_][A-Za-z0-9_]*$')
          lines = []
          for key in sorted(values):
              value = values[key]
              if not key_pattern.match(key) or value is None or isinstance(value, (dict, list)):
                  continue
              if isinstance(value, bool):
                  value = 'true' if value else 'false'
              else:
                  value = str(value)
              lines.append(f'{key}={json.dumps(value, ensure_ascii=False)}')
          if not lines:
              raise SystemExit('AWS runtime environment did not contain any usable variables')
          with open(destination, 'w', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY
          chmod 600 "$ENV_FILE" "$RUNTIME_JSON"
          aws secretsmanager put-secret-value --secret-id "$ADMIN_SECRET_ARN" --secret-string "file://$RUNTIME_JSON" >/dev/null
          aws secretsmanager put-secret-value --secret-id "$BUSINESS_SECRET_ARN" --secret-string "file://$RUNTIME_JSON" >/dev/null
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"

      - name: Authenticate to ECR
        env:
          REPOSITORY_URI: ${{ steps.foundation.outputs.ecrrepositoryuri }}
        run: |
          set -euo pipefail
          REGISTRY="${REPOSITORY_URI%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build or reuse isolated Admin and Business images
        id: image
        env:
          REPOSITORY_URI: ${{ steps.foundation.outputs.ecrrepositoryuri }}
          ENV_FILE: ${{ steps.runtime-env.outputs.env_file }}
        run: |
          set -euo pipefail
          REPOSITORY_NAME="${REPOSITORY_URI##*/}"
          for surface in admin business; do
            IMAGE_TAG="${GITHUB_SHA}-${surface}"
            IMAGE_URI="${REPOSITORY_URI}:${IMAGE_TAG}"
            if aws ecr describe-images \
              --repository-name "$REPOSITORY_NAME" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text >/dev/null 2>&1; then
              echo "Reusing existing immutable ECR image for ${IMAGE_TAG}."
            else
              docker build \
                --file "$DOCKERFILE" \
                --build-arg "WEB_SURFACE=${surface}" \
                --secret "id=platform_env,src=$ENV_FILE" \
                --tag "$IMAGE_URI" \
                .
              docker push "$IMAGE_URI"
            fi
            echo "${surface}_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          done

      - name: Recover failed services stack
        env:
          STACK: ${{ steps.config.outputs.services_stack }}
        run: |
          set -euo pipefail
          if aws cloudformation describe-stacks --stack-name "$STACK" > "$RUNNER_TEMP/services-stack.json" 2>/dev/null; then
            STATUS="$(jq -r '.Stacks[0].StackStatus' "$RUNNER_TEMP/services-stack.json")"
            case "$STATUS" in
              ROLLBACK_COMPLETE|CREATE_FAILED)
                echo "Deleting failed services stack in $STATUS so it can be recreated cleanly."
                aws cloudformation delete-stack --stack-name "$STACK"
                aws cloudformation wait stack-delete-complete --stack-name "$STACK"
                ;;
              UPDATE_FAILED)
                echo 'Rolling UPDATE_FAILED services stack back to the last known good state before retrying the deployment.'
                aws cloudformation rollback-stack --stack-name "$STACK"
                aws cloudformation wait stack-rollback-complete --stack-name "$STACK"
                ;;
              *)
                echo "Existing services stack status: $STATUS"
                ;;
            esac
          else
            echo 'Services stack does not exist yet; a fresh stack will be created.'
          fi

      - name: Deploy independent Admin and Business services
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
          DESIRED_COUNT: ${{ steps.config.outputs.desired_count }}
          STACK: ${{ steps.config.outputs.services_stack }}
          ADMIN_IMAGE_URI: ${{ steps.image.outputs.admin_uri }}
          BUSINESS_IMAGE_URI: ${{ steps.image.outputs.business_uri }}
          CLUSTER: ${{ steps.foundation.outputs.ecsclustername }}
          SUBNETS: ${{ steps.foundation.outputs.subnetids }}
          SG: ${{ steps.foundation.outputs.tasksecuritygroupid }}
          ADMIN_TG: ${{ steps.foundation.outputs.admintargetgrouparn }}
          BUSINESS_TG: ${{ steps.foundation.outputs.businesstargetgrouparn }}
          EXEC_ROLE: ${{ steps.foundation.outputs.taskexecutionrolearn }}
          ADMIN_ROLE: ${{ steps.foundation.outputs.admintaskrolearn }}
          BUSINESS_ROLE: ${{ steps.foundation.outputs.businesstaskrolearn }}
          ADMIN_LOG: ${{ steps.foundation.outputs.adminloggroupname }}
          BUSINESS_LOG: ${{ steps.foundation.outputs.businessloggroupname }}
          ADMIN_ENV: ${{ steps.foundation.outputs.adminappenvsecretarn }}
          BUSINESS_ENV: ${{ steps.foundation.outputs.businessappenvsecretarn }}
        run: |
          set -euo pipefail
          ROLLBACK_ARGS=()
          if aws cloudformation describe-stacks --stack-name "$STACK" >/dev/null 2>&1; then
            echo 'Updating existing services stack with normal rollback support so ECS task definition replacements are allowed.'
          else
            echo 'Creating services stack with rollback disabled so first-start failures remain available for diagnostics.'
            ROLLBACK_ARGS=(--disable-rollback)
          fi
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file "$SERVICES_TEMPLATE" \
            --capabilities CAPABILITY_NAMED_IAM \
            "${ROLLBACK_ARGS[@]}" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$TARGET_ENV" ClusterName="$CLUSTER" SubnetIds="$SUBNETS" \
              TaskSecurityGroupId="$SG" AdminTargetGroupArn="$ADMIN_TG" BusinessTargetGroupArn="$BUSINESS_TG" \
              TaskExecutionRoleArn="$EXEC_ROLE" AdminTaskRoleArn="$ADMIN_ROLE" BusinessTaskRoleArn="$BUSINESS_ROLE" \
              AdminLogGroupName="$ADMIN_LOG" BusinessLogGroupName="$BUSINESS_LOG" \
              AdminAppEnvSecretArn="$ADMIN_ENV" BusinessAppEnvSecretArn="$BUSINESS_ENV" \
              AdminImageUri="$ADMIN_IMAGE_URI" BusinessImageUri="$BUSINESS_IMAGE_URI" \
              GitSha="$GITHUB_SHA" DesiredCount="$DESIRED_COUNT" \
            --tags Project=TheOutHaven Environment="$TARGET_ENV" Service=WebSurfaces ManagedBy=CloudFormation

      - name: Show CloudFormation service failure events
        if: failure()
        env:
          STACK: ${{ steps.config.outputs.services_stack }}
        run: |
          set +e
          echo 'Recent CloudFormation failure events:'
          aws cloudformation describe-stack-events \
            --stack-name "$STACK" \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED') || contains(ResourceStatus, 'ROLLBACK')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table

      - name: Show ECS service, stopped-task, and CloudWatch diagnostics
        if: failure()
        env:
          CLUSTER: ${{ steps.foundation.outputs.ecsclustername }}
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
          ADMIN_LOG: ${{ steps.foundation.outputs.adminloggroupname }}
          BUSINESS_LOG: ${{ steps.foundation.outputs.businessloggroupname }}
        run: |
          set +e
          for surface in admin business; do
            SERVICE="toh-${TARGET_ENV}-${surface}-web"
            if [ "$surface" = "admin" ]; then LOG_GROUP="$ADMIN_LOG"; else LOG_GROUP="$BUSINESS_LOG"; fi

            echo "=== $SERVICE service events ==="
            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].events[0:20].[createdAt,message]' \
              --output table

            TASKS="$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --desired-status STOPPED --max-results 20 --query 'taskArns' --output text 2>/dev/null || true)"
            if [ -z "$TASKS" ] || [ "$TASKS" = "None" ]; then
              echo "No stopped tasks found by service name; falling back to ECS task family $SERVICE."
              TASKS="$(aws ecs list-tasks --cluster "$CLUSTER" --family "$SERVICE" --desired-status STOPPED --max-results 20 --query 'taskArns' --output text 2>/dev/null || true)"
            fi
            if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
              echo "=== $SERVICE stopped tasks ==="
              aws ecs describe-tasks \
                --cluster "$CLUSTER" \
                --tasks $TASKS \
                --query 'tasks[].{task:taskArn,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,reason:reason,exitCode:exitCode,lastStatus:lastStatus}}' \
                --output json
            else
              echo "No stopped ECS tasks found for $SERVICE by service name or task family."
            fi

            echo "=== $SERVICE CloudWatch logs ==="
            aws logs tail "$LOG_GROUP" --since 30m --format short || true
          done

      - name: Wait for stable services
        if: steps.config.outputs.desired_count != '0'
        env:
          CLUSTER: ${{ steps.foundation.outputs.ecsclustername }}
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$CLUSTER" --services "toh-${TARGET_ENV}-admin-web" "toh-${TARGET_ENV}-business-web"

      - name: Direct-origin smoke test
        if: steps.config.outputs.desired_count != '0'
        env:
          ORIGIN: ${{ steps.foundation.outputs.loadbalancerdnsname }}
        run: |
          set -euo pipefail
          for surface in admin business; do
            HOST="${surface}.theouthaven.com"
            BODY="$(curl --fail --silent --show-error --max-time 20 -H "Host: $HOST" "http://$ORIGIN/api/health/platform-dr")"
            printf '%s' "$BODY" | jq -e --arg provider "aws-${surface}" '.ok == true and .provider == $provider' >/dev/null
          done
          echo 'Admin and Business AWS origins are healthy. DNS/public routing has not been changed by this workflow.'