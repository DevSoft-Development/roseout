AWSTemplateFormatVersion: '2010-09-09'
Description: TheOutHaven AWS-owned AI operations analysis scheduler.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  GitHubRepository:
    Type: String
    Default: DevSoft-Development/roseout
  AnalysisScheduleExpression:
    Type: String
    Default: rate(1 hour)
  PlatformAlertsTopicArn:
    Type: String
    Default: ''

Conditions:
  HasAlertsTopic: !Not [!Equals [!Ref PlatformAlertsTopicArn, '']]

Resources:
  AiOpsDispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenAiOpsDispatcher-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ai-ops-dispatcher
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/toh-${Environment}-ai-ops-dispatcher:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/theouthaven/credential-vault/${Environment}/github-*

  AiOpsDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/toh-${Environment}-ai-ops-dispatcher
      RetentionInDays: 30

  AiOpsDispatcherFunction:
    Type: AWS::Lambda::Function
    DependsOn: AiOpsDispatcherLogGroup
    Properties:
      FunctionName: !Sub toh-${Environment}-ai-ops-dispatcher
      Description: Dispatches allowlisted AI operations analysis from AWS Scheduler.
      Role: !GetAtt AiOpsDispatcherRole.Arn
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 20
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          GITHUB_SECRET_ID: !Sub /theouthaven/credential-vault/${Environment}/github
          GITHUB_REPOSITORY: !Ref GitHubRepository
          EVENT_TYPE: platform-ai-ops-analysis
      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError('ai_ops_dispatcher_code_not_deployed')

  AiOpsSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TheOutHavenAiOpsScheduler-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-ai-ops-dispatcher
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AiOpsDispatcherFunction.Arn

  AiOpsSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub toh-${Environment}-ai-ops-analysis
      Description: Hourly AI analysis of sanitized release and security evidence.
      ScheduleExpression: !Ref AnalysisScheduleExpression
      FlexibleTimeWindow:
        Mode: FLEXIBLE
        MaximumWindowInMinutes: 10
      State: ENABLED
      Target:
        Arn: !GetAtt AiOpsDispatcherFunction.Arn
        RoleArn: !GetAtt AiOpsSchedulerRole.Arn
        Input: '{"source":"aws-scheduler"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2

  AiOpsDispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub toh-${Environment}-ai-ops-dispatch-errors
      AlarmDescription: AI operations analysis dispatch failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiOpsDispatcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertsTopic
        - [!Ref PlatformAlertsTopicArn]
        - !Ref AWS::NoValue

Outputs:
  DispatcherFunctionName:
    Value: !Ref AiOpsDispatcherFunction
  ScheduleName:
    Value: !Ref AiOpsSchedule
