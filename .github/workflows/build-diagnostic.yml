name: Build diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
  SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key
  CRON_SECRET: dummy_cron_secret
  OPENAI_API_KEY: dummy_openai_key

jobs:
  diagnose-build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/production-ci-enterprise-search-lint'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make Resend webhook build-safe
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/api/webhooks/resend/route.ts';
          let source = fs.readFileSync(path, 'utf8');

          const moduleClient = 'const resend = new Resend(process.env.RESEND_API_KEY);\n\n';
          if (!source.includes(moduleClient)) throw new Error('Expected module-level Resend client not found');
          source = source.replace(moduleClient, '');

          const oldGuard = `export async function POST(request: NextRequest) {\n  if (!process.env.RESEND_WEBHOOK_SECRET) {\n    console.error(\n      "RESEND_WEBHOOK_SECRET is not configured.",\n    );`;
          const newGuard = `export async function POST(request: NextRequest) {\n  const resendApiKey = process.env.RESEND_API_KEY;\n  const resendWebhookSecret = process.env.RESEND_WEBHOOK_SECRET;\n\n  if (!resendApiKey || !resendWebhookSecret) {\n    console.error(\n      "Resend webhook credentials are not configured.",\n    );`;
          if (!source.includes(oldGuard)) throw new Error('Expected Resend credential guard not found');
          source = source.replace(oldGuard, newGuard);

          const verifySecret = '      webhookSecret:\n        process.env.RESEND_WEBHOOK_SECRET,';
          if (!source.includes(verifySecret)) throw new Error('Expected webhook secret use not found');
          source = source.replace(verifySecret, '      webhookSecret: resendWebhookSecret,');

          const verifyCall = '  let event: ResendWebhookEvent;\n\n  try {\n    event = resend.webhooks.verify({';
          if (!source.includes(verifyCall)) throw new Error('Expected Resend verification call not found');
          source = source.replace(verifyCall, '  const resend = new Resend(resendApiKey);\n  let event: ResendWebhookEvent;\n\n  try {\n    event = resend.webhooks.verify({');

          fs.writeFileSync(path, source);
          NODE

      - name: Capture production build output
        shell: bash
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo "--- compiler markers ---"
            grep -n -E "Failed to compile|Type error|Module not found|Error:|Build error|prerender|Cannot find|Property .* does not exist|is not assignable" build-output.txt | tail -n 80 || true
            echo "--- final output ---"
            tail -n 220 build-output.txt
          } > build-diagnostic.txt
          exit 0

      - name: Commit repair and diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/webhooks/resend/route.ts build-diagnostic.txt
          git commit -m "fix Resend webhook build initialization"
          git push origin HEAD:${GITHUB_HEAD_REF}
