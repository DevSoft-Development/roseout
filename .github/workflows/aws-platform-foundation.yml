name: AWS platform foundation

on:
  pull_request:
    paths:
      - 'infra/aws/**'
      - '.github/workflows/aws-platform-foundation.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/aws/cloudformation/platform-foundation.yml'
      - 'infra/aws/cloudformation/github-platform-deploy-role.yml'
      - '.github/workflows/aws-platform-foundation.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: production
        options:
          - staging
          - production
      deploy:
        description: Deploy after validation
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-platform-foundation-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  TEMPLATE_FILE: infra/aws/cloudformation/platform-foundation.yml
  ROLE_TEMPLATE_FILE: infra/aws/cloudformation/github-platform-deploy-role.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cfn-lint
        run: python -m pip install --disable-pip-version-check cfn-lint

      - name: Lint CloudFormation
        run: cfn-lint "$TEMPLATE_FILE" "$ROLE_TEMPLATE_FILE"

  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment configuration
        id: config
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          CONFIGURED_SITES_BUCKET: ${{ vars.AWS_SITES_BUCKET }}
          CONFIGURED_MEDIA_BUCKET: ${{ vars.AWS_MEDIA_BUCKET }}
        run: |
          set -euo pipefail
          TARGET_ENV="${INPUT_ENV:-production}"
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          SITES_BUCKET="${CONFIGURED_SITES_BUCKET:-theouthaven-sites-${AWS_ACCOUNT_ID}-${TARGET_ENV}}"
          MEDIA_BUCKET="${CONFIGURED_MEDIA_BUCKET:-theouthaven-media-${AWS_ACCOUNT_ID}-${TARGET_ENV}}"
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "sites_bucket=$SITES_BUCKET" >> "$GITHUB_OUTPUT"
          echo "media_bucket=$MEDIA_BUCKET" >> "$GITHUB_OUTPUT"
          {
            echo "### AWS foundation deployment target"
            echo ""
            echo "- Account: \`$AWS_ACCOUNT_ID\`"
            echo "- Region: \`$AWS_REGION\`"
            echo "- Environment: \`$TARGET_ENV\`"
            echo "- Deploy role: \`$ROLE_ARN\`"
            echo "- Sites bucket: \`$SITES_BUCKET\`"
            echo "- Media bucket: \`$MEDIA_BUCKET\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || { echo "Wrong AWS account: $ACCOUNT" >&2; exit 1; }

      - name: Repair bootstrap deployment permissions
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          POLICY_FILE="$RUNNER_TEMP/platform-bootstrap-repair.json"
          cat > "$POLICY_FILE" <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "CloudFormationChangeSetsBootstrap",
                "Effect": "Allow",
                "Action": [
                  "cloudformation:CreateChangeSet",
                  "cloudformation:DescribeChangeSet",
                  "cloudformation:ExecuteChangeSet",
                  "cloudformation:DeleteChangeSet"
                ],
                "Resource": "*"
              },
              {
                "Sid": "CloudFormationFoundationResourcesBootstrap",
                "Effect": "Allow",
                "Action": [
                  "scheduler:ListTagsForResource",
                  "sns:ListTagsForResource",
                  "s3:GetEncryptionConfiguration",
                  "s3:PutEncryptionConfiguration",
                  "s3:GetLifecycleConfiguration",
                  "s3:PutLifecycleConfiguration",
                  "s3:DeleteBucketPolicy",
                  "sqs:GetQueueUrl"
                ],
                "Resource": "*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenCloudFormationChangeSetsBootstrap \
            --policy-document "file://$POLICY_FILE"
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenCloudFormationChangeSetsBootstrap \
            --query 'PolicyName' \
            --output text >/dev/null
          # IAM policy changes are eventually consistent. Give the active OIDC role
          # enough time to expose newly added resource-handler permissions.
          sleep 8
          echo "Bootstrap deployment permissions verified for \`$ROLE_NAME\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure ELB service-linked role prerequisite
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          POLICY_NAME="TheOutHavenElbServiceLinkedRoleBootstrap"
          POLICY_FILE="$RUNNER_TEMP/elb-service-linked-role-bootstrap.json"
          ERROR_FILE="$RUNNER_TEMP/elb-service-linked-role-error.txt"
          cleanup() {
            aws iam delete-role-policy \
              --role-name "$ROLE_NAME" \
              --policy-name "$POLICY_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cat > "$POLICY_FILE" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"CreateElbServiceLinkedRole",
                "Effect":"Allow",
                "Action":"iam:CreateServiceLinkedRole",
                "Resource":"*",
                "Condition":{"StringEquals":{"iam:AWSServiceName":"elasticloadbalancing.amazonaws.com"}}
              }
            ]
          }
          JSON
          test "$(wc -c < "$POLICY_FILE")" -lt 768
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document "file://$POLICY_FILE"
          sleep 8
          if ! aws iam create-service-linked-role \
            --aws-service-name elasticloadbalancing.amazonaws.com \
            > /dev/null 2> "$ERROR_FILE"; then
            if ! grep -Eq 'has been taken in this account|already exists' "$ERROR_FILE"; then
              cat "$ERROR_FILE" >&2
              exit 1
            fi
          fi
          echo 'Elastic Load Balancing service-linked role prerequisite is ready.' >> "$GITHUB_STEP_SUMMARY"

      - name: Recover rolled-back foundation stack
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          STACK_NAME="theouthaven-platform-${TARGET_ENV}"
          SCHEDULE_GROUP="toh-${TARGET_ENV}"
          STATUS="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          CLEAN_ORPHANS=false

          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Existing stack is ROLLBACK_COMPLETE. Previous failure events:"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' \
              --output table || true
            echo "Deleting rolled-back stack before clean retry."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
            CLEAN_ORPHANS=true
          elif [ -z "$STATUS" ]; then
            # A previous failed create can leave named resources behind after the stack
            # itself disappears. Only clean the reserved foundation names when no stack owns them.
            CLEAN_ORPHANS=true
          fi

          if [ "$CLEAN_ORPHANS" = "true" ] && aws scheduler get-schedule-group --name "$SCHEDULE_GROUP" >/dev/null 2>&1; then
            echo "Deleting orphan EventBridge Scheduler group: $SCHEDULE_GROUP"
            aws scheduler delete-schedule-group --name "$SCHEDULE_GROUP"
            for attempt in $(seq 1 60); do
              if ! aws scheduler get-schedule-group --name "$SCHEDULE_GROUP" >/dev/null 2>&1; then
                echo "Orphan Scheduler group deleted."
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Scheduler group $SCHEDULE_GROUP did not finish deleting in time." >&2
                exit 1
              fi
              sleep 2
            done
          fi

      - name: Deploy dormant foundation stack
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
          AWS_SITES_BUCKET: ${{ steps.config.outputs.sites_bucket }}
          AWS_MEDIA_BUCKET: ${{ steps.config.outputs.media_bucket }}
          AWS_PLATFORM_ALERT_EMAIL: ${{ vars.AWS_PLATFORM_ALERT_EMAIL }}
        run: |
          set -euo pipefail
          ALERT_ARGS=(EnableAlertEmailSubscription=false AlertEmail=)
          if [ -n "${AWS_PLATFORM_ALERT_EMAIL:-}" ]; then
            ALERT_ARGS=(EnableAlertEmailSubscription=true AlertEmail="$AWS_PLATFORM_ALERT_EMAIL")
          fi

          aws cloudformation deploy \
            --stack-name "theouthaven-platform-${TARGET_ENV}" \
            --template-file "$TEMPLATE_FILE" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$TARGET_ENV" \
              SitesBucketName="$AWS_SITES_BUCKET" \
              MediaBucketName="$AWS_MEDIA_BUCKET" \
              "${ALERT_ARGS[@]}" \
            --tags Project=TheOutHaven Environment="$TARGET_ENV" ManagedBy=CloudFormation

      - name: Show CloudFormation failure events
        if: failure()
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          STACK_NAME="theouthaven-platform-${TARGET_ENV}"
          echo "### CloudFormation failure events" >> "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' \
            --output table || true

      - name: Publish stack outputs
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "theouthaven-platform-${TARGET_ENV}" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Foundation stack \`theouthaven-platform-${TARGET_ENV}\` deployed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "No customer DNS, website traffic, email delivery mode, or domain lifecycle ownership was changed." >> "$GITHUB_STEP_SUMMARY"
