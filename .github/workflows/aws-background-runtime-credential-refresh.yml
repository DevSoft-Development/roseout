name: AWS background runtime credential refresh

on:
  pull_request:
    paths:
      - '.github/workflows/aws-background-runtime-credential-refresh.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-background-runtime-credential-refresh.yml'
  workflow_run:
    workflows: ['AWS background runtime', 'AWS platform DR']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-background-runtime-credential-refresh-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  VIRGINIA_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  EAST_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role
  EDGE_RUNTIME_SECRET_NAME: /theouthaven/production/edge-runtime/env
  EDGE_RUNTIME_SECRET_REGION: us-east-1
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  BACKGROUND_CRON_WORKER: toh-production-background-cron-worker

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded recovery contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-background-runtime-credential-refresh.yml'
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" "$FILE"
          grep -F "workflows: ['AWS background runtime', 'AWS platform DR']" "$FILE" >/dev/null
          grep -F "github.event_name == 'push'" "$FILE" >/dev/null
          grep -F "github.event.workflow_run.conclusion == 'failure'" "$FILE" >/dev/null
          grep -F "github.event.workflow_run.name == 'AWS platform DR'" "$FILE" >/dev/null
          grep -F "github.event.workflow_run.head_branch == 'main'" "$FILE" >/dev/null
          grep -F '/theouthaven/production/supabase/service-role' "$FILE" >/dev/null
          grep -F '/theouthaven/production/edge-runtime/env' "$FILE" >/dev/null
          grep -F '/theouthaven/production/platform-dr/app-env' "$FILE" >/dev/null
          grep -F "current['SUPABASE_SERVICE_ROLE_KEY'] = key" "$FILE" >/dev/null
          grep -F "current['WORKER_INTERNAL_SECRET'] = worker_secret" "$FILE" >/dev/null
          grep -F 'WORKER_SECRET_REFRESH_TOKEN' "$FILE" >/dev/null
          grep -F 'BACKGROUND_RUNTIME_REFRESH_TOKEN' "$FILE" >/dev/null
          grep -F '/api/health/background-runtime' "$FILE" >/dev/null

  refresh:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.name == 'AWS platform DR' ||
        github.event.workflow_run.conclusion == 'failure'))
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Validate authoritative east-region Virginia credential
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          KEY_FILE="$RUNNER_TEMP/virginia-service-role"
          aws secretsmanager get-secret-value \
            --secret-id "$EAST_SERVICE_ROLE_SECRET" \
            --query SecretString --output text > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          test -n "$SERVICE_ROLE" && test "$SERVICE_ROLE" != 'None'
          echo "::add-mask::$SERVICE_ROLE"
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            "${VIRGINIA_SUPABASE_URL}/rest/v1/locations?select=id&limit=1")"
          test "$STATUS" = '200' || { echo "East-region Virginia credential failed Data API probe with HTTP $STATUS" >&2; exit 1; }
          echo 'authoritative_east_virginia_credential=valid'

      - name: Repair shared background app environment and worker-secret parity
        run: |
          set -euo pipefail
          CURRENT="$RUNNER_TEMP/current-app-env.json"
          EDGE="$RUNNER_TEMP/edge-runtime-env.json"
          REPAIRED="$RUNNER_TEMP/repaired-app-env.json"
          aws secretsmanager get-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --query SecretString --output text > "$CURRENT"
          aws secretsmanager get-secret-value \
            --region "$EDGE_RUNTIME_SECRET_REGION" \
            --secret-id "$EDGE_RUNTIME_SECRET_NAME" \
            --query SecretString --output text > "$EDGE"
          chmod 600 "$CURRENT" "$EDGE"
          CURRENT_JSON="$CURRENT" EDGE_JSON="$EDGE" KEY_FILE="$RUNNER_TEMP/virginia-service-role" OUTPUT_JSON="$REPAIRED" VIRGINIA_SUPABASE_URL="$VIRGINIA_SUPABASE_URL" python <<'PY'
          import json
          import os
          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          with open(os.environ['EDGE_JSON'], encoding='utf-8') as fh:
              edge = json.load(fh)
          with open(os.environ['KEY_FILE'], encoding='utf-8') as fh:
              key = fh.read().strip()
          if not isinstance(current, dict) or not isinstance(edge, dict) or not key:
              raise SystemExit('Invalid background credential refresh input.')
          worker_secret = str(edge.get('WORKER_INTERNAL_SECRET') or '').strip()
          if len(worker_secret) < 32:
              raise SystemExit('Canonical edge runtime WORKER_INTERNAL_SECRET is missing or too short.')
          current['NEXT_PUBLIC_SUPABASE_URL'] = os.environ['VIRGINIA_SUPABASE_URL']
          current['SUPABASE_SERVICE_ROLE_KEY'] = key
          current['WORKER_INTERNAL_SECRET'] = worker_secret
          with open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8') as fh:
              json.dump(current, fh, separators=(',', ':'))
          PY
          chmod 600 "$REPAIRED"
          aws secretsmanager put-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --secret-string "file://$REPAIRED" >/dev/null
          python - "$EDGE" "$REPAIRED" <<'PY'
          import json
          import sys
          edge = json.load(open(sys.argv[1], encoding='utf-8'))
          repaired = json.load(open(sys.argv[2], encoding='utf-8'))
          source = str(edge.get('WORKER_INTERNAL_SECRET') or '')
          target = str(repaired.get('WORKER_INTERNAL_SECRET') or '')
          if len(source) < 32 or source != target:
              raise SystemExit('Worker-secret parity verification failed.')
          print('background_worker_secret_parity=verified')
          PY
          echo 'background_shared_app_environment=virginia_credential_and_worker_secret_repaired'

      - name: Start one fresh background cron worker generation
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name "$BACKGROUND_CRON_WORKER" > "$RUNNER_TEMP/background-worker-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-worker-config.json" > "$RUNNER_TEMP/background-worker-environment.json"
          jq --arg token "worker-secret-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.WORKER_SECRET_REFRESH_TOKEN=$token' "$RUNNER_TEMP/background-worker-environment.json" > "$RUNNER_TEMP/background-worker-refresh-environment.json"
          aws lambda update-function-configuration --function-name "$BACKGROUND_CRON_WORKER" --environment "file://$RUNNER_TEMP/background-worker-refresh-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_CRON_WORKER"
          test "$(aws lambda get-function-configuration --function-name "$BACKGROUND_CRON_WORKER" --query 'State' --output text)" = 'Active'
          test "$(aws lambda get-function-configuration --function-name "$BACKGROUND_CRON_WORKER" --query 'LastUpdateStatus' --output text)" = 'Successful'
          echo 'background_cron_worker=fresh_generation_ready'

      - name: Start one fresh private background runtime generation
        id: runtime
        run: |
          set -euo pipefail
          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN" && test "$BACKGROUND_FN" != 'None'
          aws lambda get-function-configuration --function-name "$BACKGROUND_FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/current-environment.json"
          jq --arg token "credential-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' "$RUNNER_TEMP/current-environment.json" > "$RUNNER_TEMP/refresh-environment.json"
          aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/refresh-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          echo "function=$BACKGROUND_FN" >> "$GITHUB_OUTPUT"

      - name: Verify private background runtime against Virginia
        env:
          BACKGROUND_FN: ${{ steps.runtime.outputs.function }}
        run: |
          set -euo pipefail
          RESPONSE="$RUNNER_TEMP/health-response.json"
          cat > "$RUNNER_TEMP/health.json" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"credential-refresh"},"requestContext":{"accountId":"credential-refresh","apiId":"credential-refresh","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"credential-refresh","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"02/Sep/2026:00:00:00 +0000","timeEpoch":1788307200000},"isBase64Encoded":false}
          JSON
          healthy=0
          for attempt in 1 2 3 4 5 6; do
            rm -f "$RESPONSE"
            if aws lambda invoke \
              --function-name "$BACKGROUND_FN" \
              --cli-binary-format raw-in-base64-out \
              --payload "fileb://$RUNNER_TEMP/health.json" \
              "$RESPONSE" >/dev/null 2>&1 && \
              jq -e '.statusCode == 200 and (.body | fromjson | .ok == true and .runtime == "aws-background" and .database == "ok")' "$RESPONSE" >/dev/null 2>&1; then
              echo "private_background_runtime=healthy_on_virginia attempt=${attempt}"
              healthy=1
              break
            fi
            STATUS_CODE="$(jq -r '.statusCode // "invoke_error"' "$RESPONSE" 2>/dev/null || echo 'invoke_error')"
            echo "Background runtime guarded-recovery health attempt ${attempt}/6 not ready (status=${STATUS_CODE})."
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          test "$healthy" = '1' || { echo 'Background runtime guarded-recovery health failed after 6 attempts.' >&2; exit 1; }

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/virginia-service-role" "$RUNNER_TEMP/current-app-env.json" "$RUNNER_TEMP/edge-runtime-env.json" "$RUNNER_TEMP/repaired-app-env.json" "$RUNNER_TEMP/background-worker-config.json" "$RUNNER_TEMP/background-worker-environment.json" "$RUNNER_TEMP/background-worker-refresh-environment.json" "$RUNNER_TEMP/background-config.json" "$RUNNER_TEMP/current-environment.json" "$RUNNER_TEMP/refresh-environment.json" "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/health-response.json"

      - name: Summary
        run: |
          {
            echo '### AWS background runtime guarded credential recovery'
            echo '- Trigger: push, manual dispatch, failed AWS background runtime on main, or completed AWS platform DR on main'
            echo '- Virginia database credential authority: east-region AWS service-role secret'
            echo '- Worker-secret authority: canonical AWS edge-runtime environment secret'
            echo '- Shared background app environment: repaired without printing secrets'
            echo '- Background cron worker: fresh configuration generation'
            echo '- Private runtime: fresh configuration generation'
            echo '- Virginia health: passed'
          } >> "$GITHUB_STEP_SUMMARY"
