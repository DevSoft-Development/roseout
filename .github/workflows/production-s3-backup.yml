name: Production S3 database backup

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-s3-database-backup
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::742020474738:role/TheOutHavenGitHubBackupRole
  SUPABASE_CLI_VERSION: 2.111.0

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate required configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_BACKUP_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "Missing repository secret SUPABASE_DB_URL" >&2; exit 1; }
          test -n "$AWS_BACKUP_BUCKET" || { echo "Missing repository variable AWS_BACKUP_BUCKET" >&2; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      - name: Create logical database backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/theouthaven-backup/database"
          cd "$RUNNER_TEMP/theouthaven-backup/database"

          supabase db dump --db-url "$SUPABASE_DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f data.sql --data-only --use-copy \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

          test -s roles.sql
          test -s schema.sql
          test -s data.sql

      - name: Package and checksum backup
        id: package
        run: |
          set -euo pipefail
          STAMP="$(date -u +'%Y%m%dT%H%M%SZ')"
          YEAR="$(date -u +'%Y')"
          MONTH="$(date -u +'%m')"
          DAY="$(date -u +'%d')"
          ARCHIVE="theouthaven-postgres-${STAMP}.tar.gz"
          PREFIX="database/${YEAR}/${MONTH}/${DAY}/${STAMP}"

          cd "$RUNNER_TEMP/theouthaven-backup"
          tar -czf "$ARCHIVE" database
          SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          BYTES="$(stat -c '%s' "$ARCHIVE")"

          printf '%s  %s\n' "$SHA256" "$ARCHIVE" > "${ARCHIVE}.sha256"
          jq -n \
            --arg created_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg archive "$ARCHIVE" \
            --arg sha256 "$SHA256" \
            --arg git_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson bytes "$BYTES" \
            '{created_at:$created_at,archive:$archive,sha256:$sha256,bytes:$bytes,git_sha:$git_sha,github_run_id:$run_id,github_run_attempt:$run_attempt}' \
            > "${ARCHIVE}.manifest.json"

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "742020474738"

      - name: Upload encrypted backup to S3
        env:
          AWS_BACKUP_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PREFIX: ${{ steps.package.outputs.prefix }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/theouthaven-backup"
          DEST="s3://${AWS_BACKUP_BUCKET}/${PREFIX}"

          aws s3 cp "$ARCHIVE" "${DEST}/${ARCHIVE}" \
            --sse AES256 \
            --only-show-errors \
            --metadata "sha256=${SHA256},github-run-id=${GITHUB_RUN_ID},git-sha=${GITHUB_SHA}"
          aws s3 cp "${ARCHIVE}.sha256" "${DEST}/${ARCHIVE}.sha256" --sse AES256 --only-show-errors
          aws s3 cp "${ARCHIVE}.manifest.json" "${DEST}/${ARCHIVE}.manifest.json" --sse AES256 --only-show-errors

      - name: Verify uploaded backup
        env:
          AWS_BACKUP_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PREFIX: ${{ steps.package.outputs.prefix }}
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$(aws s3api head-object \
            --bucket "$AWS_BACKUP_BUCKET" \
            --key "${PREFIX}/${ARCHIVE}" \
            --query 'Metadata.sha256' \
            --output text)"

          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || {
            echo "S3 verification failed: checksum metadata does not match" >&2
            exit 1
          }

          echo "Verified s3://${AWS_BACKUP_BUCKET}/${PREFIX}/${ARCHIVE}"

      - name: Backup summary
        env:
          AWS_BACKUP_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PREFIX: ${{ steps.package.outputs.prefix }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          BYTES: ${{ steps.package.outputs.bytes }}
        run: |
          {
            echo "### Production database backup"
            echo ""
            echo "- Status: verified"
            echo "- S3 bucket: \`${AWS_BACKUP_BUCKET}\`"
            echo "- Object: \`${PREFIX}/${ARCHIVE}\`"
            echo "- Size: ${BYTES} bytes"
            echo "- SHA-256: \`${SHA256}\`"
            echo "- AWS authentication: GitHub OIDC temporary credentials"
          } >> "$GITHUB_STEP_SUMMARY"
