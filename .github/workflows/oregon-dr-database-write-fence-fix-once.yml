name: Oregon DR database write fence fix once

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Feature branch to patch
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
      - name: Apply bounded database-fence patch
        run: |
          set -euo pipefail
          test "${{ inputs.target_branch }}" = 'fix/oregon-dr-database-write-fence-impl-v3'
          git fetch origin main
          git show origin/main:scripts/dr/patch-database-write-fence-v3.py > "$RUNNER_TEMP/patch-database-write-fence.py"
          python3 "$RUNNER_TEMP/patch-database-write-fence.py"
          grep -F 'alter database postgres set default_transaction_read_only=on' .github/workflows/oregon-dr-promotion.yml >/dev/null
          grep -F 'alter role postgres set default_transaction_read_only=off' .github/workflows/oregon-dr-promotion.yml >/dev/null
          ! grep -F 'alter role supabase_auth_admin set default_transaction_read_only' .github/workflows/oregon-dr-promotion.yml >/dev/null
          grep -F 'alter role ${FAILBACK_SUBSCRIBER_ROLE} set default_transaction_read_only=off' scripts/dr/oregon-failback.sh >/dev/null
          bash -n scripts/dr/oregon-failback.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/oregon-dr-promotion.yml scripts/dr/oregon-failback.sh
          git rm -f --ignore-unmatch .github/workflows/oregon-dr-database-write-fence-fix-once.yml .github/workflows/oregon-dr-fence-trigger-once.yml scripts/dr/patch-database-write-fence.py scripts/dr/patch-database-write-fence-v2.py scripts/dr/patch-database-write-fence-v3.py
          git commit -m 'Use database-level write fences for Oregon DR'
          git push origin HEAD:${{ inputs.target_branch }}