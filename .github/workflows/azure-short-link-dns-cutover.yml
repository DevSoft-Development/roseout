name: Azure short-link DNS cutover

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/aws/cloudformation/azure-short-link-ingress.yml'
      - '.github/workflows/azure-short-link-dns-cutover.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/cloudformation/azure-short-link-ingress.yml'
      - '.github/workflows/azure-short-link-dns-cutover.yml'
  workflow_run:
    workflows: ['Azure consumer production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-short-link-dns-cutover-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: '742020474738'
  AWS_REGION: us-east-1
  DOMAIN_NAME: outhvn.com
  STACK_NAME: theouthaven-azure-short-link-ingress-production
  SNAPSHOT_SECRET: theouthaven/production/short-link/dns-cutover-last-snapshot
  AZURE_DEPLOYMENT: toh-consumer-runtime-production
  CLOUDFRONT_ZONE_ID: Z2FDTNDATAQYW2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CloudFormation
        run: |
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infra/aws/cloudformation/azure-short-link-ingress.yml

  execute:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    needs: validate
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure Front Door endpoint
        id: azure
        uses: azure/CLI@v3
        with:
          inlineScript: |
            set -euo pipefail
            EDGE="$(az deployment sub show --name "$AZURE_DEPLOYMENT" --query properties.outputs.consumerFrontDoorEndpointHostName.value -o tsv)"
            test -n "$EDGE" && test "$EDGE" != None
            curl --silent --show-error --fail --max-time 30 "https://$EDGE/api/health/azure/probe" >/dev/null
            echo "edge=$EDGE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Grant temporary DNS bootstrap permissions
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          echo "deploy_role_name=$ROLE_NAME" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/outhvn-bootstrap-policy.json" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"OuthvnRoute53Bootstrap",
                "Effect":"Allow",
                "Action":[
                  "route53:CreateHostedZone",
                  "route53:GetHostedZone",
                  "route53:ListHostedZones",
                  "route53:ListHostedZonesByName",
                  "route53:ListResourceRecordSets",
                  "route53:ChangeResourceRecordSets",
                  "route53:GetChange"
                ],
                "Resource":"*"
              },
              {
                "Sid":"OuthvnAcmCertificate",
                "Effect":"Allow",
                "Action":[
                  "acm:ListCertificates",
                  "acm:RequestCertificate",
                  "acm:DescribeCertificate",
                  "acm:AddTags"
                ],
                "Resource":"*"
              }
            ]
          }
          JSON
          aws iam put-role-policy             --role-name "$ROLE_NAME"             --policy-name TheOutHavenOuthvnRoute53Bootstrap             --policy-document "file://$RUNNER_TEMP/outhvn-bootstrap-policy.json"
          sleep 8

      - name: Snapshot current public DNS
        run: |
          set -euo pipefail
          command -v dig >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          }

          if aws secretsmanager describe-secret --secret-id "$SNAPSHOT_SECRET" >/dev/null 2>&1; then
            echo "dns_snapshot=existing"
            exit 0
          fi

          DOMAIN="$DOMAIN_NAME" python3 - <<'PY'
          import json, os, subprocess
          domain=os.environ['DOMAIN']
          def dig(rtype, name):
              p=subprocess.run(['dig','+short',rtype,name],capture_output=True,text=True,check=True)
              return [x.strip() for x in p.stdout.splitlines() if x.strip()]
          snapshot={
              'domain':domain,
              'capturedBeforeRoute53Delegation':True,
              'NS':dig('NS',domain),
              'SOA':dig('SOA',domain),
              'A':dig('A',domain),
              'AAAA':dig('AAAA',domain),
              'CNAME':dig('CNAME',domain),
              'MX':dig('MX',domain),
              'TXT':dig('TXT',domain),
              'CAA':dig('CAA',domain),
              'www':{
                  'A':dig('A','www.'+domain),
                  'AAAA':dig('AAAA','www.'+domain),
                  'CNAME':dig('CNAME','www.'+domain),
                  'TXT':dig('TXT','www.'+domain),
              },
          }
          raw=json.dumps(snapshot,separators=(',',':'))
          if len(raw.encode()) > 60000:
              raise SystemExit('Short-link DNS rollback snapshot is unexpectedly large.')
          open(os.environ['RUNNER_TEMP']+'/snapshot.json','w').write(raw)
          print(json.dumps(snapshot,indent=2))
          PY
          aws secretsmanager create-secret             --name "$SNAPSHOT_SECRET"             --description 'TheOutHaven pre-Route53 outhvn.com public DNS snapshot'             --secret-string "file://$RUNNER_TEMP/snapshot.json" >/dev/null
          echo "dns_snapshot=created"

      - name: Ensure Route53 zone and stage delegation
        id: dns
        run: |
          set -euo pipefail
          aws route53 list-hosted-zones-by-name --dns-name "$DOMAIN_NAME" > "$RUNNER_TEMP/zones.json"
          HOSTED_ZONE_ID="$(jq -r --arg name "${DOMAIN_NAME}." '[.HostedZones[] | select(.Name==$name and .Config.PrivateZone==false)][0].Id // empty' "$RUNNER_TEMP/zones.json" | sed 's#^/hostedzone/##')"
          if [ -z "$HOSTED_ZONE_ID" ]; then
            CALLER_REF="toh-outhvn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            aws route53 create-hosted-zone               --name "$DOMAIN_NAME"               --caller-reference "$CALLER_REF"               --hosted-zone-config Comment='TheOutHaven branded short-link production zone',PrivateZone=false               > "$RUNNER_TEMP/created-zone.json"
            HOSTED_ZONE_ID="$(jq -r '.HostedZone.Id' "$RUNNER_TEMP/created-zone.json" | sed 's#^/hostedzone/##')"
            echo "route53_zone=created"
          else
            echo "route53_zone=existing"
          fi
          echo "hosted_zone_id=$HOSTED_ZONE_ID" >> "$GITHUB_OUTPUT"

          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/zone-records.json"
          mapfile -t EXPECTED_NS < <(jq -r --arg name "${DOMAIN_NAME}." '.ResourceRecordSets[] | select(.Name==$name and .Type=="NS") | .ResourceRecords[].Value' "$RUNNER_TEMP/zone-records.json" | sed 's/\.$//' | sort)
          test "${#EXPECTED_NS[@]}" -eq 4 || { echo "::error::Expected four Route53 nameservers."; exit 1; }
          printf '%s\n' "${EXPECTED_NS[@]}" > "$RUNNER_TEMP/route53-ns.txt"

          PUBLIC_A="$(dig +short A "$DOMAIN_NAME" | sort -u)"
          if [ -z "$PUBLIC_A" ]; then
            PUBLIC_A=$'216.150.1.65\n216.150.16.1'
          fi
          PUBLIC_NS="$(dig +short NS "$DOMAIN_NAME" | sed 's/\.$//' | sort)"
          EXPECTED_TEXT="$(printf '%s\n' "${EXPECTED_NS[@]}")"

          if [ "$PUBLIC_NS" != "$EXPECTED_TEXT" ]; then
            HOSTED_ZONE_ID="$HOSTED_ZONE_ID" PUBLIC_A="$PUBLIC_A" python3 - <<'PY'
          import json, os
          zone=os.environ['HOSTED_ZONE_ID']
          domain=os.environ['DOMAIN_NAME']
          ips=[x for x in os.environ['PUBLIC_A'].splitlines() if x.strip()]
          changes=[]
          if ips:
              changes.append({
                  'Action':'UPSERT',
                  'ResourceRecordSet':{
                      'Name':domain,'Type':'A','TTL':60,
                      'ResourceRecords':[{'Value':ip} for ip in ips],
                  },
              })
          caas=['0 issue "amazon.com"','0 issue "letsencrypt.org"','0 issue "pki.goog"','0 issue "sectigo.com"']
          changes.append({
              'Action':'UPSERT',
              'ResourceRecordSet':{
                  'Name':domain,'Type':'CAA','TTL':300,
                  'ResourceRecords':[{'Value':v} for v in caas],
              },
          })
          json.dump({'Comment':'Stage outhvn.com before GoDaddy nameserver delegation','Changes':changes},open(os.environ['RUNNER_TEMP']+'/stage-zone.json','w'))
          PY
            CHANGE_ID="$(aws route53 change-resource-record-sets               --hosted-zone-id "$HOSTED_ZONE_ID"               --change-batch "file://$RUNNER_TEMP/stage-zone.json"               --query ChangeInfo.Id --output text)"
            aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
            echo "delegated=false" >> "$GITHUB_OUTPUT"
            {
              echo "## outhvn.com Route53 delegation required"
              echo
              echo "Route53 zone is prepared. In GoDaddy, replace the current Vercel nameservers with:"
              echo
              for ns in "${EXPECTED_NS[@]}"; do echo "- `$ns`"; done
              echo
              echo "Current authoritative nameservers are still:"
              while read -r ns; do [ -n "$ns" ] && echo "- `$ns`"; done <<< "$PUBLIC_NS"
              echo
              echo "No production DNS records were changed at the registrar in this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "delegated=true" >> "$GITHUB_OUTPUT"
          echo "route53_delegation=verified"

      - name: Ensure ACM certificate is validated
        if: steps.dns.outputs.delegated == 'true'
        id: cert
        env:
          HOSTED_ZONE_ID: ${{ steps.dns.outputs.hosted_zone_id }}
        run: |
          set -euo pipefail
          ARN="$(aws acm list-certificates             --certificate-statuses ISSUED PENDING_VALIDATION             --query "CertificateSummaryList[?DomainName=='$DOMAIN_NAME'] | [0].CertificateArn"             --output text)"
          if [ -z "$ARN" ] || [ "$ARN" = None ]; then
            ARN="$(aws acm request-certificate               --domain-name "$DOMAIN_NAME"               --validation-method DNS               --idempotency-token tohouthvnproduction               --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production Key=Service,Value=ShortLinkIngress               --query CertificateArn --output text)"
          fi
          test -n "$ARN" && test "$ARN" != None

          RECORD_NAME=""
          RECORD_TYPE=""
          RECORD_VALUE=""
          for attempt in $(seq 1 30); do
            aws acm describe-certificate --certificate-arn "$ARN" > "$RUNNER_TEMP/cert.json"
            RECORD_NAME="$(jq -r '.Certificate.DomainValidationOptions[0].ResourceRecord.Name // empty' "$RUNNER_TEMP/cert.json")"
            RECORD_TYPE="$(jq -r '.Certificate.DomainValidationOptions[0].ResourceRecord.Type // empty' "$RUNNER_TEMP/cert.json")"
            RECORD_VALUE="$(jq -r '.Certificate.DomainValidationOptions[0].ResourceRecord.Value // empty' "$RUNNER_TEMP/cert.json")"
            [ -n "$RECORD_NAME" ] && [ -n "$RECORD_VALUE" ] && break
            sleep 2
          done
          test -n "$RECORD_NAME" && test "$RECORD_TYPE" = CNAME && test -n "$RECORD_VALUE"

          jq -n             --arg name "$RECORD_NAME"             --arg value "$RECORD_VALUE"             '{Comment:"Validate outhvn.com ACM certificate",Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:$name,Type:"CNAME",TTL:60,ResourceRecords:[{Value:$value}]}}]}'             > "$RUNNER_TEMP/acm-validation.json"
          CHANGE_ID="$(aws route53 change-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID"             --change-batch "file://$RUNNER_TEMP/acm-validation.json"             --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
          aws acm wait certificate-validated --certificate-arn "$ARN"
          echo "certificate_arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy short-link apex ingress
        if: steps.dns.outputs.delegated == 'true'
        id: deploy
        env:
          FRONTDOOR_HOST: ${{ steps.azure.outputs.edge }}
          CERTIFICATE_ARN: ${{ steps.cert.outputs.certificate_arn }}
        run: |
          set -euo pipefail
          aws cloudformation deploy             --stack-name "$STACK_NAME"             --template-file infra/aws/cloudformation/azure-short-link-ingress.yml             --parameter-overrides               Environment=production               DomainName="$DOMAIN_NAME"               FrontDoorHost="$FRONTDOOR_HOST"               CertificateArn="$CERTIFICATE_ARN"             --no-fail-on-empty-changeset
          DISTRIBUTION_DOMAIN="$(aws cloudformation describe-stacks             --stack-name "$STACK_NAME"             --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue"             --output text)"
          test -n "$DISTRIBUTION_DOMAIN" && test "$DISTRIBUTION_DOMAIN" != None
          echo "distribution_domain=$DISTRIBUTION_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Cut Route53 apex to Azure ingress
        if: steps.dns.outputs.delegated == 'true'
        env:
          HOSTED_ZONE_ID: ${{ steps.dns.outputs.hosted_zone_id }}
          DISTRIBUTION_DOMAIN: ${{ steps.deploy.outputs.distribution_domain }}
        run: |
          set -euo pipefail
          jq -n             --arg name "$DOMAIN_NAME"             --arg dns "$DISTRIBUTION_DOMAIN"             --arg zone "$CLOUDFRONT_ZONE_ID"             '{
              Comment:"Cut outhvn.com apex to CloudFront -> Azure Front Door",
              Changes:[
                {Action:"UPSERT",ResourceRecordSet:{Name:$name,Type:"A",AliasTarget:{DNSName:$dns,HostedZoneId:$zone,EvaluateTargetHealth:false}}},
                {Action:"UPSERT",ResourceRecordSet:{Name:$name,Type:"AAAA",AliasTarget:{DNSName:$dns,HostedZoneId:$zone,EvaluateTargetHealth:false}}}
              ]
            }' > "$RUNNER_TEMP/apex-cutover.json"
          CHANGE_ID="$(aws route53 change-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID"             --change-batch "file://$RUNNER_TEMP/apex-cutover.json"             --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"

      - name: Resolve production short-link verification data
        if: steps.dns.outputs.delegated == 'true'
        run: |
          set -euo pipefail
          PREFIX="/theouthaven/credential-vault/production"
          aws secretsmanager get-secret-value --secret-id "$PREFIX/supabase" --query SecretString --output text > "$RUNNER_TEMP/supabase.json"
          SUPABASE_URL="$(jq -r '.url // empty' "$RUNNER_TEMP/supabase.json")"
          SERVICE_KEY="$(jq -r '.serviceRoleKey // empty' "$RUNNER_TEMP/supabase.json")"
          test -n "$SUPABASE_URL" && test -n "$SERVICE_KEY"
          echo "::add-mask::$SERVICE_KEY"

          RESPONSE="$(curl --silent --show-error --fail             -H "apikey: $SERVICE_KEY"             -H "Authorization: Bearer $SERVICE_KEY"             "$SUPABASE_URL/rest/v1/short_links?select=id,code,destination_url,expires_at,max_clicks,click_count&is_active=eq.true&order=updated_at.desc&limit=25")"
          NOW_ISO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CANDIDATE="$(printf '%s' "$RESPONSE" | jq -c --arg now "$NOW_ISO" '
            map(select(
              (.expires_at == null or .expires_at > $now)
              and
              (.max_clicks == null or ((.click_count // 0) < .max_clicks))
            )) | .[0] // empty
          ')"
          test -n "$CANDIDATE" || { echo "::error::No currently usable active short link is available for production verification."; exit 1; }
          CODE="$(printf '%s' "$CANDIDATE" | jq -r '.code // empty')"
          DESTINATION="$(printf '%s' "$CANDIDATE" | jq -r '.destination_url // empty')"
          LINK_ID="$(printf '%s' "$CANDIDATE" | jq -r '.id // empty')"
          test -n "$CODE" && test -n "$DESTINATION" && test -n "$LINK_ID"
          {
            echo "VERIFY_CODE=$CODE"
            echo "VERIFY_DESTINATION=$DESTINATION"
            echo "VERIFY_LINK_ID=$LINK_ID"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY"
          } >> "$GITHUB_ENV"

      - name: Verify public short-link surface
        if: steps.dns.outputs.delegated == 'true'
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 40); do
            ROOT_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "https://$DOMAIN_NAME/" || true)"
            AASA_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/aasa.json" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "https://$DOMAIN_NAME/.well-known/apple-app-site-association" || true)"
            ASSET_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/assetlinks.json" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "https://$DOMAIN_NAME/.well-known/assetlinks.json" || true)"
            if [ "$ROOT_CODE" = 302 ] && [ "$AASA_CODE" = 200 ] && [ "$ASSET_CODE" = 200 ]; then
              ready=true
              break
            fi
            echo "Waiting for outhvn.com edge convergence (root=$ROOT_CODE aasa=$AASA_CODE assetlinks=$ASSET_CODE attempt=$attempt/40)."
            sleep 15
          done
          test "$ready" = true
          jq -e '.applinks.details[0].appID == "92L2596H9F.com.theouthaven.app"' "$RUNNER_TEMP/aasa.json" >/dev/null
          jq -e '.[0].target.package_name == "com.theouthaven.app" and (.[0].target.sha256_cert_fingerprints | length) > 0' "$RUNNER_TEMP/assetlinks.json" >/dev/null

          INVALID_LOCATION="$(curl --silent --show-error --head --output /dev/null --write-out '%{redirect_url}' --connect-timeout 10 --max-time 20 "https://$DOMAIN_NAME/not-a-valid-short-code" || true)"
          test "$INVALID_LOCATION" = "https://theouthaven.com/" || test "$INVALID_LOCATION" = "https://theouthaven.com"

      - name: Verify existing short code and click recording
        if: steps.dns.outputs.delegated == 'true'
        run: |
          set -euo pipefail
          curl --silent --show-error --fail             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H 'Prefer: count=exact'             -D "$RUNNER_TEMP/before-headers.txt"             -o /dev/null             "$SUPABASE_URL/rest/v1/short_link_clicks?select=id&short_link_id=eq.$VERIFY_LINK_ID"
          BEFORE_COUNT="$(awk 'BEGIN{IGNORECASE=1} /^content-range:/ {split($0,a,"/"); gsub("\r","",a[2]); print a[2]}' "$RUNNER_TEMP/before-headers.txt" | tail -1)"
          BEFORE_COUNT="${BEFORE_COUNT:-0}"

          LOCATION="$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}'             --connect-timeout 10 --max-time 20             -H 'User-Agent: TheOutHaven-Azure-ShortLink-Probe/1.0'             "https://$DOMAIN_NAME/$VERIFY_CODE?utm_source=azure-cutover")"
          if [ "$LOCATION" != "$VERIFY_DESTINATION" ]; then
            echo "::error::Short-link redirect mismatch. expected=$VERIFY_DESTINATION observed=$LOCATION"
            exit 1
          fi

          recorded=false
          for attempt in $(seq 1 12); do
            curl --silent --show-error --fail               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               -H 'Prefer: count=exact'               -D "$RUNNER_TEMP/after-headers.txt"               -o /dev/null               "$SUPABASE_URL/rest/v1/short_link_clicks?select=id&short_link_id=eq.$VERIFY_LINK_ID"
            AFTER_COUNT="$(awk 'BEGIN{IGNORECASE=1} /^content-range:/ {split($0,a,"/"); gsub("\r","",a[2]); print a[2]}' "$RUNNER_TEMP/after-headers.txt" | tail -1)"
            AFTER_COUNT="${AFTER_COUNT:-0}"
            if [ "$AFTER_COUNT" -gt "$BEFORE_COUNT" ]; then
              recorded=true
              break
            fi
            sleep 2
          done
          test "$recorded" = true

          {
            echo "## outhvn.com Azure cutover complete"
            echo
            echo "- DNS authority: Route53"
            echo "- Apex HTTPS ingress: CloudFront -> Azure Front Door"
            echo "- Azure short-link runtime: passed"
            echo "- Existing short code redirect: passed"
            echo "- Supabase click recording: passed"
            echo "- iOS association endpoint: passed"
            echo "- Android association endpoint: passed"
            echo "- Existing short-link data: preserved"
            echo "- Vercel DNS is no longer authoritative"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary DNS bootstrap permissions
        if: always()
        run: |
          if [ -n "${deploy_role_name:-}" ]; then
            aws iam delete-role-policy               --role-name "$deploy_role_name"               --policy-name TheOutHavenOuthvnRoute53Bootstrap >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/outhvn-bootstrap-policy.json"
