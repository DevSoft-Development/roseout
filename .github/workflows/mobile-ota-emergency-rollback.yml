name: Mobile OTA emergency rollback dispatch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ota-emergency-rollback.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch production rollback to embedded
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing signed OTA rollback workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/mobile-azure-ota.yml/dispatches" \
            --data '{"ref":"main","inputs":{"action":"rollback_embedded","channel":"production","release_sha":"","rollback_release_sha":"","rollout_percentage":"100"}}'

          echo "Dispatched production rollback-to-embedded through the existing signed Azure OTA workflow."
