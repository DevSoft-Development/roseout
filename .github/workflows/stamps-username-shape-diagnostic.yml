name: Stamps username shape diagnostic

on:
  push:
    branches:
      - fix/stamps-credential-test-diagnostic
    paths:
      - '.github/workflows/stamps-username-shape-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: '742020474738'
    steps:
      - uses: actions/checkout@v4
      - id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: echo "role_arn=${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Check username shape only
        run: |
          set -euo pipefail
          SECRET_ID='/theouthaven/credential-vault/production/stamps'
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)"
          USERNAME="$(printf '%s' "$SECRET_JSON" | jq -r '.username // empty')"
          echo "::add-mask::$USERNAME"
          if [[ "$USERNAME" == *@* ]]; then echo 'username_looks_like_email=true'; else echo 'username_looks_like_email=false'; fi
          echo "username_length=${#USERNAME}"
          unset SECRET_JSON USERNAME
