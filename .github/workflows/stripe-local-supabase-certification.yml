name: Stripe local Supabase certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'lib/business/**'
      - 'lib/billing/**'
      - 'lib/stripe/**'
      - 'tests/business/**'
      - 'app/api/stripe/**'
      - 'apps/consumer/app/api/stripe/**'
      - '.github/workflows/stripe-local-supabase-certification.yml'

permissions:
  contents: read

concurrency:
  group: stripe-local-supabase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  certify:
    name: Disposable database and billing regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      LOCATION_PLAN_CHECKOUT_ENABLED: 'false'
      STRIPE_TEST_LOCATION_ESSENTIAL_PLUS_MONTHLY_PRICE_ID: price_1U7nwy1uqlTAOmyxqkI91P9d
      STRIPE_TEST_LOCATION_SELECT_PLUS_MONTHLY_PRICE_ID: price_1UPzvi1uqlTAOmyxnoR4Dh1a
      STRIPE_TEST_LOCATION_SIGNATURE_PLUS_MONTHLY_PRICE_ID: price_1UPzvk1uqlTAOmyx0b8YThQu
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Normalize duplicate migration versions in disposable workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = sorted((p for p in Path("supabase/migrations").glob("*.sql") if p.name[:1].isdigit()), key=lambda p: (int(p.name.split("_", 1)[0]), p.name))
          last = -1
          for path in files:
              version, suffix = path.name.split("_", 1)
              unique = max(int(version), last + 1)
              last = unique
              if unique != int(version):
                  target = path.with_name(f"{unique:014d}_{suffix}")
                  if target.exists():
                      raise RuntimeError(f"Refusing to overwrite {target}")
                  path.rename(target)
                  print(f"CI-only: {path.name} -> {target.name}")
          PY
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild isolated database from migrations
        run: supabase db reset --local
      - name: Verify database isolation and SQL writes
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT current_database(), current_user;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TEMP TABLE stripe_ci_probe (id integer PRIMARY KEY); INSERT INTO stripe_ci_probe VALUES (1); SELECT count(*) FROM stripe_ci_probe;'
      - name: Run billing contracts against disposable CI environment
        run: |
          npx vitest run tests/business/claim-plan-stack.test.ts tests/business/location-plan-billing.test.ts tests/business/subscription-release-policy.test.ts tests/business/discovery-paid-journey-e2e.test.ts tests/business/billing-launch-gate.test.ts tests/business/stripe-sandbox-prices.test.ts
      - name: Stop isolated services
        if: always()
        run: supabase stop --no-backup
