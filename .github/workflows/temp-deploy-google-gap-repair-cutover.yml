name: Temporary Deploy Google Gap Repair Cutover

on:
  push:
    branches:
      - agent/deploy-google-gap-repair-cutover

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: hnhbzynoyrhjndefbwkh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/deploy-google-gap-repair-cutover
          fetch-depth: 0

      - name: Validate deploy secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Deploy unified location gap repair
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy unified-location-gap-repair --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-deploy-google-gap-repair-cutover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temp-deploy-google-gap-repair-cutover.yml
          git commit -m 'Remove temporary Google gap repair deploy workflow'
          git push origin HEAD:agent/deploy-google-gap-repair-cutover
