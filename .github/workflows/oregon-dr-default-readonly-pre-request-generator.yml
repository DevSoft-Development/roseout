name: Oregon DR default-readonly pre-request generator

on:
  push:
    branches:
      - fix/oregon-dr-default-readonly-pre-request-generator
    paths:
      - '.github/workflows/oregon-dr-default-readonly-pre-request-generator.yml'
      - 'scripts/dr/patch-default-readonly-pre-request.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate corrected hosted-Supabase DR fence files
        run: |
          set -euo pipefail
          python3 scripts/dr/patch-default-readonly-pre-request.py
          bash -n scripts/dr/oregon-failback.sh
          git diff --check
          ! grep -F 'theouthaven.dr_write_fence' .github/workflows/oregon-dr-promotion.yml >/dev/null
          ! grep -F 'theouthaven.dr_write_fence' scripts/dr/oregon-failback.sh >/dev/null
          ! grep -F 'theouthaven.dr_write_fence' supabase/migrations/20260831233000_enable_dr_data_api_write_fence.sql >/dev/null
          grep -F "current_setting('default_transaction_read_only', true)" supabase/migrations/20260831233000_enable_dr_data_api_write_fence.sql >/dev/null
          grep -F 'DR write-fence probe' .github/workflows/oregon-dr-promotion.yml >/dev/null
          grep -F 'Oregon DR write-fence probe' scripts/dr/oregon-failback.sh >/dev/null
          grep -F "'25006'" .github/workflows/oregon-dr-promotion.yml >/dev/null
          grep -F "'25006'" scripts/dr/oregon-failback.sh >/dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/oregon-dr-promotion.yml scripts/dr/oregon-failback.sh supabase/migrations/20260831233000_enable_dr_data_api_write_fence.sql
          git commit -m 'Use default read-only state for DR Data API fence'
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:fix/oregon-dr-default-readonly-pre-request-generator
