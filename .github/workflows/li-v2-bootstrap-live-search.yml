name: LI V2 bootstrap public consumer search verification

on:
  pull_request:
    paths:
      - 'scripts/certify-li-v2-bootstrap-live-search.mjs'
      - '.github/workflows/li-v2-bootstrap-live-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check consumer search verifier syntax
        run: node --check scripts/certify-li-v2-bootstrap-live-search.mjs
      - name: Query public consumer search and assert exact TOH ID
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/certify-li-v2-bootstrap-live-search.mjs
