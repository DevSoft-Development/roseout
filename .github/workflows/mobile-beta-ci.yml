name: Mobile beta CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'app/api/mobile/v1/search/**'
      - 'scripts/mobile-search-parity-regression.mjs'
      - '.github/workflows/mobile-beta-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app/api/mobile/v1/search/**'
      - 'scripts/mobile-search-parity-regression.mjs'
      - '.github/workflows/mobile-beta-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-beta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo configuration
        run: npx expo config --type public >/tmp/theouthaven-mobile-expo-config.json

      - name: Verify Android native prebuild
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --no-install --platform android

      - name: Verify mobile/web search parity
        run: node ../scripts/mobile-search-parity-regression.mjs

      - name: Verify initial-search location pass-through
        run: node scripts/verify-location-pass.mjs

      - name: Verify release identifiers
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          if (app?.ios?.bundleIdentifier !== 'com.theouthaven.app') throw new Error('Unexpected iOS bundle identifier');
          if (app?.android?.package !== 'com.theouthaven.app') throw new Error('Unexpected Android package');
          if (!Array.isArray(app?.ios?.associatedDomains) || !app.ios.associatedDomains.includes('applinks:outhvn.com')) throw new Error('outhvn.com iOS associated domain missing');
          const filters = app?.android?.intentFilters || [];
          const hasShortLink = filters.some((filter) => (filter.data || []).some((item) => item.scheme === 'https' && item.host === 'outhvn.com'));
          if (!hasShortLink) throw new Error('outhvn.com Android app link missing');
          NODE

      - name: Verify EAS Update configuration
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expectedUrl = 'https://u.expo.dev/243ab88a-53dc-4f94-ae7e-6cc3d24b94be';
          if (pkg?.dependencies?.['expo-updates'] !== '~57.0.22') throw new Error('expo-updates dependency missing or unexpected');
          if (app?.updates?.url !== expectedUrl) throw new Error('EAS Update URL is missing or unexpected');
          if (app?.runtimeVersion?.policy !== 'fingerprint') throw new Error('EAS runtimeVersion must use fingerprint policy');
          NODE

      - name: Verify EAS profiles
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          for (const profile of ['development', 'preview', 'production']) {
            if (!eas?.build?.[profile]) throw new Error(`Missing EAS ${profile} build profile`);
            if (eas.build[profile].channel !== profile) throw new Error(`EAS ${profile} channel must match the profile name`);
          }
          if (eas.build.preview.distribution !== 'internal') throw new Error('Preview build must remain internal');
          if (eas.build.production.autoIncrement !== true) throw new Error('Production autoIncrement must remain enabled');
          NODE
