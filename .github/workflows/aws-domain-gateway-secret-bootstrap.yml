name: AWS domain gateway secret bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/aws-domain-gateway-secret-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-domain-gateway-secret-bootstrap.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-domain-gateway-secret-bootstrap-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  CANONICAL_DOMAIN_SECRET_NAME: /theouthaven/production/domain-gateway/hmac
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  DOMAIN_GATEWAY_INSTANCE: theouthaven-domains-gateway
  DOMAIN_GATEWAY_URL: https://domains-api.theouthaven.com
  BOOTSTRAP_POLICY_NAME: TheOutHavenDomainGatewayCredentialBootstrap

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-time bootstrap safety contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-domain-gateway-secret-bootstrap.yml'
          grep -F 'pull_request:' "$FILE" >/dev/null
          grep -F 'push:' "$FILE" >/dev/null
          grep -F 'if: github.event_name == '\''push'\''' "$FILE" >/dev/null
          grep -F 'Grant temporary Lightsail access' "$FILE" >/dev/null
          grep -F 'Re-assume AWS role after temporary permission grant' "$FILE" >/dev/null
          grep -F 'lightsail get-instance-access-details' "$FILE" >/dev/null
          grep -F 'delete-role-policy' "$FILE" >/dev/null
          grep -F 'Authority,Value=aws-canonical-v1' "$FILE" >/dev/null
          grep -F "current['DOMAIN_GATEWAY_URL'] = gateway_url" "$FILE" >/dev/null
          grep -F "current['DOMAIN_GATEWAY_SECRET'] = authority" "$FILE" >/dev/null
          grep -F 'domain_gateway_authentication=valid' "$FILE" >/dev/null
          grep -F 'background_runtime_health=valid' "$FILE" >/dev/null
          ! grep -E 'secrets[.]DOMAIN_GATEWAY_SECRET' "$FILE" >/dev/null

  bootstrap:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Check whether canonical secret already exists
        id: state
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          META="$RUNNER_TEMP/domain-secret-meta.json"
          if aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" > "$META" 2>/dev/null; then
            MARKED="$(jq -r 'any(.Tags[]?; .Key == "Authority" and .Value == "aws-canonical-v1")' "$META")"
          else
            MARKED=false
          fi
          if [ "$MARKED" = 'true' ]; then
            echo 'needs_bootstrap=false' >> "$GITHUB_OUTPUT"
            echo 'canonical_domain_secret=already_bootstrapped'
          else
            echo 'needs_bootstrap=true' >> "$GITHUB_OUTPUT"
            echo 'canonical_domain_secret=bootstrap_required'
          fi

      - name: Grant temporary Lightsail access
        if: steps.state.outputs.needs_bootstrap == 'true'
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          POLICY_FILE="$RUNNER_TEMP/domain-gateway-lightsail-bootstrap-policy.json"
          cat > "$POLICY_FILE" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"DomainGatewayTemporarySshAccess",
                "Effect":"Allow",
                "Action":[
                  "lightsail:GetInstance",
                  "lightsail:GetInstances",
                  "lightsail:GetInstanceAccessDetails"
                ],
                "Resource":"*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$BOOTSTRAP_POLICY_NAME" \
            --policy-document "file://$POLICY_FILE"
          echo "BOOTSTRAP_ROLE_NAME=$ROLE_NAME" >> "$GITHUB_ENV"
          echo 'temporary_lightsail_policy=granted'

      - name: Re-assume AWS role after temporary permission grant
        if: steps.state.outputs.needs_bootstrap == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Bootstrap canonical AWS secret from live gateway
        if: steps.state.outputs.needs_bootstrap == 'true'
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          ACCESS="$RUNNER_TEMP/domain-gateway-lightsail-access.json"
          KEY="$RUNNER_TEMP/domain-gateway-lightsail-key"
          CERT="$RUNNER_TEMP/domain-gateway-lightsail-key-cert.pub"
          KNOWN_HOSTS="$RUNNER_TEMP/domain-gateway-known-hosts"
          SECRET_FILE="$RUNNER_TEMP/domain-gateway-live-secret"

          aws lightsail get-instance-access-details \
            --region "$AWS_REGION" \
            --instance-name "$DOMAIN_GATEWAY_INSTANCE" \
            --protocol ssh > "$ACCESS"
          jq -e '.accessDetails.protocol == "ssh" and (.accessDetails.privateKey | length > 0) and (.accessDetails.ipAddress | length > 0) and (.accessDetails.username | length > 0)' "$ACCESS" >/dev/null
          jq -r '.accessDetails.privateKey' "$ACCESS" > "$KEY"
          jq -r '.accessDetails.certKey // empty' "$ACCESS" > "$CERT"
          jq -r '.accessDetails as $a | $a.hostKeys[] | "\($a.ipAddress) \(.algorithm) \(.publicKey)"' "$ACCESS" > "$KNOWN_HOSTS"
          chmod 600 "$KEY" "$CERT" "$KNOWN_HOSTS"
          test -s "$KNOWN_HOSTS"
          HOST="$(jq -r '.accessDetails.ipAddress' "$ACCESS")"
          USERNAME="$(jq -r '.accessDetails.username' "$ACCESS")"

          LIVE_SECRET="$(ssh \
            -i "$KEY" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$USERNAME@$HOST" \
            "sudo sh -c \"grep -m1 '^DOMAIN_GATEWAY_SECRET=' /opt/theouthaven-domain-gateway/.env | cut -d= -f2-\"")"
          LIVE_SECRET="$(RAW="$LIVE_SECRET" python - <<'PY'
          import os
          value = os.environ['RAW'].strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {'\"', "'"}:
              value = value[1:-1]
          print(value, end='')
          PY
          )"
          test "${#LIVE_SECRET}" -ge 32 || { echo 'Live domain gateway HMAC is missing or unexpectedly short.' >&2; exit 1; }
          case "$LIVE_SECRET" in *$'\n'*|*$'\r'*) echo 'Live domain gateway HMAC contains an invalid newline.' >&2; exit 1 ;; esac
          echo "::add-mask::$LIVE_SECRET"
          printf '%s' "$LIVE_SECRET" > "$SECRET_FILE"
          chmod 600 "$SECRET_FILE"

          if aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value \
              --region "$AWS_REGION" \
              --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" \
              --secret-string "file://$SECRET_FILE" \
              --query VersionId --output text >/dev/null
            SECRET_ARN="$(aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" --query ARN --output text)"
            aws secretsmanager tag-resource \
              --region "$AWS_REGION" \
              --secret-id "$SECRET_ARN" \
              --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production Key=Service,Value=Domains Key=Authority,Value=aws-canonical-v1
          else
            aws secretsmanager create-secret \
              --region "$AWS_REGION" \
              --name "$CANONICAL_DOMAIN_SECRET_NAME" \
              --description 'Canonical HMAC shared secret for TheOutHaven domain gateway authentication.' \
              --secret-string "file://$SECRET_FILE" \
              --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production Key=Service,Value=Domains Key=Authority,Value=aws-canonical-v1 \
              --query ARN --output text >/dev/null
          fi
          echo 'canonical_domain_secret=bootstrapped_from_live_gateway'

      - name: Remove temporary Lightsail access immediately
        if: always() && steps.state.outputs.needs_bootstrap == 'true'
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name "$BOOTSTRAP_POLICY_NAME" || true
          echo 'temporary_lightsail_policy=removed'

      - name: Verify canonical authority and repair shared app environment
        id: repair
        run: |
          set -euo pipefail
          AUTHORITY="$(aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" --query SecretString --output text)"
          test "${#AUTHORITY}" -ge 32
          echo "::add-mask::$AUTHORITY"

          META="$RUNNER_TEMP/canonical-domain-meta.json"
          aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$CANONICAL_DOMAIN_SECRET_NAME" > "$META"
          jq -e 'any(.Tags[]?; .Key == "Authority" and .Value == "aws-canonical-v1")' "$META" >/dev/null

          TIMESTAMP="$(date +%s%3N)"
          SIGNATURE="$(TIMESTAMP="$TIMESTAMP" DOMAIN_GATEWAY_SECRET="$AUTHORITY" python - <<'PY'
          import hashlib, hmac, os
          payload = '\n'.join([os.environ['TIMESTAMP'], 'GET', '/v1/status', ''])
          print(hmac.new(os.environ['DOMAIN_GATEWAY_SECRET'].encode(), payload.encode(), hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$SIGNATURE"
          STATUS="$(curl -sS -o "$RUNNER_TEMP/domain-gateway-status.json" -w '%{http_code}' \
            "$DOMAIN_GATEWAY_URL/v1/status" \
            -H "x-toh-timestamp: $TIMESTAMP" \
            -H "x-toh-signature: $SIGNATURE" || true)"
          test "${STATUS:-000}" -ge 200 2>/dev/null && test "$STATUS" -lt 300
          jq -e '.ok == true and .authenticated == true' "$RUNNER_TEMP/domain-gateway-status.json" >/dev/null
          echo 'domain_gateway_authentication=valid'

          CURRENT="$RUNNER_TEMP/current-app-env.json"
          REPAIRED="$RUNNER_TEMP/repaired-app-env.json"
          aws secretsmanager get-secret-value --region "$APP_ENV_SECRET_REGION" --secret-id "$APP_ENV_SECRET_NAME" --query SecretString --output text > "$CURRENT"
          chmod 600 "$CURRENT"
          CURRENT_JSON="$CURRENT" OUTPUT_JSON="$REPAIRED" DOMAIN_GATEWAY_SECRET="$AUTHORITY" DOMAIN_GATEWAY_URL="$DOMAIN_GATEWAY_URL" python - <<'PY'
          import json, os
          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          if not isinstance(current, dict):
              raise SystemExit('Shared app environment is not an object.')
          authority = os.environ['DOMAIN_GATEWAY_SECRET']
          gateway_url = os.environ['DOMAIN_GATEWAY_URL'].rstrip('/')
          changed = current.get('DOMAIN_GATEWAY_SECRET') != authority or current.get('DOMAIN_GATEWAY_URL') != gateway_url
          current['DOMAIN_GATEWAY_URL'] = gateway_url
          current['DOMAIN_GATEWAY_SECRET'] = authority
          with open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8') as fh:
              json.dump(current, fh, separators=(',', ':'))
          print('true' if changed else 'false', end='')
          PY
          CHANGED="$(CURRENT_JSON="$CURRENT" DOMAIN_GATEWAY_SECRET="$AUTHORITY" DOMAIN_GATEWAY_URL="$DOMAIN_GATEWAY_URL" python - <<'PY'
          import json, os
          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          print('true' if current.get('DOMAIN_GATEWAY_SECRET') != os.environ['DOMAIN_GATEWAY_SECRET'] or current.get('DOMAIN_GATEWAY_URL') != os.environ['DOMAIN_GATEWAY_URL'].rstrip('/') else 'false', end='')
          PY
          )"
          chmod 600 "$REPAIRED"
          if [ "$CHANGED" = 'true' ]; then
            aws secretsmanager put-secret-value --region "$APP_ENV_SECRET_REGION" --secret-id "$APP_ENV_SECRET_NAME" --secret-string "file://$REPAIRED" --query VersionId --output text >/dev/null
            echo 'shared_app_environment=repaired'
          else
            echo 'shared_app_environment=already_current'
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Reload background runtime when shared environment changed
        id: runtime
        run: |
          set -euo pipefail
          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN" && test "$BACKGROUND_FN" != 'None'
          echo "function=$BACKGROUND_FN" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.repair.outputs.changed }}" = 'true' ]; then
            aws lambda get-function-configuration --function-name "$BACKGROUND_FN" > "$RUNNER_TEMP/background-config.json"
            jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/original-environment.json"
            jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' "$RUNNER_TEMP/original-environment.json" > "$RUNNER_TEMP/refresh-environment.json"
            aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/refresh-environment.json" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
            aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/original-environment.json" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
            echo 'background_runtime_secret_reload=complete'
          else
            echo 'background_runtime_secret_reload=not_needed'
          fi

      - name: Verify private background runtime
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/background-health-event.json" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"domain-gateway-secret-bootstrap"},"requestContext":{"accountId":"bootstrap","apiId":"bootstrap","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"bootstrap","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"02/Sep/2026:00:00:00 +0000","timeEpoch":1788307200000},"isBase64Encoded":false}
          JSON
          aws lambda invoke \
            --function-name "${{ steps.runtime.outputs.function }}" \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$RUNNER_TEMP/background-health-event.json" \
            "$RUNNER_TEMP/background-health-response.json" >/dev/null
          jq -e '.statusCode == 200 and (.body | fromjson | .ok == true and .runtime == "aws-background" and .database == "ok")' "$RUNNER_TEMP/background-health-response.json" >/dev/null
          echo 'background_runtime_health=valid'

      - name: Cleanup temporary files and policy
        if: always()
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
        run: |
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name "$BOOTSTRAP_POLICY_NAME" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/domain-secret-meta.json" \
            "$RUNNER_TEMP/domain-gateway-lightsail-bootstrap-policy.json" \
            "$RUNNER_TEMP/domain-gateway-lightsail-access.json" \
            "$RUNNER_TEMP/domain-gateway-lightsail-key" \
            "$RUNNER_TEMP/domain-gateway-lightsail-key-cert.pub" \
            "$RUNNER_TEMP/domain-gateway-known-hosts" \
            "$RUNNER_TEMP/domain-gateway-live-secret" \
            "$RUNNER_TEMP/canonical-domain-meta.json" \
            "$RUNNER_TEMP/domain-gateway-status.json" \
            "$RUNNER_TEMP/current-app-env.json" \
            "$RUNNER_TEMP/repaired-app-env.json" \
            "$RUNNER_TEMP/background-config.json" \
            "$RUNNER_TEMP/original-environment.json" \
            "$RUNNER_TEMP/refresh-environment.json" \
            "$RUNNER_TEMP/background-health-event.json" \
            "$RUNNER_TEMP/background-health-response.json"
