name: One-shot Location Intelligence observability typecheck

on:
  push:
    branches: [feat/location-intelligence-observability]
    paths:
      - '.github/workflows/one-shot-location-intelligence-observability-typecheck.yml'

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/location-intelligence-observability
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Remove one-shot runner
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-location-intelligence-observability-typecheck.yml
          git config user.name 'roseoutllc'
          git config user.email 'nick@roseout.com'
          git add .github/workflows/one-shot-location-intelligence-observability-typecheck.yml
          git commit -m 'chore: remove focused Location Intelligence typecheck runner'
          git push origin HEAD:feat/location-intelligence-observability
