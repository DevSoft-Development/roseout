name: POS Remote Assist security regressions
on:
  pull_request:
    paths:
      - 'lib/pos/remote-assist/**'
      - 'scripts/pos-remote-assist-*.mjs'
      - '.github/workflows/pos-remote-assist-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install test-only transpiler
        run: npm install --no-save --ignore-scripts --package-lock=false esbuild
      - name: Run remote assist regressions
        run: |
          node scripts/pos-remote-assist-policy-regression.mjs
          node scripts/pos-remote-assist-session-regression.mjs
          node scripts/pos-remote-assist-relay-regression.mjs
          node scripts/pos-remote-assist-revocation-regression.mjs
          node scripts/pos-remote-assist-supervisor-regression.mjs
