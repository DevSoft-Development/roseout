name: AWS Reserve DNS cutover

on:
  pull_request:
    paths:
      - '.github/workflows/aws-reserve-dns-cutover.yml'
      - 'scripts/reserve-dns-cutover-regression.mjs'
      - 'infra/aws/reserve-dns-cutover-request.json'
  push:
    branches: [main]
    paths:
      - 'infra/aws/reserve-dns-cutover-request.json'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Plan, cut over Reserve traffic, or restore the last saved DNS snapshot'
        required: true
        type: choice
        options: [plan, cutover, rollback]
        default: plan
      confirmation:
        description: 'Cutover: CUTOVER_RESERVE. Rollback: ROLLBACK_RESERVE. Leave blank for plan.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-reserve-dns-cutover-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DOMAIN_NAME: theouthaven.com
  RESERVE_HOST: reserve.theouthaven.com
  FOUNDATION_STACK: theouthaven-reserve-web-foundation-production
  SNAPSHOT_SECRET: theouthaven/production/reserve-web/dns-cutover-last-snapshot

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/reserve-dns-cutover-regression.mjs

  execute:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve requested operation
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OPERATION: ${{ steps.request.outputs.operation }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            OPERATION="$(jq -r '.operation' infra/aws/reserve-dns-cutover-request.json)"
            CONFIRMATION="$(jq -r '.confirmation' infra/aws/reserve-dns-cutover-request.json)"
          else
            OPERATION="$INPUT_OPERATION"
            CONFIRMATION="$INPUT_CONFIRMATION"
          fi
          case "$OPERATION" in
            plan) test -z "$CONFIRMATION" ;;
            cutover) test "$CONFIRMATION" = 'CUTOVER_RESERVE' ;;
            rollback) test "$CONFIRMATION" = 'ROLLBACK_RESERVE' ;;
            *) exit 2 ;;
          esac
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment role
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Route 53 zone and Reserve ALB
        id: target
        run: |
          set -euo pipefail
          aws route53 list-hosted-zones > "$RUNNER_TEMP/zones.json"
          HOSTED_ZONE_ID="$(jq -r --arg name "${DOMAIN_NAME}." '[.HostedZones[] | select(.Name==$name and .Config.PrivateZone==false)][0].Id // empty' "$RUNNER_TEMP/zones.json" | sed 's#^/hostedzone/##')"
          test -n "$HOSTED_ZONE_ID"

          ALB_DNS="$(aws cloudformation describe-stacks --stack-name "$FOUNDATION_STACK" --query "Stacks[0].Outputs[?OutputKey=='ReserveLoadBalancerDnsName'].OutputValue | [0]" --output text)"
          test -n "$ALB_DNS" && test "$ALB_DNS" != None

          aws elbv2 describe-load-balancers > "$RUNNER_TEMP/albs.json"
          ALB_ZONE_ID="$(jq -r --arg dns "$ALB_DNS" '[.LoadBalancers[] | select(.DNSName==$dns)][0].CanonicalHostedZoneId // empty' "$RUNNER_TEMP/albs.json")"
          test -n "$ALB_ZONE_ID"

          echo "hosted_zone_id=$HOSTED_ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "alb_zone_id=$ALB_ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Verify Reserve origin before DNS changes
        if: steps.request.outputs.operation != 'rollback'
        env:
          ALB_DNS: ${{ steps.target.outputs.alb_dns }}
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 --connect-to "${RESERVE_HOST}:443:${ALB_DNS}:443" "https://${RESERVE_HOST}/api/health/platform-dr")"
          printf '%s' "$BODY" | jq -e '.ok == true and .service == "reserve-web" and .provider == "aws-reserve"' >/dev/null

      - name: Capture current Reserve DNS
        if: steps.request.outputs.operation != 'rollback'
        id: snapshot
        env:
          HOSTED_ZONE_ID: ${{ steps.target.outputs.hosted_zone_id }}
        run: |
          set -euo pipefail
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/current.json"
          python - <<'PY'
          import json, os
          host = os.environ['RESERVE_HOST'].rstrip('.') + '.'
          current = json.load(open(os.environ['RUNNER_TEMP'] + '/current.json'))['ResourceRecordSets']
          rows = [r for r in current if r.get('Name') == host and r.get('Type') in {'A','AAAA','CNAME'}]
          for row in rows:
              if row.get('SetIdentifier') or row.get('Failover') or row.get('GeoLocation') or row.get('Region') or row.get('MultiValueAnswer'):
                  raise SystemExit('Refusing policy-based Reserve DNS record')
          raw = json.dumps({'records': rows}, separators=(',', ':'))
          open(os.environ['RUNNER_TEMP'] + '/snapshot.json','w').write(raw)
          print(json.dumps({'records': rows}, indent=2))
          PY

      - name: Save rollback snapshot
        if: steps.request.outputs.operation == 'cutover'
        run: |
          set -euo pipefail
          VALUE="$(cat "$RUNNER_TEMP/snapshot.json")"
          if aws secretsmanager describe-secret --secret-id "$SNAPSHOT_SECRET" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value --secret-id "$SNAPSHOT_SECRET" --secret-string "$VALUE" >/dev/null
          else
            aws secretsmanager create-secret --name "$SNAPSHOT_SECRET" --description 'TheOutHaven Reserve DNS pre-cutover rollback snapshot' --secret-string "$VALUE" >/dev/null
          fi

      - name: Show Reserve cutover plan
        if: steps.request.outputs.operation == 'plan'
        env:
          ALB_DNS: ${{ steps.target.outputs.alb_dns }}
        run: |
          echo "Target: $RESERVE_HOST -> $ALB_DNS"
          cat "$RUNNER_TEMP/snapshot.json" | jq .

      - name: Build Route 53 Reserve cutover
        if: steps.request.outputs.operation == 'cutover'
        env:
          ALB_DNS: ${{ steps.target.outputs.alb_dns }}
          ALB_ZONE_ID: ${{ steps.target.outputs.alb_zone_id }}
        run: |
          python - <<'PY'
          import json, os
          snap=json.load(open(os.environ['RUNNER_TEMP']+'/snapshot.json'))
          changes=[{'Action':'DELETE','ResourceRecordSet':r} for r in snap['records']]
          changes.append({'Action':'CREATE','ResourceRecordSet':{
            'Name':os.environ['RESERVE_HOST'],
            'Type':'A',
            'AliasTarget':{
              'HostedZoneId':os.environ['ALB_ZONE_ID'],
              'DNSName':os.environ['ALB_DNS'],
              'EvaluateTargetHealth':True
            }
          }})
          json.dump({'Comment':'TheOutHaven Reserve AWS cutover','Changes':changes},open(os.environ['RUNNER_TEMP']+'/change.json','w'))
          PY

      - name: Apply Reserve cutover
        if: steps.request.outputs.operation == 'cutover'
        id: apply
        env:
          HOSTED_ZONE_ID: ${{ steps.target.outputs.hosted_zone_id }}
        run: |
          set -euo pipefail
          CHANGE_ID="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch "file://$RUNNER_TEMP/change.json" --query 'ChangeInfo.Id' --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify public Reserve hostname
        if: steps.request.outputs.operation == 'cutover'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            BODY="$(curl --silent --show-error --max-time 20 "https://${RESERVE_HOST}/api/health/platform-dr" || true)"
            if printf '%s' "$BODY" | jq -e '.ok == true and .service == "reserve-web" and .provider == "aws-reserve"' >/dev/null 2>&1; then
              echo "$RESERVE_HOST is publicly serving aws-reserve"
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Automatic rollback after failed cutover validation
        if: failure() && steps.request.outputs.operation == 'cutover' && steps.apply.outputs.changed == 'true'
        env:
          HOSTED_ZONE_ID: ${{ steps.target.outputs.hosted_zone_id }}
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id "$SNAPSHOT_SECRET" --query SecretString --output text > "$RUNNER_TEMP/rollback.json"
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/current-rollback.json"
          python - <<'PY'
          import json, os
          snap=json.load(open(os.environ['RUNNER_TEMP']+'/rollback.json'))
          current=json.load(open(os.environ['RUNNER_TEMP']+'/current-rollback.json'))['ResourceRecordSets']
          host=os.environ['RESERVE_HOST'].rstrip('.')+'.'
          selected=[r for r in current if r.get('Name')==host and r.get('Type') in {'A','AAAA','CNAME'}]
          changes=[{'Action':'DELETE','ResourceRecordSet':r} for r in selected]
          changes += [{'Action':'CREATE','ResourceRecordSet':r} for r in snap['records']]
          json.dump({'Comment':'Automatic Reserve DNS rollback','Changes':changes},open(os.environ['RUNNER_TEMP']+'/rollback-change.json','w'))
          PY
          CHANGE_ID="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch "file://$RUNNER_TEMP/rollback-change.json" --query 'ChangeInfo.Id' --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"

      - name: Restore saved Reserve DNS snapshot
        if: steps.request.outputs.operation == 'rollback'
        env:
          HOSTED_ZONE_ID: ${{ steps.target.outputs.hosted_zone_id }}
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id "$SNAPSHOT_SECRET" --query SecretString --output text > "$RUNNER_TEMP/rollback.json"
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/current-rollback.json"
          python - <<'PY'
          import json, os
          snap=json.load(open(os.environ['RUNNER_TEMP']+'/rollback.json'))
          current=json.load(open(os.environ['RUNNER_TEMP']+'/current-rollback.json'))['ResourceRecordSets']
          host=os.environ['RESERVE_HOST'].rstrip('.')+'.'
          selected=[r for r in current if r.get('Name')==host and r.get('Type') in {'A','AAAA','CNAME'}]
          changes=[{'Action':'DELETE','ResourceRecordSet':r} for r in selected]
          changes += [{'Action':'CREATE','ResourceRecordSet':r} for r in snap['records']]
          json.dump({'Comment':'Operator Reserve DNS rollback','Changes':changes},open(os.environ['RUNNER_TEMP']+'/rollback-change.json','w'))
          PY
          CHANGE_ID="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch "file://$RUNNER_TEMP/rollback-change.json" --query 'ChangeInfo.Id' --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
