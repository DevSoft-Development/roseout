name: AWS platform DR

on:
  pull_request:
    paths:
      - 'app/admin/dashboard/infrastructure/**'
      - 'app/api/admin/platform-dr/**'
      - 'app/api/health/platform-dr/**'
      - 'components/admin/PlatformDrPanel.tsx'
      - 'lib/aws/platform-dr-client.ts'
      - 'lib/__tests__/platform-dr-contract.test.ts'
      - 'infra/aws/platform-dr/**'
      - 'infra/aws/lambda/platform_dr_gateway.py'
      - 'infra/aws/cloudformation/platform-dr-*.yml'
      - 'infra/aws/cloudformation/github-platform-deploy-role.yml'
      - 'next.config.ts'
      - '.github/workflows/aws-platform-dr.yml'
  push:
    branches:
      - main
    paths:
      - 'app/admin/dashboard/infrastructure/**'
      - 'app/api/admin/platform-dr/**'
      - 'app/api/health/platform-dr/**'
      - 'components/admin/PlatformDrPanel.tsx'
      - 'lib/aws/platform-dr-client.ts'
      - 'lib/__tests__/platform-dr-contract.test.ts'
      - 'infra/aws/platform-dr/**'
      - 'infra/aws/lambda/platform_dr_gateway.py'
      - 'infra/aws/cloudformation/platform-dr-*.yml'
      - 'infra/aws/cloudformation/github-platform-deploy-role.yml'
      - 'next.config.ts'
      - '.github/workflows/aws-platform-dr.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy/synchronize the production warm standby
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-platform-dr-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  # PR validation may supersede stale runs, but production DR deploys must finish atomically.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_ACCOUNT_ID: '742020474738'
  COMPUTE_REGION: us-west-2
  EDGE_REGION: us-east-1
  ENVIRONMENT: production
  COMPUTE_STACK: theouthaven-platform-dr-production
  EDGE_STACK: theouthaven-platform-dr-edge-production
  EXTERNAL_MONITOR_STACK: theouthaven-azure-frontdoor-external-monitor-production
  PRIMARY_EXPECTED_ORIGIN: azure-consumer
  DOMAIN_NAME: theouthaven.com
  WWW_DOMAIN_NAME: www.theouthaven.com
  GATEWAY_SECRET_NAME: /theouthaven/production/platform-dr/gateway-hmac
  EDGE_SECRET_NAME: /theouthaven/production/platform-dr/edge-origin
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  AUTHORITATIVE_RUNTIME_SECRET: /theouthaven/production/edge-runtime/env
  AUTHORITATIVE_RUNTIME_SECRET_REGION: us-east-1
  CERT_PARAMETER: /theouthaven/production/platform-dr/acm-certificate-arn
  CREDENTIAL_VAULT_PREFIX: /theouthaven/credential-vault
  CREDENTIAL_VAULT_REGION: us-east-1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate DR gateway syntax
        run: python -m py_compile infra/aws/lambda/platform_dr_gateway.py

      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint

      - name: Lint DR CloudFormation
        run: |
          set -euo pipefail
          cfn-lint infra/aws/cloudformation/platform-dr-compute.yml
          cfn-lint infra/aws/cloudformation/platform-dr-edge.yml
          cfn-lint infra/aws/cloudformation/github-platform-deploy-role.yml

      - name: Validate container definition
        run: docker build --check -f infra/aws/platform-dr/Dockerfile .

      - name: Run focused DR contract tests
        run: |
          set -euo pipefail
          npm ci
          npx vitest run lib/__tests__/platform-dr-contract.test.ts

  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment role
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.COMPUTE_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Bootstrap platform DR deployment permissions
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"

          ROLE_STACK="$(aws cloudformation describe-stack-resources \
            --physical-resource-id "$ROLE_NAME" \
            --query 'StackResources[0].StackName' \
            --output text 2>/dev/null || true)"

          if [ -n "$ROLE_STACK" ] && [ "$ROLE_STACK" != "None" ]; then
            migration_ready=false
            for attempt in $(seq 1 40); do
              STACK_STATUS="$(aws cloudformation describe-stacks \
                --stack-name "$ROLE_STACK" \
                --query 'Stacks[0].StackStatus' \
                --output text 2>/dev/null || true)"
              ATTACHED_COUNT="$(aws iam list-attached-role-policies \
                --role-name "$ROLE_NAME" \
                --query 'length(AttachedPolicies[?starts_with(PolicyName, `TheOutHavenPlatformDeploy`)])' \
                --output text 2>/dev/null || echo 0)"
              if [ "$ATTACHED_COUNT" = 4 ] && { [ "$STACK_STATUS" = "CREATE_COMPLETE" ] || [ "$STACK_STATUS" = "UPDATE_COMPLETE" ] || [ "$STACK_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; }; then
                migration_ready=true
                break
              fi
              echo "Waiting for canonical deploy-role migration before DR bootstrap (status=$STACK_STATUS managed_policies=$ATTACHED_COUNT attempt=$attempt/40)."
              sleep 15
            done
            test "$migration_ready" = true || {
              echo "Canonical deploy-role migration did not become ready; refusing concurrent DR bootstrap." >&2
              exit 1
            }
          fi

          mapfile -t TEMPORARY_POLICIES <<'EOF'
          TheOutHavenPlatformDrBootstrap
          TheOutHavenPlatformDrSelfInspectionBootstrap
          TheOutHavenSesTelemetryBootstrap
          TheOutHavenWorkerRuntimeBootstrap
          TheOutHavenDnsVerificationBootstrap
          TheOutHavenCloudFormationChangeSetsBootstrap
          TheOutHavenSearchMlBootstrap
          TheOutHavenSesProductionAccessBootstrap
          TheOutHavenOpsCodeBuildBootstrap
          TheOutHavenWebsiteRuntimeBootstrap
          TheOutHavenEdgeRuntimeEcrBootstrap
          TheOutHavenWebsiteAcmBootstrap
          TheOutHavenPlatformDrTargetDiagnosticsBootstrap
          TheOutHavenDomainGatewayBootstrap
          TheOutHavenDomainGatewayAuthorityBootstrap
          EOF

          cat > "$RUNNER_TEMP/platform-dr-bootstrap.json" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"PlatformDrTemporaryBootstrap",
                "Effect":"Allow",
                "Action":[
                  "ec2:*",
                  "elasticloadbalancing:*",
                  "ecr:*",
                  "ecs:*",
                  "acm:*",
                  "route53:*",
                  "cloudfront:*",
                  "ssm:GetParameter",
                  "ssm:GetParameters"
                ],
                "Resource":"*"
              }
            ]
          }
          JSON

          # The deployed role can manage its known temporary inline policies,
          # but production currently denies IAM self-inspection for this session.
          # Delete the finite bootstrap policy set idempotently instead of
          # ListRolePolicies/GetRolePolicy, then install only the DR bootstrap.
          for policy in "${TEMPORARY_POLICIES[@]}"; do
            echo "Removing stale temporary inline policy if present: $policy"
            aws iam delete-role-policy \
              --role-name "$ROLE_NAME" \
              --policy-name "$policy" 2>/dev/null || true
          done

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenPlatformDrBootstrap \
            --policy-document "file://$RUNNER_TEMP/platform-dr-bootstrap.json"
          sleep 8

      - name: Resolve persistent DR secrets
        id: secrets
        run: |
          set -euo pipefail
          resolve_secret() {
            local name="$1" file="$2" value
            value="$(aws secretsmanager get-secret-value --region "$COMPUTE_REGION" --secret-id "$name" --query SecretString --output text 2>/dev/null || true)"
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              value="$(openssl rand -hex 32)"
              aws secretsmanager create-secret \
                --region "$COMPUTE_REGION" \
                --name "$name" \
                --description "TheOutHaven platform DR control secret" \
                --secret-string "$value" \
                --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production Key=Service,Value=PlatformDR >/dev/null
            fi
            echo "::add-mask::$value"
            printf '%s' "$value" > "$file"
            chmod 600 "$file"
          }
          resolve_secret "$GATEWAY_SECRET_NAME" "$RUNNER_TEMP/platform-dr-gateway-secret"
          resolve_secret "$EDGE_SECRET_NAME" "$RUNNER_TEMP/platform-dr-edge-secret"
          GATEWAY_SECRET_ARN="$(aws secretsmanager describe-secret --region "$COMPUTE_REGION" --secret-id "$GATEWAY_SECRET_NAME" --query ARN --output text)"
          echo "gateway_secret_arn=$GATEWAY_SECRET_ARN" >> "$GITHUB_OUTPUT"

      - name: Recover an unusable compute stack
        run: |
          set -euo pipefail
          STATUS="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$COMPUTE_STACK" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --region "$COMPUTE_REGION" --stack-name "$COMPUTE_STACK"
            aws cloudformation wait stack-delete-complete --region "$COMPUTE_REGION" --stack-name "$COMPUTE_STACK"
            if aws secretsmanager describe-secret --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" >/dev/null 2>&1; then
              aws secretsmanager delete-secret --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --force-delete-without-recovery >/dev/null
              for attempt in $(seq 1 60); do
                aws secretsmanager describe-secret --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" >/dev/null 2>&1 || break
                test "$attempt" -lt 60 || { echo "Retained app-env secret did not finish deleting." >&2; exit 1; }
                sleep 2
              done
            fi
          fi

      - name: Resolve Azure Front Door primary probe from AWS external monitor
        id: primary
        run: |
          set -euo pipefail
          FRONTDOOR_HOST="$(aws cloudformation describe-stacks --region "$EDGE_REGION" --stack-name "$EXTERNAL_MONITOR_STACK" --query "Stacks[0].Parameters[?ParameterKey=='FrontDoorHost'].ParameterValue | [0]" --output text)"
          test -n "$FRONTDOOR_HOST" && test "$FRONTDOOR_HOST" != "None"
          echo "probe_url=https://${FRONTDOOR_HOST}/api/health/azure" >> "$GITHUB_OUTPUT"
      - name: Deploy Oregon warm-standby foundation
        env:
          GATEWAY_SECRET_ARN: ${{ steps.secrets.outputs.gateway_secret_arn }}
        run: |
          set -euo pipefail
          EDGE_SECRET="$(cat "$RUNNER_TEMP/platform-dr-edge-secret")"
          aws cloudformation deploy \
            --region "$COMPUTE_REGION" \
            --stack-name "$COMPUTE_STACK" \
            --template-file infra/aws/cloudformation/platform-dr-compute.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DrGatewaySecretArn="$GATEWAY_SECRET_ARN" \
              EdgeOriginSharedSecret="$EDGE_SECRET" \
              PrimaryProbeUrl="${{ steps.primary.outputs.probe_url }}" \
              PrimaryExpectedOrigin="$PRIMARY_EXPECTED_ORIGIN" \
            --tags Project=TheOutHaven Environment="$ENVIRONMENT" Service=PlatformDR ManagedBy=CloudFormation

      - name: Read compute outputs
        id: compute
        run: |
          set -euo pipefail
          output() {
            aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$COMPUTE_STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "subnets=$(output SubnetIds)" >> "$GITHUB_OUTPUT"
          echo "task_sg=$(output TaskSecurityGroupId)" >> "$GITHUB_OUTPUT"
          echo "alb_dns=$(output LoadBalancerDnsName)" >> "$GITHUB_OUTPUT"
          echo "target_group=$(output TargetGroupArn)" >> "$GITHUB_OUTPUT"
          echo "ecr_name=$(output EcrRepositoryName)" >> "$GITHUB_OUTPUT"
          echo "ecr_uri=$(output EcrRepositoryUri)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(output EcsClusterName)" >> "$GITHUB_OUTPUT"
          echo "service=$(output EcsServiceName)" >> "$GITHUB_OUTPUT"
          echo "execution_role=$(output TaskExecutionRoleArn)" >> "$GITHUB_OUTPUT"
          echo "task_role=$(output TaskRoleArn)" >> "$GITHUB_OUTPUT"
          echo "log_group=$(output LogGroupName)" >> "$GITHUB_OUTPUT"
          echo "app_env_secret=$(output AppEnvSecretArn)" >> "$GITHUB_OUTPUT"
          echo "gateway_function=$(output PlatformDrGatewayFunctionName)" >> "$GITHUB_OUTPUT"
          echo "gateway_url=$(output PlatformDrGatewayUrl)" >> "$GITHUB_OUTPUT"

      - name: Deploy DR control Lambda code
        env:
          GATEWAY_FUNCTION: ${{ steps.compute.outputs.gateway_function }}
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/platform-dr-gateway"
          ZIP="$RUNNER_TEMP/platform-dr-gateway.zip"
          rm -rf "$BUILD" "$ZIP"
          mkdir -p "$BUILD"
          cp infra/aws/lambda/platform_dr_gateway.py "$BUILD/index.py"
          (cd "$BUILD" && zip -q "$ZIP" index.py)
          aws lambda update-function-code \
            --region "$COMPUTE_REGION" \
            --function-name "$GATEWAY_FUNCTION" \
            --zip-file "fileb://$ZIP" >/dev/null
          aws lambda wait function-updated --region "$COMPUTE_REGION" --function-name "$GATEWAY_FUNCTION"

      - name: Load production runtime environment from AWS authority
        env:
          GATEWAY_URL: ${{ steps.compute.outputs.gateway_url }}
          APP_ENV_SECRET_ARN: ${{ steps.compute.outputs.app_env_secret }}
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_ARN" --query SecretString --output text > "$RUNNER_TEMP/platform-dr-existing-env.json"
          aws secretsmanager get-secret-value --region "$AUTHORITATIVE_RUNTIME_SECRET_REGION" --secret-id "$AUTHORITATIVE_RUNTIME_SECRET" --query SecretString --output text > "$RUNNER_TEMP/platform-dr-authoritative-env.json"
          EXISTING_ENV_JSON="$RUNNER_TEMP/platform-dr-existing-env.json" AUTHORITATIVE_ENV_JSON="$RUNNER_TEMP/platform-dr-authoritative-env.json" ENV_FILE="$RUNNER_TEMP/production-runtime.env" python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['ENV_FILE'])
          existing = json.loads(Path(os.environ['EXISTING_ENV_JSON']).read_text())
          authoritative = json.loads(Path(os.environ['AUTHORITATIVE_ENV_JSON']).read_text())
          if not isinstance(existing, dict): existing = {}
          if not isinstance(authoritative, dict) or not authoritative:
              raise SystemExit('AWS runtime authority is unavailable for DR environment recovery.')
          values = dict(existing)
          values.update({k:v for k,v in authoritative.items() if v is not None and v != ''})
          required = ['NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_ANON_KEY','SUPABASE_SERVICE_ROLE_KEY']
          missing = [k for k in required if not values.get(k)]
          if missing: raise SystemExit('AWS runtime authority is missing required DR values: ' + ', '.join(missing))
          with output.open('w') as handle:
              for key in sorted(values):
                  if values[key] is not None: handle.write(f'{key}={json.dumps(str(values[key]))}\n')
          PY
          GATEWAY_SECRET="$(cat "$RUNNER_TEMP/platform-dr-gateway-secret")"
          echo "::add-mask::$GATEWAY_SECRET"
          ENV_FILE="$RUNNER_TEMP/production-runtime.env" JSON_FILE="$RUNNER_TEMP/platform-dr-app-env.json" BUILD_ENV="$RUNNER_TEMP/platform-dr-build.env" GATEWAY_URL="$GATEWAY_URL" GATEWAY_SECRET="$GATEWAY_SECRET" python3 - <<'PY'
          import json, os, re
          values = {}
          with open(os.environ['ENV_FILE']) as handle:
              for line_number, raw in enumerate(handle, 1):
                  line = raw.rstrip('\n')
                  if not line: continue
                  if '=' not in line: raise SystemExit(f'Malformed environment line {line_number}')
                  key, encoded = line.split('=',1)
                  value = json.loads(encoded)
                  if value is not None: values[key] = str(value)
          values['AWS_PLATFORM_DR_GATEWAY_URL'] = os.environ['GATEWAY_URL']
          values['AWS_PLATFORM_DR_GATEWAY_SECRET'] = os.environ['GATEWAY_SECRET']
          invalid = [k for k in values if not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', k)]
          if invalid: raise SystemExit('Unsupported environment key(s): ' + ', '.join(sorted(invalid)))
          encoded = json.dumps(values,separators=(',',':'))
          if len(encoded.encode()) > 60000: raise SystemExit('Production environment is too large for Secrets Manager.')
          open(os.environ['JSON_FILE'],'w').write(encoded)
          with open(os.environ['BUILD_ENV'],'w') as handle:
              for key in sorted(values): handle.write(f"{key}={json.dumps(values[key])}\n")
          PY
          chmod 600 "$RUNNER_TEMP/platform-dr-app-env.json" "$RUNNER_TEMP/platform-dr-build.env"
      - name: Synchronize AWS runtime environment
        env:
          APP_ENV_SECRET_ARN: ${{ steps.compute.outputs.app_env_secret }}
        run: |
          set -euo pipefail
          aws secretsmanager put-secret-value \
            --region "$COMPUTE_REGION" \
            --secret-id "$APP_ENV_SECRET_ARN" \
            --secret-string "file://$RUNNER_TEMP/platform-dr-app-env.json" >/dev/null

      - name: Build and push immutable standby image
        env:
          ECR_NAME: ${{ steps.compute.outputs.ecr_name }}
          ECR_URI: ${{ steps.compute.outputs.ecr_uri }}
        run: |
          set -euo pipefail
          if aws ecr describe-images --region "$COMPUTE_REGION" --repository-name "$ECR_NAME" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image $GITHUB_SHA already exists in immutable ECR; reusing it."
          else
            aws ecr get-login-password --region "$COMPUTE_REGION" | docker login --username AWS --password-stdin "${ECR_URI%%/*}"
            DOCKER_BUILDKIT=1 docker build \
              --file infra/aws/platform-dr/Dockerfile \
              --secret id=platform_env,src="$RUNNER_TEMP/platform-dr-build.env" \
              --tag "$ECR_URI:$GITHUB_SHA" \
              .
            docker push "$ECR_URI:$GITHUB_SHA"
          fi

      - name: Register exact-SHA Fargate task definition
        id: task
        env:
          ECR_URI: ${{ steps.compute.outputs.ecr_uri }}
          EXECUTION_ROLE: ${{ steps.compute.outputs.execution_role }}
          TASK_ROLE: ${{ steps.compute.outputs.task_role }}
          LOG_GROUP: ${{ steps.compute.outputs.log_group }}
          APP_ENV_SECRET_ARN: ${{ steps.compute.outputs.app_env_secret }}
        run: |
          set -euo pipefail
          APP_ENV_SECRET_ARN="$APP_ENV_SECRET_ARN" \
          ECR_URI="$ECR_URI" \
          GITHUB_SHA="$GITHUB_SHA" \
          EXECUTION_ROLE="$EXECUTION_ROLE" \
          TASK_ROLE="$TASK_ROLE" \
          LOG_GROUP="$LOG_GROUP" \
          COMPUTE_REGION="$COMPUTE_REGION" \
          python - <<'PY'
          import json, os, re
          values = json.load(open(os.environ['RUNNER_TEMP'] + '/platform-dr-app-env.json'))
          secret_arn = os.environ['APP_ENV_SECRET_ARN']
          secrets = [
              {'name': key, 'valueFrom': f'{secret_arn}:{key}::'}
              for key in sorted(values)
              if re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', key)
          ]
          task = {
              'family': 'toh-production-platform-dr',
              'networkMode': 'awsvpc',
              'requiresCompatibilities': ['FARGATE'],
              'cpu': '1024',
              'memory': '2048',
              'executionRoleArn': os.environ['EXECUTION_ROLE'],
              'taskRoleArn': os.environ['TASK_ROLE'],
              'containerDefinitions': [{
                  'name': 'platform-dr',
                  'image': f"{os.environ['ECR_URI']}:{os.environ['GITHUB_SHA']}",
                  'essential': True,
                  'portMappings': [{'containerPort': 3000, 'protocol': 'tcp'}],
                  'environment': [
                      {'name': 'PLATFORM_RUNTIME_PROVIDER', 'value': 'aws-dr'},
                      {'name': 'PLATFORM_RUNTIME_GIT_SHA', 'value': os.environ['GITHUB_SHA']},
                  ],
                  'secrets': secrets,
                  'logConfiguration': {
                      'logDriver': 'awslogs',
                      'options': {
                          'awslogs-group': os.environ['LOG_GROUP'],
                          'awslogs-region': os.environ['COMPUTE_REGION'],
                          'awslogs-stream-prefix': 'platform-dr',
                      },
                  },
              }],
          }
          json.dump(task, open(os.environ['RUNNER_TEMP'] + '/platform-dr-task.json', 'w'))
          PY
          TASK_ARN="$(aws ecs register-task-definition --region "$COMPUTE_REGION" --cli-input-json "file://$RUNNER_TEMP/platform-dr-task.json" --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Create or update two-task warm standby
        env:
          CLUSTER: ${{ steps.compute.outputs.cluster }}
          SERVICE: ${{ steps.compute.outputs.service }}
          SUBNETS: ${{ steps.compute.outputs.subnets }}
          TASK_SG: ${{ steps.compute.outputs.task_sg }}
          TARGET_GROUP: ${{ steps.compute.outputs.target_group }}
          TASK_ARN: ${{ steps.task.outputs.task_arn }}
        run: |
          set -euo pipefail
          jq -n --arg subnets "$SUBNETS" --arg sg "$TASK_SG" '{awsvpcConfiguration:{subnets:($subnets|split(",")),securityGroups:[$sg],assignPublicIp:"ENABLED"}}' > "$RUNNER_TEMP/network.json"
          jq -n --arg tg "$TARGET_GROUP" '[{targetGroupArn:$tg,containerName:"platform-dr",containerPort:3000}]' > "$RUNNER_TEMP/load-balancers.json"
          STATUS="$(aws ecs describe-services --region "$COMPUTE_REGION" --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].status' --output text 2>/dev/null || true)"
          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs update-service \
              --region "$COMPUTE_REGION" \
              --cluster "$CLUSTER" \
              --service "$SERVICE" \
              --task-definition "$TASK_ARN" \
              --desired-count 2 \
              --force-new-deployment \
              --deployment-configuration 'deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100' >/dev/null
          else
            aws ecs create-service \
              --region "$COMPUTE_REGION" \
              --cluster "$CLUSTER" \
              --service-name "$SERVICE" \
              --task-definition "$TASK_ARN" \
              --desired-count 2 \
              --launch-type FARGATE \
              --network-configuration "file://$RUNNER_TEMP/network.json" \
              --load-balancers "file://$RUNNER_TEMP/load-balancers.json" \
              --health-check-grace-period-seconds 120 \
              --deployment-configuration 'deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100' \
              --enable-ecs-managed-tags >/dev/null
          fi
          aws ecs wait services-stable --region "$COMPUTE_REGION" --cluster "$CLUSTER" --services "$SERVICE"
          aws ecs describe-services --region "$COMPUTE_REGION" --cluster "$CLUSTER" --services "$SERVICE" > "$RUNNER_TEMP/service.json"
          jq -e '.services[0].desiredCount==2 and .services[0].runningCount==2 and .services[0].pendingCount==0' "$RUNNER_TEMP/service.json" >/dev/null

      - name: Verify both AWS targets are healthy
        env:
          TARGET_GROUP: ${{ steps.compute.outputs.target_group }}
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 60); do
            aws elbv2 describe-target-health --region "$COMPUTE_REGION" --target-group-arn "$TARGET_GROUP" > "$RUNNER_TEMP/targets.json"
            if [ "$(jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State=="healthy")] | length' "$RUNNER_TEMP/targets.json")" -ge 2 ]; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true || { echo "AWS standby did not reach two healthy targets." >&2; exit 1; }

      - name: Recover an unusable edge stack
        run: |
          set -euo pipefail
          STATUS="$(aws cloudformation describe-stacks --region "$EDGE_REGION" --stack-name "$EDGE_STACK" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --region "$EDGE_REGION" --stack-name "$EDGE_STACK"
            aws cloudformation wait stack-delete-complete --region "$EDGE_REGION" --stack-name "$EDGE_STACK"
          fi

      - name: Deploy global AWS DR edge
        env:
          ALB_DNS: ${{ steps.compute.outputs.alb_dns }}
          GATEWAY_URL: ${{ steps.compute.outputs.gateway_url }}
        run: |
          set -euo pipefail
          EDGE_SECRET="$(cat "$RUNNER_TEMP/platform-dr-edge-secret")"
          GATEWAY_HOST="$(GATEWAY_URL="$GATEWAY_URL" python - <<'PY'
          import os
          from urllib.parse import urlparse
          print(urlparse(os.environ['GATEWAY_URL']).hostname or '')
          PY
          )"
          test -n "$GATEWAY_HOST"
          CERT_ARN="$(aws ssm get-parameter --region "$EDGE_REGION" --name "$CERT_PARAMETER" --query Parameter.Value --output text)"
          test -n "$CERT_ARN" && test "$CERT_ARN" != "None"
          aws acm describe-certificate --region "$EDGE_REGION" --certificate-arn "$CERT_ARN" > "$RUNNER_TEMP/platform-dr-cert.json"
          jq -e --arg domain "$DOMAIN_NAME" '
            .Certificate.Status=="ISSUED" and
            .Certificate.DomainName==$domain and
            ([.Certificate.SubjectAlternativeNames[] | select(.==("*."+$domain))] | length)==1
          ' "$RUNNER_TEMP/platform-dr-cert.json" >/dev/null
          aws cloudformation deploy \
            --region "$EDGE_REGION" \
            --stack-name "$EDGE_STACK" \
            --template-file infra/aws/cloudformation/platform-dr-edge.yml \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DomainName="$DOMAIN_NAME" \
              WwwDomainName="$WWW_DOMAIN_NAME" \
              PlatformDrCertificateArn="$CERT_ARN" \
              DrAlbDomainName="$ALB_DNS" \
              EdgeOriginSharedSecret="$EDGE_SECRET" \
            --tags Project=TheOutHaven Environment="$ENVIRONMENT" Service=PlatformDR ManagedBy=CloudFormation

      - name: Read edge outputs and connect standby probe
        id: edge
        env:
          GATEWAY_FUNCTION: ${{ steps.compute.outputs.gateway_function }}
        run: |
          set -euo pipefail
          edge_output() {
            aws cloudformation describe-stacks --region "$EDGE_REGION" --stack-name "$EDGE_STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          CF_DOMAIN="$(edge_output PlatformDrDistributionDomainName)"
          CF_ID="$(edge_output PlatformDrDistributionId)"
          test -n "$CF_DOMAIN" && test "$CF_DOMAIN" != "None"
          aws lambda get-function-configuration --region "$COMPUTE_REGION" --function-name "$GATEWAY_FUNCTION" --query Environment.Variables --output json > "$RUNNER_TEMP/gateway-env.json"
          jq --arg standby "https://${CF_DOMAIN}/api/health/platform-dr" '{Variables:(. + {STANDBY_PROBE_URL:$standby})}' "$RUNNER_TEMP/gateway-env.json" > "$RUNNER_TEMP/gateway-env-update.json"
          aws lambda update-function-configuration --region "$COMPUTE_REGION" --function-name "$GATEWAY_FUNCTION" --environment "file://$RUNNER_TEMP/gateway-env-update.json" >/dev/null
          aws lambda wait function-updated --region "$COMPUTE_REGION" --function-name "$GATEWAY_FUNCTION"
          echo "cf_domain=$CF_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "cf_id=$CF_ID" >> "$GITHUB_OUTPUT"

      - name: Prove AWS standby is serving this exact commit
        env:
          CF_DOMAIN: ${{ steps.edge.outputs.cf_domain }}
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header "$RUNNER_TEMP/aws-health-headers" "https://${CF_DOMAIN}/api/health/platform-dr" -o "$RUNNER_TEMP/aws-health.json"
          grep -qi '^x-toh-platform-origin: aws-dr' "$RUNNER_TEMP/aws-health-headers"
          jq -e --arg sha "$GITHUB_SHA" '.ok==true and .provider=="aws-dr" and .revision==$sha' "$RUNNER_TEMP/aws-health.json" >/dev/null
          for path in / /admin/login /locations/dashboard; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://${CF_DOMAIN}${path}")"
            test "$status" -ge 200 && test "$status" -lt 500 || { echo "AWS standby surface $path returned HTTP $status" >&2; exit 1; }
          done

      - name: Final readiness verification without forcing failover
        env:
          GATEWAY_URL: ${{ steps.compute.outputs.gateway_url }}
        run: |
          set -euo pipefail
          TIMESTAMP="$(date +%s%3N)"
          GATEWAY_SECRET="$(cat "$RUNNER_TEMP/platform-dr-gateway-secret")"
          SIGNATURE="$(TIMESTAMP="$TIMESTAMP" GATEWAY_SECRET="$GATEWAY_SECRET" python3 - <<'PY'
          import hashlib,hmac,os
          payload='\n'.join([os.environ['TIMESTAMP'],'GET','/v1/status',''])
          print(hmac.new(os.environ['GATEWAY_SECRET'].encode(),payload.encode(),hashlib.sha256).hexdigest())
          PY
          )"
          curl --fail --silent --show-error -H "x-toh-timestamp: $TIMESTAMP" -H "x-toh-signature: $SIGNATURE" "${GATEWAY_URL%/}/v1/status" > "$RUNNER_TEMP/platform-dr-status.json"
          jq '{ok,state:{mode:.state.mode},primary:{healthy:.primary.healthy,origin:.primary.origin},standby:{healthy:.standby.healthy},compute:{desiredTasks:.compute.desiredTasks,runningTasks:.compute.runningTasks,healthyTargets:.compute.healthyTargets},surfaces:[.surfaces[]? | {name:(.name // .surface // .key // "unknown"),primaryHealthy:.primary.healthy,standbyHealthy:.standby.healthy}]}' "$RUNNER_TEMP/platform-dr-status.json" | tee "$RUNNER_TEMP/platform-dr-status-sanitized.json" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '.ok==true and .state.mode=="normal" and .primary.healthy==true and (.primary.origin | startswith("azure-consumer")) and .standby.healthy==true and .compute.desiredTasks==2 and .compute.runningTasks==2 and .compute.healthyTargets>=2 and all(.surfaces[]; .primary.healthy==true and .standby.healthy==true)' "$RUNNER_TEMP/platform-dr-status.json" >/dev/null
          curl --fail --silent --show-error "https://www.theouthaven.com/api/health/azure" > "$RUNNER_TEMP/live-azure-health.json"
          jq '{ok,provider,regionRole,region,revision}' "$RUNNER_TEMP/live-azure-health.json" | tee "$RUNNER_TEMP/live-azure-health-sanitized.json" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '.ok==true and (.provider | startswith("azure-consumer")) and (.regionRole=="primary" or .regionRole=="secondary")' "$RUNNER_TEMP/live-azure-health.json" >/dev/null
          {
            echo '### TheOutHaven platform DR ready'
            echo ''
            echo '- Azure Front Door primary: healthy.'
            echo "- AWS Oregon warm standby revision: \`$GITHUB_SHA\`"
            echo '- ECS Fargate: 2/2 tasks healthy.'
            echo '- Consumer DNS: Azure Front Door PRIMARY + AWS DR SECONDARY.'
            echo '- Public, admin, and location dashboard standby probes: passed.'
            echo '- Live failover override: normal/off.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show DR CloudFormation failure events
        if: failure()
        run: |
          aws cloudformation describe-stack-events --region "$COMPUTE_REGION" --stack-name "$COMPUTE_STACK" --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' --output table || true
          aws cloudformation describe-stack-events --region "$EDGE_REGION" --stack-name "$EDGE_STACK" --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' --output table || true

      - name: Remove temporary platform DR bootstrap permissions
        if: always()
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          aws iam delete-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenPlatformDrBootstrap 2>/dev/null || true
          aws iam delete-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenPlatformDrSelfInspectionBootstrap 2>/dev/null || true