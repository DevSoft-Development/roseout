name: AWS Batch 11 shared key recovery

on:
  pull_request:
    paths:
      - '.github/workflows/aws-batch11-shared-key-recovery.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-batch11-shared-key-recovery.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-batch11-shared-key-recovery-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  EDGE_STACK_NAME: theouthaven-edge-runtime-production
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  VIRGINIA_SUPABASE_REF: ftdsltatyqhtllyyefzp
  VIRGINIA_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_ORG_ID: team_TzlwC4vdLZiT8kFGuXSoj1em

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed recovery contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-batch11-shared-key-recovery.yml'
          grep -F 'secrets.SUPABASE_ACCESS_TOKEN' "$FILE" >/dev/null
          grep -F 'api-keys?reveal=true' "$FILE" >/dev/null
          grep -F '.name=="service_role"' "$FILE" >/dev/null
          grep -F 'SUPABASE_SERVICE_ROLE_KEY production --force --sensitive' "$FILE" >/dev/null
          grep -F '/theouthaven/production/platform-dr/app-env' "$FILE" >/dev/null
          grep -F 'node:/api/cron/semantic-nightly' "$FILE" >/dev/null
          grep -F 'test "$FAIL_COUNT" = '"'"'0'"'"'' "$FILE" >/dev/null

  recover-and-preflight:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate current Virginia service-role key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
          KEYS_FILE="$RUNNER_TEMP/virginia-api-keys.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${VIRGINIA_SUPABASE_REF}/api-keys?reveal=true" > "$KEYS_FILE"
          service_role="$(jq -r '[.[] | select(.type=="legacy" and .name=="service_role" and (.disabled != true))][0].api_key // empty' "$KEYS_FILE")"
          test -n "$service_role" || { echo 'Virginia service-role key unavailable' >&2; exit 1; }
          echo "::add-mask::$service_role"
          printf '%s' "$service_role" > "$RUNNER_TEMP/virginia-service-role"
          chmod 600 "$RUNNER_TEMP/virginia-service-role"
          rm -f "$KEYS_FILE"

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $service_role" \
            --header "Authorization: Bearer $service_role" \
            "${VIRGINIA_SUPABASE_URL}/rest/v1/cron_jobs?select=job_key&limit=1")"
          test "$status" = '200' || { echo "Virginia service-role validation failed: HTTP $status" >&2; exit 1; }
          echo 'virginia_service_role_valid=true'

      - name: Synchronize Vercel production server credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN' >&2; exit 1; }
          mkdir -p .vercel
          jq -n --arg org "$VERCEL_ORG_ID" --arg project "$VERCEL_PROJECT_ID" '{orgId:$org,projectId:$project}' > .vercel/project.json
          npx --yes vercel@59.3.0 env add SUPABASE_SERVICE_ROLE_KEY production --force --sensitive --token "$VERCEL_TOKEN" \
            < "$RUNNER_TEMP/virginia-service-role" >/dev/null
          echo 'vercel_service_role_synchronized=true'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Repair AWS shared app environment
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws secretsmanager get-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --query SecretString \
            --output text > "$RUNNER_TEMP/current-app-env.json"
          chmod 600 "$RUNNER_TEMP/current-app-env.json"

          CURRENT_JSON="$RUNNER_TEMP/current-app-env.json" \
          KEY_FILE="$RUNNER_TEMP/virginia-service-role" \
          OUTPUT_JSON="$RUNNER_TEMP/repaired-app-env.json" \
          VIRGINIA_SUPABASE_URL="$VIRGINIA_SUPABASE_URL" \
          python <<'PY'
          import json
          import os
          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          with open(os.environ['KEY_FILE'], encoding='utf-8') as fh:
              key = fh.read().strip()
          if not isinstance(current, dict) or not key:
              raise SystemExit('Invalid shared app environment recovery input.')
          current['NEXT_PUBLIC_SUPABASE_URL'] = os.environ['VIRGINIA_SUPABASE_URL']
          current['SUPABASE_SERVICE_ROLE_KEY'] = key
          with open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8') as fh:
              json.dump(current, fh, separators=(',', ':'))
          PY
          chmod 600 "$RUNNER_TEMP/repaired-app-env.json"
          aws secretsmanager put-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --secret-string "file://$RUNNER_TEMP/repaired-app-env.json" \
            --query VersionId --output text >/dev/null
          rm -f "$RUNNER_TEMP/current-app-env.json" "$RUNNER_TEMP/repaired-app-env.json"
          echo 'aws_shared_app_env_repaired=true'

      - name: Force private background runtime reload
        run: |
          set -euo pipefail
          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN"
          aws lambda get-function-configuration --function-name "$BACKGROUND_FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/original-environment.json"
          jq --arg token "batch11-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' "$RUNNER_TEMP/original-environment.json" > "$RUNNER_TEMP/refresh-environment.json"
          aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/refresh-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          aws lambda update-function-configuration --function-name "$BACKGROUND_FN" --environment "file://$RUNNER_TEMP/original-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"
          rm -f "$RUNNER_TEMP/background-config.json" "$RUNNER_TEMP/original-environment.json" "$RUNNER_TEMP/refresh-environment.json"

      - name: Collect all Batch 11 functional results
        run: |
          set -euo pipefail
          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$INVOKER_FN"

          jq -nc '{function:"node:/api/health/background-runtime",body:{}}' > "$RUNNER_TEMP/health.json"
          aws lambda invoke --function-name "$INVOKER_FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/health.json" "$RUNNER_TEMP/health-response.json" >/dev/null
          jq -e '.ok == true and .runtime == "node" and .status == 200 and .response.ok == true and .response.runtime == "aws-background"' "$RUNNER_TEMP/health-response.json" >/dev/null

          FAILURES="$RUNNER_TEMP/failures.txt"
          PASSES="$RUNNER_TEMP/passes.txt"
          : > "$FAILURES"
          : > "$PASSES"

          while IFS= read -r NAME; do
            ITEM="$(jq -c --arg name "$NAME" '.[] | select(.name == $name)' infra/aws/edge-runtime/schedules.json)"
            test -n "$ITEM"
            FUNCTION="$(jq -r '.function' <<<"$ITEM")"
            if [ "$NAME" = 'semantic-nightly' ]; then
              FUNCTION='node:/api/cron/semantic-nightly'
            fi
            jq -nc --arg fn "$FUNCTION" '{function:$fn,body:{}}' > "$RUNNER_TEMP/probe.json"

            aws lambda invoke --function-name "$INVOKER_FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/probe.json" "$RUNNER_TEMP/response.json" >/dev/null || true
            if jq -e '.ok == true and (.status // 200) < 400 and (.response.success // true) != false and (.response.ok // true) != false' "$RUNNER_TEMP/response.json" >/dev/null 2>&1; then
              echo "$NAME" | tee -a "$PASSES"
            else
              echo "$NAME" | tee -a "$FAILURES"
              jq -c --arg name "$NAME" '{name:$name,ok,runtime,status,errorType,errorMessage,response:(if (.response|type)=="object" then {success:.response.success,ok:.response.ok,error:.response.error,reason:.response.reason,degraded:.response.degraded,embedding_failures:.response.embedding_failures} else {type:(.response|type)} end)}' "$RUNNER_TEMP/response.json" || true
            fi
          done < <(jq -r '.probe[]' infra/aws/edge-runtime/activation.json)

          PASS_COUNT="$(wc -l < "$PASSES" | tr -d ' ')"
          FAIL_COUNT="$(wc -l < "$FAILURES" | tr -d ' ')"
          echo "batch11_passed=${PASS_COUNT}"
          echo "batch11_failed=${FAIL_COUNT}"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo 'batch11_failing_jobs:'
            cat "$FAILURES"
          fi
          test "$FAIL_COUNT" = '0'

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/virginia-service-role "$RUNNER_TEMP"/virginia-api-keys.json "$RUNNER_TEMP"/health.json "$RUNNER_TEMP"/health-response.json "$RUNNER_TEMP"/probe.json "$RUNNER_TEMP"/response.json "$RUNNER_TEMP"/failures.txt "$RUNNER_TEMP"/passes.txt
