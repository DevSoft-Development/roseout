name: One-time patch platform DR key authority

on:
  push:
    branches:
      - ops/fix-platform-dr-virginia-key-authority
    paths:
      - 'scripts/patch-platform-dr-key-authority.py'
      - '.github/workflows/one-time-patch-platform-dr-key-authority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/fix-platform-dr-virginia-key-authority
      - name: Apply exact workflow patch
        run: python scripts/patch-platform-dr-key-authority.py
      - name: Stage patched workflow as a regular repository file
        run: |
          set -euo pipefail
          mkdir -p tmp
          cp .github/workflows/aws-platform-dr.yml tmp/aws-platform-dr.patched.yml
          git checkout -- .github/workflows/aws-platform-dr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/aws-platform-dr.patched.yml
          git commit -m 'Stage patched platform DR workflow blob'
          git push origin HEAD:ops/fix-platform-dr-virginia-key-authority
