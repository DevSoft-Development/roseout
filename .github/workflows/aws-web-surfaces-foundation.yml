name: AWS web surfaces foundation

on:
  pull_request:
    paths:
      - 'infra/aws/cloudformation/web-surfaces-foundation.yml'
      - 'scripts/web-surfaces-foundation-regression.mjs'
      - '.github/workflows/aws-web-surfaces-foundation.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/aws/cloudformation/web-surfaces-foundation.yml'
      - 'scripts/web-surfaces-foundation-regression.mjs'
      - '.github/workflows/aws-web-surfaces-foundation.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: production
        options:
          - staging
          - production
      deploy:
        description: Deploy foundation after validation
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-web-surfaces-foundation-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  TEMPLATE_FILE: infra/aws/cloudformation/web-surfaces-foundation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web-surface contracts
        run: node scripts/web-surfaces-foundation-regression.mjs

      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint

      - name: Lint web-surface CloudFormation
        run: cfn-lint "$TEMPLATE_FILE"

  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment configuration
        id: config
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          TARGET_ENV="${INPUT_ENV:-production}"
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || { echo "Wrong AWS account: $ACCOUNT" >&2; exit 1; }

      - name: Repair web-surface bootstrap permissions
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          POLICY_FILE="$RUNNER_TEMP/web-surfaces-bootstrap.json"
          cat > "$POLICY_FILE" <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "WebSurfacesCloudFormationBootstrap",
                "Effect": "Allow",
                "Action": [
                  "cloudformation:CreateStack",
                  "cloudformation:UpdateStack",
                  "cloudformation:DeleteStack",
                  "cloudformation:CreateChangeSet",
                  "cloudformation:DescribeChangeSet",
                  "cloudformation:ExecuteChangeSet",
                  "cloudformation:DeleteChangeSet",
                  "cloudformation:DescribeStacks",
                  "cloudformation:DescribeStackEvents",
                  "cloudformation:DescribeStackResources",
                  "cloudformation:GetTemplate",
                  "cloudformation:GetTemplateSummary",
                  "cloudformation:ListStackResources",
                  "cloudformation:ValidateTemplate"
                ],
                "Resource": "*"
              },
              {
                "Sid": "WebSurfacesInfrastructureBootstrap",
                "Effect": "Allow",
                "Action": [
                  "ec2:CreateVpc",
                  "ec2:DeleteVpc",
                  "ec2:ModifyVpcAttribute",
                  "ec2:DescribeVpcs",
                  "ec2:CreateInternetGateway",
                  "ec2:DeleteInternetGateway",
                  "ec2:AttachInternetGateway",
                  "ec2:DetachInternetGateway",
                  "ec2:DescribeInternetGateways",
                  "ec2:CreateSubnet",
                  "ec2:DeleteSubnet",
                  "ec2:DescribeSubnets",
                  "ec2:CreateRouteTable",
                  "ec2:DeleteRouteTable",
                  "ec2:DescribeRouteTables",
                  "ec2:AssociateRouteTable",
                  "ec2:DisassociateRouteTable",
                  "ec2:CreateRoute",
                  "ec2:DeleteRoute",
                  "ec2:CreateSecurityGroup",
                  "ec2:DeleteSecurityGroup",
                  "ec2:DescribeSecurityGroups",
                  "ec2:AuthorizeSecurityGroupIngress",
                  "ec2:AuthorizeSecurityGroupEgress",
                  "ec2:RevokeSecurityGroupIngress",
                  "ec2:RevokeSecurityGroupEgress",
                  "ec2:CreateTags",
                  "ec2:DeleteTags",
                  "elasticloadbalancing:CreateLoadBalancer",
                  "elasticloadbalancing:DeleteLoadBalancer",
                  "elasticloadbalancing:DescribeLoadBalancers",
                  "elasticloadbalancing:ModifyLoadBalancerAttributes",
                  "elasticloadbalancing:CreateTargetGroup",
                  "elasticloadbalancing:DeleteTargetGroup",
                  "elasticloadbalancing:DescribeTargetGroups",
                  "elasticloadbalancing:ModifyTargetGroup",
                  "elasticloadbalancing:ModifyTargetGroupAttributes",
                  "elasticloadbalancing:DescribeTargetGroupAttributes",
                  "elasticloadbalancing:DescribeTargetHealth",
                  "elasticloadbalancing:CreateListener",
                  "elasticloadbalancing:DeleteListener",
                  "elasticloadbalancing:DescribeListeners",
                  "elasticloadbalancing:CreateRule",
                  "elasticloadbalancing:DeleteRule",
                  "elasticloadbalancing:DescribeRules",
                  "elasticloadbalancing:AddTags",
                  "elasticloadbalancing:RemoveTags",
                  "ecr:CreateRepository",
                  "ecr:DeleteRepository",
                  "ecr:DescribeRepositories",
                  "ecr:PutLifecyclePolicy",
                  "ecr:GetLifecyclePolicy",
                  "ecr:TagResource",
                  "ecr:UntagResource",
                  "ecr:GetAuthorizationToken",
                  "ecr:BatchCheckLayerAvailability",
                  "ecr:InitiateLayerUpload",
                  "ecr:UploadLayerPart",
                  "ecr:CompleteLayerUpload",
                  "ecr:PutImage",
                  "ecr:BatchGetImage",
                  "ecr:GetDownloadUrlForLayer",
                  "ecr:DescribeImages",
                  "ecr:ListImages",
                  "ecs:CreateCluster",
                  "ecs:DeleteCluster",
                  "ecs:DescribeClusters",
                  "ecs:CreateService",
                  "ecs:UpdateService",
                  "ecs:DeleteService",
                  "ecs:DescribeServices",
                  "ecs:ListServices",
                  "ecs:RegisterTaskDefinition",
                  "ecs:DeregisterTaskDefinition",
                  "ecs:DescribeTaskDefinition",
                  "ecs:ListTaskDefinitions",
                  "ecs:TagResource",
                  "ecs:UntagResource",
                  "logs:CreateLogGroup",
                  "logs:DeleteLogGroup",
                  "logs:DescribeLogGroups",
                  "logs:PutRetentionPolicy",
                  "logs:TagResource",
                  "logs:UntagResource",
                  "secretsmanager:CreateSecret",
                  "secretsmanager:DeleteSecret",
                  "secretsmanager:DescribeSecret",
                  "secretsmanager:GetSecretValue",
                  "secretsmanager:PutSecretValue",
                  "secretsmanager:UpdateSecret",
                  "secretsmanager:TagResource",
                  "secretsmanager:UntagResource",
                  "iam:CreateRole",
                  "iam:DeleteRole",
                  "iam:GetRole",
                  "iam:PassRole",
                  "iam:PutRolePolicy",
                  "iam:GetRolePolicy",
                  "iam:DeleteRolePolicy",
                  "iam:TagRole",
                  "iam:UntagRole"
                ],
                "Resource": "*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenWebSurfacesBootstrap \
            --policy-document "file://$POLICY_FILE"
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenWebSurfacesBootstrap \
            --query PolicyName \
            --output text >/dev/null
          sleep 8

      - name: Deploy Admin and Business foundation
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "theouthaven-web-surfaces-${TARGET_ENV}" \
            --template-file "$TEMPLATE_FILE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$TARGET_ENV" \
              AdminHost="admin.theouthaven.com" \
              BusinessHost="business.theouthaven.com" \
            --tags Project=TheOutHaven Environment="$TARGET_ENV" Service=WebSurfaces ManagedBy=CloudFormation

      - name: Verify foundation outputs
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          STACK="theouthaven-web-surfaces-${TARGET_ENV}"
          aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

      - name: Show CloudFormation failure events
        if: failure()
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "theouthaven-web-surfaces-${TARGET_ENV}" \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' \
            --output table || true
