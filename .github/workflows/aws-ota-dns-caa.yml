name: AWS OTA DNS certificate authority

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/aws/ota-dns-caa.json'
      - '.github/workflows/aws-ota-dns-caa.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/aws/ota-dns-caa.json'
      - '.github/workflows/aws-ota-dns-caa.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ota-dns-caa-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: '742020474738'
  AWS_REGION: us-east-1
  DOMAIN_NAME: theouthaven.com

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OTA CAA policy
        run: |
          set -euo pipefail
          jq -e '
            .host == "theouthaven.com" and
            (.records | type == "array" and length > 0) and
            all(.records[]; .type == "CAA" and (.value | type == "string" and length > 0))
          ' infra/aws/ota-dns-caa.json >/dev/null

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment role
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Bootstrap narrowly scoped Route 53 permissions
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          cat > "$RUNNER_TEMP/ota-dns-caa-policy.json" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"OtaDnsCaa",
                "Effect":"Allow",
                "Action":[
                  "route53:ListHostedZones",
                  "route53:ListResourceRecordSets",
                  "route53:ChangeResourceRecordSets",
                  "route53:GetChange"
                ],
                "Resource":"*"
              }
            ]
          }
          JSON
          aws iam put-role-policy             --role-name "$ROLE_NAME"             --policy-name TheOutHavenOtaDnsCaaBootstrap             --policy-document "file://$RUNNER_TEMP/ota-dns-caa-policy.json"
          sleep 8

      - name: Resolve Route 53 zone
        id: dns
        run: |
          set -euo pipefail
          aws route53 list-hosted-zones > "$RUNNER_TEMP/zones.json"
          HOSTED_ZONE_ID="$(jq -r --arg name "${DOMAIN_NAME}." '[.HostedZones[] | select(.Name==$name and .Config.PrivateZone==false)][0].Id // empty' "$RUNNER_TEMP/zones.json" | sed 's#^/hostedzone/##')"
          test -n "$HOSTED_ZONE_ID"
          echo "hosted_zone_id=$HOSTED_ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Merge OTA CAA authorization
        env:
          HOSTED_ZONE_ID: ${{ steps.dns.outputs.hosted_zone_id }}
        run: |
          set -euo pipefail
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/current.json"
          python - <<'PY'
          import json, os

          desired_doc = json.load(open('infra/aws/ota-dns-caa.json'))
          host = desired_doc['host'].rstrip('.') + '.'
          current = json.load(open(os.environ['RUNNER_TEMP'] + '/current.json'))['ResourceRecordSets']
          rows = [r for r in current if r.get('Name') == host and r.get('Type') == 'CAA']

          if any(r.get('SetIdentifier') or r.get('Failover') or r.get('GeoLocation') or r.get('Region') or r.get('MultiValueAnswer') for r in rows):
              raise SystemExit('Refusing to modify a policy-based OTA CAA record')
          if len(rows) > 1:
              raise SystemExit('Unexpected duplicate simple OTA CAA records')

          existing = rows[0] if rows else None
          values = [entry['Value'] for entry in (existing or {}).get('ResourceRecords', [])]
          for item in desired_doc['records']:
              value = item['value']
              if value not in values:
                  values.append(value)

          record = {
              'Name': host,
              'Type': 'CAA',
              'TTL': int((existing or {}).get('TTL') or 300),
              'ResourceRecords': [{'Value': value} for value in values],
          }
          batch = {
              'Comment': 'Authorize DigiCert for TheOutHaven OTA Azure Front Door managed certificate',
              'Changes': [{'Action': 'UPSERT', 'ResourceRecordSet': record}],
          }
          json.dump(batch, open(os.environ['RUNNER_TEMP'] + '/change.json', 'w'))
          print(json.dumps(record, indent=2))
          PY

      - name: Apply and verify OTA CAA
        env:
          HOSTED_ZONE_ID: ${{ steps.dns.outputs.hosted_zone_id }}
        run: |
          set -euo pipefail
          CHANGE_ID="$(aws route53 change-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID"             --change-batch "file://$RUNNER_TEMP/change.json"             --query 'ChangeInfo.Id' --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"

          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/verified.json"
          CAA_HOST="$(jq -r '.host' infra/aws/ota-dns-caa.json)"
          jq -e --arg host "${CAA_HOST}." '
            any(.ResourceRecordSets[];
              .Name == $host and
              .Type == "CAA" and
              any(.ResourceRecords[]?; .Value == "0 issue \"digicert.com\"")
            )
          ' "$RUNNER_TEMP/verified.json" >/dev/null

          echo "Verified ${CAA_HOST} CAA authorizes digicert.com"

      - name: Remove temporary Route 53 permissions
        if: always()
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          aws iam delete-role-policy             --role-name "$ROLE_NAME"             --policy-name TheOutHavenOtaDnsCaaBootstrap || true
