name: Complete Oregon DR initialization once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oregon-dr-initialization-resume-once.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: oregon-dr-initialization-resume-once
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout continuation commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require first-add continuation only
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          status="$(git diff --name-status "$BEFORE_SHA" "$AFTER_SHA" -- .github/workflows/oregon-dr-initialization-resume-once.yml | awk 'NR==1{print $1}')"
          test "$status" = "A" || {
            echo "This continuation is intentionally runnable only on the first addition of its file." >&2
            exit 1
          }
          echo "one_time_continuation_guard=verified"

      - name: Complete remaining DR lanes sequentially
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            shift
            local before current run_id
            before="$(gh run list --repo "$GH_REPO" --workflow "$workflow" --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)"
            [ -n "$before" ] || before=0

            echo "dispatching=$workflow $*"
            gh workflow run "$workflow" --repo "$GH_REPO" --ref main "$@"

            run_id=''
            for attempt in $(seq 1 60); do
              current="$(gh run list --repo "$GH_REPO" --workflow "$workflow" --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)"
              [ -n "$current" ] || current=0
              if [ "$current" != "0" ] && [ "$current" != "$before" ]; then
                run_id="$current"
                break
              fi
              sleep 2
            done

            test -n "$run_id" || {
              echo "Could not resolve the new workflow_dispatch run for $workflow" >&2
              exit 1
            }

            echo "watching=$workflow run_id=$run_id"
            gh run watch "$run_id" --repo "$GH_REPO" --exit-status --interval 10
          }

          # Recheck only the remaining passive-standby lanes. Public logical replication
          # is already initialized and must not be reseeded by this continuation.
          dispatch_and_wait oregon-dr-auth-sync.yml -f mode=preflight
          dispatch_and_wait oregon-dr-storage-sync.yml -f mode=preflight

          dispatch_and_wait oregon-dr-auth-sync.yml -f mode=sync -f 'confirmation=SYNC OREGON AUTH'
          dispatch_and_wait oregon-dr-storage-sync.yml -f mode=reconcile -f 'confirmation=SYNC OREGON STORAGE'

          # Final passive standby assessment. This does not promote Oregon.
          dispatch_and_wait oregon-dr-readiness.yml -f mode=assess

      - name: Completion summary
        if: success()
        run: |
          {
            echo '### Oregon DR passive standby initialization complete'
            echo ''
            echo '- Public application data remains on the existing Virginia -> Oregon logical subscription.'
            echo '- Auth protected snapshot synchronization completed.'
            echo '- Storage physical-byte reconciliation completed.'
            echo '- Final Oregon DR readiness assessment passed.'
            echo '- No Vercel or AWS runtime target switch was performed.'
            echo '- Virginia remains the writable production primary.'
          } >> "$GITHUB_STEP_SUMMARY"
