name: AWS SES readiness diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/aws-ses-readiness-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: '742020474738'
      EMAIL_IDENTITY: theouthaven.com
      SES_CONFIGURATION_SET: toh-production
      SES_EVENT_DESTINATION: toh-production-provider-events
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Report non-secret SES readiness fields
        run: |
          set -euo pipefail
          ACCOUNT="$RUNNER_TEMP/ses-account.json"
          IDENTITY="$RUNNER_TEMP/ses-identity.json"
          CONFIG="$RUNNER_TEMP/ses-config.json"
          DESTINATIONS="$RUNNER_TEMP/ses-destinations.json"
          aws sesv2 get-account > "$ACCOUNT"
          aws sesv2 get-email-identity --email-identity "$EMAIL_IDENTITY" > "$IDENTITY"
          aws sesv2 get-configuration-set --configuration-set-name "$SES_CONFIGURATION_SET" > "$CONFIG"
          aws sesv2 get-configuration-set-event-destinations --configuration-set-name "$SES_CONFIGURATION_SET" > "$DESTINATIONS"

          echo "account.production_access=$(jq -r '.ProductionAccessEnabled // false' "$ACCOUNT")"
          echo "account.sending_enabled=$(jq -r '.SendingEnabled // false' "$ACCOUNT")"
          echo "identity.verified_for_sending=$(jq -r '.VerifiedForSendingStatus // false' "$IDENTITY")"
          echo "identity.verification_status=$(jq -r '.VerificationStatus // "missing"' "$IDENTITY")"
          echo "identity.dkim_signing_enabled=$(jq -r '.DkimAttributes.SigningEnabled // false' "$IDENTITY")"
          echo "identity.dkim_status=$(jq -r '.DkimAttributes.Status // "missing"' "$IDENTITY")"
          echo "config.sending_enabled=$(jq -r '.SendingOptions.SendingEnabled // false' "$CONFIG")"
          echo "destination.expected_enabled=$(jq -r --arg name "$SES_EVENT_DESTINATION" 'any(.EventDestinations[]?; .Name == $name and .Enabled == true)' "$DESTINATIONS")"
          echo "destination.enabled_names=$(jq -r '[.EventDestinations[]? | select(.Enabled == true) | .Name] | join(",")' "$DESTINATIONS")"

          {
            echo '### SES readiness diagnostic'
            echo ''
            echo "- Production access: \`$(jq -r '.ProductionAccessEnabled // false' "$ACCOUNT")\`"
            echo "- Account sending enabled: \`$(jq -r '.SendingEnabled // false' "$ACCOUNT")\`"
            echo "- Identity verified for sending: \`$(jq -r '.VerifiedForSendingStatus // false' "$IDENTITY")\`"
            echo "- Verification status: \`$(jq -r '.VerificationStatus // "missing"' "$IDENTITY")\`"
            echo "- DKIM signing enabled: \`$(jq -r '.DkimAttributes.SigningEnabled // false' "$IDENTITY")\`"
            echo "- DKIM status: \`$(jq -r '.DkimAttributes.Status // "missing"' "$IDENTITY")\`"
            echo "- Configuration-set sending enabled: \`$(jq -r '.SendingOptions.SendingEnabled // false' "$CONFIG")\`"
            echo "- Expected event destination enabled: \`$(jq -r --arg name "$SES_EVENT_DESTINATION" 'any(.EventDestinations[]?; .Name == $name and .Enabled == true)' "$DESTINATIONS")\`"
            echo "- Enabled event destination names: \`$(jq -r '[.EventDestinations[]? | select(.Enabled == true) | .Name] | join(",")' "$DESTINATIONS")\`"
          } >> "$GITHUB_STEP_SUMMARY"
