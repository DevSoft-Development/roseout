name: AWS platform DR credential reconcile

on:
  pull_request:
    paths:
      - '.github/workflows/aws-platform-dr-credential-reconcile.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aws-platform-dr-credential-reconcile.yml'
  workflow_run:
    workflows:
      - 'AWS platform DR'
    types:
      - completed

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: '742020474738'
  AUTHORITY_REGION: us-east-1
  COMPUTE_REGION: us-west-2
  VIRGINIA_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  AWS_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  DR_STACK_NAME: theouthaven-platform-dr-production

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate credential authority contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-platform-dr-credential-reconcile.yml'
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" "$FILE"
          grep -F '/theouthaven/production/supabase/service-role' "$FILE" >/dev/null
          grep -F '/theouthaven/production/platform-dr/app-env' "$FILE" >/dev/null
          grep -F 'ftdsltatyqhtllyyefzp.supabase.co' "$FILE" >/dev/null
          grep -F 'SUPABASE_SERVICE_ROLE_KEY' "$FILE" >/dev/null
          grep -F 'force-new-deployment' "$FILE" >/dev/null
          grep -F 'BACKGROUND_RUNTIME_REFRESH_TOKEN' "$FILE" >/dev/null

  reconcile:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AUTHORITY_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Reassert Virginia service-role authority
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          KEY="$(aws secretsmanager get-secret-value --region "$AUTHORITY_REGION" --secret-id "$AWS_SERVICE_ROLE_SECRET" --query SecretString --output text)"
          test -n "$KEY" && test "$KEY" != 'None'
          echo "::add-mask::$KEY"

          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/authority-probe.json" --write-out '%{http_code}' \
            --header "apikey: $KEY" \
            --header "Authorization: Bearer $KEY" \
            "${VIRGINIA_SUPABASE_URL}/rest/v1/locations?select=id&limit=1")"
          test "$STATUS" = '200' || { echo 'Authoritative Virginia service-role credential failed validation.' >&2; exit 1; }

          aws secretsmanager get-secret-value \
            --region "$COMPUTE_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --query SecretString \
            --output text > "$RUNNER_TEMP/app-env.json"
          chmod 600 "$RUNNER_TEMP/app-env.json"

          KEY="$KEY" APP_ENV="$RUNNER_TEMP/app-env.json" OUT="$RUNNER_TEMP/app-env-repaired.json" python - <<'PY'
          import json, os
          src = json.load(open(os.environ['APP_ENV'], encoding='utf-8'))
          src['NEXT_PUBLIC_SUPABASE_URL'] = os.environ.get('VIRGINIA_SUPABASE_URL', 'https://ftdsltatyqhtllyyefzp.supabase.co')
          src['SUPABASE_SERVICE_ROLE_KEY'] = os.environ['KEY']
          with open(os.environ['OUT'], 'w', encoding='utf-8') as fh:
              json.dump(src, fh, separators=(',', ':'))
          PY
          chmod 600 "$RUNNER_TEMP/app-env-repaired.json"
          aws secretsmanager put-secret-value \
            --region "$COMPUTE_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --secret-string "file://$RUNNER_TEMP/app-env-repaired.json" >/dev/null

          READBACK="$(aws secretsmanager get-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --query SecretString --output text)"
          READBACK="$READBACK" KEY="$KEY" python - <<'PY'
          import hashlib, json, os
          app = json.loads(os.environ['READBACK'])
          key = os.environ['KEY']
          if app.get('NEXT_PUBLIC_SUPABASE_URL') != 'https://ftdsltatyqhtllyyefzp.supabase.co':
              raise SystemExit('Shared app environment points to the wrong Supabase project.')
          if hashlib.sha256(str(app.get('SUPABASE_SERVICE_ROLE_KEY') or '').encode()).digest() != hashlib.sha256(key.encode()).digest():
              raise SystemExit('Shared app environment does not match the authoritative Virginia key.')
          PY

      - name: Refresh private background runtime
        run: |
          set -euo pipefail
          FN="$(aws cloudformation describe-stacks --region "$AUTHORITY_REGION" --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$FN" && test "$FN" != 'None'
          aws lambda get-function-configuration --region "$AUTHORITY_REGION" --function-name "$FN" --query 'Environment.Variables' --output json > "$RUNNER_TEMP/background-env.json"
          TOKEN="credential-reconcile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TOKEN="$TOKEN" ENV_FILE="$RUNNER_TEMP/background-env.json" OUT="$RUNNER_TEMP/background-env-next.json" python - <<'PY'
          import json, os
          env = json.load(open(os.environ['ENV_FILE'], encoding='utf-8'))
          env['BACKGROUND_RUNTIME_REFRESH_TOKEN'] = os.environ['TOKEN']
          json.dump({'Variables': env}, open(os.environ['OUT'], 'w', encoding='utf-8'), separators=(',', ':'))
          PY
          aws lambda update-function-configuration --region "$AUTHORITY_REGION" --function-name "$FN" --environment "file://$RUNNER_TEMP/background-env-next.json" >/dev/null
          aws lambda wait function-updated --region "$AUTHORITY_REGION" --function-name "$FN"

      - name: Refresh Oregon DR tasks after credential repair
        run: |
          set -euo pipefail
          STATUS="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$DR_STACK_NAME" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [ "$STATUS" = 'CREATE_COMPLETE' ] || [ "$STATUS" = 'UPDATE_COMPLETE' ]; then
            CLUSTER="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$DR_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" --output text)"
            SERVICE="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$DR_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EcsServiceName'].OutputValue" --output text)"
            if [ -n "$CLUSTER" ] && [ "$CLUSTER" != 'None' ] && [ -n "$SERVICE" ] && [ "$SERVICE" != 'None' ]; then
              aws ecs update-service --region "$COMPUTE_REGION" --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment >/dev/null
            fi
          fi

      - name: Verify repaired background runtime against Virginia
        run: |
          set -euo pipefail
          FN="$(aws cloudformation describe-stacks --region "$AUTHORITY_REGION" --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          cat > "$RUNNER_TEMP/health-event.json" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{},"requestContext":{"accountId":"credential-reconcile","apiId":"credential-reconcile","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"credential-reconcile"},"requestId":"credential-reconcile","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"02/Sep/2026:00:00:00 +0000","timeEpoch":0},"isBase64Encoded":false}
          JSON
          aws lambda invoke --region "$AUTHORITY_REGION" --function-name "$FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/health-event.json" "$RUNNER_TEMP/health-response.json" >/dev/null
          jq -e '.statusCode == 200' "$RUNNER_TEMP/health-response.json" >/dev/null
          BODY="$(jq -r '.body' "$RUNNER_TEMP/health-response.json")"
          printf '%s' "$BODY" | jq -e '.ok == true and .runtime == "aws-background" and .database.ok == true' >/dev/null

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/authority-probe.json" "$RUNNER_TEMP/app-env.json" "$RUNNER_TEMP/app-env-repaired.json" "$RUNNER_TEMP/background-env.json" "$RUNNER_TEMP/background-env-next.json" "$RUNNER_TEMP/health-event.json" "$RUNNER_TEMP/health-response.json"
