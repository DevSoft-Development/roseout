name: Platform DR DNS authority staging

on:
  push:
    branches:
      - fix/platform-dr-dns-authority
    paths:
      - '.github/workflows/platform-dr-dns-authority-diagnostic.yml'
      - 'scripts/aws/stage_platform_dr_dns.py'

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: '742020474738'
  EDGE_REGION: us-east-1
  DOMAIN_NAME: theouthaven.com
  WWW_DOMAIN_NAME: www.theouthaven.com
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_PROJECT_NAME: roseout
  CERT_PARAMETER: /theouthaven/production/platform-dr/acm-certificate-arn

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate DNS converter
        run: |
          set -euo pipefail
          python -m py_compile scripts/aws/stage_platform_dr_dns.py
          python scripts/aws/stage_platform_dr_dns.py --self-test

      - name: Resolve deployment role
        id: config
        env:
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.EDGE_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Bootstrap narrow DNS staging permissions
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          cat > "$RUNNER_TEMP/dns-stage-bootstrap.json" <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[{
              "Sid":"PlatformDrDnsStage",
              "Effect":"Allow",
              "Action":[
                "route53:CreateHostedZone",
                "route53:ListHostedZones",
                "route53:ListHostedZonesByName",
                "route53:GetHostedZone",
                "route53:ListResourceRecordSets",
                "route53:ChangeResourceRecordSets",
                "route53:GetChange",
                "acm:RequestCertificate",
                "acm:DescribeCertificate",
                "acm:ListCertificates",
                "acm:AddTagsToCertificate",
                "ssm:GetParameter",
                "ssm:PutParameter"
              ],
              "Resource":"*"
            }]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenPlatformDrDnsStageBootstrap \
            --policy-document "file://$RUNNER_TEMP/dns-stage-bootstrap.json"
          sleep 8

      - name: Fetch current Vercel DNS source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is required." >&2; exit 1; }
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v5/domains/${DOMAIN_NAME}?teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/vercel-domain.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v5/domains/${DOMAIN_NAME}/records?limit=100&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/vercel-records.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/domains/${DOMAIN_NAME}/config?projectIdOrName=${VERCEL_PROJECT_NAME}&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/vercel-apex-config.json"
          jq -e --arg domain "$DOMAIN_NAME" '.domain.verified==true and .domain.name==$domain' "$RUNNER_TEMP/vercel-domain.json" >/dev/null
          jq -e '.records | length>=20' "$RUNNER_TEMP/vercel-records.json" >/dev/null
          jq -e '.recommendedIPv4 | length>=1' "$RUNNER_TEMP/vercel-apex-config.json" >/dev/null

      - name: Ensure existing CAA policy authorizes AWS ACM
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if jq -e '[.records[] | select(.name=="" and .type=="CAA") | .value] | any(test("amazon\\.com|amazontrust\\.com|awstrust\\.com|amazonaws\\.com"))' "$RUNNER_TEMP/vercel-records.json" >/dev/null; then
            echo 'Existing CAA policy already authorizes an Amazon CA.'
          else
            jq -n '{type:"CAA",name:"",value:"0 issue \"amazon.com\"",ttl:60,comment:"Authorize AWS ACM for TheOutHaven platform DR CloudFront certificate"}' > "$RUNNER_TEMP/vercel-amazon-caa.json"
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/vercel-amazon-caa.json" \
              "https://api.vercel.com/v2/domains/${DOMAIN_NAME}/records?teamId=${VERCEL_TEAM_ID}" >/dev/null
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v5/domains/${DOMAIN_NAME}/records?limit=100&teamId=${VERCEL_TEAM_ID}" \
              > "$RUNNER_TEMP/vercel-records.json"
            jq -e '[.records[] | select(.name=="" and .type=="CAA") | .value] | any(test("amazon\\.com"))' "$RUNNER_TEMP/vercel-records.json" >/dev/null
          fi

      - name: Resolve or request CloudFront certificate
        id: certificate
        run: |
          set -euo pipefail
          CERT_ARN="$(aws ssm get-parameter --region "$EDGE_REGION" --name "$CERT_PARAMETER" --query Parameter.Value --output text 2>/dev/null || true)"
          if [ -n "$CERT_ARN" ] && [ "$CERT_ARN" != "None" ]; then
            if ! aws acm describe-certificate --region "$EDGE_REGION" --certificate-arn "$CERT_ARN" > "$RUNNER_TEMP/cert.json" 2>/dev/null; then
              CERT_ARN=""
            elif [ "$(jq -r '.Certificate.Status' "$RUNNER_TEMP/cert.json")" = "FAILED" ]; then
              CERT_ARN=""
            fi
          fi
          if [ -z "$CERT_ARN" ]; then
            TOKEN="TOHPlatformDR${GITHUB_RUN_ID}"
            CERT_ARN="$(aws acm request-certificate \
              --region "$EDGE_REGION" \
              --domain-name "$DOMAIN_NAME" \
              --subject-alternative-names "$WWW_DOMAIN_NAME" \
              --validation-method DNS \
              --idempotency-token "$TOKEN" \
              --options CertificateTransparencyLoggingPreference=ENABLED \
              --tags Key=Project,Value=TheOutHaven Key=Environment,Value=production Key=Service,Value=PlatformDR \
              --query CertificateArn --output text)"
          fi
          test -n "$CERT_ARN" && test "$CERT_ARN" != "None"
          echo "cert_arn=$CERT_ARN" >> "$GITHUB_OUTPUT"

          ready=false
          for _ in $(seq 1 60); do
            aws acm describe-certificate --region "$EDGE_REGION" --certificate-arn "$CERT_ARN" > "$RUNNER_TEMP/cert.json"
            if jq -e '.Certificate.DomainName=="theouthaven.com" and ([.Certificate.DomainValidationOptions[] | select(.ResourceRecord != null)] | length)>=2' "$RUNNER_TEMP/cert.json" >/dev/null; then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true || { echo "ACM validation records were not generated." >&2; exit 1; }
          jq '[.Certificate.DomainValidationOptions[].ResourceRecord | select(. != null)] | unique_by(.Name + "|" + .Type + "|" + .Value)' "$RUNNER_TEMP/cert.json" > "$RUNNER_TEMP/acm-validation-records.json"

      - name: Publish ACM validation records into current Vercel DNS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DOMAIN_NAME="$DOMAIN_NAME" python - <<'PY' > "$RUNNER_TEMP/acm-validation.tsv"
          import json, os
          domain = os.environ['DOMAIN_NAME'].rstrip('.')
          for record in json.load(open(os.environ['RUNNER_TEMP'] + '/acm-validation-records.json')):
              name = record['Name'].rstrip('.')
              suffix = '.' + domain
              if name.endswith(suffix):
                  name = name[:-len(suffix)]
              value = record['Value'].rstrip('.')
              print(f"{name}\t{record['Type']}\t{value}")
          PY
          while IFS=$'\t' read -r name type value; do
            test "$type" = "CNAME" || { echo "Unexpected ACM validation record type: $type" >&2; exit 1; }
            existing="$(jq -r --arg n "$name" '[.records[] | select(.name==$n and .type=="CNAME")][0].value // empty' "$RUNNER_TEMP/vercel-records.json")"
            if [ -n "$existing" ]; then
              test "${existing%.}" = "${value%.}" || { echo "Conflicting existing ACM validation CNAME for $name" >&2; exit 1; }
              continue
            fi
            jq -n --arg name "$name" --arg value "$value" '{type:"CNAME",name:$name,value:$value,ttl:60,comment:"TheOutHaven platform DR ACM renewal validation"}' > "$RUNNER_TEMP/vercel-acm-record.json"
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/vercel-acm-record.json" \
              "https://api.vercel.com/v2/domains/${DOMAIN_NAME}/records?teamId=${VERCEL_TEAM_ID}" >/dev/null
          done < "$RUNNER_TEMP/acm-validation.tsv"

      - name: Wait for ACM certificate issuance
        env:
          CERT_ARN: ${{ steps.certificate.outputs.cert_arn }}
        run: |
          set -euo pipefail
          issued=false
          for _ in $(seq 1 120); do
            aws acm describe-certificate --region "$EDGE_REGION" --certificate-arn "$CERT_ARN" > "$RUNNER_TEMP/cert-status.json"
            status="$(jq -r '.Certificate.Status' "$RUNNER_TEMP/cert-status.json")"
            if [ "$status" = "ISSUED" ]; then issued=true; break; fi
            if [ "$status" = "FAILED" ] || [ "$status" = "REVOKED" ]; then
              jq '{Certificate:{Status:.Certificate.Status,FailureReason:.Certificate.FailureReason,Validation:[.Certificate.DomainValidationOptions[] | {DomainName,ValidationStatus}]}}' "$RUNNER_TEMP/cert-status.json"
              echo "ACM certificate entered $status" >&2
              exit 1
            fi
            sleep 5
          done
          test "$issued" = true || { echo "ACM certificate did not become ISSUED." >&2; exit 1; }
          aws ssm put-parameter \
            --region "$EDGE_REGION" \
            --name "$CERT_PARAMETER" \
            --type String \
            --value "$CERT_ARN" \
            --overwrite >/dev/null

      - name: Keep deploy role able to resolve certificate parameter
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          PARAM_ARN="arn:aws:ssm:${EDGE_REGION}:${AWS_ACCOUNT_ID}:parameter${CERT_PARAMETER}"
          jq -n --arg arn "$PARAM_ARN" '{Version:"2012-10-17",Statement:[{Sid:"PlatformDrCertificateRead",Effect:"Allow",Action:["ssm:GetParameter","ssm:GetParameters"],Resource:$arn}]}' > "$RUNNER_TEMP/cert-read-policy.json"
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenPlatformDrCertificateRead \
            --policy-document "file://$RUNNER_TEMP/cert-read-policy.json"

      - name: Refresh Vercel zone after ACM validation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v5/domains/${DOMAIN_NAME}/records?limit=100&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/vercel-records.json"

      - name: Find or create Route 53 public zone
        id: zone
        run: |
          set -euo pipefail
          aws route53 list-hosted-zones-by-name --dns-name "$DOMAIN_NAME" --max-items 100 > "$RUNNER_TEMP/zones.json"
          COUNT="$(jq --arg name "${DOMAIN_NAME}." '[.HostedZones[] | select(.Name==$name and .Config.PrivateZone==false)] | length' "$RUNNER_TEMP/zones.json")"
          test "$COUNT" -le 1 || { echo "Multiple public Route53 zones exist for $DOMAIN_NAME; refusing ambiguity." >&2; exit 1; }
          if [ "$COUNT" -eq 1 ]; then
            ZONE_ID="$(jq -r --arg name "${DOMAIN_NAME}." '[.HostedZones[] | select(.Name==$name and .Config.PrivateZone==false)][0].Id' "$RUNNER_TEMP/zones.json" | sed 's#^/hostedzone/##')"
          else
            CALLER_REFERENCE="platform-dr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            aws route53 create-hosted-zone \
              --name "$DOMAIN_NAME" \
              --caller-reference "$CALLER_REFERENCE" \
              --hosted-zone-config Comment='TheOutHaven authoritative DNS for platform DR',PrivateZone=false \
              > "$RUNNER_TEMP/create-zone.json"
            ZONE_ID="$(jq -r '.HostedZone.Id' "$RUNNER_TEMP/create-zone.json" | sed 's#^/hostedzone/##')"
          fi
          test -n "$ZONE_ID"
          aws route53 get-hosted-zone --id "$ZONE_ID" > "$RUNNER_TEMP/zone.json"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Exact-sync portable DNS into Route 53
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          aws route53 list-resource-record-sets --hosted-zone-id "$ZONE_ID" > "$RUNNER_TEMP/route53-before.json"
          python scripts/aws/stage_platform_dr_dns.py \
            --vercel-records "$RUNNER_TEMP/vercel-records.json" \
            --apex-config "$RUNNER_TEMP/vercel-apex-config.json" \
            --current-route53 "$RUNNER_TEMP/route53-before.json" \
            --domain "$DOMAIN_NAME" \
            --out-batch "$RUNNER_TEMP/route53-stage-batch.json" \
            --out-expected "$RUNNER_TEMP/route53-expected.json"
          CHANGE_ID="$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --change-batch "file://$RUNNER_TEMP/route53-stage-batch.json" \
            --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
          aws route53 list-resource-record-sets --hosted-zone-id "$ZONE_ID" > "$RUNNER_TEMP/route53-after.json"
          EXPECTED="$RUNNER_TEMP/route53-expected.json" ACTUAL="$RUNNER_TEMP/route53-after.json" python - <<'PY'
          import json, os
          def canon(row):
              return (
                  row['Name'].lower(), row['Type'], int(row.get('TTL') or 0),
                  tuple(sorted(v['Value'] for v in row.get('ResourceRecords') or [])),
              )
          expected = {canon(r) for r in json.load(open(os.environ['EXPECTED']))['ResourceRecordSets']}
          actual = {canon(r) for r in json.load(open(os.environ['ACTUAL']))['ResourceRecordSets'] if r['Type'] not in ('NS','SOA')}
          if expected != actual:
              raise SystemExit(f'Route53 parity mismatch: expected {len(expected)} RRsets, found {len(actual)}')
          print(f'Route53 parity verified: {len(actual)} RRsets')
          PY

      - name: Report delegation checkpoint
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          mapfile -t ROUTE53_NS < <(jq -r '.DelegationSet.NameServers[]' "$RUNNER_TEMP/zone.json" | sort)
          mapfile -t PUBLIC_NS < <(dig +short NS "$DOMAIN_NAME" | sed 's/\.$//' | sort)
          delegated=false
          if [ "${#ROUTE53_NS[@]}" -eq "${#PUBLIC_NS[@]}" ] && diff -u <(printf '%s\n' "${ROUTE53_NS[@]}" | sed 's/\.$//' | sort) <(printf '%s\n' "${PUBLIC_NS[@]}" | sed 's/\.$//' | sort) >/dev/null; then
            delegated=true
          fi
          {
            echo '### TheOutHaven Route53 authority staged'
            echo ''
            echo '- ACM certificate: ISSUED in us-east-1.'
            echo '- Vercel DNS: retained as current public authority.'
            echo '- Route53 zone: exact portable-record parity verified.'
            echo '- Vercel-only apex/wildcard ALIAS records: converted safely for Route53.'
            echo "- Delegated at registrar: $delegated"
            echo ''
            echo '#### Route53 nameservers for GoDaddy'
            for ns in "${ROUTE53_NS[@]}"; do echo "- $ns"; done
            if [ "$delegated" != true ]; then
              echo ''
              echo '> No public DNS cutover was performed. GoDaddy nameserver delegation is still pending.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary DNS staging permissions
        if: always()
        env:
          DEPLOY_ROLE_ARN: ${{ steps.config.outputs.role_arn }}
        run: |
          set -euo pipefail
          ROLE_NAME="${DEPLOY_ROLE_ARN##*/}"
          aws iam delete-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name TheOutHavenPlatformDrDnsStageBootstrap 2>/dev/null || true
