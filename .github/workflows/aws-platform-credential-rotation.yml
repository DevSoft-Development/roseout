name: AWS platform credential rotation scheduler

on:
  pull_request:
    paths:
      - 'infra/aws/lambda/platform_credential_rotation_dispatcher.py'
      - 'infra/aws/cloudformation/platform-credential-rotation.yml'
      - '.github/workflows/aws-platform-credential-rotation.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/lambda/platform_credential_rotation_dispatcher.py'
      - 'infra/aws/cloudformation/platform-credential-rotation.yml'
      - '.github/workflows/aws-platform-credential-rotation.yml'
  workflow_dispatch:
    inputs:
      schedule_expression:
        description: Optional EventBridge Scheduler expression override
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-platform-credential-rotation-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-platform-credential-rotation-production
  DEFAULT_SCHEDULE_EXPRESSION: cron(0 12 1 * ? *)

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dispatcher syntax and contract
        run: |
          set -euo pipefail
          python -m py_compile infra/aws/lambda/platform_credential_rotation_dispatcher.py
          grep -F 'platform-job-gateway-rotate' infra/aws/lambda/platform_credential_rotation_dispatcher.py >/dev/null
          grep -F '/theouthaven/credential-vault/{ENVIRONMENT}/github' infra/aws/lambda/platform_credential_rotation_dispatcher.py >/dev/null
          grep -F 'repos/{GITHUB_REPOSITORY}/dispatches' infra/aws/lambda/platform_credential_rotation_dispatcher.py >/dev/null

      - name: Validate CloudFormation and AWS-only schedule ownership
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infra/aws/cloudformation/platform-credential-rotation.yml
          grep -F 'AWS::Scheduler::Schedule' infra/aws/cloudformation/platform-credential-rotation.yml >/dev/null
          grep -F 'scheduler.amazonaws.com' infra/aws/cloudformation/platform-credential-rotation.yml >/dev/null
          grep -F 'secretsmanager:GetSecretValue' infra/aws/cloudformation/platform-credential-rotation.yml >/dev/null
          grep -F 'platform-job-gateway-rotate' infra/aws/cloudformation/platform-credential-rotation.yml >/dev/null
          ! grep -Eq '^[[:space:]]*schedule:' .github/workflows/aws-platform-credential-rotation.yml

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve deployment parameters
        id: params
        env:
          INPUT_SCHEDULE: ${{ inputs.schedule_expression }}
        run: |
          set -euo pipefail
          SCHEDULE="${INPUT_SCHEDULE:-$DEFAULT_SCHEDULE_EXPRESSION}"
          test -n "$SCHEDULE"
          ALERTS_TOPIC="$(aws cloudformation describe-stacks             --stack-name theouthaven-edge-runtime-production             --query "Stacks[0].Outputs[?OutputKey=='PlatformAlertsTopicArn'].OutputValue"             --output text 2>/dev/null || true)"
          echo "schedule=$SCHEDULE" >> "$GITHUB_OUTPUT"
          echo "alerts_topic=$ALERTS_TOPIC" >> "$GITHUB_OUTPUT"

      - name: Deploy rotation scheduler stack
        run: |
          set -euo pipefail
          aws cloudformation deploy             --stack-name "$STACK_NAME"             --template-file infra/aws/cloudformation/platform-credential-rotation.yml             --capabilities CAPABILITY_NAMED_IAM             --no-fail-on-empty-changeset             --parameter-overrides               Environment=production               GitHubRepository="$GITHUB_REPOSITORY"               RotationScheduleExpression='${{ steps.params.outputs.schedule }}'               PlatformAlertsTopicArn='${{ steps.params.outputs.alerts_topic }}'

      - name: Deploy dispatcher Lambda code
        id: dispatcher
        run: |
          set -euo pipefail
          FUNCTION_NAME="$(aws cloudformation describe-stacks             --stack-name "$STACK_NAME"             --query "Stacks[0].Outputs[?OutputKey=='RotationDispatcherFunctionName'].OutputValue"             --output text)"
          SCHEDULE_NAME="$(aws cloudformation describe-stacks             --stack-name "$STACK_NAME"             --query "Stacks[0].Outputs[?OutputKey=='RotationScheduleName'].OutputValue"             --output text)"
          test -n "$FUNCTION_NAME" && test "$FUNCTION_NAME" != 'None'
          test -n "$SCHEDULE_NAME" && test "$SCHEDULE_NAME" != 'None'

          BUILD="$RUNNER_TEMP/platform-credential-rotation-dispatcher"
          ZIP="$RUNNER_TEMP/platform-credential-rotation-dispatcher.zip"
          rm -rf "$BUILD" "$ZIP"
          mkdir -p "$BUILD"
          cp infra/aws/lambda/platform_credential_rotation_dispatcher.py "$BUILD/index.py"
          (cd "$BUILD" && zip -q "$ZIP" index.py)
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file "fileb://$ZIP" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"

          aws scheduler get-schedule --name "$SCHEDULE_NAME" > "$RUNNER_TEMP/rotation-schedule.json"
          jq -e '.State == "ENABLED" and .Target.Arn != null' "$RUNNER_TEMP/rotation-schedule.json" >/dev/null
          echo "function_name=$FUNCTION_NAME" >> "$GITHUB_OUTPUT"
          echo "schedule_name=$SCHEDULE_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub credential exists without exposing it
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value             --secret-id /theouthaven/credential-vault/production/github             --query SecretString --output text > "$RUNNER_TEMP/github-vault.json"
          jq -e '.token | type == "string" and length > 20' "$RUNNER_TEMP/github-vault.json" >/dev/null
          rm -f "$RUNNER_TEMP/github-vault.json"

      - name: Write deployment summary
        run: |
          {
            echo '### AWS platform credential rotation'
            echo "- Scheduler: ${{ steps.dispatcher.outputs.schedule_name }}"
            echo "- Dispatcher: ${{ steps.dispatcher.outputs.function_name }}"
            echo "- Schedule: ${{ steps.params.outputs.schedule }}"
            echo '- Ownership: AWS EventBridge Scheduler'
            echo '- GitHub cron: none'
            echo '- Dispatch target: platform-job-gateway-rotate'
          } >> "$GITHUB_STEP_SUMMARY"
