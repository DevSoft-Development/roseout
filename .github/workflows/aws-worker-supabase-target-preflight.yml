name: AWS worker Supabase target preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aws-worker-supabase-target.yml'
      - '.github/workflows/aws-worker-supabase-target-preflight.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-worker-supabase-target-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  STACK_NAME: theouthaven-workers-production
  OREGON_SUPABASE_REF: hnhbzynoyrhjndefbwkh
  VIRGINIA_SUPABASE_REF: ftdsltatyqhtllyyefzp

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate both Supabase worker targets without printing keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN" >&2; exit 1; }
          for ref in "$OREGON_SUPABASE_REF" "$VIRGINIA_SUPABASE_REF"; do
            keys="$RUNNER_TEMP/keys-${ref}.json"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true" > "$keys"
            jq -e '[.[] | select(.type=="legacy" and .name=="service_role" and (.disabled != true))] | length == 1' "$keys" >/dev/null
            rm -f "$keys"
          done

          auth="$RUNNER_TEMP/virginia-auth.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${VIRGINIA_SUPABASE_REF}/config/auth" > "$auth"
          jq -e '.external_azure_enabled == true' "$auth" >/dev/null || {
            echo "Virginia Microsoft Auth is not ready for worker cutover." >&2
            exit 1
          }
          rm -f "$auth"
          echo "supabase_worker_targets_ready=true"
          echo "virginia_auth_ready=true"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Validate worker stack is safe to switch
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || { echo "Wrong AWS account: $ACCOUNT" >&2; exit 1; }
          STATUS="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text)"
          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Worker stack is not switch-ready: $STATUS" >&2; exit 1 ;;
          esac
          SUPABASE_URL="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Parameters[?ParameterKey==`SupabaseUrl`].ParameterValue | [0]' --output text)"
          test -n "$SUPABASE_URL" && test "$SUPABASE_URL" != "None" || { echo "Worker stack SupabaseUrl parameter is missing" >&2; exit 1; }
          SECRET_ARN="$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --logical-resource-id SupabaseServiceRoleSecret --query 'StackResources[0].PhysicalResourceId' --output text)"
          test -n "$SECRET_ARN" && test "$SECRET_ARN" != "None" || { echo "Worker service-role secret resource is missing" >&2; exit 1; }
          echo "worker_stack_switch_ready=true"
          echo "No production worker configuration was changed."
