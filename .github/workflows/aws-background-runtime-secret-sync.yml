name: AWS background runtime Supabase secret sync

on:
  pull_request:
    paths:
      - '.github/workflows/aws-background-runtime-secret-sync.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-background-runtime-secret-sync.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-background-runtime-secret-sync-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  EDGE_STACK_NAME: theouthaven-edge-runtime-production
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  APP_ENV_SECRET_REGION: us-west-2
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_ORG_ID: team_TzlwC4vdLZiT8kFGuXSoj1em

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate secret-sync safety contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-background-runtime-secret-sync.yml'
          grep -F 'ftdsltatyqhtllyyefzp.supabase.co' "$FILE" >/dev/null
          grep -F 'SUPABASE_SERVICE_ROLE_KEY' "$FILE" >/dev/null
          grep -F 'NEXT_PUBLIC_SUPABASE_URL' "$FILE" >/dev/null
          grep -F 'VERCEL_ORG_ID' "$FILE" >/dev/null
          grep -F 'put-secret-value' "$FILE" >/dev/null
          grep -F 'BACKGROUND_RUNTIME_REFRESH_TOKEN' "$FILE" >/dev/null
          grep -F 'function-updated-v2' "$FILE" >/dev/null
          grep -F 'location-search-profile-worker' "$FILE" >/dev/null
          grep -F 'search-phase13-maintenance' "$FILE" >/dev/null

  sync-and-probe:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Pull production environment without logging values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN is required.' >&2; exit 1; }
          mkdir -p .vercel
          jq -n --arg org "$VERCEL_TEAM_ID" --arg project "$VERCEL_PROJECT_ID" '{orgId:$org,projectId:$project}' > .vercel/project.json
          ENV_FILE="$RUNNER_TEMP/vercel-production.env"
          npx --yes vercel@59.3.0 env pull "$ENV_FILE" --environment=production --yes --token "$VERCEL_TOKEN" >/dev/null
          test -s "$ENV_FILE"
          chmod 600 "$ENV_FILE"

      - name: Sync only production Supabase credentials into AWS app environment
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          python -m pip install --disable-pip-version-check -q python-dotenv
          aws secretsmanager get-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --query SecretString \
            --output text > "$RUNNER_TEMP/current-app-env.json"
          chmod 600 "$RUNNER_TEMP/current-app-env.json"

          ENV_FILE="$RUNNER_TEMP/vercel-production.env" \
          CURRENT_JSON="$RUNNER_TEMP/current-app-env.json" \
          OUTPUT_JSON="$RUNNER_TEMP/refreshed-app-env.json" \
          python <<'PY'
          import json
          import os
          from urllib.parse import urlparse
          from dotenv import dotenv_values

          env = {k: v for k, v in dotenv_values(os.environ['ENV_FILE']).items() if isinstance(v, str)}
          url = (env.get('NEXT_PUBLIC_SUPABASE_URL') or '').strip()
          key = (env.get('SUPABASE_SERVICE_ROLE_KEY') or '').strip()
          if not url or not key:
              raise SystemExit('Production Vercel environment is missing required Supabase credentials.')
          parsed = urlparse(url)
          if parsed.scheme != 'https' or parsed.hostname != 'ftdsltatyqhtllyyefzp.supabase.co':
              raise SystemExit('Production Supabase URL does not match the Virginia primary; refusing sync.')

          with open(os.environ['CURRENT_JSON'], encoding='utf-8') as fh:
              current = json.load(fh)
          if not isinstance(current, dict):
              raise SystemExit('AWS app environment secret is not a JSON object.')

          current['NEXT_PUBLIC_SUPABASE_URL'] = url
          current['SUPABASE_SERVICE_ROLE_KEY'] = key
          with open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8') as fh:
              json.dump(current, fh, separators=(',', ':'))
          PY
          chmod 600 "$RUNNER_TEMP/refreshed-app-env.json"
          aws secretsmanager put-secret-value \
            --region "$APP_ENV_SECRET_REGION" \
            --secret-id "$APP_ENV_SECRET_NAME" \
            --secret-string "file://$RUNNER_TEMP/refreshed-app-env.json" \
            --query VersionId \
            --output text >/dev/null
          rm -f "$RUNNER_TEMP/current-app-env.json" "$RUNNER_TEMP/refreshed-app-env.json" "$RUNNER_TEMP/vercel-production.env"
          echo 'Supabase credentials synchronized to the existing AWS app environment secret.'

      - name: Force background Lambda to reload the secret and restore exact environment
        run: |
          set -euo pipefail
          BACKGROUND_FN="$(aws cloudformation describe-stacks --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$BACKGROUND_FN"
          aws lambda get-function-configuration --function-name "$BACKGROUND_FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/original-environment.json"
          jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' \
            "$RUNNER_TEMP/original-environment.json" > "$RUNNER_TEMP/refresh-environment.json"

          aws lambda update-function-configuration \
            --function-name "$BACKGROUND_FN" \
            --environment "file://$RUNNER_TEMP/refresh-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"

          aws lambda update-function-configuration \
            --function-name "$BACKGROUND_FN" \
            --environment "file://$RUNNER_TEMP/original-environment.json" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$BACKGROUND_FN"

          rm -f "$RUNNER_TEMP/background-config.json" "$RUNNER_TEMP/original-environment.json" "$RUNNER_TEMP/refresh-environment.json"
          echo "background_function=$BACKGROUND_FN" >> "$GITHUB_ENV"

      - name: Verify private health and both managed cron paths
        run: |
          set -euo pipefail
          HEALTH_EVENT="$RUNNER_TEMP/background-health-event.json"
          cat > "$HEALTH_EVENT" <<'JSON'
          {"version":"2.0","routeKey":"GET /api/health/background-runtime","rawPath":"/api/health/background-runtime","rawQueryString":"","headers":{"x-toh-aws-internal":"secret-sync"},"requestContext":{"accountId":"secret-sync","apiId":"secret-sync","domainName":"internal","domainPrefix":"internal","http":{"method":"GET","path":"/api/health/background-runtime","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"github-actions"},"requestId":"secret-sync","routeKey":"GET /api/health/background-runtime","stage":"$default","time":"01/Sep/2026:00:00:00 +0000","timeEpoch":1788220800000},"isBase64Encoded":false}
          JSON
          aws lambda invoke \
            --function-name "$background_function" \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$HEALTH_EVENT" \
            "$RUNNER_TEMP/background-health-response.json" >/dev/null
          jq -e '.statusCode == 200 and (.body | fromjson | .ok == true and .runtime == "aws-background")' "$RUNNER_TEMP/background-health-response.json" >/dev/null

          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$INVOKER_FN"
          for JOB in location-search-profile-worker search-phase13-maintenance; do
            jq -nc --arg fn "node:/api/cron/managed?job=$JOB" '{function:$fn,body:{}}' > "$RUNNER_TEMP/managed-probe.json"
            passed=0
            for attempt in 1 2 3 4; do
              if aws lambda invoke \
                --function-name "$INVOKER_FN" \
                --cli-binary-format raw-in-base64-out \
                --payload "fileb://$RUNNER_TEMP/managed-probe.json" \
                "$RUNNER_TEMP/managed-response.json" >/dev/null 2>"$RUNNER_TEMP/managed-error.txt"; then
                if jq -e '.ok == true and .runtime == "node" and (.status // 200) < 400 and (.response.ok // true) != false and (.response.success // true) != false' "$RUNNER_TEMP/managed-response.json" >/dev/null; then
                  echo "probe_passed=$JOB"
                  passed=1
                  break
                fi
                jq -c '{errorType,errorMessage,status,response_ok:.response.ok,response_success:.response.success,response_error:.response.error}' "$RUNNER_TEMP/managed-response.json" || true
                break
              fi
              if grep -Eq 'TooManyRequestsException|ConcurrentInvocationLimitExceeded|Throttl' "$RUNNER_TEMP/managed-error.txt"; then
                sleep $((attempt * 3))
                continue
              fi
              break
            done
            test "$passed" = '1'
          done
