name: Verify teen intent pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test teen audience pipeline
        run: npx vitest run lib/search/enterprise/__tests__/intent.test.ts lib/search/enterprise/__tests__/quality-ranking.test.ts lib/ml/__tests__/intent-phase2.test.ts
