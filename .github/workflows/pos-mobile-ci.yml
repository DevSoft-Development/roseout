name: ThePOSHaven mobile CI

on:
  pull_request:
    paths:
      - 'apps/business/app/locations/dashboard/online-ordering/**'
      - 'apps/business/app/api/locations/online-ordering/**'
      - 'apps/business/app/locations/dashboard/CanonicalLocationModuleNav.tsx'
      - 'lib/pos/**'
      - 'app/api/pos/device/**'
      - 'apps/consumer/app/api/pos/device/**'
      - 'app/api/stripe/connect/webhook/route.ts'
      - 'apps/consumer/app/api/stripe/connect/webhook/route.ts'
      - 'supabase/migrations/*pos_device_command_queue.sql'
      - 'infra/supabase/operational-shards/online-ordering-v8.sql'
      - 'scripts/pos-online-order-fulfillment-regression.mjs'
      - 'scripts/pos-signature-plus-regression.mjs'
      - 'pos-mobile/**'
      - '.github/workflows/pos-mobile-ci.yml'
      - 'azure-pipelines-pos-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/business/app/locations/dashboard/online-ordering/**'
      - 'apps/business/app/api/locations/online-ordering/**'
      - 'apps/business/app/locations/dashboard/CanonicalLocationModuleNav.tsx'
      - 'lib/pos/**'
      - 'app/api/pos/device/**'
      - 'apps/consumer/app/api/pos/device/**'
      - 'app/api/stripe/connect/webhook/route.ts'
      - 'apps/consumer/app/api/stripe/connect/webhook/route.ts'
      - 'supabase/migrations/*pos_device_command_queue.sql'
      - 'infra/supabase/operational-shards/online-ordering-v8.sql'
      - 'scripts/pos-online-order-fulfillment-regression.mjs'
      - 'scripts/pos-signature-plus-regression.mjs'
      - 'pos-mobile/**'
      - '.github/workflows/pos-mobile-ci.yml'
      - 'azure-pipelines-pos-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theposhaven-mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect POS validation scope
        id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mobile=true
          backend=true
          if [ "$EVENT_NAME" != workflow_dispatch ] && [ -n "${BASE_SHA:-}" ] && ! printf '%s' "$BASE_SHA" | grep -Eq '^0{40}
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: pos-mobile/package-lock.json

      - name: Install locked dependencies
        if: steps.scope.outputs.mobile == 'true'
        run: npm ci --include=dev --no-audit --no-fund

      - name: Typecheck
        if: steps.scope.outputs.mobile == 'true'
        run: npm run typecheck

      - name: Validate Expo configuration
        if: steps.scope.outputs.mobile == 'true'
        run: npx expo config --type public >/tmp/theposhaven-pos-config.json

      - name: Verify iOS native hardware module
        if: steps.scope.outputs.mobile == 'true'
        run: npm run verify:native:ios

      - name: Verify Android native hardware module
        if: steps.scope.outputs.mobile == 'true'
        run: npm run verify:native:android

      - name: Verify secure cashier device identity
        if: steps.scope.outputs.mobile == 'true'
        run: npm run verify:device-identity

      - name: Verify role-based output routing
        if: steps.scope.outputs.mobile == 'true'
        run: npm run verify:output-routing

      - name: Verify durable offline runtime
        if: steps.scope.outputs.mobile == 'true'
        run: npm run verify:offline-runtime

      - name: Verify online-order fulfillment contract
        if: steps.scope.outputs.backend == 'true'
        working-directory: .
        run: node scripts/pos-online-order-fulfillment-regression.mjs

      - name: Verify Signature+ operations contract
        if: steps.scope.outputs.backend == 'true'
        working-directory: .
        run: node scripts/pos-signature-plus-regression.mjs

      - name: Verify separate app identity and POS-only network permissions
        if: steps.scope.outputs.mobile == 'true'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          if (app?.name !== 'ThePOSHaven') throw new Error('Unexpected app name');
          if (app?.ios?.bundleIdentifier !== 'com.theposhaven.app') throw new Error('Unexpected iOS bundle identifier');
          if (app?.android?.package !== 'com.theposhaven.app') throw new Error('Unexpected Android package');
          if (!app?.ios?.infoPlist?.NSLocalNetworkUsageDescription) throw new Error('iOS local-network usage description missing');
          const bonjour = app?.ios?.infoPlist?.NSBonjourServices || [];
          for (const service of ['_pdl-datastream._tcp', '_printer._tcp', '_ipp._tcp']) {
            if (!bonjour.includes(service)) throw new Error('Missing Bonjour service: ' + service);
          }
          const permissions = app?.android?.permissions || [];
          for (const permission of [
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.ACCESS_WIFI_STATE',
            'android.permission.CHANGE_WIFI_MULTICAST_STATE',
          ]) {
            if (!permissions.includes(permission)) throw new Error('Missing Android permission: ' + permission);
          }
          NODE

      - name: Verify consumer app remains isolated
        if: steps.scope.outputs.mobile == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          grep -F '"bundleIdentifier": "com.theouthaven.app"' mobile/app.json >/dev/null
          grep -F '"package": "com.theouthaven.app"' mobile/app.json >/dev/null
          ! grep -F 'com.theposhaven.app' mobile/app.json >/dev/null
; then
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" || CHANGED=""
            if [ -n "$CHANGED" ]; then
              mobile=false
              backend=false
              if printf '%s\\n' "$CHANGED" | grep -Eq '^(pos-mobile/|azure-pipelines-pos-mobile\\.yml$)'; then mobile=true; fi
              if printf '%s\\n' "$CHANGED" | grep -Eq '^(apps/business/|apps/consumer/app/api/pos/|app/api/(pos/|stripe/connect/webhook/)|lib/pos/|supabase/migrations/.*pos_|infra/supabase/operational-shards/online-ordering-|scripts/pos-)'; then backend=true; fi
              # Workflow changes and unknown paths require both lanes.
              if printf '%s\\n' "$CHANGED" | grep -Eq '^\\.github/workflows/pos-mobile-ci\\.yml
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: pos-mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

