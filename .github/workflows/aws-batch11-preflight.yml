name: AWS Batch 11 collect-all preflight

on:
  pull_request:
    paths:
      - 'app/api/cron/semantic-nightly/**'
      - 'infra/aws/edge-runtime/activation.json'
      - 'infra/aws/edge-runtime/schedules.json'
      - '.github/workflows/aws-batch11-preflight.yml'
  workflow_run:
    workflows: ['AWS background runtime']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-batch11-collect-all-preflight-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  EDGE_STACK_NAME: theouthaven-edge-runtime-production

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Batch 11 preflight contract
        run: |
          set -euo pipefail
          test "$(jq -r '.batch' infra/aws/edge-runtime/activation.json)" = '11'
          test "$(jq '.probe | length' infra/aws/edge-runtime/activation.json)" = '11'
          jq -e '.probe | index("semantic-nightly") != null' infra/aws/edge-runtime/activation.json >/dev/null
          test -f app/api/cron/semantic-nightly/route.ts
          grep -F 'embedding_failures' app/api/cron/semantic-nightly/route.ts >/dev/null
          grep -F 'hardFailures' app/api/cron/semantic-nightly/route.ts >/dev/null

  preflight:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify private Node routing
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          INVOKER_FN="$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" --output text)"
          test -n "$INVOKER_FN"
          jq -nc '{function:"node:/api/health/background-runtime",body:{}}' > "$RUNNER_TEMP/health.json"
          aws lambda invoke --function-name "$INVOKER_FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/health.json" "$RUNNER_TEMP/health-response.json" >/dev/null
          jq -e '.ok == true and .runtime == "node" and .status == 200 and .response.ok == true and .response.runtime == "aws-background"' "$RUNNER_TEMP/health-response.json" >/dev/null
          echo "invoker_function=$INVOKER_FN" >> "$GITHUB_ENV"

      - name: Probe all Batch 11 candidates and collect failures
        run: |
          set -euo pipefail
          FAILURES="$RUNNER_TEMP/failures.txt"
          PASSES="$RUNNER_TEMP/passes.txt"
          : > "$FAILURES"
          : > "$PASSES"

          while IFS= read -r NAME; do
            ITEM="$(jq -c --arg name "$NAME" '.[] | select(.name == $name)' infra/aws/edge-runtime/schedules.json)"
            test -n "$ITEM"
            FUNCTION="$(jq -r '.function' <<<"$ITEM")"
            if [ "$NAME" = 'semantic-nightly' ]; then
              FUNCTION='node:/api/cron/semantic-nightly'
            fi
            jq -nc --arg fn "$FUNCTION" '{function:$fn,body:{}}' > "$RUNNER_TEMP/probe.json"

            if aws lambda invoke --function-name "$invoker_function" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/probe.json" "$RUNNER_TEMP/response.json" >/dev/null 2>"$RUNNER_TEMP/invoke-error.txt"; then
              if jq -e '.ok == true and (.status // 200) < 400 and (.response.success // true) != false and (.response.ok // true) != false' "$RUNNER_TEMP/response.json" >/dev/null; then
                echo "$NAME" | tee -a "$PASSES"
              else
                echo "$NAME" | tee -a "$FAILURES"
                jq -c '{name:$name,ok,runtime,status,errorType,errorMessage,response:(if (.response|type)=="object" then {success:.response.success,ok:.response.ok,error:.response.error,reason:.response.reason,degraded:.response.degraded,embedding_failures:.response.embedding_failures} else {type:(.response|type)} end)}' --arg name "$NAME" "$RUNNER_TEMP/response.json" || true
              fi
            else
              echo "$NAME" | tee -a "$FAILURES"
              echo "invoke_failed=$NAME"
            fi
          done < <(jq -r '.probe[]' infra/aws/edge-runtime/activation.json)

          PASS_COUNT="$(wc -l < "$PASSES" | tr -d ' ')"
          FAIL_COUNT="$(wc -l < "$FAILURES" | tr -d ' ')"
          {
            echo '### Batch 11 collect-all preflight'
            echo ''
            echo "- Passed: ${PASS_COUNT}/11"
            echo "- Failed: ${FAIL_COUNT}/11"
            if [ "$FAIL_COUNT" -gt 0 ]; then
              echo '- Failing jobs:'
              sed 's/^/  - /' "$FAILURES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          test "$FAIL_COUNT" = '0'

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/health.json "$RUNNER_TEMP"/health-response.json "$RUNNER_TEMP"/probe.json "$RUNNER_TEMP"/response.json "$RUNNER_TEMP"/invoke-error.txt "$RUNNER_TEMP"/failures.txt "$RUNNER_TEMP"/passes.txt
