name: AWS Reserve API

on:
  pull_request:
    paths:
      - 'infra/aws/lambda/platform_reserve_api.py'
      - 'infra/aws/cloudformation/reserve-api.yml'
      - 'lib/aws/reserve-api.ts'
      - 'app/api/v1/reserve/**'
      - '.github/workflows/aws-reserve-api.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/aws/lambda/platform_reserve_api.py'
      - 'infra/aws/cloudformation/reserve-api.yml'
      - 'lib/aws/reserve-api.ts'
      - 'app/api/v1/reserve/**'
      - '.github/workflows/aws-reserve-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: production
        options: [staging, production]
      deploy:
        description: Deploy after validation
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-reserve-api-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  TEMPLATE_FILE: infra/aws/cloudformation/reserve-api.yml
  DEFAULT_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  VERCEL_TEAM_ID: team_TzlwC4vdLZiT8kFGuXSoj1em
  VERCEL_PROJECT_ID: prj_G4nFS7P3F4cW3PQn4oQAx6Vf3GIN
  VERCEL_PROJECT_NAME: roseout

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Reserve API Python syntax
        run: python -m py_compile infra/aws/lambda/platform_reserve_api.py
      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint
      - name: Lint Reserve API CloudFormation
        run: cfn-lint "$TEMPLATE_FILE"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Reserve regression tests
        run: npm run test:reserve
      - name: Typecheck Reserve BFF wiring
        run: npm run typecheck

  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve deployment configuration
        id: config
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          CONFIGURED_ROLE: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          CONFIGURED_SUPABASE_URL: ${{ vars.AWS_WORKER_SUPABASE_URL }}
          RESERVE_API_SECRET: ${{ secrets.AWS_RESERVE_API_SECRET }}
          JOB_GATEWAY_SECRET: ${{ secrets.AWS_PLATFORM_JOB_GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          TARGET_ENV="${INPUT_ENV:-production}"
          ROLE_ARN="${CONFIGURED_ROLE:-arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole}"
          SUPABASE_URL="${CONFIGURED_SUPABASE_URL:-$DEFAULT_SUPABASE_URL}"
          SHARED_SECRET="${RESERVE_API_SECRET:-$JOB_GATEWAY_SECRET}"
          test -n "$SHARED_SECRET" || { echo "Missing Reserve API secret and job gateway fallback" >&2; exit 1; }
          test "${#SHARED_SECRET}" -ge 32 || { echo "Reserve API shared secret must be at least 32 characters" >&2; exit 1; }
          if [ "$TARGET_ENV" = 'production' ]; then
            case "$SUPABASE_URL" in
              *ftdsltatyqhtllyyefzp.supabase.co*) ;;
              *) echo "Reserve API production source must be Virginia Supabase." >&2; exit 1 ;;
            esac
          fi
          echo "::add-mask::$SHARED_SECRET"
          printf '%s' "$SHARED_SECRET" > "$RUNNER_TEMP/reserve-api-secret"
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "supabase_url=$SUPABASE_URL" >> "$GITHUB_OUTPUT"
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Resolve Supabase service-role secret ARN
        id: supabase-secret
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          SECRET_ARN="$(aws secretsmanager describe-secret --secret-id "/theouthaven/${TARGET_ENV}/supabase/service-role" --query ARN --output text)"
          test -n "$SECRET_ARN" && test "$SECRET_ARN" != 'None'
          echo "arn=$SECRET_ARN" >> "$GITHUB_OUTPUT"
      - name: Deploy Reserve API stack
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
          SUPABASE_URL: ${{ steps.config.outputs.supabase_url }}
          SUPABASE_SECRET_ARN: ${{ steps.supabase-secret.outputs.arn }}
        run: |
          set -euo pipefail
          SHARED_SECRET="$(cat "$RUNNER_TEMP/reserve-api-secret")"
          aws cloudformation deploy \
            --stack-name "theouthaven-reserve-api-${TARGET_ENV}" \
            --template-file "$TEMPLATE_FILE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$TARGET_ENV" \
              ReserveApiSharedSecret="$SHARED_SECRET" \
              SupabaseUrl="$SUPABASE_URL" \
              SupabaseServiceRoleSecretArn="$SUPABASE_SECRET_ARN" \
            --tags Project=TheOutHaven Environment="$TARGET_ENV" Service=ReserveAPI ManagedBy=CloudFormation
      - name: Build and deploy Reserve API Lambda code
        id: runtime
        env:
          TARGET_ENV: ${{ steps.config.outputs.target_env }}
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/reserve-api"
          ZIP_FILE="$RUNNER_TEMP/reserve-api.zip"
          mkdir -p "$BUILD_DIR"
          cp infra/aws/lambda/platform_reserve_api.py "$BUILD_DIR/index.py"
          (cd "$BUILD_DIR" && zip -qr "$ZIP_FILE" .)
          STACK="theouthaven-reserve-api-${TARGET_ENV}"
          FUNCTION_NAME="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='ReserveApiFunctionName'].OutputValue" --output text)"
          API_URL="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='ReserveApiUrl'].OutputValue" --output text)"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file "fileb://$ZIP_FILE" >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "function_name=$FUNCTION_NAME" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Verify Reserve API health
        env:
          API_URL: ${{ steps.runtime.outputs.api_url }}
        run: |
          set -euo pipefail
          SHARED_SECRET="$(cat "$RUNNER_TEMP/reserve-api-secret")"
          export API_URL SHARED_SECRET
          python - <<'PY'
          import hashlib, hmac, json, os, time, urllib.request
          base = os.environ['API_URL'].rstrip('/')
          secret = os.environ['SHARED_SECRET']
          path = '/healthz'
          stamp = str(int(time.time() * 1000))
          sig = hmac.new(secret.encode(), f'{stamp}\nGET\n{path}\n'.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(base + path, headers={'x-toh-timestamp': stamp, 'x-toh-signature': sig})
          with urllib.request.urlopen(req, timeout=10) as resp:
              payload = json.loads(resp.read().decode())
          assert payload.get('ok') is True and payload.get('service') == 'reserve-api', payload
          PY
      - name: Activate Reserve API in Vercel production
        if: steps.config.outputs.target_env == 'production'
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RESERVE_API_URL: ${{ steps.runtime.outputs.api_url }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN secret' >&2; exit 1; }
          RESERVE_API_SECRET="$(cat "$RUNNER_TEMP/reserve-api-secret")"
          echo "::add-mask::$RESERVE_API_SECRET"
          jq -n \
            --arg url "$RESERVE_API_URL" \
            --arg secret "$RESERVE_API_SECRET" \
            '[
              {key:"AWS_RESERVE_API_URL",value:$url,type:"encrypted",target:["production"]},
              {key:"AWS_RESERVE_API_SECRET",value:$secret,type:"encrypted",target:["production"]}
            ]' > "$RUNNER_TEMP/vercel-reserve-env.json"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/vercel-reserve-env.json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/vercel-reserve-env-response.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v7/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=1&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/vercel-current.json"
          OLD_ID="$(jq -r '.deployments[0].uid // .deployments[0].id // empty' "$RUNNER_TEMP/vercel-current.json")"
          test -n "$OLD_ID"
          jq -n --arg name "$VERCEL_PROJECT_NAME" --arg project "$VERCEL_PROJECT_ID" --arg deploymentId "$OLD_ID" '{name:$name,project:$project,deploymentId:$deploymentId,target:"production"}' > "$RUNNER_TEMP/vercel-redeploy.json"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/vercel-redeploy.json" \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_TEAM_ID}" \
            > "$RUNNER_TEMP/vercel-new.json"
          NEW_ID="$(jq -r '.id // .uid // empty' "$RUNNER_TEMP/vercel-new.json")"
          test -n "$NEW_ID"
          READY=false
          for _ in $(seq 1 120); do
            curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/${NEW_ID}?teamId=${VERCEL_TEAM_ID}" > "$RUNNER_TEMP/vercel-status.json"
            STATE="$(jq -r '.readyState // .state // empty' "$RUNNER_TEMP/vercel-status.json")"
            if [ "$STATE" = 'READY' ]; then READY=true; break; fi
            if [ "$STATE" = 'ERROR' ] || [ "$STATE" = 'CANCELED' ]; then cat "$RUNNER_TEMP/vercel-status.json"; exit 1; fi
            sleep 5
          done
          test "$READY" = true || { echo 'Timed out waiting for Vercel redeploy'; exit 1; }
