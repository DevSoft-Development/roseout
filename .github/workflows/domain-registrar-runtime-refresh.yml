name: Domain registrar runtime refresh

on:
  pull_request:
    paths:
      - '.github/workflows/domain-registrar-runtime-refresh.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-registrar-runtime-refresh.yml'
  workflow_run:
    workflows: ["AWS platform DR", "AWS background runtime"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-domain-gateway-credential-authority-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: '742020474738'
  AWS_REGION: us-east-1
  COMPUTE_REGION: us-west-2
  VIRGINIA_SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  AWS_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role
  DOMAIN_GATEWAY_SECRET_NAME: /theouthaven/production/domain-gateway/hmac
  DOMAIN_GATEWAY_URL: https://domains-api.theouthaven.com
  APP_ENV_SECRET_NAME: /theouthaven/production/platform-dr/app-env
  BACKGROUND_STACK_NAME: theouthaven-background-runtime-production
  DR_STACK_NAME: theouthaven-platform-dr-production
  REGISTRAR_MODE: aws

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical authority refresh contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/domain-registrar-runtime-refresh.yml'
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" "$FILE"
          grep -F 'workflows: ["AWS platform DR", "AWS background runtime"]' "$FILE" >/dev/null
          grep -F '/theouthaven/production/supabase/service-role' "$FILE" >/dev/null
          grep -F '/theouthaven/production/domain-gateway/hmac' "$FILE" >/dev/null
          grep -F 'ftdsltatyqhtllyyefzp.supabase.co' "$FILE" >/dev/null
          grep -F 'https://domains-api.theouthaven.com' "$FILE" >/dev/null
          grep -F 'DOMAIN_REGISTRAR_LIFECYCLE_MODE' "$FILE" >/dev/null
          grep -F 'BACKGROUND_RUNTIME_REFRESH_TOKEN' "$FILE" >/dev/null
          grep -F 'canonical_supabase_authority=valid' "$FILE" >/dev/null
          grep -F 'canonical_domain_gateway_authority=valid' "$FILE" >/dev/null
          grep -F 'registrar_lifecycle_owner == "aws"' "$FILE" >/dev/null
          grep -F 'runtime_provider == "aws-background"' "$FILE" >/dev/null
          grep -F 'private_dispatch == true' "$FILE" >/dev/null

  refresh:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve and validate canonical authorities
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

          SERVICE_ROLE="$(aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$AWS_SERVICE_ROLE_SECRET" --query SecretString --output text)"
          DOMAIN_SECRET="$(aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$DOMAIN_GATEWAY_SECRET_NAME" --query SecretString --output text)"
          test -n "$SERVICE_ROLE" && test "$SERVICE_ROLE" != 'None'
          test -n "$DOMAIN_SECRET" && test "$DOMAIN_SECRET" != 'None'
          echo "::add-mask::$SERVICE_ROLE"
          echo "::add-mask::$DOMAIN_SECRET"
          printf '%s' "$SERVICE_ROLE" > "$RUNNER_TEMP/virginia-service-role"
          printf '%s' "$DOMAIN_SECRET" > "$RUNNER_TEMP/domain-gateway-secret"
          chmod 600 "$RUNNER_TEMP/virginia-service-role" "$RUNNER_TEMP/domain-gateway-secret"

          SUPABASE_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            "${VIRGINIA_SUPABASE_URL}/rest/v1/locations?select=id&limit=1")"
          test "$SUPABASE_STATUS" = '200'
          echo 'canonical_supabase_authority=valid'

          TIMESTAMP="$(date +%s%3N)"
          SIGNATURE="$(TIMESTAMP="$TIMESTAMP" DOMAIN_SECRET="$DOMAIN_SECRET" python3 - <<'PY'
          import hashlib, hmac, os
          payload = '\n'.join([os.environ['TIMESTAMP'], 'GET', '/v1/status', ''])
          print(hmac.new(os.environ['DOMAIN_SECRET'].encode(), payload.encode(), hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$SIGNATURE"
          GATEWAY_STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/domain-status.json" --write-out '%{http_code}' \
            "$DOMAIN_GATEWAY_URL/v1/status" \
            -H "x-toh-timestamp: $TIMESTAMP" \
            -H "x-toh-signature: $SIGNATURE")"
          test "$GATEWAY_STATUS" -ge 200 && test "$GATEWAY_STATUS" -lt 300
          jq -e '.ok == true and .authenticated == true' "$RUNNER_TEMP/domain-status.json" >/dev/null
          echo 'canonical_domain_gateway_authority=valid'

      - name: Repair shared AWS app environment atomically
        id: appenv
        run: |
          set -euo pipefail
          CURRENT="$RUNNER_TEMP/app-env.json"
          NEXT="$RUNNER_TEMP/app-env-next.json"
          aws secretsmanager get-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --query SecretString --output text > "$CURRENT"
          chmod 600 "$CURRENT"

          CURRENT_JSON="$CURRENT" \
          SUPABASE_KEY_FILE="$RUNNER_TEMP/virginia-service-role" \
          DOMAIN_KEY_FILE="$RUNNER_TEMP/domain-gateway-secret" \
          VIRGINIA_SUPABASE_URL="$VIRGINIA_SUPABASE_URL" \
          DOMAIN_GATEWAY_URL="$DOMAIN_GATEWAY_URL" \
          REGISTRAR_MODE="$REGISTRAR_MODE" \
          OUTPUT_JSON="$NEXT" python3 - <<'PY'
          import json, os
          current = json.load(open(os.environ['CURRENT_JSON'], encoding='utf-8'))
          if not isinstance(current, dict):
              raise SystemExit('Shared app environment is not a JSON object.')
          supabase_key = open(os.environ['SUPABASE_KEY_FILE'], encoding='utf-8').read().strip()
          domain_key = open(os.environ['DOMAIN_KEY_FILE'], encoding='utf-8').read().strip()
          desired = {
              'NEXT_PUBLIC_SUPABASE_URL': os.environ['VIRGINIA_SUPABASE_URL'],
              'SUPABASE_SERVICE_ROLE_KEY': supabase_key,
              'DOMAIN_GATEWAY_URL': os.environ['DOMAIN_GATEWAY_URL'].rstrip('/'),
              'DOMAIN_GATEWAY_SECRET': domain_key,
              'DOMAIN_REGISTRAR_LIFECYCLE_MODE': os.environ['REGISTRAR_MODE'],
          }
          changed = any(current.get(k) != v for k, v in desired.items())
          current.update(desired)
          json.dump(current, open(os.environ['OUTPUT_JSON'], 'w', encoding='utf-8'), separators=(',', ':'))
          open(os.environ['OUTPUT_JSON'] + '.changed', 'w', encoding='utf-8').write('true' if changed else 'false')
          PY
          chmod 600 "$NEXT"
          CHANGED="$(cat "$NEXT.changed")"
          if [ "$CHANGED" = 'true' ]; then
            aws secretsmanager put-secret-value --region "$COMPUTE_REGION" --secret-id "$APP_ENV_SECRET_NAME" --secret-string "file://$NEXT" --query VersionId --output text >/dev/null
          fi
          CRON_SECRET="$(jq -r '.CRON_SECRET // empty' "$NEXT")"
          test -n "$CRON_SECRET"
          echo "::add-mask::$CRON_SECRET"
          printf '%s' "$CRON_SECRET" > "$RUNNER_TEMP/cron-secret"
          chmod 600 "$RUNNER_TEMP/cron-secret"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo 'shared_runtime_authorities=canonical'

      - name: Always refresh private background Lambda configuration
        run: |
          set -euo pipefail
          FN="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)"
          test -n "$FN" && test "$FN" != 'None'
          aws lambda get-function-configuration --region "$AWS_REGION" --function-name "$FN" > "$RUNNER_TEMP/background-config.json"
          jq '{Variables:(.Environment.Variables // {})}' "$RUNNER_TEMP/background-config.json" > "$RUNNER_TEMP/background-original-env.json"
          jq --arg token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '.Variables.BACKGROUND_RUNTIME_REFRESH_TOKEN=$token' "$RUNNER_TEMP/background-original-env.json" > "$RUNNER_TEMP/background-refresh-env.json"
          aws lambda update-function-configuration --region "$AWS_REGION" --function-name "$FN" --environment "file://$RUNNER_TEMP/background-refresh-env.json" >/dev/null
          aws lambda wait function-updated-v2 --region "$AWS_REGION" --function-name "$FN"
          aws lambda update-function-configuration --region "$AWS_REGION" --function-name "$FN" --environment "file://$RUNNER_TEMP/background-original-env.json" >/dev/null
          aws lambda wait function-updated-v2 --region "$AWS_REGION" --function-name "$FN"
          echo "background_function=$FN" >> "$GITHUB_ENV"
          echo 'background_runtime_refreshed=true'

      - name: Restart DR standby if shared authorities changed
        if: steps.appenv.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          CLUSTER="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$DR_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" --output text 2>/dev/null || true)"
          SERVICE="$(aws cloudformation describe-stacks --region "$COMPUTE_REGION" --stack-name "$DR_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EcsServiceName'].OutputValue" --output text 2>/dev/null || true)"
          if [ -n "$CLUSTER" ] && [ "$CLUSTER" != 'None' ] && [ -n "$SERVICE" ] && [ "$SERVICE" != 'None' ]; then
            aws ecs update-service --region "$COMPUTE_REGION" --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment >/dev/null
            echo 'dr_standby_refresh_requested=true'
          else
            echo 'dr_standby_refresh_requested=false'
          fi

      - name: Prove private AWS route and tracked runtime metadata
        run: |
          set -euo pipefail
          CRON_SECRET="$(cat "$RUNNER_TEMP/cron-secret")"
          SERVICE_ROLE="$(cat "$RUNNER_TEMP/virginia-service-role")"
          echo "::add-mask::$CRON_SECRET"
          echo "::add-mask::$SERVICE_ROLE"
          FN="${background_function:-$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$BACKGROUND_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BackgroundRuntimeFunctionName'].OutputValue" --output text)}"

          CRON_SECRET="$CRON_SECRET" python3 - <<'PY'
          import json, os
          secret = os.environ['CRON_SECRET']
          event = {
              'version': '2.0',
              'routeKey': 'GET /api/cron/managed',
              'rawPath': '/api/cron/managed',
              'rawQueryString': 'job=domain-lifecycle',
              'headers': {
                  'authorization': f'Bearer {secret}',
                  'x-cron-secret': secret,
                  'x-toh-aws-internal': 'eventbridge',
              },
              'requestContext': {
                  'accountId': 'authority-refresh', 'apiId': 'authority-refresh',
                  'domainName': 'internal', 'domainPrefix': 'internal',
                  'http': {'method': 'GET', 'path': '/api/cron/managed', 'protocol': 'HTTP/1.1', 'sourceIp': '127.0.0.1', 'userAgent': 'github-actions'},
                  'requestId': 'domain-registrar-runtime-refresh',
                  'routeKey': 'GET /api/cron/managed', 'stage': '$default',
                  'time': '02/Sep/2026:00:00:00 +0000', 'timeEpoch': 1788336000000,
              },
              'isBase64Encoded': False,
          }
          json.dump(event, open(os.path.join(os.environ['RUNNER_TEMP'], 'domain-event.json'), 'w'), separators=(',', ':'))
          PY

          PROVED=false
          for ATTEMPT in $(seq 1 18); do
            aws lambda invoke --region "$AWS_REGION" --function-name "$FN" --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/domain-event.json" "$RUNNER_TEMP/domain-response.json" >/dev/null
            STATUS="$(jq -r '.statusCode // 0' "$RUNNER_TEMP/domain-response.json")"
            OWNER="$(jq -r '.body | fromjson | .registrar_lifecycle_owner // empty' "$RUNNER_TEMP/domain-response.json" 2>/dev/null || true)"
            echo "authority_probe_attempt=${ATTEMPT} status=${STATUS} owner=${OWNER:-unknown}"
            if [ "$STATUS" = '200' ] && [ "$OWNER" = 'aws' ]; then
              PROVED=true
              break
            fi
            sleep 5
          done
          test "$PROVED" = 'true'
          echo 'registrar_lifecycle_owner == "aws"'

          CUTOFF="$(date -u -d '10 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          TRACKED=false
          for ATTEMPT in $(seq 1 12); do
            curl --fail --silent --show-error --get \
              -H "apikey: $SERVICE_ROLE" \
              -H "Authorization: Bearer $SERVICE_ROLE" \
              --data-urlencode 'select=id,status,started_at,details' \
              --data-urlencode 'job_key=eq.domain-lifecycle' \
              --data-urlencode 'status=eq.success' \
              --data-urlencode "started_at=gte.${CUTOFF}" \
              --data-urlencode 'order=started_at.desc' \
              --data-urlencode 'limit=25' \
              "${VIRGINIA_SUPABASE_URL}/rest/v1/cron_job_runs" > "$RUNNER_TEMP/cron-runs.json"
            if jq -e '[.[] | select(.details.runtime_provider == "aws-background" and .details.private_dispatch == true and .details.registrar_lifecycle_owner == "aws")] | length > 0' "$RUNNER_TEMP/cron-runs.json" >/dev/null; then
              TRACKED=true
              break
            fi
            sleep 5
          done
          test "$TRACKED" = 'true'
          echo 'runtime_provider == "aws-background"'
          echo 'private_dispatch == true'

      - name: Refresh summary
        run: |
          {
            echo '### Domain registrar runtime authority'
            echo '- Canonical Virginia authority: valid'
            echo '- Canonical domain-gateway authority: valid'
            echo '- Shared AWS app environment: canonical'
            echo '- Private background Lambda: refreshed'
            echo '- Private domain lifecycle owner: aws'
            echo '- Tracked private runtime: aws-background / private_dispatch=true'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/virginia-service-role "$RUNNER_TEMP"/domain-gateway-secret "$RUNNER_TEMP"/domain-status.json "$RUNNER_TEMP"/app-env.json "$RUNNER_TEMP"/app-env-next.json "$RUNNER_TEMP"/app-env-next.json.changed "$RUNNER_TEMP"/cron-secret "$RUNNER_TEMP"/background-config.json "$RUNNER_TEMP"/background-original-env.json "$RUNNER_TEMP"/background-refresh-env.json "$RUNNER_TEMP"/domain-event.json "$RUNNER_TEMP"/domain-response.json "$RUNNER_TEMP"/cron-runs.json
