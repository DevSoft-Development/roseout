name: Production live E2E

on:
  workflow_run:
    workflows: ['Production CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-e2e
  cancel-in-progress: true

jobs:
  live-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_BASE_URL: https://www.theouthaven.com
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run required tests against production
        run: npm run test:e2e:required

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-live-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
