name: AWS Location Intelligence dedupe drain

on:
  pull_request:
    paths:
      - '.github/workflows/aws-location-intelligence-dedupe-drain.yml'
      - 'lib/location-intelligence/dedupeClassifier.ts'
      - 'lib/__tests__/location-intelligence-cleanup-worker.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-location-intelligence-dedupe-drain.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-location-intelligence-dedupe-drain-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  EDGE_STACK_NAME: theouthaven-edge-runtime-production
  SUPABASE_URL: https://ftdsltatyqhtllyyefzp.supabase.co
  SUPABASE_SERVICE_ROLE_SECRET: /theouthaven/production/supabase/service-role
  CLASSIFIER_TARGET: /api/cron/managed?job=location-intelligence-dedupe-classifier
  BATCH_LIMIT: '25'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded drain contract
        run: |
          set -euo pipefail
          FILE=.github/workflows/aws-location-intelligence-dedupe-drain.yml
          grep -F "BATCH_LIMIT: '25'" "$FILE" >/dev/null
          grep -F 'sqs:background-cron' "$FILE" >/dev/null
          grep -F '/api/cron/managed?job=location-intelligence-dedupe-classifier' "$FILE" >/dev/null
          grep -F 'github.event_name == '\''workflow_dispatch'\''' "$FILE" >/dev/null
          grep -F 'googleCallsPerformed == 0' "$FILE" >/dev/null
          grep -F 'destructiveMergesPerformed == 0' "$FILE" >/dev/null
          grep -F 'AUTO_UNIQUE + REVIEW_DISPOSITIONED == SELECTED' "$FILE" >/dev/null
          grep -F 'SEARCHABLE_AFTER == SEARCHABLE_BEFORE' "$FILE" >/dev/null
          grep -F 'duplicate_status == "unique" or .duplicate_status == "possible_duplicate"' "$FILE" >/dev/null
          grep -F 'priorDecisionConflicts' "$FILE" >/dev/null
          grep -F 'location_intelligence_prior_' "$FILE" >/dev/null

  execute:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve scheduler invoker and Virginia credential
        id: runtime
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          INVOKER="$(aws cloudformation describe-stacks \
            --stack-name "$EDGE_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SchedulerInvokerFunctionName'].OutputValue" \
            --output text)"
          test -n "$INVOKER" && test "$INVOKER" != 'None'
          aws lambda get-function --function-name "$INVOKER" >/dev/null

          KEY_FILE="$RUNNER_TEMP/virginia-service-role"
          aws secretsmanager get-secret-value \
            --secret-id "$SUPABASE_SERVICE_ROLE_SECRET" \
            --query SecretString \
            --output text > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          test -n "$SERVICE_ROLE"
          echo "::add-mask::$SERVICE_ROLE"
          echo "invoker=$INVOKER" >> "$GITHUB_OUTPUT"
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"

      - name: Snapshot exact guarded queue head
        id: before
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
        run: |
          set -euo pipefail
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          QUEUE="$RUNNER_TEMP/dedupe-queue-before.json"
          curl --silent --show-error --fail --get \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --data-urlencode 'select=id' \
            --data-urlencode 'quality_status=eq.publish_ready' \
            --data-urlencode 'is_searchable=eq.false' \
            --data-urlencode 'duplicate_status=eq.unknown' \
            --data-urlencode 'is_hidden=eq.false' \
            --data-urlencode 'active=eq.true' \
            --data-urlencode 'is_low_level=eq.false' \
            --data-urlencode 'deleted_at=is.null' \
            --data-urlencode 'duplicate_of=is.null' \
            --data-urlencode 'order=id.asc' \
            --data-urlencode "limit=$BATCH_LIMIT" \
            "${SUPABASE_URL}/rest/v1/locations" > "$QUEUE"
          jq -e 'type == "array"' "$QUEUE" >/dev/null
          jq -r '.[].id' "$QUEUE" | sort > "$RUNNER_TEMP/preflight-ids.txt"
          SELECTED_EXPECTED="$(jq 'length' "$QUEUE")"

          HEADERS="$RUNNER_TEMP/dedupe-unknown-before.headers"
          curl --silent --show-error --fail \
            --dump-header "$HEADERS" --output /dev/null \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --header 'Prefer: count=exact' \
            "${SUPABASE_URL}/rest/v1/locations?select=id&quality_status=eq.publish_ready&is_searchable=eq.false&duplicate_status=eq.unknown&is_hidden=eq.false&active=eq.true&is_low_level=eq.false&deleted_at=is.null&duplicate_of=is.null&limit=1"
          UNKNOWN_BEFORE="$(awk -F'/' 'tolower($1) ~ /^content-range:/ {gsub("\r", "", $2); print $2}' "$HEADERS" | tail -1)"

          SEARCH_HEADERS="$RUNNER_TEMP/searchable-before.headers"
          curl --silent --show-error --fail \
            --dump-header "$SEARCH_HEADERS" --output /dev/null \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --header 'Prefer: count=exact' \
            "${SUPABASE_URL}/rest/v1/locations?select=id&is_searchable=eq.true&deleted_at=is.null&limit=1"
          SEARCHABLE_BEFORE="$(awk -F'/' 'tolower($1) ~ /^content-range:/ {gsub("\r", "", $2); print $2}' "$SEARCH_HEADERS" | tail -1)"

          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "selected_expected=$SELECTED_EXPECTED" >> "$GITHUB_OUTPUT"
          echo "unknown_before=$UNKNOWN_BEFORE" >> "$GITHUB_OUTPUT"
          echo "searchable_before=$SEARCHABLE_BEFORE" >> "$GITHUB_OUTPUT"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          echo "Guarded unknown before: $UNKNOWN_BEFORE; queue head: $SELECTED_EXPECTED; searchable: $SEARCHABLE_BEFORE"

      - name: Enqueue one 25-row classifier batch
        if: steps.before.outputs.selected_expected != '0'
        env:
          INVOKER: ${{ steps.runtime.outputs.invoker }}
        run: |
          set -euo pipefail
          REQUEST="$RUNNER_TEMP/dedupe-drain-request.json"
          RESPONSE="$RUNNER_TEMP/dedupe-drain-response.json"
          jq -nc --arg target "$CLASSIFIER_TARGET" \
            '{function:"sqs:background-cron",body:{target:$target,payload:{}}}' > "$REQUEST"
          aws lambda invoke \
            --function-name "$INVOKER" \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$REQUEST" \
            "$RESPONSE" >/dev/null
          jq -e --arg target "$CLASSIFIER_TARGET" \
            '.ok == true and .runtime == "sqs" and .queue == "background-cron" and .target == $target and (.messageId | type == "string")' \
            "$RESPONSE" >/dev/null

      - name: Read and validate classifier outcome
        id: outcome
        if: steps.before.outputs.selected_expected != '0'
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
          STARTED_AT: ${{ steps.before.outputs.started_at }}
          EXPECTED: ${{ steps.before.outputs.selected_expected }}
        run: |
          set -euo pipefail
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          OUTCOME="$RUNNER_TEMP/dedupe-drain-outcome.json"
          FOUND=0
          for attempt in $(seq 1 30); do
            curl --silent --show-error --fail --get \
              --header "apikey: $SERVICE_ROLE" \
              --header "Authorization: Bearer $SERVICE_ROLE" \
              --data-urlencode 'select=id,status,started_at,finished_at,details' \
              --data-urlencode 'job_key=eq.location-intelligence-dedupe-classifier' \
              --data-urlencode "started_at=gte.${STARTED_AT}" \
              --data-urlencode 'order=started_at.desc' \
              --data-urlencode 'limit=1' \
              "${SUPABASE_URL}/rest/v1/cron_job_runs" > "$OUTCOME"
            if jq -e 'length == 1 and .[0].finished_at != null' "$OUTCOME" >/dev/null; then
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = 1 || { echo 'classifier outcome was not observed.' >&2; exit 1; }

          jq -e --argjson expected "$EXPECTED" '
            .[0].status == "success"
            and .[0].details.mode == "conservative_dedupe_classifier_v1"
            and .[0].details.googleCallsPerformed == 0
            and .[0].details.destructiveMergesPerformed == 0
            and .[0].details.limit == 25
            and .[0].details.selected == $expected
            and .[0].details.classified == $expected
            and .[0].details.failed == 0
            and .[0].details.skipped == 0
            and ((.[0].details.autoUnique + .[0].details.reviewDispositioned) == $expected)
            and (.[0].details.priorDecisionConflicts >= 0)
            and (.[0].details.priorDecisionConflicts <= .[0].details.reviewDispositioned)
          ' "$OUTCOME" >/dev/null

          AUTO_UNIQUE="$(jq -r '.[0].details.autoUnique' "$OUTCOME")"
          REVIEW_DISPOSITIONED="$(jq -r '.[0].details.reviewDispositioned' "$OUTCOME")"
          PRIOR_CONFLICTS="$(jq -r '.[0].details.priorDecisionConflicts' "$OUTCOME")"
          SELECTED="$(jq -r '.[0].details.selected' "$OUTCOME")"
          test $((AUTO_UNIQUE + REVIEW_DISPOSITIONED)) -eq "$SELECTED" || { echo 'AUTO_UNIQUE + REVIEW_DISPOSITIONED == SELECTED assertion failed.' >&2; exit 1; }

          {
            jq -r '.[0].details.autoUniqueLocationIds[]?' "$OUTCOME"
            jq -r '.[0].details.review[]? | select(.reviewDispositioned == true) | .locationId' "$OUTCOME"
          } | sort -u > "$RUNNER_TEMP/outcome-ids.txt"
          test "$(grep -c . "$RUNNER_TEMP/outcome-ids.txt" || true)" -eq "$SELECTED"
          diff -u "$RUNNER_TEMP/preflight-ids.txt" "$RUNNER_TEMP/outcome-ids.txt"

          jq -r '.[0].details.autoUniqueLocationIds[]?' "$OUTCOME" | sort > "$RUNNER_TEMP/auto-unique-ids.txt"
          jq -r '.[0].details.review[]? | select(.reviewDispositioned == true and .priorDecisionConflict == false) | .locationId' "$OUTCOME" | sort > "$RUNNER_TEMP/pending-review-ids.txt"
          jq -r '.[0].details.review[]? | select(.reviewDispositioned == true and .priorDecisionConflict == true) | .locationId' "$OUTCOME" | sort > "$RUNNER_TEMP/prior-conflict-ids.txt"

          echo "auto_unique=$AUTO_UNIQUE" >> "$GITHUB_OUTPUT"
          echo "review_dispositioned=$REVIEW_DISPOSITIONED" >> "$GITHUB_OUTPUT"
          echo "prior_conflicts=$PRIOR_CONFLICTS" >> "$GITHUB_OUTPUT"
          echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Independently audit exact selected mutations
        if: steps.before.outputs.selected_expected != '0'
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
          SELECTED: ${{ steps.outcome.outputs.selected }}
        run: |
          set -euo pipefail
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          IDS="$(paste -sd, "$RUNNER_TEMP/outcome-ids.txt")"
          AUDIT="$RUNNER_TEMP/dedupe-drain-audit.json"
          curl --silent --show-error --fail --get \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --data-urlencode 'select=id,duplicate_status,is_searchable,duplicate_of,last_deduped_at,duplicate_check_key' \
            --data-urlencode "id=in.(${IDS})" \
            "${SUPABASE_URL}/rest/v1/locations" > "$AUDIT"
          jq -e --argjson expected "$SELECTED" '
            length == $expected
            and all(.[];
              (.duplicate_status == "unique" or .duplicate_status == "possible_duplicate")
              and .is_searchable == false
              and .duplicate_of == null
              and .last_deduped_at != null
            )
          ' "$AUDIT" >/dev/null

          while read -r id; do
            [ -n "$id" ] || continue
            jq -e --arg id "$id" '.[] | select(.id == $id) | .duplicate_status == "unique"' "$AUDIT" >/dev/null
          done < "$RUNNER_TEMP/auto-unique-ids.txt"

          while read -r id; do
            [ -n "$id" ] || continue
            jq -e --arg id "$id" '.[] | select(.id == $id) | .duplicate_status == "possible_duplicate"' "$AUDIT" >/dev/null
            REVIEW="$RUNNER_TEMP/review-${id}.json"
            curl --silent --show-error --fail --get \
              --header "apikey: $SERVICE_ROLE" \
              --header "Authorization: Bearer $SERVICE_ROLE" \
              --data-urlencode 'select=id' \
              --data-urlencode 'status=eq.pending' \
              --data-urlencode "or=(location_a_id.eq.${id},location_b_id.eq.${id})" \
              --data-urlencode 'limit=1' \
              "${SUPABASE_URL}/rest/v1/location_duplicate_review" > "$REVIEW"
            jq -e 'length >= 1' "$REVIEW" >/dev/null
          done < "$RUNNER_TEMP/pending-review-ids.txt"

          while read -r id; do
            [ -n "$id" ] || continue
            jq -e --arg id "$id" '.[] | select(.id == $id) | .duplicate_status == "possible_duplicate" and (.duplicate_check_key | startswith("location_intelligence_prior_"))' "$AUDIT" >/dev/null
          done < "$RUNNER_TEMP/prior-conflict-ids.txt"

      - name: Prove queue progress and zero publication
        if: steps.before.outputs.selected_expected != '0'
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
          UNKNOWN_BEFORE: ${{ steps.before.outputs.unknown_before }}
          SEARCHABLE_BEFORE: ${{ steps.before.outputs.searchable_before }}
          SELECTED: ${{ steps.outcome.outputs.selected }}
          STARTED_AT: ${{ steps.before.outputs.started_at }}
        run: |
          set -euo pipefail
          SERVICE_ROLE="$(cat "$KEY_FILE")"
          HEADERS="$RUNNER_TEMP/dedupe-unknown-after.headers"
          curl --silent --show-error --fail \
            --dump-header "$HEADERS" --output /dev/null \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --header 'Prefer: count=exact' \
            "${SUPABASE_URL}/rest/v1/locations?select=id&quality_status=eq.publish_ready&is_searchable=eq.false&duplicate_status=eq.unknown&is_hidden=eq.false&active=eq.true&is_low_level=eq.false&deleted_at=is.null&duplicate_of=is.null&limit=1"
          UNKNOWN_AFTER="$(awk -F'/' 'tolower($1) ~ /^content-range:/ {gsub("\r", "", $2); print $2}' "$HEADERS" | tail -1)"
          test "$UNKNOWN_AFTER" -eq $((UNKNOWN_BEFORE - SELECTED)) || { echo "guarded unknown backlog did not decrease by exactly selected count: before=$UNKNOWN_BEFORE selected=$SELECTED after=$UNKNOWN_AFTER" >&2; exit 1; }

          SEARCH_HEADERS="$RUNNER_TEMP/searchable-after.headers"
          curl --silent --show-error --fail \
            --dump-header "$SEARCH_HEADERS" --output /dev/null \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --header 'Prefer: count=exact' \
            "${SUPABASE_URL}/rest/v1/locations?select=id&is_searchable=eq.true&deleted_at=is.null&limit=1"
          SEARCHABLE_AFTER="$(awk -F'/' 'tolower($1) ~ /^content-range:/ {gsub("\r", "", $2); print $2}' "$SEARCH_HEADERS" | tail -1)"
          test "$SEARCHABLE_AFTER" -eq "$SEARCHABLE_BEFORE" || { echo 'SEARCHABLE_AFTER == SEARCHABLE_BEFORE assertion failed: classifier published inventory.' >&2; exit 1; }

          DUP_HEADERS="$RUNNER_TEMP/duplicate-writes.headers"
          curl --silent --show-error --fail \
            --dump-header "$DUP_HEADERS" --output /dev/null \
            --header "apikey: $SERVICE_ROLE" \
            --header "Authorization: Bearer $SERVICE_ROLE" \
            --header 'Prefer: count=exact' \
            "${SUPABASE_URL}/rest/v1/locations?select=id&duplicate_status=eq.duplicate&last_deduped_at=gte.${STARTED_AT}&limit=1"
          DUPLICATE_WRITES="$(awk -F'/' 'tolower($1) ~ /^content-range:/ {gsub("\r", "", $2); print $2}' "$DUP_HEADERS" | tail -1)"
          test "$DUPLICATE_WRITES" = 0 || { echo 'classifier drain observed a duplicate-status write.' >&2; exit 1; }

          echo "unknown_after=$UNKNOWN_AFTER" >> "$GITHUB_OUTPUT"
          echo "searchable_after=$SEARCHABLE_AFTER" >> "$GITHUB_OUTPUT"

      - name: Cleanup credential file
        if: always()
        env:
          KEY_FILE: ${{ steps.runtime.outputs.key_file }}
        run: rm -f "$KEY_FILE"

      - name: Summary
        if: always()
        run: |
          {
            echo '### AWS Location Intelligence dedupe drain'
            echo ''
            echo "- Batch cap: \`$BATCH_LIMIT\`"
            echo '- Execution: central AWS scheduler invoker → background SQS → private AWS background runtime'
            echo '- Activation: explicit workflow dispatch only; merge/push validates but does not classify'
            echo '- Google calls: 0'
            echo '- Destructive merges: 0'
            echo '- Classifier never publishes locations'
            echo "- Guarded unknown before: \`${{ steps.before.outputs.unknown_before || 'unknown' }}\`"
            echo "- Selected: \`${{ steps.outcome.outputs.selected || '0' }}\`"
            echo "- Auto-unique: \`${{ steps.outcome.outputs.auto_unique || '0' }}\`"
            echo "- Review dispositions: \`${{ steps.outcome.outputs.review_dispositioned || '0' }}\`"
            echo "- Prior-decision conflicts quarantined: \`${{ steps.outcome.outputs.prior_conflicts || '0' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
