name: Oregon DR failback BYPASSRLS fix once

on:
  push:
    branches:
      - fix/oregon-dr-failback-bypassrls
    paths:
      - '.github/workflows/oregon-dr-failback-bypassrls-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add and validate routine grants
        run: |
          set -euo pipefail
          python3 scripts/dr/patch-failback-routine-grants-once.py
          bash -n scripts/dr/oregon-failback.sh
          grep -F 'run_as_owner=true' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'password null' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'grant execute on all functions in schema public, fraud_internal, private' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'schema_usage_gaps==0' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'routine_execute_gaps==0' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'temporary_set_grants==0' scripts/dr/oregon-failback.sh >/dev/null
      - name: Commit updated validated blobs
        run: |
          set -euo pipefail
          git config user.name 'roseoutllc'
          git config user.email 'nick@roseout.com'
          git add scripts/dr/oregon-failback.sh scripts/dr/oregon-dr-failback.generated.yml
          git commit -m 'Stage routine-safe Oregon failback blobs'
          git push origin "HEAD:${GITHUB_REF_NAME}"
