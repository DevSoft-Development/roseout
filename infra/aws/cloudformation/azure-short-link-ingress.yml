AWSTemplateFormatVersion: '2010-09-09'
Description: TheOutHaven branded short-link apex ingress forwarding unchanged paths to Azure Front Door.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  DomainName:
    Type: String
    Default: outhvn.com
  HostedZoneId:
    Type: String
  FrontDoorHost:
    Type: String

Resources:
  ShortLinkCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - { Key: Project, Value: TheOutHaven }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Service, Value: ShortLinkIngress }

  ShortLinkOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub toh-${Environment}-short-link-origin-request
        Comment: Forward short-link request context to Azure without forwarding the viewer Host header.
        CookiesConfig:
          CookieBehavior: all
        QueryStringsConfig:
          QueryStringBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Referer
            - User-Agent
            - Accept-Language

  ShortLinkDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub TheOutHaven ${Environment} short-link ingress to Azure Front Door
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: azure-frontdoor
            DomainName: !Ref FrontDoorHost
            CustomHeaders:
              - HeaderName: x-theouthaven-original-host
                HeaderValue: !Ref DomainName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: azure-frontdoor
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: !Ref ShortLinkOriginRequestPolicy
        ViewerCertificate:
          AcmCertificateArn: !Ref ShortLinkCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - { Key: Project, Value: TheOutHaven }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Service, Value: ShortLinkIngress }

  ShortLinkARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ShortLinkDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ShortLinkAaaaRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt ShortLinkDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  DistributionId:
    Value: !Ref ShortLinkDistribution
  DistributionDomainName:
    Value: !GetAtt ShortLinkDistribution.DomainName
  CertificateArn:
    Value: !Ref ShortLinkCertificate
