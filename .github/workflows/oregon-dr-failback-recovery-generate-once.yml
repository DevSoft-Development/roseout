name: Oregon DR failback recovery generator once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oregon-dr-failback-recovery-generate-once.yml'
      - 'scripts/dr/patch-failback-recovery-once.py'
  push:
    branches:
      - fix/oregon-dr-failback-recovery-once
    paths:
      - '.github/workflows/oregon-dr-failback-recovery-generate-once.yml'
      - 'scripts/dr/patch-failback-recovery-once.py'

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Generate and validate guarded recovery files
        run: |
          set -euo pipefail
          python3 scripts/dr/patch-failback-recovery-once.py
          bash -n scripts/dr/oregon-failback.sh
          grep -F 'RECOVER_FAILBACK_VIRGINIA' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'FAIL_CLOSED_RECOVERY' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'database_fences==1' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'fail_closed_recovery:' .github/workflows/oregon-dr-failback.yml >/dev/null
          grep -F 'reverse-detach-owner-contract.json' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'oregon-dr-failback.yml' .github/workflows/oregon-dr-failback-recovery-once.yml >/dev/null
          grep -F 'oregon-dr-readiness.yml' .github/workflows/oregon-dr-failback-recovery-once.yml >/dev/null
          jq -e '.approved==true and .required_start_state=="fail_closed_reverse_ready" and .expected_final_primary=="virginia"' .github/drills/oregon-failback-recovery-2026-09-01.json >/dev/null
          git diff --check
      - name: Upload exact validated recovery files
        uses: actions/upload-artifact@v4
        with:
          name: oregon-dr-failback-recovery-files
          if-no-files-found: error
          retention-days: 1
          path: |
            scripts/dr/oregon-failback.sh
            .github/workflows/oregon-dr-failback.yml
            .github/workflows/oregon-dr-failback-recovery-once.yml
            .github/drills/oregon-failback-recovery-2026-09-01.json
      - name: Materialize validated recovery files on PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/dr/oregon-failback.sh .github/workflows/oregon-dr-failback.yml .github/workflows/oregon-dr-failback-recovery-once.yml .github/drills/oregon-failback-recovery-2026-09-01.json
          git rm .github/workflows/oregon-dr-failback-recovery-generate-once.yml scripts/dr/patch-failback-recovery-once.py
          git diff --cached --check
          git commit -m 'ci(dr): materialize guarded failback recovery'
          git push origin HEAD:"$HEAD_REF"
