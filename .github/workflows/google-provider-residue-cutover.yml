name: Google provider residue cutover

on:
  push:
    branches:
      - feat/google-provider-boundary-cutover
    paths:
      - '.github/workflows/google-provider-residue-cutover.yml'

permissions:
  contents: write

jobs:
  restore-fixed-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-provider-boundary-cutover
          fetch-depth: 0

      - name: Restore original patch with literal-safe substitutions
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          original = subprocess.check_output([
            "git", "show",
            "85d305e05d4df9bb6b024595f0ab7942425f952e:.github/workflows/google-provider-residue-cutover.yml",
          ], text=True)
          old = "out, count = re.subn(pattern, repl, value, count=1, flags=re.S)"
          new = "out, count = re.subn(pattern, lambda _: repl, value, count=1, flags=re.S)"
          if original.count(old) != 1:
            raise SystemExit("original substitution helper changed unexpectedly")
          fixed = original.replace(old, new)
          Path(".github/workflows/google-provider-residue-cutover.yml").write_text(fixed)
          Path(".google-cutover-diagnostic.txt").unlink(missing_ok=True)

      - name: Commit fixed patch workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Google provider cutover patch substitutions"
          git push origin HEAD:feat/google-provider-boundary-cutover
