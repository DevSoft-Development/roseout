name: Debug enterprise search

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture enterprise test output
        id: test
        shell: bash
        run: |
          set +e
          npm run test:enterprise-search > enterprise-search.log 2>&1
          rc=$?
          cat enterprise-search.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-search-debug
          path: enterprise-search.log
          retention-days: 1
      - name: Preserve failure status
        shell: bash
        run: test "${{ steps.test.outputs.exit_code }}" = "0"
