name: Oregon DR failback BYPASSRLS fix once

on:
  push:
    branches:
      - fix/oregon-dr-failback-bypassrls
    paths:
      - '.github/workflows/oregon-dr-failback-bypassrls-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate validated failback fix
        run: |
          set -euo pipefail
          python3 scripts/dr/patch-failback-bypassrls-once.py
          bash -n scripts/dr/oregon-failback.sh
          grep -F 'run_as_owner=true' scripts/dr/oregon-failback.sh >/dev/null
          ! grep -F 'owner to postgres' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'password null' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'set role ${FAILBACK_SUBSCRIBER_ROLE}' scripts/dr/oregon-failback.sh >/dev/null
          grep -F 'temporary_set_grants==0' scripts/dr/oregon-failback.sh >/dev/null
      - name: Upload validated blobs to Git data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_blob() {
            local path="$1" payload sha
            payload="$(jq -n --arg content "$(base64 -w0 < "$path")" '{content:$content,encoding:"base64"}')"
            sha="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -d "$payload" | jq -r '.sha')"
            test -n "$sha" -a "$sha" != null
            printf '%s=%s\n' "$2" "$sha"
          }
          upload_blob scripts/dr/oregon-failback.sh SCRIPT_BLOB
          upload_blob .github/workflows/oregon-dr-failback.yml WORKFLOW_BLOB
