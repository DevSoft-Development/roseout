# Isolated Azure DevOps connector checks. No deployments or secrets.
trigger: none
pr: none
pool:
  vmImage: ubuntu-24.04
steps:
  - checkout: self
    fetchDepth: 1
  - task: UseNode@1
    inputs:
      version: '22.x'
  - bash: |
      set -euo pipefail
      node --check tools/azure-devops-mcp/aws/handler.mjs
      node --test tools/azure-devops-mcp/aws/handler.test.mjs
    displayName: Check connector and run offline security tests
  - bash: |
      set -euo pipefail
      bash tools/azure-devops-mcp/aws/build-package.sh "$(Build.ArtifactStagingDirectory)/mcp"
      unzip -l "$(Build.ArtifactStagingDirectory)/mcp/lambda.zip" | grep -F handler.mjs
    displayName: Package read-only connector
  - publish: $(Build.ArtifactStagingDirectory)/mcp
    artifact: azure-devops-mcp-package
    displayName: Publish reviewed build candidate
