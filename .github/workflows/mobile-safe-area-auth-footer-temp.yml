name: Mobile safe area and auth footer temp

on:
  push:
    branches:
      - fix/mobile-safe-area-auth-footer-2026-09-17
    paths:
      - .github/workflows/mobile-safe-area-auth-footer-temp.yml

permissions:
  contents: write

jobs:
  patch-mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-safe-area-auth-footer-2026-09-17

      - name: Patch mobile layout files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('mobile/app/(tabs)/profile.tsx')
          text = profile.read_text()
          text = text.replace(
              'import { Alert, Linking, Pressable, ScrollView, StyleSheet, View } from "react-native";\n',
              'import { Alert, Linking, Pressable, ScrollView, StyleSheet, View } from "react-native";\nimport { SafeAreaView } from "react-native-safe-area-context";\n',
          )
          old = '''  return (\n    <ScrollView style={[styles.page, { backgroundColor: theme.colors.background }]} contentContainerStyle={[styles.content, { paddingHorizontal: theme.spacing.lg }]} showsVerticalScrollIndicator={false}>\n      <BrandHeader compact />'''
          new = '''  return (\n    <SafeAreaView edges={["top"]} style={[styles.page, { backgroundColor: theme.colors.background }]}>\n      <ScrollView contentContainerStyle={[styles.content, { paddingHorizontal: theme.spacing.lg }]} showsVerticalScrollIndicator={false}>\n      <BrandHeader compact />'''
          if old not in text:
              raise SystemExit('profile opening layout anchor not found')
          text = text.replace(old, new, 1)
          old = '''      <AppText variant="caption" muted style={styles.footer}>TheOutHaven · Plan better OUTings.</AppText>\n    </ScrollView>\n  );'''
          new = '''      <AppText variant="caption" muted style={styles.footer}>TheOutHaven · Plan better OUTings.</AppText>\n      </ScrollView>\n    </SafeAreaView>\n  );'''
          if old not in text:
              raise SystemExit('profile closing layout anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('content: { paddingTop: 18, paddingBottom: 118, gap: 20 }', 'content: { paddingTop: 10, paddingBottom: 118, gap: 20 }', 1)
          profile.write_text(text)

          auth = Path('mobile/app/auth/index.tsx')
          text = auth.read_text()
          old = 'contentContainerStyle={[styles.content, { paddingTop: Math.max(insets.top + 12, 28) }]}'
          new = 'contentContainerStyle={[styles.content, { paddingTop: Math.max(insets.top + 12, 28), paddingBottom: Math.max(insets.bottom + 32, 56) }]}'
          if old not in text:
              raise SystemExit('auth safe area anchor not found')
          text = text.replace(old, new, 1)
          old = '''          <Button variant="ghost" onPress={() => router.replace("/(tabs)/profile")}>Continue as guest</Button>\n        </View>\n      </ScrollView>'''
          new = '''          <Button variant="ghost" onPress={() => router.replace("/(tabs)/profile")}>Continue as guest</Button>\n        </View>\n\n        <View style={styles.footer}>\n          <AppText variant="caption" muted>TheOutHaven · Plan better OUTings.</AppText>\n          <View style={styles.footerLinks}>\n            <Pressable onPress={() => Linking.openURL(`${mobileConfig.siteUrl}/support`)}><AppText variant="caption" muted>Support</AppText></Pressable>\n            <AppText variant="caption" muted>·</AppText>\n            <Pressable onPress={() => Linking.openURL(`${mobileConfig.siteUrl}/privacy`)}><AppText variant="caption" muted>Privacy</AppText></Pressable>\n            <AppText variant="caption" muted>·</AppText>\n            <Pressable onPress={() => Linking.openURL(`${mobileConfig.siteUrl}/terms`)}><AppText variant="caption" muted>Terms</AppText></Pressable>\n          </View>\n        </View>\n      </ScrollView>'''
          if old not in text:
              raise SystemExit('auth footer anchor not found')
          text = text.replace(old, new, 1)
          old = '  page: { flex: 1 }, content: { paddingHorizontal: 22, paddingBottom: 56, gap: 20 }, hero: { gap: 8, marginTop: 4 }, body: { lineHeight: 22 },'
          new = '  page: { flex: 1 }, content: { paddingHorizontal: 22, gap: 20 }, hero: { gap: 8, marginTop: 4 }, body: { lineHeight: 22 },'
          if old not in text:
              raise SystemExit('auth content style anchor not found')
          text = text.replace(old, new, 1)
          old = '  modalBackdrop: { flex: 1, backgroundColor: "rgba(0,0,0,0.72)", justifyContent: "flex-end", padding: 14 }, monthSheet: { maxHeight: "72%", borderWidth: 1, borderRadius: 26, paddingHorizontal: 18, paddingTop: 18, paddingBottom: 22 }, monthSheetHeader: { flexDirection: "row", alignItems: "center", justifyContent: "space-between", paddingBottom: 10 }, monthList: { flexGrow: 0 }, monthRow: { minHeight: 50, borderBottomWidth: StyleSheet.hairlineWidth, flexDirection: "row", alignItems: "center", justifyContent: "space-between" },\n});'
          new = '  footer: { alignItems: "center", gap: 8, paddingTop: 6 }, footerLinks: { flexDirection: "row", alignItems: "center", gap: 9 },\n  modalBackdrop: { flex: 1, backgroundColor: "rgba(0,0,0,0.72)", justifyContent: "flex-end", padding: 14 }, monthSheet: { maxHeight: "72%", borderWidth: 1, borderRadius: 26, paddingHorizontal: 18, paddingTop: 18, paddingBottom: 22 }, monthSheetHeader: { flexDirection: "row", alignItems: "center", justifyContent: "space-between", paddingBottom: 10 }, monthList: { flexGrow: 0 }, monthRow: { minHeight: 50, borderBottomWidth: StyleSheet.hairlineWidth, flexDirection: "row", alignItems: "center", justifyContent: "space-between" },\n});'
          if old not in text:
              raise SystemExit('auth footer style anchor not found')
          text = text.replace(old, new, 1)
          auth.write_text(text)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'mobile/app/(tabs)/profile.tsx' mobile/app/auth/index.tsx
          git commit -m "Fix mobile safe area and auth footer"
          git push origin HEAD:fix/mobile-safe-area-auth-footer-2026-09-17
