name: Stamps post-purchase hardening

on:
  push:
    branches:
      - fix/stamps-aws-production-print-gate
    paths:
      - scripts/dev/harden_stamps_post_purchase_window.py
      - .github/workflows/stamps-post-purchase-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stamps-aws-production-print-gate
      - name: Apply deterministic hardening
        run: python scripts/dev/harden_stamps_post_purchase_window.py
      - name: Validate focused boundaries
        run: |
          set -euo pipefail
          python -m py_compile infra/aws/lambda/platform_integration_api.py
          python scripts/dev/verify_stamps_aws_boundary.py
          grep -q 'Timeout: 80' infra/aws/cloudformation/integration-api.yml
          grep -q 'maxDuration = 120' 'app/api/admin/mailing-batches/[id]/postage/production-proof/route.ts'
          git diff --check
      - name: Remove temporary hardener
        run: |
          rm -rf infra/aws/lambda/__pycache__
          rm -f scripts/dev/harden_stamps_post_purchase_window.py
      - name: Commit hardened production boundary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/stamps-post-purchase-hardening.yml'
          git diff --cached --check
          git commit -m 'Harden Stamps post-purchase transaction response'
          git push origin HEAD:fix/stamps-aws-production-print-gate
